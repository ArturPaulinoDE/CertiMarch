tage{flex:1;min-height:140px}\n\u003c/style>\n\u003cstyle>\nhtml{scroll-padding-top:165px}.head .search{min-width:0}#algoFamily,#algoMode{width:100%;margin:5px 0}.study-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:.65rem 0}.alternatives{font-size:.92em}.algobtn{text-align:left}.detailgrid>div{min-width:0}.guided-case pre{overflow:auto;max-width:100%;white-space:pre;background:var(--panel2);padding:12px;border-radius:9px;color:var(--ink)}#deep>.card+.card{margin-top:14px}.mindmap .hub{min-height:150px}.mindmap .hub h3{margin:.25rem 0}.mindmap .hub .eyebrow{color:#9dc5ff}.study-btn:focus-visible,.dt-node:focus-visible{outline:2px solid var(--blue)}\n@media(max-width:760px){html{scroll-padding-top:220px}.detailgrid{grid-template-columns:1fr}.tablewrap{overflow:auto}.sidebar{max-height:240px}}\n@media print{body.print-all main>.view{display:none!important}.print-library .study-toolbar{display:none}.print-library{overflow:visible}} \n\u003c/style>\n\u003c/head>\u003cbody>\u003cheader>\n \u003cdiv class=\"head\">\n  \u003cdiv class=\"top\">\n   \u003cdiv class=\"brand\">\u003cdiv class=\"logo\" id=\"domainLogo\">\u003c/div>\u003cdiv>\u003ch1 id=\"domainTitle\">\u003c/h1>\u003cp id=\"domainSummary\">\u003c/p>\u003c/div>\u003c/div>\n   \u003cdiv class=\"tools\">\u003cbutton class=\"toolbtn\" id=\"themeBtn\">☾ Tema\u003c/button>\u003cbutton class=\"toolbtn\" id=\"printCurrent\">Imprimir seção atual\u003c/button>\u003cbutton class=\"toolbtn primary\" id=\"printAll\">Imprimir guia completo\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"searchrow\">\u003cdiv class=\"search\">\u003cspan class=\"glass\">⌕\u003c/span>\u003cinput id=\"globalSearch\" type=\"search\" placeholder=\"Buscar habilidade, recurso, parâmetro ou pegadinha…\" aria-label=\"Buscar na teoria\">\u003c/div>\u003cdiv class=\"searchhint\">\u003cspan class=\"kbd\">←\u003c/span> \u003cspan class=\"kbd\">→\u003c/span> navegam nas fichas\u003c/div>\u003c/div>\n  \u003cnav class=\"tabs\" id=\"tabs\">\n   \u003cbutton class=\"tab active\" data-view=\"overview\">Visão geral &amp; Mapa Mental\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"choices\">Abordagens &amp; Critérios de Decisão\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"deep\">Guias Técnicos &amp; Referência\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"decision\">Árvore de decisão\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"algorithmView\" id=\"libraryTab\">Biblioteca de Habilidades\u003c/button>\n  \u003c/nav>\n \u003c/div>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"view active\" id=\"overview\">\u003c/section>\n\u003csection class=\"view\" id=\"choices\">\u003c/section>\n\u003csection class=\"view\" id=\"deep\">\u003c/section>\n\u003csection class=\"view\" id=\"decision\">\n \u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">Árvore de decisão interativa\u003c/div>\u003ch2>Escolha pelo requisito do cenário\u003c/h2>\u003cp>Abra a ficha na folha verde. Use as duas orientações e localize um ramo para ler as respostas.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"decision-toolbar\" id=\"treeOptions\">\u003c/div>\n \u003cp class=\"callout info\" id=\"treeNote\">\u003c/p>\n \u003cdiv class=\"diagram-frame\" id=\"diagramFrame\">\u003c/div>\n \u003cdiv class=\"card\" style=\"margin-top:12px\">\u003ch3>Matriz de cobertura da árvore mestra\u003c/h3>\u003cdiv class=\"tablewrap\" id=\"decisionCoverage\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"view\" id=\"algorithmView\">\n \u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">Biblioteca completa\u003c/div>\u003ch2 id=\"libraryTitle\">\u003c/h2>\u003cp>Fundamento, critérios de escolha, parâmetros, casos resolvidos e documentação por habilidade.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"cataloglayout\">\n  \u003caside class=\"card sidebar\">\u003ch3>Filtrar a biblioteca\u003c/h3>\u003cselect class=\"select\" id=\"algoFamily\" aria-label=\"Filtrar pela tarefa\">\u003c/select>\u003cselect class=\"select\" id=\"algoMode\" aria-label=\"Filtrar tipo de ficha\">\u003coption value=\"\">Todas as categorias\u003c/option>\u003coption value=\"skill\">Habilidades\u003c/option>\u003coption value=\"card\">Fichas de serviços\u003c/option>\u003c/select>\u003cdiv class=\"algolist\" id=\"algoList\">\u003c/div>\u003c/aside>\n  \u003cdiv class=\"algodetail\" id=\"algoDetail\">\u003c/div>\n \u003c/div>\n\u003c/section>\n\u003cdiv class=\"print-library\" id=\"printLibrary\">\u003c/div>\n\u003cdiv class=\"foot\" id=\"theoryFooter\">\u003c/div>\n\u003c/main>\n\u003cscript>const m=parent.portalModel;\nconst selected=Number(window.frameElement.dataset.domain);\nconst domain=m.domains[selected-1];\nconst domainSkills=m.skills.filter(s=>s.domain===selected);\nconst domainCards=m.cards.filter(s=>s.domain===selected);\nconst ALGOS=[...domainSkills,...domainCards];\nconst TREES=m.trees.filter(t=>t.domain===selected);\nconst ATOMIC_TREES=Object.fromEntries(TREES.map(t=>[t.id,t.root]));\nconst DB=m.key==='pro', term=m.domainLabel;\nconst $=(sel,p=document)=>p.querySelector(sel), $$=(sel,p=document)=>[...p.querySelectorAll(sel)];\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst norm=s=>String(s??'').normalize('NFD').replace(/\\p{Diacritic}/gu,'').toLowerCase();\nconst isCard=a=>a.id.startsWith('c');\nconst skillLabel=a=>isCard(a)?'Ficha técnica':a.code+' · Habilidade';\nconst taskLabel=t=>t+' · '+m.tasks[t];\nconst showCore=p=>parent.portalOpenCore(p);\nconst chapter=key=>parent.portalInput.chapters?.find(c=>c.code===key);\nlet activeView='overview',activeAlgo=ALGOS[0].id,activeList=ALGOS;\nlet searchTerm='';\nconst heading=(b,h,d)=>'\u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">'+esc(b)+'\u003c/div>\u003ch2>'+esc(h)+'\u003c/h2>\u003cp>'+esc(d)+'\u003c/p>\u003c/div>\u003c/div>';\nconst action=(label,data,id,cls='toolbtn')=>'\u003cbutton class=\"'+cls+'\" data-'+data+'=\"'+esc(id)+'\" type=\"button\">'+esc(label)+'\u003c/button>';\nconst paragraphs=items=>items.map(x=>'\u003cp>'+esc(x)+'\u003c/p>').join('');\nconst refs=entries=>'\u003cdiv class=\"doclinks\">'+entries.map(([label,url])=>'\u003ca href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(label)+' ↗\u003c/a>').join('')+'\u003c/div>';\nfunction table(head,rows){\n return '\u003cdiv class=\"tablewrap\">\u003ctable class=\"paramtable\">\u003cthead>\u003ctr>'+head.map(x=>'\u003cth scope=\"col\">'+esc(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(r=>'\u003ctr>'+r.map(v=>'\u003ctd>'+esc(v)+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\nfunction showView(id){\n if(activeView==='decision'&&id!=='decision'){\n  $('#diagramFrame').classList.remove('dt-large');\n }\n activeView=id;\n $$('.view').forEach(v=>v.classList.toggle('active',v.id===id));\n $$('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.view===id);b.setAttribute('aria-pressed',String(b.dataset.view===id));});\n window.scrollTo({top:0,behavior:'instant'});\n if(id==='decision')requestAnimationFrame(()=>renderDecisionTree(activeTreeKey));\n}\nfunction cases(a,print){\n if(!a.scenarios.length)return '';\n return a.scenarios.map((s,i)=>'\u003csection class=\"guided-case\">\u003ch3>'+(i?'Variação do cenário':'Caso resolvido')+'\u003c/h3>\u003cp>'+esc(s.prompt)+'\u003c/p>\u003cdetails open>\u003csummary>Raciocínio e verificação\u003c/summary>\u003ch4>Decisão e execução\u003c/h4>\u003cp>\u003cb>'+esc(s.solution)+'\u003c/b>\u003c/p>\u003cp>'+esc(s.explanation)+'\u003c/p>\u003ch4>Como verificar\u003c/h4>\u003cp>'+esc(a.verify)+'\u003c/p>\u003cdiv class=\"alternatives\">\u003ch4>Raciocínio de cada alternativa\u003c/h4>\u003cul>'+s.options.map(([o,w])=>'\u003cli>\u003cb>'+esc(o)+'\u003c/b> '+esc(w)+'\u003c/li>').join('')+'\u003c/ul>\u003c/div>'+(!print?action('Resolver na prática ↗','core','pratica/item/'+s.id):'')+'\u003c/details>\u003c/section>').join('');\n}\nfunction detailBox(title,text){return '\u003cdiv class=\"detailcard\">\u003ch3>'+esc(title)+'\u003c/h3>\u003cp>'+esc(text)+'\u003c/p>\u003c/div>';}\nfunction skillCard(a,print=false){\n const done=parent.portalSnapshot.marked[a.id];\n const related=a.detail.map(id=>ALGOS.find(c=>c.id===id)).filter(Boolean);\n const docs=a.docs.length?a.docs:[m.sources[0]];\n const labs=m.labs.filter(x=>x.skills.includes(a.id));\n return '\u003cdiv class=\"card '+(print?'print-algo':'')+'\">\u003cdiv class=\"algotitle\">\u003cdiv>\u003cdiv class=\"eyebrow\">'+esc(taskLabel(a.task))+'\u003c/div>\u003ch2>'+esc((isCard(a)?'':a.code+' · ')+a.title)+'\u003c/h2>\u003c/div>\u003cspan class=\"badge\">'+esc(skillLabel(a))+'\u003c/span>\u003c/div>'+\n '\u003cdiv class=\"callout good\">\u003cb>Como pensar nele\u003c/b> '+esc(a.concept)+'\u003c/div>'+\n (!print?'\u003cdiv class=\"study-toolbar\">'+(!isCard(a)?action(done?'✓ Estudada':'Marcar como estudada','mark',a.id,'study-btn'): '')+(a.notes?action('Abrir aprofundamento ↗','guide',a.notes,'study-btn'):'')+labs.map(x=>action(x.title,'lab',x.id,'study-btn')).join('')+action('Anotações pessoais ↗','core',a.legacy,'study-btn')+'\u003c/div>':'')+\n cases(a,print)+'\u003cdiv class=\"detailgrid\">'+ detailBox('🎯 Quando escolher',a.use)+detailBox('📥 Arquitetura, dados e contratos',a.control)+detailBox('🧪 Validação e operação',a.verify||a.example)+\n '\u003cdiv class=\"detailcard\">\u003ch3>⚖️ Compensações e limitações\u003c/h3>\u003cp>'+esc(a.avoid)+'\u003c/p>\u003cdiv class=\"callout warn\">\u003cb>Pegadinha de prova\u003c/b>\u003cp>'+esc(a.pitfall)+'\u003c/p>\u003c/div>\u003c/div>\u003c/div>'+\n (a.codeSample?'\u003csection class=\"guided-case\">\u003ch3>'+esc(a.codeTitle||'Exemplo de implementação')+'\u003c/h3>\u003cpre>\u003ccode>'+esc(a.codeSample)+'\u003c/code>\u003c/pre>\u003c/section>':'')+\n (a.params.length?'\u003ch3>Configurações, métricas e recursos essenciais\u003c/h3>'+table(['Parâmetro ou recurso','O que controla','Como interpretar na prova'],a.params):'')+\n (!print&&related.length?'\u003csection class=\"guided-case\">\u003ch3>Fichas técnicas relacionadas\u003c/h3>\u003cdiv class=\"study-toolbar\">'+related.map(x=>action(x.title,'skill',x.id,'study-btn')).join('')+'\u003c/div>\u003c/section>':'')+\n (!a.codeSample&&a.example?'\u003csection class=\"guided-case\">\u003ch3>Exemplo aplicado\u003c/h3>\u003cp>'+esc(a.example)+'\u003c/p>\u003c/section>':'')+\n '\u003ch3>Documentação oficial\u003c/h3>'+refs(docs)+'\u003c/div>';\n}\nfunction showAlgo(id){\n const a=ALGOS.find(x=>x.id===id); if(!a)return;\n activeAlgo=id;\n $('#algoDetail').innerHTML=skillCard(a);\n $$('.algobtn').forEach(b=>{b.classList.toggle('active',b.dataset.skill===id);});\n}\nfunction drawList(){\n const f=$('#algoFamily').value, mode=$('#algoMode').value;\n activeList=ALGOS.filter(s=>(!f||s.task===f)&&(!mode||(mode==='card')===isCard(s))&&searchTerm.split(/\\s+/).every(k=>norm([s.title,s.code,s.concept,s.control,s.cue,s.pitfall,s.params.flat().join(' ')].join(' ')).includes(k)));\n $('#algoList').innerHTML=activeList.map(a=>action((parent.portalSnapshot.marked[a.id]?'✓ ':'')+(isCard(a)?'':a.code+' · ')+a.title,'skill',a.id,'algobtn '+(a.id===activeAlgo?'active':''))).join('')||'\u003cp class=\"small\">Nenhuma ficha atende à busca.\u003c/p>';\n}\nfunction openSkill(id){\n const a=ALGOS.find(v=>v.id===id);if(!a)return;\n const contains=activeList.some(v=>v.id===id);\n if(!contains){$('#algoFamily').value='';$('#algoMode').value='';$('#globalSearch').value='';searchTerm='';drawList();}\n showView('algorithmView');showAlgo(id);parent.portalRemember(selected,id);\n}\nfunction noteCard(n){\n const a=domainSkills.find(x=>x.id===n.skill);\n return '\u003carticle class=\"card\" id=\"guide-'+esc(n.id)+'\">'+heading('Guia técnico · '+a.code,n.title,a.title)+\n '\u003cdiv class=\"callout good\">\u003cb>Como funciona\u003c/b>'+paragraphs(n.mechanism)+'\u003c/div>\u003ch3>Critérios de escolha\u003c/h3>'+table(['Condição do cenário','Abordagem e decisão'],n.paths)+\n '\u003ch3>Parâmetros e sinais úteis\u003c/h3>'+table(['Recurso ou métrica','O que controla','Critério de verificação'],n.parameters)+\n '\u003cdiv class=\"detailgrid\">'+detailBox('Diagnóstico de ponta a ponta',n.trace.join(' '))+detailBox('Compensações',n['trade-off'].join(' '))+'\u003c/div>'+\n '\u003csection class=\"guided-case\">\u003ch3>Exercício e critério de aceitação\u003c/h3>'+paragraphs(n.lab)+'\u003c/section>'+\n '\u003cdiv class=\"study-toolbar\">'+action('Abrir ficha '+a.code,'skill',a.id,'study-btn')+m.labs.filter(l=>l.skills.includes(a.id)).map(x=>action(x.title,'lab',x.id,'study-btn')).join('')+'\u003c/div>'+refs(a.docs.length?a.docs:m.sources.slice(0,1))+'\u003c/article>';\n}\nfunction openGuide(id){\n showView('deep');\n requestAnimationFrame(()=>document.getElementById('guide-'+id)?.scrollIntoView({block:'start'}));\n}\nfunction drawOverview(){\n const groups=Object.keys(m.tasks).filter(t=>+t.split('.')[0]===selected);\n const items=groups.length===1?domainSkills.map(s=>[s.code,s.title,s.answer,s.id]):groups.map(t=>{\n  const sk=domainSkills.filter(s=>s.task===t);\n  return [t,m.tasks[t],sk[0].answer,sk[0].id];\n });\n const split=Math.ceil(items.length/2);\n const tile=([id,title,answer,key])=>'\u003cdiv class=\"card\">\u003ch3>'+esc(id+' · '+title)+'\u003c/h3>\u003cp>'+esc(answer)+'\u003c/p>'+action('Abrir ficha ↗','skill',key,'study-btn')+'\u003c/div>';\n const tree=action('Abrir árvore mestra','tree','master'+selected,'toolbtn primary');\n const scope=DB?'Seções do Exam Guide':'Tarefas do Exam Guide';\n $('#overview').innerHTML=heading(scope,domain.name,domain.topics)+\n '\u003cdiv class=\"mindmap\">\u003cdiv class=\"mindcol\">'+items.slice(0,split).map(tile).join('')+'\u003c/div>'+\n '\u003cdiv class=\"hub\">\u003cdiv class=\"eyebrow\">'+esc(term+' '+selected)+'\u003c/div>\u003ch3>'+esc(domain.name)+'\u003c/h3>\u003cp>'+domain.weight+'% do exame · '+domain.skills+' habilidades\u003c/p>'+tree+'\u003c/div>'+\n '\u003cdiv class=\"mindcol\">'+items.slice(split).map(tile).join('')+'\u003c/div>\u003c/div>';\n const choose=domainSkills.map(a=>'\u003ctr>\u003ctd>'+esc(a.cue)+'\u003c/td>\u003ctd>'+esc(a.answer)+'\u003c/td>\u003ctd>'+action(a.code,'skill',a.id,'study-btn')+'\u003c/td>\u003c/tr>').join('');\n $('#choices').innerHTML=heading('Desempate de prova','Abordagens e critérios de decisão','Parta do sinal no enunciado e confira a ficha de referência.')+\n '\u003cdiv class=\"tablewrap\">\u003ctable class=\"matrix\">\u003cthead>\u003ctr>\u003cth>Requisito do cenário\u003c/th>\u003cth>Decisão\u003c/th>\u003cth>Habilidade\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+choose+'\u003c/tbody>\u003c/table>\u003c/div>'+\n groups.map(key=>{const ch=chapter(key);return ch?'\u003csection class=\"guided-case\">\u003ch3>'+esc(ch.title)+'\u003c/h3>\u003cp>'+esc(ch.scenario)+'\u003c/p>\u003col>'+ch.steps.map(s=>'\u003cli>'+esc(s)+'\u003c/li>').join('')+'\u003c/ol>\u003cp>'+esc(ch.verify)+'\u003c/p>'+action('Abrir capítulo e exercício ↗','core','teoria/'+key,'study-btn')+'\u003c/section>':'';}).join('');\n $('#deep').innerHTML=heading('Referência temática','Guias técnicos do domínio','Comparações, configurações, diagnóstico e exercícios com verificação.')+m.notes[selected].map(noteCard).join('')+\n (domainCards.length?'\u003csection class=\"guided-case\">\u003ch3>Referência por serviço\u003c/h3>\u003cdiv class=\"study-toolbar\">'+domainCards.map(a=>action(a.title,'skill',a.id,'study-btn')).join('')+'\u003c/div>\u003c/section>':'');\n $('#decisionCoverage').innerHTML='\u003ctable class=\"matrix\">\u003cthead>\u003ctr>\u003cth>Objetivo\u003c/th>\u003cth>Critério\u003c/th>\u003cth>Ação\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+domainSkills.map(s=>'\u003ctr>\u003ctd>'+esc(s.code+' · '+s.title)+'\u003c/td>\u003ctd>'+esc(s.answer)+'\u003c/td>\u003ctd>'+action('Abrir ficha','skill',s.id,'study-btn')+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>';\n}\nfunction jumpTree(id){\n const tree=TREES.find(t=>t.id===id)||TREES[0];\n activeTreeKey=tree.id;$('#treeNote').textContent=tree.note||'Siga as condições até a resposta mais específica.';\n $$('.tree-tab').forEach(b=>{b.classList.toggle('active',b.dataset.tree===tree.id);b.setAttribute('aria-pressed',String(b.dataset.tree===tree.id));});\n showView('decision');\n}\n\n// Exact renderer of the MLA guide is inserted here by the builder.\nlet activeTreeKey='master'+selected;\nlet treeResizeObserver;\nlet stopTreeView=()=>{};\nconst orientationKey='study-mla-tree.'+m.key;\nlet orientation='horizontal';\ntry { if(localStorage.getItem(orientationKey)==='vertical')orientation='vertical'; } catch {}\nwindow.addEventListener('storage',event=>{\n  if(event.key!==orientationKey)return;\n  orientation=event.newValue==='vertical'?'vertical':'horizontal';\n  if(activeView==='decision')renderDecisionTree(activeTreeKey);\n});\nfunction layoutDecisionGraph(root,measure,direction){\n const vertical=direction==='vertical';\n const boxes=[],links=[];\n function wrap(value,width){\n   const lines=[];let line='';\n   for(const word of value.split(/\\s+/)){\n     const next=line?line+' '+word:word;\n     if(line&&measure(next)>width){lines.push(line);line=word;}else line=next;\n   }\n   if(line)lines.push(line);\n   return lines;\n }\n function make(node,depth,kind,label){\n   const lines=wrap(label,206);\n   const w=Math.max(128,...lines.map(line=>measure(line)+30));\n   const b={kind,label,lines,w,h:Math.max(42,lines.length*19+22),depth,id:node.id,children:[]};\n   boxes.push(b);\n   if(kind==='question'){\n     for(const branch of node.branches){\n       const condition=make({},depth+1,'condition',branch.when);\n       const next=make(branch.child,depth+2,branch.child.branches?'question':'answer',branch.child.question||branch.child.answer);\n       b.children.push(condition);condition.children.push(next);\n       links.push([b,condition],[condition,n const PORTAL_MODULE_INDEX=[{"title":"Valor da nuvem AWS","text":"Objetivos 1.1.1, 1.1.2 Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência. ['Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair. Que benefício está em uso?', 'Elasticidade'] ['O negócio aceita perder no máximo 15 minutos de dados. Qual objetivo foi descrito?', 'RPO']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.1"},{"title":"Princípios de design e Well-Architected","text":"Objetivos 1.2.1, 1.2.2, 1.2.3 Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica. ['O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação. Qual pilar domina?', 'Excelência operacional'] ['Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar. Qual serviço mantém o trabalho pendente?', 'Amazon SQS'] ['Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido. Qual pilar?', 'Segurança']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.2"},{"title":"Adoção e migração","text":"Objetivos 1.3.1, 1.3.2 Questione se o aplicativo será movido, adaptado, refeito ou substituído. Retain mantém um ativo no local; retire desativa; relocate transfere plataformas compatíveis sem alterar suas cargas individualmente. ['Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho. Qual estratégia?', 'Rehost'] ['O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa. Qual referência usar?', 'AWS Cloud Adoption Framework']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.3"},{"title":"Economia da nuvem","text":"Objetivos 1.4.1, 1.4.2 Compare custo de hardware, espaço, energia, licenças, rede, operação, indisponibilidade e crescimento. A nuvem pode reduzir sobreprovisionamento, mas custos como transferência, redundância e compromissos permanecem no cálculo. ['Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização. Qual mudança econômica?', 'Troca de investimento antecipado por despesa variável'] ['Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico. Qual medida investigar primeiro?', 'Rightsizing']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.4"},{"title":"Responsabilidade compartilhada","text":"Objetivos 2.1.1, 2.1.2 Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa. ['Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?', 'Cliente no EC2'] ['Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?', 'Controle herdado']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.1"},{"title":"Segurança, governança e conformidade","text":"Objetivos 2.2.1, 2.2.2, 2.2.3 Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria. ['O jurídico precisa acessar um relatório de auditoria SOC da AWS. Onde buscar?', 'AWS Artifact'] ['O time quer alarme para aumento de erros HTTP no serviço. O que usar?', 'Amazon CloudWatch'] ['A organização quer gerenciar chaves usadas para criptografar objetos S3. Qual serviço?', 'AWS KMS']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.2"},{"title":"Identidade e controle de acesso","text":"Objetivos 2.3.1, 2.3.2 Distingua trust policy, que controla quem assume a role, de permission policy, que controla ações autorizadas após assumi-la. Princípio do menor privilégio inclui ações, recursos e condições. Para uma pessoa, prefira federação e sessões temporárias onde aplicável. ['Uma instância EC2 precisa ler objetos sem distribuir chaves permanentes para a aplicação. Qual escolha?', 'Role IAM com credenciais temporárias'] ['Colaboradores precisam de um portal central para acessar várias contas com perfis distintos. Qual serviço?', 'AWS IAM Identity Center']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.3"},{"title":"Serviços e recursos de segurança","text":"Objetivos 2.4.1, 2.4.2, 2.4.3 Escolha pela evidência: comportamento de ameaça, CVE, visão consolidada ou classificação de dados. Uma ferramenta pode gerar achados consumidos por outra. Investigue a causa e trate o recurso correspondente em vez de confundir centralização com geração do achado. ['A equipe quer detectar atividade de ameaça a partir de fontes como eventos e fluxos compatíveis. Qual serviço?', 'Amazon GuardDuty'] ['A equipe precisa bloquear padrões maliciosos em solicitações HTTP ao site. Qual serviço?', 'AWS WAF'] ['O controle precisa negar uma faixa no limite da sub-rede. Qual mecanismo?', 'Network ACL']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.4"},{"title":"Formas de implantação e operação","text":"Objetivos 3.1.1, 3.1.2 Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro. ['Um profissional precisa explorar recursos de uma conta por interface visual. Qual meio?', 'AWS Management Console'] ['A API opera na AWS e usa o banco da fábrica que permanece local. Qual modelo?', 'Híbrido']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.1"},{"title":"Infraestrutura global","text":"Objetivos 3.2.1 Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário. ['Uma lei determina um país para armazenar dados primários. Que nível geográfico selecionar?', 'Região AWS']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.2"},{"title":"Computação","text":"Objetivos 3.3.1, 3.3.2 Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda. ['Um software exige escolher SO e instalar um agente diretamente no sistema convidado. Qual escolha?', 'Amazon EC2'] ['Um grupo deve aumentar e diminuir a quantidade de EC2 com base em demanda. Qual componente?', 'EC2 Auto Scaling']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.3"},{"title":"Bancos de dados","text":"Objetivos 3.4.1, 3.4.2 Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção. ['A aplicação consulta carrinhos principalmente pelo identificador do cliente, com acesso previsível por chave. Qual serviço?', 'Amazon DynamoDB'] ['É necessário copiar tabelas e continuar capturando alterações enquanto a origem segue ativa. Qual serviço?', 'AWS Database Migration Service']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.4"},{"title":"Redes","text":"Objetivos 3.5.1, 3.5.2 Separe espaço de endereçamento, resolução de nomes, entrega em HTTP e caminho de transporte. O requisito por IP fixo ou por cache diferencia estratégias que parecem similares. ['A equipe precisa criar sub-redes públicas e privadas em uma rede isolada. Qual serviço?', 'Amazon VPC'] ['Uma filial precisa comunicação criptografada via túnel IPsec entre redes. Qual opção?', 'AWS Site-to-Site VPN']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.5"},{"title":"Armazenamento","text":"Objetivos 3.6.1, 3.6.2 Decida primeiro pela interface requerida: objeto, bloco, arquivo Linux compartilhado ou um sistema de arquivos específico. Só então avalie capacidade, latência, throughput e custo. ['O sistema grava imagens como objetos e as acessa por chave em um bucket. Qual serviço?', 'Amazon S3'] ['O padrão de acesso é imprevisível e a empresa quer ajuste automático por atividade observada. Qual classe?', 'S3 Intelligent-Tiering']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.6"},{"title":"IA, ML e análise","text":"Objetivos 3.7.1, 3.7.2 Identifique se a etapa consulta o lake, transforma e cataloga, serve consultas num warehouse ou apresenta a informação. Considere recorrência, fontes, custo por consulta e padrões de acesso. ['Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse. Qual ferramenta?', 'Amazon Athena'] ['A empresa quer extrair valores dos campos em formulários escaneados. Qual serviço?', 'Amazon Textract']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.7"},{"title":"Outros serviços no escopo","text":"Objetivos 3.8.1, 3.8.2, 3.8.3, 3.8.4 Se o problema é orquestração, verifique sequência, estado, erros e retry. Se é integração, verifique se precisa buffer, fan-out ou seleção por conteúdo. ['Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação. Qual serviço?', 'AWS Step Functions'] ['O operador precisa executar uma tarefa em uma frota configurada e gerenciada. Qual serviço?', 'AWS Systems Manager'] ['Um commit precisa disparar compilação e teste em ambiente gerenciado. Qual serviço executa essa etapa?', 'AWS CodeBuild'] ['Sensores precisam autenticar e publicar mensagens IoT. Qual oferta?', 'AWS IoT Core']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.8"},{"title":"Modelos de preços","text":"Objetivos 4.1.1, 4.1.2 Classifique previsibilidade, tolerância à interrupção, necessidade de flexibilidade e diferença entre desconto e reserva de capacidade. Capacidade On-Demand reservada segue regras e é distinta de um compromisso de preço. ['Um job distribuído retoma processamento e aceita interrupções por economia. Qual opção?', 'Spot Instances'] ['Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume. Qual ferramenta?', 'AWS Pricing Calculator']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.1"},{"title":"Cobrança, orçamento e gestão de custos","text":"Objetivos 4.2.1, 4.2.2 Escolha pela pergunta: investigar histórico, vigiar limite acordado, alimentar modelo analítico ou encontrar desvio inesperado. Considere atraso de processamento da cobrança na interpretação de alertas. ['O financeiro quer avisar se o custo previsto superar o limite mensal acordado. Qual serviço?', 'AWS Budgets'] ['A empresa quer pagar uma fatura agregada, mantendo contas distintas. Qual recurso?', 'Cobrança consolidada do AWS Organizations']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.2"},{"title":"Recursos técnicos e opções de suporte","text":"Objetivos 4.3.1, 4.3.2 Distinga incidente que requer suporte contratado, evento de serviço que já tem status, verificação de boas práticas e edição de um runbook com informação pública. Consulte a tabela de planos atual para nomes e SLA de primeira resposta. ['Uma empresa com cobertura quer abrir um caso de incidente de produção. Onde?', 'AWS Support Center'] ['O cliente precisa esclarecer cobrança, sem solicitar diagnóstico técnico de aplicação. Qual canal por finalidade?', 'Usar o suporte de conta e cobrança']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.3"},{"title":"Visão geral · Conceitos da nuvem","text":"Guia de conceitos: valor, falhas e adoção","t };

function writeRoute(route){
 const target='#'+route;
 if(location.hash!==target)history.pushState(null,'',target);
}
function routeKey(view,type,id){return view+(type?'/'+enc(type):'')+(id?'/'+enc(id):'');}
function parseHash(){
 const parts=location.hash.slice(1).split('/').map(x=>{try{return decodeURIComponent(x);}catch{return '';}});
 const [a,b,c]=parts;
 if(a==='estudo')return ['core',null,parts.slice(1).join('/')];
 if(a==='domain'&&/^\d+$/.test(b))return ['d'+b,parts[2],parts[3]];
 if(a==='pratica'||a==='simulado'||a==='resultado'||a==='progresso')return ['core',null,parts.join('/')];
 if(a==='teoria'||a==='objetivo'){

 ...m.trees.map(t=>({title:t.title,type:'Árvore de decisão',view:'d'+t.domain,sub:'tree',id:t.id,text:JSON.stringify(t.root)})),
 ...m.architectures.map(a=>({title:a.title,type:'Arquitetura',view:'architectures',sub:'case',id:a.id,text:JSON.stringify(a)})),
 ...m.labs.map(l=>({title:l.title,type:'Laboratório',view:'architectures',sub:'lab',id:l.id,text:l.goal})),
 ...glossary.map(([title,pt,definition,id])=>({title,type:'Glossário',text:[pt,definition].join(' '),view:'d'+id.split('.')[0],sub:'skill',id})),
 ...sourcesIndex
].map((o,i)=>({...o,i,search:norm(o.title+' '+o.text),titleNorm:norm(o.title)}));
const kinds=$('globalSearchKindFilter');
kinds.innerHTML='<option value="">Todos os tipos</option>'+[...new Set(index.map(i=>i.type))].map(t=>'<option>'+esc(t)+'</option>').join('');
const synonyms={
 'cdc':['captura de mudanças','change data capture'],'kms':['criptografia','envelope encryption'],
 'rag':['recuperação aumentada','retrieval augmented generation'],'skew':['distribuição desigual','partição dominante'],
 'mascara':['mask','mascaramento'],'rollback':['reversão','restauração'],'governanca':['unity catalog','lake formation'],
 'avaliacao':['evaluation','metrica']
};
function drawSearch(){
 const query=norm($('globalUnifiedInput').value).trim();
 const scope=kinds.value;
 const tokens=query.split(/\s+/).filter(Boolean);
 const candidates=index.filter(i=>(!scope||i.type===scope)&&(
  tokens.every(t=>i.search.includes(t))||
  synonyms[query]?.some(t=>i.search.includes(norm(t)))
 )).sort((a,b)=>tokens.reduce((n,t)=>n+Number(b.titleNorm.includes(t))-Number(a.titleNorm.includes(t)),0));
 $('globalSearchResults').innerHTML=(!query&&!scope?'<p class="search-empty">Busque um conceito, código, cenário ou parâmetro.</p>':
 candidates.slice(0,30).map(i=>'<button type="button" class="result-link" data-searchhit="'+i.i+'"><strong>'+esc(i.title)+'</strong><span class="pbadge teal">'+esc(i.type)+'</span></button>').join('')||'<p class="search-empty">Nenhum resultado para esta busca.</p>');
}
function openSearch(){
 $('searchModalBackdrop').classList.add('open');
 $('globalUnifiedInput').focus();drawSearch();
}
function closeSearch(){
 $('searchModalBackdrop').classList.remove('open');
 if(!compact)$('btnOpenSearch').focus();
}
window.portalOpenSearch=openSearch;
$('globalUnifiedInput').addEventListener('input',drawSearch);
$('globalUnifiedInput').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('globalSearchResults').querySelector('[data-searchhit]')?.click();
});
kinds.addEventListener('change',drawSearch);
$('btnOpenSearch').onclick=openSearch;
$('btnCloseSearchModal').onclick=closeSearch;
$('searchModalBackdrop').addEventListener('click',e=>{if(e.target.id==='searchModalBackdrop')closeSearch();});
$('btnToggleTheme').onclick=window.portalToggleTheme;
$('menuFold').onclick=()=>reading(!compact);
$('tab-theory').onclick=()=>dropdown(!$('theoryDropdown').classList.contains('open'));
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
 else if(e.key==='Escape'){if($('searchModalBackdrop').classList.contains('open'))closeSearch();dropdown(false);}
});
function markArchitecture(id,value){
 const a=m.architectures.find(x=>x.id===id);
 if(!a)return;
 const bridgeAPI=bridge.contentWindow?.studyBridge;
 if(bridgeAPI&&a.native)bridgeAPI.markCase(a.native,value);
 else {archDone[id]=value;safeSave('architectures',archDone);}
}
function resume(){if(last?.domain&&last.id)changeView('d'+last.domain,'skill',last.id);else changeView('d1');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!$('theoryDropdown').contains(e.target))dropdown(false);
 if(!b)return;
 const d=b.dataset;
 if(d.target){changeView(d.target);return;}
 if(b.id==='btnResumeLast'||Object.hasOwn(d,'resume')){resume();return;}
 if(d.searchhit){
  const hit=index[Number(d.searchhit)];closeSearch();
  if(hit)changeView(hit.view,hit.sub,hit.id);
 }
 if(d.jump)changeView(d.jump);
 if(d.core)openCore(d.core);
 if(d.sim){
  const path='simulado';
  const core=bridge.contentWindow?.studyBridge;
  if(core){core.start(d.sim);openCore(path);}
  else runFrame('core',()=>{bridge.contentWindow?.studyBridge?.start(d.sim);openCore(path);});
 }
 if(Object.hasOwn(d,'review')){
  openCore('pratica/banco');
  runFrame('core',f=>f.contentWindow.studyBridge?.review());
 }
 if(d.skill){
  const a=m.skills.find(s=>s.id===d.skill);
  if(a)changeView('d'+a.domain,'skill',a.id);
 }
 if(d.guide)changeView('d'+d.guide.split('.')[0],'guide',d.guide);
 if(d.archtab){
  const [view,id]=d.archtab.split('/');changeView('architectures',view,id);
 }
 if(d.markarch){
  const prev=m.architectures.find(a=>a.id===d.markarch);
  markArchitecture(d.markarch,!archRead(prev));drawCases();
 }
 if(Object.hasOwn(d,'markvisible')){
  for(const item of $('archCardsList').querySelectorAll('[data-markarch]'))markArchitecture(item.dataset.markarch,true);
  drawCases();toast('Arquiteturas da seleção marcadas.');
 }
 if(Object.hasOwn(d,'copy')){
  const sample=b.previousElementSibling;
  if(sample?.matches('pre')){
   if(!navigator.clipboard){selectSample(sample);}
   else navigator.clipboard.writeText(sample.innerText).then(()=>toast('Trecho copiado.'),()=>selectSample(sample));
  }
 }
 if(Object.hasOwn(d,'backup')){
  runFrame('core',f=>f.contentWindow.studyBridge?.exportProgress(archDone));
 }
});
function selectSample(el){
 const range=document.createRange();range.selectNodeContents(el);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);toast('Trecho selecionado. Pressione Ctrl+C.');
}
window.portalRestoreArchitectures=(custom)=>{
 if(m.key!=='pro'||!custom||typeof custom!=='object')return;
 for(const a of m.architectures)if(typeof custom[a.id]==='boolean'&&!Object.hasOwn(archDone,a.id))archDone[a.id]=custom[a.id];
 safeSave('architectures',archDone);
};
const syncHash=()=>changeView(...parseHash(),false);
window.addEventListener('hashchange',syncHash);
window.addEventListener('popstate',syncHash);
window.addEventListener('message',e=>{
 if(!frames.some(key=>$('frame-'+key).contentWindow===e.source))return;
 if(e.data?.type==='THEME_CHANGED')chooseTheme(e.data.theme);
});
if(compact)reading(true);
setTheme(theme);
window.trilhaTheme?.onChange(setTheme);
progressUI();
try{localStorage.getItem(key);}
catch{$('storageWarningBanner').style.display='block';}
syncHash();
runFrame('core',()=>updateReport());
</script></body></html>
