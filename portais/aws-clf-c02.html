ajustar o número de servidores em uso. Qual medida?\"],[\"Serviço gerenciado\",\"Transfere tarefas operacionais elegíveis ao provedor.\",\"A equipe quer reduzir esforço com patching do sistema operacional do banco e backups de rotina. Qual tipo de serviço considerar?\"]]}],\"cards\":[{\"h\":\"1.4.1 · CapEx, OpEx, economia de escala e TCO\",\"items\":[\"CapEx envolve investimento em ativos para uso ao longo do tempo. OpEx se relaciona a despesas operacionais. O consumo sob demanda permite substituir parte do investimento antecipado por custo variável. Economia de escala é a redução potencial do custo unitário pela escala do provedor; TCO inclui custos diretos e indiretos do ciclo de vida.\",\"Compare custo de hardware, espaço, energia, licenças, rede, operação, indisponibilidade e crescimento. A nuvem pode reduzir sobreprovisionamento, mas custos como transferência, redundância e compromissos permanecem no cálculo.\"],\"tone\":\"blue\"},{\"h\":\"1.4.2 · Dimensionamento, custos indiretos e ambiente sob demanda\",\"items\":[\"Rightsizing ajusta capacidade ao perfil medido. Auto Scaling altera a quantidade de recursos durante o uso. Encerrar ambientes que não precisam ficar ligados reduz consumo. Managed services deslocam tarefas de infraestrutura para o provedor e alteram o custo operacional da equipe.\",\"Separe capacidade ociosa persistente, variação ao longo do dia, ambiente sem uso temporário e esforço operacional. Compare após o ajuste no mesmo nível de serviço. Verifique quais recursos seguem cobrando depois de parar uma instância, como volumes e endereços elegíveis.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Compare duas opções com o mesmo volume, tendência de crescimento, prazo e SLA.\",\"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Preço por hora não equivale ao custo total. Compromissos ou compras antecipadas continuam existindo na nuvem.\",\"Parar uma instância não encerra automaticamente todos os recursos associados.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t2.1\",\"d\":2,\"k\":\"Responsabilidade compartilhada\",\"title\":\"Responsabilidade compartilhada\",\"sub\":\"Objetivos 2.1.1, 2.1.2\",\"desc\":\"Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa.\",\"quick\":[[\"Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?\",\"Cliente no EC2\"],[\"Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?\",\"Controle herdado\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Cliente no EC2\",\"Administra patches do SO convidado e do software instalado.\",\"Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?\"],[\"AWS na infraestrutura\",\"Protege instalações, hardware e componentes de virtualização.\",\"A auditoria pergunta quem limita a entrada no prédio que abriga os servidores AWS. Qual responsabilidade?\"],[\"AWS na camada gerenciada do RDS\",\"Opera o sistema subjacente do serviço gerenciado.\",\"Uma atualização do sistema operacional que sustenta o RDS faz parte de qual camada?\"],[\"Cliente sobre dados e acesso\",\"Determina políticas e permissões da organização, inclusive em serviço gerenciado.\",\"Em um banco RDS, quem decide a quais usuários dar acesso às tabelas?\"],[\"Controle herdado\",\"A organização se apoia no controle que a AWS aplica à infraestrutura física.\",\"Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?\"],[\"Controle compartilhado por camada\",\"O mesmo tipo de controle existe em níveis de responsabilidade distintos.\",\"Patch no hipervisor e patches no SO convidado ilustram qual arranjo?\"],[\"Controle específico do cliente\",\"O cliente projeta ou configura conforme seus próprios requisitos.\",\"A equipe desenha a política de segmentação de acesso aos dados da aplicação. Que tipo de controle?\"],[\"Evidência de conformidade do fornecedor\",\"Relatórios da AWS documentam escopo de controles do provedor.\",\"Um auditor quer evidência formal de uma auditoria independente sobre a AWS. O que se busca?\"]]}],\"cards\":[{\"h\":\"2.1.1 · Responsabilidade compartilhada em EC2, RDS e serviços gerenciados\",\"items\":[\"A AWS protege a infraestrutura da nuvem. O cliente protege o que configura e opera dentro dela. Em EC2, administra sistema operacional convidado, aplicações e controles de rede. Com RDS, a AWS gerencia componentes da infraestrutura e do sistema do serviço; acesso, configuração e dados continuam sob responsabilidade do cliente.\",\"Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa.\"],\"tone\":\"blue\"},{\"h\":\"2.1.2 · Controles herdados, compartilhados e específicos do cliente\",\"items\":[\"Controles herdados são cobertos pelo provedor, como infraestrutura física. Controles compartilhados se aplicam em camadas distintas, por exemplo AWS corrige infraestrutura e cliente corrige o que administra. A implantação lógica e as permissões de aplicação dependem de requisitos do cliente.\",\"Evite usar a palavra compartilhado como divisão indiferenciada. Identifique a evidência associada à camada questionada. Relatórios da AWS apoiam a avaliação do fornecedor; os controles do workload também precisam de evidência própria.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Liste as responsabilidades para hardware, SO convidado, motor de banco, credenciais e políticas de dados conforme a opção.\",\"Divida a revisão em evidências do provedor, controles gerenciados e decisões de configuração do cliente.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Gerenciado não significa que o provedor decide quem pode ler os dados.\",\"Uma certificação de conformidade da AWS não certifica automaticamente a configuração do cliente.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t2.2\",\"d\":2,\"k\":\"Segurança, governança e conformidade\",\"title\":\"Segurança, governança e conformidade\",\"sub\":\"Objetivos 2.2.1, 2.2.2, 2.2.3\",\"desc\":\"Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria.\",\"quick\":[[\"O jurídico precisa acessar um relatório de auditoria SOC da AWS. Onde buscar?\",\"AWS Artifact\"],[\"O time quer alarme para aumento de erros HTTP no serviço. O que usar?\",\"Amazon CloudWatch\"],[\"A organização quer gerenciar chaves usadas para criptografar objetos S3. Qual serviço?\",\"AWS KMS\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"AWS Artifact\",\"Obtém relatórios e acordos de conformidade da AWS.\",\"O jurídico precisa acessar um relatório de auditoria SOC da AWS. Onde buscar?\"],[\"AWS Audit Manager\",\"Estrutura avaliações e coleta evidências de controles.\",\"O responsável por controles quer dar estrutura à coleta contínua de evidências da própria avaliação. Que serviço?\"],[\"AWS Config\",\"Documenta configuração de recursos e avalia conformidade com regras.\",\"A questão é identificar quando um recurso passou a descumprir uma regra de configuração. Qual serviço?\"],[\"AWS CloudTrail\",\"Registra quem fez chamadas às APIs e quando, conforme os eventos configurados.\",\"Quem alterou a política de um bucket às 15h? Qual fonte responde pela chamada?\"],[\"Amazon CloudWatch\",\"Métricas, logs da aplicação e alarmes para o estado operacional.\",\"O time quer alarme para aumento de erros HTTP no serviço. O que usar?\"],[\"AWS CloudTrail\",\"Atividade de API e trilha de ações de identidades nos eventos cobertos.\",\"A segurança precisa associar uma mudança de política a um principal. Qual fonte?\"],[\"AWS Config\",\"Inventário, histórico e avaliação de configuração de recursos.\",\"Uma norma exige detectar volume que não está em conformidade com uma configuração. Qual serviço?\"],[\"Amazon EventBridge\",\"Roteia eventos para destinos de acordo com regras.\",\"Uma aplicação deve entregar um evento já produzido a diferentes destinos conforme atributos. Qual serviço?\"],[\"AWS KMS\",\"Gerencia e controla uso de chaves de criptografia.\",\"A organização quer gerenciar chaves usadas para criptografar objetos S3. Qual serviço?\"],[\"AWS Secrets Manager\",\"Armazena segredos e oferece integração com rotação.\",\"Uma aplicação precisa recuperar uma senha de banco que roda periodicamente. O que usar?\"],[\"AWS Certificate Manager\",\"Gerencia certificados TLS/SSL em integrações compatíveis.\",\"O time quer gerenciar um certificado de endpoint HTTPS integrado a um load balancer compatível. Qual serviço?\"],[\"AWS IAM\",\"Determina quem pode executar ações sobre os recursos.\",\"O problema é determinar que identidade pode ler um segredo ou usar uma chave. Qual serviço modela o acesso?\"]]}],\"cards\":[{\"h\":\"2.2.1 · Artifact, Audit Manager e evidências de conformidade\",\"items\":[\"AWS Artifact fornece acesso sob demanda a relatórios de conformidade e acordos. AWS Audit Manager auxilia a coletar evidências e acompanhar avaliações. AWS Config registra configurações e avalia regras aplicáveis. CloudTrail registra ações das APIs cobertas.\",\"Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria.\"],\"tone\":\"blue\"},{\"h\":\"2.2.2 · CloudTrail, CloudWatch e AWS Config\",\"items\":[\"CloudWatch acompanha métricas, logs e alarmes operacionais. CloudTrail registra atividade de API e chamadas. AWS Config acompanha estado de configuração e conformidade por regras. EventBridge pode encaminhar eventos e disparar ações, conforme as fontes e regras configuradas.\",\"Mapeie sintoma, evento causal e configuração atual. Uma taxa de erros alta é métrica. Alterar uma permissão é atividade de API. Um volume sem a configuração exigida é problema de conformidade. Encaminhar a notificação é outra etapa.\"],\"tone\":\"blue\"},{\"h\":\"2.2.3 · Criptografia, certificados e gestão de segredos\",\"items\":[\"AWS KMS cria e controla chaves usadas por serviços e aplicações. Secrets Manager armazena segredos e oferece mecanismos de rotação integráveis. ACM emite ou importa certificados para integrações compatíveis. AWS Certificate Manager e KMS resolvem camadas distintas: identidade TLS e controle de chaves de criptografia.\",\"Mapeie qual segredo existe: senha da aplicação, chave que protege dado ou certificado que valida a sessão TLS. Compare quem pode usar, rodar, renovar, rotacionar e auditar o material.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Para quatro perguntas de um auditor, indique qual produto fornece cada evidência.\",\"Associe três evidências do mesmo incidente: alarme, autor da alteração e snapshot de configuração.\",\"Separe controle de acesso, criptografia em repouso e sessão de rede.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Artefato do fornecedor não mostra se a própria aplicação configurou criptografia corretamente.\",\"A métrica responde quanto e quando ocorreu um efeito, sem necessariamente identificar a identidade que o provocou.\",\"Mover uma senha para Secrets Manager não concede permissão à aplicação para lê-la.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t2.3\",\"d\":2,\"k\":\"Identidade e controle de acesso\",\"title\":\"Identidade e controle de acesso\",\"sub\":\"Objetivos 2.3.1, 2.3.2\",\"desc\":\"Distingua trust policy, que controla quem assume a role, de permission policy, que controla ações autorizadas após assumi-la. Princípio do menor privilégio inclui ações, recursos e condições. Para uma pessoa, prefira federação e sessões temporárias onde aplicável.\",\"quick\":[[\"Uma instância EC2 precisa ler objetos sem distribuir chaves permanentes para a aplicação. Qual escolha?\",\"Role IAM com credenciais temporárias\"],[\"Colaboradores precisam de um portal central para acessar várias contas com perfis distintos. Qual serviço?\",\"AWS IAM Identity Center\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Role IAM com credenciais temporárias\",\"Adequada a workloads e sessões que precisam assumir permissões.\",\"Uma instância EC2 precisa ler objetos sem distribuir chaves permanentes para a aplicação. Qual escolha?\"],[\"Usuário root protegido por MFA\",\"Reservado a tarefas que exigem root e protegido pelo controle adicional.\",\"Qual identidade deve usar MFA e permanecer reservada às tarefas exclusivas do proprietário da conta?\"],[\"Política de permissões\",\"Define ações, recursos e condições autorizados para a identidade.\",\"A role já é assumida, mas precisa ser autorizada a ler apenas um recurso. Que tipo de política expressa o escopo?\"],[\"Política de confiança\",\"Define quem pode assumir uma role.\",\"Qual política determina quais principais podem assumir uma role?\"],[\"AWS IAM Identity Center\",\"Centraliza acesso humano federado e atribuições a contas.\",\"Colaboradores precisam de um portal central para acessar várias contas com perfis distintos. Qual serviço?\"],[\"AWS Organizations com SCP\",\"Aplica limites organizacionais a contas e OUs abrangidas.\",\"O time central quer impedir uma ação em contas de uma OU inteira. Qual mecanismo?\"],[\"AWS Control Tower\",\"Orquestra estabelecimento e governança de uma landing zone.\",\"Qual serviço ajuda a estabelecer uma landing zone multi-account com controles e criação governada de contas?\"],[\"Política IAM\",\"Expressa as permissões da identidade, sujeitas aos demais limites.\",\"Uma SCP permite que a ação esteja disponível, mas o operador não a recebeu em sua role. O que concede a ação?\"]]}],\"cards\":[{\"h\":\"2.3.1 · Identidade de workloads, privilégios e root\",\"items\":[\"IAM controla identidade e autorização. Uma role assumida usa credenciais temporárias. Workloads como EC2 e Lambda devem receber uma role adequada. A conta root tem privilégios amplos e deve ser protegida com MFA e reservada para tarefas específicas. Credenciais de longo prazo inerentes a usuários IAM exigem justificativa e administração.\",\"Distingua trust policy, que controla quem assume a role, de permission policy, que controla ações autorizadas após assumi-la. Princípio do menor privilégio inclui ações, recursos e condições. Para uma pessoa, prefira federação e sessões temporárias onde aplicável.\"],\"tone\":\"blue\"},{\"h\":\"2.3.2 · Acesso humano e gestão de múltiplas contas\",\"items\":[\"AWS IAM Identity Center centraliza acesso de pessoas a contas e aplicações. AWS Organizations agrupa contas e aplica limites, como SCPs, a partir da estrutura organizacional. Uma SCP limita permissões possíveis nas contas aplicáveis e não concede acesso. AWS Control Tower ajuda a estabelecer e governar uma landing zone multi-account.\",\"Compare diretório, limites, permissões efetivas e provisionamento de contas. Permission sets mapeiam acesso em Identity Center. SCPs são controles organizacionais. Uma conta governada ainda precisa das permissões apropriadas no recurso.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Identifique quem executa, qual ação necessita, qual recurso pode acessar e como obtém as credenciais.\",\"Desenhe uma sessão de pessoa em duas contas e um guardrail que vale para toda a OU.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Colocar access keys de longo prazo no código ou na AMI cria exposição e rotação difícil.\",\"Uma SCP de permissão máxima nunca substitui as políticas que efetivamente concedem acesso.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t2.4\",\"d\":2,\"k\":\"Serviços e recursos de segurança\",\"title\":\"Serviços e recursos de segurança\",\"sub\":\"Objetivos 2.4.1, 2.4.2, 2.4.3\",\"desc\":\"Escolha pela evidência: comportamento de ameaça, CVE, visão consolidada ou classificação de dados. Uma ferramenta pode gerar achados consumidos por outra. Investigue a causa e trate o recurso correspondente em vez de confundir centralização com geração do achado.\",\"quick\":[[\"A equipe quer detectar atividade de ameaça a partir de fontes como eventos e fluxos compatíveis. Qual serviço?\",\"Amazon GuardDuty\"],[\"A equipe precisa bloquear padrões maliciosos em solicitações HTTP ao site. Qual serviço?\",\"AWS WAF\"],[\"O controle precisa negar uma faixa no limite da sub-rede. Qual mecanismo?\",\"Network ACL\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon GuardDuty\",\"Detecta sinais de atividades potencialmente maliciosas.\",\"A equipe quer detectar atividade de ameaça a partir de fontes como eventos e fluxos compatíveis. Qual serviço?\"],[\"Amazon Inspector\",\"Identifica vulnerabilidades em workloads compatíveis.\",\"A equipe quer identificar CVEs em imagens de contêiner compatíveis. Qual serviço?\"],[\"AWS Security Hub\",\"Centraliza achados e controles de postura.\",\"A segurança quer consolidar achados de serviços de proteção e monitorar postura. Qual serviço?\"],[\"Amazon Macie\",\"Descobre e classifica dados sensíveis no S3.\",\"É necessário localizar números de identificação pessoal em objetos do S3. Qual serviço?\"],[\"AWS WAF\",\"Filtra requisições web em pontos de integração compatíveis.\",\"A equipe precisa bloquear padrões maliciosos em solicitações HTTP ao site. Qual serviço?\"],[\"AWS Shield\",\"Protege workloads compatíveis contra DDoS.\",\"A preocupação dominante é proteção contra ataques distribuídos de negação de serviço. Qual oferta?\"],[\"AWS Firewall Manager\",\"Aplica e gerencia políticas de firewall centralmente em várias contas.\",\"Um administrador quer políticas AWS WAF consistentes em diversas contas. Qual serviço coordena a aplicação?\"],[\"Security group\",\"Controla fluxos de rede dos recursos associados com regras stateful.\",\"O acesso à porta do banco deve ser permitido somente ao grupo das instâncias de aplicação. Qual mecanismo?\"],[\"Security group\",\"Filtra tráfego de recursos associados com comportamento stateful.\",\"Um DB deve aceitar conexões TCP apenas de recursos de um grupo de aplicação. Qual mecanismo?\"],[\"Network ACL\",\"Filtra entrada e saída na sub-rede com regras explícitas e comportamento stateless.\",\"O controle precisa negar uma faixa no limite da sub-rede. Qual mecanismo?\"],[\"AWS WAF\",\"Inspeciona padrões em solicitações web.\",\"A regra depende de um parâmetro da URL HTTP e não do IP ou da porta. Qual controle?\"],[\"AWS IAM\",\"Controla ações da API de acordo com a identidade e a autorização.\",\"A exigência é impedir que um operador altere regras de rede pela console. Em qual controle atuar?\"]]}],\"cards\":[{\"h\":\"2.4.1 · Detecção de ameaças, vulnerabilidades e postura\",\"items\":[\"GuardDuty identifica sinais de ameaças a partir de fontes suportadas. Inspector avalia vulnerabilidades e exposições para workloads compatíveis. Security Hub agrega achados e auxilia no gerenciamento de postura. Macie identifica dados sensíveis em buckets S3.\",\"Escolha pela evidência: comportamento de ameaça, CVE, visão consolidada ou classificação de dados. Uma ferramenta pode gerar achados consumidos por outra. Investigue a causa e trate o recurso correspondente em vez de confundir centralização com geração do achado.\"],\"tone\":\"blue\"},{\"h\":\"2.4.2 · WAF, Shield, Firewall Manager e controles de rede\",\"items\":[\"AWS WAF protege aplicações web por regras de camada HTTP. AWS Shield oferece proteção contra DDoS. Firewall Manager auxilia a aplicar políticas de firewall centralmente em múltiplas contas. Grupos de segurança controlam tráfego de rede de recursos associados por regras stateful.\",\"Localize a camada e a escala: conteúdo HTTP, inundação volumétrica, governança em contas ou tráfego de interfaces. Regras HTTP podem filtrar padrões de requisições. As políticas multi-account podem coordenar as configurações desses controles compatíveis.\"],\"tone\":\"blue\"},{\"h\":\"2.4.3 · Segurança em profundidade e acesso a sub-redes\",\"items\":[\"Security groups controlam fluxos nas interfaces e são stateful. Network ACLs se aplicam no limite da sub-rede, podem permitir e negar e são stateless. WAF atua sobre requisições de aplicação. IAM controla quem pode usar APIs e administrar recursos.\",\"Decida pelo alcance: recurso, sub-rede, requisição ou identidade. No controle stateless, permita o retorno conforme o contrato. Uma regra de segurança em uma camada não amplia acesso quando outra camada nega.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Use uma tabela de incidentes fictícios e identifique o primeiro serviço a acionar e onde consolidar o achado.\",\"Classifique quatro demandas: padrão HTTP, DDoS, gestão central e porta do banco.\",\"Dado um acesso a um site, decomponha as decisões por camada e identifique onde evidenciar o efeito.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Macie não é um scanner genérico de imagens de contêiner nem um serviço de firewall.\",\"WAF não é a resposta automática a qualquer pergunta sobre tráfego ou rede.\",\"Security groups permitem tráfego por regras de allow. Bloqueio explícito por faixa é característica de Network ACL quando aplicado à sub-rede.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.1\",\"d\":3,\"k\":\"Formas de implantação e operação\",\"title\":\"Formas de implantação e operação\",\"sub\":\"Objetivos 3.1.1, 3.1.2\",\"desc\":\"Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro.\",\"quick\":[[\"Um profissional precisa explorar recursos de uma conta por interface visual. Qual meio?\",\"AWS Management Console\"],[\"A API opera na AWS e usa o banco da fábrica que permanece local. Qual modelo?\",\"Híbrido\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"AWS Management Console\",\"Interface gráfica para uso humano e operações pontuais.\",\"Um profissional precisa explorar recursos de uma conta por interface visual. Qual meio?\"],[\"AWS CLI\",\"Interface de comandos para rotinas interativas ou scripts.\",\"Um script de terminal lista buckets periodicamente e executa comandos assinados. Qual interface?\"],[\"AWS SDK\",\"Bibliotecas para chamar serviços no código de uma aplicação.\",\"Um aplicativo Java precisa chamar um serviço AWS por biblioteca oficial. Qual interface?\"],[\"AWS CloudFormation\",\"Templates declarativos e ciclo de vida de stacks.\",\"A infraestrutura deve ser replicada e revisada como definição declarativa. Qual meio?\"],[\"Cloud-only\",\"Os componentes do workload operam na AWS sem dependências locais descritas.\",\"Aplicação e dados operam inteiramente em recursos AWS. Qual modelo foi descrito?\"],[\"Híbrido\",\"Componentes locais e AWS operam de forma integrada.\",\"A API opera na AWS e usa o banco da fábrica que permanece local. Qual modelo?\"],[\"On-premises\",\"A carga permanece em infraestrutura local.\",\"Processamento e dados permanecem exclusivamente no datacenter privado da organização, sem serviços AWS. Qual modelo?\"],[\"AWS Outposts\",\"Estende infraestrutura e serviços AWS compatíveis para o local.\",\"A empresa precisa de serviços compatíveis da AWS no próprio datacenter por baixa latência local. Qual opção avaliar?\"]]}],\"cards\":[{\"h\":\"3.1.1 · Console, CLI, SDK e infraestrutura como código\",\"items\":[\"A console fornece interface web. A CLI executa operações por comando ou script. SDKs integram chamadas AWS no código. CloudFormation define recursos e dependências declarativamente, com stacks e mudança rastreável.\",\"Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro.\"],\"tone\":\"blue\"},{\"h\":\"3.1.2 · Implantação em nuvem, híbrida e local\",\"items\":[\"Na nuvem, a carga usa infraestrutura do provedor. Híbrido integra recursos locais e da nuvem no mesmo processo. On-premises mantém recursos no local. Outposts estende serviços e infraestrutura AWS compatíveis para instalações do cliente, dentro de seus requisitos operacionais.\",\"Pergunte onde executam compute e dados e se existe integração operacional entre ambientes. Restrições de latência, dependências antigas ou residência podem exigir presença local ainda que outras partes migrem.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Classifique uma tarefa de operação em cada categoria e identifique onde guardar a definição.\",\"Trace o caminho de uma transação, destacando em qual ambiente estão aplicação, banco e operação.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"CLI automatiza ações, mas seu uso por si só não descreve a configuração inteira como um estado declarativo.\",\"Usar AWS em uma Região não torna a arquitetura híbrida se nenhum componente operacional permanece fora dela.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.2\",\"d\":3,\"k\":\"Infraestrutura global\",\"title\":\"Infraestrutura global\",\"sub\":\"Objetivos 3.2.1\",\"desc\":\"Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário.\",\"quick\":[[\"Uma lei determina um país para armazenar dados primários. Que nível geográfico selecionar?\",\"Região AWS\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Região AWS\",\"Escolha geográfica para residência, latência e serviços disponíveis.\",\"Uma lei determina um país para armazenar dados primários. Que nível geográfico selecionar?\"],[\"Availability Zone\",\"Domínio isolado de falha dentro de uma Região.\",\"A ideia é separar componentes para que uma falha localizada não derrube os dois dentro da mesma Região. Qual unidade?\"],[\"Edge location\",\"Ponto de presença para aproximar serviços de entrega dos usuários.\",\"A empresa quer entregar conteúdo em cache próximo dos usuários internacionais. Qual infraestrutura?\"],[\"Estratégia Multi-Region\",\"Opera ou recupera workloads em mais de uma Região quando requisitos justificam.\",\"O requisito inclui indisponibilidade prolongada de toda uma Região. Qual escopo planejar?\"]]}],\"cards\":[{\"h\":\"3.2.1 · Regiões, zonas, edge e critérios geográficos\",\"items\":[\"Uma Região é uma área geográfica. Uma Availability Zone agrupa um ou mais datacenters isolados de outras zonas, com conectividade de baixa latência na Região. Pontos de presença entregam serviços de borda. Escolher Região envolve residência, proximidade, custo e disponibilidade de serviços.\",\"Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Explique separadamente localização dos dados, borda de entrega e domínio de falha.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Usar CloudFront não replica automaticamente o banco entre Regiões.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.3\",\"d\":3,\"k\":\"Computação\",\"title\":\"Computação\",\"sub\":\"Objetivos 3.3.1, 3.3.2\",\"desc\":\"Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda.\",\"quick\":[[\"Um software exige escolher SO e instalar um agente diretamente no sistema convidado. Qual escolha?\",\"Amazon EC2\"],[\"Um grupo deve aumentar e diminuir a quantidade de EC2 com base em demanda. Qual componente?\",\"EC2 Auto Scaling\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon EC2\",\"Máquinas virtuais para workloads que exigem controle do ambiente de instância.\",\"Um software exige escolher SO e instalar um agente diretamente no sistema convidado. Qual escolha?\"],[\"AWS Lambda\",\"Funções gerenciadas disparadas por invocação ou eventos.\",\"Ao chegar um objeto, uma tarefa curta ajusta metadados. Qual serviço?\"],[\"AWS Fargate\",\"Capacidade computacional gerenciada para contêineres nas integrações compatíveis.\",\"As tarefas já são contêineres ECS e a equipe não quer operar nós. Qual capacidade?\"],[\"Amazon EKS\",\"Kubernetes gerenciado, com opções de compute distintas.\",\"A equipe quer manter os manifests e a API Kubernetes com plano de controle gerenciado. Qual serviço?\"],[\"EC2 Auto Scaling\",\"Ajusta capacidade de um grupo de instâncias.\",\"Um grupo deve aumentar e diminuir a quantidade de EC2 com base em demanda. Qual componente?\"],[\"Application Load Balancer\",\"Balanceia tráfego HTTP e encaminha por host ou caminho, conforme regras.\",\"O front-end precisa direcionar /pagamentos e /pedidos para alvos distintos. Qual tipo de balanceador?\"],[\"Network Load Balancer\",\"Balanceia tráfego de transporte para protocolos como TCP.\",\"O serviço é TCP e precisa de balanceamento de camada de transporte. Qual opção?\"],[\"Amazon CloudFront\",\"Entrega conteúdo globalmente por uma distribuição de borda.\",\"O requisito central é colocar conteúdo estático em cache perto dos usuários. Que serviço?\"]]}],\"cards\":[{\"h\":\"3.3.1 · EC2, Lambda, containers e Fargate\",\"items\":[\"EC2 fornece capacidade de máquinas virtuais e controle do sistema convidado. Lambda executa funções orientadas a eventos em limites gerenciados. ECS e EKS orquestram contêineres; Fargate é opção de capacidade gerenciada compatível com ambos, conforme workload e configuração.\",\"Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda.\"],\"tone\":\"blue\"},{\"h\":\"3.3.2 · Integração de capacidade e tráfego na aplicação\",\"items\":[\"Auto Scaling adapta a capacidade de um grupo. ELB encaminha conexões aos alvos saudáveis. Um ALB trabalha com HTTP/HTTPS e pode roteá-los por atributos de aplicação; NLB trabalha na camada de transporte para protocolos compatíveis.\",\"Diferencie crescer a capacidade, encaminhar tráfego de aplicação, distribuir transporte e publicar conteúdo global em cache. Use health checks e políticas calibradas ao requisito.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Identifique duração, estado, necessidade de acesso ao host e padrão de ativação.\",\"Simule um alvo não saudável e uma subida de tráfego; observe quais componentes agem.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Fargate não é um orquestrador substituto de ECS ou EKS.\",\"Instalar um balanceador não altera a quantidade de instâncias sem integração de escala.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.4\",\"d\":3,\"k\":\"Bancos de dados\",\"title\":\"Bancos de dados\",\"sub\":\"Objetivos 3.4.1, 3.4.2\",\"desc\":\"Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção.\",\"quick\":[[\"A aplicação consulta carrinhos principalmente pelo identificador do cliente, com acesso previsível por chave. Qual serviço?\",\"Amazon DynamoDB\"],[\"É necessário copiar tabelas e continuar capturando alterações enquanto a origem segue ativa. Qual serviço?\",\"AWS Database Migration Service\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon RDS\",\"Banco relacional gerenciado com motores compatíveis.\",\"A equipe quer hospedar um banco SQL Server em serviço relacional gerenciado compatível. Qual serviço?\"],[\"Amazon Aurora\",\"Motor relacional da AWS compatível com MySQL ou PostgreSQL.\",\"O requisito identifica explicitamente o motor relacional desenvolvido pela AWS com compatibilidade PostgreSQL. Qual?\"],[\"Amazon DynamoDB\",\"Banco NoSQL gerenciado orientado a padrões de acesso por chave.\",\"A aplicação consulta carrinhos principalmente pelo identificador do cliente, com acesso previsível por chave. Qual serviço?\"],[\"Amazon Redshift\",\"Warehouse para análise e agregações em escala.\",\"Analistas agregam vários anos de fatos para BI e precisam de um warehouse. Qual?\"],[\"AWS Database Migration Service\",\"Move dados e pode replicar mudanças em fontes e destinos compatíveis.\",\"É necessário copiar tabelas e continuar capturando alterações enquanto a origem segue ativa. Qual serviço?\"],[\"DMS Schema Conversion\",\"Avalia e auxilia a converter objetos e código entre motores compatíveis.\",\"Um time precisa identificar objetos SQL incompatíveis na mudança de motor. Qual recurso?\"],[\"Amazon ElastiCache\",\"Cache gerenciado em memória para acelerar padrões de leitura elegíveis.\",\"A aplicação repete leituras de sessões e quer reduzir a pressão no banco primário. Qual serviço?\"],[\"Amazon RDS\",\"Fornece motores relacionais gerenciados para servir o workload.\",\"A migração terminou e o requisito é operar o banco relacional gerenciado no destino. Qual?\"]]}],\"cards\":[{\"h\":\"3.4.1 · RDS, Aurora, DynamoDB e Redshift\",\"items\":[\"Amazon RDS hospeda motores relacionais gerenciados. Aurora é um motor relacional compatível com MySQL ou PostgreSQL, conforme edição, oferecido pela AWS. DynamoDB é NoSQL chave-valor/documento. Redshift é um data warehouse analítico. O padrão de acesso antecede a escolha.\",\"Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção.\"],\"tone\":\"blue\"},{\"h\":\"3.4.2 · Migração de banco, conversão de esquema e cache\",\"items\":[\"DMS transporta dados e alterações de fontes compatíveis. DMS Schema Conversion auxilia a avaliar e converter esquema e código de banco em mudanças heterogêneas elegíveis. ElastiCache mantém dados em memória para acelerar acessos. RDS fornece o ambiente gerenciado para o banco de destino quando adequado.\",\"Separe mover dados, converter estrutura, operar o destino e acelerar leitura. Mudança de motor acrescenta compatibilidade de tipos, SQL e código procedural. Compare validação dos resultados e plano de troca.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Compare acesso por chave, atualizações relacionadas e consulta analítica sobre grande histórico.\",\"Em uma mudança Oracle → PostgreSQL, classifique tarefas de avaliação, conversão, carga, CDC e atendimento.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"A presença de SQL não transforma todo banco relacional em warehouse otimizado para agregações analíticas.\",\"Uma migração com CDC não garante automaticamente que stored procedures funcionem no motor novo.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.5\",\"d\":3,\"k\":\"Redes\",\"title\":\"Redes\",\"sub\":\"Objetivos 3.5.1, 3.5.2\",\"desc\":\"Separe espaço de endereçamento, resolução de nomes, entrega em HTTP e caminho de transporte. O requisito por IP fixo ou por cache diferencia estratégias que parecem similares.\",\"quick\":[[\"A equipe precisa criar sub-redes públicas e privadas em uma rede isolada. Qual serviço?\",\"Amazon VPC\"],[\"Uma filial precisa comunicação criptografada via túnel IPsec entre redes. Qual opção?\",\"AWS Site-to-Site VPN\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon VPC\",\"Fornece rede virtual isolada e controles de sub-redes.\",\"A equipe precisa criar sub-redes públicas e privadas em uma rede isolada. Qual serviço?\"],[\"Amazon Route 53\",\"Resolve domínios e aplica políticas de roteamento DNS.\",\"O time precisa gerenciar registros de um domínio de aplicação. Qual serviço?\"],[\"Amazon CloudFront\",\"Distribui conteúdo web por borda com opções de cache.\",\"Uma editora quer que imagens do site sejam atendidas por cache próximo dos leitores. Qual serviço?\"],[\"AWS Global Accelerator\",\"Usa endereços IP estáticos e rede global para tráfego TCP/UDP compatível.\",\"Parceiros exigem IPs fixos e o tráfego TCP deve aproveitar o backbone global da AWS. Qual produto?\"],[\"AWS Site-to-Site VPN\",\"Conecta redes com túneis IPsec.\",\"Uma filial precisa comunicação criptografada via túnel IPsec entre redes. Qual opção?\"],[\"AWS Direct Connect\",\"Fornece conectividade dedicada e previsível com a AWS.\",\"O datacenter exige uma conexão dedicada de longo prazo com a AWS. Qual opção?\"],[\"NAT gateway público\",\"Permite que instâncias privadas iniciem tráfego a destinos da internet.\",\"Instâncias privadas precisam baixar patches da internet sem aceitar conexões iniciadas externamente. Que componente?\"],[\"VPC endpoint\",\"Fornece caminho privado para serviços compatíveis.\",\"A empresa quer chamar serviço AWS compatível da VPC sem passar pela internet. Qual recurso?\"]]}],\"cards\":[{\"h\":\"3.5.1 · VPC, DNS e entrega global de conteúdo\",\"items\":[\"Uma VPC é uma rede virtual isolada e subdividida em sub-redes. Route 53 fornece DNS e políticas de roteamento DNS. CloudFront entrega conteúdo por borda, com cache conforme configuração. Global Accelerator usa a rede global da AWS para acelerar tráfego TCP/UDP e oferecer IPs estáticos para endpoints compatíveis.\",\"Separe espaço de endereçamento, resolução de nomes, entrega em HTTP e caminho de transporte. O requisito por IP fixo ou por cache diferencia estratégias que parecem similares.\"],\"tone\":\"blue\"},{\"h\":\"3.5.2 · Conectividade híbrida e saída da rede\",\"items\":[\"Site-to-Site VPN estabelece túneis IPsec. Direct Connect fornece conexão dedicada do ambiente para a AWS, com criptografia tratada conforme o desenho. Um NAT gateway público permite saída à internet de recursos em sub-redes privadas sem aceitar início espontâneo de conexões da internet. Endpoints VPC oferecem caminhos privados a serviços compatíveis.\",\"Escolha pela origem, pelo destino e pela necessidade de depender da internet pública. Diferencie conectividade escritório-cloud de acesso privado a serviço AWS.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Trace um acesso do nome DNS ao IP e então ao endpoint da aplicação.\",\"Descreva os caminhos para API da AWS, escritório e download de patches da internet.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Alterar DNS pode influenciar o destino do tráfego. Isso não coloca conteúdo em cache.\",\"Direct Connect não oferece criptografia de todo tráfego automaticamente.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.6\",\"d\":3,\"k\":\"Armazenamento\",\"title\":\"Armazenamento\",\"sub\":\"Objetivos 3.6.1, 3.6.2\",\"desc\":\"Decida primeiro pela interface requerida: objeto, bloco, arquivo Linux compartilhado ou um sistema de arquivos específico. Só então avalie capacidade, latência, throughput e custo.\",\"quick\":[[\"O sistema grava imagens como objetos e as acessa por chave em um bucket. Qual serviço?\",\"Amazon S3\"],[\"O padrão de acesso é imprevisível e a empresa quer ajuste automático por atividade observada. Qual classe?\",\"S3 Intelligent-Tiering\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon S3\",\"Armazena objetos em buckets e atende aplicações que usam a API de objetos.\",\"O sistema grava imagens como objetos e as acessa por chave em um bucket. Qual serviço?\"],[\"Amazon EBS\",\"Fornece volumes em bloco para instâncias EC2 compatíveis.\",\"É necessário um volume de inicialização de bloco para uma instância EC2. Qual?\"],[\"Amazon EFS\",\"Sistema NFS gerenciado e elástico para compartilhamento.\",\"Várias instâncias Linux montam o mesmo diretório compartilhado via NFS. Qual serviço?\"],[\"Amazon FSx for Windows File Server\",\"Sistema gerenciado de arquivos Windows via SMB.\",\"Aplicativos Windows precisam de compartilhamento SMB gerenciado. Qual produto?\"],[\"S3 Standard\",\"Para dados acessados com frequência com baixa latência.\",\"A aplicação serve objetos muito acessados e precisa de baixa latência na rotina. Qual classe?\"],[\"S3 Standard-IA\",\"Para dados pouco acessados que ainda exigem recuperação imediata.\",\"As leituras são pouco frequentes, mas qualquer objeto deve ficar prontamente acessível quando necessário. Qual classe?\"],[\"S3 Intelligent-Tiering\",\"Para dados cujo acesso é desconhecido ou muda ao longo do tempo.\",\"O padrão de acesso é imprevisível e a empresa quer ajuste automático por atividade observada. Qual classe?\"],[\"S3 Glacier Deep Archive\",\"Para retenção longa com acesso raro e restauração tolerante a espera.\",\"Registros regulatórios passam anos sem leitura e a restauração pode levar horas. Qual classe?\"]]}],\"cards\":[{\"h\":\"3.6.1 · S3, EBS, EFS e FSx por interface de acesso\",\"items\":[\"S3 é armazenamento de objetos com APIs próprias. EBS é armazenamento em blocos para instâncias EC2. EFS oferece sistema de arquivos NFS elástico para clientes compatíveis. FSx oferece sistemas de arquivos gerenciados, como Windows File Server, Lustre, OpenZFS e ONTAP, com funções distintas.\",\"Decida primeiro pela interface requerida: objeto, bloco, arquivo Linux compartilhado ou um sistema de arquivos específico. Só então avalie capacidade, latência, throughput e custo.\"],\"tone\":\"blue\"},{\"h\":\"3.6.2 · Classes S3, arquivamento, backup e retenção\",\"items\":[\"S3 Standard atende acesso frequente. Standard-IA mantém acesso rápido com condições de armazenamento e recuperação. Intelligent-Tiering move objetos entre camadas adequadas ao padrão observado, com custos e elegibilidade. Glacier Deep Archive atende arquivo de longo prazo com recuperação planejada.\",\"Compare frequência, tempo tolerado para recuperação, custos de transição, redundância e duração mínima aplicável. Lifecycle automatiza transições e expiração. Versioning preserva versões conforme política e interage com a expiração.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Identifique protocolo e padrão de compartilhamento antes de escolher a classe de armazenamento.\",\"Monte uma matriz para dados quentes, frios, imprevisíveis e arquivados por anos.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Usar S3 como destino de um data lake não o torna um volume de bloco para instalar um sistema operacional EC2.\",\"Preço de armazenamento por GB isolado não considera acesso, recuperação, solicitações ou duração mínima.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.7\",\"d\":3,\"k\":\"IA, ML e análise\",\"title\":\"IA, ML e análise\",\"sub\":\"Objetivos 3.7.1, 3.7.2\",\"desc\":\"Identifique se a etapa consulta o lake, transforma e cataloga, serve consultas num warehouse ou apresenta a informação. Considere recorrência, fontes, custo por consulta e padrões de acesso.\",\"quick\":[[\"Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse. Qual ferramenta?\",\"Amazon Athena\"],[\"A empresa quer extrair valores dos campos em formulários escaneados. Qual serviço?\",\"Amazon Textract\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon Athena\",\"Executa SQL serverless sobre dados no lake e fontes compatíveis.\",\"Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse. Qual ferramenta?\"],[\"AWS Glue\",\"Fornece mecanismos de integração, ETL e catálogo.\",\"A etapa precisa descobrir metadados e executar integração gerenciada. Qual serviço?\"],[\"Amazon Redshift\",\"Fornece data warehouse para análises de grande escala.\",\"O requisito é operar um warehouse analítico para grandes conjuntos estruturados e relatórios frequentes. Qual?\"],[\"Camada de BI, como Amazon QuickSight\",\"Apresenta dashboards e análises a consumidores.\",\"O dado já está consultável e o requisito é disponibilizar gráficos interativos aos gestores. Qual camada?\"],[\"Amazon Textract\",\"Extrai texto e estruturas como tabelas e campos de documentos suportados.\",\"A empresa quer extrair valores dos campos em formulários escaneados. Qual serviço?\"],[\"Amazon Rekognition\",\"Analisa imagens ou vídeo em tarefas de reconhecimento compatíveis.\",\"O problema é classificar objetos em fotografias, sem OCR de formulários. Qual serviço?\"],[\"Amazon Comprehend\",\"Aplica análise de linguagem natural a textos.\",\"Uma equipe quer identificar sentimento em comentários textuais, sem treinar um modelo. Qual?\"],[\"Amazon Bedrock\",\"Oferece modelos de base gerenciados e recursos para aplicações generativas.\",\"O requisito é gerar resumos com modelos de base por API gerenciada. Qual serviço?\"]]}],\"cards\":[{\"h\":\"3.7.1 · Analytics: Athena, Glue, Redshift e visualização\",\"items\":[\"Athena consulta dados por SQL sem administrar servidores, frequentemente em S3. AWS Glue oferece integração, catálogo e ETL conforme componente. Redshift fornece um data warehouse para análises. A camada de BI apresenta dados ao usuário em análises e painéis.\",\"Identifique se a etapa consulta o lake, transforma e cataloga, serve consultas num warehouse ou apresenta a informação. Considere recorrência, fontes, custo por consulta e padrões de acesso.\"],\"tone\":\"blue\"},{\"h\":\"3.7.2 · IA gerenciada e escolha pelo tipo de tarefa\",\"items\":[\"Comprehend extrai sinais de textos com NLP. Textract extrai texto e estrutura de documentos. Rekognition analisa imagens e vídeo em tarefas suportadas. SageMaker AI atende desenvolvimento e uso de modelos de ML com mais controle. Bedrock oferece acesso e ferramentas de modelos de base gerenciados.\",\"Associe o dado de entrada e o resultado esperado. Quando uma API pré-construída atende ao requisito, ela reduz trabalho de treinamento. Quando o objetivo é GenAI, avalie modelos de base e limitações do contexto.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Siga um relatório desde arquivos brutos até tratamento, execução de consulta e apresentação.\",\"Diferencie uma imagem de objeto, um formulário escaneado e um texto que precisa de classificação.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Visualização e transformação distribuída respondem a etapas diferentes da mesma arquitetura.\",\"Uma API de visão não substitui automaticamente a extração estruturada de formulários.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t3.8\",\"d\":3,\"k\":\"Outros serviços no escopo\",\"title\":\"Outros serviços no escopo\",\"sub\":\"Objetivos 3.8.1, 3.8.2, 3.8.3, 3.8.4\",\"desc\":\"Se o problema é orquestração, verifique sequência, estado, erros e retry. Se é integração, verifique se precisa buffer, fan-out ou seleção por conteúdo.\",\"quick\":[[\"Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação. Qual serviço?\",\"AWS Step Functions\"],[\"O operador precisa executar uma tarefa em uma frota configurada e gerenciada. Qual serviço?\",\"AWS Systems Manager\"],[\"Um commit precisa disparar compilação e teste em ambiente gerenciado. Qual serviço executa essa etapa?\",\"AWS CodeBuild\"],[\"Sensores precisam autenticar e publicar mensagens IoT. Qual oferta?\",\"AWS IoT Core\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Amazon SQS\",\"Fila para manter trabalho até consumo.\",\"Uma etapa consumidora deve processar mensagens mais tarde e em seu próprio ritmo. Qual serviço?\"],[\"Amazon SNS\",\"Tópico para distribuição a múltiplos assinantes.\",\"A mesma mensagem deve ser publicada para múltiplos assinantes com uma publicação. Qual serviço?\"],[\"Amazon EventBridge\",\"Roteamento de eventos por regras, com destinos integrados.\",\"O requisito é encaminhar eventos de várias fontes conforme seus campos. Qual serviço?\"],[\"AWS Step Functions\",\"Orquestração de etapas com estado e ramificações.\",\"Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação. Qual serviço?\"],[\"AWS Systems Manager\",\"Fornece recursos de operação de frotas e execução de ações suportadas.\",\"O operador precisa executar uma tarefa em uma frota configurada e gerenciada. Qual serviço?\"],[\"AWS Health\",\"Mostra eventos de serviço ou de recursos relevantes para a conta.\",\"A equipe quer saber quais recursos da conta são afetados por uma manutenção anunciada pela AWS. Qual serviço?\"],[\"AWS Trusted Advisor\",\"Oferece recomendações por verificações suportadas.\",\"A empresa quer recomendações sobre oportunidades de custo e sobre verificações suportadas de boas práticas. Qual ferramenta?\"],[\"AWS Backup\",\"Orquestra políticas e gestão central de cópias de recursos elegíveis.\",\"Uma organização precisa centralizar planos de backup e retenção para serviços suportados. Qual?\"],[\"AWS CodeBuild\",\"Executa atividades de build e teste.\",\"Um commit precisa disparar compilação e teste em ambiente gerenciado. Qual serviço executa essa etapa?\"],[\"AWS CodePipeline\",\"Orquestra fluxo de entrega com estágios e ações.\",\"Uma entrega precisa coordenar build, aprovação e implantação. Que serviço organiza o fluxo?\"],[\"AWS CodeDeploy\",\"Automatiza implantação de aplicação em alvos suportados.\",\"O pacote já foi produzido. É necessário automatizar rollout em instâncias compatíveis. Qual serviço?\"],[\"AWS CloudFormation\",\"Provê e atualiza recursos a partir de templates declarativos.\",\"É preciso revisar os recursos de rede e compute declarados em uma stack. Qual serviço?\"],[\"AWS IoT Core\",\"Conecta dispositivos e mensagens IoT em um serviço gerenciado.\",\"Sensores precisam autenticar e publicar mensagens IoT. Qual oferta?\"],[\"AWS Amplify\",\"Apoia desenvolvimento e publicação de aplicações frontend.\",\"O time precisa publicar o frontend web e integrar sua entrega à rotina de desenvolvimento. Qual família?\"]]}],\"cards\":[{\"h\":\"3.8.1 · Serviços de integração: filas, tópicos, eventos e workflows\",\"items\":[\"SQS fornece filas; SNS distribui mensagens a assinantes; EventBridge roteia eventos segundo regras; Step Functions orquestra etapas e estados. O contrato de entrega define qual componente é central.\",\"Se o problema é orquestração, verifique sequência, estado, erros e retry. Se é integração, verifique se precisa buffer, fan-out ou seleção por conteúdo.\"],\"tone\":\"blue\"},{\"h\":\"3.8.2 · Ferramentas operacionais e serviços por função\",\"items\":[\"AWS Systems Manager reúne capacidades de operação, como gerenciamento de recursos configurados e execução remota de tarefas suportadas. AWS Health informa eventos que afetam serviços ou recursos da conta. AWS Trusted Advisor recomenda melhorias conforme verificações disponíveis. AWS Backup centraliza políticas de backup para recursos elegíveis.\",\"Diferencie executar a ação, obter visibilidade de evento, revisar recomendações e centralizar backups. Confirme configuração dos recursos, permissões da conta e elegibilidade para cada integração.\"],\"tone\":\"blue\"},{\"h\":\"3.8.3 · Ferramentas de desenvolvimento e entrega contínua\",\"items\":[\"CodeBuild compila e testa código em ambiente gerenciado. CodePipeline orquestra estágios da entrega. CodeDeploy automatiza implantação de aplicações em alvos compatíveis. CloudFormation define e opera stacks de infraestrutura declarativa.\",\"Diferencie ação de build, grafo da entrega, rollout da aplicação e definição de recursos. Um pipeline pode chamar outros serviços em vez de implementar cada etapa.\"],\"tone\":\"blue\"},{\"h\":\"3.8.4 · Frontend, dispositivos, desktops e acesso a aplicações\",\"items\":[\"IoT Core conecta dispositivos e mensageria de IoT. Amplify oferece ferramentas e hospedagem para aplicações web e mobile compatíveis. Amazon WorkSpaces fornece desktops virtuais ou ofertas de computação de usuário conforme produto. AppStream 2.0, também apresentado na família WorkSpaces Applications, entrega aplicações por streaming em cenários compatíveis.\",\"Identifique o tipo de cliente: equipamento conectado, navegador frontend, desktop gerenciado ou aplicativo individual transmitido. O serviço escolhido precisa oferecer o acesso apropriado à identidade do consumidor.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Compare o papel dos quatro serviços no mesmo processo de pedido e envio.\",\"Decida qual ação segue cada evidência: evento na conta, recomendação de custo, tarefa em frota e retenção de backup.\",\"Desenhe commit, testes, aprovação, infraestrutura e deploy como ações separadas.\",\"Classifique quatro demandas por fonte, unidade entregue e experiência final.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Uma fila pode armazenar trabalho pendente e ainda não representar a lógica do workflow.\",\"Uma recomendação do Trusted Advisor não executa por si só a correção.\",\"CodePipeline organiza etapas, mas um estágio de build precisa de um executor de build ou integração compatível.\",\"Streaming de aplicação para usuário não equivale a envio de eventos de telemetria de dispositivos.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t4.1\",\"d\":4,\"k\":\"Modelos de preços\",\"title\":\"Modelos de preços\",\"sub\":\"Objetivos 4.1.1, 4.1.2\",\"desc\":\"Classifique previsibilidade, tolerância à interrupção, necessidade de flexibilidade e diferença entre desconto e reserva de capacidade. Capacidade On-Demand reservada segue regras e é distinta de um compromisso de preço.\",\"quick\":[[\"Um job distribuído retoma processamento e aceita interrupções por economia. Qual opção?\",\"Spot Instances\"],[\"Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume. Qual ferramenta?\",\"AWS Pricing Calculator\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"On-Demand\",\"Uso flexível sem compromisso de prazo.\",\"Um evento isolado precisa capacidade sem compromisso plurianual. Qual opção de preço?\"],[\"Savings Plans\",\"Compromisso de gasto por hora para desconto em uso de computação elegível.\",\"Existe demanda recorrente. O cliente aceita comprometer gasto por hora para obter desconto de computação elegível. Qual modelo?\"],[\"Reserved Instances\",\"Modelo de desconto sujeito às condições de reserva e compatibilidade.\",\"A equipe quer comparar descontos atrelados às condições de uma reserva de instância. Qual modelo?\"],[\"Spot Instances\",\"Capacidade excedente apropriada a cargas tolerantes a interrupção.\",\"Um job distribuído retoma processamento e aceita interrupções por economia. Qual opção?\"],[\"AWS Pricing Calculator\",\"Estima custos para serviços e volume planejados.\",\"Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume. Qual ferramenta?\"],[\"AWS Cost Explorer\",\"Analisa custos e uso registrados e permite explorar tendências.\",\"A equipe quer descobrir qual serviço gerou o aumento de gastos no trimestre passado. Qual ferramenta?\"],[\"Modelo de transferência de dados\",\"Considera origem, destino e regras de cobrança do serviço.\",\"Uma aplicação replica dados para outra Região. Qual dimensão adicional investigar na estimativa?\"],[\"Direcionadores de custo de armazenamento\",\"Consideram volume, classe, requisições, retenção e recuperação.\",\"A empresa compara duas classes S3 com longa retenção e tarifas diferentes de recuperação. Que dimensão predomina?\"]]}],\"cards\":[{\"h\":\"4.1.1 · On-Demand, Savings Plans, reservas e Spot\",\"items\":[\"On-Demand atende consumo sem compromisso de longo prazo. Savings Plans oferecem desconto sobre uso elegível mediante compromisso monetário por hora. Reserved Instances trazem desconto e condições associadas ao serviço e escopo. Spot usa capacidade excedente, sujeita à interrupção.\",\"Classifique previsibilidade, tolerância à interrupção, necessidade de flexibilidade e diferença entre desconto e reserva de capacidade. Capacidade On-Demand reservada segue regras e é distinta de um compromisso de preço.\"],\"tone\":\"blue\"},{\"h\":\"4.1.2 · Estimativas, transferência e custo marginal\",\"items\":[\"O custo pode envolver tempo, capacidade, solicitações, armazenamento e transferência, dependendo do serviço. AWS Pricing Calculator estima cenários futuros. Cost Explorer analisa uso e custo reportados. Uma decisão de custo considera o preço marginal de serviços e topologia de transferência.\",\"Compare carga estimada, tráfego ingress/egress, acessos entre zonas ou Regiões e custos indiretos. Verifique regras de preços por serviço e Região em vez de presumir que toda transferência tem o mesmo tratamento.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Separe carga previsível, pico eventual, lote tolerante a interrupção e capacidade que precisa estar disponível.\",\"Calcule quais variáveis mudam se um consumidor passa a ler de outra Região.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Savings Plans não garantem capacidade física disponível. Spot não atende sozinho requisito de capacidade contínua sem estratégia de interrupção.\",\"Uma estimativa de arquitetura futura não substitui a análise de uso e custo histórico.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t4.2\",\"d\":4,\"k\":\"Cobrança, orçamento e gestão de custos\",\"title\":\"Cobrança, orçamento e gestão de custos\",\"sub\":\"Objetivos 4.2.1, 4.2.2\",\"desc\":\"Escolha pela pergunta: investigar histórico, vigiar limite acordado, alimentar modelo analítico ou encontrar desvio inesperado. Considere atraso de processamento da cobrança na interpretação de alertas.\",\"quick\":[[\"O financeiro quer avisar se o custo previsto superar o limite mensal acordado. Qual serviço?\",\"AWS Budgets\"],[\"A empresa quer pagar uma fatura agregada, mantendo contas distintas. Qual recurso?\",\"Cobrança consolidada do AWS Organizations\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"AWS Cost Explorer\",\"Analisa consumo histórico, agrupamentos e tendências.\",\"O gestor quer navegar interativamente pelo custo registrado por tag e mês. Qual ferramenta?\"],[\"AWS Budgets\",\"Acompanha valores e limites planejados, com notificações configuráveis.\",\"O financeiro quer avisar se o custo previsto superar o limite mensal acordado. Qual serviço?\"],[\"AWS Data Exports\",\"Entrega conjuntos detalhados de dados de custo e uso.\",\"O time quer alimentar seu próprio data warehouse com registros detalhados de uso. Qual recurso?\"],[\"AWS Cost Anomaly Detection\",\"Identifica gastos anormais em relação ao comportamento esperado.\",\"A intenção é detectar um padrão incomum de gastos sem partir de um valor fixo de orçamento. Qual serviço?\"],[\"Cobrança consolidada do AWS Organizations\",\"Coordena pagamento e visão agregada para contas da organização.\",\"A empresa quer pagar uma fatura agregada, mantendo contas distintas. Qual recurso?\"],[\"Tags de alocação de custos\",\"Associam custos elegíveis a rótulos de negócio quando ativadas.\",\"O time quer atribuir custos a produto com metadados em recursos. Qual recurso?\"],[\"AWS Cost Categories\",\"Agrupa custos com categorias e regras personalizadas.\",\"O financeiro precisa reunir contas e serviços em categorias como Comercial e Operações por regras próprias. Qual ferramenta?\"],[\"AWS Budgets\",\"Monitora gastos ou uso frente a limites planejados.\",\"A empresa já separou centros de custo e quer ser avisada quando um limite for superado. Qual?\"]]}],\"cards\":[{\"h\":\"4.2.1 · Cost Explorer, Budgets, Data Exports e anomalias\",\"items\":[\"Cost Explorer analisa tendências de custos e uso. Budgets oferece acompanhamento de limites e alertas conforme configuração. Data Exports permite entregar dados detalhados de cobrança para análise. Cost Anomaly Detection identifica padrões incomuns de gasto em monitores configurados.\",\"Escolha pela pergunta: investigar histórico, vigiar limite acordado, alimentar modelo analítico ou encontrar desvio inesperado. Considere atraso de processamento da cobrança na interpretação de alertas.\"],\"tone\":\"blue\"},{\"h\":\"4.2.2 · Cobrança consolidada, tags e alocação de custos\",\"items\":[\"Organizations permite cobrança consolidada para contas da organização sob a conta de gerenciamento. Tags de alocação, devidamente ativadas e aplicadas, ajudam a separar despesas por centro de custo. Cost Categories agrupam custos com regras de negócio. Orçamentos monitoram limites e não definem sozinhos a classificação.\",\"Separe pagador, classificação e visibilidade. Uma conta é uma fronteira administrativa, enquanto um centro de custos pode agregar diversas contas. Defina padrões de tags e trate recursos sem classificação.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Dado um aumento de custo, diga qual ferramenta detecta, qual investiga e qual fornece os dados que sustentam a análise externa.\",\"Reconcilie o custo por conta com o custo por produto e identifique a despesa sem dono.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Configurar um orçamento com alerta não impõe um teto rígido universal para a fatura.\",\"Cobrança consolidada não funde todas as contas nem elimina o acesso isolado dos times.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t4.3\",\"d\":4,\"k\":\"Recursos técnicos e opções de suporte\",\"title\":\"Recursos técnicos e opções de suporte\",\"sub\":\"Objetivos 4.3.1, 4.3.2\",\"desc\":\"Distinga incidente que requer suporte contratado, evento de serviço que já tem status, verificação de boas práticas e edição de um runbook com informação pública. Consulte a tabela de planos atual para nomes e SLA de primeira resposta.\",\"quick\":[[\"Uma empresa com cobertura quer abrir um caso de incidente de produção. Onde?\",\"AWS Support Center\"],[\"O cliente precisa esclarecer cobrança, sem solicitar diagnóstico técnico de aplicação. Qual canal por finalidade?\",\"Usar o suporte de conta e cobrança\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"AWS Support Center\",\"Abre e acompanha casos com os canais do plano contratado.\",\"Uma empresa com cobertura quer abrir um caso de incidente de produção. Onde?\"],[\"AWS Health Dashboard\",\"Apresenta eventos de serviço e eventos relevantes para recursos da conta.\",\"O time quer confirmar se uma manutenção afeta recursos específicos da conta. Onde?\"],[\"AWS Trusted Advisor\",\"Fornece recomendações baseadas em verificações disponíveis.\",\"A equipe deseja uma lista de oportunidades encontradas por verificações de melhores práticas. Onde?\"],[\"AWS re:Post\",\"Oferece fórum e conhecimento técnico comunitário.\",\"Um aluno quer consultar perguntas e respostas técnicas públicas sem abrir chamado. Onde?\"],[\"Usar o suporte de conta e cobrança\",\"Encaminha a demanda administrativa pelo canal correspondente.\",\"O cliente precisa esclarecer cobrança, sem solicitar diagnóstico técnico de aplicação. Qual canal por finalidade?\"],[\"Usar o plano de suporte técnico contratado\",\"Aciona cobertura técnica e canal compatível com a severidade.\",\"Um incidente de produção requer suporte técnico e canal com severidade. Qual caminho?\"],[\"Comparar planos com acompanhamento técnico de conta\",\"Considera acompanhamento proativo e recursos de gestão na oferta vigente.\",\"A organização precisa de acompanhamento técnico proativo por meio da oferta de suporte. Que requisito comparar na compra?\"],[\"Usar as verificações disponíveis no Trusted Advisor\",\"Identifica oportunidades e alertas previstos, conforme o acesso.\",\"O time quer sugestões de otimização a partir de verificações elegíveis, sem abrir um caso naquele momento. Qual recurso?\"]]}],\"cards\":[{\"h\":\"4.3.1 · Recursos técnicos, status da conta e canais de suporte\",\"items\":[\"O plano de suporte determina canais, cobertura e tempos de resposta conforme as condições vigentes. AWS Health indica eventos relacionados a serviços e recursos. Trusted Advisor oferece verificações e recomendações. re:Post fornece conhecimento comunitário para dúvidas e pesquisa.\",\"Distinga incidente que requer suporte contratado, evento de serviço que já tem status, verificação de boas práticas e edição de um runbook com informação pública. Consulte a tabela de planos atual para nomes e SLA de primeira resposta.\"],\"tone\":\"blue\"},{\"h\":\"4.3.2 · Planos de suporte e auxílio técnico por necessidade\",\"items\":[\"Compare a tabela vigente de planos pela cobertura, canais, tempos de resposta, criticidade e necessidade de acompanhamento técnico. Em novembro de 2026, a AWS documenta a transição de planos legados e ofertas como Business Support+, Enterprise Support e Unified Operations. Os nomes de provas ou materiais anteriores podem refletir outro período.\",\"Basic inclui recursos de autoatendimento e suporte para conta e cobrança. Para suporte técnico de produção, compare opções pagas e seus canais. Para atendimento estratégico e acompanhamento, consulte a tabela de serviços da oferta. Valide termos atuais antes de concluir elegibilidade.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Escolha o primeiro canal para quatro situações diferentes e identifique quando abrir um caso.\",\"Para cada cenário, identifique se há dúvida de cobrança, caso técnico crítico, necessidade de apoio proativo ou consulta de recomendações.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Um SLA de primeira resposta não é uma promessa de resolver o incidente no mesmo prazo.\",\"Um plano habilita canais de suporte e condições específicas; um SLA de resposta inicial não assegura a resolução naquele prazo.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"}],\"sources\":[[\"Guia oficial CLF-C02\",\"https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html\"],[\"Certificação e preparação oficial\",\"https://aws.amazon.com/pt/certification/certified-cloud-practitioner/\"],[\"AWS Well-Architected Framework\",\"https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html\"],[\"AWS Cloud Adoption Framework\",\"https://aws.amazon.com/pt/cloud-adoption-framework/\"],[\"Estratégias de migração\",\"https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html\"],[\"Responsabilidade compartilhada\",\"https://aws.amazon.com/pt/compliance/shared-responsibility-model/\"],[\"IAM — práticas recomendadas\",\"https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html\"],[\"AWS Organizations — conceitos\",\"https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html\"],[\"AWS Security — serviços\",\"https://aws.amazon.com/pt/security/\"],[\"AWS Artifact\",\"https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html\"],[\"Guia AWS CloudTrail\",\"https://docs.aws.amazon.com/pt_br/awscloudtrail/latest/userguide/cloudtrail-user-guide.html\"],[\"AWS Config\",\"https://docs.aws.amazon.com/pt_br/config/latest/developerguide/WhatIsConfig.html\"],[\"Infraestrutura global AWS\",\"https://aws.amazon.com/pt/about-aws/global-infrastructure/\"],[\"Produtos de computação\",\"https://aws.amazon.com/pt/products/compute/\"],[\"Bancos de dados AWS\",\"https://aws.amazon.com/pt/products/databases/\"],[\"Rede e entrega de conteúdo\",\"https://aws.amazon.com/pt/products/networking/\"],[\"Armazenamento AWS\",\"https://aws.amazon.com/pt/products/storage/\"],[\"Classes de armazenamento S3\",\"https://aws.amazon.com/pt/s3/storage-classes/\"],[\"Serviços de análise AWS\",\"https://aws.amazon.com/pt/big-data/datalakes-and-analytics/\"],[\"Inteligência artificial AWS\",\"https://aws.amazon.com/pt/ai/\"],[\"AWS CloudFormation\",\"https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html\"],[\"Preços AWS\",\"https://aws.amazon.com/pt/pricing/\"],[\"Savings Plans\",\"https://aws.amazon.com/pt/savingsplans/\"],[\"Análise com Cost Explorer\",\"https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html\"],[\"AWS Budgets\",\"https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/budgets-managing-costs.html\"],[\"AWS Pricing Calculator\",\"https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html\"],[\"Planos atuais de suporte AWS\",\"https://aws.amazon.com/pt/premiumsupport/plans/\"],[\"AWS Trusted Advisor\",\"https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/\"],[\"AWS Health\",\"https://docs.aws.amazon.com/pt_br/health/latest/ug/what-is-aws-health.html\"],[\"Transição de planos e prazos de suporte\",\"https://aws.amazon.com/pt/premiumsupport/faqs/\"],[\"Ferramentas para desenvolvedores\",\"https://aws.amazon.com/pt/products/developer-tools/\"],[\"Amazon WorkSpaces — desktops virtuais\",\"https://aws.amazon.com/pt/workspaces/\"],[\"AWS IoT Core\",\"https://aws.amazon.com/pt/iot-core/\"],[\"AWS Compute Optimizer\",\"https://aws.amazon.com/pt/compute-optimizer/\"]]};\nconst D=[{\"id\":1,\"name\":\"1 · Conceitos da nuvem\",\"pct\":\"24%\",\"color\":\"#2874c8\"},{\"id\":2,\"name\":\"2 · Segurança e conformidade\",\"pct\":\"30%\",\"color\":\"#19865b\"},{\"id\":3,\"name\":\"3 · Tecnologia e serviços da nuvem\",\"pct\":\"34%\",\"color\":\"#7654b5\"},{\"id\":4,\"name\":\"4 · Cobrança, preços e suporte\",\"pct\":\"12%\",\"color\":\"#c77918\"}];\nlet domain=1,current=null,query='';\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst rxEsc=s=>String(s).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');\n\nfunction rich(value){\n  const raw=String(value);\n  let out;\n  if(query){\n    const re=new RegExp('('+rxEsc(query)+')','ig');\n    out=raw.split(re).map(part=>part.toLowerCase()===query.toLowerCase()?`\u003cmark class=\"hit\">${esc(part)}\u003c/mark>`:esc(part)).join('');\n  }else{\n    out=esc(raw);\n  }\n  return out.replace(/`([^`]+)`/g,'\u003ccode>$1\u003c/code>');\n}\n\nconst allText=s=>[s.title,s.sub,s.desc,s.quick.flat().join(' '),s.cards.map(c=>c.h+' '+c.items.join(' ')).join(' '),s.tables.map(t=>t.h+' '+t.cols.join(' ')+t.rows.flat().join(' ')).join(' '),s.bottom.map(c=>c.h+' '+c.items.join(' ')).join(' '),s.final].join(' ').toLowerCase();\n\nfunction visible(){\n  return DATA.sheets.filter(s=>(query?allText(s).includes(query):s.d===domain));\n}\n\nfunction table(t,cls='compare'){\n  return `\u003csection class=\"section ${cls}\">\u003ch3>${rich(t.h)}\u003c/h3>\u003ctable>\u003cthead>\u003ctr>${t.cols.map(c=>`\u003cth>${rich(c)}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${t.rows.map(r=>`\u003ctr>${r.map(v=>`\u003ctd>${rich(v)}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/section>`;\n}\n\nfunction card(c){\n  let tone=c.tone||'blue';\n  return `\u003carticle class=\"card tone-${tone}\">\u003ch3>${rich(c.h)}\u003c/h3>\u003cul>${c.items.map(i=>`\u003cli>${rich(i)}\u003c/li>`).join('')}\u003c/ul>\u003c/article>`;\n}\n\nfunction renderSheet(s){\n  const d=D.find(x=>x.id===s.d);\n  return `\u003carticle class=\"sheet\" style=\"--accent:${d.color}\">\u003cdiv class=\"sheethead\">\u003cdiv class=\"eyebrow\">DOMÍNIO ${s.d} · ${d.pct} DO CONTEÚDO PONTUADO\u003c/div>\u003ch2>${rich(s.title)}\u003c/h2>\u003cdiv class=\"sub\">${rich(s.sub)}\u003c/div>\u003cp>${rich(s.desc)}\u003c/p>\u003c/div>${table({h:'⚡ DECISÃO RÁPIDA',cols:['Requisito / cenário','Escolha recomendada'],rows:s.quick},'decision')}\u003cdiv class=\"tables\">${s.tables.map(t=>table(t)).join('')}\u003c/div>\u003csection class=\"section\">\u003ch3>🧠 CONCEITOS, SERVIÇOS E PARÂMETROS\u003c/h3>\u003cdiv class=\"cards\">${s.cards.map(card).join('')}\u003c/div>\u003c/section>\u003csection class=\"section\">\u003ch3>🎯 REVISÃO FINAL E PEGADINHAS DE PROVA\u003c/h3>\u003cdiv class=\"bottom\">${s.bottom.map(card).join('')}\u003c/div>\u003c/section>\u003cdiv class=\"final\">${rich(s.final)}\u003c/div>\u003cdetails class=\"sources\">\u003csummary>Fontes oficiais para aprofundamento e verificação de limites\u003c/summary>\u003cdiv class=\"links\">${DATA.sources.map(x=>`\u003ca href=\"${esc(x[1])}\" target=\"_blank\" rel=\"noopener\">${rich(x[0])} ↗\u003c/a>`).join('')}\u003c/div>\u003c/details>\u003c/article>`;\n}\n\nfunction drawDomain(){\n  $('domains').innerHTML=D.map(x=>`\u003cbutton data-d=\"${x.id}\" aria-pressed=\"${x.id===domain}\" style=\"--accent:${x.color}\">${x.name} \u003cb>${x.pct}\u003c/b>\u003c/button>`).join('');\n  $('domains').querySelectorAll('button').forEach(b=>b.onclick=()=>{\n    domain=+b.dataset.d;query='';$('search').value='';drawNav();\n    const first=visible()[0];if(first)show(first.id);\n  });\n}\n\nfunction drawNav(){\n  const list=visible();\n  $('sheets').innerHTML=list.map(s=>`\u003cbutton data-id=\"${s.id}\" aria-pressed=\"${s.id===current}\">${query?`D${s.d} · `:''}${rich(s.k)}\u003c/button>`).join('')||'\u003cspan style=\"font-size:11px;color:var(--mu)\">Nenhum cheatsheet corresponde à busca.\u003c/span>';\n  $('sheets').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));\n  $('count').textContent=query?`${list.length} resultado(s) em todos os domínios · ${DATA.sheets.length} no total`:`${list.length} cheatsheets neste domínio · ${DATA.sheets.length} no total`;\n}\n\nfunction show(id,scroll=true){\n  const s=DATA.sheets.find(x=>x.id===id);if(!s)return;\n  current=id;domain=s.d;drawDomain();\n  $('app').classList.remove('print-all');\n  $('app').innerHTML=renderSheet(s);\n  drawNav();\n  if(scroll)$('app').scrollIntoView({behavior:'smooth',block:'start'});\n}\n\nfunction moveSheet(delta){\n  const list=visible();if(!list.length)return;\n  let idx=list.findIndex(x=>x.id===current);if(idx\u003c0)idx=0;\n  const next=list[(idx+delta+list.length)%list.length];\n  show(next.id);\n}\n\nfunction printAll(){\n  const saved=current;const y=window.scrollY;\n  $('app').classList.add('print-all');\n  $('app').innerHTML=DATA.sheets.map(renderSheet).join('');\n  setTimeout(()=>{\n    window.print();\n    $('app').classList.remove('print-all');\n    show(saved,false);\n    window.scrollTo(0,y);\n  },120);\n}\n\n$('search').addEventListener('input',e=>{\n  query=e.target.value.trim().toLowerCase();\n  drawNav();\n  const list=visible();\n  if(list.length)show(list[0].id,false);\n  else $('app').innerHTML='\u003cdiv class=\"empty\">Nenhum cheatsheet encontrado. Limpe a busca ou tente outro termo.\u003c/div>';\n});\n\n$('clear').onclick=()=>{\n  $('search').value='';query='';drawNav();\n  if(visible().length)show(visible()[0].id,false);\n};\n\n$('print').onclick=()=>window.print();\n$('printAll').onclick=printAll;\n\n$('theme').onclick=()=>{\n  let dark=document.documentElement.dataset.theme!=='dark';\n  document.documentElement.dataset.theme=dark?'dark':'light';\n  $('theme').textContent=dark?'☀ Tema claro':'☾ Tema escuro';\n};\n\ndocument.addEventListener('keydown',e=>{\n  if(e.altKey||e.ctrlKey||e.metaKey)return;\n  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;\n  const tag=(e.target&&e.target.tagName||'').toUpperCase();\n  if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target?.isContentEditable)return;\n  e.preventDefault();\n  moveSheet(e.key==='ArrowRight'?1:-1);\n});\n\ndrawDomain();\ndrawNav();\nshow(DATA.sheets[0].id,false);\n\nwindow.addEventListener('message', e => {\n  const msg = e.data || {};\n  if (msg.type === 'NAV_SHEET' && msg.id) {\n    if (msg.search) { $('search').value = msg.search; query = msg.search.toLowerCase(); }\n    else { $('search').value = ''; query = ''; }\n    show(msg.id, true);\n  } else if (msg.type === 'SET_THEME' && msg.theme) {\n    document.documentElement.dataset.theme = msg.theme;\n    $('theme').textContent = msg.theme === 'dark' ? '☀ Tema claro' : '☾ Tema escuro';\n  }\n});\n\u003c/script>\n\u003cscript>document.addEventListener('click',e=>{if(!e.target.closest('#theme, #themeBtn'))return;e.stopImmediatePropagation();parent.portalToggleTheme();},true);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.stopImmediatePropagation();e.preventDefault();parent.portalOpenSearch();}},true);\u003c/script>\u003cscript>addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='NAV_CHEATSHEET'){query='';document.getElementById('search').value='';show(e.data.id,false);}else if(e.data?.type==='SET_THEME'){document.documentElement.dataset.theme=e.data.theme;document.getElementById('theme').textContent=e.data.theme==='dark'?'☀ Tema claro':'☾ Tema escuro';}});\u003c/script>\u003c/body>\n\u003c/html>","mindmaps":"\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"description\" content=\"Mapas mentais interativos para a certificação AWS Certified Cloud Practitioner (CLF-C02).\">\n\u003ctitle>CLF-C02 · Mapas Mentais Completos\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;--bg:#f3f6fc;--card:#fff;--tx:#17233d;--mu:#5f6d88;--ln:#d7deed;--a:#2674d9;--ok:#1
