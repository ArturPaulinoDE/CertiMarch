de não transfere a responsabilidade pelo patch."],["O cliente que opera a instância","Em EC2, o sistema convidado e seus pacotes ficam sob gestão do cliente."],["A AWS como operadora do hipervisor","O controle do hipervisor não inclui aplicar patches no convidado."],["A auditoria do provedor","Avalia evidências, sem administrar o SO convidado."]]},{"id":"P-2.1.1-2","prompt":"A equipe usa Amazon RDS e precisa impedir que um novo analista leia a tabela financeira. Quem configura essa permissão?","solution":"O cliente que administra os acessos do banco","explanation":"RDS gerencia a infraestrutura, enquanto o cliente determina os usuários e privilégios.","options":[["O cliente que administra os acessos do banco","RDS gerencia a infraestrutura, enquanto o cliente determina os usuários e privilégios."],["O fornecedor do motor de banco","Fornecer software não dá responsabilidade pelos acessos da organização."],["Qualquer usuário do banco","Não deve poder conceder acesso sem privilégio administrativo."],["A AWS como responsável pelo hardware","O controle de infraestrutura não define quais pessoas leem tabelas."]]}],"cue":"Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?","answer":"Cliente no EC2","use":"Atende ao requisito. Administra patches do SO convidado e do software instalado.","avoid":"Gerenciado não significa que o provedor decide quem pode ler os dados.","example":"Liste as responsabilidades para hardware, SO convidado, motor de banco, credenciais e políticas de dados conforme a opção.","detail":[],"legacy":"ficha/2.1.1","params":[["Cliente no EC2","Administra patches do SO convidado e do software instalado.","Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?"],["AWS na infraestrutura","Protege instalações, hardware e componentes de virtualização.","A auditoria pergunta quem limita a entrada no prédio que abriga os servidores AWS. Qual responsabilidade?"],["AWS na camada gerenciada do RDS","Opera o sistema subjacente do serviço gerenciado.","Uma atualização do sistema operacional que sustenta o RDS faz parte de qual camada?"],["Cliente sobre dados e acesso","Determina políticas e permissões da organização, inclusive em serviço gerenciado.","Em um banco RDS, quem decide a quais usuários dar acesso às tabelas?"]],"notes":null},{"code":"2.1.2","id":"2.1.2","domain":2,"task":"2.1","title":"Controles herdados, compartilhados e específicos do cliente","concept":"Controles herdados são cobertos pelo provedor, como infraestrutura física. Controles compartilhados se aplicam em camadas distintas, por exemplo AWS corrige infraestrutura e cliente corrige o que administra. A implantação lógica e as permissões de aplicação dependem de requisitos do cliente.","control":"Evite usar a palavra compartilhado como divisão indiferenciada. Identifique a evidência associada à camada questionada. Relatórios da AWS apoiam a avaliação do fornecedor; os controles do workload também precisam de evidência própria.","pitfall":"Uma certificação de conformidade da AWS não certifica automaticamente a configuração do cliente.","verify":"Divida a revisão em evidências do provedor, controles gerenciados e decisões de configuração do cliente.","decisions":[["Controle herdado","A organização se apoia no controle que a AWS aplica à infraestrutura física."],["Controle compartilhado por camada","O mesmo tipo de controle existe em níveis de responsabilidade distintos."],["Controle específico do cliente","O cliente projeta ou configura conforme seus próprios requisitos."],["Evidência de conformidade do fornecedor","Relatórios da AWS documentam escopo de controles do provedor."]],"docs":[["Responsabilidade compartilhada","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"],["AWS Artifact","https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html"]],"scenarios":[{"id":"P-2.1.2-1","prompt":"O cliente inclui controle de acesso físico do datacenter em sua matriz, mas só a AWS o opera. Como classificar para o cliente?","solution":"Controle herdado","explanation":"O cliente se apoia em um controle da infraestrutura gerida pelo provedor.","options":[["Autorização delegada a um usuário IAM","IAM não controla entrada física no datacenter."],["Controle do aplicativo","A operação não está no código ou configuração do workload."],["Controle herdado","O cliente se apoia em um controle da infraestrutura gerida pelo provedor."],["Controle específico do cliente","O cliente não projeta nem executa a proteção física da AWS."]]},{"id":"P-2.1.2-2","prompt":"Na política de patches, AWS cuida da infraestrutura e o cliente do SO convidado de EC2. Qual classificação é apropriada?","solution":"Controle compartilhado por camada","explanation":"O tipo de controle existe em ambos os lados, em camadas distintas.","options":[["Controle exclusivamente herdado","O cliente ainda precisa corrigir o sistema convidado."],["Controle transferido integralmente ao cliente","A AWS continua responsável por sua infraestrutura."],["Controle apenas físico","Também abrange software do workload."],["Controle compartilhado por camada","O tipo de controle existe em ambos os lados, em camadas distintas."]]}],"cue":"Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?","answer":"Controle herdado","use":"Atende ao requisito. A organização se apoia no controle que a AWS aplica à infraestrutura física.","avoid":"Uma certificação de conformidade da AWS não certifica automaticamente a configuração do cliente.","example":"Divida a revisão em evidências do provedor, controles gerenciados e decisões de configuração do cliente.","detail":[],"legacy":"ficha/2.1.2","params":[["Controle herdado","A organização se apoia no controle que a AWS aplica à infraestrutura física.","Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?"],["Controle compartilhado por camada","O mesmo tipo de controle existe em níveis de responsabilidade distintos.","Patch no hipervisor e patches no SO convidado ilustram qual arranjo?"],["Controle específico do cliente","O cliente projeta ou configura conforme seus próprios requisitos.","A equipe desenha a política de segmentação de acesso aos dados da aplicação. Que tipo de controle?"],["Evidência de conformidade do fornecedor","Relatórios da AWS documentam escopo de controles do provedor.","Um auditor quer evidência formal de uma auditoria independente sobre a AWS. O que se busca?"]],"notes":null},{"code":"2.2.1","id":"2.2.1","domain":2,"task":"2.2","title":"Artifact, Audit Manager e evidências de conformidade","concept":"AWS Artifact fornece acesso sob demanda a relatórios de conformidade e acordos. AWS Audit Manager auxilia a coletar evidências e acompanhar avaliações. AWS Config registra configurações e avalia regras aplicáveis. CloudTrail registra ações das APIs cobertas.","control":"Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria.","pitfall":"Artefato do fornecedor não mostra se a própria aplicação configurou criptografia corretamente.","verify":"Para quatro perguntas de um auditor, indique qual produto fornece cada evidência.","decisions":[["AWS Artifact","Obtém relatórios e acordos de conformidade da AWS."],["AWS Audit Manager","Estrutura avaliações e coleta evidências de controles."],["AWS Config","Documenta configuração de recursos e avalia conformidade com regras."],["AWS CloudTrail","Registra quem fez chamadas às APIs e quando, conforme os eventos configurados."]],"docs":[["AWS Artifact","https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html"],["AWS Security — serviços","https://aws.amazon.com/pt/security/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.2.1-1","prompt":"O jurídico precisa baixar um relatório SOC sobre a AWS para avaliar o fornecedor. Não quer coletar logs da própria conta. Qual serviço?","solution":"AWS Artifact","explanation":"Distribui relatórios e acordos do provedor.","options":[["AWS Config","Mantém configuração dos recursos, não documentos do fornecedor."],["AWS Artifact","Distribui relatórios e acordos do provedor."],["Amazon Inspector","Avalia vulnerabilidades, não fornece o relatório SOC da AWS."],["AWS Audit Manager","Ajuda a estruturar avaliações e coletar evidência do ambiente."]]},{"id":"P-2.2.1-2","prompt":"Uma equipe precisa organizar a evidência de controles de várias contas em uma avaliação recorrente. Qual serviço foi feito para auxiliá-la?","solution":"AWS Audit Manager","explanation":"Estrutura avaliações e auxilia na coleta de evidências de controles.","options":[["AWS Artifact sozinho","Entrega relatórios da AWS e não agrega a avaliação do workload."],["Amazon CloudFront","Distribui conteúdo, não evidência de controles."],["AWS Audit Manager","Estrutura avaliações e auxilia na coleta de evidências de controles."],["AWS CloudFormation","Opera stacks de infraestrutura, sem organizar avaliação de auditoria."]]}],"cue":"O jurídico precisa acessar um relatório de auditoria SOC da AWS. Onde buscar?","answer":"AWS Artifact","use":"Atende ao requisito. Obtém relatórios e acordos de conformidade da AWS.","avoid":"Artefato do fornecedor não mostra se a própria aplicação configurou criptografia corretamente.","example":"Para quatro perguntas de um auditor, indique qual produto fornece cada evidência.","detail":[],"legacy":"ficha/2.2.1","params":[["AWS Artifact","Obtém relatórios e acordos de conformidade da AWS.","O jurídico precisa acessar um relatório de auditoria SOC da AWS. Onde buscar?"],["AWS Audit Manager","Estrutura avaliações e coleta evidências de controles.","O responsável por controles quer dar estrutura à coleta contínua de evidências da própria avaliação. Que serviço?"],["AWS Config","Documenta configuração de recursos e avalia conformidade com regras.","A questão é identificar quando um recurso passou a descumprir uma regra de configuração. Qual serviço?"],["AWS CloudTrail","Registra quem fez chamadas às APIs e quando, conforme os eventos configurados.","Quem alterou a política de um bucket às 15h? Qual fonte responde pela chamada?"]],"notes":null},{"code":"2.2.2","id":"2.2.2","domain":2,"task":"2.2","title":"CloudTrail, CloudWatch e AWS Config","concept":"CloudWatch acompanha métricas, logs e alarmes operacionais. CloudTrail registra atividade de API e chamadas. AWS Config acompanha estado de configuração e conformidade por regras. EventBridge pode encaminhar eventos e disparar ações, conforme as fontes e regras configuradas.","control":"Mapeie sintoma, evento causal e configuração atual. Uma taxa de erros alta é métrica. Alterar uma permissão é atividade de API. Um volume sem a configuração exigida é problema de conformidade. Encaminhar a notificação é outra etapa.","pitfall":"A métrica responde quanto e quando ocorreu um efeito, sem necessariamente identificar a identidade que o provocou.","verify":"Associe três evidências do mesmo incidente: alarme, autor da alteração e snapshot de configuração.","decisions":[["Amazon CloudWatch","Métricas, logs da aplicação e alarmes para o estado operacional."],["AWS CloudTrail","Atividade de API e trilha de ações de identidades nos eventos cobertos."],["AWS Config","Inventário, histórico e avaliação de configuração de recursos."],["Amazon EventBridge","Roteia eventos para destinos de acordo com regras."]],"docs":[["Guia AWS CloudTrail","https://docs.aws.amazon.com/pt_br/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"],["AWS Config","https://docs.aws.amazon.com/pt_br/config/latest/developerguide/WhatIsConfig.html"],["AWS Security — serviços","https://aws.amazon.com/pt/security/"]],"scenarios":[{"id":"P-2.2.2-1","prompt":"Uma API passa a retornar mais HTTP 500 à tarde. A equipe precisa ser notificada quando a métrica cruzar um limiar. Qual serviço?","solution":"Amazon CloudWatch","explanation":"Permite criar alarme sobre a métrica operacional.","options":[["AWS Artifact","Não analisa métricas nem gera esse alarme."],["Amazon CloudWatch","Permite criar alarme sobre a métrica operacional."],["AWS Config","Avalia configuração, não a taxa de respostas HTTP."],["Amazon Inspector","Encontra vulnerabilidades, sem monitorar o limiar operacional."]]},{"id":"P-2.2.2-2","prompt":"A política de acesso mudou e a equipe de segurança precisa saber qual sessão executou a chamada. Qual fonte?","solution":"AWS CloudTrail","explanation":"Registra atividade de gerenciamento e seu contexto de identidade.","options":[["AWS CloudTrail","Registra atividade de gerenciamento e seu contexto de identidade."],["Um grupo de segurança","Controla tráfego, sem registrar autoria de mudança via API."],["AWS Organizations como relatório","Organiza contas e controles, sem substituir trilha das chamadas."],["Amazon CloudWatch Metrics","Pode mostrar o efeito, não a identidade que mudou a política."]]}],"cue":"O time quer alarme para aumento de erros HTTP no serviço. O que usar?","answer":"Amazon CloudWatch","use":"Atende ao requisito. Métricas, logs da aplicação e alarmes para o estado operacional.","avoid":"A métrica responde quanto e quando ocorreu um efeito, sem necessariamente identificar a identidade que o provocou.","example":"Associe três evidências do mesmo incidente: alarme, autor da alteração e snapshot de configuração.","detail":[],"legacy":"ficha/2.2.2","params":[["Amazon CloudWatch","Métricas, logs da aplicação e alarmes para o estado operacional.","O time quer alarme para aumento de erros HTTP no serviço. O que usar?"],["AWS CloudTrail","Atividade de API e trilha de ações de identidades nos eventos cobertos.","A segurança precisa associar uma mudança de política a um principal. Qual fonte?"],["AWS Config","Inventário, histórico e avaliação de configuração de recursos.","Uma norma exige detectar volume que não está em conformidade com uma configuração. Qual serviço?"],["Amazon EventBridge","Roteia eventos para destinos de acordo com regras.","Uma aplicação deve entregar um evento já produzido a diferentes destinos conforme atributos. Qual serviço?"]],"notes":"2.2.2"},{"code":"2.2.3","id":"2.2.3","domain":2,"task":"2.2","title":"Criptografia, certificados e gestão de segredos","concept":"AWS KMS cria e controla chaves usadas por serviços e aplicações. Secrets Manager armazena segredos e oferece mecanismos de rotação integráveis. ACM emite ou importa certificados para integrações compatíveis. AWS Certificate Manager e KMS resolvem camadas distintas: identidade TLS e controle de chaves de criptografia.","control":"Mapeie qual segredo existe: senha da aplicação, chave que protege dado ou certificado que valida a sessão TLS. Compare quem pode usar, rodar, renovar, rotacionar e auditar o material.","pitfall":"Mover uma senha para Secrets Manager não concede permissão à aplicação para lê-la.","verify":"Separe controle de acesso, criptografia em repouso e sessão de rede.","decisions":[["AWS KMS","Gerencia e controla uso de chaves de criptografia."],["AWS Secrets Manager","Armazena segredos e oferece integração com rotação."],["AWS Certificate Manager","Gerencia certificados TLS/SSL em integrações compatíveis."],["AWS IAM","Determina quem pode executar ações sobre os recursos."]],"docs":[["IAM — práticas recomendadas","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["AWS Security — serviços","https://aws.amazon.com/pt/security/"]],"scenarios":[{"id":"P-2.2.3-1","prompt":"O time usa criptografia de objetos no S3 e precisa controlar e auditar o uso de chaves. Qual serviço administra esse material?","solution":"AWS KMS","explanation":"Gerencia chaves e políticas de uso compatíveis com SSE-KMS.","options":[["AWS Certificate Manager","Administra certificados, não chaves usadas pelo S3 para esse caso."],["AWS KMS","Gerencia chaves e políticas de uso compatíveis com SSE-KMS."],["AWS Secrets Manager","Gerencia segredos como senhas, sem ser o serviço de chaves SSE-KMS."],["Amazon Macie","Descobre dados sensíveis, sem fornecer a chave de criptografia."]]},{"id":"P-2.2.3-2","prompt":"Uma aplicação precisa recuperar a senha de banco e adotar um processo integrado de rotação. Qual serviço resolve essas duas necessidades?","solution":"AWS Secrets Manager","explanation":"Armazena o segredo e oferece mecanismos de rotação compatíveis.","options":[["AWS Secrets Manager","Armazena o segredo e oferece mecanismos de rotação compatíveis."],["AWS KMS isoladamente","Pode proteger dados, mas não armazena e roda a senha como segredo gerenciado."],["IAM Identity Center","Centraliza acesso humano à AWS, não distribui a senha da aplicação."],["AWS Artifact","Fornece documentação de conformidade, não segredos."]]}],"cue":"A organização quer gerenciar chaves usadas para criptografar objetos S3. Qual serviço?","answer":"AWS KMS","use":"Atende ao requisito. Gerencia e controla uso de chaves de criptografia.","avoid":"Mover uma senha para Secrets Manager não concede permissão à aplicação para lê-la.","example":"Separe controle de acesso, criptografia em repouso e sessão de rede.","detail":[],"legacy":"ficha/2.2.3","params":[["AWS KMS","Gerencia e controla uso de chaves de criptografia.","A organização quer gerenciar chaves usadas para criptografar objetos S3. Qual serviço?"],["AWS Secrets Manager","Armazena segredos e oferece integração com rotação.","Uma aplicação precisa recuperar uma senha de banco que roda periodicamente. O que usar?"],["AWS Certificate Manager","Gerencia certificados TLS/SSL em integrações compatíveis.","O time quer gerenciar um certificado de endpoint HTTPS integrado a um load balancer compatível. Qual serviço?"],["AWS IAM","Determina quem pode executar ações sobre os recursos.","O problema é determinar que identidade pode ler um segredo ou usar uma chave. Qual serviço modela o acesso?"]],"notes":null},{"code":"2.3.1","id":"2.3.1","domain":2,"task":"2.3","title":"Identidade de workloads, privilégios e root","concept":"IAM controla identidade e autorização. Uma role assumida usa credenciais temporárias. Workloads como EC2 e Lambda devem receber uma role adequada. A conta root tem privilégios amplos e deve ser protegida com MFA e reservada para tarefas específicas. Credenciais de longo prazo inerentes a usuários IAM exigem justificativa e administração.","control":"Distingua trust policy, que controla quem assume a role, de permission policy, que controla ações autorizadas após assumi-la. Princípio do menor privilégio inclui ações, recursos e condições. Para uma pessoa, prefira federação e sessões temporárias onde aplicável.","pitfall":"Colocar access keys de longo prazo no código ou na AMI cria exposição e rotação difícil.","verify":"Identifique quem executa, qual ação necessita, qual recurso pode acessar e como obtém as credenciais.","decisions":[["Role IAM com credenciais temporárias","Adequada a workloads e sessões que precisam assumir permissões."],["Usuário root protegido por MFA","Reservado a tarefas que exigem root e protegido pelo controle adicional."],["Política de permissões","Define ações, recursos e condições autorizados para a identidade."],["Política de confiança","Define quem pode assumir uma role."]],"docs":[["IAM — práticas recomendadas","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["Responsabilidade compartilhada","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"]],"scenarios":[{"id":"P-2.3.1-1","prompt":"Um aplicativo EC2 lê um prefixo do S3. A empresa quer credenciais temporárias sem chaves no código ou na imagem. Qual escolha?","solution":"Associar uma role IAM à instância","explanation":"A aplicação obtém credenciais temporárias com as permissões da role.","options":[["Abrir o prefixo publicamente","Evita autenticação à custa de expor o dado."],["Associar uma role IAM à instância","A aplicação obtém credenciais temporárias com as permissões da role."],["Compartilhar credenciais da conta root","Amplia privilégio e viola a separação de identidade."],["Embutir chaves de um usuário IAM na imagem","Cria segredo permanente distribuído a cada instância."]]},{"id":"P-2.3.1-2","prompt":"A conta acabou de ser criada. Há uma identidade que deve receber proteção forte e ficar reservada às tarefas que só ela pode realizar. Qual identidade?","solution":"Usuário root com MFA","explanation":"Root tem autoridade ampla e requer controles específicos.","options":[["Usuário root com MFA","Root tem autoridade ampla e requer controles específicos."],["Identidade federada de desenvolvedor","É para uso cotidiano com permissões atribuídas."],["Usuário de leitura de custos","É uma identidade operacional, não a reservada a tarefas exclusivas."],["Role de execução de Lambda","Executa o workload com privilégios próprios, sem ser o proprietário da conta."]]}],"cue":"Uma instância EC2 precisa ler objetos sem distribuir chaves permanentes para a aplicação. Qual escolha?","answer":"Role IAM com credenciais temporárias","use":"Atende ao requisito. Adequada a workloads e sessões que precisam assumir permissões.","avoid":"Colocar access keys de longo prazo no código ou na AMI cria exposição e rotação difícil.","example":"Identifique quem executa, qual ação necessita, qual recurso pode acessar e como obtém as credenciais.","detail":[],"legacy":"ficha/2.3.1","params":[["Role IAM com credenciais temporárias","Adequada a workloads e sessões que precisam assumir permissões.","Uma instância EC2 precisa ler objetos sem distribuir chaves permanentes para a aplicação. Qual escolha?"],["Usuário root protegido por MFA","Reservado a tarefas que exigem root e protegido pelo controle adicional.","Qual identidade deve usar MFA e permanecer reservada às tarefas exclusivas do proprietário da conta?"],["Política de permissões","Define ações, recursos e condições autorizados para a identidade.","A role já é assumida, mas precisa ser autorizada a ler apenas um recurso. Que tipo de política expressa o escopo?"],["Política de confiança","Define quem pode assumir uma role.","Qual política determina quais principais podem assumir uma role?"]],"notes":null},{"code":"2.3.2","id":"2.3.2","domain":2,"task":"2.3","title":"Acesso humano e gestão de múltiplas contas","concept":"AWS IAM Identity Center centraliza acesso de pessoas a contas e aplicações. AWS Organizations agrupa contas e aplica limites, como SCPs, a partir da estrutura organizacional. Uma SCP limita permissões possíveis nas contas aplicáveis e não concede acesso. AWS Control Tower ajuda a estabelecer e governar uma landing zone multi-account.","control":"Compare diretório, limites, permissões efetivas e provisionamento de contas. Permission sets mapeiam acesso em Identity Center. SCPs são controles organizacionais. Uma conta governada ainda precisa das permissões apropriadas no recurso.","pitfall":"Uma SCP de permissão máxima nunca substitui as políticas que efetivamente concedem acesso.","verify":"Desenhe uma sessão de pessoa em duas contas e um guardrail que vale para toda a OU.","decisions":[["AWS IAM Identity Center","Centraliza acesso humano federado e atribuições a contas."],["AWS Organizations com SCP","Aplica limites organizacionais a contas e OUs abrangidas."],["AWS Control Tower","Orquestra estabelecimento e governança de uma landing zone."],["Política IAM","Expressa as permissões da identidade, sujeitas aos demais limites."]],"docs":[["IAM — práticas recomendadas","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["AWS Organizations — conceitos","https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html"]],"scenarios":[{"id":"P-2.3.2-1","prompt":"Colaboradores precisam entrar em várias contas pela mesma experiência de login, com permissões diferentes em cada uma. Qual serviço?","solution":"AWS IAM Identity Center","explanation":"Centraliza acesso humano e atribuições a contas.","options":[["AWS IAM Identity Center","Centraliza acesso humano e atribuições a contas."],["AWS Direct Connect","Oferece conectividade dedicada, sem gerenciar identidades da empresa."],["Uma role única com credenciais permanentes para todos","Não atende federação e perfil por conta com rastreabilidade."],["AWS Config","Avalia configuração de recursos, não fornece portal federado."]]},{"id":"P-2.3.2-2","prompt":"Segurança quer bloquear uma ação para todas as contas-membro de uma OU, mesmo se alguém conceder essa ação em uma política local. Qual controle?","solution":"SCP do AWS Organizations","explanation":"Define o limite de permissões disponível no escopo organizacional.","options":[["Tag comum aplicada aos recursos","Rótulos não negam ações sem política associada."],["Política de senha local","Controla requisitos de credencial, não quais APIs são permitidas."],["Controle de acesso do bucket de logs","Limita um recurso, não a OU toda."],["SCP do AWS Organizations","Define o limite de permissões disponível no escopo organizacional."]]}],"cue":"Colaboradores precisam de um portal central para acessar várias contas com perfis distintos. Qual serviço?","answer":"AWS IAM Identity Center","use":"Atende ao requisito. Centraliza acesso humano federado e atribuições a contas.","avoid":"Uma SCP de permissão máxima nunca substitui as políticas que efetivamente concedem acesso.","example":"Desenhe uma sessão de pessoa em duas contas e um guardrail que vale para toda a OU.","detail":[],"legacy":"ficha/2.3.2","params":[["AWS IAM Identity Center","Centraliza acesso humano federado e atribuições a contas.","Colaboradores precisam de um portal central para acessar várias contas com perfis distintos. Qual serviço?"],["AWS Organizations com SCP","Aplica limites organizacionais a contas e OUs abrangidas.","O time central quer impedir uma ação em contas de uma OU inteira. Qual mecanismo?"],["AWS Control Tower","Orquestra estabelecimento e governança de uma landing zone.","Qual serviço ajuda a estabelecer uma landing zone multi-account com controles e criação governada de contas?"],["Política IAM","Expressa as permissões da identidade, sujeitas aos demais limites.","Uma SCP permite que a ação esteja disponível, mas o operador não a recebeu em sua role. O que concede a ação?"]],"notes":null},{"code":"2.4.1","id":"2.4.1","domain":2,"task":"2.4","title":"Detecção de ameaças, vulnerabilidades e postura","concept":"GuardDuty identifica sinais de ameaças a partir de fontes suportadas. Inspector avalia vulnerabilidades e exposições para workloads compatíveis. Security Hub agrega achados e auxilia no gerenciamento de postura. Macie identifica dados sensíveis em buckets S3.","control":"Escolha pela evidência: comportamento de ameaça, CVE, visão consolidada ou classificação de dados. Uma ferramenta pode gerar achados consumidos por outra. Investigue a causa e trate o recurso correspondente em vez de confundir centralização com geração do achado.","pitfall":"Macie não é um scanner genérico de imagens de contêiner nem um serviço de firewall.","verify":"Use uma tabela de incidentes fictícios e identifique o primeiro serviço a acionar e onde consolidar o achado.","decisions":[["Amazon GuardDuty","Detecta sinais de atividades potencialmente maliciosas."],["Amazon Inspector","Identifica vulnerabilidades em workloads compatíveis."],["AWS Security Hub","Centraliza achados e controles de postura."],["Amazon Macie","Descobre e classifica dados sensíveis no S3."]],"docs":[["AWS Security — serviços","https://aws.amazon.com/pt/security/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.4.1-1","prompt":"Segurança quer identificar sinais de atividade maliciosa pelo comportamento observado em fontes compatíveis de conta e rede. Qual serviço focar?","solution":"Amazon GuardDuty","explanation":"Analisa sinais de ameaças em fontes suportadas.","options":[["Amazon Inspector","Prioriza vulnerabilidades de workloads, que são outro tipo de evidência."],["AWS Artifact","Fornece documentos do provedor, sem detectar comportamento."],["AWS Shield como scanner de credenciais","Proteção DDoS não é detecção de atividade suspeita de credencial."],["Amazon GuardDuty","Analisa sinais de ameaças em fontes suportadas."]]},{"id":"P-2.4.1-2","prompt":"Um time publica imagens em um repositório compatível. Antes do deploy, quer identificar CVEs nos pacotes da imagem. Qual serviço?","solution":"Amazon Inspector","explanation":"Avalia vulnerabilidades de imagens compatíveis.","options":[["AWS Health","Mostra eventos de serviço, não pacotes vulneráveis na imagem."],["Amazon Macie","Busca dados sensíveis em objetos S3, não CVEs de pacotes."],["AWS WAF","Filtra solicitações HTTP, sem avaliar bibliotecas em imagens."],["Amazon Inspector","Avalia vulnerabilidades de imagens compatíveis."]]}],"cue":"A equipe quer detectar atividade de ameaça a partir de fontes como eventos e fluxos compatíveis. Qual serviço?","answer":"Amazon GuardDuty","use":"Atende ao requisito. Detecta sinais de atividades potencialmente maliciosas.","avoid":"Macie não é um scanner genérico de imagens de contêiner nem um serviço de firewall.","example":"Use uma tabela de incidentes fictícios e identifique o primeiro serviço a acionar e onde consolidar o achado.","detail":[],"legacy":"ficha/2.4.1","params":[["Amazon GuardDuty","Detecta sinais de atividades potencialmente maliciosas.","A equipe quer detectar atividade de ameaça a partir de fontes como eventos e fluxos compatíveis. Qual serviço?"],["Amazon Inspector","Identifica vulnerabilidades em workloads compatíveis.","A equipe quer identificar CVEs em imagens de contêiner compatíveis. Qual serviço?"],["AWS Security Hub","Centraliza achados e controles de postura.","A segurança quer consolidar achados de serviços de proteção e monitorar postura. Qual serviço?"],["Amazon Macie","Descobre e classifica dados sensíveis no S3.","É necessário localizar números de identificação pessoal em objetos do S3. Qual serviço?"]],"notes":null},{"code":"2.4.2","id":"2.4.2","domain":2,"task":"2.4","title":"WAF, Shield, Firewall Manager e controles de rede","concept":"AWS WAF protege aplicações web por regras de camada HTTP. AWS Shield oferece proteção contra DDoS. Firewall Manager auxilia a aplicar políticas de firewall centralmente em múltiplas contas. Grupos de segurança controlam tráfego de rede de recursos associados por regras stateful.","control":"Localize a camada e a escala: conteúdo HTTP, inundação volumétrica, governança em contas ou tráfego de interfaces. Regras HTTP podem filtrar padrões de requisições. As políticas multi-account podem coordenar as configurações desses controles compatíveis.","pitfall":"WAF não é a resposta automática a qualquer pergunta sobre tráfego ou rede.","verify":"Classifique quatro demandas: padrão HTTP, DDoS, gestão central e porta do banco.","decisions":[["AWS WAF","Filtra requisições web em pontos de integração compatíveis."],["AWS Shield","Protege workloads compatíveis contra DDoS."],["AWS Firewall Manager","Aplica e gerencia políticas de firewall centralmente em várias contas."],["Security group","Controla fluxos de rede dos recursos associados com regras stateful."]],"docs":[["AWS Security — serviços","https://aws.amazon.com/pt/security/"],["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-2.4.2-1","prompt":"O site tem de bloquear requisições HTTP por padrões no cabeçalho. Não basta controlar endereços ou portas. Qual serviço?","solution":"AWS WAF","explanation":"As regras analisam atributos de requisições web em integrações suportadas.","options":[["Amazon Inspector","Avalia vulnerabilidades, não aplica essas regras no tráfego."],["Network ACL","Filtra por critérios de rede, sem inspecionar cabeçalho HTTP."],["AWS WAF","As regras analisam atributos de requisições web em integrações suportadas."],["AWS KMS","Gerencia chaves; não inspeciona solicitações."]]},{"id":"P-2.4.2-2","prompt":"Um endpoint público precisa de proteção contra tráfego de ataque distribuído. A preocupação é manter disponibilidade sob DDoS. Qual oferta?","solution":"AWS Shield","explanation":"Protege contra ataques distribuídos de negação de serviço conforme cobertura.","options":[["AWS Shield","Protege contra ataques distribuídos de negação de serviço conforme cobertura."],["Amazon Macie","Classifica dados em S3, não protege endpoint contra inundação."],["AWS Config","Avalia conformidade de recursos, sem tratar a sobrecarga em trânsito."],["AWS Secrets Manager","Protege segredos, sem mitigar volume de tráfego externo."]]}],"cue":"A equipe precisa bloquear padrões maliciosos em solicitações HTTP ao site. Qual serviço?","answer":"AWS WAF","use":"Atende ao requisito. Filtra requisições web em pontos de integração compatíveis.","avoid":"WAF não é a resposta automática a qualquer pergunta sobre tráfego ou rede.","example":"Classifique quatro demandas: padrão HTTP, DDoS, gestão central e porta do banco.","detail":[],"legacy":"ficha/2.4.2","params":[["AWS WAF","Filtra requisições web em pontos de integração compatíveis.","A equipe precisa bloquear padrões maliciosos em solicitações HTTP ao site. Qual serviço?"],["AWS Shield","Protege workloads compatíveis contra DDoS.","A preocupação dominante é proteção contra ataques distribuídos de negação de serviço. Qual oferta?"],["AWS Firewall Manager","Aplica e gerencia políticas de firewall centralmente em várias contas.","Um administrador quer políticas AWS WAF consistentes em diversas contas. Qual serviço coordena a aplicação?"],["Security group","Controla fluxos de rede dos recursos associados com regras stateful.","O acesso à porta do banco deve ser permitido somente ao grupo das instâncias de aplicação. Qual mecanismo?"]],"notes":null},{"code":"2.4.3","id":"2.4.3","domain":2,"task":"2.4","title":"Segurança em profundidade e acesso a sub-redes","concept":"Security groups controlam fluxos nas interfaces e são stateful. Network ACLs se aplicam no limite da sub-rede, podem permitir e negar e são stateless. WAF atua sobre requisições de aplicação. IAM controla quem pode usar APIs e administrar recursos.","control":"Decida pelo alcance: recurso, sub-rede, requisição ou identidade. No controle stateless, permita o retorno conforme o contrato. Uma regra de segurança em uma camada não amplia acesso quando outra camada nega.","pitfall":"Security groups permitem tráfego por regras de allow. Bloqueio explícito por faixa é característica de Network ACL quando aplicado à sub-rede.","verify":"Dado um acesso a um site, decomponha as decisões por camada e identifique onde evidenciar o efeito.","decisions":[["Security group","Filtra tráfego de recursos associados com comportamento stateful."],["Network ACL","Filtra entrada e saída na sub-rede com regras explícitas e comportamento stateless."],["AWS WAF","Inspeciona padrões em solicitações web."],["AWS IAM","Controla ações da API de acordo com a identidade e a autorização."]],"docs":[["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"],["AWS Security — serviços","https://aws.amazon.com/pt/security/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-2.4.3-1","prompt":"O time quer negar explicitamente uma faixa inteira na entrada de uma sub-rede. O controle precisa operar no limite da sub-rede. Qual usar?","solution":"Network ACL","explanation":"Suporta regras de permitir e negar no escopo da sub-rede.","options":[["Controle IAM sobre criação de regras","Autoriza ações administrativas, sem aplicar o filtro de tráfego desejado."],["Network ACL","Suporta regras de permitir e negar no escopo da sub-rede."],["Security group com regra de negação","Security groups usam regras de permissão e atuam no recurso."],["AWS WAF para todo o tráfego de sub-rede","Atua em requisições web, não no limite genérico da sub-rede."]]},{"id":"P-2.4.3-2","prompt":"Somente o grupo das instâncias de aplicação deve conectar à porta de um banco. Respostas de conexões permitidas não exigirão outra regra correspondente. Qual escolha?","solution":"Security group do banco","explanation":"Controla o recurso com comportamento stateful e pode referenciar o grupo de origem.","options":[["Resolução DNS privada","Localiza o banco, mas não impõe a regra de origem e porta."],["Security group do banco","Controla o recurso com comportamento stateful e pode referenciar o grupo de origem."],["Network ACL com estado de conexão","Network ACL é stateless e não opera pela associação de grupos indicada."],["Política de confiança IAM","Autoriza assunção de role, sem controlar conexão TCP."]]}],"cue":"O controle precisa negar uma faixa no limite da sub-rede. Qual mecanismo?","answer":"Network ACL","use":"Atende ao requisito. Filtra entrada e saída na sub-rede com regras explícitas e comportamento stateless.","avoid":"Security groups permitem tráfego por regras de allow. Bloqueio explícito por faixa é característica de Network ACL quando aplicado à sub-rede.","example":"Dado um acesso a um site, decomponha as decisões por camada e identifique onde evidenciar o efeito.","detail":[],"legacy":"ficha/2.4.3","params":[["Security group","Filtra tráfego de recursos associados com comportamento stateful.","Um DB deve aceitar conexões TCP apenas de recursos de um grupo de aplicação. Qual mecanismo?"],["Network ACL","Filtra entrada e saída na sub-rede com regras explícitas e comportamento stateless.","O controle precisa negar uma faixa no limite da sub-rede. Qual mecanismo?"],["AWS WAF","Inspeciona padrões em solicitações web.","A regra depende de um parâmetro da URL HTTP e não do IP ou da porta. Qual controle?"],["AWS IAM","Controla ações da API de acordo com a identidade e a autorização.","A exigência é impedir que um operador altere regras de rede pela console. Em qual controle atuar?"]],"notes":null},{"code":"3.1.1","id":"3.1.1","domain":3,"task":"3.1","title":"Console, CLI, SDK e infraestrutura como código","concept":"A console fornece interface web. A CLI executa operações por comando ou script. SDKs integram chamadas AWS no código. CloudFormation define recursos e dependências declarativamente, com stacks e mudança rastreável.","control":"Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro.","pitfall":"CLI automatiza ações, mas seu uso por si só não descreve a configuração inteira como um estado declarativo.","verify":"Classifique uma tarefa de operação em cada categoria e identifique onde guardar a definição.","decisions":[["AWS Management Console","Interface gráfica para uso humano e operações pontuais."],["AWS CLI","Interface de comandos para rotinas interativas ou scripts."],["AWS SDK","Bibliotecas para chamar serviços no código de uma aplicação."],["AWS CloudFormation","Templates declarativos e ciclo de vida de stacks."]],"docs":[["AWS CloudFormation","https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.1.1-1","prompt":"Uma analista está começando na AWS e quer explorar recursos e seus atributos usando o navegador. A empresa ainda não precisa automatizar a consulta. Qual interface usar?","solution":"AWS Management Console","explanation":"A interface web permite navegar pelos serviços e consultar os recursos da conta.","options":[["AWS Management Console","A interface web permite navegar pelos serviços e consultar os recursos da conta."],["AWS CLI","Exige executar comandos em um terminal."],["AWS SDK para Python","É uma biblioteca para código de aplicação."],["AWS CloudFormation","Provisiona recursos a partir de templates."]]},{"id":"P-3.1.1-2","prompt":"Uma equipe quer incluir redes e funções em uma revisão de código e reproduzir o ambiente em outra conta. Precisa declarar recursos e dependências. Qual serviço atende?","solution":"AWS CloudFormation","explanation":"O template declarativo descreve os recursos e a stack acompanha suas dependências.","options":[["AWS Systems Manager","Executa operações em recursos gerenciados, sem representar toda a infraestrutura da stack."],["AWS CodeBuild","Compila e testa código, mas não define o ciclo de vida desses recursos."],["AWS CloudTrail","Registra chamadas de API para auditoria."],["AWS CloudFormation","O template declarativo descreve os recursos e a stack acompanha suas dependências."]]}],"cue":"Um profissional precisa explorar recursos de uma conta por interface visual. Qual meio?","answer":"AWS Management Console","use":"Atende ao requisito. Interface gráfica para uso humano e operações pontuais.","avoid":"CLI automatiza ações, mas seu uso por si só não descreve a configuração inteira como um estado declarativo.","example":"Classifique uma tarefa de operação em cada categoria e identifique onde guardar a definição.","detail":[],"legacy":"ficha/3.1.1","params":[["AWS Management Console","Interface gráfica para uso humano e operações pontuais.","Um profissional precisa explorar recursos de uma conta por interface visual. Qual meio?"],["AWS CLI","Interface de comandos para rotinas interativas ou scripts.","Um script de terminal lista buckets periodicamente e executa comandos assinados. Qual interface?"],["AWS SDK","Bibliotecas para chamar serviços no código de uma aplicação.","Um aplicativo Java precisa chamar um serviço AWS por biblioteca oficial. Qual interface?"],["AWS CloudFormation","Templates declarativos e ciclo de vida de stacks.","A infraestrutura deve ser replicada e revisada como definição declarativa. Qual meio?"]],"notes":null},{"code":"3.1.2","id":"3.1.2","domain":3,"task":"3.1","title":"Implantação em nuvem, híbrida e local","concept":"Na nuvem, a carga usa infraestrutura do provedor. Híbrido integra recursos locais e da nuvem no mesmo processo. On-premises mantém recursos no local. Outposts estende serviços e infraestrutura AWS compatíveis para instalações do cliente, dentro de seus requisitos operacionais.","control":"Pergunte onde executam compute e dados e se existe integração operacional entre ambientes. Restrições de latência, dependências antigas ou residência podem exigir presença local ainda que outras partes migrem.","pitfall":"Usar AWS em uma Região não torna a arquitetura híbrida se nenhum componente operacional permanece fora dela.","verify":"Trace o caminho de uma transação, destacando em qual ambiente estão aplicação, banco e operação.","decisions":[["Cloud-only","Os componentes do workload operam na AWS sem dependências locais descritas."],["Híbrido","Componentes locais e AWS operam de forma integrada."],["On-premises","A carga permanece em infraestrutura local."],["AWS Outposts","Estende infraestrutura e serviços AWS compatíveis para o local."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-3.1.2-1","prompt":"Uma fábrica mantém o banco de ordens no próprio datacenter por exigência da operação, mas sua API pública já roda na AWS. Cada pedido usa os dois ambientes. Qual modelo foi adotado?","solution":"Implantação híbrida","explanation":"A arquitetura integra recursos locais e serviços de nuvem no mesmo fluxo.","options":[["Implantação multirregional","A descrição não exige duas Regiões AWS."],["Implantação inteiramente em nuvem","O banco continuaria dependente do datacenter, fora dessa definição."],["Implantação inteiramente local","O processamento da API está na AWS."],["Implantação híbrida","A arquitetura integra recursos locais e serviços de nuvem no mesmo fluxo."]]},{"id":"P-3.1.2-2","prompt":"A empresa precisa manter a computação no chão de fábrica e quer operar serviços AWS compatíveis com as mesmas ferramentas usadas na Região. Qual oferta avaliar?","solution":"AWS Outposts","explanation":"Leva infraestrutura e serviços compatíveis da AWS para instalações do cliente.","options":[["AWS Outposts","Leva infraestrutura e serviços compatíveis da AWS para instalações do cliente."],["AWS Local Zones","Oferecem capacidade em locais metropolitanos operados pela AWS."],["Amazon CloudFront","Aproxima a entrega de conteúdo em cache, sem executar a carga local pedida."],["AWS Direct Connect","Fornece conectividade dedicada, sem instalar computação da AWS na fábrica."]]}],"cue":"A API opera na AWS e usa o banco da fábrica que permanece local. Qual modelo?","answer":"Híbrido","use":"Atende ao requisito. Componentes locais e AWS operam de forma integrada.","avoid":"Usar AWS em uma Região não torna a arquitetura híbrida se nenhum componente operacional permanece fora dela.","example":"Trace o caminho de uma transação, destacando em qual ambiente estão aplicação, banco e operação.","detail":[],"legacy":"ficha/3.1.2","params":[["Cloud-only","Os componentes do workload operam na AWS sem dependências locais descritas.","Aplicação e dados operam inteiramente em recursos AWS. Qual modelo foi descrito?"],["Híbrido","Componentes locais e AWS operam de forma integrada.","A API opera na AWS e usa o banco da fábrica que permanece local. Qual modelo?"],["On-premises","A carga permanece em infraestrutura local.","Processamento e dados permanecem exclusivamente no datacenter privado da organização, sem serviços AWS. Qual modelo?"],["AWS Outposts","Estende infraestrutura e serviços AWS compatíveis para o local.","A empresa precisa de serviços compatíveis da AWS no próprio datacenter por baixa latência local. Qual opção avaliar?"]],"notes":null},{"code":"3.2.1","id":"3.2.1","domain":3,"task":"3.2","title":"Regiões, zonas, edge e critérios geográficos","concept":"Uma Região é uma área geográfica. Uma Availability Zone agrupa um ou mais datacenters isolados de outras zonas, com conectividade de baixa latência na Região. Pontos de presença entregam serviços de borda. Escolher Região envolve residência, proximidade, custo e disponibilidade de serviços.","control":"Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário.","pitfall":"Usar CloudFront não replica automaticamente o banco entre Regiões.","verify":"Explique separadamente localização dos dados, borda de entrega e domínio de falha.","decisions":[["Região AWS","Escolha geográfica para residência, latência e serviços disponíveis."],["Availability Zone","Domínio isolado de falha dentro de uma Região."],["Edge location","Ponto de presença para aproximar serviços de entrega dos usuários."],["Estratégia Multi-Region","Opera ou recupera workloads em mais de uma Região quando requisitos justificam."]],"docs":[["Infraestrutura global AWS","https://aws.amazon.com/pt/about-aws/global-infrastructure/"],["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-3.2.1-1","prompt":"Uma empresa tem obrigação de selecionar uma localização da AWS no país exigido para os dados primários de seu banco. Que conceito do catálogo identifica essa área geográfica?","solution":"Região AWS","explanation":"É a área geográfica escolhida para recursos regionais e engloba Availability Zones.","options":[["Availability Zone isolada","É uma subdivisão da Região, normalmente usada depois de escolher a geografia."],["Edge location","Atende tráfego em borda e não identifica a área de implantação de um banco regional."],["Sub-rede privada","Segmenta endereços e alcance de rede dentro de uma VPC."],["Região AWS","É a área geográfica escolhida para recursos regionais e engloba Availability Zones."]]},{"id":"P-3.2.1-2","prompt":"Um site de notícias mantém sua origem em uma Região, mas quer servir cópias em cache aos leitores em continentes diferentes. Qual infraestrutura serve o cache mais perto do usuário?","solution":"Edge locations do CloudFront","explanation":"A rede de borda entrega conteúdo a partir de pontos próximos do público.","options":[["Instalações AWS Outposts","Estendem serviços para instalações específicas de clientes."],["Sub-redes em uma VPC","Organizam recursos internos, sem distribuir cache para leitores internacionais."],["Volumes por Availability Zone","Isolam armazenamento de bloco e não são pontos de entrega global."],["Edge locations do CloudFront","A rede de borda entrega conteúdo a partir de pontos próximos do público."]]}],"cue":"Uma lei determina um país para armazenar dados primários. Que nível geográfico selecionar?","answer":"Região AWS","use":"Atende ao requisito. Escolha geográfica para residência, latência e serviços disponíveis.","avoid":"Usar CloudFront não replica automaticamente o banco entre Regiões.","example":"Explique separadamente localização dos dados, borda de entrega e domínio de falha.","detail":[],"legacy":"ficha/3.2.1","params":[["Região AWS","Escolha geográfica para residência, latência e serviços disponíveis.","Uma lei determina um país para armazenar dados primários. Que nível geográfico selecionar?"],["Availability Zone","Domínio isolado de falha dentro de uma Região.","A ideia é separar componentes para que uma falha localizada não derrube os dois dentro da mesma Região. Qual unidade?"],["Edge location","Ponto de presença para aproximar serviços de entrega dos usuários.","A empresa quer entregar conteúdo em cache próximo dos usuários internacionais. Qual infraestrutura?"],["Estratégia Multi-Region","Opera ou recupera workloads em mais de uma Região quando requisitos justificam.","O requisito inclui indisponibilidade prolongada de toda uma Região. Qual escopo planejar?"]],"notes":null},{"code":"3.3.1","id":"3.3.1","domain":3,"task":"3.3","title":"EC2, Lambda, containers e Fargate","concept":"EC2 fornece capacidade de máquinas virtuais e controle do sistema convidado. Lambda executa funções orientadas a eventos em limites gerenciados. ECS e EKS orquestram contêineres; Fargate é opção de capacidade gerenciada compatível com ambos, conforme workload e configuração.","control":"Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda.","pitfall":"Fargate não é um orquestrador substituto de ECS ou EKS.","verify":"Identifique duração, estado, necessidade de acesso ao host e padrão de ativação.","decisions":[["Amazon EC2","Máquinas virtuais para workloads que exigem controle do ambiente de instância."],["AWS Lambda","Funções gerenciadas disparadas por invocação ou eventos."],["AWS Fargate","Capacidade computacional gerenciada para contêineres nas integrações compatíveis."],["Amazon EKS","Kubernetes gerenciado, com opções de compute distintas."]],"docs":[["Produtos de computação","https://aws.amazon.com/pt/products/compute/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.3.1-1","prompt":"Um fornecedor exige uma versão específica de Linux e a instalação de um agente que roda como serviço do sistema. A equipe aceita operar a máquina virtual. Qual serviço usar?","solution":"Amazon EC2","explanation":"A instância permite escolher a AMI e administrar o sistema convidado.","options":[["AWS Fargate","Executa contêineres sem expor o host subjacente."],["Amazon EC2","A instância permite escolher a AMI e administrar o sistema convidado."],["Amazon Aurora","É um banco gerenciado, sem acesso administrativo ao sistema operacional do host."],["AWS Lambda","O modelo de função não oferece administração do host para instalar esse serviço."]]},{"id":"P-3.3.1-2","prompt":"Ao chegar uma foto a um bucket, uma rotina curta valida seu tamanho. Não há processamento fora dos eventos e o código não precisa de processos persistentes. Qual serviço executar?","solution":"AWS Lambda","explanation":"O S3 pode notificar a função e a equipe não precisa operar servidores para o handler.","options":[["Amazon CloudFront Functions","Roda em eventos de requisição e resposta do CloudFront, não na chegada de objetos ao bucket."],["AWS Batch com frota dedicada","O requisito não demanda uma plataforma de filas de jobs nem capacidade dedicada."],["Amazon ECS em EC2","Pode executar um consumidor, acrescentando operação de serviço e nós para o caso descrito."],["AWS Lambda","O S3 pode notificar a função e a equipe não precisa operar servidores para o handler."]]}],"cue":"Um software exige escolher SO e instalar um agente diretamente no sistema convidado. Qual escolha?","answer":"Amazon EC2","use":"Atende ao requisito. Máquinas virtuais para workloads que exigem controle do ambiente de instância.","avoid":"Fargate não é um orquestrador substituto de ECS ou EKS.","example":"Identifique duração, estado, necessidade de acesso ao host e padrão de ativação.","detail":[],"legacy":"ficha/3.3.1","params":[["Amazon EC2","Máquinas virtuais para workloads que exigem controle do ambiente de instância.","Um software exige escolher SO e instalar um agente diretamente no sistema convidado. Qual escolha?"],["AWS Lambda","Funções gerenciadas disparadas por invocação ou eventos.","Ao chegar um objeto, uma tarefa curta ajusta metadados. Qual serviço?"],["AWS Fargate","Capacidade computacional gerenciada para contêineres nas integrações compatíveis.","As tarefas já são contêineres ECS e a equipe não quer operar nós. Qual capacidade?"],["Amazon EKS","Kubernetes gerenciado, com opções de compute distintas.","A equipe quer manter os manifests e a API Kubernetes com plano de controle gerenciado. Qual serviço?"]],"notes":"3.3.1"},{"code":"3.3.2","id":"3.3.2","domain":3,"task":"3.3","title":"Integração de capacidade e tráfego na aplicação","concept":"Auto Scaling adapta a capacidade de um grupo. ELB encaminha conexões aos alvos saudáveis. Um ALB trabalha com HTTP/HTTPS e pode roteá-los por atributos de aplicação; NLB trabalha na camada de transporte para protocolos compatíveis.","control":"Diferencie crescer a capacidade, encaminhar tráfego de aplicação, distribuir transporte e publicar conteúdo global em cache. Use health checks e políticas calibradas ao requisito.","pitfall":"Instalar um balanceador não altera a quantidade de instâncias sem integração de escala.","verify":"Simule um alvo não saudável e uma subida de tráfego; observe quais componentes agem.","decisions":[["EC2 Auto Scaling","Ajusta capacidade de um grupo de instâncias."],["Application Load Balancer","Balanceia tráfego HTTP e encaminha por host ou caminho, conforme regras."],["Network Load Balancer","Balanceia tráfego de transporte para protocolos como TCP."],["Amazon CloudFront","Entrega conteúdo globalmente por uma distribuição de borda."]],"docs":[["Produtos de computação","https://aws.amazon.com/pt/products/compute/"],["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-3.3.2-1","prompt":"Um grupo EC2 fica saturado no pico de cada manhã. O balanceador já distribui conexões, mas o grupo deve aumentar e diminuir a quantidade de instâncias conforme a demanda. O que configurar?","solution":"Amazon EC2 Auto Scaling","explanation":"Gerencia a capacidade desejada e inclui ou retira instâncias por política.","options":[["Amazon Route 53 failover","Pode alterar respostas DNS conforme integridade, sem lançar instâncias."],["Application Load Balancer","Distribui pedidos entre alvos, sem definir o tamanho do grupo."],["AWS CloudFormation Change Sets","Mostram mudanças de infraestrutura propostas, sem escalar com uma métrica."],["Amazon EC2 Auto Scaling","Gerencia a capacidade desejada e inclui ou retira instâncias por política."]]},{"id":"P-3.3.2-2","prompt":"A aplicação usa o mesmo domínio para pagamentos e pedidos. O balanceador deve enviar cada caminho HTTP a um grupo de destino diferente. Qual escolher?","solution":"Application Load Balancer","explanation":"Suporta roteamento por caminho de URL na camada de aplicação.","options":[["Gateway Load Balancer","Integra appliances de rede, sem oferecer roteamento de aplicação por caminho."],["Roteamento ponderado no Route 53","Aplica-se a consultas DNS, cujo conteúdo não inclui o caminho da URL."],["Application Load Balancer","Suporta roteamento por caminho de URL na camada de aplicação."],["Network Load Balancer","Balanceia no nível de transporte, sem inspecionar o caminho HTTP para escolher o alvo."]]}],"cue":"Um grupo deve aumentar e diminuir a quantidade de EC2 com base em demanda. Qual componente?","answer":"EC2 Auto Scaling","use":"Atende ao requisito. Ajusta capacidade de um grupo de instâncias.","avoid":"Instalar um balanceador não altera a quantidade de instâncias sem integração de escala.","example":"Simule um alvo não saudável e uma subida de tráfego; observe quais componentes agem.","detail":[],"legacy":"ficha/3.3.2","params":[["EC2 Auto Scaling","Ajusta capacidade de um grupo de instâncias.","Um grupo deve aumentar e diminuir a quantidade de EC2 com base em demanda. Qual componente?"],["Application Load Balancer","Balanceia tráfego HTTP e encaminha por host ou caminho, conforme regras.","O front-end precisa direcionar /pagamentos e /pedidos para alvos distintos. Qual tipo de balanceador?"],["Network Load Balancer","Balanceia tráfego de transporte para protocolos como TCP.","O serviço é TCP e precisa de balanceamento de camada de transporte. Qual opção?"],["Amazon CloudFront","Entrega conteúdo globalmente por uma distribuição de borda.","O requisito central é colocar conteúdo estático em cache perto dos usuários. Que serviço?"]],"notes":null},{"code":"3.4.1","id":"3.4.1","domain":3,"task":"3.4","title":"RDS, Aurora, DynamoDB e Redshift","concept":"Amazon RDS hospeda motores relacionais gerenciados. Aurora é um motor relacional compatível com MySQL ou PostgreSQL, conforme edição, oferecido pela AWS. DynamoDB é NoSQL chave-valor/documento. Redshift é um data warehouse analítico. O padrão de acesso antecede a escolha.","control":"Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção.","pitfall":"A presença de SQL não transforma todo banco relacional em warehouse otimizado para agregações analíticas.","verify":"Compare acesso por chave, atualizações relacionadas e consulta analítica sobre grande histórico.","decisions":[["Amazon RDS","Banco relacional gerenciado com motores compatíveis."],["Amazon Aurora","Motor relacional da AWS compatível com MySQL ou PostgreSQL."],["Amazon DynamoDB","Banco NoSQL gerenciado orientado a padrões de acesso por chave."],["Amazon Redshift","Warehouse para análise e agregações em escala."]],"docs":[["Bancos de dados AWS","https://aws.amazon.com/pt/products/databases/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.4.1-1","prompt":"Um marketplace precisa ler carrinhos pelo ID do cliente com grande volume de solicitações. Os atributos podem variar e os acessos não dependem de junções relacionais. Qual banco é mais adequado?","solution":"Amazon DynamoDB","explanation":"É um banco de chave-valor e documentos com leituras organizadas por chave.","options":[["Amazon Neptune","É orientado a grafos e travessias de relacionamentos."],["Amazon Redshift","Tem foco em consultas analíticas de grande volume, sem ser a escolha natural para carrinhos operacionais por chave."],["Amazon RDS para PostgreSQL","Oferece banco relacional, sem atender à escolha por modelo chave-valor gerenciado do cenário."],["Amazon DynamoDB","É um banco de chave-valor e documentos com leituras organizadas por chave."]]},{"id":"P-3.4.1-2","prompt":"Um aplicativo de terceiros só é homologado para Microsoft SQL Server. O time quer automatizar backups e delegar tarefas rotineiras de manutenção da instância de banco. Qual serviço oferece um motor compatível?","solution":"Amazon RDS para SQL Server","explanation":"É uma opção gerenciada que oferece o mecanismo Microsoft SQL Server.","options":[["Amazon DynamoDB","Não fornece o motor nem a interface relacional requerida."],["Amazon RDS para SQL Server","É uma opção gerenciada que oferece o mecanismo Microsoft SQL Server."],["SQL Server em EC2","Preserva a compatibilidade, com gerenciamento do banco sob responsabilidade do time."],["Amazon Aurora PostgreSQL","Usa compatibilidade PostgreSQL, não SQL Server."]]}],"cue":"A aplicação consulta carrinhos principalmente pelo identificador do cliente, com acesso previsível por chave. Qual serviço?","answer":"Amazon DynamoDB","use":"Atende ao requisito. Banco NoSQL gerenciado orientado a padrões de acesso por chave.","avoid":"A presença de SQL não transforma todo banco relacional em warehouse otimizado para agregações analíticas.","example":"Compare acesso por chave, atualizações relacionadas e consulta analítica sobre grande histórico.","detail":[],"legacy":"ficha/3.4.1","params":[["Amazon RDS","Banco relacional gerenciado com motores compatíveis.","A equipe quer hospedar um banco SQL Server em serviço relacional gerenciado compatível. Qual serviço?"],["Amazon Aurora","Motor relacional da AWS compatível com MySQL ou PostgreSQL.","O requisito identifica explicitamente o motor relacional desenvolvido pela AWS com compatibilidade PostgreSQL. Qual?"],["Amazon DynamoDB","Banco NoSQL gerenciado orientado a padrões de acesso por chave.","A aplicação consulta carrinhos principalmente pelo identificador do cliente, com acesso previsível por chave. Qual serviço?"],["Amazon Redshift","Warehouse para análise e agregações em escala.","Analistas agregam vários anos de fatos para BI e precisam de um warehouse. Qual?"]],"notes":null},{"code":"3.4.2","id":"3.4.2","domain":3,"task":"3.4","title":"Migração de banco, conversão de esquema e cache","concept":"DMS transporta dados e alterações de fontes compatíveis. DMS Schema Conversion auxilia a avaliar e converter esquema e código de banco em mudanças heterogêneas elegíveis. ElastiCache mantém dados em memória para acelerar acessos. RDS fornece o ambiente gerenciado para o banco de destino quando adequado.","control":"Separe mover dados, converter estrutura, operar o destino e acelerar leitura. Mudança de motor acrescenta compatibilidade de tipos, SQL e código procedural. Compare validação dos resultados e plano de troca.","pitfall":"Uma migração com CDC não garante automaticamente que stored procedures funcionem no motor novo.","verify":"Em uma mudança Oracle → PostgreSQL, classifique tarefas de avaliação, conversão, carga, CDC e atendimento.","decisions":[["AWS Database Migration Service","Move dados e pode replicar mudanças em fontes e destinos compatíveis."],["DMS Schema Conversion","Avalia e auxilia a converter objetos e código entre motores compatíveis."],["Amazon ElastiCache","Cache gerenciado em memória para acelerar padrões de leitura elegíveis."],["Amazon RDS","Fornece motores relacionais gerenciados para servir o workload."]],"docs":[["Bancos de dados AWS","https://aws.amazon.com/pt/products/databases/"],["Estratégias de migração","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"]],"scenarios":[{"id":"P-3.4.2-1","prompt":"O banco de origem continuará disponível para escrita durante a migração. O destino deve receber uma carga inicial e as mudanças até o corte. Qual serviço cobre as duas fases?","solution":"AWS Database Migration Service","explanation":"O DMS pode fazer full load e captura de alterações para origens e destinos suportados.","options":[["AWS DataSync","Transfere arquivos e objetos, sem interpretar o log de transação relacional."],["AWS Backup","Gerencia proteção e pontos de restauração, sem replicação contínua lógica para o destino descrito."],["AWS Database Migration Service","O DMS pode fazer full load e captura de alterações para origens e destinos suportados."],["AWS Application Migration Service","Replica servidores para migração de infraestrutura, sem ser a ferramenta específica para CDC entre bancos."]]},{"id":"P-3.4.2-2","prompt":"Antes de mover um banco Oracle para PostgreSQL, a equipe quer avaliar tipos, procedimentos e objetos que precisarão de adaptação manual. Qual capacidade ajuda nesta fase?","solution":"DMS Schema Conversion","explanation":"Avalia e converte esquemas e código compatível em migrações heterogêneas.","options":[["Replicação CDC no AWS DMS","Transfere alterações de dados, sem resolver por si a incompatibilidade de objetos do esquema."],["DMS Schema Conversion","Avalia e converte esquemas e código compatível em migrações heterogêneas."],["AWS DataSync Discovery","Ajuda a avaliar armazenamento e movimentação de arquivos, sem analisar procedimentos SQL."],["AWS Backup Audit Manager","Avalia controles de backup e não a conversão entre mecanismos."]]}],"cue":"É necessário copiar tabelas e continuar capturando alterações enquanto a origem segue ativa. Qual serviço?","answer":"AWS Database Migration Service","use":"Atende ao requisito. Move dados e pode replicar mudanças em fontes e destinos compatíveis.","avoid":"Uma migração com CDC não garante automaticamente que stored procedures funcionem no motor novo.","example":"Em uma mudança Oracle → PostgreSQL, classifique tarefas de avaliação, conversão, carga, CDC e atendimento.","detail":[],"legacy":"ficha/3.4.2","params":[["AWS Database Migration Service","Move dados e pode replicar mudanças em fontes e destinos compatíveis.","É necessário copiar tabelas e continuar capturando alterações enquanto a origem segue ativa. Qual serviço?"],["DMS Schema Conversion","Avalia e auxilia a converter objetos e código entre motores compatíveis.","Um time precisa identificar objetos SQL incompatíveis na mudança de motor. Qual recurso?"],["Amazon ElastiCache","Cache gerenciado em memória para acelerar padrões de leitura elegíveis.","A aplicação repete leituras de sessões e quer reduzir a pressão no banco primário. Qual serviço?"],["Amazon RDS","Fornece motores relacionais gerenciados para servir o workload.","A migração terminou e o requisito é operar o banco relacional gerenciado no destino. Qual?"]],"notes":null},{"code":"3.5.1","id":"3.5.1","domain":3,"task":"3.5","title":"VPC, DNS e entrega global de conteúdo","concept":"Uma VPC é uma rede virtual isolada e subdividida em sub-redes. Route 53 fornece DNS e políticas de roteamento DNS. CloudFront entrega conteúdo por borda, com cache conforme configuração. Global Accelerator usa a rede global da AWS para acelerar tráfego TCP/UDP e oferecer IPs estáticos para endpoints compatíveis.","control":"Separe espaço de endereçamento, resolução de nomes, entrega em HTTP e caminho de transporte. O requisito por IP fixo ou por cache diferencia estratégias que parecem similares.","pitfall":"Alterar DNS pode influenciar o destino do tráfego. Isso não coloca conteúdo em cache.","verify":"Trace um acesso do nome DNS ao IP e então ao endpoint da aplicação.","decisions":[["Amazon VPC","Fornece rede virtual isolada e controles de sub-redes."],["Amazon Route 53","Resolve domínios e aplica políticas de roteamento DNS."],["Amazon CloudFront","Distribui conteúdo web por borda com opções de cache."],["AWS Global Accelerator","Usa endereços IP estáticos e rede global para tráfego TCP/UDP compatível."]],"docs":[["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"],["Infraestrutura global AWS","https://aws.amazon.com/pt/about-aws/global-infrastructure/"]],"scenarios":[{"id":"P-3.5.1-1","prompt":"A aplicação precisa de endereçamento próprio, sub-redes de acesso público e privado, e rotas separadas. Qual serviço estabelece o limite de rede nesses requisitos?","solution":"Amazon VPC","explanation":"Define rede virtual, intervalos, sub-redes e tabelas de rotas.","options":[["AWS Transit Gateway","Conecta redes existentes, sem criar as sub-redes da aplicação."],["Amazon Route 53","Resolve nomes por DNS e não administra endereçamento de sub-redes."],["Amazon VPC","Define rede virtual, intervalos, sub-redes e tabelas de rotas."],["AWS PrivateLink","Fornece conectividade privada a serviços, sem definir a rede virtual inteira."]]},{"id":"P-3.5.1-2","prompt":"Um site vai trocar seu domínio para um novo balanceador. A equipe precisa editar os registros DNS públicos e manter a zona administrada na AWS. Qual serviço usar?","solution":"Amazon Route 53","explanation":"A zona hospedada pública oferece registros DNS para o domínio.","options":[["Elastic Load Balancing","Recebe tráfego de aplicação, sem administrar a zona pública do domínio."],["AWS Certificate Manager","Emite ou gerencia certificados, sem ser o serviço de hospedagem de DNS."],["Amazon Route 53","A zona hospedada pública oferece registros DNS para o domínio."],["Amazon VPC IP Address Manager","Planeja blocos IP, sem publicar registros de DNS na internet."]]}],"cue":"A equipe precisa criar sub-redes públicas e privadas em uma rede isolada. Qual serviço?","answer":"Amazon VPC","use":"Atende ao requisito. Fornece rede virtual isolada e controles de sub-redes.","avoid":"Alterar DNS pode influenciar o destino do tráfego. Isso não coloca conteúdo em cache.","example":"Trace um acesso do nome DNS ao IP e então ao endpoint da aplicação.","detail":[],"legacy":"ficha/3.5.1","params":[["Amazon VPC","Fornece rede virtual isolada e controles de sub-redes.","A equipe precisa criar sub-redes públicas e privadas em uma rede isolada. Qual serviço?"],["Amazon Route 53","Resolve domínios e aplica políticas de roteamento DNS.","O time precisa gerenciar registros de um domínio de aplicação. Qual serviço?"],["Amazon CloudFront","Distribui conteúdo web por borda com opções de cache.","Uma editora quer que imagens do site sejam atendidas por cache próximo dos leitores. Qual serviço?"],["AWS Global Accelerator","Usa endereços IP estáticos e rede global para tráfego TCP/UDP compatível.","Parceiros exigem IPs fixos e o tráfego TCP deve aproveitar o backbone global da AWS. Qual produto?"]],"notes":null},{"code":"3.5.2","id":"3.5.2","domain":3,"task":"3.5","title":"Conectividade híbrida e saída da rede","concept":"Site-to-Site VPN estabelece túneis IPsec. Direct Connect fornece conexão dedicada do ambiente para a AWS, com criptografia tratada conforme o desenho. Um NAT gateway público permite saída à internet de recursos em sub-redes privadas sem aceitar início espontâneo de conexões da internet. Endpoints VPC oferecem caminhos privados a serviços compatíveis.","control":"Escolha pela origem, pelo destino e pela necessidade de depender da internet pública. Diferencie conectividade escritório-cloud de acesso privado a serviço AWS.","pitfall":"Direct Connect não oferece criptografia de todo tráfego automaticamente.","verify":"Descreva os caminhos para API da AWS, escritório e download de patches da internet.","decisions":[["AWS Site-to-Site VPN","Conecta redes com túneis IPsec."],["AWS Direct Connect","Fornece conectividade dedicada e previsível com a AWS."],["NAT gateway público","Permite que instâncias privadas iniciem tráfego a destinos da internet."],["VPC endpoint","Fornece caminho privado para serviços compatíveis."]],"docs":[["Rede e entrega de conteúdo","https://aws.amazon.com/pt/products/networking/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.5.2-1","prompt":"Uma empresa quer ligar a rede da filial à VPC com túneis IPsec. Já tem internet e um dispositivo de gateway compatível. Qual serviço configurar?","solution":"AWS Site-to-Site VPN","explanation":"Usa túneis criptografados IPsec entre a rede cliente e o gateway na AWS.","options":[["VPC Peering","Interliga VPCs compatíveis, sem terminar túnel do datacenter."],["AWS Direct Connect sem VPN","A conexão dedicada não fornece por si o túnel IPsec requerido."],["AWS Client VPN","É adequada ao acesso remoto de usuários, distinto da ligação entre redes da filial e da VPC."],["AWS Site-to-Site VPN","Usa túneis criptografados IPsec entre a rede cliente e o gateway na AWS."]]},{"id":"P-3.5.2-2","prompt":"A equipe de infraestrutura quer uma conexão privada dedicada de seu datacenter para a AWS. A empresa aceita contratar um parceiro de conectividade e planejar o prazo de instalação. Qual oferta cabe?","solution":"AWS Direct Connect","explanation":"Cria uma conexão dedicada com interfaces virtuais para os destinos compatíveis.","options":[["Amazon CloudFront","Distribui conteúdo e não liga fisicamente o datacenter à AWS."],["AWS Direct Connect","Cria uma conexão dedicada com interfaces virtuais para os destinos compatíveis."],["AWS Network Firewall","Inspeciona tráfego e não provisiona conectividade física."],["AWS Site-to-Site VPN sobre internet","Fornece criptografia via internet pública, sem o circuito dedicado solicitado."]]}],"cue":"Uma filial precisa comunicação criptografada via túnel IPsec entre redes. Qual opção?","answer":"AWS Site-to-Site VPN","use":"Atende ao requisito. Conecta redes com túneis IPsec.","avoid":"Direct Connect não oferece criptografia de todo tráfego automaticamente.","example":"Descreva os caminhos para API da AWS, escritório e download de patches da internet.","detail":[],"legacy":"ficha/3.5.2","params":[["AWS Site-to-Site VPN","Conecta redes com túneis IPsec.","Uma filial precisa comunicação criptografada via túnel IPsec entre redes. Qual opção?"],["AWS Direct Connect","Fornece conectividade dedicada e previsível com a AWS.","O datacenter exige uma conexão dedicada de longo prazo com a AWS. Qual opção?"],["NAT gateway público","Permite que instâncias privadas iniciem tráfego a destinos da internet.","Instâncias privadas precisam baixar patches da internet sem aceitar conexões iniciadas externamente. Que componente?"],["VPC endpoint","Fornece caminho privado para serviços compatíveis.","A empresa quer chamar serviço AWS compatível da VPC sem passar pela internet. Qual recurso?"]],"notes":null},{"code":"3.6.1","id":"3.6.1","domain":3,"task":"3.6","title":"S3, EBS, EFS e FSx por interface de acesso","concept":"S3 é armazenamento de objetos com APIs próprias. EBS é armazenamento em blocos para instâncias EC2. EFS oferece sistema de arquivos NFS elástico para clientes compatíveis. FSx oferece sistemas de arquivos gerenciados, como Windows File Server, Lustre, OpenZFS e ONTAP, com funções distintas.","control":"Decida primeiro pela interface requerida: objeto, bloco, arquivo Linux compartilhado ou um sistema de arquivos específico. Só então avalie capacidade, latência, throughput e custo.","pitfall":"Usar S3 como destino de um data lake não o torna um volume de bloco para instalar um sistema operacional EC2.","verify":"Identifique protocolo e padrão de compartilhamento antes de escolher a classe de armazenamento.","decisions":[["Amazon S3","Armazena objetos em buckets e atende aplicações que usam a API de objetos."],["Amazon EBS","Fornece volumes em bloco para instâncias EC2 compatíveis."],["Amazon EFS","Sistema NFS gerenciado e elástico para compartilhamento."],["Amazon FSx for Windows File Server","Sistema gerenciado de arquivos Windows via SMB."]],"docs":[["Armazenamento AWS","https://aws.amazon.com/pt/products/storage/"],["Classes de armazenamento S3","https://aws.amazon.com/pt/s3/storage-classes/"]],"scenarios":[{"id":"P-3.6.1-1","prompt":"Um aplicativo guarda fotos em um namespace de objetos. Cada foto é recuperada pela chave e a aplicação usa uma API HTTP gerenciada. Qual armazenamento selecionar?","solution":"Amazon S3","explanation":"Implementa buckets e acesso a objetos por chave.","options":[["Amazon EBS","Expõe dispositivos de bloco a instâncias, fora do modelo de API por objeto."],["Amazon EFS","Apresenta diretórios e arquivos via NFS."],["Amazon S3","Implementa buckets e acesso a objetos por chave."],["Amazon FSx for Windows File Server","Oferece compartilhamentos SMB compatíveis com Windows."]]},{"id":"P-3.6.1-2","prompt":"Uma AMI baseada em EBS precisa de disco de boot persistente para a instância EC2. O armazenamento deve aparecer como dispositivo de bloco. Qual serviço usar?","solution":"Amazon EBS","explanation":"Fornece volumes de bloco compatíveis com a inicialização de uma instância EC2.","options":[["Amazon EFS","É montado como sistema de arquivos compartilhado, sem fornecer o disco de boot EBS."],["Amazon EBS","Fornece volumes de bloco compatíveis com a inicialização de uma instância EC2."],["Amazon FSx for Lustre","Fornece sistema de arquivos voltado ao processamento de alto desempenho, não o volume raiz solicitado."],["Amazon S3 Standard","Implementa armazenamento de objetos, sem expor o volume raiz."]]}],"cue":"O sistema grava imagens como objetos e as acessa por chave em um bucket. Qual serviço?","answer":"Amazon S3","use":"Atende ao requisito. Armazena objetos em buckets e atende aplicações que usam a API de objetos.","avoid":"Usar S3 como destino de um data lake não o torna um volume de bloco para instalar um sistema operacional EC2.","example":"Identifique protocolo e padrão de compartilhamento antes de escolher a classe de armazenamento.","detail":[],"legacy":"ficha/3.6.1","params":[["Amazon S3","Armazena objetos em buckets e atende aplicações que usam a API de objetos.","O sistema grava imagens como objetos e as acessa por chave em um bucket. Qual serviço?"],["Amazon EBS","Fornece volumes em bloco para instâncias EC2 compatíveis.","É necessário um volume de inicialização de bloco para uma instância EC2. Qual?"],["Amazon EFS","Sistema NFS gerenciado e elástico para compartilhamento.","Várias instâncias Linux montam o mesmo diretório compartilhado via NFS. Qual serviço?"],["Amazon FSx for Windows File Server","Sistema gerenciado de arquivos Windows via SMB.","Aplicativos Windows precisam de compartilhamento SMB gerenciado. Qual produto?"]],"notes":null},{"code":"3.6.2","id":"3.6.2","domain":3,"task":"3.6","title":"Classes S3, arquivamento, backup e retenção","concept":"S3 Standard atende acesso frequente. Standard-IA mantém acesso rápido com condições de armazenamento e recuperação. Intelligent-Tiering move objetos entre camadas adequadas ao padrão observado, com custos e elegibilidade. Glacier Deep Archive atende arquivo de longo prazo com recuperação planejada.","control":"Compare frequência, tempo tolerado para recuperação, custos de transição, redundância e duração mínima aplicável. Lifecycle automatiza transições e expiração. Versioning preserva versões conforme política e interage com a expiração.","pitfall":"Preço de armazenamento por GB isolado não considera acesso, recuperação, solicitações ou duração mínima.","verify":"Monte uma matriz para dados quentes, frios, imprevisíveis e arquivados por anos.","decisions":[["S3 Standard","Para dados acessados com frequência com baixa latência."],["S3 Standard-IA","Para dados pouco acessados que ainda exigem recuperação imediata."],["S3 Intelligent-Tiering","Para dados cujo acesso é desconhecido ou muda ao longo do tempo."],["S3 Glacier Deep Archive","Para retenção longa com acesso raro e restauração tolerante a espera."]],"docs":[["Classes de armazenamento S3","https://aws.amazon.com/pt/s3/storage-classes/"],["Armazenamento AWS","https://aws.amazon.com/pt/products/storage/"]],"scenarios":[{"id":"P-3.6.2-1","prompt":"O mesmo acervo alterna entre meses com picos de leitura e meses quase sem acesso. A equipe quer automatizar mudanças de camada com base no uso observado. Qual classe oferece isso?","solution":"S3 Intelligent-Tiering","e
