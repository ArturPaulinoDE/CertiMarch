/* Dropdown Conteúdo Teórico */
.dropdown-wrap {

.dropdown-caret {

}
.dropdown-wrap:hover .dropdown-caret,
.dropdown-wrap.open .dropdown-caret {
  transform: rotate(180deg);
}
.dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 390px;

  border: 1px solid #35558a;
  border-radius: 12px;
  padding: 8px;

}
.dropdown-menu::before {
  content: "";

  top: -10px;
  left: 0;
  right: 0;
  height: 10px;
}
.dropdown-wrap:hover .dropdown-menu,
.dropdown-wrap:focus-within .dropdown-menu,
.dropdown-wrap.open .dropdown-menu {

  background: var(--bg);
}

  display: block;
}
.native-view {
  position: absolute;
  inset: 0;

  padding: 20px 24px 60px;
  display: none;
}

  display: block;
}
.container-max {
  max-width: 1560px;
  margin: 0 auto;
}

/* Common UI Components for Native Views */
.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.sec-eyebrow {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--blue);
}
.sec-head h2 {
  margin: 3px 0 4px;
  font-size: 23px;
  line-height: 1.2;
}
.sec-head p {
  margin: 0;
  color: var(--muted);
  max-width: 920px;
}
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pcard {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.pcard h3 { margin: 0 0 8px; font-size: 15px; }
.pcard p { margin: 5px 0; color: var(--muted); }
.pbadge {

  gap: 4px;

  font-size: 10.5px;
  font-weight: 800;
  background: var(--blue2);
  color: var(--blue);
}
.pbadge.green { background: var(--greenbg); color: var(--green); }
.pbadge.orange { background: var(--orangebg); color: var(--orange); }
.pbadge.purple { background: var(--purplebg); color: var(--purple); }
.pbadge.red { background: var(--redbg); color: var(--red); }
.pbadge.teal { background: var(--tealbg); color: var(--teal); }

.ptable-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
}
.ptable {
  width: 100%;

}

  border-bottom: 1px solid var(--line);

}

  background: var(--panel2);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.ptable tr:last-child td { border-bottom: 0; }
.ptable tr:hover td { background: color-mix(in srgb, var(--blue2) 30%, var(--panel)); }

.pbtn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 700;

  align-items: center;
  gap: 6px;
}

.pbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.pbtn.sm { padding: 4px 8px; font-size: 11px; }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.pinput, .pselect {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12.5px;
}

/* Mode Switcher Banner (Learning Bank vs Exam Simulation Bank) */
.mode-switch-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: var(--panel);

  border-radius: 13px;
  padding: 11px 15px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.mode-pill-group {
  display: inline-flex;
  background: var(--panel2);

  border-radius: 10px;
  border: 1px solid var(--line);
  gap: 4px;
}
.mode-pill {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 13px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}
.mode-pill.active {
  background: var(--blue);
  color: #fff;
}

/* Simulado & Quiz Engine Styles */
.quiz-opt {
  width: 100%;
  text-align: left;
  padding: 11px 13px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--panel2);

}
.quiz-opt:hover { border-color: var(--blue); }

.quiz-letter {

  height: 24px;

  font-weight: 800;
  font-size: 11.5px;
  flex-shrink: 0;

.rationale-box {

  margin: 10px 0;
}

.modal-backdrop {

  padding: 50px 16px 20px;
}
.modal-backdrop.open { display: flex; }
.search-modal {

  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;

  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 84vh;
}
.search-modal-head {
  padding: 13px 16px;

  display: flex;
  gap: 10px;
  align-items: center;

.search-modal-head input {

  color: var(--ink);

  border-radius: 10px;

  outline: none;
}
.search-modal-body {
  padding: 12px 16px;

}
.search-hit {

  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.search-hit:hover {
  border-color: var(--blue);
  background: var(--blue2);
}
.prog-bar-outer {
  height: 8px;
  background: var(--panel2);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.prog-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--teal));
  transition: width 0.25s ease;
}

/* Toast Notification */
.toast-msg {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 4000;
  background: var(--navy);
  color: #fff;
  border: 1px solid var(--blue);
  padding: 10px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 12.5px;
  font-weight: 700;
  display: none;
}
.toast-msg.show { display: block; }

@media (max-width: 1020px) {
  .grid.four, .grid.three, .grid.two { grid-template-columns: 1fr; }
  .dropdown-menu { min-width: min(350px, 94vw); }
}

</div><div class="toast-msg" id="portalToast" role="status"></div><script>window.portalInput={"questions":[{"id":"P-1.1.1-1","skill":"1.1.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"Uma bilheteria recebe dez vezes mais tráfego no início das vendas. Depois de duas horas, quer liberar a capacidade extra. Que característica atende às duas fases?","options":["Escala vertical fixa","Alta disponibilidade","Migração híbrida","Elasticidade"],"why":["Uma máquina maior pode sustentar o pico, mas continua provisionada depois.","Trata interrupção por falha, não o ajuste entre pico e vale.","Descreve distribuição entre ambientes, não ajuste de capacidade.","A capacidade acompanha tanto aumento quanto queda da demanda."],"correct":[3]},{"id":"P-1.1.1-2","skill":"1.1.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"Uma equipe tinha de aguardar a compra de servidores para testar um protótipo. Agora cria e descarta um ambiente no mesmo dia. Qual benefício mudou o prazo de teste?","options":["Economia de escala do provedor","Agilidade","Escalabilidade vertical","Recuperação de desastre"],"why":["Pode influenciar preço unitário, mas o cenário compara tempo.","Provisionar sob demanda reduz o tempo entre ideia e teste.","Trocar tamanho da máquina não explica o provisionamento inicial rápido.","O ambiente é criado para teste, não para restaurar um serviço."],"correct":[1]},{"id":"P-1.1.2-1","skill":"1.1.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Após falha, a clínica consegue reiniciar a aplicação em uma hora. A diretoria diz que no máximo quinze minutos de registros podem ser perdidos. Qual objetivo descreve os quinze minutos?","options":["Tempo de retenção","Acordo de suporte","RPO","RTO"],"why":["Define quanto histórico guardar, não a perda máxima em um incidente.","Trata direitos e atendimento, não quão atual deve ser a cópia.","Limita a distância entre a falha e o ponto de dados recuperável.","É o limite para retornar o serviço."],"correct":[2]},{"id":"P-1.1.2-2","skill":"1.1.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"A empresa tolera perder poucas alterações, mas o contrato destacado diz que o sistema precisa voltar em duas horas. O que as duas horas representam?","options":["Latência p95","Janela de manutenção","RTO","RPO"],"why":["Descreve tempo de resposta de requisições já servidas.","Define horário para mudança planejada, não recuperação após falha.","Mede o prazo de recuperação do serviço.","Mede perda aceitável de dados no tempo."],"correct":[2]},{"id":"P-1.2.1-1","skill":"1.2.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"Após incidentes, uma equipe revisa runbooks e automatiza mudanças pequenas e reversíveis. O objetivo é melhorar a rotina de operação. Qual pilar guia esse trabalho?","options":["Excelência operacional","Segurança","Sustentabilidade","Otimização de custos"],"why":["Foca operar, evoluir processos e aprender com eventos.","Seria dominante se o objetivo principal fosse proteção de dados e identidades.","Não está investigando impacto ambiental.","O cenário não mede gasto ou desperdício."],"correct":[0]},{"id":"P-1.2.1-2","skill":"1.2.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"A empresa ensaia perder um banco primário e testa se o failover restaura o serviço. Qual pilar mede esse resultado?","options":["Eficiência de desempenho","Excelência operacional","Confiabilidade","Segurança"],"why":["O foco não é escolher recursos por latência ou throughput de rotina.","Automatizar o teste ajuda a operação, mas o resultado medido é recuperação.","O teste comprova capacidade de recuperar e tolerar falhas.","A simulação não comprova proteção de confidencialidade."],"correct":[2]},{"id":"P-1.2.2-1","skill":"1.2.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Um serviço recebe mais pedidos do que os workers podem atender. O produtor deve responder sem esperar a conclusão, e os pedidos precisam ficar disponíveis para consumo posterior. Qual serviço usar?","options":["Elastic Load Balancing","Amazon SQS","AWS Lambda sem fila","Amazon Route 53"],"why":["Distribui requisições a alvos, sem persistir backlog de pedidos.","Mantém trabalho pendente desacoplado do ritmo dos consumidores.","Executa código, mas não fornece a fila explícita que o desenho precisa.","Resolve o destino pelo DNS; não retém mensagens."],"correct":[1]},{"id":"P-1.2.2-2","skill":"1.2.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Uma confirmação precisa ser distribuída ao financeiro, ao suporte e à auditoria. Cada grupo deve receber a mesma publicação. Qual serviço oferece o fan-out?","options":["AWS Budgets","Amazon SNS","Amazon EBS","Uma única fila SQS com três consumidores concorrentes"],"why":["Emite alertas de orçamento, sem atuar como tópico genérico da aplicação.","O tópico entrega a publicação a múltiplos assinantes configurados.","Armazena blocos e não distribui notificações.","Consumidores da mesma fila disputam trabalho; não recebem todos uma cópia por desenho."],"correct":[1]},{"id":"P-1.3.1-1","skill":"1.3.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"Uma aplicação local usa um runtime legado e será movida para EC2. O prazo não permite redesenho ou trocar produtos. Qual estratégia?","options":["Refactor","Retain","Repurchase","Rehost"],"why":["Redesenharia a aplicação para adotar outra arquitetura.","Manteria o ativo na origem.","Substituiria o produto por outro.","Move a aplicação mantendo arquitetura e stack essencialmente iguais."],"correct":[3]},{"id":"P-1.3.1-2","skill":"1.3.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"O aplicativo mantém interfaces e regras. O banco passa de VM autogerenciada para Amazon RDS usando o mesmo motor compatível. Qual estratégia?","options":["Replatform","Repurchase de toda a aplicação","Retire","Rehost sem mudança de operação"],"why":["A plataforma melhora sem reescrita ampla do aplicativo.","O aplicativo permanece o mesmo produto.","O sistema continua em operação.","O banco passa a usar um serviço gerenciado, além de mudar de localização."],"correct":[0]},{"id":"P-1.3.2-1","skill":"1.3.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Antes de migrar várias áreas, o patrocinador quer avaliar competências, governança e operação da organização. Qual abordagem orienta a adoção?","options":["AWS DMS","AWS Cloud Adoption Framework","AWS Pricing Calculator","AWS Well-Architected Tool"],"why":["Move dados de bancos, sem orientar gestão de pessoas ou governança.","Cobre perspectivas organizacionais para a jornada de adoção.","Estima configuração e custo, não maturidade organizacional.","Avalia workloads, não resolve sozinho as capacidades corporativas."],"correct":[1]},{"id":"P-1.3.2-2","skill":"1.3.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Um arquiteto precisa revisar um workload existente pelos seis pilares. Quer discutir segurança, confiabilidade e demais dimensões do desenho. Qual referência?","options":["AWS CAF","AWS Migration Hub","AWS Pricing Calculator","AWS Well-Architected Framework"],"why":["Orienta adoção em nível organizacional, não é o referencial de seis pilares de workload.","Apoia acompanhamento de migração, não a revisão pedida.","Estima custo para uma configuração, sem avaliar os pilares.","Organiza a revisão por pilares de arquitetura."],"correct":[3]},{"id":"P-1.4.1-1","skill":"1.4.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"Uma empresa deixa de comprar servidores antes do lançamento. Passa a pagar pelo compute usado conforme a demanda. Que mudança financeira descreve o caso?","options":["Reserva física automática","Faturamento consolidado","Troca de investimento inicial por despesa variável","Compromisso de longo prazo"],"why":["Pagar por uso não garante capacidade física reservada.","Agrupa faturas, sem explicar comprar ou consumir recursos.","O consumo desloca o gasto da aquisição prévia para a operação conforme uso.","Não foi assumido no cenário."],"correct":[2]},{"id":"P-1.4.1-2","skill":"1.4.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"A comparação entre nuvem e datacenter usa horizonte de três anos e inclui energia, pessoas, licenças, rede e migração. Que medida está sendo montada?","options":["Desconto de consumo comprometido","Custo total de propriedade","Preço unitário de computação","Custo marginal de uma solicitação"],"why":["Descreve um instrumento de preço, não toda a comparação.","Inclui custos diretos e indiretos durante o ciclo de vida.","Não inclui as despesas de operação e migração.","Reflete uma unidade adicional, não o conjunto do horizonte."],"correct":[1]},{"id":"P-1.4.2-1","skill":"1.4.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Um serviço roda 24 horas, mas o uso de CPU e memória fica bem abaixo da capacidade da família atual, mesmo no pico. O SLA não muda. O que avaliar primeiro?","options":["Comprar um compromisso para a configuração atual imediatamente","Duplicar recursos em outro ambiente","Desligar o sistema à noite sem verificar demanda","Rightsizing com métricas representativas"],"why":["Pode fixar gastos em capacidade superdimensionada.","Aumenta capacidade sem evidência de necessidade.","O workload tem requisito de execução contínua.","Dimensiona o recurso à pressão real de CPU e memória sem alterar o objetivo de serviço."],"correct":[3]},{"id":"P-1.4.2-2","skill":"1.4.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"O laboratório só precisa estar ativo em dias úteis no horário de treinamento. Os recursos devem continuar disponíveis para reuso. Qual mudança reduz horas de compute?","options":["Trocar as instâncias por famílias maiores","Apagar permanentemente a conta após cada treino","Ativar faturamento consolidado","Agendar parada e retomada de recursos compatíveis"],"why":["Pode elevar custo por hora sem reduzir tempo ativo.","Não preserva os recursos para reuso.","Agrupa pagamentos, sem efetivamente desligar compute.","Evita horas ociosas ao preservar o ambiente para outro dia."],"correct":[3]},{"id":"P-1.2.3-1","skill":"1.2.3","domain":1,"form":null,"scored":true,"kind":"single","stem":"A revisão do workload identifica credenciais expostas e ausência de trilha de ações suspeitas. O objetivo é fortalecer identidades e detecção. Qual pilar?","options":["Sustentabilidade","Eficiência de desempenho","Segurança","Confiabilidade"],"why":["Não trata impacto ambiental.","Alterar tipo de instância não é o objetivo.","Identidade, proteção e detecção são centrais nesse pilar.","Capacidade de recuperação não cobre isoladamente exposição de credenciais."],"correct":[2]},{"id":"P-1.2.3-2","skill":"1.2.3","domain":1,"form":null,"scored":true,"kind":"single","stem":"O time mede gasto por pedido, remove recursos ociosos e preserva o SLA. Qual pilar está guiando a escolha?","options":["Excelência operacional","Confiabilidade","Otimização de custos","Segurança"],"why":["Melhoria de processo pode ajudar, mas a medida explícita é gasto.","O SLA é restrição da decisão, não a variável otimizada.","A equipe busca melhor custo por trabalho entregue.","O caso não compara permissões ou proteção de dados."],"correct":[2]},{"id":"P-2.1.1-1","skill":"2.1.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Um alerta aponta vulnerabilidade no Linux que a empresa utiliza em suas instâncias EC2. O hardware subjacente está atualizado. Quem aplica o patch ao sistema convidado?","options":["O serviço de monitoramento do cliente","O cliente que opera a instância","A AWS como operadora do hipervisor","A auditoria do provedor"],"why":["Detectar vulnerabilidade não transfere a responsabilidade pelo patch.","Em EC2, o sistema convidado e seus pacotes ficam sob gestão do cliente.","O controle do hipervisor não inclui aplicar patches no convidado.","Avalia evidências, sem administrar o SO convidado."],"correct":[1]},{"id":"P-2.1.1-2","skill":"2.1.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"A equipe usa Amazon RDS e precisa impedir que um novo analista leia a tabela financeira. Quem configura essa permissão?","options":["O cliente que administra os acessos do banco","O fornecedor do motor de banco","Um usuário comum do banco","A AWS como responsável pelo hardware"],"why":["RDS gerencia a infraestrutura, enquanto o cliente determina os usuários e privilégios.","Fornecer software não dá responsabilidade pelos acessos da organização.","Não deve poder conceder acesso sem privilégio administrativo.","O controle de infraestrutura não define quais pessoas leem tabelas."],"correct":[0]},{"id":"P-2.1.2-1","skill":"2.1.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"O cliente inclui controle de acesso físico do datacenter em sua matriz, mas só a AWS o opera. Como classificar para o cliente?","options":["Autorização delegada a um usuário IAM","Controle do aplicativo","Controle herdado","Controle específico do cliente"],"why":["IAM não controla entrada física no datacenter.","A operação não está no código ou configuração do workload.","O cliente se apoia em um controle da infraestrutura gerida pelo provedor.","O cliente não projeta nem executa a proteção física da AWS."],"correct":[2]},{"id":"P-2.1.2-2","skill":"2.1.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Na política de patches, AWS cuida da infraestrutura e o cliente do SO convidado de EC2. Qual classificação é apropriada?","options":["Controle herdado","Controle transferido integralmente ao cliente","Controle físico","Controle compartilhado por camada"],"why":["O cliente ainda precisa corrigir o sistema convidado.","A AWS continua responsável por sua infraestrutura.","Também abrange software do workload.","O tipo de controle existe em ambos os lados, em camadas distintas."],"correct":[3]},{"id":"P-2.2.1-1","skill":"2.2.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"O jurídico precisa baixar um relatório SOC sobre a AWS para avaliar o fornecedor. Não quer coletar logs da própria conta. Qual serviço?","options":["AWS Config","AWS Artifact","Amazon Inspector","AWS Audit Manager"],"why":["Mantém configuração dos recursos, não documentos do fornecedor.","Distribui relatórios e acordos do provedor.","Avalia vulnerabilidades, não fornece o relatório SOC da AWS.","Ajuda a estruturar avaliações e coletar evidência do ambiente."],"correct":[1]},{"id":"P-2.2.1-2","skill":"2.2.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Uma equipe precisa organizar a evidência de controles de várias contas em uma avaliação recorrente. Qual serviço foi feito para auxiliá-la?","options":["AWS Artifact sozinho","Amazon CloudFront","AWS Audit Manager","AWS CloudFormation"],"why":["Entrega relatórios da AWS e não agrega a avaliação do workload.","Distribui conteúdo, não evidência de controles.","Estrutura avaliações e auxilia na coleta de evidências de controles.","Opera stacks de infraestrutura, sem organizar avaliação de auditoria."],"correct":[2]},{"id":"P-2.2.2-1","skill":"2.2.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Uma API passa a retornar mais HTTP 500 à tarde. A equipe precisa ser notificada quando a métrica cruzar um limiar. Qual serviço?","options":["AWS Artifact","Amazon CloudWatch","AWS Config","Amazon Inspector"],"why":["Não analisa métricas nem gera esse alarme.","Permite criar alarme sobre a métrica operacional.","Avalia configuração, não a taxa de respostas HTTP.","Encontra vulnerabilidades, sem monitorar o limiar operacional."],"correct":[1]},{"id":"P-2.2.2-2","skill":"2.2.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"A política de acesso mudou e a equipe de segurança precisa saber qual sessão executou a chamada. Qual fonte?","options":["AWS CloudTrail","Um grupo de segurança","AWS Organizations como relatório","Amazon CloudWatch Metrics"],"why":["Registra atividade de gerenciamento e seu contexto de identidade.","Controla tráfego, sem registrar autoria de mudança via API.","Organiza contas e controles, sem substituir trilha das chamadas.","Pode mostrar o efeito, não a identidade que mudou a política."],"correct":[0]},{"id":"P-2.3.1-1","skill":"2.3.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Um aplicativo EC2 lê um prefixo do S3. A empresa quer credenciais temporárias sem chaves no código ou na imagem. Qual escolha?","options":["Abrir o prefixo publicamente","Associar uma role IAM à instância","Compartilhar credenciais da conta root","Embutir chaves de um usuário IAM na imagem"],"why":["Evita autenticação à custa de expor o dado.","A aplicação obtém credenciais temporárias com as permissões da role.","Amplia privilégio e viola a separação de identidade.","Cria segredo permanente distribuído a cada instância."],"correct":[1]},{"id":"P-2.3.1-2","skill":"2.3.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"A conta acabou de ser criada. Há uma identidade que deve receber proteção forte e ficar reservada às tarefas que só ela pode realizar. Qual identidade?","options":["Usuário root com MFA","Identidade federada de desenvolvedor","Usuário de leitura de custos","Role de execução de Lambda"],"why":["Root tem autoridade ampla e requer controles específicos.","É para uso cotidiano com permissões atribuídas.","É uma identidade operacional, não a reservada a tarefas exclusivas.","Executa o workload com privilégios próprios, sem ser o proprietário da conta."],"correct":[0]},{"id":"P-2.3.2-1","skill":"2.3.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Colaboradores precisam entrar em várias contas pela mesma experiência de login, com permissões diferentes em cada uma. Qual serviço?","options":["AWS IAM Identity Center","AWS Direct Connect","Uma role única com credenciais permanentes para todos","AWS Config"],"why":["Centraliza acesso humano e atribuições a contas.","Oferece conectividade dedicada, sem gerenciar identidades da empresa.","Não atende federação e perfil por conta com rastreabilidade.","Avalia configuração de recursos, não fornece portal federado."],"correct":[0]},{"id":"P-2.3.2-2","skill":"2.3.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Segurança quer bloquear uma ação para todas as contas-membro de uma OU, mesmo se alguém conceder essa ação em uma política local. Qual controle?","options":["Tag comum aplicada aos recursos","Política de senha local","Controle de acesso do bucket de logs","SCP do AWS Organizations"],"why":["Rótulos não negam ações sem política associada.","Controla requisitos de credencial, não quais APIs são permitidas.","Limita um recurso, não a OU toda.","Define o limite de permissões disponível no escopo organizacional."],"correct":[3]},{"id":"P-2.4.1-1","skill":"2.4.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Segurança quer identificar sinais de atividade maliciosa pelo comportamento observado em fontes compatíveis de conta e rede. Qual serviço focar?","options":["Amazon Inspector","AWS Artifact","AWS Shield como scanner de credenciais","Amazon GuardDuty"],"why":["Prioriza vulnerabilidades de workloads, que são outro tipo de evidência.","Fornece documentos do provedor, sem detectar comportamento.","Proteção DDoS não é detecção de atividade suspeita de credencial.","Analisa sinais de ameaças em fontes suportadas."],"correct":[3]},{"id":"P-2.4.1-2","skill":"2.4.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Um time publica imagens em um repositório compatível. Antes do deploy, quer identificar CVEs nos pacotes da imagem. Qual serviço?","options":["AWS Health","Amazon Macie","AWS WAF","Amazon Inspector"],"why":["Mostra eventos de serviço, não pacotes vulneráveis na imagem.","Busca dados sensíveis em objetos S3, não CVEs de pacotes.","Filtra solicitações HTTP, sem avaliar bibliotecas em imagens.","Avalia vulnerabilidades de imagens compatíveis."],"correct":[3]},{"id":"P-2.4.2-1","skill":"2.4.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"O site tem de bloquear requisições HTTP por padrões no cabeçalho. Não basta controlar endereços ou portas. Qual serviço?","options":["Amazon Inspector","Network ACL","AWS WAF","AWS KMS"],"why":["Avalia vulnerabilidades, não aplica essas regras no tráfego.","Filtra por critérios de rede, sem inspecionar cabeçalho HTTP.","As regras analisam atributos de requisições web em integrações suportadas.","Gerencia chaves; não inspeciona solicitações."],"correct":[2]},{"id":"P-2.4.2-2","skill":"2.4.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Um endpoint público precisa de proteção contra tráfego de ataque distribuído. A preocupação é manter disponibilidade sob DDoS. Qual oferta?","options":["AWS Shield","Amazon Macie","AWS Config","AWS Secrets Manager"],"why":["Protege contra ataques distribuídos de negação de serviço conforme cobertura.","Classifica dados em S3, não protege endpoint contra inundação.","Avalia conformidade de recursos, sem tratar a sobrecarga em trânsito.","Protege segredos, sem mitigar volume de tráfego externo."],"correct":[0]},{"id":"P-2.2.3-1","skill":"2.2.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"O time usa criptografia de objetos no S3 e precisa controlar e auditar o uso de chaves. Qual serviço administra esse material?","options":["AWS Certificate Manager","AWS KMS","AWS Secrets Manager","Amazon Macie"],"why":["Administra certificados, não chaves usadas pelo S3 para esse caso.","Gerencia chaves e políticas de uso compatíveis com SSE-KMS.","Gerencia segredos como senhas, sem ser o serviço de chaves SSE-KMS.","Descobre dados sensíveis, sem fornecer a chave de criptografia."],"correct":[1]},{"id":"P-2.2.3-2","skill":"2.2.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"Uma aplicação precisa recuperar a senha de banco e adotar um processo integrado de rotação. Qual serviço resolve essas duas necessidades?","options":["AWS Secrets Manager","AWS KMS isoladamente","IAM Identity Center","AWS Artifact"],"why":["Armazena o segredo e oferece mecanismos de rotação compatíveis.","Pode proteger dados, mas não armazena e roda a senha como segredo gerenciado.","Centraliza acesso humano à AWS, não distribui a senha da aplicação.","Fornece documentação de conformidade, não segredos."],"correct":[0]},{"id":"P-2.4.3-1","skill":"2.4.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"O time quer negar explicitamente uma faixa inteira na entrada de uma sub-rede. O controle precisa operar no limite da sub-rede. Qual usar?","options":["Controle IAM sobre criação de regras","Network ACL","Security group com regra de negação","AWS WAF para todo o tráfego de sub-rede"],"why":["Autoriza ações administrativas, sem aplicar o filtro de tráfego desejado.","Suporta regras de permitir e negar no escopo da sub-rede.","Security groups usam regras de permissão e atuam no recurso.","Atua em requisições web, não no limite genérico da sub-rede."],"correct":[1]},{"id":"P-2.4.3-2","skill":"2.4.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"Somente o grupo das instâncias de aplicação deve conectar à porta de um banco. Respostas de conexões permitidas não exigirão outra regra correspondente. Qual escolha?","options":["Resolução DNS privada","Security group do banco","Network ACL com estado de conexão","Política de confiança IAM"],"why":["Localiza o banco, mas não impõe a regra de origem e porta.","Controla o recurso com comportamento stateful e pode referenciar o grupo de origem.","Network ACL é stateless e não opera pela associação de grupos indicada.","Autoriza assunção de role, sem controlar conexão TCP."],"correct":[1]},{"id":"P-3.1.1-1","skill":"3.1.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma analista está começando na AWS e quer explorar recursos e seus atributos usando o navegador. A empresa ainda não precisa automatizar a consulta. Qual interface usar?","options":["AWS Management Console","AWS CLI","AWS SDK para Python","AWS CloudFormation"],"why":["A interface web permite navegar pelos serviços e consultar os recursos da conta.","Exige executar comandos em um terminal.","É uma biblioteca para código de aplicação.","Provisiona recursos a partir de templates."],"correct":[0]},{"id":"P-3.1.1-2","skill":"3.1.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma equipe quer incluir redes e funções em uma revisão de código e reproduzir o ambiente em outra conta. Precisa declarar recursos e dependências. Qual serviço atende?","options":["AWS Systems Manager","AWS CodeBuild","AWS CloudTrail","AWS CloudFormation"],"why":["Executa operações em recursos gerenciados, sem representar toda a infraestrutura da stack.","Compila e testa código, mas não define o ciclo de vida desses recursos.","Registra chamadas de API para auditoria.","O template declarativo descreve os recursos e a stack acompanha suas dependências."],"correct":[3]},{"id":"P-3.1.2-1","skill":"3.1.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma fábrica mantém o banco de ordens no próprio datacenter por exigência da operação, mas sua API pública já roda na AWS. Cada pedido usa os dois ambientes. Qual modelo foi adotado?","options":["Implantação multirregional","Implantação inteiramente em nuvem","Implantação inteiramente local","Implantação híbrida"],"why":["A descrição não exige duas Regiões AWS.","O banco continuaria dependente do datacenter, fora dessa definição.","O processamento da API está na AWS.","A arquitetura integra recursos locais e serviços de nuvem no mesmo fluxo."],"correct":[3]},{"id":"P-3.1.2-2","skill":"3.1.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A empresa precisa manter a computação no chão de fábrica e quer operar serviços AWS compatíveis com as mesmas ferramentas usadas na Região. Qual oferta avaliar?","options":["AWS Outposts","AWS Local Zones","Amazon CloudFront","AWS Direct Connect"],"why":["Leva infraestrutura e serviços compatíveis da AWS para instalações do cliente.","Oferecem capacidade em locais metropolitanos operados pela AWS.","Aproxima a entrega de conteúdo em cache, sem executar a carga local pedida.","Fornece conectividade dedicada, sem instalar computação da AWS na fábrica."],"correct":[0]},{"id":"P-3.2.1-1","skill":"3.2.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma empresa tem obrigação de selecionar uma localização da AWS no país exigido para os dados primários de seu banco. Que conceito do catálogo identifica essa área geográfica?","options":["Availability Zone isolada","Edge location","Sub-rede privada","Região AWS"],"why":["É uma subdivisão da Região, normalmente usada depois de escolher a geografia.","Atende tráfego em borda e não identifica a área de implantação de um banco regional.","Segmenta endereços e alcance de rede dentro de uma VPC.","É a área geográfica escolhida para recursos regionais e engloba Availability Zones."],"correct":[3]},{"id":"P-3.2.1-2","skill":"3.2.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um site de notícias mantém sua origem em uma Região, mas quer servir cópias em cache aos leitores em continentes diferentes. Qual infraestrutura serve o cache mais perto do usuário?","options":["Instalações AWS Outposts","Sub-redes em uma VPC","Volumes por Availability Zone","Edge locations do CloudFront"],"why":["Estendem serviços para instalações específicas de clientes.","Organizam recursos internos, sem distribuir cache para leitores internacionais.","Isolam armazenamento de bloco e não são pontos de entrega global.","A rede de borda entrega conteúdo a partir de pontos próximos do público."],"correct":[3]},{"id":"P-3.3.1-1","skill":"3.3.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um fornecedor exige uma versão específica de Linux e a instalação de um agente que roda como serviço do sistema. A equipe aceita operar a máquina virtual. Qual serviço usar?","options":["AWS Fargate","Amazon EC2","Amazon Aurora","AWS Lambda"],"why":["Executa contêineres sem expor o host subjacente.","A instância permite escolher a AMI e administrar o sistema convidado.","É um banco gerenciado, sem acesso administrativo ao sistema operacional do host.","O modelo de função não oferece administração do host para instalar esse serviço."],"correct":[1]},{"id":"P-3.3.1-2","skill":"3.3.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Ao chegar uma foto a um bucket, uma rotina curta valida seu tamanho. Não há processamento fora dos eventos e o código não precisa de processos persistentes. Qual serviço executar?","options":["Amazon CloudFront Functions","AWS Batch com frota dedicada","Amazon ECS em EC2","AWS Lambda"],"why":["Roda em eventos de requisição e resposta do CloudFront, não na chegada de objetos ao bucket.","O requisito não demanda uma plataforma de filas de jobs nem capacidade dedicada.","Pode executar um consumidor, acrescentando operação de serviço e nós para o caso descrito.","O S3 pode notificar a função e a equipe não precisa operar servidores para o handler."],"correct":[3]},{"id":"P-3.3.2-1","skill":"3.3.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um grupo EC2 fica saturado no pico de cada manhã. O balanceador já distribui conexões, mas o grupo deve aumentar e diminuir a quantidade de instâncias conforme a demanda. O que configurar?","options":["Amazon Route 53 failover","Application Load Balancer","AWS CloudFormation Change Sets","Amazon EC2 Auto Scaling"],"why":["Pode alterar respostas DNS conforme integridade, sem lançar instâncias.","Distribui pedidos entre alvos, sem definir o tamanho do grupo.","Mostram mudanças de infraestrutura propostas, sem escalar com uma métrica.","Gerencia a capacidade desejada e inclui ou retira instâncias por política."],"correct":[3]},{"id":"P-3.3.2-2","skill":"3.3.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A aplicação usa o mesmo domínio para pagamentos e pedidos. O balanceador deve enviar cada caminho HTTP a um grupo de destino diferente. Qual escolher?","options":["Gateway Load Balancer","Roteamento ponderado no Route 53","Application Load Balancer","Network Load Balancer"],"why":["Integra appliances de rede, sem oferecer roteamento de aplicação por caminho.","Aplica-se a consultas DNS, cujo conteúdo não inclui o caminho da URL.","Suporta roteamento por caminho de URL na camada de aplicação.","Balanceia no nível de transporte, sem inspecionar o caminho HTTP para escolher o alvo."],"correct":[2]},{"id":"P-3.4.1-1","skill":"3.4.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um marketplace precisa ler carrinhos pelo ID do cliente com grande volume de solicitações. Os atributos podem variar e os acessos não dependem de junções relacionais. Qual banco é mais adequado?","options":["Amazon Neptune","Amazon Redshift","Amazon RDS para PostgreSQL","Amazon DynamoDB"],"why":["É orientado a grafos e travessias de relacionamentos.","Tem foco em consultas analíticas de grande volume, sem ser a escolha natural para carrinhos operacionais por chave.","Oferece banco relacional, sem atender à escolha por modelo chave-valor gerenciado do cenário.","É um banco de chave-valor e documentos com leituras organizadas por chave."],"correct":[3]},{"id":"P-3.4.1-2","skill":"3.4.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um aplicativo de terceiros só é homologado para Microsoft SQL Server. O time quer automatizar backups e delegar tarefas rotineiras de manutenção da instância de banco. Qual serviço oferece um motor compatível?","options":["Amazon DynamoDB","Amazon RDS para SQL Server","SQL Server em EC2","Amazon Aurora PostgreSQL"],"why":["Não fornece o motor nem a interface relacional requerida.","É uma opção gerenciada que oferece o mecanismo Microsoft SQL Server.","Preserva a compatibilidade, com gerenciamento do banco sob responsabilidade do time.","Usa compatibilidade PostgreSQL, não SQL Server."],"correct":[1]},{"id":"P-3.4.2-1","skill":"3.4.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"O banco de origem continuará disponível para escrita durante a migração. O destino deve receber uma carga inicial e as mudanças até o corte. Qual serviço cobre as duas fases?","options":["AWS DataSync","AWS Backup","AWS Database Migration Service","AWS Application Migration Service"],"why":["Transfere arquivos e objetos, sem interpretar o log de transação relacional.","Gerencia proteção e pontos de restauração, sem replicação contínua lógica para o destino descrito.","O DMS pode fazer full load e captura de alterações para origens e destinos suportados.","Replica servidores para migração de infraestrutura, sem ser a ferramenta específica para CDC entre bancos."],"correct":[2]},{"id":"P-3.4.2-2","skill":"3.4.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Antes de mover um banco Oracle para PostgreSQL, a equipe quer avaliar tipos, procedimentos e objetos que precisarão de adaptação manual. Qual capacidade ajuda nesta fase?","options":["Replicação CDC no AWS DMS","DMS Schema Conversion","AWS DataSync Discovery","AWS Backup Audit Manager"],"why":["Transfere alterações de dados, sem resolver por si a incompatibilidade de objetos do esquema.","Avalia e converte esquemas e código compatível em migrações heterogêneas.","Ajuda a avaliar armazenamento e movimentação de arquivos, sem analisar procedimentos SQL.","Avalia controles de backup e não a conversão entre mecanismos."],"correct":[1]},{"id":"P-3.5.1-1","skill":"3.5.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A aplicação precisa de endereçamento próprio, sub-redes de acesso público e privado, e rotas separadas. Qual serviço estabelece o limite de rede nesses requisitos?","options":["AWS Transit Gateway","Amazon Route 53","Amazon VPC","AWS PrivateLink"],"why":["Conecta redes existentes, sem criar as sub-redes da aplicação.","Resolve nomes por DNS e não administra endereçamento de sub-redes.","Define rede virtual, intervalos, sub-redes e tabelas de rotas.","Fornece conectividade privada a serviços, sem definir a rede virtual inteira."],"correct":[2]},{"id":"P-3.5.1-2","skill":"3.5.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um site vai trocar seu domínio para um novo balanceador. A equipe precisa editar os registros DNS públicos e manter a zona administrada na AWS. Qual serviço usar?","options":["Elastic Load Balancing","AWS Certificate Manager","Amazon Route 53","Amazon VPC IP Address Manager"],"why":["Recebe tráfego de aplicação, sem administrar a zona pública do domínio.","Emite ou gerencia certificados, sem ser o serviço de hospedagem de DNS.","A zona hospedada pública oferece registros DNS para o domínio.","Planeja blocos IP, sem publicar registros de DNS na internet."],"correct":[2]},{"id":"P-3.5.2-1","skill":"3.5.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma empresa quer ligar a rede da filial à VPC com túneis IPsec. Já tem internet e um dispositivo de gateway compatível. Qual serviço configurar?","options":["VPC Peering","AWS Direct Connect sem VPN","AWS Client VPN","AWS Site-to-Site VPN"],"why":["Interliga VPCs compatíveis, sem terminar túnel do datacenter.","A conexão dedicada não fornece por si o túnel IPsec requerido.","É adequada ao acesso remoto de usuários, distinto da ligação entre redes da filial e da VPC.","Usa túneis criptografados IPsec entre a rede cliente e o gateway na AWS."],"correct":[3]},{"id":"P-3.5.2-2","skill":"3.5.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A equipe de infraestrutura quer uma conexão privada dedicada de seu datacenter para a AWS. A empresa aceita contratar um parceiro de conectividade e planejar o prazo de instalação. Qual oferta cabe?","options":["Amazon CloudFront","AWS Direct Connect","AWS Network Firewall","AWS Site-to-Site VPN sobre internet"],"why":["Distribui conteúdo e não liga fisicamente o datacenter à AWS.","Cria uma conexão dedicada com interfaces virtuais para os destinos compatíveis.","Inspeciona tráfego e não provisiona conectividade física.","Fornece criptografia via internet pública, sem o circuito dedicado solicitado."],"correct":[1]},{"id":"P-3.6.1-1","skill":"3.6.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Um aplicativo guarda fotos em um namespace de objetos. Cada foto é recuperada pela chave e a aplicação usa uma API HTTP gerenciada. Qual armazenamento selecionar?","options":["Amazon EBS","Amazon EFS","Amazon S3","Amazon FSx for Windows File Server"],"why":["Expõe dispositivos de bloco a instâncias, fora do modelo de API por objeto.","Apresenta diretórios e arquivos via NFS.","Implementa buckets e acesso a objetos por chave.","Oferece compartilhamentos SMB compatíveis com Windows."],"correct":[2]},{"id":"P-3.6.1-2","skill":"3.6.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma AMI baseada em EBS precisa de disco de boot persistente para a instância EC2. O armazenamento deve aparecer como dispositivo de bloco. Qual serviço usar?","options":["Amazon EFS","Amazon EBS","Amazon FSx for Lustre","Amazon S3 Standard"],"why":["É montado como sistema de arquivos compartilhado, sem fornecer o disco de boot EBS.","Fornece volumes de bloco compatíveis com a inicialização de uma instância EC2.","Fornece sistema de arquivos voltado ao processamento de alto desempenho, não o volume raiz solicitado.","Implementa armazenamento de objetos, sem expor o volume raiz."],"correct":[1]},{"id":"P-3.6.2-1","skill":"3.6.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"O mesmo acervo alterna entre meses com picos de leitura e meses quase sem acesso. A equipe quer automatizar mudanças de camada com base no uso observado. Qual classe oferece isso?","options":["S3 Standard-IA","S3 One Zone-IA","S3 Intelligent-Tiering","S3 Glacier Deep Archive"],"why":["É uma classe específica com taxa de recuperação, sem alternar automaticamente com o acesso.","Guarda em uma única AZ e não realiza ajuste a dade de trabalhos de backup em um serviço central. Qual escolher?","options":["Amazon Inspector","Amazon S3 Replication","AWS Config","AWS Backup"],"why":["Analisa vulnerabilidades em recursos suportados, sem gerenciar backups.","Replica objetos em buckets e não substitui um plano central para bancos e volumes.","Avalia configuração e conformidade, sem criar os pontos de recuperação pedidos.","Organiza planos, agendas, retenção e backups em serviços suportados."],"correct":[3]},{"id":"P-4.1.1-1","skill":"4.1.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"Um lote de renderização grava checkpoints e recupera tarefas interrompidas. O prazo tem folga e reduzir o preço da capacidade EC2 é a prioridade. Qual opção de compra usar?","options":["Savings Plans","Hosts dedicados","Instâncias sob demanda","Instâncias Spot"],"why":["Trocam compromisso de gasto por desconto, compromisso desnecessário para um lote flexível.","Atendem cenários de isolamento ou licença e não ao uso de capacidade excedente.","Têm flexibilidade de prazo, mas não aproveitam o preço da capacidade Spot.","Usam capacidade excedente com desconto e podem ser interrompidas, risco aceito pelo lote."],"correct":[3]},{"id":"P-4.1.1-2","skill":"4.1.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"Uma aplicação ficará em teste por cinco dias e a equipe não aceita interrupções por retomada de capacidade excedente. O uso poderá terminar cedo e não haverá compromisso mensal ou anual. Qual modelo de compra EC2 atende?","options":["Instâncias Spot","Reserved Instances anuais","Compute Savings Plans","Instâncias sob demanda"],"why":["Podem ser retomadas pela AWS quando faltar capacidade excedente.","Vinculam o benefício a compromisso por um período maior que o evento.","Exigem um compromisso de gasto por hora de um ou três anos.","A empresa paga pelo uso sem compromisso prolongado, fora do modelo de interrupção Spot."],"correct":[3]},{"id":"P-4.1.2-1","skill":"4.1.2","domain":4,"form":nu
