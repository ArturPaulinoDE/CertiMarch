icies"],"why":["Ativa a tag de recurso no faturamento, permitindo atribuição em relatórios aplicáveis.","Contextualizam autorização da sessão, sem substituir as tags de custo dos recursos.","Organizam contas para visualizações de cobrança, mas não são o recurso que ativa a chave existente.","Limitam permissões nas contas, sem levar as tags de recurso ao faturamento."],"correct":[0]},{"id":"P-4.3.1-1","skill":"4.3.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"Uma carga de produção está indisponível. A conta tem cobertura de suporte técnico e o plantão precisa abrir um caso com severidade compatível. Em qual canal registrar?","options":["AWS re:Post público","AWS Health Dashboard público","AWS Support Center","AWS Trusted Advisor"],"why":["Permite perguntas à comunidade, sem abrir um caso com severidade contratada.","Mostra integridade pública de serviços, sem registrar o caso técnico privado.","É a interface para criar e gerenciar casos conforme o plano contratado.","Apresenta verificações e recomendações, sem ser a fila de atendimento técnico."],"correct":[2]},{"id":"P-4.3.1-2","skill":"4.3.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"A AWS publicou um aviso de manutenção. O time quer confirmar se as instâncias da sua conta aparecem entre os recursos afetados. Onde verificar?","options":["AWS Support Plans","Amazon CloudWatch Logs Insights","AWS Health Dashboard da conta","Página pública de status da AWS"],"why":["Apresenta características comerciais dos planos, sem listar instâncias afetadas.","Consulta logs configurados pelo cliente, sem ser o painel de eventos personalizados da AWS.","Apresenta eventos personalizados e recursos afetados quando identificados.","Mostra eventos públicos, sem a relação personalizada de instâncias da conta."],"correct":[2]},{"id":"P-3.8.3-1","skill":"3.8.3","domain":3,"form":null,"scored":true,"kind":"single","stem":"O pipeline já sabe quando um commit chega. Falta um ambiente gerenciado para baixar dependências, compilar e executar testes unitários. Qual serviço executa essa fase?","options":["AWS CodeBuild","AWS CodeDeploy","AWS CodePipeline","Amazon ECR"],"why":["Executa comandos de build e testes em um ambiente gerenciado por projeto.","Implanta revisões já produzidas em destinos suportados.","Coordena estágios e pode invocar o CodeBuild, sem fornecer o ambiente de compilação por si.","Armazena imagens, sem executar os testes solicitados."],"correct":[0]},{"id":"P-3.8.3-2","skill":"3.8.3","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma equipe quer visualizar uma sequência de entrega com origem, build, aprovação manual e implantação. Já possui ferramentas para executar as etapas. Qual serviço coordena a sequência?","options":["Amazon CloudWatch Synthetics","AWS CodeBuild","AWS CodePipeline","AWS CodeDeploy"],"why":["Monitora jornadas por meio de canaries, sem coordenar a entrega.","Executa a etapa de build, sem gerenciar sozinho a aprovação e implantação em sequência.","Modela estágios e ações que chamam os serviços ou integrações responsáveis pelas etapas.","Automatiza a implantação, sem comandar a entrega inteira descrita."],"correct":[2]},{"id":"P-3.8.4-1","skill":"3.8.4","domain":3,"form":null,"scored":true,"kind":"single","stem":"Sensores em lojas precisam autenticar individualmente e publicar telemetria por MQTT em um serviço gerenciado. Qual oferta fornece a integração de dispositivos?","options":["Amazon CloudFront","Amazon WorkSpaces","AWS Amplify Hosting","AWS IoT Core"],"why":["Entrega conteúdo em borda e não atua como broker MQTT.","Entrega desktops virtuais, fora do padrão de telemetria.","Implanta frontends web, sem ser o broker de dispositivos pedido.","Suporta comunicação MQTT autenticada e regras de encaminhamento para dispositivos."],"correct":[3]},{"id":"P-3.8.4-2","skill":"3.8.4","domain":3,"form":null,"scored":true,"kind":"single","stem":"Uma equipe quer publicar um site front-end a partir do Git, com previews e integração ao fluxo de build sem operar servidores web. Qual produto avaliar?","options":["AWS Amplify Hosting","Amazon WorkSpaces Applications","Amazon EC2 sem serviço de deploy","AWS IoT Core"],"why":["Oferece hospedagem e entrega contínua para aplicações web com integração a repositórios.","Entrega aplicações a usuários, fora da hospedagem web descrita.","Fornece capacidade, deixando a administração do servidor e a integração de build com a equipe.","Gerencia comunicação com dispositivos, sem hospedagem de frontend conectada ao Git."],"correct":[0]},{"id":"P-4.3.2-1","skill":"4.3.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"Um cliente com suporte Basic precisa corrigir informação de sua conta e esclarecer um lançamento da fatura. Não há incidente técnico. Qual tipo de atendimento buscar?","options":["Atendimento técnico de produção","AWS Trusted Advisor","AWS re:Post público","Suporte de conta e cobrança"],"why":["Destina-se a problemas técnicos sob cobertura contratada.","Mostra verificações e não corrige informações da conta.","É inadequado para tratar os dados privados da conta ou da fatura.","Esse atendimento está disponível para questões da conta e faturamento, inclusive no Basic."],"correct":[3]},{"id":"P-4.3.2-2","skill":"4.3.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"Um sistema crítico está indisponível e o cliente quer assistência técnica com severidade formal, de acordo com a cobertura aprovada. O que fazer?","options":["Publicar o incidente em fórum aberto","Abrir um caso técnico conforme o plano","Abrir um caso de cobrança","Consultar o status público"],"why":["O fórum não concede atendimento sob o plano nem a severidade pedida.","O plano define canais, severidades elegíveis e os compromissos de resposta.","A equipe de cobrança trata pagamentos e conta, fora do incidente de aplicação.","Pode fornecer contexto, mas não inicia atendimento técnico individual."],"correct":[1]},{"id":"A-M-1.1.1","skill":"1.1.1","domain":1,"stem":"Uma aplicação tem picos curtos e a equipe precisa testar uma ideia esta semana. Quais DUAS vantagens da nuvem correspondem diretamente ao cenário?","options":["Ajustar capacidade ao longo do pico","Provisionar rapidamente ambiente temporário","Fixar capacidade pela maior demanda do ano","Ter eliminação de custos de rede","Delegar toda autorização de dados à AWS"],"correct":[0,1],"why":["Atende variação.","Atende agilidade.","Mantém ociosidade entre picos.","A cobrança depende do tráfego e serviços.","O cliente continua responsável."],"kind":"multi","form":"A","scored":true},{"id":"A-1.1.2-1","skill":"1.1.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"Um aplicativo precisa continuar durante indisponibilidade de uma zona. A política exige manter os dados e a aplicação na mesma Região. Que desenho atende?","options":["Uma edge location no país","Mover os dados toda noite para outra Região","Duas instâncias na mesma zona","Componentes redundantes em múltiplas Availability Zones"],"why":["Borda não substitui os componentes aplicacionais perdidos na zona.","Pode ajudar recuperação regional, mas contraria o requisito de localidade e não assegura continuidade.","Ambas podem ser afetadas pela falha zonal.","Distribui recursos em domínios de falha distintos dentro da Região."],"correct":[3]},{"id":"A-1.2.1-1","skill":"1.2.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"A aplicação mantém o mesmo nível de serviço. O objetivo declarado é diminuir o impacto ambiental por transação ao retirar compute ocioso. Qual pilar?","options":["Sustentabilidade","Segurança","Otimização de custos","Confiabilidade"],"why":["A métrica escolhida é impacto ambiental por unidade de trabalho.","A mudança não é motivada por proteção de recursos.","Retirar ociosidade pode reduzir custo, mas o objetivo enfatiza impacto ambiental.","Não há teste de disponibilidade ou falha."],"correct":[0]},{"id":"A-1.2.2-1","skill":"1.2.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"Três servidores HTTP já estão provisionados. O requisito é encaminhar cada requisição a um alvo saudável sem aumentar a capacidade do grupo. Qual componente?","options":["Amazon SQS","AWS Direct Connect","EC2 Auto Scaling sozinho","Elastic Load Balancing"],"why":["Desacopla processamento assíncrono, diferente do encaminhamento HTTP síncrono pedido.","Fornece conectividade dedicada, sem rotear por saúde do alvo HTTP.","Altera número de instâncias, mas não substitui o balanceador de requisições.","Distribui tráfego e verifica saúde dos alvos configurados."],"correct":[3]},{"id":"A-1.3.1-1","skill":"1.3.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"A organização encerra o CRM próprio e contrata um SaaS. Os dados serão importados para o produto do fornecedor. Como classificar?","options":["Refactor","Relocate","Rehost","Repurchase"],"why":["O time substitui o produto em vez de redesenhar seu código.","Não move uma plataforma inteira preservando as cargas existentes.","Não transfere a aplicação antiga praticamente intacta.","Adota outro produto para cumprir a função de negócio."],"correct":[3]},{"id":"A-1.3.2-1","skill":"1.3.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"A migração já está aprovada. Um banco relacional suportado precisa copiar dados e manter mudanças incrementais até a data de corte. Qual serviço?","options":["AWS CAF","AWS DMS","AWS DataSync como leitor do log SQL","AWS Pricing Calculator"],"why":["Ajuda a estruturar adoção, sem executar a cópia de dados.","Permite carga e captura de mudanças em fontes e alvos compatíveis.","Transfere arquivos e objetos, não interpreta as mudanças da base como CDC relacional.","Estima custo, não transfere os dados."],"correct":[1]},{"id":"A-1.4.1-1","skill":"1.4.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"Um provedor divide despesas estruturais entre milhares de clientes e pode obter menor custo por unidade de recurso. Que conceito explica o efeito?","options":["Elasticidade do cliente","Economia de escala","Responsabilidade compartilhada","Custo de saída entre Regiões"],"why":["Ajusta capacidade de um workload, sem explicar agregação de demanda do provedor.","Volume agregado dilui custos e pode reduzir custo unitário.","Divide controles de segurança, sem explicar redução de custo unitário.","É um direcionador de cobrança, não a diluição de custos estruturais."],"correct":[1]},{"id":"A-1.4.2-1","skill":"1.4.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"Uma API sofre picos imprevisíveis. A empresa não quer manter quinze servidores ligados o dia todo, mas precisa aumentar a quantidade quando a utilização sobe. Qual medida?","options":["EC2 Auto Scaling orientado à demanda","Uma instância maior fixa","Distribuição geográfica de DNS","Plano de preços com compromisso sozinho"],"why":["Altera a capacidade do grupo conforme métricas configuradas.","Pode ajudar no pico, mas mantém capacidade alocada também no vale.","Seleciona destino, sem aumentar a quantidade de compute.","Altera custo por unidade elegível, não a resposta de capacidade."],"correct":[0]},{"id":"A-1.2.3-1","skill":"1.2.3","domain":1,"form":"A","scored":true,"kind":"single","stem":"Um banco responde lentamente ao aumentar o volume. A equipe testa tamanhos e mede latência e saturação antes de escolher. Qual pilar guia a seleção de recursos?","options":["Eficiência de desempenho","Sustentabilidade","Otimização de custos","Segurança"],"why":["O experimento mede como recursos atendem aos requisitos de processamento.","A seleção não é avaliada por impacto ambiental.","O requisito destacado é desempenho, mesmo que a escolha também afete gasto.","Não investiga identidade, ameaça ou proteção."],"correct":[0]},{"id":"A-1.1.1-1","skill":"1.1.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"Uma aplicação passa de quatro para doze instâncias na abertura do mercado e volta a quatro após o pico. A mudança depende da demanda medida. O que ela demonstra?","options":["Disponibilidade Multi-AZ","Provisionamento estático","Elasticidade","Escalonamento vertical"],"why":["O cenário não depende de tolerar a perda de uma zona.","A capacidade não permanece fixa.","Recursos crescem e encolhem conforme o uso.","Aumento de quantidade não é aumento de tamanho de uma instância."],"correct":[2]},{"id":"A-1.1.2-2","skill":"1.1.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"Uma base tem backup uma vez por dia. O teste restaura em trinta minutos, porém pode perder quase um dia de transações. O máximo permitido de perda é uma hora. Qual objetivo está sendo violado?","options":["Utilização média","RTO","RPO","SLA de resposta do suporte"],"why":["Não indica atualização da cópia.","Os trinta minutos medem tempo de recuperação, não perda.","A versão restaurável pode ficar muito mais que uma hora atrás.","Não determina até onde os dados foram restaurados."],"correct":[2]},{"id":"A-1.2.1-2","skill":"1.2.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"O time mede latência p95 e throughput para comparar tipos de instância sob a mesma carga. Quer selecionar recursos adequados à demanda. Qual pilar orienta a decisão?","options":["Excelência operacional","Sustentabilidade","Confiabilidade","Eficiência de desempenho"],"why":["O experimento não tem como foco mudar procedimentos de operação.","Não foi definido resultado sobre impacto ambiental.","Sustentar recuperação diante de falha seria outro objetivo.","A seleção e a medição tratam capacidade e desempenho."],"correct":[3]},{"id":"A-1.2.2-2","skill":"1.2.2","domain":1,"form":"A","scored":false,"kind":"single","stem":"Uma API usa balanceador e já possui health checks. Durante picos, precisa adicionar EC2 até voltar à utilização alvo. Qual mecanismo completar?","options":["Uma fila de notificações SNS","Um novo listener do ALB","Reservar mais armazenamento EBS","EC2 Auto Scaling"],"why":["SNS distribui mensagens, sem ajustar instâncias por utilização.","A regra de tráfego não altera a capacidade do grupo.","Capacidade de disco não é a contagem de servidores.","A política do grupo ajusta o número de instâncias pelo alvo."],"correct":[3]},{"id":"A-1.3.1-2","skill":"1.3.1","domain":1,"form":"A","scored":false,"kind":"single","stem":"Um monólito será reescrito em serviços desacoplados, com novos contratos e componentes gerenciados. Qual estratégia predomina?","options":["Retain","Replatform","Rehost","Refactor"],"why":["A aplicação é transformada, não mantida como está.","O alcance supera uma otimização pontual de plataforma.","Mover a aplicação sem mudanças amplas não descreve o plano.","Há redesenho de arquitetura e alteração estrutural do código."],"correct":[3]},{"id":"A-1.3.2-2","skill":"1.3.2","domain":1,"form":"A","scored":false,"kind":"single","stem":"A área financeira quer estimar gasto de uma configuração ainda não implantada. A equipe já conhece Região, volumes e serviços. Qual ferramenta?","options":["AWS Pricing Calculator","Cost Explorer como única fonte","Amazon CloudWatch","AWS Artifact"],"why":["Modela custo estimado a partir da configuração proposta.","Analisa uso e custo registrados, sem substituir a simulação detalhada da nova arquitetura.","Mede atividade de recursos em operação, que ainda não existem no cenário.","Fornece relatórios de conformidade, não preços."],"correct":[0]},{"id":"A-1.4.1-2","skill":"1.4.1","domain":1,"form":"A","scored":false,"kind":"single","stem":"Uma carga estável justifica comprometer gasto por hora em troca de desconto no uso elegível. Que mecanismo o plano explora?","options":["Capacidade Spot interrompível","Alocação por tags","Compromisso de consumo para desconto","Economia por desligamento de laboratório"],"why":["O desconto decorre de capacidade excedente sujeita à interrupção, não de compromisso.","Explica quem incorre no gasto, sem negociar a tarifa.","O cliente assume obrigação de pagamento para acessar o benefício de preço.","Reduz horas, sem assumir preço por prazo."],"correct":[2]},{"id":"A-M-2.3.1","skill":"2.3.1","domain":2,"stem":"Quais DUAS decisões seguem as práticas de identidade para uma conta que hospeda um aplicativo EC2?","options":["Proteger root com MFA","Usar role IAM no EC2","Distribuir chaves de root entre operadores","Compartilhar uma access key permanente entre instâncias","Autorizar os buckets por conveniência"],"correct":[0,1],"why":["MFA adiciona uma camada à identidade privilegiada.","Fornece credenciais temporárias ao workload.","Amplia exposição de privilégio máximo.","Dificulta rotação e rastreabilidade.","Desrespeita o escopo mínimo."],"kind":"multi","form":"A","scored":true},{"id":"A-M-2.1.1","skill":"2.1.1","domain":2,"stem":"Em EC2 com SO Linux escolhido pelo cliente, quais DUAS responsabilidades são da AWS?","options":["Controlar acesso físico ao datacenter","Manter o hardware físico do host","Atualizar a biblioteca da aplicação","Configurar grupos de segurança do workload","Aplicar patches ao Linux convidado"],"correct":[0,1],"why":["É parte da infraestrutura.","É responsabilidade da AWS.","O cliente cuida do software instalado.","O cliente define controles do recurso.","Em EC2 o cliente administra o SO convidado."],"kind":"multi","form":"A","scored":true},{"id":"A-2.1.2-1","skill":"2.1.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Segurança precisa definir quais segmentos da aplicação compartilham acesso ao dado. A decisão depende de regras internas. Qual categoria descreve o controle?","options":["Controle exclusivo da AWS em serviço gerenciado","Controle herdado de acesso físico","Evidência independente do fornecedor","Controle específico do cliente"],"why":["A política de dados ainda depende do cliente.","Não governa segmentação de aplicação ou dados.","Um relatório não implementa a segmentação.","A configuração lógica depende da política da organização."],"correct":[3]},{"id":"A-2.2.1-1","skill":"2.2.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma política de bucket foi alterada às 15h. O auditor quer identificar a identidade da chamada de gerenciamento. Qual fonte consultar?","options":["AWS CloudTrail","Amazon Macie","AWS Pricing Calculator","Amazon CloudWatch Metrics"],"why":["Registra atividade de API coberta com informações de identidade.","Identifica dados sensíveis em S3, sem rastrear a autoria dessa alteração.","Simula custo da arquitetura, sem trilha de API.","Séries de métricas não associam por si só essa chamada a um principal."],"correct":[0]},{"id":"A-2.2.2-1","skill":"2.2.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma norma exige que volumes compatíveis atendam a uma configuração aprovada. A equipe quer avaliação por regra e histórico de conformidade. Qual serviço?","options":["AWS Config","Amazon GuardDuty","AWS CloudTrail","AWS Budgets"],"why":["Registra estado e avalia configuração por regras.","Detecta ameaças, sem comparar a configuração à norma como pedido.","A trilha de chamadas não equivale à avaliação contínua da regra.","Acompanha uso e custo, não configuração."],"correct":[0]},{"id":"A-2.3.2-1","skill":"2.3.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"A empresa precisa estabelecer uma landing zone multi-account e padronizar a criação e governança das contas. Qual serviço foi desenhado para isso?","options":["IAM Identity Center isolado","Consolidar credenciais no usuário root","AWS Control Tower","AWS Cost Explorer"],"why":["É parte do acesso central, sem sozinho orquestrar toda a landing zone.","Não implementa governança multi-account.","Automatiza a configuração inicial e controles da landing zone.","Analisa custos, sem criar contas governadas."],"correct":[2]},{"id":"A-2.4.1-1","skill":"2.4.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"A organização precisa descobrir se seus buckets S3 armazenam documentos com números de identificação pessoal. Qual ferramenta classifica esse conteúdo?","options":["Amazon Macie","AWS Artifact","Amazon Inspector","AWS Shield"],"why":["Identifica dados sensíveis em objetos do S3 no escopo configurado.","Fornece documentos de auditoria, sem analisar conteúdo do cliente.","Avalia vulnerabilidades de workloads, sem classificar PII em documentos.","Protege contra DDoS, não inspeciona o conteúdo dos buckets para essa finalidade."],"correct":[0]},{"id":"A-2.4.2-1","skill":"2.4.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Diversas equipes têm aplicações em contas distintas. Segurança precisa aplicar uma política WAF consistente em toda a organização. Qual serviço?","options":["AWS Artifact","Amazon Route 53","AWS Firewall Manager","Criar regras manualmente em uma conta"],"why":["Fornece relatórios, não aplica políticas de firewall.","Gerencia DNS, não distribui políticas WAF pela organização.","Gerencia políticas de firewall centralmente no escopo configurado.","Não garante aplicação consistente aos demais ambientes."],"correct":[2]},{"id":"A-2.2.3-1","skill":"2.2.3","domain":2,"form":"A","scored":true,"kind":"single","stem":"Um load balancer oferece HTTPS. A equipe quer emitir e administrar o certificado em integração suportada. Qual serviço?","options":["AWS Secrets Manager como autoridade certificadora","AWS Certificate Manager","AWS KMS para SSE-KMS","AWS WAF"],"why":["Pode guardar material sensível, mas não é o emissor gerenciado solicitado.","Fornece certificados TLS e integração com endpoints compatíveis.","Controle de chaves de dados em repouso não emite o certificado HTTPS.","Filtra requisições, sem emitir o certificado."],"correct":[1]},{"id":"A-2.4.3-1","skill":"2.4.3","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma aplicação precisa bloquear requisições conforme o conteúdo de um parâmetro de URL. A origem do tráfego e sua porta são válidas. Qual controle?","options":["Uma rota para o endpoint privado","AWS WAF","Security group por porta","AWS IAM para negar uso do console"],"why":["Altera caminho de rede sem inspecionar parâmetro.","Avalia parâmetros de aplicação no HTTP.","A porta é permitida e essa regra não examina a URL.","Controla APIs administrativas, não esse parâmetro HTTP."],"correct":[1]},{"id":"A-2.3.1-1","skill":"2.3.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma conta quer autorizar outro principal a assumir uma role. A role já tem políticas que permitem ler os dados depois da sessão criada. O que configura quem pode assumi-la?","options":["A política de ciclo de vida do bucket","O alarme CloudWatch de autenticação","A política de confiança da role","A política de permissões que descreve leitura"],"why":["Controla versões e transições, não assunção de role.","Detecta condição definida, mas não autoriza a assunção.","Define principais e condições de assunção.","Define o que a sessão pode fazer depois de assumir."],"correct":[2]},{"id":"A-2.1.1-1","skill":"2.1.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma auditoria separa proteção de datacenter físico e configuração de workloads. Quem controla a entrada de pessoas no prédio que hospeda os servidores AWS?","options":["O cliente que implantou a VPC","O responsável por executar patches no EC2 convidado","A organização que consome o serviço RDS","A AWS"],"why":["A VPC é controle lógico e não opera portas do datacenter.","Essa tarefa do cliente ocorre numa camada diferente.","Consumir um banco gerenciado não transfere acesso físico ao prédio.","A proteção física fica na infraestrutura do provedor."],"correct":[3]},{"id":"A-2.1.2-2","skill":"2.1.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma equipe precisa comprovar que a infraestrutura da AWS está dentro do escopo de uma revisão independente. Qual evidência deve buscar?","options":["Uma regra AWS Config recém-criada","Relatório de conformidade do provedor no AWS Artifact","Uma estimativa de preço da Região","O log da aplicação do cliente"],"why":["Avalia configuração do cliente, não comprova revisão do fornecedor.","Documenta controles e escopo avaliados externamente.","Não evidencia cobertura de controles.","Mostra operação própria, não auditoria da infraestrutura AWS."],"correct":[1]},{"id":"A-2.2.1-2","skill":"2.2.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma auditoria precisa saber quando um volume deixou de atender a uma regra de configuração. A identidade que executou a alteração é questão posterior. Qual serviço?","options":["AWS CloudTrail","AWS Config","AWS Artifact","AWS WAF"],"why":["Mostra ações realizadas, mas não é a avaliação histórica da regra.","Mantém histórico de configuração e avaliação de regras aplicáveis.","Fornece documentos da AWS, não estado do recurso.","Filtra solicitações web, sem avaliar configuração de volumes."],"correct":[1]},{"id":"A-2.2.2-2","skill":"2.2.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Uma aplicação publica eventos de pedido. Destinos devem variar segundo país e status, sem o produtor selecionar cada destino. Qual serviço rotea por atributos?","options":["Uma fila SQS única","AWS Config","Amazon EventBridge","Uma consulta Athena"],"why":["Retém trabalho para consumidores, sem configurar sozinha as regras de roteamento solicitadas.","Avalia recursos e não é o barramento de eventos de pedidos.","Regras de eventos selecionam destinos por critérios configurados.","Analisa dados armazenados, sem rotear eventos no fluxo."],"correct":[2]},{"id":"A-2.3.2-2","skill":"2.3.2","domain":2,"form":"A","scored":false,"kind":"single","stem":"Uma SCP permite que determinada ação permaneça disponível, mas a role ainda não tem nenhuma autorização para executá-la. Que tipo de política concede essa ação à role?","options":["A mesma SCP permissiva","Política de permissões IAM","A trust policy da role","Uma tag de alocação de custos"],"why":["SCP é limite, não concessão para o principal.","A concessão efetiva da ação vem da autorização da identidade, sujeita às restrições aplicáveis.","Define quem pode assumi-la e não as APIs após a assunção.","Agrupa gastos, sem conceder API."],"correct":[1]},{"id":"A-2.4.1-2","skill":"2.4.1","domain":2,"form":"A","scored":false,"kind":"single","stem":"A equipe já recebe achados de várias ferramentas. Agora quer consolidar essas evidências e observar postura de segurança numa visão central. Qual serviço?","options":["AWS Config como única lista de achados","Amazon Macie como agregador geral","AWS Security Hub","AWS IAM como dashboard de achados"],"why":["Avalia configuração, mas não substitui a consolidação pedida.","Gera achados de dados sensíveis, sem ser a visão geral requerida.","Consolida achados e auxilia a acompanhar postura de segurança.","Define acesso, sem agregar os achados de diversas ferramentas."],"correct":[2]},{"id":"A-2.4.2-2","skill":"2.4.2","domain":2,"form":"A","scored":false,"kind":"single","stem":"O banco aceita TCP de aplicação. O requisito diz que apenas instâncias associadas ao grupo da aplicação devem alcançar sua porta. Qual controle usar?","options":["Política WAF de caminho URL","Security group referenciando o grupo da aplicação","AWS Shield para o cliente do banco","Política de ciclo de vida de snapshots"],"why":["HTTP não é o contrato de acesso ao banco TCP.","Permite vincular origem a recursos associados conforme suporte.","Proteção DDoS não configura a permissão por grupo.","Não controla conexão à porta."],"correct":[1]},{"id":"A-2.2.3-2","skill":"2.2.3","domain":2,"form":"A","scored":false,"kind":"single","stem":"O segredo e a chave já existem. A aplicação deve usar só a chave e ler apenas aquele segredo. Qual serviço expressa as permissões da identidade?","options":["Amazon Inspector","Network ACL","AWS IAM","AWS Certificate Manager"],"why":["Aponta vulnerabilidades, sem conceder uso de recurso.","Filtra tráfego na sub-rede, sem autorizar APIs de segredo e chave por identidade.","Políticas da role especificam ações e recursos autorizados, em conjunto com políticas aplicáveis.","Gerencia certificados, não a política da role."],"correct":[2]},{"id":"A-M-3.6.1","skill":"3.6.1","domain":3,"stem":"Uma equipe usa buckets para relatórios e precisa de volume de boot para EC2. Quais DUAS associações estão corretas?","options":["S3 para guardar e ler relatórios como objetos","EBS para volume de inicialização EC2","EFS para volume raiz nativo de bloco do EC2","CloudFront como destino de gravação durável","DynamoDB como disco de boot"],"correct":[0,1],"why":["A API trabalha com objetos.","Fornece armazenamento em bloco.","EFS oferece NFS.","Entrega conteúdo na borda.","É banco NoSQL."],"kind":"multi","form":"A","scored":true},{"id":"A-M-3.2.1","skill":"3.2.1","domain":3,"stem":"Quais DUAS afirmações descrevem corretamente Região e Availability Zone?","options":["Uma Região contém múltiplas zonas de disponibilidade","O serviço pode distribuir recursos por zonas para tolerar uma falha zonal","Cada zona é uma Região distinta","Edge location é sinônimo de Availability Zone","Cada serviço AWS tem a mesma disponibilidade nas diferentes Regiões"],"correct":[0,1],"why":["São domínios isolados dentro da Região.","Redundância zonal atende ao requisito.","Confunde escopos.","A borda é outro tipo de infraestrutura.","O suporte depende do serviço."],"kind":"multi","form":"A","scored":true},{"id":"A-3.1.1-1","skill":"3.1.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"Um operador pretende listar instâncias toda manhã e alimentar um script Bash com a saída. A ferramenta deve chamar as APIs da AWS a partir do terminal. Qual usar?","options":["AWS Management Console","AWS SDK para Java","AWS CLI","AWS CloudShell como biblioteca"],"why":["A navegação manual no navegador não atende à execução agendada do Bash.","Integra chamadas em aplicações Java, fora da interface de shell solicitada.","Os comandos da CLI acessam as APIs e produzem saída processável pelo script.","É um ambiente de terminal, não a interface de comandos da AWS."],"correct":[2]},{"id":"A-3.1.2-1","skill":"3.1.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"O projeto encerrou o datacenter anterior. API, banco e processamento agora usam apenas serviços AWS. Qual classificação descreve o ambiente da aplicação?","options":["Implantação on-premises","Implantação multicloud","Implantação inteiramente em nuvem","Implantação híbrida"],"why":["Os componentes estariam em infraestrutura própria.","A descrição apresenta um único provedor.","Todos os componentes da carga são executados em recursos da nuvem.","Pressupõe integração entre nuvem e infraestrutura local na carga."],"correct":[2]},{"id":"A-3.3.1-1","skill":"3.3.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"A empresa já usa manifests Kubernetes e quer continuar enviando objetos para a API Kubernetes. Pretende delegar a operação do plano de controle à AWS. Qual serviço adotar?","options":["Amazon EKS","Amazon ECS","AWS Elastic Beanstalk","Amazon EC2 com Kubernetes autogerenciado"],"why":["Fornece um plano de controle Kubernetes gerenciado.","Organiza contêineres com APIs e objetos próprios do ECS.","Orquestra deploy de aplicações, mas não entrega a API Kubernetes requerida.","Mantém com a equipe a operação do plano de controle."],"correct":[0]},{"id":"A-3.3.2-1","skill":"3.3.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"Uma aplicação TCP personalizada precisa de balanceamento gerenciado na camada de transporte. A equipe quer manter o protocolo e não usa cabeçalhos HTTP. Qual tipo atende?","options":["Network Load Balancer","AWS Global Accelerator sozinho","Application Load Balancer","Amazon CloudFront"],"why":["Suporta listeners de transporte apropriados para conexões TCP.","Direciona tráfego aos endpoints configurados e não é o balanceador de camada de transporte entre os alvos EC2 pedido.","Orienta-se ao tráfego HTTP/HTTPS e não atende o TCP personalizado descrito.","É uma CDN de distribuição de conteúdo web, sem listener TCP arbitrário."],"correct":[0]},{"id":"A-3.4.1-1","skill":"3.4.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"O time de BI analisa anos de vendas com agregações pesadas e muitos relatórios sobre fatos históricos. Quer um data warehouse gerenciado. Qual serviço selecionar?","options":["Amazon DynamoDB","Amazon Redshift","Amazon ElastiCache","Amazon RDS para MySQL"],"why":["Favorece padrões por chave, em vez de um warehouse SQL para BI.","É um data warehouse voltado a análise SQL de grandes volumes e agregações.","Serve acessos de baixa latência em memória, sem histórico analítico em warehouse.","Tem foco em banco relacional operacional e não é o data warehouse pedido."],"correct":[1]},{"id":"A-3.4.2-1","skill":"3.4.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"Uma API relê dados de sessão em quase todas as requisições. A equipe quer uma camada gerenciada em memória para reduzir consultas repetitivas ao banco principal. Qual serviço adotar?","options":["Amazon ElastiCache","Amazon Redshift","Amazon Aurora Global Database","Amazon EFS"],"why":["Oferece cache em memória de baixa latência para dados acessados repetidamente.","Foi projetado para análise de dados em warehouse, sem otimizar esse cache de sessão.","Replica um banco Aurora entre Regiões, sem acrescentar uma camada de cache em memória da aplicação.","Compartilha arquivos via NFS, sem fornecer o cache chave-valor pedido."],"correct":[0]},{"id":"A-3.5.1-1","skill":"3.5.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"Uma editora quer servir capas de livros em cache próximo ao leitor, reduzindo tráfego para a origem. O conteúdo público é entregue por HTTPS. Qual serviço implantar?","options":["AWS WAF","AWS Direct Connect","Amazon CloudFront","AWS Global Accelerator"],"why":["Filtra requisições web, sem replicar conteúdo em caches.","Conecta um local físico à AWS e não distribui imagens para o público.","A CDN pode armazenar cópias na borda e entregar o conteúdo via HTTPS.","Acelera o caminho de rede, sem manter cache HTTP desse conteúdo."],"correct":[2]},{"id":"A-3.5.2-1","skill":"3.5.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"Instâncias em sub-rede privada precisam baixar patches públicos via IPv4. O desenho deve manter os hosts sem IP público e aceitar respostas ao tráfego iniciado por eles. Qual componente de saída usar?","options":["Gateway endpoint do S3","NAT gateway público","Internet gateway ligado diretamente à rota privada","AWS Client VPN"],"why":["Acessa destinos como S3 compatíveis com o endpoint, sem fornecer acesso a repositórios públicos arbitrários.","O gateway, em sub-rede pública com rota de internet, traduz o tráfego iniciado pelos hosts privados.","As instâncias IPv4 sem endereços públicos não ganham acesso direto com essa rota.","Conecta clientes remotos à rede privada, sem fornecer a saída IPv4 descrita."],"correct":[1]},{"id":"A-3.6.2-1","skill":"3.6.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"O site serve arquivos públicos todos os dias e não quer cobrança de recuperação típica de classes de acesso infrequente. Quer baixa latência e resiliência em múltiplas AZs. Qual classe cabe?","options":["S3 Express One Zone","S3 Glacier Flexible Retrieval","S3 Standard","S3 Standard-IA"],"why":["O escopo em uma AZ diverge do requisito de múltiplas AZs.","Normalmente requer restauração antes de ler o objeto.","É indicada para acesso frequente, com baixa latência e redundância em várias AZs.","Foca acesso infrequente e tem taxa de recuperação de dados."],"correct":[2]},{"id":"A-3.7.1-1","skill":"3.7.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"Um varejista consolida fatos de venda e dimensões em um data warehouse gerenciado. Os relatórios recorrentes combinam grandes conjuntos e usam SQL. Qual serviço avaliar?","options":["Amazon Kinesis Data Streams","Amazon DynamoDB","Amazon Redshift","AWS Glue Data Catalog"],"why":["Transporta eventos de streaming, sem hospedar um data warehouse SQL.","O modelo chave-valor não of AWS Health Dashboard da conta"],"why":["Apresenta recomendações de custo, sem ser a lista de recursos da manutenção anunciada.","Consolida informações de cobrança, não eventos de serviço com recursos afetados.","Mostra atividade de API, sem substituir a comunicação personalizada de manutenção da AWS.","Exibe eventos relevantes à conta e os recursos afetados quando disponíveis."],"correct":[3]},{"id":"A-3.8.3-1","skill":"3.8.3","domain":3,"form":"A","scored":true,"kind":"single","stem":"Um artefato de aplicação já foi compilado. A equipe quer automatizar a instalação da nova revisão em instâncias EC2 compatíveis, com estratégia de rollout. Qual serviço usar?","options":["AWS Artifact","AWS CodePipeline sem ação de deploy","AWS CodeBuild","AWS CodeDeploy"],"why":["Disponibiliza relatórios e acordos de conformidade da AWS.","Um pipeline sem capacidade de implantação configurada não instala a revisão nos alvos.","Foi projetado para construir e testar, enquanto o artefato aqui já existe.","Coordena a implantação em destinos suportados, com configurações do grupo de implantação."],"correct":[3]},{"id":"A-3.8.4-1","skill":"3.8.4","domain":3,"form":"A","scored":true,"kind":"single","stem":"Uma equipe remota precisa de desktops virtuais completos e administrados centralmente. Cada profissional deve acessar um ambiente de trabalho e usar várias ferramentas corporativas. Qual produto atende?","options":["AWS Client VPN","Amazon WorkSpaces Personal","AWS IoT Device Management","Amazon CloudFront"],"why":["Oferece conectividade remota e não entrega a estação de trabalho virtual.","Fornece desktops virtuais persistentes para usuários, adequados à estação de trabalho descrita.","Administra frotas de dispositivos IoT, sem fornecer desktops.","Distribui conteúdo web e não fornece sessões de desktop."],"correct":[1]},{"id":"A-3.6.1-1","skill":"3.6.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"Várias instâncias Linux precisam montar o mesmo diretório de conteúdo, inclusive quando a frota escala entre AZs. A aplicação exige NFS compartilhado. Qual opção usar?","options":["Amazon EBS gp3","Amazon EC2 Instance Store","Amazon S3 em uma classe Standard","Amazon EFS Regional"],"why":["Oferece volume de bloco, sem o compartilhamento NFS solicitado.","É armazenamento efêmero ligado a cada host, sem compartilhamento.","Mantém objetos, sem a interface NFS gerenciada requerida.","Fornece um sistema de arquivos NFS compartilhado com pontos de montagem nas AZs configuradas."],"correct":[3]},{"id":"A-3.2.1-1","skill":"3.2.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"Uma aplicação precisa sobreviver a uma falha física localizada. A empresa quer manter dados e computação na mesma Região, em grupos com energia e rede independentes. Que unidade deve variar entre os grupos?","options":["VPC","Edge location","Zona hospedada do Route 53","Availability Zone"],"why":["Criar duas VPCs na mesma AZ não cria isolamento de infraestrutura zonal.","A borda de entrega não substitui AZs da Região para essa carga.","Mantém registros DNS, sem isolar fisicamente os componentes.","Separar por AZ usa domínios de falha distintos dentro da Região."],"correct":[3]},{"id":"A-3.1.1-2","skill":"3.1.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"Uma API em Java grava objetos no S3. O time quer fazer chamadas no próprio processo e usar o provedor de credenciais da biblioteca. Qual opção escolher?","options":["AWS CLI","AWS SDK para Java","Amazon API Gateway","AWS Cloud9"],"why":["Exigiria invocar um processo de comando externo.","Oferece clientes Java para as APIs e uma cadeia de provedores de credenciais.","Publica e gerencia APIs, sem fornecer o cliente Java do S3.","Um ambiente de desenvolvimento não substitui a biblioteca da aplicação."],"correct":[1]},{"id":"A-3.1.2-2","skill":"3.1.2","domain":3,"form":"A","scored":false,"kind":"single","stem":"Por norma interna, dados e processamento de uma aplicação permanecem inteiramente em ser nidades (horizontal). Agilidade é reduzir o tempo entre a ideia e o provisionamento. Cada propriedade resolve um problema diferente: variação, capacidade ou velocidade de entrega.","control":"Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência.","pitfall":"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.","verify":"Use uma curva de uma semana e marque pico, vale e capacidade. Explique o que muda se o comportamento se torna previsível e constante.","decisions":[["Elasticidade","A capacidade aumenta e diminui de acordo com a demanda."],["Escala vertical","O tamanho de uma unidade de computação cresce para suportar carga adicional."],["Agilidade","O tempo de provisionamento ou de experimentação é encurtado."],["Alta disponibilidade","Redundância reduz interrupção diante de falha de um componente."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-1.1.1-1","prompt":"Uma bilheteria recebe dez vezes mais tráfego no início das vendas. Depois de duas horas, quer liberar a capacidade extra. Que característica atende às duas fases?","solution":"Elasticidade","explanation":"A capacidade acompanha tanto aumento quanto queda da demanda.","options":[["Escala vertical fixa","Uma máquina maior pode sustentar o pico, mas continua provisionada depois."],["Alta disponibilidade","Trata interrupção por falha, não o ajuste entre pico e vale."],["Migração híbrida","Descreve distribuição entre ambientes, não ajuste de capacidade."],["Elasticidade","A capacidade acompanha tanto aumento quanto queda da demanda."]]},{"id":"P-1.1.1-2","prompt":"Uma equipe tinha de aguardar a compra de servidores para testar um protótipo. Agora cria e descarta um ambiente no mesmo dia. Qual benefício mudou o prazo de teste?","solution":"Agilidade","explanation":"Provisionar sob demanda reduz o tempo entre ideia e teste.","options":[["Economia de escala do provedor","Pode influenciar preço unitário, mas o cenário compara tempo."],["Agilidade","Provisionar sob demanda reduz o tempo entre ideia e teste."],["Escalabilidade vertical","Trocar tamanho da máquina não explica o provisionamento inicial rápido."],["Recuperação de desastre","O ambiente é criado para teste, não para restaurar um serviço."]]}],"cue":"Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair. Que benefício está em uso?","answer":"Elasticidade","use":"Atende ao requisito. A capacidade aumenta e diminui de acordo com a demanda.","avoid":"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.","example":"Use uma curva de uma semana e marque pico, vale e capacidade. Explique o que muda se o comportamento se torna previsível e constante.","detail":[],"legacy":"ficha/1.1.1","params":[["Elasticidade","A capacidade aumenta e diminui de acordo com a demanda.","Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair. Que benefício está em uso?"],["Escala vertical","O tamanho de uma unidade de computação cresce para suportar carga adicional.","Um aplicativo legado executa em um único processo. A equipe troca a máquina por outra com mais memória, preservando uma única unidade. Que estratégia foi usada?"],["Agilidade","O tempo de provisionamento ou de experimentação é encurtado.","Uma equipe pode criar e remover um ambiente de prototipagem em minutos. Qual benefício encurtou o ciclo de teste?"],["Alta disponibilidade","Redundância reduz interrupção diante de falha de um componente.","Um serviço continua respondendo ao perder uma instância porque outra assume a carga. Qual propriedade é demonstrada?"]],"notes":null},{"code":"1.1.2","id":"1.1.2","domain":1,"task":"1.1","title":"Disponibilidade, recuperação e alcance global","concept":"Alta disponibilidade reduz interrupções por falhas comuns. Recuperação de desastre repõe serviço e dados após um evento maior. RTO mede o tempo tolerado para recuperar. RPO mede a perda de dados tolerada no tempo. Regiões, zonas e pontos de presença têm escopos distintos.","control":"Mapeie o efeito que a organização quer limitar. Cópias frequentes afetam RPO, mas a restauração ainda precisa cumprir o RTO. Cópias regionais devem ter acesso, chave e retenção compatíveis com a recuperação planejada.","pitfall":"Backup nunca restaurado não comprova um tempo de recuperação.","verify":"Simule a perda de uma zona, depois uma indisponibilidade regional. Compare impacto, ponto recuperável e tempo de retorno.","decisions":[["RPO","Expressa quantos minutos ou horas de dados podem ser perdidos."],["RTO","Expressa quanto tempo o serviço pode permanecer indisponível até recuperar."],["Alta disponibilidade Multi-AZ","Distribui componentes entre zonas para tolerar falha zonal."],["Recuperação em outra Região","Cria um caminho de recuperação além do alcance de uma falha regional."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Infraestrutura global AWS","https://aws.amazon.com/pt/about-aws/global-infrastructure/"]],"scenarios":[{"id":"P-1.1.2-1","prompt":"Após falha, a clínica consegue reiniciar a aplicação em uma hora. A diretoria diz que no máximo quinze minutos de registros podem ser perdidos. Qual objetivo descreve os quinze minutos?","solution":"RPO","explanation":"Limita a distância entre a falha e o ponto de dados recuperável.","options":[["Tempo de retenção","Define quanto histórico guardar, não a perda máxima em um incidente."],["Acordo de suporte","Trata direitos e atendimento, não quão atual deve ser a cópia."],["RPO","Limita a distância entre a falha e o ponto de dados recuperável."],["RTO","É o limite para retornar o serviço."]]},{"id":"P-1.1.2-2","prompt":"A empresa tolera perder poucas alterações, mas o contrato destacado diz que o sistema precisa voltar em duas horas. O que as duas horas representam?","solution":"RTO","explanation":"Mede o prazo de recuperação do serviço.","options":[["Latência p95","Descreve tempo de resposta de requisições já servidas."],["Janela de manutenção","Define horário para mudança planejada, não recuperação após falha."],["RTO","Mede o prazo de recuperação do serviço."],["RPO","Mede perda aceitável de dados no tempo."]]}],"cue":"O negócio aceita perder no máximo 15 minutos de dados. Qual objetivo foi descrito?","answer":"RPO","use":"Atende ao requisito. Expressa quantos minutos ou horas de dados podem ser perdidos.","avoid":"Backup nunca restaurado não comprova um tempo de recuperação.","example":"Simule a perda de uma zona, depois uma indisponibilidade regional. Compare impacto, ponto recuperável e tempo de retorno.","detail":[],"legacy":"ficha/1.1.2","params":[["RPO","Expressa quantos minutos ou horas de dados podem ser perdidos.","O negócio aceita perder no máximo 15 minutos de dados. Qual objetivo foi descrito?"],["RTO","Expressa quanto tempo o serviço pode permanecer indisponível até recuperar.","O contrato determina que a aplicação deve voltar em até duas horas. Como se chama esse limite?"],["Alta disponibilidade Multi-AZ","Distribui componentes entre zonas para tolerar falha zonal.","Uma loja exige manter o serviço quando um centro de dados inteiro dentro da Região falhar. Qual desenho atende ao escopo?"],["Recuperação em outra Região","Cria um caminho de recuperação além do alcance de uma falha regional.","A política inclui indisponibilidade de toda a Região primária. Onde deve existir o caminho alternativo de recuperação?"]],"notes":null},{"code":"1.2.1","id":"1.2.1","domain":1,"task":"1.2","title":"Os seis pilares do Well-Architected","concept":"O Well-Architected reúne excelência operacional, segurança, confiabilidade, eficiência de desempenho, otimização de custos e sustentabilidade. As decisões podem contribuir para vários pilares. Na prova, selecione o pilar associado ao objetivo dominante: recuperação, cadência operacional, recursos adequados, gasto ou impacto ambiental.","control":"Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica.","pitfall":"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.","verify":"Descreva um risco e identifique o resultado mensurável que confirma a melhoria.","decisions":[["Excelência operacional","Prioriza mudanças seguras, processos, aprendizagem e melhoria operacional contínua."],["Confiabilidade","Foca recuperação, gestão de mudanças e tolerância a falhas."],["Eficiência de desempenho","Usa recursos computacionais adequados e mede seu desempenho conforme a demanda."],["Sustentabilidade","Foca reduzir o impacto ambiental do workload por unidade de trabalho."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.2.1-1","prompt":"Após incidentes, uma equipe revisa runbooks e automatiza mudanças pequenas e reversíveis. O objetivo é melhorar a rotina de operação. Qual pilar guia esse trabalho?","solution":"Excelência operacional","explanation":"Foca operar, evoluir processos e aprender com eventos.","options":[["Excelência operacional","Foca operar, evoluir processos e aprender com eventos."],["Segurança","Seria dominante se o objetivo principal fosse proteção de dados e identidades."],["Sustentabilidade","Não está investigando impacto ambiental."],["Otimização de custos","O cenário não mede gasto ou desperdício."]]},{"id":"P-1.2.1-2","prompt":"A empresa ensaia perder um banco primário e testa se o failover restaura o serviço. Qual pilar mede esse resultado?","solution":"Confiabilidade","explanation":"O teste comprova capacidade de recuperar e tolerar falhas.","options":[["Eficiência de desempenho","O foco não é escolher recursos por latência ou throughput de rotina."],["Excelência operacional","Automatizar o teste ajuda a operação, mas o resultado medido é recuperação."],["Confiabilidade","O teste comprova capacidade de recuperar e tolerar falhas."],["Segurança","A simulação não comprova proteção de confidencialidade."]]}],"cue":"O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação. Qual pilar domina?","answer":"Excelência operacional","use":"Atende ao requisito. Prioriza mudanças seguras, processos, aprendizagem e melhoria operacional contínua.","avoid":"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.","example":"Descreva um risco e identifique o resultado mensurável que confirma a melhoria.","detail":[],"legacy":"ficha/1.2.1","params":[["Excelência operacional","Prioriza mudanças seguras, processos, aprendizagem e melhoria operacional contínua.","O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação. Qual pilar domina?"],["Confiabilidade","Foca recuperação, gestão de mudanças e tolerância a falhas.","Uma empresa exercita o retorno de serviço e verifica a recuperação automática. Qual pilar domina?"],["Eficiência de desempenho","Usa recursos computacionais adequados e mede seu desempenho conforme a demanda.","A equipe testa famílias de instância para atingir a latência exigida com utilização adequada. Qual pilar orienta a decisão?"],["Sustentabilidade","Foca reduzir o impacto ambiental do workload por unidade de trabalho.","Uma iniciativa mede impacto ambiental por transação e reduz o compute ocioso. Qual pilar é a motivação explícita?"]],"notes":"1.2.1"},{"code":"1.2.2","id":"1.2.2","domain":1,"task":"1.2","title":"Desacoplamento e resiliência na aplicação","concept":"Desacoplar componentes permite que tenham ritmos e ciclos de vida independentes. Uma fila amortiza picos e possibilita consumo posterior; publicação em tópico distribui notificações a assinantes. Um balanceador roteia tráfego entre alvos, e políticas de ajuste de capacidade reagem à utilização medida.","control":"Escolha o mecanismo pelo contrato: entrega a um trabalhador, distribuição a vários destinatários, distribuição de requisições síncronas ou ajuste de capacidade. Fila e tópico frequentemente se combinam quando vários consumidores precisam de retenção e ritmo independentes.","pitfall":"Balanceamento distribui tráfego entre alvos existentes. Ajustar a quantidade de alvos é função separada.","verify":"Anote o que acontece se o consumidor ficar fora por alguns minutos. Identifique se o produtor espera, se a mensagem pode ser tratada depois e quantos consumidores a recebem.","decisions":[["Amazon SQS","Mantém mensagens em fila até o processamento conforme políticas de fila e consumidor."],["Amazon SNS","Publica uma notificação para vários assinantes de um tópico."],["Elastic Load Balancing","Distribui conexões ou requisições aos alvos saudáveis."],["EC2 Auto Scaling","Ajusta a quantidade de instâncias de um grupo conforme configuração."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.2.2-1","prompt":"Um serviço recebe mais pedidos do que os workers podem atender. O produtor deve responder sem esperar a conclusão, e os pedidos precisam ficar disponíveis para consumo posterior. Qual serviço usar?","solution":"Amazon SQS","explanation":"Mantém trabalho pendente desacoplado do ritmo dos consumidores.","options":[["Elastic Load Balancing","Distribui requisições a alvos, sem persistir backlog de pedidos."],["Amazon SQS","Mantém trabalho pendente desacoplado do ritmo dos consumidores."],["AWS Lambda sem fila","Executa código, mas não fornece a fila explícita que o desenho precisa."],["Amazon Route 53","Resolve o destino pelo DNS; não retém mensagens."]]},{"id":"P-1.2.2-2","prompt":"Uma confirmação precisa ser distribuída ao financeiro, ao suporte e à auditoria. Cada grupo deve receber a mesma publicação. Qual serviço oferece o fan-out?","solution":"Amazon SNS","explanation":"O tópico entrega a publicação a múltiplos assinantes configurados.","options":[["AWS Budgets","Emite alertas de orçamento, sem atuar como tópico genérico da aplicação."],["Amazon SNS","O tópico entrega a publicação a múltiplos assinantes configurados."],["Amazon EBS","Armazena blocos e não distribui notificações."],["Uma única fila SQS com três consumidores concorrentes","Consumidores da mesma fila disputam trabalho; não recebem todos uma cópia por desenho."]]}],"cue":"Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar. Qual serviço mantém o trabalho pendente?","answer":"Amazon SQS","use":"Atende ao requisito. Mantém mensagens em fila até o processamento conforme políticas de fila e consumidor.","avoid":"Balanceamento distribui tráfego entre alvos existentes. Ajustar a quantidade de alvos é função separada.","example":"Anote o que acontece se o consumidor ficar fora por alguns minutos. Identifique se o produtor espera, se a mensagem pode ser tratada depois e quantos consumidores a recebem.","detail":[],"legacy":"ficha/1.2.2","params":[["Amazon SQS","Mantém mensagens em fila até o processamento conforme políticas de fila e consumidor.","Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar. Qual serviço mantém o trabalho pendente?"],["Amazon SNS","Publica uma notificação para vários assinantes de um tópico.","A mesma confirmação deve chegar a assinantes independentes de um canal de notificação. Qual serviço faz o fan-out?"],["Elastic Load Balancing","Distribui conexões ou requisições aos alvos saudáveis.","Um site quer distribuir requisições HTTP entre alvos saudáveis já provisionados. Que função usar?"],["EC2 Auto Scaling","Ajusta a quantidade de instâncias de um grupo conforme configuração.","A capacidade de um grupo EC2 deve seguir um alvo de utilização. Qual mecanismo muda o número de instâncias?"]],"notes":null},{"code":"1.2.3","id":"1.2.3","domain":1,"task":"1.2","title":"Escolhas de segurança, custo e integração ao design","concept":"Os pilares interagem. Isolamento e rastreabilidade favorecem segurança. Prever e analisar gasto por unidade de negócio orienta otimização de custos. Diminuir trabalho humano repetitivo e testar mudanças em lotes pequenos melhora excelência operacional. O requisito explícito define qual avaliação virá primeiro.","control":"Registre impacto, custo, risco e esforço. Para custo, busque a menor despesa que ainda atende ao objetivo. Para segurança, identifique identidade, acesso, dados, detecção e resposta. Para desempenho, meça a métrica técnica do requisito antes de escolher família e capacidade.","pitfall":"Habilitar um controle sem verificar seu efeito não fecha a decisão arquitetural.","verify":"Considere a mesma mudança como intervenção em dois pilares. Identifique a métrica que permite sustentar o argumento de cada um.","decisions":[["Segurança","Protege identidades, dados e recursos e estabelece detecção e resposta."],["Otimização de custos","Reduz desperdício e melhora o custo por objetivo entregue."],["Excelência operacional","Automatiza e melhora processos operacionais e mudanças."],["Eficiência de desempenho","Seleciona recursos adequados à carga e demonstra desempenho."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Responsabilidade compartilhada","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"]],"scenarios":[{"id":"P-1.2.3-1","prompt":"A revisão do workload identifica credenciais expostas e ausência de trilha de ações suspeitas. O objetivo é fortalecer identidades e detecção. Qual pilar?","solution":"Segurança","explanation":"Identidade, proteção e detecção são centrais nesse pilar.","options":[["Sustentabilidade","Não trata impacto ambiental."],["Eficiência de desempenho","Alterar tipo de instância não é o objetivo."],["Segurança","Identidade, proteção e detecção são centrais nesse pilar."],["Confiabilidade","Capacidade de recuperação não cobre isoladamente exposição de credenciais."]]},{"id":"P-1.2.3-2","prompt":"O time mede gasto por pedido, remove recursos ociosos e preserva o SLA. Qual pilar está guiando a escolha?","solution":"Otimização de custos","explanation":"A equipe busca melhor custo por trabalho entregue.","options":[["Excelência operacional","Melhoria de processo pode ajudar, mas a medida explícita é gasto."],["Confiabilidade","O SLA é restrição da decisão, não a variável otimizada."],["Otimização de custos","A equipe busca melhor custo por trabalho entregue."],["Segurança","O caso não compara permissões ou proteção de dados."]]}],"cue":"Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido. Qual pilar?","answer":"Segurança","use":"Atende ao requisito. Protege identidades, dados e recursos e estabelece detecção e resposta.","avoid":"Habilitar um controle sem verificar seu efeito não fecha a decisão arquitetural.","example":"Considere a mesma mudança como intervenção em dois pilares. Identifique a métrica que permite sustentar o argumento de cada um.","detail":[],"legacy":"ficha/1.2.3","params":[["Segurança","Protege identidades, dados e recursos e estabelece detecção e resposta.","Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido. Qual pilar?"],["Otimização de custos","Reduz desperdício e melhora o custo por objetivo entregue.","O objetivo explícito é conhecer o gasto por pedido e remover desperdício sem afetar o SLA. Qual pilar?"],["Excelência operacional","Automatiza e melhora processos operacionais e mudanças.","Um time introduz runbooks e verificações automáticas para mudanças repetitivas. Qual pilar lidera?"],["Eficiência de desempenho","Seleciona recursos adequados à carga e demonstra desempenho.","A equipe compara latência de consulta com tipos de instância diferentes e mede saturação. Que pilar orienta o experimento?"]],"notes":null},{"code":"1.3.1","id":"1.3.1","domain":1,"task":"1.3","title":"Estratégias de migração e mudança de plataforma","concept":"As estratégias de migração são escolhidas pela mudança aceita sobre o ativo e pelo destino. Rehost move a aplicação com pouca mudança. Replatform introduz otimizações específicas sem reescrever toda a solução. Refactor altera arquitetura e código. Repurchase substitui o produto por outro, por exemplo SaaS.","control":"Questione se o aplicativo será movido, adaptado, refeito ou substituído. Retain mantém um ativo no local; retire desativa; relocate transfere plataformas compatíveis sem alterar suas cargas individualmente.","pitfall":"Trocar um software instalado por uma assinatura SaaS é repurchase, mesmo que os dados sejam migrados.","verify":"Identifique o que muda no código, no motor de banco, na infraestrutura e no modelo operacional.","decisions":[["Rehost","Migra a aplicação com mudanças mínimas, como lift and shift para EC2."],["Replatform","Altera parte da plataforma para ganhar benefícios operacionais sem grande reescrita."],["Refactor","Redesenha a aplicação para explorar uma arquitetura diferente."],["Repurchase","Compra ou adota outro produto para atender à mesma função."]],"docs":[["Estratégias de migração","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.3.1-1","prompt":"Uma aplicação local usa um runtime legado e será movida para EC2. O prazo não permite redesenho ou trocar produtos. Qual estratégia?","solution":"Rehost","explanation":"Move a aplicação mantendo arquitetura e stack essencialmente iguais.","options":[["Refactor","Redesenharia a aplicação para adotar outra arquitetura."],["Retain","Manteria o ativo na origem."],["Repurchase","Substituiria o produto por outro."],["Rehost","Move a aplicação mantendo arquitetura e stack essencialmente iguais."]]},{"id":"P-1.3.1-2","prompt":"O aplicativo mantém interfaces e regras. O banco passa de VM autogerenciada para Amazon RDS usando o mesmo motor compatível. Qual estratégia?","solution":"Replatform","explanation":"A plataforma melhora sem reescrita ampla do aplicativo.","options":[["Replatform","A plataforma melhora sem reescrita ampla do aplicativo."],["Repurchase de toda a aplicação","O aplicativo permanece o mesmo produto."],["Retire","O sistema continua em operação."],["Rehost sem mudança de operação","O banco passa a usar um serviço gerenciado, além de mudar de localização."]]}],"cue":"Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho. Qual estratégia?","answer":"Rehost","use":"Atende ao requisito. Migra a aplicação com mudanças mínimas, como lift and shift para EC2.","avoid":"Trocar um software instalado por uma assinatura SaaS é repurchase, mesmo que os dados sejam migrados.","example":"Identifique o que muda no código, no motor de banco, na infraestrutura e no modelo operacional.","detail":[],"legacy":"ficha/1.3.1","params":[["Rehost","Migra a aplicação com mudanças mínimas, como lift and shift para EC2.","Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho. Qual estratégia?"],["Replatform","Altera parte da plataforma para ganhar benefícios operacionais sem grande reescrita.","O banco muda de VM para RDS mantendo o motor compatível e as interfaces do aplicativo. Qual estratégia caracteriza a mudança?"],["Refactor","Redesenha a aplicação para explorar uma arquitetura diferente.","Um monólito é redesenhado em serviços desacoplados com código e contratos novos. Qual estratégia?"],["Repurchase","Compra ou adota outro produto para atender à mesma função.","A empresa troca o CRM desenvolvido internamente por um fornecedor SaaS e importa os registros. Qual estratégia?"]],"notes":null},{"code":"1.3.2","id":"1.3.2","domain":1,"task":"1.3","title":"AWS CAF, avaliação e ondas de adoção","concept":"O AWS Cloud Adoption Framework organiza capacidades em seis perspectivas: negócios, pessoas, governança, plataforma, segurança e operações. Adoção envolve patrocínio, competências e riscos além da movimentação de servidores. Inventário, dependências e ondas ajudam a escolher ritmo e sequência da migração.","control":"Separe transformação organizacional da seleção de uma ferramenta para mover dados. Avalie proposta de valor, prontidão, conformidade e habilidades. Use uma onda piloto com métricas de resultado e feedback para a próxima onda.","pitfall":"CAF orienta adoção organizacional. Well-Architected tem foco na revisão de workloads.","verify":"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.","decisions":[["AWS Cloud Adoption Framework","Orienta capacidades e transformação organizacional para adoção da nuvem."],["AWS Well-Architected Framework","Orienta revisão e boas práticas de arquitetura de workloads."],["AWS DMS","Move dados de bancos compatíveis e pode capturar mudanças."],["AWS Pricing Calculator","Estima custos para uma configuração planejada."]],"docs":[["AWS Cloud Adoption Framework","https://aws.amazon.com/pt/cloud-adoption-framework/"],["Estratégias de migração","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"]],"scenarios":[{"id":"P-1.3.2-1","prompt":"Antes de migrar várias áreas, o patrocinador quer avaliar competências, governança e operação da organização. Qual abordagem orienta a adoção?","solution":"AWS Cloud Adoption Framework","explanation":"Cobre perspectivas organizacionais para a jornada de adoção.","options":[["AWS DMS","Move dados de bancos, sem orientar gestão de pessoas ou governança."],["AWS Cloud Adoption Framework","Cobre perspectivas organizacionais para a jornada de adoção."],["AWS Pricing Calculator","Estima configuração e custo, não maturidade organizacional."],["AWS Well-Architected Tool","Avalia workloads, não resolve sozinho as capacidades corporativas."]]},{"id":"P-1.3.2-2","prompt":"Um arquiteto precisa revisar um workload existente pelos seis pilares. Quer discutir segurança, confiabilidade e demais dimensões do desenho. Qual referência?","solution":"AWS Well-Architected Framework","explanation":"Organiza a revisão por pilares de arquitetura.","options":[["AWS CAF","Orienta adoção em nível organizacional, não é o referencial de seis pilares de workload."],["AWS Migration Hub","Apoia acompanhamento de migração, não a revisão pedida."],["AWS Pricing Calculator","Estima custo para uma configuração, sem avaliar os pilares."],["AWS Well-Architected Framework","Organiza a revisão por pilares de arquitetura."]]}],"cue":"O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa. Qual referência usar?","answer":"AWS Cloud Adoption Framework","use":"Atende ao requisito. Orienta capacidades e transformação organizacional para adoção da nuvem.","avoid":"CAF orienta adoção organizacional. Well-Architected tem foco na revisão de workloads.","example":"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.","detail":[],"legacy":"ficha/1.3.2","params":[["AWS Cloud Adoption Framework","Orienta capacidades e transformação organizacional para adoção da nuvem.","O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa. Qual referência usar?"],["AWS Well-Architected Framework","Orienta revisão e boas práticas de arquitetura de workloads.","Um arquiteto quer revisar um workload pelos seis pilares. Qual referência usar?"],["AWS DMS","Move dados de bancos compatíveis e pode capturar mudanças.","A iniciativa já definiu a estratégia e precisa mover dados relacionais com captura de alterações. Qual serviço operacional usar?"],["AWS Pricing Calculator","Estima custos para uma configuração planejada.","A equipe precisa estimar previamente o custo de uma arquitetura proposta para aprovação. Que ferramenta usar?"]],"notes":null},{"code":"1.4.1","id":"1.4.1","domain":1,"task":"1.4","title":"CapEx, OpEx, economia de escala e TCO","concept":"CapEx envolve investimento em ativos para uso ao longo do tempo. OpEx se relaciona a despesas operacionais. O consumo sob demanda permite substituir parte do investimento antecipado por custo variável. Economia de escala é a redução potencial do custo unitário pela escala do provedor; TCO inclui custos diretos e indiretos do ciclo de vida.","control":"Compare custo de hardware, espaço, energia, licenças, rede, operação, indisponibilidade e crescimento. A nuvem pode reduzir sobreprovisionamento, mas custos como transferência, redundância e compromissos permanecem no cálculo.","pitfall":"Preço por hora não equivale ao custo total. Compromissos ou compras antecipadas continuam existindo na nuvem.","verify":"Compare duas opções com o mesmo volume, tendência de crescimento, prazo e SLA.","decisions":[["Troca de investimento antecipado por despesa variável","Consumo permite ajustar a despesa operacional ao uso."],["Economia de escala","Agregação de demanda do provedor pode reduzir custo unitário."],["Custo total de propriedade (TCO)","Considera toda a vida da solução, incluindo despesas que vão além de compute."],["Previsibilidade por compromisso","Um compromisso pode reduzir preço de uso elegível e cria obrigação de pagamento conforme o plano."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Preços AWS","https://aws.amazon.com/pt/pricing/"],["AWS Pricing Calculator","https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html"]],"scenarios":[{"id":"P-1.4.1-1","prompt":"Uma empresa deixa de comprar servidores antes do lançamento. Passa a pagar pelo compute usado conforme a demanda. Que mudança financeira descreve o caso?","solution":"Troca de investimento inicial por despesa variável","explanation":"O consumo desloca o gasto da aquisição prévia para a operação conforme uso.","options":[["Reserva física automática","Pagar por uso não garante capacidade física reservada."],["Faturamento consolidado","Agrupa faturas, sem explicar comprar ou consumir recursos."],["Troca de investimento inicial por despesa variável","O consumo desloca o gasto da aquisição prévia para a operação conforme uso."],["Compromisso de longo prazo","Não foi assumido no cenário."]]},{"id":"P-1.4.1-2","prompt":"A comparação entre nuvem e datacenter usa horizonte de três anos e inclui energia, pessoas, licenças, rede e migração. Que medida está sendo montada?","solution":"Custo total de propriedade","explanation":"Inclui custos diretos e indiretos durante o ciclo de vida.","options":[["Desconto de consumo comprometido","Descreve um instrumento de preço, não toda a comparação."],["Custo total de propriedade","Inclui custos diretos e indiretos durante o ciclo de vida."],["Preço unitário de computação","Não inclui as despesas de operação e migração."],["Custo marginal de uma solicitação","Reflete uma unidade adicional, não o conjunto do horizonte."]]}],"cue":"Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização. Qual mudança econômica?","answer":"Troca de investimento antecipado por despesa variável","use":"Atende ao requisito. Consumo permite ajustar a despesa operacional ao uso.","avoid":"Preço por hora não equivale ao custo total. Compromissos ou compras antecipadas continuam existindo na nuvem.","example":"Compare duas opções com o mesmo volume, tendência de crescimento, prazo e SLA.","detail":[],"legacy":"ficha/1.4.1","params":[["Troca de investimento antecipado por despesa variável","Consumo permite ajustar a despesa operacional ao uso.","Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização. Qual mudança econômica?"],["Economia de escala","Agregação de demanda do provedor pode reduzir custo unitário.","Um provedor agrega demanda de milhares de clientes para diluir custos estruturais. Qual conceito?"],["Custo total de propriedade (TCO)","Considera toda a vida da solução, incluindo despesas que vão além de compute.","Uma empresa compara hardware, mão de obra, migração e rede por três anos. Que perspectiva usa?"],["Previsibilidade por compromisso","Um compromisso pode reduzir preço de uso elegível e cria obrigação de pagamento conforme o plano.","A organização aceita pagar pelo compromisso contínuo para reduzir preço de consumo elegível. Qual mecanismo econômico?"]],"notes":null},{"code":"1.4.2","id":"1.4.2","domain":1,"task":"1.4","title":"Dimensionamento, custos indiretos e ambiente sob demanda","concept":"Rightsizing ajusta capacidade ao perfil medido. Auto Scaling altera a quantidade de recursos durante o uso. Encerrar ambientes que não precisam ficar ligados reduz consumo. Managed services deslocam tarefas de infraestrutura para o provedor e alteram o custo operacional da equipe.","control":"Separe capacidade ociosa persistente, variação ao longo do dia, ambiente sem uso temporário e esforço operacional. Compare após o ajuste no mesmo nível de serviço. Verifique quais recursos seguem cobrando depois de parar uma instância, como volumes e endereços elegíveis.","pitfall":"Parar uma instância não encerra automaticamente todos os recursos associados.","verify":"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.","decisions":[["Rightsizing","Adapta o tamanho ou tipo de recurso ao uso medido."],["Agendamento de desligamento","Reduz tempo ativo de ambientes que não precisam funcionar fora da janela."],["Elasticidade por Auto Scaling","Adapta a quantidade em resposta à variação de demanda."],["Serviço gerenciado","Transfere tarefas operacionais elegíveis ao provedor."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Preços AWS","https://aws.amazon.com/pt/pricing/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-1.4.2-1","prompt":"Um serviço roda 24 horas, mas o uso de CPU e memória fica bem abaixo da capacidade da família atual, mesmo no pico. O SLA não muda. O que avaliar primeiro?","solution":"Rightsizing com métricas representativas","explanation":"Dimensiona o recurso à pressão real de CPU e memória sem alterar o objetivo de serviço.","options":[["Comprar um compromisso para a configuração atual imediatamente","Pode fixar gastos em capacidade superdimensionada."],["Duplicar recursos em outro ambiente","Aumenta capacidade sem evidência de necessidade."],["Desligar o sistema à noite sem verificar demanda","O workload tem requisito de execução contínua."],["Rightsizing com métricas representativas","Dimensiona o recurso à pressão real de CPU e memória sem alterar o objetivo de serviço."]]},{"id":"P-1.4.2-2","prompt":"O laboratório só precisa estar ativo em dias úteis no horário de treinamento. Os recursos devem continuar disponíveis para reuso. Qual mudança reduz horas de compute?","solution":"Agendar parada e retomada de recursos compatíveis","explanation":"Evita horas ociosas ao preservar o ambiente para outro dia.","options":[["Trocar todas as instâncias por famílias maiores","Pode elevar custo por hora sem reduzir tempo ativo."],["Apagar permanentemente a conta após cada treino","Não preserva os recursos para reuso."],["Ativar faturamento consolidado","Agrupa pagamentos, sem efetivamente desligar compute."],["Agendar parada e retomada de recursos compatíveis","Evita horas ociosas ao preservar o ambiente para outro dia."]]}],"cue":"Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico. Qual medida investigar primeiro?","answer":"Rightsizing","use":"Atende ao requisito. Adapta o tamanho ou tipo de recurso ao uso medido.","avoid":"Parar uma instância não encerra automaticamente todos os recursos associados.","example":"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.","detail":[],"legacy":"ficha/1.4.2","params":[["Rightsizing","Adapta o tamanho ou tipo de recurso ao uso medido.","Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico. Qual medida investigar primeiro?"],["Agendamento de desligamento","Reduz tempo ativo de ambientes que não precisam funcionar fora da janela.","O ambiente de laboratório só precisa funcionar em horário comercial. Qual ajuste é imediato?"],["Elasticidade por Auto Scaling","Adapta a quantidade em resposta à variação de demanda.","A aplicação tem picos imprevisíveis e o objetivo é ajustar o número de servidores em uso. Qual medida?"],["Serviço gerenciado","Transfere tarefas operacionais elegíveis ao provedor.","A equipe quer reduzir esforço com patching do sistema operacional do banco e backups de rotina. Qual tipo de serviço considerar?"]],"notes":null},{"code":"2.1.1","id":"2.1.1","domain":2,"task":"2.1","title":"Responsabilidade compartilhada em EC2, RDS e serviços gerenciados","concept":"A AWS protege a infraestrutura da nuvem. O cliente protege o que configura e opera dentro dela. Em EC2, administra sistema operacional convidado, aplicações e controles de rede. Com RDS, a AWS gerencia componentes da infraestrutura e do sistema do serviço; acesso, configuração e dados continuam sob responsabilidade do cliente.","control":"Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa.","pitfall":"Gerenciado não significa que o provedor decide quem pode ler os dados.","verify":"Liste as responsabilidades para hardware, SO convidado, motor de banco, credenciais e políticas de dados conforme a opção.","decisions":[["Cliente no EC2","Administra patches do SO convidado e do software instalado."],["AWS na infraestrutura","Protege instalações, hardware e componentes de virtualização."],["AWS na camada gerenciada do RDS","Opera o sistema subjacente do serviço gerenciado."],["Cliente sobre dados e acesso","Determina políticas e permissões da organização, inclusive em serviço gerenciado."]],"docs":[["Responsabilidade compartilhada","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.1.1-1","prompt":"Um alerta aponta vulnerabilidade no Linux que a empresa utiliza em suas instâncias EC2. O hardware subjacente está atualizado. Quem aplica o patch ao sistema convidado?","solution":"O cliente que opera a instância","explanation":"Em EC2, o sistema convidado e seus pacotes ficam sob gestão do cliente.","options":[["O serviço de monitoramento do cliente","Detectar vulnerabilida
