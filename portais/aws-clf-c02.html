var(--no)}.c.go{border-color:var(--go)}.c h3{margin:0 0 7px;font-size:13px;line-height:1.3;color:var(--a)}.c.ok h3{color:var(--ok)}.c.bad h3{color:var(--bad)}.c.no h3{color:var(--no)}.c.go h3{color:var(--go)}.c ul{margin:0;padding-left:17px}.c li{margin:4px 0;font-size:12px;line-height:1.42}.c li::marker{color:var(--a)}.c li b{font-weight:700;color:var(--tx)}\n.bot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.bot .c{padding:11px 12px}.bot .c li{font-size:11.5px}.f{margin-top:15px;border:1.7px solid var(--a);border-radius:13px;padding:12px 15px;background:var(--card);font-weight:650;font-size:12px;box-shadow:var(--shadow)}\n.refs{margin-top:14px;border-top:1px solid var(--ln);padding-top:10px;color:var(--mu);font-size:11px}.refs a{color:var(--a);text-decoration:none}.refs a:hover{text-decoration:underline}.refs summary{cursor:pointer;font-weight:700;color:var(--mu)}.refs ul{display:flex;gap:8px 18px;flex-wrap:wrap;padding-left:17px}.refs li{margin:3px 0}\n@media(max-width:1120px){.main{grid-template-columns:minmax(0,1fr) minmax(235px,285px) minmax(0,1fr);gap:16px}.bot{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:820px){header{padding:14px 14px 0}#v{padding:15px 14px 24px}.main{grid-template-columns:1fr;gap:12px}.hub{position:relative;top:auto;order:-1;max-width:none}.col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}svg.connectors{display:none}.bot{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:520px){.col,.bot{grid-template-columns:1fr}.brandline{align-items:flex-start}.tools{width:100%}.hub h2{font-size:20px}.sec-bar button{flex:1 1 100%;text-align:left}nav button{font-size:11px}}\n@media print{body{background:#fff;color:#111}header .tools,.sec-bar,nav,.exam-note,.meta .right,.refs{display:none!important}header{padding:0 0 8px;max-width:none}#v{max-width:none;padding:8px 0}.main{grid-template-columns:1fr 250px 1fr;gap:12px}.hub{position:static;box-shadow:none;break-inside:avoid}.c,.f{box-shadow:none;break-inside:avoid;background:#fff;color:#111}.c li{font-size:9pt}.c h3{font-size:10pt}.bot{grid-template-columns:repeat(4,1fr)}.bot .c li{font-size:8pt}.f{font-size:9pt}svg{display:block}}\n\u003c/style>\n\u003cstyle>@media screen{html.reading-mode body>header:first-of-type{display:none}} @media(max-width:550px){.tablewrap,.section{max-width:100%;overflow:auto}.map-head{flex-wrap:wrap}} \u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader>\n \u003cdiv class=\"brandline\">\n  \u003cdiv class=\"brand\">\u003cdiv class=\"logo\">CLF\u003c/div>\u003cdiv>\u003ch1>AWS Certified Cloud Practitioner\u003c/h1>\u003cdiv class=\"sub\">CLF-C02 · Mapas mentais interativos · Conteúdo em português com termos técnicos\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"tools\">\u003cbutton class=\"toolbtn\" id=\"themeBtn\" type=\"button\">◐ Tema\u003c/button>\u003cbutton class=\"toolbtn\" type=\"button\" onclick=\"window.print()\">⎙ Imprimir mapa\u003c/button>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"exam-note\">\u003cstrong>Blueprint CLF-C02\u003c/strong> · 24% / 30% / 34% / 12%. Consulte o guia oficial para confirmar o escopo.\u003c/div>\n \u003cdiv class=\"sec-bar\" id=\"sb\" aria-label=\"Domínios do exame\">\u003c/div>\n \u003cnav id=\"n\" aria-label=\"Mapas do domínio selecionado\">\u003c/nav>\n\u003c/header>\n\u003cmain id=\"v\" aria-live=\"polite\">\u003c/main>\n\u003cscript>\nconst M = {\"d1\":{\"section\":1,\"key\":\"Visão geral · Conceitos da nuvem\",\"top\":\"DOMÍNIO 1 · 24% DA PROVA\",\"heading\":\"Visão geral · Conceitos da nuvem\",\"pills\":\"1.1 · 1.2 · 1.3 · 1.4\",\"desc\":\"Guia de conceitos: valor, falhas e adoção\",\"left\":[{\"title\":\"1.1.1 · Elasticidade, escalabilidade e agilidade\",\"items\":[\"Elasticidade\",\"Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência.\"],\"tone\":\"\"},{\"title\":\"1.1.2 · Disponibilidade, recuperação e alcance global\",\"items\":[\"RPO\",\"Mapeie o efeito que a organização quer limitar. Cópias frequentes afetam RPO, mas a restauração ainda precisa cumprir o RTO. Cópias regionais devem ter acesso, chave e retenção compatíveis com a recuperação planejada.\"],\"tone\":\"\"},{\"title\":\"1.2.1 · Os seis pilares do Well-Architected\",\"items\":[\"Excelência operacional\",\"Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica.\"],\"tone\":\"\"},{\"title\":\"1.2.2 · Desacoplamento e resiliência na aplicação\",\"items\":[\"Amazon SQS\",\"Escolha o mecanismo pelo contrato: entrega a um trabalhador, distribuição a vários destinatários, distribuição de requisições síncronas ou ajuste de capacidade. Fila e tópico frequentemente se combinam quando vários consumidores precisam de retenção e ritmo independentes.\"],\"tone\":\"\"},{\"title\":\"1.2.3 · Escolhas de segurança, custo e integração ao design\",\"items\":[\"Segurança\",\"Registre impacto, custo, risco e esforço. Para custo, busque a menor despesa que ainda atende ao objetivo. Para segurança, identifique identidade, acesso, dados, detecção e resposta. Para desempenho, meça a métrica técnica do requisito antes de escolher família e capacidade.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.3.1 · Estratégias de migração e mudança de plataforma\",\"items\":[\"Rehost\",\"Identifique o que muda no código, no motor de banco, na infraestrutura e no modelo operacional.\"],\"tone\":\"go\"},{\"title\":\"1.3.2 · AWS CAF, avaliação e ondas de adoção\",\"items\":[\"AWS Cloud Adoption Framework\",\"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.\"],\"tone\":\"go\"},{\"title\":\"1.4.1 · CapEx, OpEx, economia de escala e TCO\",\"items\":[\"Troca de investimento antecipado por despesa variável\",\"Compare duas opções com o mesmo volume, tendência de crescimento, prazo e SLA.\"],\"tone\":\"go\"},{\"title\":\"1.4.2 · Dimensionamento, custos indiretos e ambiente sob demanda\",\"items\":[\"Rightsizing\",\"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.\",\"Backup nunca restaurado não comprova um tempo de recuperação.\",\"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t1.1\":{\"section\":1,\"key\":\"Valor da nuvem AWS\",\"top\":\"DOMÍNIO 1 · 24% DA PROVA\",\"heading\":\"Valor da nuvem AWS\",\"pills\":\"1.1\",\"desc\":\"Guia de conceitos: valor, falhas e adoção\",\"left\":[{\"title\":\"1.1.1 · Elasticidade, escalabilidade e agilidade\",\"items\":[\"Elasticidade\",\"Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.1.2 · Disponibilidade, recuperação e alcance global\",\"items\":[\"RPO\",\"Simule a perda de uma zona, depois uma indisponibilidade regional. Compare impacto, ponto recuperável e tempo de retorno.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.\",\"Backup nunca restaurado não comprova um tempo de recuperação.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t1.2\":{\"section\":1,\"key\":\"Princípios de design e Well-Architected\",\"top\":\"DOMÍNIO 1 · 24% DA PROVA\",\"heading\":\"Princípios de design e Well-Architected\",\"pills\":\"1.2\",\"desc\":\"Guia de conceitos: valor, falhas e adoção\",\"left\":[{\"title\":\"1.2.1 · Os seis pilares do Well-Architected\",\"items\":[\"Excelência operacional\",\"Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica.\"],\"tone\":\"\"},{\"title\":\"1.2.2 · Desacoplamento e resiliência na aplicação\",\"items\":[\"Amazon SQS\",\"Escolha o mecanismo pelo contrato: entrega a um trabalhador, distribuição a vários destinatários, distribuição de requisições síncronas ou ajuste de capacidade. Fila e tópico frequentemente se combinam quando vários consumidores precisam de retenção e ritmo independentes.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.2.3 · Escolhas de segurança, custo e integração ao design\",\"items\":[\"Segurança\",\"Considere a mesma mudança como intervenção em dois pilares. Identifique a métrica que permite sustentar o argumento de cada um.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.\",\"Balanceamento distribui tráfego entre alvos existentes. Ajustar a quantidade de alvos é função separada.\",\"Habilitar um controle sem verificar seu efeito não fecha a decisão arquitetural.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t1.3\":{\"section\":1,\"key\":\"Adoção e migração\",\"top\":\"DOMÍNIO 1 · 24% DA PROVA\",\"heading\":\"Adoção e migração\",\"pills\":\"1.3\",\"desc\":\"Guia de conceitos: valor, falhas e adoção\",\"left\":[{\"title\":\"1.3.1 · Estratégias de migração e mudança de plataforma\",\"items\":[\"Rehost\",\"Questione se o aplicativo será movido, adaptado, refeito ou substituído. Retain mantém um ativo no local; retire desativa; relocate transfere plataformas compatíveis sem alterar suas cargas individualmente.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.3.2 · AWS CAF, avaliação e ondas de adoção\",\"items\":[\"AWS Cloud Adoption Framework\",\"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Trocar um software instalado por uma assinatura SaaS é repurchase, mesmo que os dados sejam migrados.\",\"CAF orienta adoção organizacional. Well-Architected tem foco na revisão de workloads.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t1.4\":{\"section\":1,\"key\":\"Economia da nuvem\",\"top\":\"DOMÍNIO 1 · 24% DA PROVA\",\"heading\":\"Economia da nuvem\",\"pills\":\"1.4\",\"desc\":\"Guia de conceitos: valor, falhas e adoção\",\"left\":[{\"title\":\"1.4.1 · CapEx, OpEx, economia de escala e TCO\",\"items\":[\"Troca de investimento antecipado por despesa variável\",\"Compare custo de hardware, espaço, energia, licenças, rede, operação, indisponibilidade e crescimento. A nuvem pode reduzir sobreprovisionamento, mas custos como transferência, redundância e compromissos permanecem no cálculo.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.4.2 · Dimensionamento, custos indiretos e ambiente sob demanda\",\"items\":[\"Rightsizing\",\"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Preço por hora não equivale ao custo total. Compromissos ou compras antecipadas continuam existindo na nuvem.\",\"Parar uma instância não encerra automaticamente todos os recursos associados.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"d2\":{\"section\":2,\"key\":\"Visão geral · Segurança e conformidade\",\"top\":\"DOMÍNIO 2 · 30% DA PROVA\",\"heading\":\"Visão geral · Segurança e conformidade\",\"pills\":\"2.1 · 2.2 · 2.3 · 2.4\",\"desc\":\"Guia de segurança: identidade, evidência e proteção\",\"left\":[{\"title\":\"2.1.1 · Responsabilidade compartilhada em EC2, RDS e serviços gerenciados\",\"items\":[\"Cliente no EC2\",\"Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa.\"],\"tone\":\"\"},{\"title\":\"2.1.2 · Controles herdados, compartilhados e específicos do cliente\",\"items\":[\"Controle herdado\",\"Evite usar a palavra compartilhado como divisão indiferenciada. Identifique a evidência associada à camada questionada. Relatórios da AWS apoiam a avaliação do fornecedor; os controles do workload também precisam de evidência própria.\"],\"tone\":\"\"},{\"title\":\"2.2.1 · Artifact, Audit Manager e evidências de conformidade\",\"items\":[\"AWS Artifact\",\"Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria.\"],\"tone\":\"\"},{\"title\":\"2.2.2 · CloudTrail, CloudWatch e AWS Config\",\"items\":[\"Amazon CloudWatch\",\"Mapeie sintoma, evento causal e configuração atual. Uma taxa de erros alta é métrica. Alterar uma permissão é atividade de API. Um volume sem a configuração exigida é problema de conformidade. Encaminhar a notificação é outra etapa.\"],\"tone\":\"\"},{\"title\":\"2.2.3 · Criptografia, certificados e gestão de segredos\",\"items\":[\"AWS KMS\",\"Mapeie qual segredo existe: senha da aplicação, chave que protege dado ou certificado que valida a sessão TLS. Compare quem pode usar, rodar, renovar, rotacionar e auditar o material.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.3.1 · Identidade de workloads, privilégios e root\",\"items\":[\"Role IAM com credenciais temporárias\",\"Identifique quem executa, qual ação necessita, qual recurso pode acessar e como obtém as credenciais.\"],\"tone\":\"go\"},{\"title\":\"2.3.2 · Acesso humano e gestão de múltiplas contas\",\"items\":[\"AWS IAM Identity Center\",\"Desenhe uma sessão de pessoa em duas contas e um guardrail que vale para toda a OU.\"],\"tone\":\"go\"},{\"title\":\"2.4.1 · Detecção de ameaças, vulnerabilidades e postura\",\"items\":[\"Amazon GuardDuty\",\"Use uma tabela de incidentes fictícios e identifique o primeiro serviço a acionar e onde consolidar o achado.\"],\"tone\":\"go\"},{\"title\":\"2.4.2 · WAF, Shield, Firewall Manager e controles de rede\",\"items\":[\"AWS WAF\",\"Classifique quatro demandas: padrão HTTP, DDoS, gestão central e porta do banco.\"],\"tone\":\"go\"},{\"title\":\"2.4.3 · Segurança em profundidade e acesso a sub-redes\",\"items\":[\"Network ACL\",\"Dado um acesso a um site, decomponha as decisões por camada e identifique onde evidenciar o efeito.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Gerenciado não significa que o provedor decide quem pode ler os dados.\",\"Uma certificação de conformidade da AWS não certifica automaticamente a configuração do cliente.\",\"Artefato do fornecedor não mostra se a própria aplicação configurou criptografia corretamente.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t2.1\":{\"section\":2,\"key\":\"Responsabilidade compartilhada\",\"top\":\"DOMÍNIO 2 · 30% DA PROVA\",\"heading\":\"Responsabilidade compartilhada\",\"pills\":\"2.1\",\"desc\":\"Guia de segurança: identidade, evidência e proteção\",\"left\":[{\"title\":\"2.1.1 · Responsabilidade compartilhada em EC2, RDS e serviços gerenciados\",\"items\":[\"Cliente no EC2\",\"Leia o nível de abstração explicitado. O provedor opera instalações, hardware e hipervisor. Em camadas gerenciadas, compare o que o usuário pode configurar, como janela de manutenção, acesso e criptografia. A responsabilidade depende do serviço e da tarefa.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.1.2 · Controles herdados, compartilhados e específicos do cliente\",\"items\":[\"Controle herdado\",\"Divida a revisão em evidências do provedor, controles gerenciados e decisões de configuração do cliente.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Gerenciado não significa que o provedor decide quem pode ler os dados.\",\"Uma certificação de conformidade da AWS não certifica automaticamente a configuração do cliente.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t2.2\":{\"section\":2,\"key\":\"Segurança, governança e conformidade\",\"top\":\"DOMÍNIO 2 · 30% DA PROVA\",\"heading\":\"Segurança, governança e conformidade\",\"pills\":\"2.2\",\"desc\":\"Guia de segurança: identidade, evidência e proteção\",\"left\":[{\"title\":\"2.2.1 · Artifact, Audit Manager e evidências de conformidade\",\"items\":[\"AWS Artifact\",\"Distinga documento do provedor, avaliação de controles, mudança de configuração e ação da API. Verifique a cobertura e a origem de cada evidência antes de usá-la para auditoria.\"],\"tone\":\"\"},{\"title\":\"2.2.2 · CloudTrail, CloudWatch e AWS Config\",\"items\":[\"Amazon CloudWatch\",\"Mapeie sintoma, evento causal e configuração atual. Uma taxa de erros alta é métrica. Alterar uma permissão é atividade de API. Um volume sem a configuração exigida é problema de conformidade. Encaminhar a notificação é outra etapa.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.2.3 · Criptografia, certificados e gestão de segredos\",\"items\":[\"AWS KMS\",\"Separe controle de acesso, criptografia em repouso e sessão de rede.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Artefato do fornecedor não mostra se a própria aplicação configurou criptografia corretamente.\",\"A métrica responde quanto e quando ocorreu um efeito, sem necessariamente identificar a identidade que o provocou.\",\"Mover uma senha para Secrets Manager não concede permissão à aplicação para lê-la.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t2.3\":{\"section\":2,\"key\":\"Identidade e controle de acesso\",\"top\":\"DOMÍNIO 2 · 30% DA PROVA\",\"heading\":\"Identidade e controle de acesso\",\"pills\":\"2.3\",\"desc\":\"Guia de segurança: identidade, evidência e proteção\",\"left\":[{\"title\":\"2.3.1 · Identidade de workloads, privilégios e root\",\"items\":[\"Role IAM com credenciais temporárias\",\"Distingua trust policy, que controla quem assume a role, de permission policy, que controla ações autorizadas após assumi-la. Princípio do menor privilégio inclui ações, recursos e condições. Para uma pessoa, prefira federação e sessões temporárias onde aplicável.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.3.2 · Acesso humano e gestão de múltiplas contas\",\"items\":[\"AWS IAM Identity Center\",\"Desenhe uma sessão de pessoa em duas contas e um guardrail que vale para toda a OU.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Colocar access keys de longo prazo no código ou na AMI cria exposição e rotação difícil.\",\"Uma SCP de permissão máxima nunca substitui as políticas que efetivamente concedem acesso.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t2.4\":{\"section\":2,\"key\":\"Serviços e recursos de segurança\",\"top\":\"DOMÍNIO 2 · 30% DA PROVA\",\"heading\":\"Serviços e recursos de segurança\",\"pills\":\"2.4\",\"desc\":\"Guia de segurança: identidade, evidência e proteção\",\"left\":[{\"title\":\"2.4.1 · Detecção de ameaças, vulnerabilidades e postura\",\"items\":[\"Amazon GuardDuty\",\"Escolha pela evidência: comportamento de ameaça, CVE, visão consolidada ou classificação de dados. Uma ferramenta pode gerar achados consumidos por outra. Investigue a causa e trate o recurso correspondente em vez de confundir centralização com geração do achado.\"],\"tone\":\"\"},{\"title\":\"2.4.2 · WAF, Shield, Firewall Manager e controles de rede\",\"items\":[\"AWS WAF\",\"Localize a camada e a escala: conteúdo HTTP, inundação volumétrica, governança em contas ou tráfego de interfaces. Regras HTTP podem filtrar padrões de requisições. As políticas multi-account podem coordenar as configurações desses controles compatíveis.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.4.3 · Segurança em profundidade e acesso a sub-redes\",\"items\":[\"Network ACL\",\"Dado um acesso a um site, decomponha as decisões por camada e identifique onde evidenciar o efeito.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Macie não é um scanner genérico de imagens de contêiner nem um serviço de firewall.\",\"WAF não é a resposta automática a qualquer pergunta sobre tráfego ou rede.\",\"Security groups permitem tráfego por regras de allow. Bloqueio explícito por faixa é característica de Network ACL quando aplicado à sub-rede.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"d3\":{\"section\":3,\"key\":\"Visão geral · Tecnologia e serviços da nuvem\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Visão geral · Tecnologia e serviços da nuvem\",\"pills\":\"3.1 · 3.2 · 3.3 · 3.4 · 3.5 · 3.6 · 3.7 · 3.8\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.1.1 · Console, CLI, SDK e infraestrutura como código\",\"items\":[\"AWS Management Console\",\"Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro.\"],\"tone\":\"\"},{\"title\":\"3.1.2 · Implantação em nuvem, híbrida e local\",\"items\":[\"Híbrido\",\"Pergunte onde executam compute e dados e se existe integração operacional entre ambientes. Restrições de latência, dependências antigas ou residência podem exigir presença local ainda que outras partes migrem.\"],\"tone\":\"\"},{\"title\":\"3.2.1 · Regiões, zonas, edge e critérios geográficos\",\"items\":[\"Região AWS\",\"Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário.\"],\"tone\":\"\"},{\"title\":\"3.3.1 · EC2, Lambda, containers e Fargate\",\"items\":[\"Amazon EC2\",\"Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda.\"],\"tone\":\"\"},{\"title\":\"3.3.2 · Integração de capacidade e tráfego na aplicação\",\"items\":[\"EC2 Auto Scaling\",\"Diferencie crescer a capacidade, encaminhar tráfego de aplicação, distribuir transporte e publicar conteúdo global em cache. Use health checks e políticas calibradas ao requisito.\"],\"tone\":\"\"},{\"title\":\"3.4.1 · RDS, Aurora, DynamoDB e Redshift\",\"items\":[\"Amazon DynamoDB\",\"Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.6.1 · S3, EBS, EFS e FSx por interface de acesso\",\"items\":[\"Amazon S3\",\"Identifique protocolo e padrão de compartilhamento antes de escolher a classe de armazenamento.\"],\"tone\":\"go\"},{\"title\":\"3.6.2 · Classes S3, arquivamento, backup e retenção\",\"items\":[\"S3 Intelligent-Tiering\",\"Monte uma matriz para dados quentes, frios, imprevisíveis e arquivados por anos.\"],\"tone\":\"go\"},{\"title\":\"3.7.1 · Analytics: Athena, Glue, Redshift e visualização\",\"items\":[\"Amazon Athena\",\"Siga um relatório desde arquivos brutos até tratamento, execução de consulta e apresentação.\"],\"tone\":\"go\"},{\"title\":\"3.7.2 · IA gerenciada e escolha pelo tipo de tarefa\",\"items\":[\"Amazon Textract\",\"Diferencie uma imagem de objeto, um formulário escaneado e um texto que precisa de classificação.\"],\"tone\":\"go\"},{\"title\":\"3.8.1 · Serviços de integração: filas, tópicos, eventos e workflows\",\"items\":[\"AWS Step Functions\",\"Compare o papel dos quatro serviços no mesmo processo de pedido e envio.\"],\"tone\":\"go\"},{\"title\":\"3.8.2 · Ferramentas operacionais e serviços por função\",\"items\":[\"AWS Systems Manager\",\"Decida qual ação segue cada evidência: evento na conta, recomendação de custo, tarefa em frota e retenção de backup.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"CLI automatiza ações, mas seu uso por si só não descreve a configuração inteira como um estado declarativo.\",\"Usar AWS em uma Região não torna a arquitetura híbrida se nenhum componente operacional permanece fora dela.\",\"Usar CloudFront não replica automaticamente o banco entre Regiões.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.1\":{\"section\":3,\"key\":\"Formas de implantação e operação\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Formas de implantação e operação\",\"pills\":\"3.1\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.1.1 · Console, CLI, SDK e infraestrutura como código\",\"items\":[\"AWS Management Console\",\"Avalie frequência, repetibilidade, ambiente e quem vai operar. Compare tarefa pontual, automação por shell, integração na aplicação e provisionamento do ambiente inteiro.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.1.2 · Implantação em nuvem, híbrida e local\",\"items\":[\"Híbrido\",\"Trace o caminho de uma transação, destacando em qual ambiente estão aplicação, banco e operação.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"CLI automatiza ações, mas seu uso por si só não descreve a configuração inteira como um estado declarativo.\",\"Usar AWS em uma Região não torna a arquitetura híbrida se nenhum componente operacional permanece fora dela.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.2\":{\"section\":3,\"key\":\"Infraestrutura global\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Infraestrutura global\",\"pills\":\"3.2\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.2.1 · Regiões, zonas, edge e critérios geográficos\",\"items\":[\"Região AWS\",\"Tolerância à falha de zona normalmente pede distribuição entre zonas. Um desastre regional requer plano no escopo de Região. Conteúdo próximo do usuário pode usar edge sem mover o estado primário.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"Como verificar\",\"items\":[\"Explique separadamente localização dos dados, borda de entrega e domínio de falha.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Usar CloudFront não replica automaticamente o banco entre Regiões.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.3\":{\"section\":3,\"key\":\"Computação\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Computação\",\"pills\":\"3.3\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.3.1 · EC2, Lambda, containers e Fargate\",\"items\":[\"Amazon EC2\",\"Separe unidade de trabalho, responsabilidade pelo host e compatibilidade. Para Kubernetes gerenciado, escolha EKS. Para contêiner sem administrar servidor, compare ECS ou EKS com Fargate. Para controle de SO, EC2. Para evento curto e stateless, avalie Lambda.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.3.2 · Integração de capacidade e tráfego na aplicação\",\"items\":[\"EC2 Auto Scaling\",\"Simule um alvo não saudável e uma subida de tráfego; observe quais componentes agem.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Fargate não é um orquestrador substituto de ECS ou EKS.\",\"Instalar um balanceador não altera a quantidade de instâncias sem integração de escala.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.4\":{\"section\":3,\"key\":\"Bancos de dados\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Bancos de dados\",\"pills\":\"3.4\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.4.1 · RDS, Aurora, DynamoDB e Redshift\",\"items\":[\"Amazon DynamoDB\",\"Distinga transação com SQL e joins, lookup por chave em escala, warehouse analítico e cache. Considere compatibilidade com motor e driver, volume por acesso, concorrência e manutenção.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.4.2 · Migração de banco, conversão de esquema e cache\",\"items\":[\"AWS Database Migration Service\",\"Em uma mudança Oracle → PostgreSQL, classifique tarefas de avaliação, conversão, carga, CDC e atendimento.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"A presença de SQL não transforma todo banco relacional em warehouse otimizado para agregações analíticas.\",\"Uma migração com CDC não garante automaticamente que stored procedures funcionem no motor novo.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.5\":{\"section\":3,\"key\":\"Redes\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Redes\",\"pills\":\"3.5\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.5.1 · VPC, DNS e entrega global de conteúdo\",\"items\":[\"Amazon VPC\",\"Separe espaço de endereçamento, resolução de nomes, entrega em HTTP e caminho de transporte. O requisito por IP fixo ou por cache diferencia estratégias que parecem similares.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.5.2 · Conectividade híbrida e saída da rede\",\"items\":[\"AWS Site-to-Site VPN\",\"Descreva os caminhos para API da AWS, escritório e download de patches da internet.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Alterar DNS pode influenciar o destino do tráfego. Isso não coloca conteúdo em cache.\",\"Direct Connect não oferece criptografia de todo tráfego automaticamente.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.6\":{\"section\":3,\"key\":\"Armazenamento\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Armazenamento\",\"pills\":\"3.6\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.6.1 · S3, EBS, EFS e FSx por interface de acesso\",\"items\":[\"Amazon S3\",\"Decida primeiro pela interface requerida: objeto, bloco, arquivo Linux compartilhado ou um sistema de arquivos específico. Só então avalie capacidade, latência, throughput e custo.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.6.2 · Classes S3, arquivamento, backup e retenção\",\"items\":[\"S3 Intelligent-Tiering\",\"Monte uma matriz para dados quentes, frios, imprevisíveis e arquivados por anos.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Usar S3 como destino de um data lake não o torna um volume de bloco para instalar um sistema operacional EC2.\",\"Preço de armazenamento por GB isolado não considera acesso, recuperação, solicitações ou duração mínima.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.7\":{\"section\":3,\"key\":\"IA, ML e análise\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"IA, ML e análise\",\"pills\":\"3.7\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.7.1 · Analytics: Athena, Glue, Redshift e visualização\",\"items\":[\"Amazon Athena\",\"Identifique se a etapa consulta o lake, transforma e cataloga, serve consultas num warehouse ou apresenta a informação. Considere recorrência, fontes, custo por consulta e padrões de acesso.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.7.2 · IA gerenciada e escolha pelo tipo de tarefa\",\"items\":[\"Amazon Textract\",\"Diferencie uma imagem de objeto, um formulário escaneado e um texto que precisa de classificação.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Visualização e transformação distribuída respondem a etapas diferentes da mesma arquitetura.\",\"Uma API de visão não substitui automaticamente a extração estruturada de formulários.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t3.8\":{\"section\":3,\"key\":\"Outros serviços no escopo\",\"top\":\"DOMÍNIO 3 · 34% DA PROVA\",\"heading\":\"Outros serviços no escopo\",\"pills\":\"3.8\",\"desc\":\"Guia de serviços: compute, armazenamento, rede e análise\",\"left\":[{\"title\":\"3.8.1 · Serviços de integração: filas, tópicos, eventos e workflows\",\"items\":[\"AWS Step Functions\",\"Se o problema é orquestração, verifique sequência, estado, erros e retry. Se é integração, verifique se precisa buffer, fan-out ou seleção por conteúdo.\"],\"tone\":\"\"},{\"title\":\"3.8.2 · Ferramentas operacionais e serviços por função\",\"items\":[\"AWS Systems Manager\",\"Diferencie executar a ação, obter visibilidade de evento, revisar recomendações e centralizar backups. Confirme configuração dos recursos, permissões da conta e elegibilidade para cada integração.\"],\" , alimentar modelo analítico ou encontrar desvio inesperado. Considere atraso de processamento da cobrança na interpretação de alertas.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.2.2 · Cobrança consolidada, tags e alocação de custos\",\"items\":[\"Cobrança consolidada do AWS Organizations\",\"Reconcilie o custo por conta com o custo por produto e identifique a despesa sem dono.\"],\"tone\":\"go\"},{\"title\":\"4.3.1 · Recursos técnicos, status da conta e canais de suporte\",\"items\":[\"AWS Support Center\",\"Escolha o primeiro canal para quatro situações diferentes e identifique quando abrir um caso.\"],\"tone\":\"go\"},{\"title\":\"4.3.2 · Planos de suporte e auxílio técnico por necessidade\",\"items\":[\"Usar o suporte de conta e cobrança\",\"Para cada cenário, identifique se há dúvida de cobrança, caso técnico crítico, necessidade de apoio proativo ou consulta de recomendações.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Savings Plans não garantem capacidade física disponível. Spot não atende sozinho requisito de capacidade contínua sem estratégia de interrupção.\",\"Uma estimativa de arquitetura futura não substitui a análise de uso e custo histórico.\",\"Configurar um orçamento com alerta não impõe um teto rígido universal para a fatura.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"},\"t4.1\":{\"section\":4,\"key\":\"Modelos de preços\",\"top\":\"DOMÍNIO 4 · 12% DA PROVA\",\"heading\":\"Modelos de preços\",\"pills\":\"4.1\",\"desc\":\"Guia de custos: estimar, observar, alertar e amortizar\",\"left\":[{\"title\":\"4.1.1 · On-Demand, Savings Plans, reservas e Spot\",\"items\":[\"Spot Instances\",\"Classifique previsibilidade, tolerância à interrupção, necessidade de flexibilidade e diferença entre desconto e reserva de capacidade. Capacidade On-Demand reservada segue regras e é distinta de um compromisso de preço.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.1.2 ·  e amortizar\",\"left\":[{\"title\":\"4.3.1 · Recursos técnicos, status da conta e canais de suporte\",\"items\":[\"AWS Support Center\",\"Distinga incidente que requer suporte contratado, evento de serviço que já tem status, verificação de boas práticas e edição de um runbook com informação pública. Consulte a tabela de planos atual para nomes e SLA de primeira resposta.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.3.2 · Planos de suporte e auxílio técnico por necessidade\",\"items\":[\"Usar o suporte de conta e cobrança\",\"Para cada cenário, identifique se há dúvida de cobrança, caso técnico crítico, necessidade de apoio proativo ou consulta de recomendações.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Evite\",\"items\":[\"Um SLA de primeira resposta não é uma promessa de resolver o incidente no mesmo prazo.\",\"Um plano habilita canais de suporte e condições específicas; um SLA de resposta inicial não assegura a resolução naquele prazo.\"],\"tone\":\"bad\"}],\"footer\":\"Use a biblioteca do domínio para abrir todas as habilidades e os casos resolvidos.\"}};\nconst SECTIONS = [{\"s\":1,\"label\":\"1 · Conceitos da nuvem (24%)\"},{\"s\":2,\"label\":\"2 · Segurança e conformidade (30%)\"},{\"s\":3,\"label\":\"3 · Tecnologia e serviços da nuvem (34%)\"},{\"s\":4,\"label\":\"4 · Cobrança, preços e suporte (12%)\"}];\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\nfunction decorate(s){\n  const safe=esc(s);\n  if(s.includes(' → ')){\n    const i=s.lastIndexOf(' → ');\n    return esc(s.slice(0,i))+' → \u003cb>'+esc(s.slice(i+3))+'\u003c/b>';\n  }\n  const m=s.match(/^([^:]{2,50}):\\s/);\n  if(m) return '\u003cb>'+esc(m[1])+':\u003c/b> '+esc(s.slice(m[0].length));\n  return safe;\n}\nconst C = c => `\u003csection class=\"c ${esc(c.tone||'')}\">\u003ch3>${esc(c.title)}\u003c/h3>\u003cul>${c.items.map(x=>`\u003cli>${decorate(x)}\u003c/li>`).join('')}\u003c/ul>\u003c/section>`;\ncon );\n requestAnimationFrame(draw);\n}\nfunction filterSection(s){\n currentSection=s; sb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.s)===s?'true':'false'));\n const keys=Object.keys(M).filter(k=>M[k].section===s); n.innerHTML='';\n keys.forEach(k=>{const b=document.createElement('button');b.textContent=M[k].key;b.dataset.k=k;b.type='button';b.onclick=()=>show(k);n.appendChild(b)});\n show(keys[0]);\n}\nSECTIONS.forEach(sec=>{const b=document.createElement('button');b.type='button';b.textContent=sec.label;b.dataset.s=sec.s;b.onclick=()=>filterSection(sec.s);sb.appendChild(b)});\naddEventListener('resize',draw);addEventListener('beforeprint',draw);\ndocument.getElementById('themeBtn').addEventListener('click',()=>{const root=document.documentElement;const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;document.getElementById('themeBtn').textContent=next==='dark'?'☀ Tema claro':'◐ Tema escuro';requestAnimationFrame(draw)});\nfilterSection(1);\n\nwindow.addEventListener('message', e => {\n  const msg = e.data || {};\n  if (msg.type === 'NAV_MINDMAP' && msg.id) {\n    const m = M[msg.id];\n    if (m) {\n      filterSection(m.section);\n      show(msg.id);\n    }\n  } else if (msg.type === 'SET_THEME' && msg.theme) {\n    document.documentElement.dataset.theme = msg.theme;\n    document.getElementById('themeBtn').textContent = msg.theme === 'dark' ? '☀ Tema claro' : '◐ Tema escuro';\n    requestAnimationFrame(draw);\n  }\n});\n\u003c/script>\n\u003cfooter>\u003cdetails class=\"refs\">\u003csummary>Fontes e referência de escopo\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html\" target=\"_blank\" rel=\"noopener\">Guia oficial CLF-C02\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://aws.amazon.com/pt/certification/certified-cloud-practitioner/\" target=\"_blank\" rel=\"noopener\">Certificação e preparação ng:14px 14px 12px}.top h1{font-size:22px}.top-meta span{font-size:10px}.shell{padding:10px 8px 24px}.domain-tabs{gap:6px}.domain-tab{padding:8px}.domain-tab strong{font-size:10px}.domain-tab small{font-size:10px}.toolbar{gap:6px;padding:8px}.searchbox{flex-basis:100%}.toolbtn{height:35px;padding:0 8px;font-size:11px}.map-head h2{font-size:18px}.map-badge{min-width:68px;padding:6px;font-size:9px}.flow-list{padding:8px}.trap-box{margin:0 8px 9px}.map-foot{padding:8px}}\n@media print{@page{size:A3 landscape;margin:8mm}body{background:#fff!important;color:#15263d!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.top,.domain-tabs,.toolbar,.map-nav,.result-note{display:none!important}.shell{max-width:none;padding:0!important}.map-page{box-shadow:none;border:0;border-radius:0;overflow:visible;font-size:10pt!important;break-after:page;page-break-after:always}.map-head{padding:5mm 5mm 3mm}.map-head h2{font-size:19pt}.lanes{display:grid!important;grid-template-columns:1.05fr 1.04fr 1.55fr 1.12fr;padding:3mm 3mm 0;gap:2.5mm}.flow-list{padding:2.5mm 3mm 3mm;gap:2mm}.flow-row{grid-template-columns:1.05fr 1.04fr 1.55fr 1.12fr!important;gap:2.5mm;min-height:31mm;padding:0;border:0;break-inside:avoid}.scenario,.risk{padding:2.5mm}.decision{padding:1mm 4mm}.decision-card{clip-path:polygon(50% 0%,100% 50%,50% 100%,0 50%)!important;min-height:21mm;padding:4mm 7mm;font-size:9pt}.decision-card:before{display:none!important}.paths{padding:0;gap:1.6mm}.path-card{padding:2mm 2.5mm;min-height:12mm;break-inside:avoid}.path-card h3{font-size:9pt}.path-card p{font-size:7.5pt}.scenario p,.risk p{font-size:8pt}.scenario .mini,.risk .mini{font-size:7pt}.trap-box{margin:0 3mm 3mm;padding:2.5mm 3mm;break-inside:avoid}.trap-box p{font-size:8pt}.map-foot{padding:2mm 3mm;font-size:7pt}.map-page.print-hide{display:none!important}body.print-all #printAllMaps .map-page{display:block!important}body.print-all #mainMap{display:none!important}body:not(.print-all) #printAllMaps{display:none!important}body:not(.print-all) #mainMap .map-page{display:block!important}}\n\u003c/style>\n\u003cstyle>@media screen{html.reading-mode body>header:first-of-type{display:none}} @media(max-width:550px){.tablewrap,.section{max-width:100%;overflow:auto}.map-head{flex-wrap:wrap}} \u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader class=\"top\">\u003cdiv class=\"top-inner\">\u003cdiv class=\"eyebrow\">AWS CERTIFIED CLOUD PRACTITIONER · CLF-C02\u003c/div>\u003ch1>Fluxogramas Interativos · AWS Certified Cloud Practitioner\u003c/h1>\u003cp>Mapas de decisão arquitetural por domínio. Siga o requisito → responda ao desempate → compare os caminhos possíveis → leia o trade-off.\u003c/p>\u003cdiv class=\"top-meta\">\u003cspan>19 fluxogramas\u003c/span>\u003cspan>Diagramas por domínio · casos e escolhas\u003c/span>\u003c/div>\u003c/div>\u003c/header>\n\u003cmain class=\"shell\">\n \u003cnav class=\"domain-tabs\" id=\"domainTabs\" aria-label=\"Domínios do exame\">\u003c/nav>\n \u003csection class=\"toolbar\" aria-label=\"Ferramentas do mapa\">\n  \u003cdiv class=\"searchbox\">\u003cspan class=\"sicon\">⌕\u003c/span>\u003cinput id=\"search\" type=\"search\" placeholder=\"Buscar serviço, parâmetro, skill ou pegadinha…\" autocomplete=\"off\">\u003cbutton class=\"clear\" id=\"clearSearch\" aria-label=\"Limpar busca\">×\u003c/button>\u003c/div>\n  \u003cbutton class=\"toolbtn\" id=\"prevBtn\" title=\"Mapa anterior (←)\">← Anterior\u003c/button>\u003cbutton class=\"toolbtn\" id=\"nextBtn\" title=\"Próximo mapa (→)\">Próximo →\u003c/button>\n  \u003cbutton class=\"toolbtn\" id=\"zoomOut\" title=\"Diminuir zoom\">A−\u003c/button>\u003cspan class=\"zoom-readout\" id=\"zoomReadout\">100%\u003c/span>\u003cbutton class=\"toolbtn\" id=\"zoomIn\" title=\"Aumentar zoom\">A+\u003c/button>\n  \u003cbutton class=\"toolbtn\" id=\"themeBtn\">☾ Tema escuro\u003c/button>\u003cbutton class=\"toolbtn\" id=\"printCurrent\">Imprimir mapa\u003c/button>\u003cbutton class=\"toolbtn primary\" id=\"printAllBtn\">Imprimir todos\u003c/button>\n  \u003cspan class=\"kbdhint\">Atalhos: ← → navegar · Ctrl/⌘+K buscar · Esc limpar busca\u003c/span>\n \u003c/section>\n \u003cnav class=\"map-nav\" id=\"mapNav\" aria-label=\"Mapas do domínio\">\u003c/nav>\n \u003cdiv class=\"result-note\" id=\"resultNote\" aria-live=\"polite\">\u003c/div>\n \u003csection id=\"mainMap\">\u003c/section>\n \u003csection id=\"printAllContainer\" class=\"hidden\" aria-hidden=\"true\">\u003cdiv id=\"printAllMaps\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst MAPS = [{\"id\":1,\"domain\":1,\"tree\":\"1.1\",\"title\":\"Valor da nuvem AWS\",\"skills\":\"1.1.1, 1.1.2\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre valor da nuvem aws?\",\"question\":\"O cenário exige esta condição? Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair.\",\"yes\":{\"title\":\"Elasticidade\",\"detail\":\"Use uma curva de uma semana e marque pico, vale e capacidade. Explique o que muda se o comportamento se torna previsível e constante.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"O negócio aceita perder no máximo 15 minutos de dados.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre valor da nuvem aws?\",\"question\":\"O cenário exige esta condição? O negócio aceita perder no máximo 15 minutos de dados.\",\"yes\":{\"title\":\"RPO\",\"detail\":\"Simule a perda de uma zona, depois uma indisponibilidade regional. Compare impacto, ponto recuperável e tempo de retorno.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volte à pergunta e confira os requisitos nas opções exibidas.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"}],\"traps\":\"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.\"},{\"id\":2,\"domain\":1,\"tree\":\"1.2\",\"title\":\"Princípios de design e Well-Architected\",\"skills\":\"1.2.1, 1.2.2, 1.2.3\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre princípios de design e well-architected?\",\"question\":\"O cenário exige esta condição? O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação.\",\"yes\":{\"title\":\"Excelência operacional\",\"detail\":\"Descreva um risco e identifique o resultado mensurável que confirma a melhoria.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre princípios de design e well-architected?\",\"question\":\"O cenário exige esta condição? Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar.\",\"yes\":{\"title\":\"Amazon SQS\",\"detail\":\"Anote o que acontece se o consumidor ficar fora por alguns minutos. Identifique se o produtor espera, se a mensagem pode ser tratada depois e quantos consumidores a recebem.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre princípios de design e well-architected?\",\"question\":\"O cenário exige esta condição? Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido.\",\"yes\":{\"title\":\"Segurança\",\"detail\":\"Considere a mesma mudança como intervenção em dois pilares. Identifique a métrica que permite sustentar o argumento de cada um.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volte à pergunta e confira os requisitos nas opções exibidas.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"}],\"traps\":\"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.\"},{\"id\":3,\"domain\":1,\"tree\":\"1.3\",\"title\":\"Adoção e migração\",\"skills\":\"1.3.1, 1.3.2\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre adoção e migração?\",\"question\":\"O cenário exige esta condição? Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho.\",\"yes\":{\"title\":\"Rehost\",\"detail\":\"Identifique o que muda no código, no motor de banco, na infraestrutura e no modelo operacional.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre adoção e migração?\",\"question\":\"O cenário exige esta condição? O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa.\",\"yes\":{\"title\":\"AWS Cloud Adoption Framework\",\"detail\":\"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volte à pergunta e confira os requisitos nas opções exibidas.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"}],\"traps\":\"Trocar um software instalado por uma assinatura SaaS é repurchase, mesmo que os dados sejam migrados.\"},{\"id\":4,\"domain\":1,\"tree\":\"1.4\",\"title\":\"Economia da nuvem\",\"skills\":\"1.4.1, 1.4.2\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre economia da nuvem?\",\"question\":\"O cenário exige esta condição? Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização.\",\"yes\":{\"title\":\"Troca de investimento antecipado por despesa variável\",\"detail\":\"Compare duas opções com o mesmo volume, tendência de crescimento, prazo e SLA.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre economia da nuvem?\",\"question\":\"O cenário exige esta condição? Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico.\",\"yes\":{\"title\":\"Rightsizing\",\"detail\":\"Identifique se o objetivo é reduzir tamanho, tempo ativo, quantidade simultânea ou mão de obra.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volte à pergunta e confira os requisitos nas opções exibidas.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"}],\"traps\":\"Preço por hora não equivale ao custo total. Compromissos ou compras antecipadas continuam existindo na nuvem.\"},{\"id\":5,\"domain\":2,\"tree\":\"2.1\",\"title\":\"Responsabilidade compartilhada\",\"skills\":\"2.1.1, 2.1.2\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre responsabilidade compartilhada?\",\"question\":\"O cenário exige esta condição? Quem deve corrigir uma vulnerabilidade no Linux que a empresa instalou no EC2?\",\"yes\":{\"title\":\"Cliente no EC2\",\"detail\":\"Liste as responsabilidades para hardware, SO convidado, motor de banco, credenciais e políticas de dados conforme a opção.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre responsabilidade compartilhada?\",\"question\":\"O cenário exige esta condição? Controle de acesso físico ao datacenter AWS é que tipo de controle para o cliente?\",\"yes\":{\"title\":\"Controle herdado\",\"detail\":\"Divida a revisão em evidências do provedor, controles gerenciados e decisões de configuração do cliente.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volte à pergunta e confira os requisitos nas opções exibidas.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"}],\"traps\":\"Gerenciado não significa que o provedor decide quem pode ler os dados.\"},{\"id\":6,\"domain\":2,\"tree\":\"2.2\",\"title\":\"Segurança, governança e conformidade\",\"skills\":\"2.2.1, 2.2.2, 2.2.3\",\"decisions\":[{\"scenario\":\"Qual requisito explica a decisão sobre segurança, governança e conformidade?\",\"question\":\"O cenário exige esta condição? O jurídico precisa acessar um relatório de auditoria SOC da AWS.\",\"yes\":{\"title\":\"AWS Artifact\",\"detail\":\"Para quatro perguntas de um auditor, indique qual produto fornece cada evidência.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"O time quer alarme para aumento de erros HTTP no serviço.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre segurança, governança e conformidade?\",\"question\":\"O cenário exige esta condição? O time quer alarme para aumento de erros HTTP no serviço.\",\"yes\":{\"title\":\"Amazon CloudWatch\",\"detail\":\"Associe três evidências do mesmo incidente: alarme, autor da alteração e snapshot de configuração.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"A organização quer gerenciar chaves usadas para criptografar objetos S3.\"},\"risk\":\"Compare o requisito com o mecanismo e os limites na ficha vinculada.\"},{\"scenario\":\"Qual requisito explica a decisão sobre segurança, governança e conformidade?\",\"question\":\"O cenário exige esta condição? A organização quer gerenciar chaves usadas para criptografar objetos S3.\",\"yes\":{\"title\":\"AWS KMS\",\"detail\":\"Separe controle de acesso, criptografia em repouso e sessão de rede.\"},\"no\":{\"title\":\"Avalie outro caminho\",\"detail\":\"Volt L=list.map(m=>`\u003cbutton class=\"map-tab\" data-id=\"${m.id}\" aria-pressed=\"${m.id===currentId}\">\u003cspan class=\"num\">${String(m.id).padStart(2,'0')}\u003c/span>${esc(m.title)}\u003c/button>`).join('');$('#resultNote').textContent=searchTerm?`${list.length} mapa(s) correspondem à busca “${searchTerm}”. A pesquisa considera os ${MAPS.length} fluxogramas; escolha um resultado para abrir.`:`${DOMAINS[currentDomain-1].range} · ${list.length} mapa(s) neste domínio. Cada linha é uma decisão independente com ramificações reais SIM/NÃO.`;}\nfunction selectMap(id){const m=MAPS.find(x=>x.id===id);if(!m)return;currentId=id;currentDomain=m.domain;renderDomains();renderCurrent();\ndocument.addEventListener('click',ev=>{const b=ev.target.closest('[data-tree]');if(b)parent.portalNavigate('d'+b.dataset.domain,'tree',b.dataset.tree);});}\nfunction drawConnectors(root=document){root.querySelectorAll('.flow-row').forEach(row=>{const svg=row.querySelector('.links'),d=row.querySelector('.decision-card'),yes=row.querySelector('.path-card.yes'),no=row.querySelector('.path-card.no');if(!svg||innerWidth\u003c=850){if(svg)svg.innerHTML='';return}const rr=row.getBoundingClientRect(),dr=d.getBoundingClientRect(),yr=yes.getBoundingClientRect(),nr=no.getBoundingClientRect();const w=row.clientWidth,h=row.clientHeight;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w);svg.setAttribute('height',h);const x1=dr.right-rr.left-2,y1=dr.top+dr.height/2-rr.top,x2=yr.left-rr.left+2,y2=yr.top+yr.height/2-rr.top,x3=nr.left-rr.left+2,y3=nr.top+nr.height/2-rr.top;const bend=Math.max(12,(x2-x1)*.48);svg.innerHTML=`\u003cpath d=\"M${x1} ${y1} C${x1+bend} ${y1},${x2-bend} ${y2},${x2} ${y2}\" stroke=\"var(--green)\"/>\u003cpath d=\"M${x1} ${y1} C${x1+bend} ${y1},${x3-bend} ${y3},${x3} ${y3}\" stroke=\"var(--purple)\"/>`;});}\nfunction setSearch(v){searchTerm=v.trim();const list=MAPS.filter(m=>matches(m,searchTerm));if(searchTerm&&list.length){if(!list.some(m=>m.id===currentId))selectMap(list[0].id);else{renderNav();renderCurrent()}}else if(searchTerm){renderNav();$('#mainMap').innerHTML='\u003cdiv class=\"empty\">\u003cstrong>Nenhum resultado encontrado.\u003c/strong>\u003cbr>Tente buscar por um nome de serviço, parâmetro ou conceito.\u003c/div>'}else{renderDomains();renderCurrent()}}\nfunction move(delta){const filtered=MAPS.filter(m=>matches(m,searchTerm));if(!filtered.length)return;let i=filtered.findIndex(m=>m.id===currentId);if(i\u003c0)i=0;i=(i+delta+filtered.length)%filtered.length;selectMap(filtered[i].id)}\nfunction setZoom(v){zoom=Math.min(1.25,Math.max(.78,v));$('#mainMap .map-page')?.style.setProperty('font-size',`calc(14px * ${zoom})`);$('#zoomReadout').textContent=Math.round(zoom*100)+'%';drawConnectors()}\nfunction createPrintAll(){ $('#printAllMaps').innerHTML=MAPS.map(mapCard).join(''); }\nfunction printAllMapsNow(){createPrintAll();document.body.classList.add('print-all');$('#printAllContainer').classList.remove('hidden');requestAnimationFrame(()=>{drawConnectors($('#printAllMaps'));window.print();});}\nwindow.addEventListener('afterprint',()=>{document.body.classList.remove('print-all');$('#printAllContainer').classList.add('hidden')});\n$('#domainTabs').addEventListener('click',e=>{const b=e.target.closest('[data-domain]');if(!b)return;currentDomain=+b.dataset.domain;$('#search').value='';searchTerm='';const first=MAPS.find(m=>m.domain===currentDomain);selectMap(first.id);});\n$('#mapNav').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)selectMap(+b.dataset.id)});\n$('#search').addEventListener('input',e=>setSearch(e.target.value));$('#clearSearch').addEventListener('click',()=>{$('#search').value='';setSearch('');$('#search').focus()});\n$('#prevBtn').addEventListener('click',()=>move(-1));$('#nextBtn').addEventListener('click',()=>move(1));$('#zoomOut').addEventListener('click',()=>setZoom(zoom-.05));$('#zoomIn').addEventListener('click',()=>setZoom(zoom+.05));$('#printCurrent').addEventListener('click',()=>window.print());$('#printAllBtn').addEventListener('click',printAllMapsNow);\n$('#themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#themeBtn').textContent=dark?'☀ Tema claro':'☾ Tema escuro';drawConnectors()});\ndocument.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();return}if(e.key==='Escape'&&tag==='input'){ $('#search').value='';setSearch('');return}if(tag==='input'||tag==='textarea'||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.key==='ArrowRight'){e.preventDefault();move(1)}});\nwindow.addEventListener('resize',()=>drawConnectors());\nrenderDomains();renderCurrent();\ndocument.addEventListener('click',ev=>{const b=ev.target.closest('[data-tree]');if(b)parent.portalNavigate('d'+b.dataset.domain,'tree',b.dataset.tree);});\n\nwindow.addEventListener('message', e => {\n  const msg = e.data || {};\n  if (msg.type === 'NAV_FLOWCHART' && msg.id) {\n    if (msg.search) { $('#search').value = msg.search; searchTerm = msg.search; }\n    else { $('#search').value = ''; searchTerm = ''; }\n    selectMap(Number(msg.id));\n  } else if (msg.type === 'SET_THEME' && msg.theme) {\n    document.documentElement.dataset.theme = msg.theme;\n    $('#themeBtn').textContent = msg.theme === 'dark' ? '☀ Tema claro' : '☾ Tema escuro';\n    drawConnectors();\n  }\n});\n\u003c/script>\n\u003cscript>document.addEventListener('click',e=>{if(!e.target.closest('#theme, #themeBtn'))return;e.stopImmediatePropagation();parent.portalToggleTheme();},true);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.stopImmediatePropagation();e.preventDefault();parent.portalOpenSearch();}},true);\u003c/script>\u003c/body>\u003c/html>","core":"\u003c!doctype html>\u003chtml la n items(a){return permute(attemptForms(a)[a.form],a.seed);}\nfunction checkAttempt(a,finished){\n const forms=attemptForms(a);\n if(!object(a)||!secret.test(a.id)||!own(forms,a.form)||![VERSION,LEGACY].includes(a.version)||\n  !Number.isInteger(a.seed)||a.seed\u003c1||a.seed>0xffffffff||!Number.isFinite(a.started)||\n  a.deadline!==a.started+expires||!Number.isInteger(a.index)||a.index\u003c0||a.index>=forms[a.form].length||\n  !object(a.answers)||!object(a.flags))return false;\n if(finished?(typeof a.finished!=='number'||a.finished\u003ca.started||!Number.isFinite(a.finished)):('finished' in a))return false;\n const selected=new Set(forms[a.form]);\n return Object.entries(a.answers).every(([id,ans])=>selected.has(id)&&validChoice(examQuestion(a,id),ans))&&Object.entries(a.flags).every(([id,v])=>selected.has(id)&&typeof v==='boolean');\n}\nfunction validated(raw){\n if(!object(raw)||raw.certification!==m.cert||![VERSION,LEGACY].includes(raw.version))throw Error('Backup incompatível');\n const out=empty();\n for(const [k,v] of Object.entries(raw.marked??{}))if(skills.has(k)&&v===true)out.marked[k]=true;\n for(const [k,v] of Object.entries(raw.notes??{}))if(skills.has(k)&&typeof v==='string')out.notes[k]=v.slice(0,16000);\n for(const [k,v] of Object.entries(raw.cases??{}))if(m.architectures.some(a=>a.native===k)&&v===true)out.cases[k]=true;\n function readRecords(source,bank,target){\n  for(const [k,v] of Object.entries(source??{})){\n   const q=bank.get(k);\n   if(q&&!q.form&&object(v)&&validChoice(q,v.choice,true)&&typeof v.first==='boolean'&&Number.isFinite(v.updated)){\n    target[k]={first:v.first,last:isRight(q,v.choice),choice:v.choice,updated:v.updated};\n   }\n  }\n }\n if(raw.version===VERSION)readRecords(raw.practice,questions,out.practice);\n readRecords(raw.version===LEGACY?raw.practice:raw.legacyPractice,archivedQuestions,out.legacyPractice);\n out.attempts=[...new Map((Array.isArray(raw.attempts)?raw.attempts:[]).filter(a=>checkAttempt(a,true)).map(a=>[a.id,a])).values()].sort((a,b)=>a.finished-b.finished);\n const visited=new Set(out.attempts.map(a=>a.id));\n for(const a of [raw.active,...(Array.isArray(raw.queue)?raw.queue:[])])if(checkAttempt(a,false)&&!visited.has(a.id)){\n  visited.add(a.id);if(out.active)out.queue.push(a);else out.active=a;\n }\n return out;\n}\ntry{const raw=localStorage.getItem(STORE)??localStorage.getItem(LEGACY_STORE);if(raw)state=validated(JSON.parse(raw));}catch{announce('Progresso local indisponível. Use um backup JSON.');}\nfunction save(){\n try{localStorage.setItem(STORE,JSON.stringify(state));}\n catch{announce('O navegador bloqueou o armazenamento. Exporte o progresso.');}\n}\nfunction announce(msg){$('status').textContent=msg;}\nfunction report(){parent.portalCoreUpdated();}\nfunction saveAndReport(){save();report();}\nfunction grade(a){\n const domains=m.domains.map(x=>({id:x.id,right:0,total:0}));\n let right=0,total=0,pilot=0,pilotTotal=0;\n for(const id of items(a)){\n  const q=examQuestion(a,id),ok=isRight(q,a.answers[id]);\n  if(q.scored){const d=domains[q.domain-1];d.right+=Number(ok);d.total++;right+=Number(ok);total++;}\n  else{pilot+=Number(ok);pilotTotal++;}\n }\n return {right,total,pilot,pilotTotal,domains};\n}\nfunction start(form){\n if(state.active){go('simulado');return;}\n if(!own(data.forms,form))return;\n const started=Date.now(),seed=rand();\n state.active={id:form+'-'+started+'-'+seed,form,seed,version:VERSION,started,deadline:started+expires,index:0,answers:{},flags:{}};\n saveAndReport();go('simulado');\n}\nfunction finish(a,expired,nav){\n const match=state.attempts.find(x=>x.id===a.id);\n if(!match)state.attempts.push({...a,finished:expired?a.deadline:Date.now(),expired:Boolean(expired)});\n state.attempts.sort((x,y)=>x.finished-y.finished);\n if(state.active?.id===a.id)state.active=null;\n state.queue=state.queue.filter(x=>x.id!==a.id);\n saveAndReport();if(nav)go('resultado/'+a.id);\n}\nfunction tick(){\n const now=Date.now();\n for(const a of state.queue.slice())if(now>=a.deadline)finish(a,true,false);\n const active=state.active;\n if(!active)return true;\n const left=Math.ceil((active.deadline-now)/1000);\n if(left\u003c=0){finish(active,true,currentPath()==='simulado');return false;}\n const clock=$('clock');\n if(clock)clock.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');\n return true;\n}\nconst orderFor=(q,seed)=>permute(q.options.map((_,i)=>i),seed);\nfunction opts(q,picks,seed,graded){\n const type=q.kind==='multi'?'checkbox':'radio';\n return (type==='checkbox'?'\u003cp class=\"quiz-instruction\">Selecione '+q.correct.length+' alternativas.\u003c/p>':'')+\n '\u003cdiv class=\"quiz-options\">'+orderFor(q,seed).map((idx,i)=>{\n  const selected=picks?.includes(idx);\n  const tone=graded?(q.correct.includes(idx)?' good':selected?' bad':''):'';\n  return '\u003clabel class=\"choice'+tone+'\">\u003cinput type=\"'+type+'\" name=\"answer\" value=\"'+idx+'\"'+(selected?' checked':'')+(graded?' disabled':'')+'> \u003cspan>\u003cb>'+String.fromCharCode(65+i)+'.\u003c/b> '+esc(q.options[idx])+'\u003c/span>\u003c/label>';\n }).join('')+'\u003c/div>';\n}\nfunction explain(q,picks,seed){\n const ok=isRight(q,picks);\n return '\u003csection class=\"pcard feedback '+(ok?'good':'bad')+'\">\u003ch3>'+(ok?'Resposta correta':picks?.length?'Resposta incorreta':'Sem resposta')+'\u003c/h3>\u003cp>\u003cb>Gabarito\u003c/b> '+q.correct.map(i=>esc(q.options[i])).join(' · ')+'\u003c/p>'+\n '\u003cdetails open>\u003csummary>Raciocínio de cada alternativa\u003c/summary>\u003col type=\"A\">'+orderFor(q,seed).map(i=>'\u003cli>\u003cb>'+esc(q.options[i])+'\u003c/b> '+esc(q.why[i])+'\u003c/li>').join('')+'\u003c/ol>\u003c/details>'+\n Q('skill','Abrir ficha '+q.skill,q.skill)+'\u003c/section>';\n}\nfunction progressPage(){\n main.innerHTML=H('Backup e histórico','Importar ou exportar progresso','Cada arquivo tem estado próprio. O backup inclui notas, questões feitas e tentativas completas ou ativas.')+\n '\u003cdiv class=\"filter-bar\">'+Q('backup','Exportar progresso (JSON)','','pbtn primary')+Q('import','Importar backup')+L('pratica','Rever simulados')+'\u003c/div>'+\n '\u003cinput type=\"file\" id=\"backupFile\" accept=\".json,application/json\" hidden>'+\n '\u003cp>'+Object.keys(state.legacyPractice).length+' respostas de prática v'+LEGACY+' foram arquivadas no histórico do backup. A prática e a prontidão atuais usam o banco v'+VERSION+'.\u003c/p>'+historyList();\n}\nfunction historyList(){\n return '\u003csection class=\"pcard\">\u003ch3>Histórico de simulados\u003c/h3>'+\n (state.attempts.length?state.attempts.slice().reverse().map(a=>{\n  const g=grade(a);\n  return '\u003cp>'+L('resultado/'+a.id,'Simulado '+a.form+' · '+g.right+'/'+g.total+edition(a))+' '+esc(new Date(a.finished).toLocaleString('pt-BR'))+'\u003c/p>';\n }).join(''):'\u003cp>Nenhum simulado entregue.\u003c/p>')+'\u003c/section>';\n}\nfunction practiceHome(){\n main.innerHTML=H('Prática e simulados','Histórico e retomada','A correção do simulado só fica disponível após a entrega ou o fim do tempo.')+\n '\u003cdiv class=\"filter-bar\">'+(state.active?L('simulado','Retomar simulado '+state.active.form+edition(state.active)):Object.keys(data.forms).map(f=>Q('start','Iniciar simulado '+f,f,'pbtn primary')).join(''))+L('pratica/banco','Abrir banco')+L('progresso','Importar backup')+'\u003c/div>'+\n (state.queue.length?'\u003csection class=\"pcard\">\u003ch3>Tentativas importadas\u003c/h3>'+state.queue.map(a=>Q('resume','Retomar '+a.form+edition(a),a.id)).join('')+'\u003c/section>':'')+historyList();\n}\nfunction bank(){\n const opts=m.domains.map(d=>'\u003coption value=\"'+d.id+'\"'+(filter.domain===d.id?' selected':'')+'>'+esc(d.name)+'\u003c/option>').join('');\n main.innerHTML=H('Banco de aprendizagem','Questões comentadas','Filtre por área, requisito ou desempenho.')+\n '\u003cdiv class=\"filter-bar\">\u003cselect class=\"pselect\" id=\"bankArea\" aria-label=\"Área\">\u003coption value=\"0\">Todas as áreas\u003c/option>'+opts+'\u003c/select>\u003cinput class=\"pinput\" type=\"search\" id=\"bankQuery\" aria-label=\"Buscar no banco\" value=\"'+esc(filter.query)+'\" placeholder=\"Buscar conceito ou cenário\">\u003cselect class=\"pselect\" id=\"bankStatus\" aria-label=\"Desempenho\">\u003coption value=\"\">Todas\u003c/option>\u003coption value=\"wrong\"'+(filter.status==='wrong'?' selected':'')+'>Última incorreta\u003c/option>\u003coption value=\"new\"'+(filter.status==='new'?' selected':'')+'>Sem tentativa\u003c/option>\u003c/select>\u003c/div>\u003cdiv id=\"bankRows\">\u003c/div>';\n const draw=()=>{\n  const q=norm(filter.query);\n  const rows=practice.filter(p=>(!filter.domain||p.domain===filter.domain)&&norm(p.stem+' '+skills.get(p.skill).title).includes(q)&&(!filter.status||(filter.status==='wrong'?state.practice[p.id]?.last===false:!state.practice[p.id])));\n  $('bankRows').innerHTML='\u003cp>'+rows.length+' questão(ões)\u003c/p>'+rows.map(p=>'\u003carticle class=\"pcard\" style=\"margin-bottom:8px\">\u003cspan class=\"pbadge\">'+esc(p.skill)+'\u003c/span>\u003ch3>'+esc(p.stem)+'\u003c/h3>'+L('pratica/item/'+p.id,'Abrir questão')+'\u003c/article>').join('');\n };\n $('bankArea').onchange=e=>{filter.domain=Number(e.target.value);draw();};\n $('bankQuery').oninput=e=>{filter.query=e.target.value;draw();};\n $('bankStatus').onchange=e=>{filter.status=e.target.value;draw();};draw();\n}\nfunction session(path){\n if(!draft||draft.path!==path)draft={path,i:0,picks:[],checked:false,seed:rand()};\n const list=path==='pratica/diagnostico'?m.diag:[path.split('/').at(-1)];\n if(!list[draft.i]||!questions.has(list[draft.i])||questions.get(list[draft.i]).form){practiceHome();return;}\n const q=questions.get(list[draft.i]);\n draft.q=q;draft.list=list;\n main.innerHTML=H('Banco de aprendizagem',list.length===1?'Questão comentada':'Diagnóstico inicial',q.skill+' · '+skills.get(q.skill).title)+\n '\u003csection class=\"pcard\">\u003cdiv class=\"filter-bar\">\u003cspan class=\"pbadge\">'+(draft.i+1)+' de '+list.length+'\u003c/span>'+L('pratica/banco','Ver banco')+'\u003c/div>\u003ch3 class=\"stem\">'+esc(q.stem)+'\u003c/h3>'+opts(q,draft.picks,draft.seed,draft.checked)+\n '\u003cdiv class=\"filter-bar\">'+(!draft.checked?Q('check','Corrigir questão','','pbtn primary'):Q('reset','Refazer'))+\n (draft.i>0?Q('drill','Anterior',-1):'')+(draft.i\u003clist.length-1?Q('drill','Próxima',1):'')+'\u003c/div>\u003c/section>'+\n (draft.checked?explain(q,draft.picks,draft.seed):'');\n}\nconst examSeed=(a,i)=>a.seed^Math.imul(i+1,7919);\nfunction exam(){\n const a=state.active;if(!a){practiceHome();return;}if(!tick())return;\n const list=items(a), id=list[a.index], q=examQuestion(a,id),answered=list.filter(i=>validChoice(examQuestion(a,i),a.answers[i],true)).length;\n main.innerHTML=H('Simulado cronometrado','Simulado '+a.form+edition(a),'O tempo continua contando durante pausas e navegação. As respostas são gravadas neste navegador quando disponível.')+\n '\u003csection class=\"pcard\">\u003cdiv class=\"filter-bar\">\u003cspan class=\"pbadge\">'+(a.index+1)+' / '+list.length+'\u003c/span>\u003cstrong class=\"pbadge teal\" id=\"clock\">\u003c/strong>\u003cspan class=\"pbadge\">'+answered+' respondidas\u003c/span>\u003c/div>'+\n '\u003ch3 class=\"stem\">'+esc(q.stem)+'\u003c/h3>'+opts(q,a.answers[id],examSeed(a,a.index),false)+\n '\u003cdiv class=\"filter-bar\">'+(a.index?Q('jump','Anterior',a.index-1):'')+(a.index\u003clist.length-1?Q('jump','Próxima',a.index+1):'')+Q('flag',a.flags[id]?'★ Marcada':'☆ Marcar para revisar')+Q('clear','Limpar resposta')+'\u003c/div>'+\n '\u003cdiv class=\"jump-questions\" aria-label=\"Questões do simulado\">'+list.map((id,i)=>Q('jump',(i+1)+(a.flags[id]?' ★':''),i,i===a.index?'pbtn sm primary':validChoice(examQuestion(a,id),a.answers[id],true)?'pbtn sm answered':'pbtn sm')).join('')+'\u003c/div>'+\n '\u003cdiv class=\"filter-bar\">'+Q('finish','Entregar simulado','','pbtn primary')+L('pratica','Pausar e voltar ao histórico')+'\u003c/div>\u003c/section>';\n tick();\n}\nfunction result(id,pos){\n const a=state.attempts.find(a=>a.id===id);\n if(!a){practiceHome();return;}\n const list=items(a);const index=Number.isInteger(+pos)&&+pos>=0&&+pos\u003clist.length?+pos:0;\n const q=examQuestion(a,list[index]),g=grade(a);\n main.innerHTML=H('Resultado local','Simulado '+a.form+edition(a),g.right+'/'+g.total+' questões pontuadas · '+Math.round(100*g.right/g.total)+'% em acertos brutos.'+(g.pilotTotal?' Experimentais: '+g.pilot+'/'+g.pilotTotal+'.':''))+\n '\u003csection class=\"pcard\">\u003ch3>Desempenho por área\u003c/h3>\u003cdiv class=\"ptable-wrap\">\u003ctable class=\"ptable\">\u003cthead>\u003ctr>\u003cth>Área\u003c/th>\u003cth>Acertos\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n  g.domains.map(d=>'\u003ctr>\u003ctd>'+esc(m.domains[d.id-1].name)+'\u003c/td>\u003ctd>'+d.right+'/'+d.total+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>'+\n '\u003cdiv class=\"filter-bar\">\u003clabel for=\"resultPicker\">Revisar questão\u003c/label>\u003cselect class=\"pselect\" id=\"resultPicker\">'+list.map((id,i)=>'\u003coption value=\"'+i+'\"'+(i===index?' selected':'')+'>'+(i+1)+' · '+(isRight(examQuestion(a,id),a.answers[id])?'Correta':a.answers[id]?.length?'Incorreta':'Em branco')+'\u003c/option>').join('')+'\u003c/select>'+L('pratica','Voltar aos simulados')+'\u003c/div>'+\n '\u003csection class=\"pcard\">\u003cspan class=\"pbadge\">'+(q.scored?'Item pontuado':'Item experimental')+'\u003c/span>\u003ch3 class=\"stem\">'+esc(q.stem)+'\u003c/h3>'+opts(q,a.answers[q.id],examSeed(a,index),true)+'\u003c/section>'+explain(q,a.answers[q.id],examSeed(a,index));\n $('resultPicker').onchange=e=>go('resultado/'+a.id+'/'+e.target.value);\n}\nfunction note(id){\n const s=skills.get(id);if(!s){practiceHome();return;}\n main.innerHTML=H('Anotações pessoais',s.code+' · '+s.title,'As notas são incluídas quando você exporta o progresso.')+\n '\u003csection class=\"pcard\">\u003clabel for=\"skillNote\">Minhas notas\u003c/label>\u003ctextarea id=\"skillNote\" class=\"pinput\" rows=\"8\" maxlength=\"16000\">'+esc(state.notes[id])+'\u003c/textarea>\u003cdiv class=\"filter-bar\">'+Q('skill','Voltar à ficha',id)+'\u003c/div>\u003c/section>';\n $('skillNote').oninput=e=>{state.notes[id]=e.target.value;save();};\n}\nfunction backup(){\n const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});\n const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=m.badge+'_progresso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);\n}\nasync function importFile(file){\n if(!file)return;\n try{\n  const incoming=validated(JSON.parse(await file.text()));\n  confirmAction('Combinar este backup com o progresso atual?',()=>{\n   const before=state;\n   function mergeRecords(current,imported){\n    const records={...imported};\n    for(const [id,x] of Object.entries(current))if(!records[id]||x.updated>=records[id].updated)records[id]=x;\n    return records;\n   }\n   state=validated({...before,practice:mergeRecords(before.practice,incoming.practice),\n    legacyPractice:mergeRecords(before.legacyPractice,incoming.legacyPractice),marked:{...incoming.marked,...before.marked},cases:{...incoming.cases,...before.cases},notes:{...incoming.notes,...before.notes},attempts:[...incoming.attempts,...before.attempts],active:before.active??incoming.active,queue:[...before.queue,incoming.active,...incoming.queue]});\n   saveAndReport();render();announce('Progresso importado.');\n  });\n }catch{announce('O arquivo não é um backup válido deste portal.');}\n}\nfunction confirmAction(text,fn){pendingAction=fn;$('confirmText').textContent=text;$('confirmDialog').showModal();}\n$('confirmOk').onclick=()=>{const fn=pendingAction;pendingAction=null;$('confirmDialog').close();fn?.();};\n$('confirmCancel').onclick=()=>{pendingAction=null;$('confirmDialog').close();};\nfunction render(){\n const path=currentPath();\n announce('');\n if(!path.startsWith('pratica/item/')&&path!=='pratica/diagnostico')draft=null;\n if(path==='simulado')exam();\n else if(path.startsWith('resultado/'))result(...path.split('/').slice(1));\n else if(path==='progresso')progressPage();\n else if(path==='pratica/banco')bank();\n else if(path==='pratica/diagnostico'||path.startsWith('pratica/item/'))session(path);\n else if(path.startsWith('ficha/'))note(path.split('/')[1]);\n else practiceHome();\n}\nmain.addEventListener('click',e=>{\n const b=e.target.closest('button[data-action]');if(!b)return;\n const action=b.dataset.action,v=b.dataset.value;\n const a=state.active;\n if(action==='start'){start(v);return;}\n if(action==='resume'){\n  if(state.active){announce('Entregue a tentativa ativa primeiro.');return;}\n  const found=state.queue.find(a=>a.id===v);if(found){state.queue=state.queue.filter(a=>a.id!==v);state.active=found;saveAndReport();go('simulado');}return;\n }\n if(action==='skill'){\n  const s=skills.get(v);if(s)parent.portalNavigate('d'+s.domain,'skill',s.id);return;\n }\n if(action==='check'&&draft){\n  if(!validChoice(draft.q,draft.picks,true)){announce('Selecione o número de alternativas solicitado.');return;}\n  const q=draft.q,ok=isRight(q,draft.picks);\n  state.practice[q.id]={first:state.practice[q.id]?.first??ok,last:ok,choice:draft.picks.slice(),updated:Date.now()};\n  draft.checked=true;saveAndReport();render();return;\n }\n if((action==='drill'||action==='reset')&&draft){\n  if(action==='drill')draft.i+=Number(v);\n  draft.checked=false;draft.picks=[];draft.seed=rand();render();return;\n }\n if(action==='backup'){backup();return;}\n if(action==='import'){$('backupFile')?.click();return;}\n if(a&&tick()&&currentPath()==='simulado'){\n  const list=items(a), id=list[a.index];\n  if(action==='jump'&&Number.isInteger(+v)&&+v>=0&&+v\u003clist.length)a.index=+v;\n  else if(action==='clear')delete a.answers[id];\n  else if(action==='flag')a.flags[id]=!a.flags[id];\n  else if(action==='fi
