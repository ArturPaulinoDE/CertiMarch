xplanation":"Move objetos elegíveis entre camadas conforme padrões de acesso, com regras próprias de monitoramento.","options":[["S3 Standard-IA","É uma classe específica com taxa de recuperação, sem alternar automaticamente com o acesso."],["S3 One Zone-IA","Guarda em uma única AZ e não realiza ajuste automático de camada."],["S3 Intelligent-Tiering","Move objetos elegíveis entre camadas conforme padrões de acesso, com regras próprias de monitoramento."],["S3 Glacier Deep Archive","Prioriza arquivamento e exige restauração para leitura."]]},{"id":"P-3.6.2-2","prompt":"Documentos regulatórios devem ficar disponíveis para restauração eventual por muitos anos. O acesso é raro, o custo de armazenamento pesa mais e a equipe aceita aguardar até 48 horas. Qual classe escolher?","solution":"S3 Glacier Deep Archive","explanation":"Foi projetada para retenção longa com restauração em horas, adequada ao prazo aceito.","options":[["S3 One Zone-IA","Tem resiliência zonal inferior e acesso imediato, sem oferecer o perfil de custo de arquivamento profundo."],["S3 Glacier Instant Retrieval","Entrega acesso direto em milissegundos, que não é necessário neste cenário de menor custo de guarda."],["S3 Glacier Deep Archive","Foi projetada para retenção longa com restauração em horas, adequada ao prazo aceito."],["S3 Standard","Prioriza acesso frequente e imediato, sem aproveitar o perfil de arquivo."]]}],"cue":"O padrão de acesso é imprevisível e a empresa quer ajuste automático por atividade observada. Qual classe?","answer":"S3 Intelligent-Tiering","use":"Atende ao requisito. Para dados cujo acesso é desconhecido ou muda ao longo do tempo.","avoid":"Preço de armazenamento por GB isolado não considera acesso, recuperação, solicitações ou duração mínima.","example":"Monte uma matriz para dados quentes, frios, imprevisíveis e arquivados por anos.","detail":[],"legacy":"ficha/3.6.2","params":[["S3 Standard","Para dados acessados com frequência com baixa latência.","A aplicação serve objetos muito acessados e precisa de baixa latência na rotina. Qual classe?"],["S3 Standard-IA","Para dados pouco acessados que ainda exigem recuperação imediata.","As leituras são pouco frequentes, mas qualquer objeto deve ficar prontamente acessível quando necessário. Qual classe?"],["S3 Intelligent-Tiering","Para dados cujo acesso é desconhecido ou muda ao longo do tempo.","O padrão de acesso é imprevisível e a empresa quer ajuste automático por atividade observada. Qual classe?"],["S3 Glacier Deep Archive","Para retenção longa com acesso raro e restauração tolerante a espera.","Registros regulatórios passam anos sem leitura e a restauração pode levar horas. Qual classe?"]],"notes":null},{"code":"3.7.1","id":"3.7.1","domain":3,"task":"3.7","title":"Analytics: Athena, Glue, Redshift e visualização","concept":"Athena consulta dados por SQL sem administrar servidores, frequentemente em S3. AWS Glue oferece integração, catálogo e ETL conforme componente. Redshift fornece um data warehouse para análises. A camada de BI apresenta dados ao usuário em análises e painéis.","control":"Identifique se a etapa consulta o lake, transforma e cataloga, serve consultas num warehouse ou apresenta a informação. Considere recorrência, fontes, custo por consulta e padrões de acesso.","pitfall":"Visualização e transformação distribuída respondem a etapas diferentes da mesma arquitetura.","verify":"Siga um relatório desde arquivos brutos até tratamento, execução de consulta e apresentação.","decisions":[["Amazon Athena","Executa SQL serverless sobre dados no lake e fontes compatíveis."],["AWS Glue","Fornece mecanismos de integração, ETL e catálogo."],["Amazon Redshift","Fornece data warehouse para análises de grande escala."],["Camada de BI, como Amazon QuickSight","Apresenta dashboards e análises a consumidores."]],"docs":[["Serviços de análise AWS","https://aws.amazon.com/pt/big-data/datalakes-and-analytics/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.7.1-1","prompt":"Analistas precisam investigar esporadicamente dados Parquet já no S3. Querem rodar SQL diretamente no armazenamento sem manter um warehouse. Qual ferramenta atende?","solution":"Amazon Athena","explanation":"Executa SQL sobre dados no S3 sem provisionar capacidade de warehouse para o cenário.","options":[["Amazon Redshift provisionado","Mantém capacidade de warehouse, que a equipe quer evitar."],["Amazon Athena","Executa SQL sobre dados no S3 sem provisionar capacidade de warehouse para o cenário."],["Amazon EMR em EC2","Exigiria configurar capacidade para o motor de processamento escolhido."],["Amazon QuickSight sozinho","Cria visualizações e usa fontes de dados, sem substituir o mecanismo de consulta ad hoc pedido."]]},{"id":"P-3.7.1-2","prompt":"Arquivos de novas fontes precisam ser catalogados e transformados em uma etapa ETL gerenciada. A equipe quer crawler e execução do job no mesmo serviço. Qual usar?","solution":"AWS Glue","explanation":"Oferece crawlers, Data Catalog e jobs de integração de dados.","options":[["Amazon Athena","Consulta dados catalogados por SQL, sem oferecer o crawler solicitado."],["Amazon OpenSearch Service","Indexa e pesquisa documentos, fora do fluxo geral de ETL e catalogação."],["AWS Database Migration Service","Orienta-se à migração de bancos e não oferece o crawler e job de transformação pedidos."],["AWS Glue","Oferece crawlers, Data Catalog e jobs de integração de dados."]]}],"cue":"Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse. Qual ferramenta?","answer":"Amazon Athena","use":"Atende ao requisito. Executa SQL serverless sobre dados no lake e fontes compatíveis.","avoid":"Visualização e transformação distribuída respondem a etapas diferentes da mesma arquitetura.","example":"Siga um relatório desde arquivos brutos até tratamento, execução de consulta e apresentação.","detail":[],"legacy":"ficha/3.7.1","params":[["Amazon Athena","Executa SQL serverless sobre dados no lake e fontes compatíveis.","Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse. Qual ferramenta?"],["AWS Glue","Fornece mecanismos de integração, ETL e catálogo.","A etapa precisa descobrir metadados e executar integração gerenciada. Qual serviço?"],["Amazon Redshift","Fornece data warehouse para análises de grande escala.","O requisito é operar um warehouse analítico para grandes conjuntos estruturados e relatórios frequentes. Qual?"],["Camada de BI, como Amazon QuickSight","Apresenta dashboards e análises a consumidores.","O dado já está consultável e o requisito é disponibilizar gráficos interativos aos gestores. Qual camada?"]],"notes":null},{"code":"3.7.2","id":"3.7.2","domain":3,"task":"3.7","title":"IA gerenciada e escolha pelo tipo de tarefa","concept":"Comprehend extrai sinais de textos com NLP. Textract extrai texto e estrutura de documentos. Rekognition analisa imagens e vídeo em tarefas suportadas. SageMaker AI atende desenvolvimento e uso de modelos de ML com mais controle. Bedrock oferece acesso e ferramentas de modelos de base gerenciados.","control":"Associe o dado de entrada e o resultado esperado. Quando uma API pré-construída atende ao requisito, ela reduz trabalho de treinamento. Quando o objetivo é GenAI, avalie modelos de base e limitações do contexto.","pitfall":"Uma API de visão não substitui automaticamente a extração estruturada de formulários.","verify":"Diferencie uma imagem de objeto, um formulário escaneado e um texto que precisa de classificação.","decisions":[["Amazon Textract","Extrai texto e estruturas como tabelas e campos de documentos suportados."],["Amazon Rekognition","Analisa imagens ou vídeo em tarefas de reconhecimento compatíveis."],["Amazon Comprehend","Aplica análise de linguagem natural a textos."],["Amazon Bedrock","Oferece modelos de base gerenciados e recursos para aplicações generativas."]],"docs":[["Inteligência artificial AWS","https://aws.amazon.com/pt/ai/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.7.2-1","prompt":"Uma seguradora recebe formulários escaneados. Precisa extrair o pareamento entre o rótulo da pergunta e o valor preenchido, com pouca operação. Qual serviço avaliar?","solution":"Amazon Textract","explanation":"Pode extrair pares chave-valor de formulários a partir de documentos digitalizados.","options":[["Amazon Rekognition DetectText","Reconhece texto em imagens, sem oferecer a extração estruturada de pares de formulários pedida."],["Amazon Textract","Pode extrair pares chave-valor de formulários a partir de documentos digitalizados."],["Amazon Polly","Sintetiza fala a partir do texto."],["Amazon Translate","Traduz textos já disponíveis, sem interpretar os campos do documento."]]},{"id":"P-3.7.2-2","prompt":"Um catálogo visual precisa identificar objetos comuns em fotografias, como bicicletas e cães. A empresa prefere uma API pré-treinada. Qual serviço usar?","solution":"Amazon Rekognition","explanation":"O reconhecimento de rótulos detecta objetos e conceitos visuais em fotografias.","options":[["Amazon Textract","É direcionado à extração de informações de documentos."],["Amazon Rekognition","O reconhecimento de rótulos detecta objetos e conceitos visuais em fotografias."],["Amazon Comprehend","Aplica análise a texto, fora da entrada de imagem descrita."],["Amazon Transcribe","Processa áudio para produzir texto."]]}],"cue":"A empresa quer extrair valores dos campos em formulários escaneados. Qual serviço?","answer":"Amazon Textract","use":"Atende ao requisito. Extrai texto e estruturas como tabelas e campos de documentos suportados.","avoid":"Uma API de visão não substitui automaticamente a extração estruturada de formulários.","example":"Diferencie uma imagem de objeto, um formulário escaneado e um texto que precisa de classificação.","detail":[],"legacy":"ficha/3.7.2","params":[["Amazon Textract","Extrai texto e estruturas como tabelas e campos de documentos suportados.","A empresa quer extrair valores dos campos em formulários escaneados. Qual serviço?"],["Amazon Rekognition","Analisa imagens ou vídeo em tarefas de reconhecimento compatíveis.","O problema é classificar objetos em fotografias, sem OCR de formulários. Qual serviço?"],["Amazon Comprehend","Aplica análise de linguagem natural a textos.","Uma equipe quer identificar sentimento em comentários textuais, sem treinar um modelo. Qual?"],["Amazon Bedrock","Oferece modelos de base gerenciados e recursos para aplicações generativas.","O requisito é gerar resumos com modelos de base por API gerenciada. Qual serviço?"]],"notes":null},{"code":"3.8.1","id":"3.8.1","domain":3,"task":"3.8","title":"Serviços de integração: filas, tópicos, eventos e workflows","concept":"SQS fornece filas; SNS distribui mensagens a assinantes; EventBridge roteia eventos segundo regras; Step Functions orquestra etapas e estados. O contrato de entrega define qual componente é central.","control":"Se o problema é orquestração, verifique sequência, estado, erros e retry. Se é integração, verifique se precisa buffer, fan-out ou seleção por conteúdo.","pitfall":"Uma fila pode armazenar trabalho pendente e ainda não representar a lógica do workflow.","verify":"Compare o papel dos quatro serviços no mesmo processo de pedido e envio.","decisions":[["Amazon SQS","Fila para manter trabalho até consumo."],["Amazon SNS","Tópico para distribuição a múltiplos assinantes."],["Amazon EventBridge","Roteamento de eventos por regras, com destinos integrados."],["AWS Step Functions","Orquestração de etapas com estado e ramificações."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-3.8.1-1","prompt":"Um pedido precisa validar dados, cobrar e inserir o registro em ordem. Se a validação falhar, deve seguir para uma etapa alternativa, com histórico da execução. Qual serviço modela isso?","solution":"AWS Step Functions","explanation":"Uma máquina de estados descreve sequência, decisões e tratamento de erros entre tarefas.","options":[["Amazon EventBridge","Roteia eventos, sem manter sozinho o estado do fluxo por pedido."],["Amazon SNS","Publica notificações, sem definir a ordem e o estado das etapas dependentes."],["AWS Step Functions","Uma máquina de estados descreve sequência, decisões e tratamento de erros entre tarefas."],["Amazon SQS","Armazena mensagens temporariamente, sem modelar decisões do workflow."]]},{"id":"P-3.8.1-2","prompt":"Vários aplicativos publicam eventos. Só os eventos cujo campo de negócio atende a uma regra devem ser enviados a determinados destinos. Qual serviço usar como barramento?","solution":"Amazon EventBridge","explanation":"Regras de barramento filtram o envelope do evento e o enviam aos destinos definidos.","options":[["Amazon EventBridge","Regras de barramento filtram o envelope do evento e o enviam aos destinos definidos."],["AWS Step Functions","Orquestra etapas de uma execução, sem ser o barramento compartilhado necessário."],["Amazon CloudWatch Logs","Coleta e pesquisa logs; regras de barramento são a capacidade procurada."],["AWS CloudTrail","Registra atividade para auditoria e não é o roteador geral de eventos de negócio solicitado."]]}],"cue":"Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação. Qual serviço?","answer":"AWS Step Functions","use":"Atende ao requisito. Orquestração de etapas com estado e ramificações.","avoid":"Uma fila pode armazenar trabalho pendente e ainda não representar a lógica do workflow.","example":"Compare o papel dos quatro serviços no mesmo processo de pedido e envio.","detail":[],"legacy":"ficha/3.8.1","params":[["Amazon SQS","Fila para manter trabalho até consumo.","Uma etapa consumidora deve processar mensagens mais tarde e em seu próprio ritmo. Qual serviço?"],["Amazon SNS","Tópico para distribuição a múltiplos assinantes.","A mesma mensagem deve ser publicada para múltiplos assinantes com uma publicação. Qual serviço?"],["Amazon EventBridge","Roteamento de eventos por regras, com destinos integrados.","O requisito é encaminhar eventos de várias fontes conforme seus campos. Qual serviço?"],["AWS Step Functions","Orquestração de etapas com estado e ramificações.","Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação. Qual serviço?"]],"notes":null},{"code":"3.8.2","id":"3.8.2","domain":3,"task":"3.8","title":"Ferramentas operacionais e serviços por função","concept":"AWS Systems Manager reúne capacidades de operação, como gerenciamento de recursos configurados e execução remota de tarefas suportadas. AWS Health informa eventos que afetam serviços ou recursos da conta. AWS Trusted Advisor recomenda melhorias conforme verificações disponíveis. AWS Backup centraliza políticas de backup para recursos elegíveis.","control":"Diferencie executar a ação, obter visibilidade de evento, revisar recomendações e centralizar backups. Confirme configuração dos recursos, permissões da conta e elegibilidade para cada integração.","pitfall":"Uma recomendação do Trusted Advisor não executa por si só a correção.","verify":"Decida qual ação segue cada evidência: evento na conta, recomendação de custo, tarefa em frota e retenção de backup.","decisions":[["AWS Systems Manager","Fornece recursos de operação de frotas e execução de ações suportadas."],["AWS Health","Mostra eventos de serviço ou de recursos relevantes para a conta."],["AWS Trusted Advisor","Oferece recomendações por verificações suportadas."],["AWS Backup","Orquestra políticas e gestão central de cópias de recursos elegíveis."]],"docs":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Health","https://docs.aws.amazon.com/pt_br/health/latest/ug/what-is-aws-health.html"],["AWS Trusted Advisor","https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/"]],"scenarios":[{"id":"P-3.8.2-1","prompt":"A equipe quer executar um comando de inventário em dezenas de instâncias já registradas como nós gerenciados. Quer revisar o resultado centralmente. Qual ferramenta usar?","solution":"AWS Systems Manager Run Command","explanation":"Executa comandos em nós gerenciados e mostra status e saídas conforme a configuração.","options":[["AWS Resource Groups Tag Editor","Facilita encontrar e marcar recursos, sem executar o comando."],["AWS CloudTrail Lake","Consulta registros de atividade da conta, sem executar comandos no sistema operacional."],["AWS Systems Manager Run Command","Executa comandos em nós gerenciados e mostra status e saídas conforme a configuração."],["AWS Health Dashboard","Mostra impactos de eventos da AWS, sem operar a frota da empresa."]]},{"id":"P-3.8.2-2","prompt":"A empresa quer aplicar políticas de retenção a volumes e bancos suportados, com visibilidade de trabalhos de backup em um serviço central. Qual escolher?","solution":"AWS Backup","explanation":"Organiza planos, agendas, retenção e backups em serviços suportados.","options":[["Amazon Inspector","Analisa vulnerabilidades em recursos suportados, sem gerenciar backups."],["Amazon S3 Replication","Replica objetos em buckets e não substitui um plano central para bancos e volumes."],["AWS Config","Avalia configuração e conformidade, sem criar os pontos de recuperação pedidos."],["AWS Backup","Organiza planos, agendas, retenção e backups em serviços suportados."]]}],"cue":"O operador precisa executar uma tarefa em uma frota configurada e gerenciada. Qual serviço?","answer":"AWS Systems Manager","use":"Atende ao requisito. Fornece recursos de operação de frotas e execução de ações suportadas.","avoid":"Uma recomendação do Trusted Advisor não executa por si só a correção.","example":"Decida qual ação segue cada evidência: evento na conta, recomendação de custo, tarefa em frota e retenção de backup.","detail":[],"legacy":"ficha/3.8.2","params":[["AWS Systems Manager","Fornece recursos de operação de frotas e execução de ações suportadas.","O operador precisa executar uma tarefa em uma frota configurada e gerenciada. Qual serviço?"],["AWS Health","Mostra eventos de serviço ou de recursos relevantes para a conta.","A equipe quer saber quais recursos da conta são afetados por uma manutenção anunciada pela AWS. Qual serviço?"],["AWS Trusted Advisor","Oferece recomendações por verificações suportadas.","A empresa quer recomendações sobre oportunidades de custo e sobre verificações suportadas de boas práticas. Qual ferramenta?"],["AWS Backup","Orquestra políticas e gestão central de cópias de recursos elegíveis.","Uma organização precisa centralizar planos de backup e retenção para serviços suportados. Qual?"]],"notes":null},{"code":"3.8.3","id":"3.8.3","domain":3,"task":"3.8","title":"Ferramentas de desenvolvimento e entrega contínua","concept":"CodeBuild compila e testa código em ambiente gerenciado. CodePipeline orquestra estágios da entrega. CodeDeploy automatiza implantação de aplicações em alvos compatíveis. CloudFormation define e opera stacks de infraestrutura declarativa.","control":"Diferencie ação de build, grafo da entrega, rollout da aplicação e definição de recursos. Um pipeline pode chamar outros serviços em vez de implementar cada etapa.","pitfall":"CodePipeline organiza etapas, mas um estágio de build precisa de um executor de build ou integração compatível.","verify":"Desenhe commit, testes, aprovação, infraestrutura e deploy como ações separadas.","decisions":[["AWS CodeBuild","Executa atividades de build e teste."],["AWS CodePipeline","Orquestra fluxo de entrega com estágios e ações."],["AWS CodeDeploy","Automatiza implantação de aplicação em alvos suportados."],["AWS CloudFormation","Provê e atualiza recursos a partir de templates declarativos."]],"docs":[["Ferramentas para desenvolvedores","https://aws.amazon.com/pt/products/developer-tools/"],["AWS CloudFormation","https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.8.3-1","prompt":"O pipeline já sabe quando um commit chega. Falta um ambiente gerenciado para baixar dependências, compilar e executar testes unitários. Qual serviço executa essa fase?","solution":"AWS CodeBuild","explanation":"Executa comandos de build e testes em um ambiente gerenciado por projeto.","options":[["AWS CodeBuild","Executa comandos de build e testes em um ambiente gerenciado por projeto."],["AWS CodeDeploy","Implanta revisões já produzidas em destinos suportados."],["AWS CodePipeline","Coordena estágios e pode invocar o CodeBuild, sem fornecer o ambiente de compilação por si."],["Amazon ECR","Armazena imagens, sem executar os testes solicitados."]]},{"id":"P-3.8.3-2","prompt":"Uma equipe quer visualizar uma sequência de entrega com origem, build, aprovação manual e implantação. Já possui ferramentas para executar as etapas. Qual serviço coordena a sequência?","solution":"AWS CodePipeline","explanation":"Modela estágios e ações que chamam os serviços ou integrações responsáveis pelas etapas.","options":[["Amazon CloudWatch Synthetics","Monitora jornadas por meio de canaries, sem coordenar a entrega."],["AWS CodeBuild","Executa a etapa de build, sem gerenciar sozinho a aprovação e implantação em sequência."],["AWS CodePipeline","Modela estágios e ações que chamam os serviços ou integrações responsáveis pelas etapas."],["AWS CodeDeploy","Automatiza a implantação, sem comandar a entrega inteira descrita."]]}],"cue":"Um commit precisa disparar compilação e teste em ambiente gerenciado. Qual serviço executa essa etapa?","answer":"AWS CodeBuild","use":"Atende ao requisito. Executa atividades de build e teste.","avoid":"CodePipeline organiza etapas, mas um estágio de build precisa de um executor de build ou integração compatível.","example":"Desenhe commit, testes, aprovação, infraestrutura e deploy como ações separadas.","detail":[],"legacy":"ficha/3.8.3","params":[["AWS CodeBuild","Executa atividades de build e teste.","Um commit precisa disparar compilação e teste em ambiente gerenciado. Qual serviço executa essa etapa?"],["AWS CodePipeline","Orquestra fluxo de entrega com estágios e ações.","Uma entrega precisa coordenar build, aprovação e implantação. Que serviço organiza o fluxo?"],["AWS CodeDeploy","Automatiza implantação de aplicação em alvos suportados.","O pacote já foi produzido. É necessário automatizar rollout em instâncias compatíveis. Qual serviço?"],["AWS CloudFormation","Provê e atualiza recursos a partir de templates declarativos.","É preciso revisar os recursos de rede e compute declarados em uma stack. Qual serviço?"]],"notes":null},{"code":"3.8.4","id":"3.8.4","domain":3,"task":"3.8","title":"Frontend, dispositivos, desktops e acesso a aplicações","concept":"IoT Core conecta dispositivos e mensageria de IoT. Amplify oferece ferramentas e hospedagem para aplicações web e mobile compatíveis. Amazon WorkSpaces fornece desktops virtuais ou ofertas de computação de usuário conforme produto. AppStream 2.0, também apresentado na família WorkSpaces Applications, entrega aplicações por streaming em cenários compatíveis.","control":"Identifique o tipo de cliente: equipamento conectado, navegador frontend, desktop gerenciado ou aplicativo individual transmitido. O serviço escolhido precisa oferecer o acesso apropriado à identidade do consumidor.","pitfall":"Streaming de aplicação para usuário não equivale a envio de eventos de telemetria de dispositivos.","verify":"Classifique quatro demandas por fonte, unidade entregue e experiência final.","decisions":[["AWS IoT Core","Conecta dispositivos e mensagens IoT em um serviço gerenciado."],["AWS Amplify","Apoia desenvolvimento e publicação de aplicações frontend."],["Amazon WorkSpaces","Entrega um ambiente de trabalho virtual nas ofertas compatíveis."],["Amazon WorkSpaces Applications (AppStream 2.0)","Entrega aplicações por streaming ao usuário."]],"docs":[["Amazon WorkSpaces — desktops virtuais","https://aws.amazon.com/pt/workspaces/"],["AWS IoT Core","https://aws.amazon.com/pt/iot-core/"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.8.4-1","prompt":"Sensores em lojas precisam autenticar individualmente e publicar telemetria por MQTT em um serviço gerenciado. Qual oferta fornece a integração de dispositivos?","solution":"AWS IoT Core","explanation":"Suporta comunicação MQTT autenticada e regras de encaminhamento para dispositivos.","options":[["Amazon CloudFront","Entrega conteúdo em borda e não atua como broker MQTT."],["Amazon WorkSpaces","Entrega desktops virtuais, fora do padrão de telemetria."],["AWS Amplify Hosting","Implanta frontends web, sem ser o broker de dispositivos pedido."],["AWS IoT Core","Suporta comunicação MQTT autenticada e regras de encaminhamento para dispositivos."]]},{"id":"P-3.8.4-2","prompt":"Uma equipe quer publicar um site front-end a partir do Git, com previews e integração ao fluxo de build sem operar servidores web. Qual produto avaliar?","solution":"AWS Amplify Hosting","explanation":"Oferece hospedagem e entrega contínua para aplicações web com integração a repositórios.","options":[["AWS Amplify Hosting","Oferece hospedagem e entrega contínua para aplicações web com integração a repositórios."],["Amazon WorkSpaces Applications","Entrega aplicações a usuários, fora da hospedagem web descrita."],["Amazon EC2 sem serviço de deploy","Fornece capacidade, deixando a administração do servidor e a integração de build com a equipe."],["AWS IoT Core","Gerencia comunicação com dispositivos, sem hospedagem de frontend conectada ao Git."]]}],"cue":"Sensores precisam autenticar e publicar mensagens IoT. Qual oferta?","answer":"AWS IoT Core","use":"Atende ao requisito. Conecta dispositivos e mensagens IoT em um serviço gerenciado.","avoid":"Streaming de aplicação para usuário não equivale a envio de eventos de telemetria de dispositivos.","example":"Classifique quatro demandas por fonte, unidade entregue e experiência final.","detail":[],"legacy":"ficha/3.8.4","params":[["AWS IoT Core","Conecta dispositivos e mensagens IoT em um serviço gerenciado.","Sensores precisam autenticar e publicar mensagens IoT. Qual oferta?"],["AWS Amplify","Apoia desenvolvimento e publicação de aplicações frontend.","O time precisa publicar o frontend web e integrar sua entrega à rotina de desenvolvimento. Qual família?"],["Amazon WorkSpaces","Entrega um ambiente de trabalho virtual nas ofertas compatíveis.","Funcionários precisam de desktops virtuais completos. Qual produto?"],["Amazon WorkSpaces Applications (AppStream 2.0)","Entrega aplicações por streaming ao usuário.","Usuários precisam executar aplicativos específicos transmitidos sem distribuição local. Qual oferta?"]],"notes":null},{"code":"4.1.1","id":"4.1.1","domain":4,"task":"4.1","title":"On-Demand, Savings Plans, reservas e Spot","concept":"On-Demand atende consumo sem compromisso de longo prazo. Savings Plans oferecem desconto sobre uso elegível mediante compromisso monetário por hora. Reserved Instances trazem desconto e condições associadas ao serviço e escopo. Spot usa capacidade excedente, sujeita à interrupção.","control":"Classifique previsibilidade, tolerância à interrupção, necessidade de flexibilidade e diferença entre desconto e reserva de capacidade. Capacidade On-Demand reservada segue regras e é distinta de um compromisso de preço.","pitfall":"Savings Plans não garantem capacidade física disponível. Spot não atende sozinho requisito de capacidade contínua sem estratégia de interrupção.","verify":"Separe carga previsível, pico eventual, lote tolerante a interrupção e capacidade que precisa estar disponível.","decisions":[["On-Demand","Uso flexível sem compromisso de prazo."],["Savings Plans","Compromisso de gasto por hora para desconto em uso de computação elegível."],["Reserved Instances","Modelo de desconto sujeito às condições de reserva e compatibilidade."],["Spot Instances","Capacidade excedente apropriada a cargas tolerantes a interrupção."]],"docs":[["Preços AWS","https://aws.amazon.com/pt/pricing/"],["Savings Plans","https://aws.amazon.com/pt/savingsplans/"]],"scenarios":[{"id":"P-4.1.1-1","prompt":"Um lote de renderização grava checkpoints e recupera tarefas interrompidas. O prazo tem folga e reduzir o preço da capacidade EC2 é a prioridade. Qual opção de compra usar?","solution":"Instâncias Spot","explanation":"Usam capacidade excedente com desconto e podem ser interrompidas, risco aceito pelo lote.","options":[["Savings Plans","Trocam compromisso de gasto por desconto, compromisso desnecessário para um lote flexível."],["Hosts dedicados","Atendem cenários de isolamento ou licença e não ao uso de capacidade excedente."],["Instâncias sob demanda","Têm flexibilidade de prazo, mas não aproveitam o preço da capacidade Spot."],["Instâncias Spot","Usam capacidade excedente com desconto e podem ser interrompidas, risco aceito pelo lote."]]},{"id":"P-4.1.1-2","prompt":"Uma aplicação ficará em teste por cinco dias e a equipe não aceita interrupções por retomada de capacidade excedente. O uso poderá terminar cedo e não haverá compromisso mensal ou anual. Qual modelo de compra EC2 atende?","solution":"Instâncias sob demanda","explanation":"A empresa paga pelo uso sem compromisso prolongado, fora do modelo de interrupção Spot.","options":[["Instâncias Spot","Podem ser retomadas pela AWS quando faltar capacidade excedente."],["Reserved Instances anuais","Vinculam o benefício a compromisso por um período maior que o evento."],["Compute Savings Plans","Exigem um compromisso de gasto por hora de um ou três anos."],["Instâncias sob demanda","A empresa paga pelo uso sem compromisso prolongado, fora do modelo de interrupção Spot."]]}],"cue":"Um job distribuído retoma processamento e aceita interrupções por economia. Qual opção?","answer":"Spot Instances","use":"Atende ao requisito. Capacidade excedente apropriada a cargas tolerantes a interrupção.","avoid":"Savings Plans não garantem capacidade física disponível. Spot não atende sozinho requisito de capacidade contínua sem estratégia de interrupção.","example":"Separe carga previsível, pico eventual, lote tolerante a interrupção e capacidade que precisa estar disponível.","detail":[],"legacy":"ficha/4.1.1","params":[["On-Demand","Uso flexível sem compromisso de prazo.","Um evento isolado precisa capacidade sem compromisso plurianual. Qual opção de preço?"],["Savings Plans","Compromisso de gasto por hora para desconto em uso de computação elegível.","Existe demanda recorrente. O cliente aceita comprometer gasto por hora para obter desconto de computação elegível. Qual modelo?"],["Reserved Instances","Modelo de desconto sujeito às condições de reserva e compatibilidade.","A equipe quer comparar descontos atrelados às condições de uma reserva de instância. Qual modelo?"],["Spot Instances","Capacidade excedente apropriada a cargas tolerantes a interrupção.","Um job distribuído retoma processamento e aceita interrupções por economia. Qual opção?"]],"notes":null},{"code":"4.1.2","id":"4.1.2","domain":4,"task":"4.1","title":"Estimativas, transferência e custo marginal","concept":"O custo pode envolver tempo, capacidade, solicitações, armazenamento e transferência, dependendo do serviço. AWS Pricing Calculator estima cenários futuros. Cost Explorer analisa uso e custo reportados. Uma decisão de custo considera o preço marginal de serviços e topologia de transferência.","control":"Compare carga estimada, tráfego ingress/egress, acessos entre zonas ou Regiões e custos indiretos. Verifique regras de preços por serviço e Região em vez de presumir que toda transferência tem o mesmo tratamento.","pitfall":"Uma estimativa de arquitetura futura não substitui a análise de uso e custo histórico.","verify":"Calcule quais variáveis mudam se um consumidor passa a ler de outra Região.","decisions":[["AWS Pricing Calculator","Estima custos para serviços e volume planejados."],["AWS Cost Explorer","Analisa custos e uso registrados e permite explorar tendências."],["Modelo de transferência de dados","Considera origem, destino e regras de cobrança do serviço."],["Direcionadores de custo de armazenamento","Consideram volume, classe, requisições, retenção e recuperação."]],"docs":[["AWS Pricing Calculator","https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html"],["Preços AWS","https://aws.amazon.com/pt/pricing/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-4.1.2-1","prompt":"Uma equipe tem apenas um desenho de arquitetura com número previsto de horas EC2, GB de armazenamento e transferência. Quer preparar uma previsão antes do primeiro deploy. Qual ferramenta usar?","solution":"AWS Pricing Calculator","explanation":"Estima tarifas para quantidades e configurações propostas antes de haver uso real.","options":[["AWS Data Exports","Entrega dados de cobrança e uso da conta, fora da estimativa de um cenário ainda hipotético."],["AWS Cost Explorer","Analisa dados de custo e pode projetar a partir do uso observado, indisponível neste desenho novo."],["AWS Pricing Calculator","Estima tarifas para quantidades e configurações propostas antes de haver uso real."],["AWS Budgets","Controla um limite com alertas, sem compor a estimativa inicial de arquitetura pedida."]]},{"id":"P-4.1.2-2","prompt":"Após receber a fatura do trimestre, o financeiro quer isolar o serviço que mais explica o aumento. Precisa filtrar e agrupar custos reais sem desenvolver um pipeline. Qual ferramenta usar?","solution":"AWS Cost Explorer","explanation":"Explora o histórico de custo com filtros, agrupamentos e granularidade de tempo.","options":[["AWS Support Center","Permite abrir um caso, mas não fornece a análise histórica interativa pedida."],["AWS Cost Explorer","Explora o histórico de custo com filtros, agrupamentos e granularidade de tempo."],["AWS Organizations","Agrupa contas e cobrança, sem substituir a interface analítica."],["AWS Pricing Calculator","Estima um cenário, sem investigar a fatura realizada."]]}],"cue":"Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume. Qual ferramenta?","answer":"AWS Pricing Calculator","use":"Atende ao requisito. Estima custos para serviços e volume planejados.","avoid":"Uma estimativa de arquitetura futura não substitui a análise de uso e custo histórico.","example":"Calcule quais variáveis mudam se um consumidor passa a ler de outra Região.","detail":[],"legacy":"ficha/4.1.2","params":[["AWS Pricing Calculator","Estima custos para serviços e volume planejados.","Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume. Qual ferramenta?"],["AWS Cost Explorer","Analisa custos e uso registrados e permite explorar tendências.","A equipe quer descobrir qual serviço gerou o aumento de gastos no trimestre passado. Qual ferramenta?"],["Modelo de transferência de dados","Considera origem, destino e regras de cobrança do serviço.","Uma aplicação replica dados para outra Região. Qual dimensão adicional investigar na estimativa?"],["Direcionadores de custo de armazenamento","Consideram volume, classe, requisições, retenção e recuperação.","A empresa compara duas classes S3 com longa retenção e tarifas diferentes de recuperação. Que dimensão predomina?"]],"notes":null},{"code":"4.2.1","id":"4.2.1","domain":4,"task":"4.2","title":"Cost Explorer, Budgets, Data Exports e anomalias","concept":"Cost Explorer analisa tendências de custos e uso. Budgets oferece acompanhamento de limites e alertas conforme configuração. Data Exports permite entregar dados detalhados de cobrança para análise. Cost Anomaly Detection identifica padrões incomuns de gasto em monitores configurados.","control":"Escolha pela pergunta: investigar histórico, vigiar limite acordado, alimentar modelo analítico ou encontrar desvio inesperado. Considere atraso de processamento da cobrança na interpretação de alertas.","pitfall":"Configurar um orçamento com alerta não impõe um teto rígido universal para a fatura.","verify":"Dado um aumento de custo, diga qual ferramenta detecta, qual investiga e qual fornece os dados que sustentam a análise externa.","decisions":[["AWS Cost Explorer","Analisa consumo histórico, agrupamentos e tendências."],["AWS Budgets","Acompanha valores e limites planejados, com notificações configuráveis."],["AWS Data Exports","Entrega conjuntos detalhados de dados de custo e uso."],["AWS Cost Anomaly Detection","Identifica gastos anormais em relação ao comportamento esperado."]],"docs":[["Análise com Cost Explorer","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html"],["AWS Budgets","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/budgets-managing-costs.html"],["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-4.2.1-1","prompt":"O teto mensal de um projeto é de US$ 8.000. O financeiro quer receber um aviso quando a previsão de custo superar o teto para atuar antes do fechamento. Qual ferramenta configurar?","solution":"AWS Budgets","explanation":"Envia notificações configuradas para limites de custo realizado ou previsto.","options":[["AWS Budgets","Envia notificações configuradas para limites de custo realizado ou previsto."],["AWS Pricing Calculator","Modela custos hipotéticos, sem produzir o alerta da conta solicitado."],["AWS Cost Categories","Organiza custos para análise, sem monitorar o teto por si."],["AWS Cost Anomaly Detection","Usa padrões de gasto para detectar anomalias, sem usar esse teto fixo como condição principal."]]},{"id":"P-4.2.1-2","prompt":"O time de FinOps precisa ingerir registros detalhados de custo e uso no próprio ambiente analítico. O destino deve receber arquivos consultáveis continuamente. Qual recurso usar?","solution":"AWS Data Exports com CUR 2.0","explanation":"Exporta dados detalhados de cobrança e uso para um bucket S3.","options":[["Painel do AWS Cost Explorer","Analisa custos interativamente, sem entregar os arquivos de linhas detalhadas pedidos."],["AWS Billing Alerts no CloudWatch","Oferece uma métrica de cobranças estimadas, sem exportar registros de uso."],["AWS Organizations","Centraliza a organização das contas, mas não gera o export sozinho."],["AWS Data Exports com CUR 2.0","Exporta dados detalhados de cobrança e uso para um bucket S3."]]}],"cue":"O financeiro quer avisar se o custo previsto superar o limite mensal acordado. Qual serviço?","answer":"AWS Budgets","use":"Atende ao requisito. Acompanha valores e limites planejados, com notificações configuráveis.","avoid":"Configurar um orçamento com alerta não impõe um teto rígido universal para a fatura.","example":"Dado um aumento de custo, diga qual ferramenta detecta, qual investiga e qual fornece os dados que sustentam a análise externa.","detail":[],"legacy":"ficha/4.2.1","params":[["AWS Cost Explorer","Analisa consumo histórico, agrupamentos e tendências.","O gestor quer navegar interativamente pelo custo registrado por tag e mês. Qual ferramenta?"],["AWS Budgets","Acompanha valores e limites planejados, com notificações configuráveis.","O financeiro quer avisar se o custo previsto superar o limite mensal acordado. Qual serviço?"],["AWS Data Exports","Entrega conjuntos detalhados de dados de custo e uso.","O time quer alimentar seu próprio data warehouse com registros detalhados de uso. Qual recurso?"],["AWS Cost Anomaly Detection","Identifica gastos anormais em relação ao comportamento esperado.","A intenção é detectar um padrão incomum de gastos sem partir de um valor fixo de orçamento. Qual serviço?"]],"notes":"4.2.1"},{"code":"4.2.2","id":"4.2.2","domain":4,"task":"4.2","title":"Cobrança consolidada, tags e alocação de custos","concept":"Organizations permite cobrança consolidada para contas da organização sob a conta de gerenciamento. Tags de alocação, devidamente ativadas e aplicadas, ajudam a separar despesas por centro de custo. Cost Categories agrupam custos com regras de negócio. Orçamentos monitoram limites e não definem sozinhos a classificação.","control":"Separe pagador, classificação e visibilidade. Uma conta é uma fronteira administrativa, enquanto um centro de custos pode agregar diversas contas. Defina padrões de tags e trate recursos sem classificação.","pitfall":"Cobrança consolidada não funde todas as contas nem elimina o acesso isolado dos times.","verify":"Reconcilie o custo por conta com o custo por produto e identifique a despesa sem dono.","decisions":[["Cobrança consolidada do AWS Organizations","Coordena pagamento e visão agregada para contas da organização."],["Tags de alocação de custos","Associam custos elegíveis a rótulos de negócio quando ativadas."],["AWS Cost Categories","Agrupa custos com categorias e regras personalizadas."],["AWS Budgets","Monitora gastos ou uso frente a limites planejados."]],"docs":[["AWS Organizations — conceitos","https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html"],["Análise com Cost Explorer","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html"]],"scenarios":[{"id":"P-4.2.2-1","prompt":"Três subsidiárias conservam contas AWS independentes para governança. O financeiro quer um pagador central e uma visão agregada de cobrança. Qual recurso adotar?","solution":"Cobrança consolidada no AWS Organizations","explanation":"Reúne a cobrança das contas da organização na conta de gerenciamento, mantendo as contas-membro distintas.","options":[["AWS Cost Categories","Agrupa custos para análise, sem mudar quem paga."],["AWS IAM Identity Center","Centraliza o acesso à força de trabalho, sem assumir pagamento de contas."],["AWS Control Tower Account Factory","Ajuda a provisionar contas, mas a cobrança central decorre da organização."],["Cobrança consolidada no AWS Organizations","Reúne a cobrança das contas da organização na conta de gerenciamento, mantendo as contas-membro distintas."]]},{"id":"P-4.2.2-2","prompt":"Recursos de dois produtos compartilham as mesmas contas. O FinOps quer usar a chave Produto já marcada em cada recurso elegível para visualizar custos futuros por produto. O que precisa habilitar?","solution":"Tags de alocação de custos","explanation":"Ativa a tag de recurso no faturamento, permitindo atribuição em relatórios aplicáveis.","options":[["Tags de alocação de custos","Ativa a tag de recurso no faturamento, permitindo atribuição em relatórios aplicáveis."],["Tags de sessão do IAM","Contextualizam autorização da sessão, sem substituir as tags de custo dos recursos."],["Grupos de cobrança do Billing Conductor","Organizam contas para visualizações de cobrança, mas não são o recurso que ativa a chave existente."],["Service Control Policies","Limitam permissões nas contas, sem levar as tags de recurso ao faturamento."]]}],"cue":"A empresa quer pagar uma fatura agregada, mantendo contas distintas. Qual recurso?","answer":"Cobrança consolidada do AWS Organizations","use":"Atende ao requisito. Coordena pagamento e visão agregada para contas da organização.","avoid":"Cobrança consolidada não funde todas as contas nem elimina o acesso isolado dos times.","example":"Reconcilie o custo por conta com o custo por produto e identifique a despesa sem dono.","detail":[],"legacy":"ficha/4.2.2","params":[["Cobrança consolidada do AWS Organizations" ":"IA, ML e análise","domain":3,"note":"","root":{"question":"Qual requisito explica a decisão sobre ia, ml e análise?","branches":[{"when":"Analistas querem consultar arquivos Parquet no S3 com SQL, sem provisionar um warehouse.","child":{"id":"3.7.1","answer":"Amazon Athena"}},{"when":"A empresa quer extrair valores dos campos em formulários escaneados.","child":{"id":"3.7.2","answer":"Amazon Textract"}}]}},{"id":"3.8","title":"Outros serviços no escopo","domain":3,"note":"","root":{"question":"Qual requisito explica a decisão sobre outros serviços no escopo?","branches":[{"when":"Um processo precisa de etapas executadas em ordem com caminhos distintos após uma validação.","child":{"id":"3.8.1","answer":"AWS Step Functions"}},{"when":"O operador precisa executar uma tarefa em uma frota configurada e gerenciada.","child":{"id":"3.8.2","answer":"AWS Systems Manager"}},{"when":"Um commit precisa disparar compilação e teste em ambiente gerenciado.","child":{"id":"3.8.3","answer":"AWS CodeBuild"}},{"when":"Sensores precisam autenticar e publicar mensagens IoT.","child":{"id":"3.8.4","answer":"AWS IoT Core"}}]}},{"id":"4.1","title":"Modelos de preços","domain":4,"note":"","root":{"question":"Qual requisito explica a decisão sobre modelos de preços?","branches":[{"when":"Um job distribuído retoma processamento e aceita interrupções por economia.","child":{"id":"4.1.1","answer":"Spot Instances"}},{"when":"Antes do primeiro deploy, a equipe quer estimar a fatura por um cenário de volume.","child":{"id":"4.1.2","answer":"AWS Pricing Calculator"}}]}},{"id":"4.2","title":"Cobrança, orçamento e gestão de custos","domain":4,"note":"","root":{"question":"Qual requisito explica a decisão sobre cobrança, orçamento e gestão de custos?","branches":[{"when":"O financeiro quer avisar se o custo previsto superar o limite mensal acordado.","child":{"id":"4.2.1","answer":"AWS Budgets"}},{"when":"A empresa quer pagar uma fatura agregada, mantendo contas distintas.","child":{"id":"4.2.2"," cote, detecção de ameaça, proteção HTTP e classificação de dado correspondem a serviços diferentes.","fault":"Tratar WAF como scanner de CVE ou Macie como firewall.","verify":"Associe ataque de volume, solicitação web maliciosa e PII a mecanismos distintos.","skills":["2.4.2","2.4.1","2.2.3"],"task":"2.4","domain":2},{"id":"ARCH-06","native":"ARCH-06","title":"Loja com conteúdo global e catálogo por chave","requirement":"Usuários globais leem ativos estáticos e consultam itens do catálogo por identificador.","steps":["Gerenciar DNS com Route 53","Entregar os ativos pelo CloudFront com origem S3","Executar a aplicação em compute compatível","Ler itens por chave em DynamoDB no desenho adequado"],"decision":"CDN acelera entrega na borda. Banco e origem mantêm semântica própria. Use serviço relacional se o requisito mudar para joins e transações relacionais.","fault":"Assumir que o cache da borda replica o banco ou governa o acesso aos dados.","verify":"Descreva diferenças de caminho para imagem estática e leitura por chave.","skills":["3.5.1","3.4.1","3.6.1"],"task":"3.5","domain":3},{"id":"ARCH-07","native":"ARCH-07","title":"Orquestração de processamento de formulários","requirement":"Formulários chegam irregularmente, precisam extração de campos e roteamento de rejeições.","steps":["Guardar original em S3","Absorver fila de trabalho com SQS","Usar Textract para extrair estrutura","Orquestrar validação, sucesso e falha conforme regra"],"decision":"SQS retém trabalho, Textract extrai campos e Step Functions coordena etapas.","fault":"Substituir a fila por um serviço de análise de texto ou guardar saída somente no estado de um workflow.","verify":"Mapeie o caminho quando um consumidor está fora do ar e quando o documento não passa na validação.","skills":["3.8.1","3.7.2","1.2.2"],"task":"3.8","domain":3},{"id":"ARCH-08","native":"ARCH-08","title":"Consulta e relatório de dados do lake","requirement":"O time quer ler arquivos S3 por SQL e apresentar um relatório históri custo por conta e produto, listando o que ficou sem classificação.","skills":["4.2.2","4.2.1","4.1.2"],"task":"4.2","domain":4},{"id":"ARCH-11","native":"ARCH-11","title":"Compra de capacidade e suporte operacional","requirement":"O sistema tem carga previsível, protótipo incerto e lote interrompível. Um incidente precisa do canal certo.","steps":["Medir a base previsível","Avaliar compromisso para uso elegível","Separar compute temporário e lote tolerante a interrupção","Verificar status e abrir caso pelo plano quando necessário"],"decision":"On-Demand para flexibilidade, Spot para lote retomável e compromisso para parte previsível.","fault":"Tratar compromisso de preço como uma reserva automática de capacidade ou confundir resposta inicial com resolução.","verify":"Compare as três cargas por risco, compromisso e atendimento esperado do suporte.","skills":["4.1.1","4.3.1"],"task":"4.1","domain":4}],"labs":[],"papers":[{"id":"t1.1","title":"Valor da nuvem AWS","domain":1,"task":"1.1"},{"id":"t1.2","title":"Princípios de design e Well-Architected","domain":1,"task":"1.2"},{"id":"t1.3","title":"Adoção e migração","domain":1,"task":"1.3"},{"id":"t1.4","title":"Economia da nuvem","domain":1,"task":"1.4"},{"id":"t2.1","title":"Responsabilidade compartilhada","domain":2,"task":"2.1"},{"id":"t2.2","title":"Segurança, governança e conformidade","domain":2,"task":"2.2"},{"id":"t2.3","title":"Identidade e controle de acesso","domain":2,"task":"2.3"},{"id":"t2.4","title":"Serviços e recursos de segurança","domain":2,"task":"2.4"},{"id":"t3.1","title":"Formas de implantação e operação","domain":3,"task":"3.1"},{"id":"t3.2","title":"Infraestrutura global","domain":3,"task":"3.2"},{"id":"t3.3","title":"Computação","domain":3,"task":"3.3"},{"id":"t3.4","title":"Bancos de dados","domain":3,"task":"3.4"},{"id":"t3.5","title":"Redes","domain":3,"task":"3.5"},{"id":"t3.6","title":"Armazenamento","domain":3,"task":"3.6"},{"id":"t3.7","title":"IA, ML e análise","domain":3,"task":"3.7"},{"id":"t3.8","title":"Outros serviços no escopo","domain":3,"task":"3.8"},{"id":"t4.1","title":"Modelos de preços","domain":4,"task":"4.1"},{"id":"t4.2","title":"Cobrança, orçamento e gestão de custos","domain":4,"task":"4.2"},{"id":"t4.3","title":"Recursos técnicos e opções de suporte","domain":4,"task":"4.3"}],"notes":{"1":[{"id":"1.2.1","skill":"1.2.1","title":"Guia de conceitos: valor, falhas e adoção","mechanism":["Identifique o resultado que a organização precisa comprovar. Agilidade reduz o tempo de provisionar e testar, elasticidade acompanha variação, confiabilidade limita interrupções e recuperação repõe serviço e dados. O AWS CAF organiza a jornada, enquanto o Well-Architected analisa workloads segundo seus pilares."],"paths":[["Picos e vales recorrentes","Escalonar por demanda e monitorar capacidade e ociosidade."],["Uma zona pode falhar","Distribuir dentro da Região e exercitar a falha."],["Falha regional ou retenção longa","Separar RTO, RPO e estratégia de cópia e retorno."],["A empresa muda habilidades, processos e estrutura","Avaliar perspectivas do CAF antes de organizar ondas."]],"trace":["Escreva três hipóteses de incidente: instância, zona e Região. Compare alcance, cópias e tempo de retorno. Acrescente efeito no custo operacional e quais processos precisam mudar."],"lab":["Em papel, modele um site sazonal com perda máxima de 30 minutos e retorno em duas horas. Associe cada métrica a uma decisão e explique o que muda sob indisponibilidade regional."],"parameters":[["RTO","Tempo máximo para restaurar serviço.","Compare com a duração medida durante o exercício."],["RPO","Perda de dados aceitável no tempo.","Compare a hora da falha com a versão restaurada."],["Utilização por janela","Indica capacidade ou ociosidade.","Pico e média respondem a perguntas diferentes."]],"trade-off":["Capacidade ociosa, redundância e duplicação regional têm custos distintos e devem ser avaliadas pelo requisito explícito."]}],"2":[{"id":"2.2.2","skill":"2.2.2","title":"Guia de segurança: identidade, evidência e proteção","mechanism":["Identidade responde quem pode agir, rede define caminhos, criptografia protege dados, monitoramento revela eventos e conformidade exige controles e evidências. A divisão de responsabilidade muda pelo serviço. Não atribua sempre à AWS a configuração feita pelo cliente."],"paths":[["Quem alterou uma política?","Use CloudTrail, com cobertura de eventos adequada."],["Recurso descumpre configuração exigida?","Use AWS Config e regras adequadas."],["É preciso detectar um tipo de ameaça ou vulnerabilidade?","Distinga GuardDuty, Inspector e consolidação de achados."],["Usuário humano acessa muitas contas?","Identity Center para acesso humano e Organizations para guardrails."]],"trace":["Para um aplicativo que perde acesso a objetos criptografados, localize principal, autorização do objeto e da chave e registro da tentativa. Explique a camada e responsabilidade de cada item."],"lab":["Modele uma autorização mínima para um aplicativo que lê apenas um bucket. Diga como o time saberia quem alterou o acesso e onde obteria o relatório de conformidade da AWS."],"parameters":[["Política IAM","Expressa permissões de identidade.","SCP limita o universo de permissões; não as concede."],["Tipo de credencial","Define duração e manutenção.","Prefira sessão temporária para workloads e acesso federado quando aplicável."],["Evidência de origem","Separa auditoria do provedor de ações na própria conta.","Artifact fornece relatórios do provedor, CloudTrail registra APIs cobertas."]],"trade-off":["Mais centralização facilita consistência, mas conta, OU, política, role e recurso continuam sendo fronteiras distintas."]}],"3":[{"id":"3.3.1","skill":"3.3.1","title":"Guia de serviços: compute, armazenamento, rede e análise","mechanism":["Comece pelo tipo de execução e pelo contrato de dados. Aplicação de longa duração com host controlado, função orientada a evento e contêiner gerenciado têm modelos distintos. Depois escolha interface do dado — bloco, arquivo, objeto, banco ou cache — e caminho de acesso."],"paths":[["Controle do SO convidado","EC2, com responsabilidade pelo sistema."],["Função curta disparada por evento","Lambda para execução gerenciada dentro de seus limites."],["Contêiner sem gestão de nó","Orquestração compatível com Fargate."],["Arquivos compartilhados por NFS ou leitura de objetos","EFS para arquivo NFS, S3 para bucket e chave."],["Warehouse, consulta ad hoc ou visualização","Redshift, Athena ou camada de BI, conforme a etapa."]],"trace":["Siga um pedido: DNS, distribuição do web content, compute, fila, banco e armazenamento. Em cada etapa diga qual condição eliminaria a alternativa vizinha e por quê."],"lab":["Escolha os serviços de dois desenhos simples: site com conteúdo estático e catálogo com consultas por chave. Refaça a escolha quando o requisito muda para transações relacionais e relatórios históricos."],"parameters":[["Protocolo do consumidor","Determina rede e interface.","Route 53 resolve nomes, CloudFront entrega na borda, VPC isola redes."],["Responsabilidade de operação","Define o que a equipe mantém.","Separe controle do host, orquestração e lógica de negócio."],["Domínio de falha","Define o impacto a tolerar.","Escolha AZ ou Região pelo risco explícito."]],"trade-off":["Serviços gerenciados reduzem tarefas de infraestrutura, enquanto compatibilidade, custo e controle dependem do caso."]}],"4":[{"id":"4.2.1","skill":"4.2.1","title":"Guia de custos: estimar, observar, alertar e amortizar","mechanism":["Use uma ferramenta diferente para estimativa futura, análise realizada, orçamento planejado, detecção de anomalia e exportação detalhada. Em preços, dimensione antes de assumir compromissos. Compare Spot e on-demand pelo risco e Savings Plans pela previsibilidade."],"paths":[["Estimativa antes do deploy","AWS Pricing Calculator com premissas explícitas."],["Histórico por conta, tag ou serviço","AWS Cost Explorer."],["Avisar que o limite acordado será excedido","AWS Budgets."],["Detectar uma variação inesperada","Cost Anomaly Detection."],["Análise granular própria","AWS Data Exports com tratamento de tags e granularidade."]],"trace":["Investigue um desvio de custo usando conta, região, serviço e tag. Compare baseline, custo marginal e se o evento foi isolado ou sinal de demanda estável."],"lab":["Em um cenário fictício de três contas, associe fatura central, relatório por equipe, alerta de limiar e investigação de anomalia. Escolha a opção de preço de um lote interrompível e de uma carga contínua."],"parameters":[["Compromisso elegível","Define desconto conforme produto.","Savings Plans não reservam por si só a capacidade."],["Tráfego","Afeta custos dependendo de direção, serviço e localização.","Confirme regras vigentes e compare com estimativa."],["Plano de suporte","Define elegibilidade, canais e atendimento.","Consulte planos atuais, inclusive transições de nomenclatura."]],"trade-off":["Descontos por prazo ajudam consumo elegível e previsível, enquanto flexibilidade protege contra mudança de demanda."]}]},"sources":[["Guia oficial CLF-C02","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Certificação e preparação oficial","https://aws.amazon.com/pt/certification/certified-cloud-practitioner/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["AWS Cloud Adoption Framework","https://aws.amazon.com/pt/cloud-adoption-framework/"],["Estratégias de migração","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"],["Responsabilidade compartilhada","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"],["IAM — práticas recomendadas","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["AWS Organizations — conceitos","https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-starte );border-radius:10px}\n\n.keyhint{font-size:10px;color:var(--mu);font-weight:700;white-space:nowrap}\n.toolbar button:focus-visible,.domainbar button:focus-visible,.sheetnav button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent,var(--blue)) 60%,transparent);outline-offset:2px}\nmark.hit{background:#ffe48a;color:#202020;border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px rgba(180,130,0,.18)}\n:root[data-theme=\"dark\"] mark.hit{background:#725b18;color:#fff2be}\n@media print{\n  .keyhint{display:none!important}\n  #app.print-all .sheet{break-after:page;page-break-after:always}\n  #app.print-all .sheet:last-child{break-after:auto;page-break-after:auto}\n}\n@media(max-width:1100px){.cards,.bottom{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:22px}}\n@media(max-width:650px){header{padding:10px 10px 0}main{padding:10px 10px 24px}.brand{padding:15px 12px}.brand h1{font-size:19px}.cards,.bottom,.tables{grid-template-columns:1fr}.decision table,.compare table{font-size:10.5px}.decision td:last-child{min-width:140px}.decision td,.compare td{padding:6px}.sheethead h2{font-size:18px}.toolbar{gap:6px}.toolbar button{padding:8px}.foot{padding:0 10px 18px}}\n@media print{\n  @page{size:A4 landscape;margin:7mm}\n  body{background:#fff;color:#111;font-size:8.5pt}\n  header .toolbar,header .domainbar,header .sheetnav,.foot{display:none!important}\n  header{padding:0;max-width:none}\n  .brand{box-shadow:none;border-radius:0;padding:6px;background:#102b57!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}\n  .brand h1{font-size:14pt;margin:2px 0}\n  .brand p,.brand .pill,.brand .eyebrow{display:none!important}\n  main{padding:4mm 0 0;max-width:none}\n  .sheethead,.section,.card,.final{box-shadow:none;break-inside:avoid}\n  .sheethead{padding:5px;margin-bottom:6px}\n  .sheethead h2{font-size:13pt}\n  .section{margin:4px 0;padding:5px}\n  .cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px}\n  .bottom{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}\n  .card{padding:4px;font-size:7.5pt}\n  .card li{margin-bottom:2px}\n  .tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}\n  .decision table,.compare table{font-size:7.5pt}\n  .decision th,.compare th{padding:3px 5px}\n  .decision td,.compare td{padding:3px 5px}\n  .sources{display:none}\n  .sheet{print-color-adjust:exact;-webkit-print-color-adjust:exact}\n}\n\u003c/style>\n\u003cstyle>@media screen{html.reading-mode body>header:first-of-type{display:none}} @media(max-width:550px){.tablewrap,.section{max-width:100%;overflow:auto}.map-head{flex-wrap:wrap}} \u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003cdiv class=\"brand\" id=\"brand\">\n  \u003cdiv class=\"eyebrow\">AWS CERTIFIED CLOUD PRACTITIONER\u003c/div>\n  \u003ch1>CLF-C02 · CHEATSHEETS COMPLETOS\u003c/h1>\n  \u003cp>Resumo técnico por domínio · decisões · comparações · formatos · métricas · parâmetros · cenários e pegadinhas\u003c/p>\n  \u003cspan class=\"pill\">CLF-C02 · v1.1\u003c/span>\n\u003c/div>\n\u003cdiv class=\"toolbar\">\n  \u003cinput id=\"search\" type=\"search\" placeholder=\"Buscar serviço, parâmetro, conceito ou pegadinha em todos os cheatsheets…\" aria-label=\"Buscar nos cheatsheets\">\n  \u003cbutton class=\"primary\" id=\"print\">Imprimir atual\u003c/button>\n  \u003cbutton id=\"printAll\">Imprimir todos\u003c/button>\n  \u003cbutton id=\"theme\">☾ Tema escuro\u003c/button>\n  \u003cbutton id=\"clear\">Limpar busca\u003c/button>\n  \u003cspan class=\"keyhint\">Navegar: ← / →\u003c/span>\n  \u003cspan id=\"count\" style=\"font-size:11px;color:var(--mu);font-weight:700\">\u003c/span>\n\u003c/div>\n\u003cdiv class=\"domainbar\" id=\"domains\">\u003c/div>\n\u003cnav class=\"sheetnav\" id=\"sheets\">\u003c/nav>\n\u003c/header>\n\u003cmain id=\"app\">\u003cdiv class=\"empty\">Carregando cheatsheets…\u003c/div>\u003c/main>\n\u003cdiv class=\"foot\">\n  \u003cspan>Material de revisão independente. Consulte a documentação oficial para limites, regiões, pricing e mudanças de serviço.\u003c/span>\n  \u003cspan>CLF-C02 · 19 cheatsheets · HTML autossuficiente\u003c/span>\n\u003c/div>\n\u003cscript>\nconst DATA={\"sheets\":[{\"id\":\"t1.1\",\"d\":1,\"k\":\"Valor da nuvem AWS\",\"title\":\"Valor da nuvem AWS\",\"sub\":\"Objetivos 1.1.1, 1.1.2\",\"desc\":\"Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência.\",\"quick\":[[\"Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair. Que benefício está em uso?\",\"Elasticidade\"],[\"O negócio aceita perder no máximo 15 minutos de dados. Qual objetivo foi descrito?\",\"RPO\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Elasticidade\",\"A capacidade aumenta e diminui de acordo com a demanda.\",\"Uma bilheteria precisa adicionar capacidade na abertura das vendas e liberá-la quando o volume cair. Que benefício está em uso?\"],[\"Escala vertical\",\"O tamanho de uma unidade de computação cresce para suportar carga adicional.\",\"Um aplicativo legado executa em um único processo. A equipe troca a máquina por outra com mais memória, preservando uma única unidade. Que estratégia foi usada?\"],[\"Agilidade\",\"O tempo de provisionamento ou de experimentação é encurtado.\",\"Uma equipe pode criar e remover um ambiente de prototipagem em minutos. Qual benefício encurtou o ciclo de teste?\"],[\"Alta disponibilidade\",\"Redundância reduz interrupção diante de falha de um componente.\",\"Um serviço continua respondendo ao perder uma instância porque outra assume a carga. Qual propriedade é demonstrada?\"],[\"RPO\",\"Expressa quantos minutos ou horas de dados podem ser perdidos.\",\"O negócio aceita perder no máximo 15 minutos de dados. Qual objetivo foi descrito?\"],[\"RTO\",\"Expressa quanto tempo o serviço pode permanecer indisponível até recuperar.\",\"O contrato determina que a aplicação deve voltar em até duas horas. Como se chama esse limite?\"],[\"Alta disponibilidade Multi-AZ\",\"Distribui componentes entre zonas para tolerar falha zonal.\",\"Uma loja exige manter o serviço quando um centro de dados inteiro dentro da Região falhar. Qual desenho atende ao escopo?\"],[\"Recuperação em outra Região\",\"Cria um caminho de recuperação além do alcance de uma falha regional.\",\"A política inclui indisponibilidade de toda a Região primária. Onde deve existir o caminho alternativo de recuperação?\"]]}],\"cards\":[{\"h\":\"1.1.1 · Elasticidade, escalabilidade e agilidade\",\"items\":[\"Elasticidade é ajustar recursos conforme a demanda cresce e recua. Escalabilidade é a capacidade de sustentar mais carga, ampliando uma instância (vertical) ou adicionando unidades (horizontal). Agilidade é reduzir o tempo entre a ideia e o provisionamento. Cada propriedade resolve um problema diferente: variação, capacidade ou velocidade de entrega.\",\"Compare a curva de demanda com a capacidade efetivamente provisionada. Escalabilidade horizontal exige distribuir carga. Para uma arquitetura sem estado, a inclusão e remoção de instâncias é mais simples. A elasticidade combina mecanismos de escala e políticas para evitar ociosidade ou insuficiência.\"],\"tone\":\"blue\"},{\"h\":\"1.1.2 · Disponibilidade, recuperação e alcance global\",\"items\":[\"Alta disponibilidade reduz interrupções por falhas comuns. Recuperação de desastre repõe serviço e dados após um evento maior. RTO mede o tempo tolerado para recuperar. RPO mede a perda de dados tolerada no tempo. Regiões, zonas e pontos de presença têm escopos distintos.\",\"Mapeie o efeito que a organização quer limitar. Cópias frequentes afetam RPO, mas a restauração ainda precisa cumprir o RTO. Cópias regionais devem ter acesso, chave e retenção compatíveis com a recuperação planejada.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Use uma curva de uma semana e marque pico, vale e capacidade. Explique o que muda se o comportamento se torna previsível e constante.\",\"Simule a perda de uma zona, depois uma indisponibilidade regional. Compare impacto, ponto recuperável e tempo de retorno.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Uma instância de tamanho maior pode escalar verticalmente e continuar fixa durante a madrugada.\",\"Backup nunca restaurado não comprova um tempo de recuperação.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t1.2\",\"d\":1,\"k\":\"Princípios de design e Well-Architected\",\"title\":\"Princípios de design e Well-Architected\",\"sub\":\"Objetivos 1.2.1, 1.2.2, 1.2.3\",\"desc\":\"Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica.\",\"quick\":[[\"O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação. Qual pilar domina?\",\"Excelência operacional\"],[\"Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar. Qual serviço mantém o trabalho pendente?\",\"Amazon SQS\"],[\"Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido. Qual pilar?\",\"Segurança\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Excelência operacional\",\"Prioriza mudanças seguras, processos, aprendizagem e melhoria operacional contínua.\",\"O time automatiza entregas pequenas, atualiza os procedimentos após incidentes e mede a qualidade da operação. Qual pilar domina?\"],[\"Confiabilidade\",\"Foca recuperação, gestão de mudanças e tolerância a falhas.\",\"Uma empresa exercita o retorno de serviço e verifica a recuperação automática. Qual pilar domina?\"],[\"Eficiência de desempenho\",\"Usa recursos computacionais adequados e mede seu desempenho conforme a demanda.\",\"A equipe testa famílias de instância para atingir a latência exigida com utilização adequada. Qual pilar orienta a decisão?\"],[\"Sustentabilidade\",\"Foca reduzir o impacto ambiental do workload por unidade de trabalho.\",\"Uma iniciativa mede impacto ambiental por transação e reduz o compute ocioso. Qual pilar é a motivação explícita?\"],[\"Amazon SQS\",\"Mantém mensagens em fila até o processamento conforme políticas de fila e consumidor.\",\"Um sistema de pedidos produz mensagens mais rapidamente que os trabalhadores podem processar. Qual serviço mantém o trabalho pendente?\"],[\"Amazon SNS\",\"Publica uma notificação para vários assinantes de um tópico.\",\"A mesma confirmação deve chegar a assinantes independentes de um canal de notificação. Qual serviço faz o fan-out?\"],[\"Elastic Load Balancing\",\"Distribui conexões ou requisições aos alvos saudáveis.\",\"Um site quer distribuir requisições HTTP entre alvos saudáveis já provisionados. Que função usar?\"],[\"EC2 Auto Scaling\",\"Ajusta a quantidade de instâncias de um grupo conforme configuração.\",\"A capacidade de um grupo EC2 deve seguir um alvo de utilização. Qual mecanismo muda o número de instâncias?\"],[\"Segurança\",\"Protege identidades, dados e recursos e estabelece detecção e resposta.\",\"Uma revisão prioriza impedir exposição de credenciais e detectar uso indevido. Qual pilar?\"],[\"Otimização de custos\",\"Reduz desperdício e melhora o custo por objetivo entregue.\",\"O objetivo explícito é conhecer o gasto por pedido e remover desperdício sem afetar o SLA. Qual pilar?\"],[\"Excelência operacional\",\"Automatiza e melhora processos operacionais e mudanças.\",\"Um time introduz runbooks e verificações automáticas para mudanças repetitivas. Qual pilar lidera?\"],[\"Eficiência de desempenho\",\"Seleciona recursos adequados à carga e demonstra desempenho.\",\"A equipe compara latência de consulta com tipos de instância diferentes e mede saturação. Que pilar orienta o experimento?\"]]}],\"cards\":[{\"h\":\"1.2.1 · Os seis pilares do Well-Architected\",\"items\":[\"O Well-Architected reúne excelência operacional, segurança, confiabilidade, eficiência de desempenho, otimização de custos e sustentabilidade. As decisões podem contribuir para vários pilares. Na prova, selecione o pilar associado ao objetivo dominante: recuperação, cadência operacional, recursos adequados, gasto ou impacto ambiental.\",\"Relacione cada decisão à evidência que comprova seu efeito. Experimentos de recuperação comprovam confiabilidade. Automatizar entregas e melhorar procedimentos operacionais exercitam excelência operacional. Remover recursos ociosos com mesma entrega pode beneficiar custos e sustentabilidade, cada um com sua métrica.\"],\"tone\":\"blue\"},{\"h\":\"1.2.2 · Desacoplamento e resiliência na aplicação\",\"items\":[\"Desacoplar componentes permite que tenham ritmos e ciclos de vida independentes. Uma fila amortiza picos e possibilita consumo posterior; publicação em tópico distribui notificações a assinantes. Um balanceador roteia tráfego entre alvos, e políticas de ajuste de capacidade reagem à utilização medida.\",\"Escolha o mecanismo pelo contrato: entrega a um trabalhador, distribuição a vários destinatários, distribuição de requisições síncronas ou ajuste de capacidade. Fila e tópico frequentemente se combinam quando vários consumidores precisam de retenção e ritmo independentes.\"],\"tone\":\"blue\"},{\"h\":\"1.2.3 · Escolhas de segurança, custo e integração ao design\",\"items\":[\"Os pilares interagem. Isolamento e rastreabilidade favorecem segurança. Prever e analisar gasto por unidade de negócio orienta otimização de custos. Diminuir trabalho humano repetitivo e testar mudanças em lotes pequenos melhora excelência operacional. O requisito explícito define qual avaliação virá primeiro.\",\"Registre impacto, custo, risco e esforço. Para custo, busque a menor despesa que ainda atende ao objetivo. Para segurança, identifique identidade, acesso, dados, detecção e resposta. Para desempenho, meça a métrica técnica do requisito antes de escolher família e capacidade.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Descreva um risco e identifique o resultado mensurável que confirma a melhoria.\",\"Anote o que acontece se o consumidor ficar fora por alguns minutos. Identifique se o produtor espera, se a mensagem pode ser tratada depois e quantos consumidores a recebem.\",\"Considere a mesma mudança como intervenção em dois pilares. Identifique a métrica que permite sustentar o argumento de cada um.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"O pilar de eficiência de desempenho não significa escolher sempre o maior servidor.\",\"Balanceamento distribui tráfego entre alvos existentes. Ajustar a quantidade de alvos é função separada.\",\"Habilitar um controle sem verificar seu efeito não fecha a decisão arquitetural.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t1.3\",\"d\":1,\"k\":\"Adoção e migração\",\"title\":\"Adoção e migração\",\"sub\":\"Objetivos 1.3.1, 1.3.2\",\"desc\":\"Questione se o aplicativo será movido, adaptado, refeito ou substituído. Retain mantém um ativo no local; retire desativa; relocate transfere plataformas compatíveis sem alterar suas cargas individualmente.\",\"quick\":[[\"Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho. Qual estratégia?\",\"Rehost\"],[\"O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa. Qual referência usar?\",\"AWS Cloud Adoption Framework\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Rehost\",\"Migra a aplicação com mudanças mínimas, como lift and shift para EC2.\",\"Um aplicativo será movido de máquinas on-premises para EC2 sem redesenho. Qual estratégia?\"],[\"Replatform\",\"Altera parte da plataforma para ganhar benefícios operacionais sem grande reescrita.\",\"O banco muda de VM para RDS mantendo o motor compatível e as interfaces do aplicativo. Qual estratégia caracteriza a mudança?\"],[\"Refactor\",\"Redesenha a aplicação para explorar uma arquitetura diferente.\",\"Um monólito é redesenhado em serviços desacoplados com código e contratos novos. Qual estratégia?\"],[\"Repurchase\",\"Compra ou adota outro produto para atender à mesma função.\",\"A empresa troca o CRM desenvolvido internamente por um fornecedor SaaS e importa os registros. Qual estratégia?\"],[\"AWS Cloud Adoption Framework\",\"Orienta capacidades e transformação organizacional para adoção da nuvem.\",\"O patrocinador precisa tratar lacunas de pessoas, governança e operação antes de uma migração corporativa. Qual referência usar?\"],[\"AWS Well-Architected Framework\",\"Orienta revisão e boas práticas de arquitetura de workloads.\",\"Um arquiteto quer revisar um workload pelos seis pilares. Qual referência usar?\"],[\"AWS DMS\",\"Move dados de bancos compatíveis e pode capturar mudanças.\",\"A iniciativa já definiu a estratégia e precisa mover dados relacionais com captura de alterações. Qual serviço operacional usar?\"],[\"AWS Pricing Calculator\",\"Estima custos para uma configuração planejada.\",\"A equipe precisa estimar previamente o custo de uma arquitetura proposta para aprovação. Que ferramenta usar?\"]]}],\"cards\":[{\"h\":\"1.3.1 · Estratégias de migração e mudança de plataforma\",\"items\":[\"As estratégias de migração são escolhidas pela mudança aceita sobre o ativo e pelo destino. Rehost move a aplicação com pouca mudança. Replatform introduz otimizações específicas sem reescrever toda a solução. Refactor altera arquitetura e código. Repurchase substitui o produto por outro, por exemplo SaaS.\",\"Questione se o aplicativo será movido, adaptado, refeito ou substituído. Retain mantém um ativo no local; retire desativa; relocate transfere plataformas compatíveis sem alterar suas cargas individualmente.\"],\"tone\":\"blue\"},{\"h\":\"1.3.2 · AWS CAF, avaliação e ondas de adoção\",\"items\":[\"O AWS Cloud Adoption Framework organiza capacidades em seis perspectivas: negócios, pessoas, governança, plataforma, segurança e operações. Adoção envolve patrocínio, competências e riscos além da movimentação de servidores. Inventário, dependências e ondas ajudam a escolher ritmo e sequência da migração.\",\"Separe transformação organizacional da seleção de uma ferramenta para mover dados. Avalie proposta de valor, prontidão, conformidade e habilidades. Use uma onda piloto com métricas de resultado e feedback para a próxima onda.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validação\",\"items\":[\"Identifique o que muda no código, no motor de banco, na infraestrutura e no modelo operacional.\",\"Para cada bloqueio, identifique se falta capacidade organizacional, decisão de arquitetura ou mecanismo de migração.\"],\"tone\":\"green\"},{\"h\":\"Pegadinhas\",\"items\":[\"Trocar um software instalado por uma assinatura SaaS é repurchase, mesmo que os dados sejam migrados.\",\"CAF orienta adoção organizacional. Well-Architected tem foco na revisão de workloads.\"],\"tone\":\"orange\"}],\"final\":\"Revisão: escolha a abordagem, explique por que as demais falham e indique como verificar o resultado.\"},{\"id\":\"t1.4\",\"d\":1,\"k\":\"Economia da nuvem\",\"title\":\"Economia da nuvem\",\"sub\":\"Objetivos 1.4.1, 1.4.2\",\"desc\":\"Compare custo de hardware, espaço, energia, licenças, rede, operação, indisponibilidade e crescimento. A nuvem pode reduzir sobreprovisionamento, mas custos como transferência, redundância e compromissos permanecem no cálculo.\",\"quick\":[[\"Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização. Qual mudança econômica?\",\"Troca de investimento antecipado por despesa variável\"],[\"Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico. Qual medida investigar primeiro?\",\"Rightsizing\"]],\"tables\":[{\"h\":\"Parâmetros e critérios de verificação\",\"cols\":[\"Recurso\",\"O que controla\",\"Como interpretar\"],\"rows\":[[\"Troca de investimento antecipado por despesa variável\",\"Consumo permite ajustar a despesa operacional ao uso.\",\"Uma startup troca a compra inicial de servidores por pagamento proporcional à utilização. Qual mudança econômica?\"],[\"Economia de escala\",\"Agregação de demanda do provedor pode reduzir custo unitário.\",\"Um provedor agrega demanda de milhares de clientes para diluir custos estruturais. Qual conceito?\"],[\"Custo total de propriedade (TCO)\",\"Considera toda a vida da solução, incluindo despesas que vão além de compute.\",\"Uma empresa compara hardware, mão de obra, migração e rede por três anos. Que perspectiva usa?\"],[\"Previsibilidade por compromisso\",\"Um compromisso pode reduzir preço de uso elegível e cria obrigação de pagamento conforme o plano.\",\"A organização aceita pagar pelo compromisso contínuo para reduzir preço de consumo elegível. Qual mecanismo econômico?\"],[\"Rightsizing\",\"Adapta o tamanho ou tipo de recurso ao uso medido.\",\"Uma instância fica abaixo de 10% de uso durante o mês, mesmo no pico. Qual medida investigar primeiro?\"],[\"Agendamento de desligamento\",\"Reduz tempo ativo de ambientes que não precisam funcionar fora da janela.\",\"O ambiente de laboratório só precisa funcionar em horário comercial. Qual ajuste é imediato?\"],[\"Elasticidade por Auto Scaling\",\"Adapta a quantidade em resposta à variação de demanda.\",\"A aplicação tem picos imprevisíveis e o objetivo é
