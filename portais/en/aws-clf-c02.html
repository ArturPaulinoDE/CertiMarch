d Advisor"],"correct":[0],"why":["Meets the requirement. Routes the administrative request through the corresponding channel.","This choice meets a different requirement. Engages technical coverage and a channel suited to the severity.","This choice meets a different requirement. Considers proactive guidance and management features in the current offering.","This choice meets a different requirement. Identifies the expected opportunities and alerts, depending on access."],"kind":"single","form":"B","scored":true},{"id":"B-4.1.1-1","skill":"4.1.1","domain":4,"stem":"A parallel analysis can pause and restart when spare capacity returns. Which purchasing option should be considered?","options":["On-Demand","Savings Plans","Reserved Instances","Spot Instances"],"correct":[3],"why":["This choice meets a different requirement. Flexible usage with no term commitment.","This choice meets a different requirement. An hourly spend commitment for a discount on eligible compute usage.","This choice meets a different requirement. A discount model subject to reservation conditions and compatibility.","Meets the requirement. Spare capacity suited to interruption-tolerant workloads."],"kind":"single","form":"B","scored":false},{"id":"B-4.1.2-2","skill":"4.1.2","domain":4,"stem":"A team wants to group actual costs by service and account over time. Which tool?","options":["AWS Pricing Calculator","AWS Cost Explorer","Data transfer model","Storage cost drivers"],"correct":[1],"why":["This choice meets a different requirement. Estimates costs for planned services and volume.","Meets the requirement. Analyzes recorded costs and usage and lets you explore trends.","This choice meets a different requirement. Considers source, destination and the service's billing rules.","This choice meets a different requirement. Consider volume, class, requests, retention and retrieval."],"kind":"single","form":"B","scored":false}],"forms":{"A":["A-M-1.1.1","A-1.1.2-1","A-1.2.1-1","A-1.2.2-1","A-1.3.1-1","A-1.3.2-1","A-1.4.1-1","A-1.4.2-1","A-1.2.3-1","A-1.1.1-1","A-1.1.2-2","A-1.2.1-2","A-1.2.2-2","A-1.3.1-2","A-1.3.2-2","A-1.4.1-2","A-M-2.3.1","A-M-2.1.1","A-2.1.2-1","A-2.2.1-1","A-2.2.2-1","A-2.3.2-1","A-2.4.1-1","A-2.4.2-1","A-2.2.3-1","A-2.4.3-1","A-2.3.1-1","A-2.1.1-1","A-2.1.2-2","A-2.2.1-2","A-2.2.2-2","A-2.3.2-2","A-2.4.1-2","A-2.4.2-2","A-2.2.3-2","A-M-3.6.1","A-M-3.2.1","A-3.1.1-1","A-3.1.2-1","A-3.3.1-1","A-3.3.2-1","A-3.4.1-1","A-3.4.2-1","A-3.5.1-1","A-3.5.2-1","A-3.6.2-1","A-3.7.1-1","A-3.7.2-1","A-3.8.1-1","A-3.8.2-1","A-3.8.3-1","A-3.8.4-1","A-3.6.1-1","A-3.2.1-1","A-3.1.1-2","A-3.1.2-2","A-3.3.1-2","A-M-4.2.1","A-4.1.1-1","A-4.1.2-1","A-4.2.2-1","A-4.3.1-1","A-4.3.2-1","A-4.2.1-1","A-4.1.1-2"],"B":["B-M-1.2.1","B-1.1.1-1","B-1.1.2-1","B-1.2.2-1","B-1.3.1-1","B-1.3.2-1","B-1.4.1-1","B-1.4.2-1","B-1.2.3-1","B-1.2.1-1","B-1.1.1-2","B-1.1.2-2","B-1.2.2-2","B-1.3.1-2","B-1.3.2-2","B-1.4.1-2","B-M-2.4.1","B-M-2.2.2","B-2.1.1-1","B-2.1.2-1","B-2.2.1-1","B-2.3.1-1","B-2.3.2-1","B-2.4.2-1","B-2.2.3-1","B-2.4.3-1","B-2.4.1-1","B-2.2.2-1","B-2.1.1-2","B-2.1.2-2","B-2.2.1-2","B-2.3.1-2","B-2.3.2-2","B-2.4.2-2","B-2.2.3-2","B-M-3.8.1","B-M-3.4.1","B-3.1.1-1","B-3.1.2-1","B-3.2.1-1","B-3.3.1-1","B-3.3.2-1","B-3.4.2-1","B-3.5.1-1","B-3.5.2-1","B-3.6.1-1","B-3.6.2-1","B-3.7.1-1","B-3.7.2-1","B-3.8.2-1","B-3.8.3-1","B-3.8.4-1","B-3.8.1-1","B-3.4.1-1","B-3.1.1-2","B-3.1.2-2","B-3.2.1-2","B-M-4.1.1","B-4.1.2-1","B-4.2.1-1","B-4.2.2-1","B-4.3.1-1","B-4.3.2-1","B-4.1.1-1","B-4.1.2-2"]}}}};
window.portalModel={"cert":"CLF-C02","badge":"CLF","title":"AWS Certified Cloud Practitioner","filename":"AWS_CLF_C02_Portal_v1_1.html","minutes":90,"score":[12,15,17,6],"pilot":[4,4,5,2],"domainLabel":"Domain","key":"clf","version":"1.1","domains":[{"id":1,"name":"Cloud concepts","short":"Cloud concepts","weight":24,"color":"#2874c8","skills":9,"range":"1.1.1–1.4.2","topics":"Concepts guide: value, failures, and adoption"},{"id":2,"name":"Security and compliance","short":"Security and compliance","weight":30,"color":"#19865b","skills":10,"range":"2.1.1–2.4.3","topics":"Security guide: identity, evidence, and protection"},{"id":3,"name":"Cloud technology and services","short":"Cloud technology and services","weight":34,"color":"#7654b5","skills":17,"range":"3.1.1–3.8.4","topics":"Services guide: compute, storage, networking, and analytics"},{"id":4,"name":"Billing, pricing and support","short":"Billing, pricing and support","weight":12,"color":"#c77918","skills":6,"range":"4.1.1–4.3.2","topics":"Cost guide: estimate, observe, alert, and amortize"}],"tasks":{"1.1":"Value of the AWS Cloud","1.2":"Design principles and Well-Architected","1.3":"Adoption and migration","1.4":"Cloud economics","2.1":"Shared responsibility","2.2":"Security, governance and compliance","2.3":"Identity and access control","2.4":"Security services and features","3.1":"Deployment and operation methods","3.2":"Global infrastructure","3.3":"Compute","3.4":"Databases","3.5":"Networking","3.6":"Storage","3.7":"AI, ML and analytics","3.8":"Other services in scope","4.1":"Pricing models","4.2":"Billing, budgets and cost management","4.3":"Technical resources and support options"},"skills":[{"code":"1.1.1","id":"1.1.1","domain":1,"task":"1.1","title":"Elasticity, scalability and agility","concept":"Elasticity is adjusting resources as demand grows and recedes. Scalability is the ability to sustain more load, by enlarging an instance (vertical) or adding units (horizontal). Agility is reducing the time between an idea and provisioning. Each property solves a different problem: variation, capacity or speed of delivery.","control":"Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity.","pitfall":"A larger instance can scale vertically and still stay fixed overnight.","verify":"Use a one-week curve and mark the peak, the trough and the capacity. Explain what changes if the behavior becomes predictable and constant.","decisions":[["Elasticity","Capacity grows and shrinks according to demand."],["Vertical scaling","The size of a compute unit grows to support additional load."],["Agility","Provisioning or experimentation time is shortened."],["High availability","Redundancy reduces disruption when a component fails."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-1.1.1-1","prompt":"A ticket office receives ten times more traffic when sales open. After two hours, it wants to release the extra capacity. Which characteristic covers both phases?","solution":"Elasticity","explanation":"Capacity follows both increases and decreases in demand.","options":[["Fixed vertical scaling","A larger machine can sustain the peak, but it stays provisioned afterwards."],["High availability","Addresses disruption caused by failure, not the adjustment between peak and trough."],["Hybrid migration","Describes distribution across environments, not capacity adjustment."],["Elasticity","Capacity follows both increases and decreases in demand."]]},{"id":"P-1.1.1-2","prompt":"A team used to wait for servers to be purchased before testing a prototype. Now it creates and discards an environment on the same day. Which benefit changed the test timeline?","solution":"Agility","explanation":"On-demand provisioning reduces the time between an idea and a test.","options":[["Provider economies of scale","Can influence the unit price, but the scenario compares time."],["Agility","On-demand provisioning reduces the time between an idea and a test."],["Vertical scalability","Changing machine size does not explain the fast initial provisioning."],["Disaster recovery","The environment is created for testing, not to restore a service."]]}],"cue":"A ticket office needs to add capacity when sales open and release it when volume drops. Which benefit is in use?","answer":"Elasticity","use":"Meets the requirement. Capacity grows and shrinks according to demand.","avoid":"A larger instance can scale vertically and still stay fixed overnight.","example":"Use a one-week curve and mark the peak, the trough and the capacity. Explain what changes if the behavior becomes predictable and constant.","detail":[],"legacy":"ficha/1.1.1","params":[["Elasticity","Capacity grows and shrinks according to demand.","A ticket office needs to add capacity when sales open and release it when volume drops. Which benefit is in use?"],["Vertical scaling","The size of a compute unit grows to support additional load.","A legacy application runs in a single process. The team replaces the machine with one that has more memory, keeping a single unit. Which strategy was used?"],["Agility","Provisioning or experimentation time is shortened.","A team can create and remove a prototyping environment in minutes. Which benefit shortened the test cycle?"],["High availability","Redundancy reduces disruption when a component fails.","A service keeps responding after losing an instance because another one takes over the load. Which property is demonstrated?"]],"notes":null},{"code":"1.1.2","id":"1.1.2","domain":1,"task":"1.1","title":"Availability, recovery and global reach","concept":"High availability reduces outages caused by common failures. Disaster recovery restores service and data after a larger event. RTO measures the time tolerated for recovery. RPO measures the tolerated data loss, in time. Regions, zones and points of presence have different scopes.","control":"Map the effect the organization wants to limit. Frequent copies affect RPO, but the restore still has to meet the RTO. Regional copies must have access, keys and retention compatible with the planned recovery.","pitfall":"A backup that was never restored does not prove a recovery time.","verify":"Simulate the loss of a zone, then a regional outage. Compare impact, recoverable point and time to return.","decisions":[["RPO","Expresses how many minutes or hours of data can be lost."],["RTO","Expresses how long the service can stay unavailable before it recovers."],["Multi-AZ high availability","Distributes components across zones to tolerate a zone failure."],["Recovery in another Region","Creates a recovery path beyond the reach of a regional failure."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["AWS global infrastructure","https://aws.amazon.com/pt/about-aws/global-infrastructure/"]],"scenarios":[{"id":"P-1.1.2-1","prompt":"After a failure, the clinic can restart the application in one hour. The board says at most fifteen minutes of records can be lost. Which objective describes the fifteen minutes?","solution":"RPO","explanation":"Limits the distance between the failure and the recoverable data point.","options":[["Retention period","Defines how much history to keep, not the maximum loss in an incident."],["Support agreement","Covers entitlements and service, not how current the copy must be."],["RPO","Limits the distance between the failure and the recoverable data point."],["RTO","It is the limit for bringing the service back."]]},{"id":"P-1.1.2-2","prompt":"The company tolerates losing a few changes, but the highlighted contract says the system must be back within two hours. What do the two hours represent?","solution":"RTO","explanation":"Measures the service recovery time.","options":[["p95 latency","Describes the response time of requests already served."],["Maintenance window","Defines the time for a planned change, not recovery after a failure."],["RTO","Measures the service recovery time."],["RPO","Measures acceptable data loss, in time."]]}],"cue":"The business accepts losing at most 15 minutes of data. Which objective was described?","answer":"RPO","use":"Meets the requirement. Expresses how many minutes or hours of data can be lost.","avoid":"A backup that was never restored does not prove a recovery time.","example":"Simulate the loss of a zone, then a regional outage. Compare impact, recoverable point and time to return.","detail":[],"legacy":"ficha/1.1.2","params":[["RPO","Expresses how many minutes or hours of data can be lost.","The business accepts losing at most 15 minutes of data. Which objective was described?"],["RTO","Expresses how long the service can stay unavailable before it recovers.","The contract states that the application must be back within two hours. What is this limit called?"],["Multi-AZ high availability","Distributes components across zones to tolerate a zone failure.","A store requires the service to keep running when an entire data center within the Region fails. Which design meets the scope?"],["Recovery in another Region","Creates a recovery path beyond the reach of a regional failure.","The policy includes an outage of the entire primary Region. Where must the alternative recovery path exist?"]],"notes":null},{"code":"1.2.1","id":"1.2.1","domain":1,"task":"1.2","title":"The six Well-Architected pillars","concept":"Well-Architected brings together operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. Decisions can contribute to several pillars. On the exam, select the pillar tied to the dominant objective: recovery, operating cadence, right-sized resources, spend or environmental impact.","control":"Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric.","pitfall":"The performance efficiency pillar does not mean always choosing the largest server.","verify":"Describe a risk and identify the measurable result that confirms the improvement.","decisions":[["Operational excellence","Prioritizes safe changes, processes, learning and continuous operational improvement."],["Reliability","Focuses on recovery, change management and fault tolerance."],["Performance efficiency","Uses appropriate compute resources and measures their performance as demand changes."],["Sustainability","Focuses on reducing the workload's environmental impact per unit of work."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.2.1-1","prompt":"After incidents, a team reviews runbooks and automates small, reversible changes. The goal is to improve the operating routine. Which pillar guides this work?","solution":"Operational excellence","explanation":"Focuses on operating, evolving processes and learning from events.","options":[["Operational excellence","Focuses on operating, evolving processes and learning from events."],["Security","It would dominate if the main goal were protecting data and identities."],["Sustainability","It is not investigating environmental impact."],["Cost optimization","The scenario does not measure spend or waste."]]},{"id":"P-1.2.1-2","prompt":"The company rehearses losing a primary database and tests whether failover restores the service. Which pillar measures this result?","solution":"Reliability","explanation":"The test proves the ability to recover and tolerate failures.","options":[["Performance efficiency","The focus is not on choosing resources by routine latency or throughput."],["Operational excellence","Automating the test helps operations, but the result measured is recovery."],["Reliability","The test proves the ability to recover and tolerate failures."],["Security","The simulation does not prove confidentiality protection."]]}],"cue":"The team automates small deliveries, updates procedures after incidents and measures operational quality. Which pillar dominates?","answer":"Operational excellence","use":"Meets the requirement. Prioritizes safe changes, processes, learning and continuous operational improvement.","avoid":"The performance efficiency pillar does not mean always choosing the largest server.","example":"Describe a risk and identify the measurable result that confirms the improvement.","detail":[],"legacy":"ficha/1.2.1","params":[["Operational excellence","Prioritizes safe changes, processes, learning and continuous operational improvement.","The team automates small deliveries, updates procedures after incidents and measures operational quality. Which pillar dominates?"],["Reliability","Focuses on recovery, change management and fault tolerance.","A company exercises service restoration and verifies automatic recovery. Which pillar dominates?"],["Performance efficiency","Uses appropriate compute resources and measures their performance as demand changes.","The team tests instance families to reach the required latency with appropriate utilization. Which pillar guides the decision?"],["Sustainability","Focuses on reducing the workload's environmental impact per unit of work.","An initiative measures environmental impact per transaction and reduces idle compute. Which pillar is the explicit motivation?"]],"notes":"1.2.1"},{"code":"1.2.2","id":"1.2.2","domain":1,"task":"1.2","title":"Decoupling and resilience in the application","concept":"Decoupling components lets them have independent rhythms and lifecycles. A queue absorbs peaks and enables later consumption; publishing to a topic distributes notifications to subscribers. A load balancer routes traffic across targets, and capacity adjustment policies react to measured utilization.","control":"Choose the mechanism by the contract: delivery to one worker, distribution to several recipients, distribution of synchronous requests or capacity adjustment. Queues and topics are often combined when several consumers need retention and independent pacing.","pitfall":"Load balancing distributes traffic across existing targets. Adjusting the number of targets is a separate function.","verify":"Note what happens if the consumer is down for a few minutes. Identify whether the producer waits, whether the message can be handled later and how many consumers receive it.","decisions":[["Amazon SQS","Keeps messages in a queue until they are processed, according to queue and consumer policies."],["Amazon SNS","Publishes a notification to multiple subscribers of a topic."],["Elastic Load Balancing","Distributes connections or requests to healthy targets."],["EC2 Auto Scaling","Adjusts the number of instances in a group according to its configuration."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.2.2-1","prompt":"A service receives more orders than the workers can handle. The producer must respond without waiting for completion, and the orders must remain available for later consumption. Which service should be used?","solution":"Amazon SQS","explanation":"Holds pending work decoupled from the consumers' pace.","options":[["Elastic Load Balancing","Distributes requests to targets without persisting an order backlog."],["Amazon SQS","Holds pending work decoupled from the consumers' pace."],["AWS Lambda without a queue","Runs code, but does not provide the explicit queue the design needs."],["Amazon Route 53","Resolves the destination through DNS; it does not hold messages."]]},{"id":"P-1.2.2-2","prompt":"A confirmation must be distributed to finance, support and audit. Each group must receive the same publication. Which service provides the fan-out?","solution":"Amazon SNS","explanation":"The topic delivers the publication to multiple configured subscribers.","options":[["AWS Budgets","Sends budget alerts, without acting as a generic application topic."],["Amazon SNS","The topic delivers the publication to multiple configured subscribers."],["Amazon EBS","Stores blocks and does not distribute notifications."],["A single SQS queue with three competing consumers","Consumers of the same queue compete for work; by design they do not each receive a copy."]]}],"cue":"An order system produces messages faster than the workers can process them. Which service holds the pending work?","answer":"Amazon SQS","use":"Meets the requirement. Keeps messages in a queue until they are processed, according to queue and consumer policies.","avoid":"Load balancing distributes traffic across existing targets. Adjusting the number of targets is a separate function.","example":"Note what happens if the consumer is down for a few minutes. Identify whether the producer waits, whether the message can be handled later and how many consumers receive it.","detail":[],"legacy":"ficha/1.2.2","params":[["Amazon SQS","Keeps messages in a queue until they are processed, according to queue and consumer policies.","An order system produces messages faster than the workers can process them. Which service holds the pending work?"],["Amazon SNS","Publishes a notification to multiple subscribers of a topic.","The same confirmation must reach independent subscribers of a notification channel. Which service does the fan-out?"],["Elastic Load Balancing","Distributes connections or requests to healthy targets.","A website wants to distribute HTTP requests across healthy targets that are already provisioned. Which function should it use?"],["EC2 Auto Scaling","Adjusts the number of instances in a group according to its configuration.","An EC2 group's capacity must track a utilization target. Which mechanism changes the number of instances?"]],"notes":null},{"code":"1.2.3","id":"1.2.3","domain":1,"task":"1.2","title":"Security, cost and integration choices in the design","concept":"The pillars interact. Isolation and traceability favor security. Forecasting and analyzing spend per business unit guides cost optimization. Reducing repetitive human work and testing changes in small batches improves operational excellence. The explicit requirement defines which evaluation comes first.","control":"Record impact, cost, risk and effort. For cost, look for the lowest spend that still meets the objective. For security, identify identity, access, data, detection and response. For performance, measure the requirement's technical metric before choosing family and capacity.","pitfall":"Enabling a control without verifying its effect does not close the architectural decision.","verify":"Consider the same change as an intervention in two pillars. Identify the metric that supports the argument for each.","decisions":[["Security","Protects identities, data and resources and establishes detection and response."],["Cost optimization","Reduces waste and improves the cost per objective delivered."],["Operational excellence","Automates and improves operational processes and changes."],["Performance efficiency","Selects resources suited to the load and demonstrates performance."]],"docs":[["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"],["Shared responsibility","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"]],"scenarios":[{"id":"P-1.2.3-1","prompt":"The workload review finds exposed credentials and no trail of suspicious actions. The goal is to strengthen identities and detection. Which pillar?","solution":"Security","explanation":"Identity, protection and detection are central to this pillar.","options":[["Sustainability","It does not address environmental impact."],["Performance efficiency","Changing the instance type is not the goal."],["Security","Identity, protection and detection are central to this pillar."],["Reliability","Recovery capability alone does not cover credential exposure."]]},{"id":"P-1.2.3-2","prompt":"The team measures spend per order, removes idle resources and preserves the SLA. Which pillar is guiding the choice?","solution":"Cost optimization","explanation":"The team seeks a better cost per unit of work delivered.","options":[["Operational excellence","Process improvement can help, but the explicit measure is spend."],["Reliability","The SLA is a constraint on the decision, not the variable being optimized."],["Cost optimization","The team seeks a better cost per unit of work delivered."],["Security","The case does not compare permissions or data protection."]]}],"cue":"A review prioritizes preventing credential exposure and detecting misuse. Which pillar?","answer":"Security","use":"Meets the requirement. Protects identities, data and resources and establishes detection and response.","avoid":"Enabling a control without verifying its effect does not close the architectural decision.","example":"Consider the same change as an intervention in two pillars. Identify the metric that supports the argument for each.","detail":[],"legacy":"ficha/1.2.3","params":[["Security","Protects identities, data and resources and establishes detection and response.","A review prioritizes preventing credential exposure and detecting misuse. Which pillar?"],["Cost optimization","Reduces waste and improves the cost per objective delivered.","The explicit goal is to know the spend per order and remove waste without affecting the SLA. Which pillar?"],["Operational excellence","Automates and improves operational processes and changes.","A team introduces runbooks and automated checks for repetitive changes. Which pillar leads?"],["Performance efficiency","Selects resources suited to the load and demonstrates performance.","The team compares query latency across different instance types and measures saturation. Which pillar guides the experiment?"]],"notes":null},{"code":"1.3.1","id":"1.3.1","domain":1,"task":"1.3","title":"Migration and replatforming strategies","concept":"Migration strategies are chosen by the change accepted on the asset and by the destination. Rehost moves the application with little change. Replatform introduces specific optimizations without rewriting the whole solution. Refactor changes architecture and code. Repurchase replaces the product with another, for example SaaS.","control":"Ask whether the application will be moved, adapted, rebuilt or replaced. Retain keeps an asset where it is; retire decommissions it; relocate transfers compatible platforms without changing their workloads individually.","pitfall":"Replacing installed software with a SaaS subscription is repurchase, even if the data is migrated.","verify":"Identify what changes in the code, the database engine, the infrastructure and the operating model.","decisions":[["Rehost","Migrates the application with minimal changes, such as lift and shift to EC2."],["Replatform","Changes part of the platform to gain operational benefits without a major rewrite."],["Refactor","Redesigns the application to take advantage of a different architecture."],["Repurchase","Buys or adopts another product to fulfill the same function."]],"docs":[["Migration strategies","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-1.3.1-1","prompt":"An on-premises application uses a legacy runtime and will be moved to EC2. The deadline does not allow a redesign or a product change. Which strategy?","solution":"Rehost","explanation":"Moves the application while keeping the architecture and stack essentially the same.","options":[["Refactor","Would redesign the application to adopt another architecture."],["Retain","Would keep the asset at the source."],["Repurchase","Would replace the product with another one."],["Rehost","Moves the application while keeping the architecture and stack essentially the same."]]},{"id":"P-1.3.1-2","prompt":"The application keeps its interfaces and rules. The database moves from a self-managed VM to Amazon RDS using the same compatible engine. Which strategy?","solution":"Replatform","explanation":"The platform improves without a broad rewrite of the application.","options":[["Replatform","The platform improves without a broad rewrite of the application."],["Repurchase of the whole application","The application remains the same product."],["Retire","The system remains in operation."],["Rehost with no change in operations","The database starts using a managed service, besides changing location."]]}],"cue":"An application will be moved from on-premises machines to EC2 without redesign. Which strategy?","answer":"Rehost","use":"Meets the requirement. Migrates the application with minimal changes, such as lift and shift to EC2.","avoid":"Replacing installed software with a SaaS subscription is repurchase, even if the data is migrated.","example":"Identify what changes in the code, the database engine, the infrastructure and the operating model.","detail":[],"legacy":"ficha/1.3.1","params":[["Rehost","Migrates the application with minimal changes, such as lift and shift to EC2.","An application will be moved from on-premises machines to EC2 without redesign. Which strategy?"],["Replatform","Changes part of the platform to gain operational benefits without a major rewrite.","The database moves from a VM to RDS, keeping a compatible engine and the application's interfaces. Which strategy characterizes the change?"],["Refactor","Redesigns the application to take advantage of a different architecture.","A monolith is redesigned into decoupled services with new code and contracts. Which strategy?"],["Repurchase","Buys or adopts another product to fulfill the same function.","The company replaces its in-house CRM with a SaaS vendor and imports the records. Which strategy?"]],"notes":null},{"code":"1.3.2","id":"1.3.2","domain":1,"task":"1.3","title":"AWS CAF, assessment and adoption waves","concept":"The AWS Cloud Adoption Framework organizes capabilities into six perspectives: business, people, governance, platform, security and operations. Adoption involves sponsorship, skills and risks beyond moving servers. Inventory, dependencies and waves help choose the pace and sequence of the migration.","control":"Separate organizational transformation from choosing a tool to move data. Assess the value proposition, readiness, compliance and skills. Use a pilot wave with outcome metrics and feedback for the next wave.","pitfall":"CAF guides organizational adoption. Well-Architected focuses on reviewing workloads.","verify":"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.","decisions":[["AWS Cloud Adoption Framework","Guides capabilities and organizational transformation for cloud adoption."],["AWS Well-Architected Framework","Guides architecture reviews and best practices for workloads."],["AWS DMS","Moves data from compatible databases and can capture changes."],["AWS Pricing Calculator","Estimates costs for a planned configuration."]],"docs":[["AWS Cloud Adoption Framework","https://aws.amazon.com/pt/cloud-adoption-framework/"],["Migration strategies","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"]],"scenarios":[{"id":"P-1.3.2-1","prompt":"Before migrating several business areas, the sponsor wants to assess the organization's skills, governance and operations. Which approach guides adoption?","solution":"AWS Cloud Adoption Framework","explanation":"Covers organizational perspectives for the adoption journey.","options":[["AWS DMS","Moves database data, without guiding people management or governance."],["AWS Cloud Adoption Framework","Covers organizational perspectives for the adoption journey."],["AWS Pricing Calculator","Estimates configuration and cost, not organizational maturity."],["AWS Well-Architected Tool","Assesses workloads; it does not resolve enterprise capabilities on its own."]]},{"id":"P-1.3.2-2","prompt":"An architect needs to review an existing workload against the six pillars. They want to discuss security, reliability and the other dimensions of the design. Which reference?","solution":"AWS Well-Architected Framework","explanation":"Organizes the review by architecture pillars.","options":[["AWS CAF","Guides adoption at the organizational level; it is not the six-pillar workload framework."],["AWS Migration Hub","Supports migration tracking, not the requested review."],["AWS Pricing Calculator","Estimates cost for a configuration, without assessing the pillars."],["AWS Well-Architected Framework","Organizes the review by architecture pillars."]]}],"cue":"The sponsor needs to address gaps in people, governance and operations before an enterprise migration. Which reference should be used?","answer":"AWS Cloud Adoption Framework","use":"Meets the requirement. Guides capabilities and organizational transformation for cloud adoption.","avoid":"CAF guides organizational adoption. Well-Architected focuses on reviewing workloads.","example":"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.","detail":[],"legacy":"ficha/1.3.2","params":[["AWS Cloud Adoption Framework","Guides capabilities and organizational transformation for cloud adoption.","The sponsor needs to address gaps in people, governance and operations before an enterprise migration. Which reference should be used?"],["AWS Well-Architected Framework","Guides architecture reviews and best practices for workloads.","An architect wants to review a workload against the six pillars. Which reference should be used?"],["AWS DMS","Moves data from compatible databases and can capture changes.","The initiative has already defined the strategy and needs to move relational data with change capture. Which operational service should be used?"],["AWS Pricing Calculator","Estimates costs for a planned configuration.","The team needs to estimate in advance the cost of a proposed architecture for approval. Which tool should be used?"]],"notes":null},{"code":"1.4.1","id":"1.4.1","domain":1,"task":"1.4","title":"CapEx, OpEx, economies of scale and TCO","concept":"CapEx involves investing in assets used over time. OpEx relates to operating expenses. On-demand consumption makes it possible to replace part of the upfront investment with variable cost. Economies of scale are the potential reduction in unit cost due to the provider's scale; TCO includes the direct and indirect costs of the lifecycle.","control":"Compare the cost of hardware, space, power, licenses, network, operations, downtime and growth. The cloud can reduce overprovisioning, but costs such as data transfer, redundancy and commitments remain in the calculation.","pitfall":"Price per hour is not the same as total cost. Commitments or upfront purchases still exist in the cloud.","verify":"Compare two options with the same volume, growth trend, time frame and SLA.","decisions":[["Trading upfront investment for variable expense","Consumption lets operating expense track usage."],["Economies of scale","The provider's aggregated demand can reduce unit cost."],["Total cost of ownership (TCO)","Considers the whole life of the solution, including expenses that go beyond compute."],["Predictability through commitment","A commitment can lower the price of eligible usage and creates a payment obligation according to the plan."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS pricing","https://aws.amazon.com/pt/pricing/"],["AWS Pricing Calculator","https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html"]],"scenarios":[{"id":"P-1.4.1-1","prompt":"A company stops buying servers before launch. It now pays for the compute used according to demand. Which financial change describes the case?","solution":"Trading upfront investment for variable expense","explanation":"Consumption shifts spending from prior acquisition to operations, based on usage.","options":[["Automatic physical reservation","Paying for usage does not guarantee reserved physical capacity."],["Consolidated billing","Groups bills, without explaining buying or consuming resources."],["Trading upfront investment for variable expense","Consumption shifts spending from prior acquisition to operations, based on usage."],["Long-term commitment","None was made in the scenario."]]},{"id":"P-1.4.1-2","prompt":"The comparison between cloud and data center uses a three-year horizon and includes power, people, licenses, network and migration. Which measure is being built?","solution":"Total cost of ownership","explanation":"Includes direct and indirect costs over the lifecycle.","options":[["Committed-use discount","Describes a pricing instrument, not the whole comparison."],["Total cost of ownership","Includes direct and indirect costs over the lifecycle."],["Unit price of compute","Does not include operating and migration expenses."],["Marginal cost of a request","Reflects one additional unit, not the whole horizon."]]}],"cue":"A startup replaces the upfront purchase of servers with payment proportional to usage. Which economic change?","answer":"Trading upfront investment for variable expense","use":"Meets the requirement. Consumption lets operating expense track usage.","avoid":"Price per hour is not the same as total cost. Commitments or upfront purchases still exist in the cloud.","example":"Compare two options with the same volume, growth trend, time frame and SLA.","detail":[],"legacy":"ficha/1.4.1","params":[["Trading upfront investment for variable expense","Consumption lets operating expense track usage.","A startup replaces the upfront purchase of servers with payment proportional to usage. Which economic change?"],["Economies of scale","The provider's aggregated demand can reduce unit cost.","A provider aggregates demand from thousands of customers to spread structural costs. Which concept?"],["Total cost of ownership (TCO)","Considers the whole life of the solution, including expenses that go beyond compute.","A company compares hardware, labor, migration and network over three years. Which perspective does it use?"],["Predictability through commitment","A commitment can lower the price of eligible usage and creates a payment obligation according to the plan.","The organization accepts paying for an ongoing commitment to lower the price of eligible consumption. Which economic mechanism?"]],"notes":null},{"code":"1.4.2","id":"1.4.2","domain":1,"task":"1.4","title":"Sizing, indirect costs and on-demand environments","concept":"Rightsizing adjusts capacity to the measured profile. Auto Scaling changes the number of resources during use. Shutting down environments that do not need to stay on reduces consumption. Managed services shift infrastructure tasks to the provider and change the team's operating cost.","control":"Separate persistent idle capacity, variation throughout the day, temporarily unused environments and operational effort. Compare after the adjustment at the same service level. Check which resources keep billing after an instance is stopped, such as volumes and eligible addresses.","pitfall":"Stopping an instance does not automatically terminate all associated resources.","verify":"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.","decisions":[["Rightsizing","Adapts the size or type of a resource to measured usage."],["Scheduled shutdown","Reduces the active time of environments that do not need to run outside their window."],["Elasticity with Auto Scaling","Adapts the quantity in response to changes in demand."],["Managed service","Shifts eligible operational tasks to the provider."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS pricing","https://aws.amazon.com/pt/pricing/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-1.4.2-1","prompt":"A service runs 24 hours a day, but CPU and memory usage stays well below what the current family provides, even at peak. The SLA does not change. What should be evaluated first?","solution":"Rightsizing with representative metrics","explanation":"Sizes the resource to the actual CPU and memory pressure without changing the service objective.","options":[["Buy a commitment for the current configuration immediately","Can lock spending into oversized capacity."],["Duplicate resources in another environment","Increases capacity without evidence of need."],["Shut the system down at night without checking demand","The workload has a continuous-operation requirement."],["Rightsizing with representative metrics","Sizes the resource to the actual CPU and memory pressure without changing the service objective."]]},{"id":"P-1.4.2-2","prompt":"The lab only needs to be active on business days during training hours. The resources must remain available for reuse. Which change reduces compute hours?","solution":"Schedule stopping and restarting compatible resources","explanation":"Avoids idle hours while preserving the environment for another day.","options":[["Replace all instances with larger families","Can raise the cost per hour without reducing active time."],["Permanently delete the account after each training session","Does not preserve the resources for reuse."],["Enable consolidated billing","Groups payments, without actually turning compute off."],["Schedule stopping and restarting compatible resources","Avoids idle hours while preserving the environment for another day."]]}],"cue":"An instance stays below 10% utilization for the whole month, even at peak. Which measure should be investigated first?","answer":"Rightsizing","use":"Meets the requirement. Adapts the size or type of a resource to measured usage.","avoid":"Stopping an instance does not automatically terminate all associated resources.","example":"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.","detail":[],"legacy":"ficha/1.4.2","params":[["Rightsizing","Adapts the size or type of a resource to measured usage.","An instance stays below 10% utilization for the whole month, even at peak. Which measure should be investigated first?"],["Scheduled shutdown","Reduces the active time of environments that do not need to run outside their window.","The lab environment only needs to run during business hours. Which adjustment is immediate?"],["Elasticity with Auto Scaling","Adapts the quantity in response to changes in demand.","The application has unpredictable peaks and the goal is to adjust the number of servers in use. Which measure?"],["Managed service","Shifts eligible operational tasks to the provider.","The team wants to reduce the effort of patching the database operating system and running routine backups. Which type of service should be considered?"]],"notes":null},{"code":"2.1.1","id":"2.1.1","domain":2,"task":"2.1","title":"Shared responsibility in EC2, RDS and managed services","concept":"AWS protects the infrastructure of the cloud. The customer protects what it configures and operates within it. In EC2, the customer manages the guest operating system, applications and network controls. With RDS, AWS manages infrastructure components and the service's system; access, configuration and data remain the customer's responsibility.","control":"Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task.","pitfall":"Managed does not mean the provider decides who can read the data.","verify":"List the responsibilities for hardware, guest OS, database engine, credentials and data policies for each option.","decisions":[["Customer on EC2","Manages patches for the guest OS and the installed software."],["AWS on the infrastructure","Protects facilities, hardware and virtualization components."],["AWS on the RDS managed layer","Operates the underlying system of the managed service."],["Customer over data and access","Determines the organization's policies and permissions, including in a managed service."]],"docs":[["Shared responsibility","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.1.1-1","prompt":"An alert points to a vulnerability in the Linux the company uses on its EC2 instances. The underlying hardware is up to date. Who applies the patch to the guest system?","solution":"The customer that operates the instance","explanation":"In EC2, the guest system and its packages are managed by the customer.","options":[["The customer's monitoring service","Detecting a vulnerability does not transfer responsibility for the patch."],["The customer that operates the instance","In EC2, the guest system and its packages are managed by the customer."],["AWS as the operator of the hypervisor","Control of the hypervisor does not include patching the guest."],["The provider's audit","Assesses evidence, without managing the guest OS."]]},{"id":"P-2.1.1-2","prompt":"The team uses Amazon RDS and needs to prevent a new analyst from reading the finance table. Who configures this permission?","solution":"The customer that manages access to the database","explanation":"RDS manages the infrastructure, while the customer determines the users and privileges.","options":[["The customer that manages access to the database","RDS manages the infrastructure, while the customer determines the users and privileges."],["The database engine vendor","Supplying software does not make it responsible for the organization's access."],["Any database user","Should not be able to grant access without administrative privilege."],["AWS as the party responsible for the hardware","Infrastructure control does not define which people read tables."]]}],"cue":"Who must fix a vulnerability in the Linux the company installed on EC2?","answer":"Customer on EC2","use":"Meets the requirement. Manages patches for the guest OS and the installed software.","avoid":"Managed does not mean the provider decides who can read the data.","example":"List the responsibilities for hardware, guest OS, database engine, credentials and data policies for each option.","detail":[],"legacy":"ficha/2.1.1","params":[["Customer on EC2","Manages patches for the guest OS and the installed software.","Who must fix a vulnerability in the Linux the company installed on EC2?"],["AWS on the infrastructure","Protects facilities, hardware and virtualization components.","The audit asks who limits entry to the building that houses the AWS servers. Which responsibility?"],["AWS on the RDS managed layer","Operates the underlying system of the managed service.","An update to the operating system underlying RDS belongs to which layer?"],["Customer over data and access","Determines the organization's policies and permissions, including in a managed service.","In an RDS database, who decides which users get access to the tables?"]],"notes":null},{"code":"2.1.2","id":"2.1.2","domain":2,"task":"2.1","title":"Inherited, shared and customer-specific controls","concept":"Inherited controls are covered by the provider, such as physical infrastructure. Shared controls apply at different layers; for example, AWS patches the infrastructure and the customer patches what it manages. The logical deployment and the application's permissions depend on the customer's requirements.","control":"Avoid using the word shared as an undifferentiated split. Identify the evidence associated with the layer in question. AWS reports support the vendor assessment; the workload's controls also need their own evidence.","pitfall":"An AWS compliance certification does not automatically certify the customer's configuration.","verify":"Split the review into provider evidence, managed controls and the customer's configuration decisions.","decisions":[["Inherited control","The organization relies on the control AWS applies to the physical infrastructure."],["Control shared by layer","The same type of control exists at different levels of responsibility."],["Customer-specific control","The customer designs or configures it according to its own requirements."],["Vendor compliance evidence","AWS reports document the scope of the provider's controls."]],"docs":[["Shared responsibility","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"],["AWS Artifact","https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html"]],"scenarios":[{"id":"P-2.1.2-1","prompt":"The customer includes physical access control to the data center in its matrix, but only AWS operates it. How should it be classified for the customer?","solution":"Inherited control","explanation":"The customer relies on a control of the infrastructure managed by the provider.","options":[["Authorization delegated to an IAM user","IAM does not control physical entry to the data center."],["Application control","The operation is not in the workload's code or configuration."],["Inherited control","The customer relies on a control of the infrastructure managed by the provider."],["Customer-specific control","The customer neither designs nor runs AWS's physical protection."]]},{"id":"P-2.1.2-2","prompt":"In the patching policy, AWS takes care of the infrastructure and the customer takes care of the EC2 guest OS. Which classification is appropriate?","solution":"Control shared by layer","explanation":"The type of control exists on both sides, at different layers.","options":[["Exclusively inherited control","The customer still needs to patch the guest system."],["Control fully transferred to the customer","AWS remains responsible for its infrastructure."],["Physical-only control","It also covers the workload's software."],["Control shared by layer","The type of control exists on both sides, at different layers."]]}],"cue":"For the customer, physical access control to the AWS data center is what type of control?","answer":"Inherited control","use":"Meets the requirement. The organization relies on the control AWS applies to the physical infrastructure.","avoid":"An AWS compliance certification does not automatically certify the customer's configuration.","example":"Split the review into provider evidence, managed controls and the customer's configuration decisions.","detail":[],"legacy":"ficha/2.1.2","params":[["Inherited control","The organization relies on the control AWS applies to the physical infrastructure.","For the customer, physical access control to the AWS data center is what type of control?"],["Control shared by layer","The same type of control exists at different levels of responsibility.","Patching the hypervisor and patching the guest OS illustrate which arrangement?"],["Customer-specific control","The customer designs or configures it according to its own requirements.","The team designs the policy that segments access to the application's data. What type of control?"],["Vendor compliance evidence","AWS reports document the scope of the provider's controls.","An auditor wants formal evidence from an independent audit of AWS. What is being sought?"]],"notes":null},{"code":"2.2.1","id":"2.2.1","domain":2,"task":"2.2","title":"Artifact, Audit Manager and compliance evidence","concept":"AWS Artifact provides on-demand access to compliance reports and agreements. AWS Audit Manager helps collect evidence and track assessments. AWS Config records configurations and evaluates applicable rules. CloudTrail records actions of the covered APIs.","control":"Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit.","pitfall":"A vendor artifact does not show whether your own application configured encryption correctly.","verify":"For four questions from an auditor, state which product provides each piece of evidence.","decisions":[["AWS Artifact","Provides AWS compliance reports and agreements."],["AWS Audit Manager","Structures assessments and collects evidence of controls."],["AWS Config","Records resource configuration and evaluates compliance with rules."],["AWS CloudTrail","Records who called the APIs and when, according to the configured events."]],"docs":[["AWS Artifact","https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html"],["AWS Security — services","https://aws.amazon.com/pt/security/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.2.1-1","prompt":"The legal team needs to download a SOC report about AWS to assess the vendor. It does not want to collect logs from its own account. Which service?","solution":"AWS Artifact","explanation":"Distributes the provider's reports and agreements.","options":[["AWS Config","Keeps resource configuration, not vendor documents."],["AWS Artifact","Distributes the provider's reports and agreements."],["Amazon Inspector","Assesses vulnerabilities; it does not provide the AWS SOC report."],["AWS Audit Manager","Helps structure assessments and collect evidence from the environment."]]},{"id":"P-2.2.1-2","prompt":"A team needs to organize evidence of controls from several accounts in a recurring assessment. Which service was built to help with this?","solution":"AWS Audit Manager","explanation":"Structures assessments and helps collect evidence of controls.","options":[["AWS Artifact alone","Delivers AWS reports and does not aggregate the workload assessment."],["Amazon CloudFront","Distributes content, not evidence of controls."],["AWS Audit Manager","Structures assessments and helps collect evidence of controls."],["AWS CloudFormation","Operates infrastructure stacks, without organizing an audit assessment."]]}],"cue":"The legal team needs to access an AWS SOC audit report. Where should it look?","answer":"AWS Artifact","use":"Meets the requirement. Provides AWS compliance reports and agreements.","avoid":"A vendor artifact does not show whether your own application configured encryption correctly.","example":"For four questions from an auditor, state which product provides each piece of evidence.","detail":[],"legacy":"ficha/2.2.1","params":[["AWS Artifact","Provides AWS compliance reports and agreements.","The legal team needs to access an AWS SOC audit report. Where should it look?"],["AWS Audit Manager","Structures assessments and collects evidence of controls.","The control owner wants to give structure to the continuous collection of evidence for its own assessment. Which service?"],["AWS Config","Records resource configuration and evaluates compliance with rules.","The question is to identify when a resource started violating a configuration rule. Which service?"],["AWS CloudTrail","Records who called the APIs and when, according to the configured events.","Who changed a bucket's policy at 15:00? Which source answers for the call?"]],"notes":null},{"code":"2.2.2","id":"2.2.2","domain":2,"task":"2.2","title":"CloudTrail, CloudWatch and AWS Config","concept":"CloudWatch tracks operational metrics, logs and alarms. CloudTrail records API activity and calls. AWS Config tracks configuration state and rule-based compliance. EventBridge can route events and trigger actions, according to the configured sources and rules.","control":"Map the symptom, the causal event and the current configuration. A high error rate is a metric. Changing a permission is API activity. A volume without the required configuration is a compliance problem. Routing the notification is another step.","pitfall":"The metric answers how much and when an effect occurred, without necessarily identifying the identity that caused it.","verify":"Associate three pieces of evidence from the same incident: alarm, author of the change and configuration snapshot.","decisions":[["Amazon CloudWatch","Metrics, application logs and alarms for the operational state."],["AWS CloudTrail","API activity and a trail of identity actions for the covered events."],["AWS Config","Inventory, history and evaluation of resource configuration."],["Amazon EventBridge","Routes events to targets according to rules."]],"docs":[["AWS CloudTrail guide","https://docs.aws.amazon.com/pt_br/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"],["AWS Config","https://docs.aws.amazon.com/pt_br/config/latest/developerguide/WhatIsConfig.html"],["AWS Security — services","https://aws.amazon.com/pt/security/"]],"scenarios":[{"id":"P-2.2.2-1","prompt":"An API starts returning more HTTP 500 errors in the afternoon. The team needs to be notified when the metric crosses a threshold. Which service?","solution":"Amazon CloudWatch","explanation":"Lets you create an alarm on the operational metric.","options":[["AWS Artifact","Does not analyze metrics or create this alarm."],["Amazon CloudWatch","Lets you create an alarm on the operational metric."],["AWS Config","Evaluates configuration, not the rate of HTTP responses."],["Amazon Inspector","Finds vulnerabilities, without monitoring the operational threshold."]]},{"id":"P-2.2.2-2","prompt":"The access policy changed and the security team needs to know which session made the call. Which source?","solution":"AWS CloudTrail","explanation":"Records management activity and its identity context.","options":[["AWS CloudTrail","Records management activity and its identity context."],["A security group","Controls traffic, without recording who made a change through the API."],["AWS Organizations as a report","Organizes accounts and controls, without replacing the trail of calls."],["Amazon CloudWatch Metrics","Can show the effect, not the identity that changed the policy."]]}],"cue":"The team wants an alarm for an increase in HTTP errors in the service. What should it use?","answer":"Amazon CloudWatch","use":"Meets the requirement. Metrics, application logs and alarms for the operational state.","avoid":"The metric answers how much and when an effect occurred, without necessarily identifying the identity that caused it.","example":"Associate three pieces of evidence from the same incident: alarm, author of the change and configuration snapshot.","detail":[],"legacy":"ficha/2.2.2","params":[["Amazon CloudWatch","Metrics, application logs and alarms for the operational state.","The team wants an alarm for an increase in HTTP errors in the service. What should it use?"],["AWS CloudTrail","API activity and a trail of identity actions for the covered events.","Security needs to associate a policy change with a principal. Which source?"],["AWS Config","Inventory, history and evaluation of resource configuration.","A standard requires detecting a volume that does not comply with a configuration. Which service?"],["Amazon EventBridge","Routes events to targets according to rules.","An application must deliver an event that has already been produced to different targets based on its attributes. Which service?"]],"notes":"2.2.2"},{"code":"2.2.3","id":"2.2.3","domain":2,"task":"2.2","title":"Encryption, certificates and secrets management","concept":"AWS KMS creates and controls keys used by services and applications. Secrets Manager stores secrets and offers rotation mechanisms that can be integrated. ACM issues or imports certificates for compatible integrations. AWS Certificate Manager and KMS solve different layers: TLS identity and control of encryption keys.","control":"Map which secret exists: an application password, a key that protects data or a certificate that validates the TLS session. Compare who can use, rotate, renew and audit the material.","pitfall":"Moving a password to Secrets Manager does not grant the application permission to read it.","verify":"Separate access control, encryption at rest and the network session.","decisions":[["AWS KMS","Manages and controls the use of encryption keys."],["AWS Secrets Manager","Stores secrets and offers integration with rotation."],["AWS Certificate Manager","Manages TLS/SSL certificates in compatible integrations."],["AWS IAM","Determines who can perform actions on resources."]],"docs":[["IAM — best practices","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["AWS Security — services","https://aws.amazon.com/pt/security/"]],"scenarios":[{"id":"P-2.2.3-1","prompt":"The team uses object encryption in S3 and needs to control and audit the use of keys. Which service manages this material?","solution":"AWS KMS","explanation":"Manages keys and usage policies compatible with SSE-KMS.","options":[["AWS Certificate Manager","Manages certificates, not the keys S3 uses in this case."],["AWS KMS","Manages keys and usage policies compatible with SSE-KMS."],["AWS Secrets Manager","Manages secrets such as passwords, without being the key service for SSE-KMS."],["Amazon Macie","Discovers sensitive data, without providing the encryption key."]]},{"id":"P-2.2.3-2","prompt":"An application needs to retrieve the database password and adopt an integrated rotation process. Which service covers both needs?","solution":"AWS Secrets Manager","explanation":"Stores the secret and offers compatible rotation mechanisms.","options":[["AWS Secrets Manager","Stores the secret and offers compatible rotation mechanisms."],["AWS KMS alone","Can protect data, but does not store and rotate the password as a managed secret."],["IAM Identity Center","Centralizes human access to AWS; it does not distribute the application's password."],["AWS Artifact","Provides compliance documentation, not secrets."]]}],"cue":"The organization wants to manage the keys used to encrypt S3 objects. Which service?","answer":"AWS KMS","use":"Meets the requirement. Manages and controls the use of encryption keys.","avoid":"Moving a password to Secrets Manager does not grant the application permission to read it.","example":"Separate access control, encryption at rest and the network session.","detail":[],"legacy":"ficha/2.2.3","params":[["AWS KMS","Manages and controls the use of encryption keys.","The organization wants to manage the keys used to encrypt S3 objects. Which service?"],["AWS Secrets Manager","Stores secrets and offers integration with rotation.","An application needs to retrieve a database password that is rotated periodically. What should it use?"],["AWS Certificate Manager","Manages TLS/SSL certificates in compatible integrations.","The team wants to manage an HTTPS endpoint certificate integrated with a compatible load balancer. Which service?"],["AWS IAM","Determines who can perform actions on resources.","The problem is determining which identity can read a secret or use a key. Which service models access?"]],"notes":null},{"code":"2.3.1","id":"2.3.1","domain":2,"task":"2.3","title":"Workload identity, privileges and root","concept":"IAM controls identity and authorization. An assumed role uses temporary credentials. Workloads such as EC2 and Lambda should receive an appropriate role. The root account has broad privileges and should be protected with MFA and reserved for specific tasks. Long-term credentials inherent to IAM users require justification and management.","control":"Distinguish the trust policy, which controls who assumes the role, from the permission policy, which controls the actions authorized after assuming it. The principle of least privilege covers actions, resources and conditions. For a person, prefer federation and temporary sessions where applicable.","pitfall":"Putting long-term access keys in code or in an AMI creates exposure and makes rotation hard.","verify":"Identify who runs it, which action it needs, which resource it may access and how it obtains credentials.","decisions":[["IAM role with temporary credentials","Suited to workloads and sessions that need to assume permissions."],["Root user protected by MFA","Reserved for tasks that require root and protected by the additional control."],["Permission policy","Defines the actions, resources and conditions authorized for the identity."],["Trust policy","Defines who can assume a role."]],"docs":[["IAM — best practices","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["Shared responsibility","https://aws.amazon.com/pt/compliance/shared-responsibility-model/"]],"scenarios":[{"id":"P-2.3.1-1","prompt":"An EC2 application reads an S3 prefix. The company wants temporary credentials with no keys in the code or the image. Which choice?","solution":"Attach an IAM role to the instance","explanation":"The application obtains temporary credentials with the role's permissions.","options":[["Make the prefix public","Avoids authentication at the cost of exposing the data."],["Attach an IAM role to the instance","The application obtains temporary credentials with the role's permissions."],["Share the root account credentials","Widens privileges and breaks identity separation."],["Embed an IAM user's keys in the image","Creates a permanent secret distributed to every instance."]]},{"id":"P-2.3.1-2","prompt":"The account has just been created. There is an identity that must receive strong protection and be reserved for the tasks only it can perform. Which identity?","solution":"Root user with MFA","explanation":"Root has broad authority and requires specific controls.","options":[["Root user with MFA","Root has broad authority and requires specific controls."],["Federated developer identity","It is for day-to-day use with assigned permissions."],["Cost-reading user","It is an operational identity, not the one reserved for exclusive tasks."],["Lambda execution role","Runs the workload with its own privileges, without being the account owner."]]}],"cue":"An EC2 instance needs to read objects without distributing permanent keys to the application. Which choice?","answer":"IAM role with temporary credentials","use":"Meets the requirement. Suited to workloads and sessions that need to assume permissions.","avoid":"Putting long-term access keys in code or in an AMI creates exposure and makes rotation hard.","example":"Identify who runs it, which action it needs, which resource it may access and how it obtains credentials.","detail":[],"legacy":"ficha/2.3.1","params":[["IAM role with temporary credentials","Suited to workloads and sessions that need to assume permissions.","An EC2 instance needs to read objects without distributing permanent keys to the application. Which choice?"],["Root user protected by MFA","Reserved for tasks that require root and protected by the additional control.","Which identity must use MFA and remain reserved for tasks exclusive to the account owner?"],["Permission policy","Defines the actions, resources and conditions authorized for the identity.","The role is already assumed, but it must be authorized to read a single resource. Which type of policy expresses the scope?"],["Trust policy","Defines who can assume a role.","Which policy determines which principals can assume a role?"]],"notes":null},{"code":"2.3.2","id":"2.3.2","domain":2,"task":"2.3","title":"Human access and multi-account management","concept":"AWS IAM Identity Center centralizes people's access to accounts and applications. AWS Organizations groups accounts and applies limits, such as SCPs, based on the organizational structure. An SCP limits the possible permissions in the applicable accounts and does not grant access. AWS Control Tower helps establish and govern a multi-account landing zone.","control":"Compare directory, limits, effective permissions and account provisioning. Permission sets map access in Identity Center. SCPs are organizational controls. A governed account still needs the appropriate permissions on the resource.","pitfall":"A maximum-permission SCP never replaces the policies that actually grant access.","verify":"Draw a person's session in two accounts and a guardrail that applies to the whole OU.","decisions":[["AWS IAM Identity Center","Centralizes federated human access and account assignments."],["AWS Organizations with SCPs","Applies organizational limits to the accounts and OUs in scope."],["AWS Control Tower","Orchestrates the setup and governance of a landing zone."],["IAM policy","Expresses the identity's permissions, subject to the other limits."]],"docs":[["IAM — best practices","https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html"],["AWS Organizations — concepts","https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html"]],"scenarios":[{"id":"P-2.3.2-1","prompt":"Employees need to sign in to several accounts through the same login experience, with different permissions in each. Which service?","solution":"AWS IAM Identity Center","explanation":"Centralizes human access and account assignments.","options":[["AWS IAM Identity Center","Centralizes human access and account assignments."],["AWS Direct Connect","Offers dedicated connectivity, without managing the company's identities."],["A single role with permanent credentials for everyone","Does not provide federation and per-account profiles with traceability."],["AWS Config","Evaluates resource configuration; it does not provide a federated portal."]]},{"id":"P-2.3.2-2","prompt":"Security wants to block an action for all member accounts of an OU, even if someone grants that action in a local policy. Which control?","solution":"AWS Organizations SCP","explanation":"Defines the boundary of available permissions at the organizational scope.","options":[["A common tag applied to resources","Labels do not deny actions without an associated policy."],["Local password policy","Controls credential requirements, not which APIs are allowed."],["Access control on the logs bucket","Limits one resource, not the whole OU."],["AWS Organizations SCP","Defines the boundary of available permissions at the organizational scope."]]}],"cue":"Employees need a central portal to access several accounts with different profiles. Which service?","answer":"AWS IAM Identity Center","use":"Meets the requirement. Centralizes federated human access and account assignments.","avoid":"A maximum-permission SCP never replaces the policies that actually grant access.","example":"Draw a person's session in two accounts and a guardrail that applies to the whole OU.","detail":[],"legacy":"ficha/2.3.2","params":[["AWS IAM Identity Center","Centralizes federated human access and account assignments.","Employees need a central portal to access several accounts with different profiles. Which service?"],["AWS Organizations with SCPs","Applies organizational limits to the accounts and OUs in scope.","The central team wants to prevent an action in the accounts of an entire OU. Which mechanism?"],["AWS Control Tower","Orchestrates the setup and governance of a landing zone.","Which service helps establish a multi-account landing zone with controls and governed account creation?"],["IAM policy","Expresses the identity's permissions, subject to the other limits.","An SCP allows the action to be available, but the operator did not receive it in their role. What grants the action?"]],"notes":null},{"code":"2.4.1","id":"2.4.1","domain":2,"task":"2.4","title":"Threat detection, vulnerabilities and posture","concept":"GuardDuty identifies signs of threats from supported sources. Inspector assesses vulnerabilities and exposures for compatible workloads. Security Hub aggregates findings and helps manage posture. Macie identifies sensitive data in S3 buckets.","control":"Choose by the evidence: threat behavior, CVE, consolidated view or data classification. One tool can generate findings that another consumes. Investigate the cause and address the corresponding resource instead of confusing centralization with generating the finding.","pitfall":"Macie is not a generic container image scanner or a firewall service.","verify":"Use a table of fictitious incidents and identify the first service to engage and where to consolidate the finding.","decisions":[["Amazon GuardDuty","Detects signs of potentially malicious activity."],["Amazon Inspector","Identifies vulnerabilities in compatible workloads."],["AWS Security Hub","Centralizes findings and posture controls."],["Amazon Macie","Discovers and classifies sensitive data in S3."]],"docs":[["AWS Security — services","https://aws.amazon.com/pt/security/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-2.4.1-1","prompt":"Security wants to identify signs of malicious activity from the behavior observed in compatible account and network sources. Which service should it focus on?","solution":"Amazon GuardDuty","explanation":"Analyzes threat signals in supported sources.","options":[["Amazon Inspector","Prioritizes workload vulnerabilities, which are another type of evidence."],["AWS Artifact","Provides the provider's documents, without detecting behavior."],["AWS Shield as a credential scanner","DDoS protection is not detection of suspicious credential activity."],["Amazon GuardDuty","Analyzes threat signals in supported sources."]]},{"id":"P-2.4.1-2","prompt":"A team publishes images to a compatible repository. Before deploying, it wants to identify CVEs in the image's packages. Which service?","solution":"Amazon Inspector","explanation":"Assesses vulnerabilities in compatible images.","options":[["AWS Health","Shows service events, not vulnerable packages in the image."],["Amazon Macie","Looks for sensitive data in S3 objects, not CVEs in packages."],["AWS WAF","Filters HTTP requests, without assessing libraries in images."],["Amazon Inspector","Assesses vulnerabilities in compatible images."]]}],"cue":"The team wants to detect threat activity from sources such as compatible events and flows. Which service?","answer":"Amazon GuardDuty","use":"Meets the requirement. Detects signs of potentially malicious activity.","avoid":"Macie is not a generic container image scanner or a firewall service.","example":"Use a table of fictitious incidents and identify the first service to engage and where to consolidate the finding.","detail":[],"legacy":"ficha/2.4.1","params":[["Amazon GuardDuty","Detects signs of potentially malicious activity.","The team wants to detect threat activity from sources such as compatible events and flows. Which service?"],["Amazon Inspector","Identifies vulnerabilities in compatible workloads.","The team wants to identify CVEs in compatible container images. Which service?"],["AWS Security Hub","Centralizes findings and posture controls.","Security wants to consolidate findings from protection services and monitor posture. Which service?"],["Amazon Macie","Discovers and classifies sensitive data in S3.","Personal identification numbers need to be located in S3 objects. Which service?"]],"notes":null},{"code":"2.4.2","id":"2.4.2","domain":2,"task":"2.4","title":"WAF, Shield, Firewall Manager and network controls","concept":"AWS WAF protects web applications with HTTP-layer rules. AWS Shield offers protection against DDoS. Firewall Manager helps apply firewall policies centrally across multiple accounts. Security groups control the network traffic of associated resources with stateful rules.","control":"Locate the layer and the scale: HTTP content, volumetric flooding, governance across accounts or interface traffic. HTTP rules can filter request patterns. Multi-account policies can coordinate the configuration of these compatible controls.","pitfall":"WAF is not the automatic answer to every question about traffic or networking.","verify":"Classify four requests: HTTP pattern, DDoS, central management and database port.","decisions":[["AWS WAF","Filters web requests at compatible integration points."],["AWS Shield","Protects compatible workloads against DDoS."],["AWS Firewall Manager","Applies and manages firewall policies centrally across multiple accounts."],["Security group","Controls network flows of the associated resources with stateful rules."]],"docs":[["AWS Security — services","https://aws.amazon.com/pt/security/"],["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-2.4.2-1","prompt":"The website has to block HTTP requests based on patterns in the header. Controlling addresses or ports is not enough. Which service?","solution":"AWS WAF","explanation":"The rules analyze attributes of web requests in supported integrations.","options":[["Amazon Inspector","Assesses vulnerabilities; it does not apply these rules to traffic."],["Network ACL","Filters by network criteria, without inspecting the HTTP header."],["AWS WAF","The rules analyze attributes of web requests in supported integrations."],["AWS KMS","Manages keys; it does not inspect requests."]]},{"id":"P-2.4.2-2","prompt":"A public endpoint needs protection against distributed attack traffic. The concern is staying available under DDoS. Which offering?","solution":"AWS Shield","explanation":"Protects against distributed denial-of-service attacks according to its coverage.","options":[["AWS Shield","Protects against distributed denial-of-service attacks according to its coverage."],["Amazon Macie","Classifies data in S3; it does not protect an endpoint against flooding."],["AWS Config","Evaluates resource compliance, without handling overload in transit."],["AWS Secrets Manager","Protects secrets, without mitigating external traffic volume."]]}],"cue":"The team needs to block malicious patterns in HTTP requests to the website. Which service?","answer":"AWS WAF","use":"Meets the requirement. Filters web requests at compatible integration points.","avoid":"WAF is not the automatic answer to every question about traffic or networking.","example":"Classify four requests: HTTP pattern, DDoS, central management and database port.","detail":[],"legacy":"ficha/2.4.2","params":[["AWS WAF","Filters web requests at compatible integration points.","The team needs to block malicious patterns in HTTP requests to the website. Which service?"],["AWS Shield","Protects compatible workloads against DDoS.","The dominant concern is protection against distributed denial-of-service attacks. Which offering?"],["AWS Firewall Manager","Applies and manages firewall policies centrally across multiple accounts.","An administrator wants consistent AWS WAF policies across s
