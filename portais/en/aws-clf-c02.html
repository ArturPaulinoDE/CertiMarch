 threat behavior, CVE, consolidated view or data classification. One tool can generate findings that another consumes. Investigate the cause and address the corresponding resource instead of confusing centralization with generating the finding.\"],\"tone\":\"blue\"},{\"h\":\"2.4.2 · WAF, Shield, Firewall Manager and network controls\",\"items\":[\"AWS WAF protects web applications with HTTP-layer rules. AWS Shield offers protection against DDoS. Firewall Manager helps apply firewall policies centrally across multiple accounts. Security groups control the network traffic of associated resources with stateful rules.\",\"Locate the layer and the scale: HTTP content, volumetric flooding, governance across accounts or interface traffic. HTTP rules can filter request patterns. Multi-account policies can coordinate the configuration of these compatible controls.\"],\"tone\":\"blue\"},{\"h\":\"2.4.3 · Defense in depth and subnet access\",\"items\":[\"Security groups control flows at the interfaces and are stateful. Network ACLs apply at the subnet boundary, can allow and deny, and are stateless. WAF acts on application requests. IAM controls who can use APIs and manage resources.\",\"Decide by reach: resource, subnet, request or identity. In a stateless control, allow the return traffic according to the contract. A security rule in one layer does not widen access when another layer denies it.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Use a table of fictitious incidents and identify the first service to engage and where to consolidate the finding.\",\"Classify four requests: HTTP pattern, DDoS, central management and database port.\",\"Given an access to a website, break down the decisions by layer and identify where to show the effect.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Macie is not a generic container image scanner or a firewall service.\",\"WAF is not the automatic answer to every question about traffic or networking.\",\"Security groups allow traffic through allow rules. Explicitly blocking a range is a feature of Network ACLs when applied to the subnet.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.1\",\"d\":3,\"k\":\"Deployment and operation methods\",\"title\":\"Deployment and operation methods\",\"sub\":\"Objectives 3.1.1, 3.1.2\",\"desc\":\"Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment.\",\"quick\":[[\"A professional needs to explore an account's resources through a visual interface. Which method?\",\"AWS Management Console\"],[\"The API runs on AWS and uses the factory database that remains on premises. Which model?\",\"Hybrid\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"AWS Management Console\",\"Graphical interface for human use and one-off operations.\",\"A professional needs to explore an account's resources through a visual interface. Which method?\"],[\"AWS CLI\",\"Command interface for interactive routines or scripts.\",\"A terminal script lists buckets periodically and runs signed commands. Which interface?\"],[\"AWS SDK\",\"Libraries for calling services from an application's code.\",\"A Java application needs to call an AWS service through an official library. Which interface?\"],[\"AWS CloudFormation\",\"Declarative templates and stack lifecycle.\",\"The infrastructure must be replicated and reviewed as a declarative definition. Which method?\"],[\"Cloud-only\",\"The workload's components run on AWS with no on-premises dependencies described.\",\"The application and data run entirely on AWS resources. Which model was described?\"],[\"Hybrid\",\"On-premises and AWS components operate in an integrated way.\",\"The API runs on AWS and uses the factory database that remains on premises. Which model?\"],[\"On-premises\",\"The workload stays on on-premises infrastructure.\",\"Processing and data stay exclusively in the organization's private data center, with no AWS services. Which model?\"],[\"AWS Outposts\",\"Extends AWS infrastructure and compatible services to the customer's site.\",\"The company needs compatible AWS services in its own data center for low local latency. Which option should it evaluate?\"]]}],\"cards\":[{\"h\":\"3.1.1 · Console, CLI, SDK and infrastructure as code\",\"items\":[\"The console provides a web interface. The CLI performs operations by command or script. SDKs integrate AWS calls into code. CloudFormation defines resources and dependencies declaratively, with stacks and trackable changes.\",\"Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment.\"],\"tone\":\"blue\"},{\"h\":\"3.1.2 · Cloud, hybrid and on-premises deployment\",\"items\":[\"In the cloud, the workload uses the provider's infrastructure. Hybrid integrates on-premises and cloud resources in the same process. On-premises keeps resources on site. Outposts extends compatible AWS services and infrastructure to the customer's facilities, within their operating requirements.\",\"Ask where compute and data run and whether there is operational integration between environments. Latency constraints, legacy dependencies or residency may require an on-premises presence even if other parts migrate.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Classify an operational task in each category and identify where to store the definition.\",\"Trace the path of a transaction, highlighting the environment where the application, the database and operations run.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"The CLI automates actions, but using it does not by itself describe the whole configuration as a declarative state.\",\"Using AWS in one Region does not make the architecture hybrid if no operational component remains outside it.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.2\",\"d\":3,\"k\":\"Global infrastructure\",\"title\":\"Global infrastructure\",\"sub\":\"Objectives 3.2.1\",\"desc\":\"Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state.\",\"quick\":[[\"A law requires a specific country for storing primary data. Which geographic level should be selected?\",\"AWS Region\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"AWS Region\",\"Geographic choice for residency, latency and available services.\",\"A law requires a specific country for storing primary data. Which geographic level should be selected?\"],[\"Availability Zone\",\"An isolated failure domain within a Region.\",\"The idea is to separate components so that a localized failure does not take both down within the same Region. Which unit?\"],[\"Edge location\",\"A point of presence that brings delivery services closer to users.\",\"The company wants to deliver cached content close to international users. Which infrastructure?\"],[\"Multi-Region strategy\",\"Runs or recovers workloads in more than one Region when requirements justify it.\",\"The requirement includes a prolonged outage of an entire Region. Which scope should be planned?\"]]}],\"cards\":[{\"h\":\"3.2.1 · Regions, zones, edge and geographic criteria\",\"items\":[\"A Region is a geographic area. An Availability Zone groups one or more data centers isolated from other zones, with low-latency connectivity within the Region. Points of presence deliver edge services. Choosing a Region involves residency, proximity, cost and service availability.\",\"Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Explain data location, delivery edge and failure domain separately.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Using CloudFront does not automatically replicate the database across Regions.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.3\",\"d\":3,\"k\":\"Compute\",\"title\":\"Compute\",\"sub\":\"Objectives 3.3.1, 3.3.2\",\"desc\":\"Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda.\",\"quick\":[[\"A piece of software requires choosing the OS and installing an agent directly on the guest system. Which choice?\",\"Amazon EC2\"],[\"A group must increase and decrease the number of EC2 instances based on demand. Which component?\",\"EC2 Auto Scaling\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon EC2\",\"Virtual machines for workloads that require control of the instance environment.\",\"A piece of software requires choosing the OS and installing an agent directly on the guest system. Which choice?\"],[\"AWS Lambda\",\"Managed functions triggered by invocation or events.\",\"When an object arrives, a short task adjusts its metadata. Which service?\"],[\"AWS Fargate\",\"Managed compute capacity for containers in compatible integrations.\",\"The tasks are already ECS containers and the team does not want to operate nodes. Which capacity?\"],[\"Amazon EKS\",\"Managed Kubernetes, with different compute options.\",\"The team wants to keep its manifests and the Kubernetes API with a managed control plane. Which service?\"],[\"EC2 Auto Scaling\",\"Adjusts the capacity of a group of instances.\",\"A group must increase and decrease the number of EC2 instances based on demand. Which component?\"],[\"Application Load Balancer\",\"Balances HTTP traffic and routes by host or path, according to rules.\",\"The front end needs to send /payments and /orders to different targets. Which type of load balancer?\"],[\"Network Load Balancer\",\"Balances transport traffic for protocols such as TCP.\",\"The service is TCP and needs transport-layer load balancing. Which option?\"],[\"Amazon CloudFront\",\"Delivers content globally through an edge distribution.\",\"The central requirement is to cache static content close to users. Which service?\"]]}],\"cards\":[{\"h\":\"3.3.1 · EC2, Lambda, containers and Fargate\",\"items\":[\"EC2 provides virtual machine capacity and control of the guest system. Lambda runs event-driven functions within managed limits. ECS and EKS orchestrate containers; Fargate is a managed capacity option compatible with both, depending on the workload and configuration.\",\"Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda.\"],\"tone\":\"blue\"},{\"h\":\"3.3.2 · Integrating capacity and traffic in the application\",\"items\":[\"Auto Scaling adapts the capacity of a group. ELB routes connections to healthy targets. An ALB works with HTTP/HTTPS and can route by application attributes; an NLB works at the transport layer for compatible protocols.\",\"Distinguish growing capacity, routing application traffic, distributing transport and publishing cached content globally. Use health checks and policies calibrated to the requirement.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Identify duration, state, need for host access and activation pattern.\",\"Simulate an unhealthy target and a traffic increase; observe which components act.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Fargate is not an orchestrator that replaces ECS or EKS.\",\"Installing a load balancer does not change the number of instances without scaling integration.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.4\",\"d\":3,\"k\":\"Databases\",\"title\":\"Databases\",\"sub\":\"Objectives 3.4.1, 3.4.2\",\"desc\":\"Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance.\",\"quick\":[[\"The application queries carts mainly by customer ID, with predictable key-based access. Which service?\",\"Amazon DynamoDB\"],[\"Tables must be copied while continuing to capture changes as the source stays active. Which service?\",\"AWS Database Migration Service\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon RDS\",\"Managed relational database with compatible engines.\",\"The team wants to host a SQL Server database in a compatible managed relational service. Which service?\"],[\"Amazon Aurora\",\"AWS relational engine compatible with MySQL or PostgreSQL.\",\"The requirement explicitly identifies the relational engine developed by AWS with PostgreSQL compatibility. Which one?\"],[\"Amazon DynamoDB\",\"Managed NoSQL database designed for key-based access patterns.\",\"The application queries carts mainly by customer ID, with predictable key-based access. Which service?\"],[\"Amazon Redshift\",\"Warehouse for analytics and aggregations at scale.\",\"Analysts aggregate several years of facts for BI and need a warehouse. Which one?\"],[\"AWS Database Migration Service\",\"Moves data and can replicate changes between compatible sources and targets.\",\"Tables must be copied while continuing to capture changes as the source stays active. Which service?\"],[\"DMS Schema Conversion\",\"Assesses and helps convert objects and code between compatible engines.\",\"A team needs to identify incompatible SQL objects when changing engines. Which feature?\"],[\"Amazon ElastiCache\",\"Managed in-memory cache to speed up eligible read patterns.\",\"The application repeats session reads and wants to reduce pressure on the primary database. Which service?\"],[\"Amazon RDS\",\"Provides managed relational engines to serve the workload.\",\"The migration is finished and the requirement is to operate the managed relational database at the destination. Which one?\"]]}],\"cards\":[{\"h\":\"3.4.1 · RDS, Aurora, DynamoDB and Redshift\",\"items\":[\"Amazon RDS hosts managed relational engines. Aurora is a relational engine offered by AWS, compatible with MySQL or PostgreSQL depending on the edition. DynamoDB is a key-value/document NoSQL database. Redshift is an analytical data warehouse. The access pattern comes before the choice.\",\"Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance.\"],\"tone\":\"blue\"},{\"h\":\"3.4.2 · Database migration, schema conversion and caching\",\"items\":[\"DMS moves data and changes from compatible sources. DMS Schema Conversion helps assess and convert database schema and code in eligible heterogeneous migrations. ElastiCache keeps data in memory to speed up access. RDS provides the managed environment for the target database when appropriate.\",\"Separate moving data, converting structure, operating the target and accelerating reads. Changing engines adds compatibility of types, SQL and procedural code. Compare result validation and the cutover plan.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Compare key-based access, related updates and analytical queries over a large history.\",\"In an Oracle → PostgreSQL migration, classify the assessment, conversion, load, CDC and serving tasks.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Having SQL does not turn every relational database into a warehouse optimized for analytical aggregations.\",\"A migration with CDC does not automatically guarantee that stored procedures work on the new engine.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.5\",\"d\":3,\"k\":\"Networking\",\"title\":\"Networking\",\"sub\":\"Objectives 3.5.1, 3.5.2\",\"desc\":\"Separate address space, name resolution, HTTP delivery and transport path. The requirement for a fixed IP or for caching distinguishes strategies that look similar.\",\"quick\":[[\"The team needs to create public and private subnets in an isolated network. Which service?\",\"Amazon VPC\"],[\"A branch office needs encrypted communication through an IPsec tunnel between networks. Which option?\",\"AWS Site-to-Site VPN\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon VPC\",\"Provides an isolated virtual network and subnet controls.\",\"The team needs to create public and private subnets in an isolated network. Which service?\"],[\"Amazon Route 53\",\"Resolves domains and applies DNS routing policies.\",\"The team needs to manage the records of an application domain. Which service?\"],[\"Amazon CloudFront\",\"Distributes web content from the edge with caching options.\",\"A publisher wants the site's images to be served from a cache close to readers. Which service?\"],[\"AWS Global Accelerator\",\"Uses static IP addresses and the global network for compatible TCP/UDP traffic.\",\"Partners require fixed IPs and the TCP traffic must take advantage of the AWS global backbone. Which product?\"],[\"AWS Site-to-Site VPN\",\"Connects networks with IPsec tunnels.\",\"A branch office needs encrypted communication through an IPsec tunnel between networks. Which option?\"],[\"AWS Direct Connect\",\"Provides dedicated, predictable connectivity to AWS.\",\"The data center requires a long-term dedicated connection to AWS. Which option?\"],[\"Public NAT gateway\",\"Lets private instances initiate traffic to internet destinations.\",\"Private instances need to download patches from the internet without accepting externally initiated connections. Which component?\"],[\"VPC endpoint\",\"Provides a private path to compatible services.\",\"The company wants to call a compatible AWS service from the VPC without going over the internet. Which feature?\"]]}],\"cards\":[{\"h\":\"3.5.1 · VPC, DNS and global content delivery\",\"items\":[\"A VPC is an isolated virtual network divided into subnets. Route 53 provides DNS and DNS routing policies. CloudFront delivers content from the edge, with caching according to configuration. Global Accelerator uses the AWS global network to accelerate TCP/UDP traffic and offer static IPs for compatible endpoints.\",\"Separate address space, name resolution, HTTP delivery and transport path. The requirement for a fixed IP or for caching distinguishes strategies that look similar.\"],\"tone\":\"blue\"},{\"h\":\"3.5.2 · Hybrid connectivity and network egress\",\"items\":[\"Site-to-Site VPN establishes IPsec tunnels. Direct Connect provides a dedicated connection from the environment to AWS, with encryption handled according to the design. A public NAT gateway lets resources in private subnets reach the internet without accepting connections initiated from the internet. VPC endpoints offer private paths to compatible services.\",\"Choose by source, destination and whether the public internet must be relied upon. Distinguish office-to-cloud connectivity from private access to an AWS service.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Trace an access from the DNS name to the IP and then to the application endpoint.\",\"Describe the paths to the AWS API, to the office and for downloading patches from the internet.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Changing DNS can influence where traffic goes. It does not cache content.\",\"Direct Connect does not automatically encrypt all traffic.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.6\",\"d\":3,\"k\":\"Storage\",\"title\":\"Storage\",\"sub\":\"Objectives 3.6.1, 3.6.2\",\"desc\":\"Decide first by the required interface: object, block, shared Linux file or a specific file system. Only then evaluate capacity, latency, throughput and cost.\",\"quick\":[[\"The system writes images as objects and accesses them by key in a bucket. Which service?\",\"Amazon S3\"],[\"The access pattern is unpredictable and the company wants automatic adjustment based on observed activity. Which class?\",\"S3 Intelligent-Tiering\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon S3\",\"Stores objects in buckets and serves applications that use the object API.\",\"The system writes images as objects and accesses them by key in a bucket. Which service?\"],[\"Amazon EBS\",\"Provides block volumes for compatible EC2 instances.\",\"A block boot volume is needed for an EC2 instance. Which one?\"],[\"Amazon EFS\",\"Managed, elastic NFS file system for sharing.\",\"Several Linux instances mount the same shared directory over NFS. Which service?\"],[\"Amazon FSx for Windows File Server\",\"Managed Windows file system over SMB.\",\"Windows applications need a managed SMB share. Which product?\"],[\"S3 Standard\",\"For frequently accessed data with low latency.\",\"The application serves heavily accessed objects and needs low latency day to day. Which class?\"],[\"S3 Standard-IA\",\"For infrequently accessed data that still requires immediate retrieval.\",\"Reads are infrequent, but any object must be readily accessible when needed. Which class?\"],[\"S3 Intelligent-Tiering\",\"For data whose access is unknown or changes over time.\",\"The access pattern is unpredictable and the company wants automatic adjustment based on observed activity. Which class?\"],[\"S3 Glacier Deep Archive\",\"For long retention with rare access and restores that can tolerate waiting.\",\"Regulatory records go years without being read and a restore can take hours. Which class?\"]]}],\"cards\":[{\"h\":\"3.6.1 · S3, EBS, EFS and FSx by access interface\",\"items\":[\"S3 is object storage with its own APIs. EBS is block storage for EC2 instances. EFS offers an elastic NFS file system for compatible clients. FSx offers managed file systems, such as Windows File Server, Lustre, OpenZFS and ONTAP, with different roles.\",\"Decide first by the required interface: object, block, shared Linux file or a specific file system. Only then evaluate capacity, latency, throughput and cost.\"],\"tone\":\"blue\"},{\"h\":\"3.6.2 · S3 classes, archiving, backup and retention\",\"items\":[\"S3 Standard serves frequent access. Standard-IA keeps fast access with storage and retrieval conditions. Intelligent-Tiering moves objects between tiers suited to the observed pattern, with costs and eligibility rules. Glacier Deep Archive serves long-term archiving with planned retrieval.\",\"Compare frequency, tolerated retrieval time, transition costs, redundancy and the applicable minimum duration. Lifecycle automates transitions and expiration. Versioning preserves versions according to policy and interacts with expiration.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Identify the protocol and sharing pattern before choosing the storage class.\",\"Build a matrix for hot, cold, unpredictable and data archived for years.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Using S3 as the destination of a data lake does not make it a block volume for installing an EC2 operating system.\",\"Storage price per GB alone does not account for access, retrieval, requests or minimum duration.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.7\",\"d\":3,\"k\":\"AI, ML and analytics\",\"title\":\"AI, ML and analytics\",\"sub\":\"Objectives 3.7.1, 3.7.2\",\"desc\":\"Identify whether the step queries the lake, transforms and catalogs, serves queries in a warehouse or presents the information. Consider recurrence, sources, cost per query and access patterns.\",\"quick\":[[\"Analysts want to query Parquet files in S3 with SQL, without provisioning a warehouse. Which tool?\",\"Amazon Athena\"],[\"The company wants to extract field values from scanned forms. Which service?\",\"Amazon Textract\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon Athena\",\"Runs serverless SQL over data in the lake and compatible sources.\",\"Analysts want to query Parquet files in S3 with SQL, without provisioning a warehouse. Which tool?\"],[\"AWS Glue\",\"Provides integration, ETL and catalog engines.\",\"The step needs to discover metadata and run managed integration. Which service?\"],[\"Amazon Redshift\",\"Provides a data warehouse for large-scale analytics.\",\"The requirement is to operate an analytical warehouse for large structured datasets and frequent reports. Which one?\"],[\"BI layer, such as Amazon QuickSight\",\"Presents dashboards and analyses to consumers.\",\"The data is already queryable and the requirement is to give managers interactive charts. Which layer?\"],[\"Amazon Textract\",\"Extracts text and structures such as tables and fields from supported documents.\",\"The company wants to extract field values from scanned forms. Which service?\"],[\"Amazon Rekognition\",\"Analyzes images or video in compatible recognition tasks.\",\"The problem is classifying objects in photographs, without form OCR. Which service?\"],[\"Amazon Comprehend\",\"Applies natural language analysis to text.\",\"A team wants to identify sentiment in text comments without training a model. Which one?\"],[\"Amazon Bedrock\",\"Offers managed foundation models and features for generative applications.\",\"The requirement is to generate summaries with foundation models through a managed API. Which service?\"]]}],\"cards\":[{\"h\":\"3.7.1 · Analytics: Athena, Glue, Redshift and visualization\",\"items\":[\"Athena queries data with SQL without managing servers, often in S3. AWS Glue offers integration, a catalog and ETL depending on the component. Redshift provides a data warehouse for analytics. The BI layer presents data to users in analyses and dashboards.\",\"Identify whether the step queries the lake, transforms and catalogs, serves queries in a warehouse or presents the information. Consider recurrence, sources, cost per query and access patterns.\"],\"tone\":\"blue\"},{\"h\":\"3.7.2 · Managed AI and choosing by task type\",\"items\":[\"Comprehend extracts signals from text with NLP. Textract extracts text and structure from documents. Rekognition analyzes images and video in supported tasks. SageMaker AI serves the development and use of ML models with more control. Bedrock offers access to managed foundation models and their tools.\",\"Associate the input data with the expected result. When a pre-built API meets the requirement, it reduces training work. When the goal is GenAI, evaluate foundation models and the limits of the context.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Follow a report from raw files through processing, query execution and presentation.\",\"Distinguish an image of an object, a scanned form and a text that needs classification.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Visualization and distributed transformation address different steps of the same architecture.\",\"A vision API does not automatically replace structured form extraction.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t3.8\",\"d\":3,\"k\":\"Other services in scope\",\"title\":\"Other services in scope\",\"sub\":\"Objectives 3.8.1, 3.8.2, 3.8.3, 3.8.4\",\"desc\":\"If the problem is orchestration, check sequence, state, errors and retries. If it is integration, check whether it needs buffering, fan-out or content-based selection.\",\"quick\":[[\"A process needs steps run in order, with different paths after a validation. Which service?\",\"AWS Step Functions\"],[\"The operator needs to run a task on a configured, managed fleet. Which service?\",\"AWS Systems Manager\"],[\"A commit needs to trigger a build and tests in a managed environment. Which service runs this step?\",\"AWS CodeBuild\"],[\"Sensors need to authenticate and publish IoT messages. Which offering?\",\"AWS IoT Core\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon SQS\",\"A queue to hold work until it is consumed.\",\"A consumer step must process messages later and at its own pace. Which service?\"],[\"Amazon SNS\",\"A topic for distribution to multiple subscribers.\",\"The same message must be published to multiple subscribers with a single publish. Which service?\"],[\"Amazon EventBridge\",\"Rule-based event routing, with integrated targets.\",\"The requirement is to route events from several sources based on their fields. Which service?\"],[\"AWS Step Functions\",\"Orchestration of steps with state and branching.\",\"A process needs steps run in order, with different paths after a validation. Which service?\"],[\"AWS Systems Manager\",\"Provides fleet operations features and runs supported actions.\",\"The operator needs to run a task on a configured, managed fleet. Which service?\"],[\"AWS Health\",\"Shows service events or resource events relevant to the account.\",\"The team wants to know which of the account's resources are affected by maintenance announced by AWS. Which service?\"],[\"AWS Trusted Advisor\",\"Offers recommendations through supported checks.\",\"The company wants recommendations on cost opportunities and on supported best-practice checks. Which tool?\"],[\"AWS Backup\",\"Orchestrates policies and central management of backups of eligible resources.\",\"An organization needs to centralize backup plans and retention for supported services. Which one?\"],[\"AWS CodeBuild\",\"Runs build and test activities.\",\"A commit needs to trigger a build and tests in a managed environment. Which service runs this step?\"],[\"AWS CodePipeline\",\"Orchestrates a delivery flow with stages and actions.\",\"A release needs to coordinate build, approval and deployment. Which service organizes the flow?\"],[\"AWS CodeDeploy\",\"Automates application deployment to supported targets.\",\"The package has already been produced. The rollout to compatible instances must be automated. Which service?\"],[\"AWS CloudFormation\",\"Provisions and updates resources from declarative templates.\",\"The network and compute resources declared in a stack need to be reviewed. Which service?\"],[\"AWS IoT Core\",\"Connects IoT devices and messages in a managed service.\",\"Sensors need to authenticate and publish IoT messages. Which offering?\"],[\"AWS Amplify\",\"Supports the development and publishing of frontend applications.\",\"The team needs to publish the web frontend and integrate its delivery into the development routine. Which family?\"]]}],\"cards\":[{\"h\":\"3.8.1 · Integration services: queues, topics, events and workflows\",\"items\":[\"SQS provides queues; SNS distributes messages to subscribers; EventBridge routes events according to rules; Step Functions orchestrates steps and states. The delivery contract defines which component is central.\",\"If the problem is orchestration, check sequence, state, errors and retries. If it is integration, check whether it needs buffering, fan-out or content-based selection.\"],\"tone\":\"blue\"},{\"h\":\"3.8.2 · Operational tools and services by function\",\"items\":[\"AWS Systems Manager brings together operational capabilities, such as managing configured resources and running supported tasks remotely. AWS Health reports events that affect the account's services or resources. AWS Trusted Advisor recommends improvements based on the available checks. AWS Backup centralizes backup policies for eligible resources.\",\"Distinguish running the action, getting visibility into an event, reviewing recommendations and centralizing backups. Confirm the resource configuration, the account permissions and the eligibility for each integration.\"],\"tone\":\"blue\"},{\"h\":\"3.8.3 · Development tools and continuous delivery\",\"items\":[\"CodeBuild compiles and tests code in a managed environment. CodePipeline orchestrates the stages of delivery. CodeDeploy automates application deployment to compatible targets. CloudFormation defines and operates declarative infrastructure stacks.\",\"Distinguish the build action, the delivery graph, the application rollout and the resource definition. A pipeline can call other services instead of implementing each step.\"],\"tone\":\"blue\"},{\"h\":\"3.8.4 · Frontend, devices, desktops and application access\",\"items\":[\"IoT Core connects devices and IoT messaging. Amplify offers tools and hosting for compatible web and mobile applications. Amazon WorkSpaces provides virtual desktops or end-user computing offerings, depending on the product. AppStream 2.0, also presented in the WorkSpaces Applications family, delivers applications by streaming in compatible scenarios.\",\"Identify the type of client: connected equipment, frontend browser, managed desktop or a single streamed application. The chosen service must offer the access appropriate to the consumer's identity.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Compare the role of the four services in the same order and shipping process.\",\"Decide which action follows each piece of evidence: an account event, a cost recommendation, a fleet task and backup retention.\",\"Draw commit, tests, approval, infrastructure and deploy as separate actions.\",\"Classify four requests by source, unit delivered and final experience.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"A queue can hold pending work and still not represent the workflow logic.\",\"A Trusted Advisor recommendation does not apply the fix by itself.\",\"CodePipeline organizes stages, but a build stage needs a build executor or a compatible integration.\",\"Streaming an application to a user is not the same as sending telemetry events from devices.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t4.1\",\"d\":4,\"k\":\"Pricing models\",\"title\":\"Pricing models\",\"sub\":\"Objectives 4.1.1, 4.1.2\",\"desc\":\"Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment.\",\"quick\":[[\"A distributed job resumes processing and accepts interruptions to save money. Which option?\",\"Spot Instances\"],[\"Before the first deploy, the team wants to estimate the bill for a volume scenario. Which tool?\",\"AWS Pricing Calculator\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"On-Demand\",\"Flexible usage with no term commitment.\",\"A one-off event needs capacity without a multi-year commitment. Which pricing option?\"],[\"Savings Plans\",\"An hourly spend commitment for a discount on eligible compute usage.\",\"There is recurring demand. The customer accepts committing to an hourly spend to get a discount on eligible compute. Which model?\"],[\"Reserved Instances\",\"A discount model subject to reservation conditions and compatibility.\",\"The team wants to compare discounts tied to the conditions of an instance reservation. Which model?\"],[\"Spot Instances\",\"Spare capacity suited to interruption-tolerant workloads.\",\"A distributed job resumes processing and accepts interruptions to save money. Which option?\"],[\"AWS Pricing Calculator\",\"Estimates costs for planned services and volume.\",\"Before the first deploy, the team wants to estimate the bill for a volume scenario. Which tool?\"],[\"AWS Cost Explorer\",\"Analyzes recorded costs and usage and lets you explore trends.\",\"The team wants to find out which service caused the increase in spend last quarter. Which tool?\"],[\"Data transfer model\",\"Considers source, destination and the service's billing rules.\",\"An application replicates data to another Region. Which additional dimension should be investigated in the estimate?\"],[\"Storage cost drivers\",\"Consider volume, class, requests, retention and retrieval.\",\"The company compares two S3 classes with long retention and different retrieval rates. Which dimension dominates?\"]]}],\"cards\":[{\"h\":\"4.1.1 · On-Demand, Savings Plans, reservations and Spot\",\"items\":[\"On-Demand serves consumption without a long-term commitment. Savings Plans offer a discount on eligible usage in exchange for an hourly monetary commitment. Reserved Instances bring a discount and conditions tied to the service and scope. Spot uses spare capacity, subject to interruption.\",\"Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment.\"],\"tone\":\"blue\"},{\"h\":\"4.1.2 · Estimates, data transfer and marginal cost\",\"items\":[\"Cost can involve time, capacity, requests, storage and data transfer, depending on the service. AWS Pricing Calculator estimates future scenarios. Cost Explorer analyzes reported usage and cost. A cost decision considers the marginal price of services and the transfer topology.\",\"Compare the estimated load, ingress/egress traffic, access across zones or Regions and indirect costs. Check the pricing rules per service and Region instead of assuming every transfer is treated the same way.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Separate predictable load, occasional peaks, interruption-tolerant batches and capacity that must be available.\",\"Work out which variables change if a consumer starts reading from another Region.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Savings Plans do not guarantee available physical capacity. Spot alone does not meet a continuous capacity requirement without an interruption strategy.\",\"An estimate of a future architecture does not replace the analysis of historical usage and cost.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t4.2\",\"d\":4,\"k\":\"Billing, budgets and cost management\",\"title\":\"Billing, budgets and cost management\",\"sub\":\"Objectives 4.2.1, 4.2.2\",\"desc\":\"Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts.\",\"quick\":[[\"Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit. Which service?\",\"AWS Budgets\"],[\"The company wants to pay one aggregated bill while keeping separate accounts. Which feature?\",\"AWS Organizations consolidated billing\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"AWS Cost Explorer\",\"Analyzes historical consumption, groupings and trends.\",\"The manager wants to browse recorded cost interactively by tag and month. Which tool?\"],[\"AWS Budgets\",\"Tracks planned amounts and limits, with configurable notifications.\",\"Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit. Which service?\"],[\"AWS Data Exports\",\"Delivers detailed cost and usage datasets.\",\"The team wants to feed its own data warehouse with detailed usage records. Which feature?\"],[\"AWS Cost Anomaly Detection\",\"Identifies abnormal spend compared with expected behavior.\",\"The intention is to detect an unusual spending pattern without starting from a fixed budget amount. Which service?\"],[\"AWS Organizations consolidated billing\",\"Coordinates payment and an aggregated view for the organization's accounts.\",\"The company wants to pay one aggregated bill while keeping separate accounts. Which feature?\"],[\"Cost allocation tags\",\"Associate eligible costs with business labels once activated.\",\"The team wants to attribute costs to a product using resource metadata. Which feature?\"],[\"AWS Cost Categories\",\"Groups costs with custom categories and rules.\",\"Finance needs to group accounts and services into categories such as Sales and Operations with its own rules. Which tool?\"],[\"AWS Budgets\",\"Monitors spend or usage against planned limits.\",\"The company has already separated its cost centers and wants to be notified when a limit is exceeded. Which one?\"]]}],\"cards\":[{\"h\":\"4.2.1 · Cost Explorer, Budgets, Data Exports and anomalies\",\"items\":[\"Cost Explorer analyzes cost and usage trends. Budgets tracks limits and sends alerts according to its configuration. Data Exports delivers detailed billing data for analysis. Cost Anomaly Detection identifies unusual spending patterns in configured monitors.\",\"Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts.\"],\"tone\":\"blue\"},{\"h\":\"4.2.2 · Consolidated billing, tags and cost allocation\",\"items\":[\"Organizations enables consolidated billing for the organization's accounts under the management account. Allocation tags, properly activated and applied, help separate expenses by cost center. Cost Categories group costs with business rules. Budgets monitor limits and do not define the classification on their own.\",\"Separate payer, classification and visibility. An account is an administrative boundary, while a cost center can aggregate several accounts. Define tagging standards and handle unclassified resources.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Given a cost increase, state which tool detects it, which investigates it and which provides the data that supports external analysis.\",\"Reconcile cost per account with cost per product and identify the expense with no owner.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Setting a budget with an alert does not impose a hard, universal ceiling on the bill.\",\"Consolidated billing does not merge all accounts or remove the teams' isolated access.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t4.3\",\"d\":4,\"k\":\"Technical resources and support options\",\"title\":\"Technical resources and support options\",\"sub\":\"Objectives 4.3.1, 4.3.2\",\"desc\":\"Distinguish an incident that requires contracted support, a service event that already has a status, a best-practice check and editing a runbook with public information. Check the current plans table for names and first-response SLAs.\",\"quick\":[[\"A company with coverage wants to open a case for a production incident. Where?\",\"AWS Support Center\"],[\"The customer needs to clarify billing, without requesting a technical diagnosis of an application. Which channel, by purpose?\",\"Use account and billing support\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"AWS Support Center\",\"Opens and tracks cases through the channels of the contracted plan.\",\"A company with coverage wants to open a case for a production incident. Where?\"],[\"AWS Health Dashboard\",\"Presents service events and events relevant to the account's resources.\",\"The team wants to confirm whether maintenance affects specific resources in the account. Where?\"],[\"AWS Trusted Advisor\",\"Provides recommendations based on the available checks.\",\"The team wants a list of opportunities found by best-practice checks. Where?\"],[\"AWS re:Post\",\"Offers a forum and community technical knowledge.\",\"A student wants to look up public technical questions and answers without opening a case. Where?\"],[\"Use account and billing support\",\"Routes the administrative request through the corresponding channel.\",\"The customer needs to clarify billing, without requesting a technical diagnosis of an application. Which channel, by purpose?\"],[\"Use the contracted technical support plan\",\"Engages technical coverage and a channel suited to the severity.\",\"A production incident requires technical support and a channel with severity. Which path?\"],[\"Compare plans with technical account guidance\",\"Considers proactive guidance and management features in the current offering.\",\"The organization needs proactive technical guidance through its support offering. Which requirement should it compare when buying?\"],[\"Use the checks available in Trusted Advisor\",\"Identifies the expected opportunities and alerts, depending on access.\",\"The team wants optimization suggestions from eligible checks, without opening a case at that moment. Which feature?\"]]}],\"cards\":[{\"h\":\"4.3.1 · Technical resources, account status and support channels\",\"items\":[\"The support plan determines channels, coverage and response times according to the current terms. AWS Health shows events related to services and resources. Trusted Advisor offers checks and recommendations. re:Post provides community knowledge for questions and research.\",\"Distinguish an incident that requires contracted support, a service event that already has a status, a best-practice check and editing a runbook with public information. Check the current plans table for names and first-response SLAs.\"],\"tone\":\"blue\"},{\"h\":\"4.3.2 · Support plans and technical help by need\",\"items\":[\"Compare the current plans table by coverage, channels, response times, criticality and need for technical guidance. In November 2026, AWS documents the transition from legacy plans and offerings such as Business Support+, Enterprise Support and Unified Operations. Names in earlier exams or materials may reflect another period.\",\"Basic includes self-service resources and account and billing support. For production technical support, compare the paid options and their channels. For strategic service and guidance, check the offering's services table. Validate the current terms before concluding eligibility.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Choose the first channel for four different situations and identify when to open a case.\",\"For each scenario, identify whether there is a billing question, a critical technical case, a need for proactive support or a lookup of recommendations.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"A first-response SLA is not a promise to resolve the incident within the same time.\",\"A plan enables specific support channels and conditions; an initial-response SLA does not guarantee resolution within that time.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"}],\"sources\":[[\"Official CLF-C02 guide\",\"https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html\"],[\"Official certification and preparation\",\"https://aws.amazon.com/pt/certification/certified-cloud-practitioner/\"],[\"AWS Well-Architected Framework\",\"https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html\"],[\"AWS Cloud Adoption Framework\",\"https://aws.amazon.com/pt/cloud-adoption-framework/\"],[\"Migration strategies\",\"https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html\"],[\"Shared responsibility\",\"https://aws.amazon.com/pt/compliance/shared-responsibility-model/\"],[\"IAM — best practices\",\"https://docs.aws.amazon.com/pt_br/IAM/latest/UserGuide/best-practices.html\"],[\"AWS Organizations — concepts\",\"https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html\"],[\"AWS Security — services\",\"https://aws.amazon.com/pt/security/\"],[\"AWS Artifact\",\"https://docs.aws.amazon.com/pt_br/artifact/latest/ug/what-is-aws-artifact.html\"],[\"AWS CloudTrail guide\",\"https://docs.aws.amazon.com/pt_br/awscloudtrail/latest/userguide/cloudtrail-user-guide.html\"],[\"AWS Config\",\"https://docs.aws.amazon.com/pt_br/config/latest/developerguide/WhatIsConfig.html\"],[\"AWS global infrastructure\",\"https://aws.amazon.com/pt/about-aws/global-infrastructure/\"],[\"Compute products\",\"https://aws.amazon.com/pt/products/compute/\"],[\"AWS databases\",\"https://aws.amazon.com/pt/products/databases/\"],[\"Networking and content delivery\",\"https://aws.amazon.com/pt/products/networking/\"],[\"AWS storage\",\"https://aws.amazon.com/pt/products/storage/\"],[\"S3 storage classes\",\"https://aws.amazon.com/pt/s3/storage-classes/\"],[\"AWS analytics services\",\"https://aws.amazon.com/pt/big-data/datalakes-and-analytics/\"],[\"AWS artificial intelligence\",\"https://aws.amazon.com/pt/ai/\"],[\"AWS CloudFormation\",\"https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html\"],[\"AWS pricing\",\"https://aws.amazon.com/pt/pricing/\"],[\"Savings Plans\",\"https://aws.amazon.com/pt/savingsplans/\"],[\"Analysis with Cost Explorer\",\"https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html\"],[\"AWS Budgets\",\"https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/budgets-managing-costs.html\"],[\"AWS Pricing Calculator\",\"https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html\"],[\"Current AWS support plans\",\"https://aws.amazon.com/pt/premiumsupport/plans/\"],[\"AWS Trusted Advisor\",\"https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/\"],[\"AWS Health\",\"https://docs.aws.amazon.com/pt_br/health/latest/ug/what-is-aws-health.html\"],[\"Plan transition and support timelines\",\"https://aws.amazon.com/pt/premiumsupport/faqs/\"],[\"Developer tools\",\"https://aws.amazon.com/pt/products/developer-tools/\"],[\"Amazon WorkSpaces — virtual desktops\",\"https://aws.amazon.com/pt/workspaces/\"],[\"AWS IoT Core\",\"https://aws.amazon.com/pt/iot-core/\"],[\"AWS Compute Optimizer\",\"https://aws.amazon.com/pt/compute-optimizer/\"]]};\nconst D=[{\"id\":1,\"name\":\"1 · Cloud concepts\",\"pct\":\"24%\",\"color\":\"#2874c8\"},{\"id\":2,\"name\":\"2 · Security and compliance\",\"pct\":\"30%\",\"color\":\"#19865b\"},{\"id\":3,\"name\":\"3 · Cloud technology and services\",\"pct\":\"34%\",\"color\":\"#7654b5\"},{\"id\":4,\"name\":\"4 · Billing, pricing and support\",\"pct\":\"12%\",\"color\":\"#c77918\"}];\nlet domain=1,current=null,query='';\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst rxEsc=s=>String(s).replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&');\n\nfunction rich(value){\n  const raw=String(value);\n  let out;\n  if(query){\n    const re=new RegExp('('+rxEsc(query)+')','ig');\n    out=raw.split(re).map(part=>part.toLowerCase()===query.toLowerCase()?`\u003cmark class=\"hit\">${esc(part)}\u003c/mark>`:esc(part)).join('');\n  }else{\n    out=esc(raw);\n  }\n  return out.replace(/`([^`]+)`/g,'\u003ccode>$1\u003c/code>');\n}\n\nconst allText=s=>[s.title,s.sub,s.desc,s.quick.flat().join(' '),s.cards.map(c=>c.h+' '+c.items.join(' ')).join(' '),s.tables.map(t=>t.h+' '+t.cols.join(' ')+t.rows.flat().join(' ')).join(' '),s.bottom.map(c=>c.h+' '+c.items.join(' ')).join(' '),s.final].join(' ').toLowerCase();\n\nfunction visible(){\n  return DATA.sheets.filter(s=>(query?allText(s).includes(query):s.d===domain));\n}\n\nfunction table(t,cls='compare'){\n  return `\u003csection class=\"section ${cls}\">\u003ch3>${rich(t.h)}\u003c/h3>\u003ctable>\u003cthead>\u003ctr>${t.cols.map(c=>`\u003cth>${rich(c)}\u003c/th>`).join('')}\u003c/tr>\u003c/thead>\u003ctbody>${t.rows.map(r=>`\u003ctr>${r.map(v=>`\u003ctd>${rich(v)}\u003c/td>`).join('')}\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/section>`;\n}\n\nfunction card(c){\n  let tone=c.tone||'blue';\n  return `\u003carticle class=\"card tone-${tone}\">\u003ch3>${rich(c.h)}\u003c/h3>\u003cul>${c.items.map(i=>`\u003cli>${rich(i)}\u003c/li>`).join('')}\u003c/ul>\u003c/article>`;\n}\n\nfunction renderSheet(s){\n  const d=D.find(x=>x.id===s.d);\n  return `\u003carticle class=\"sheet\" style=\"--accent:${d.color}\">\u003cdiv class=\"sheethead\">\u003cdiv class=\"eyebrow\">DOMAIN ${s.d} · ${d.pct} OF THE SCORED CONTENT\u003c/div>\u003ch2>${rich(s.title)}\u003c/h2>\u003cdiv class=\"sub\">${rich(s.sub)}\u003c/div>\u003cp>${rich(s.desc)}\u003c/p>\u003c/div>${table({h:\"⚡ QUICK DECISION\",cols:[\"Requirement / scenario\",\"Recommended choice\"],rows:s.quick},'decision')}\u003cdiv class=\"tables\">${s.tables.map(t=>table(t)).join('')}\u003c/div>\u003csection class=\"section\">\u003ch3>🧠 CONCEPTS, SERVICES, AND PARAMETERS\u003c/h3>\u003cdiv class=\"cards\">${s.cards.map(card).join('')}\u003c/div>\u003c/section>\u003csection class=\"section\">\u003ch3>🎯 FINAL REVIEW AND EXAM TRAPS\u003c/h3>\u003cdiv class=\"bottom\">${s.bottom.map(card).join('')}\u003c/div>\u003c/section>\u003cdiv class=\"final\">${rich(s.final)}\u003c/div>\u003cdetails class=\"sources\">\u003csummary>Official sources for further study and checking limits\u003c/summary>\u003cdiv class=\"links\">${DATA.sources.map(x=>`\u003ca href=\"${esc(x[1])}\" target=\"_blank\" rel=\"noopener\">${rich(x[0])} ↗\u003c/a>`).join('')}\u003c/div>\u003c/details>\u003c/article>`;\n}\n\nfunction drawDomain(){\n  $('domains').innerHTML=D.map(x=>`\u003cbutton data-d=\"${x.id}\" aria-pressed=\"${x.id===domain}\" style=\"--accent:${x.color}\">${x.name} \u003cb>${x.pct}\u003c/b>\u003c/button>`).join('');\n  $('domains').querySelectorAll('button').forEach(b=>b.onclick=()=>{\n    domain=+b.dataset.d;query='';$('search').value='';drawNav();\n    const first=visible()[0];if(first)show(first.id);\n  });\n}\n\nfunction drawNav(){\n  const list=visible();\n  $('sheets').innerHTML=list.map(s=>`\u003cbutton data-id=\"${s.id}\" aria-pressed=\"${s.id===current}\">${query?`D${s.d} · `:''}${rich(s.k)}\u003c/button>`).join('')||\"\\u003cspan style=\\\"font-size:11px;color:var(--mu)\\\">No cheatsheet matches the search.\\u003c/span>\";\n  $('sheets').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.id));\n  $('count').textContent=query?`${list.length} result(s) across all domains · ${DATA.sheets.length} overall`:`${list.length} cheatsheets in this domain · ${DATA.sheets.length} overall`;\n}\n\nfunction show(id,scroll=true){\n  const s=DATA.sheets.find(x=>x.id===id);if(!s)return;\n  current=id;domain=s.d;drawDomain();\n  $('app').classList.remove('print-all');\n  $('app').innerHTML=renderSheet(s);\n  drawNav();\n  if(scroll)$('app').scrollIntoView({behavior:'smooth',block:'start'});\n}\n\nfunction moveSheet(delta){\n  const list=visible();if(!list.length)return;\n  let idx=list.findIndex(x=>x.id===current);if(idx\u003c0)idx=0;\n  const next=list[(idx+delta+list.length)%list.length];\n  show(next.id);\n}\n\nfunction printAll(){\n  const saved=current;const y=window.scrollY;\n  $('app').classList.add('print-all');\n  $('app').innerHTML=DATA.sheets.map(renderSheet).join('');\n  setTimeout(()=>{\n    window.print();\n    $('app').classList.remove('print-all');\n    show(saved,false);\n    window.scrollTo(0,y);\n  },120);\n}\n\n$('search').addEventListener('input',e=>{\n  query=e.target.value.trim().toLowerCase();\n  drawNav();\n  const list=visible();\n  if(list.length)show(list[0].id,false);\n  else $('app').innerHTML=\"\\u003cdiv class=\\\"empty\\\">No cheatsheet found. Clear the search or try another term.\\u003c/div>\";\n});\n\n$('clear').onclick=()=>{\n  $('search').value='';query='';drawNav();\n  if(visible().length)show(visible()[0].id,false);\n};\n\n$('print').onclick=()=>window.print();\n$('printAll').onclick=printAll;\n\n$('theme').onclick=()=>{\n  let dark=document.documentElement.dataset.theme!=='dark';\n  document.documentElement.dataset.theme=dark?'dark':'light';\n  $('theme').textContent=dark?\"☀ Light theme\":\"☾ Dark theme\";\n};\n\ndocument.addEventListener('keydown',e=>{\n  if(e.altKey||e.ctrlKey||e.metaKey)return;\n  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;\n  const tag=(e.target&&e.target.tagName||'').toUpperCase();\n  if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target?.isContentEditable)return;\n  e.preventDefault();\n  moveSheet(e.key==='ArrowRight'?1:-1);\n});\n\ndrawDomain();\ndrawNav();\nshow(DATA.sheets[0].id,false);\n\nwindow.addEventListener('message', e => {\n  const msg = e.data || {};\n  if (msg.type === 'NAV_SHEET' && msg.id) {\n    if (msg.search) { $('search').value = msg.search; query = msg.search.toLowerCase(); }\n    else { $('search').value = ''; query = ''; }\n    show(msg.id, true);\n  } else if (msg.type === 'SET_THEME' && msg.theme) {\n    document.documentElement.dataset.theme = msg.theme;\n    $('theme').textContent = msg.theme === 'dark' ? \"☀ Light theme\" : \"☾ Dark theme\";\n  }\n});\n\u003c/script>\n\u003cscript>document.addEventListener('click',e=>{if(!e.target.closest('#theme, #themeBtn'))return;e.stopImmediatePropagation();parent.portalToggleTheme();},true);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.stopImmediatePropagation();e.preventDefault();parent.portalOpenSearch();}},true);\u003c/script>\u003cscript>addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='NAV_CHEATSHEET'){query='';document.getElementById('search').value='';show(e.data.id,false);}else if(e.data?.type==='SET_THEME'){document.documentElement.dataset.theme=e.data.theme;document.getElementById('theme').textContent=e.data.theme==='dark'?\"☀ Light theme\":\"☾ Dark theme\";}});\u003c/script>\u003c/body>\n\u003c/html>","mindmaps":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"description\" content=\"Interactive mind maps for the AWS Certified Cloud Practitioner (CLF-C02) certification.\">\n\u003ctitle>CLF-C02 · Complete Mind Maps\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;--bg:#f3f6fc;--card:#fff;--tx:#17233d;--mu:#5f6d88;--ln:#d7deed;--a:#2674d9;--ok:#14875b;--bad:#c94343;--no:#bf710b;--go:#7652c8;--hub:#102b5b;--hubt:#46e0c7;--shadow:0 8px 24px rgba(31,55,100,.07)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0c1424;--card:#151f33;--tx:#e8eef9;--mu:#a0aec8;--ln:#2c3a59;--a:#65a3ff;--ok:#42ca8b;--bad:#ff7c72;--no:#ffb24c;--go:#b39af4;--hub:#091b3c;--hubt:#57e9d2;--shadow:0 8px 24px rgba(0,0,0,.2)}}\n:root[data-theme=\"dark\"]{--bg:#0c1424;--card:#151f33;--tx:#e8eef9;--mu:#a0aec8;--ln:#2c3a59;--a:#65a3ff;--ok:#42ca8b;--bad:#ff7c72;--no:#ffb24c;--go:#b39af4;--hub:#091b3c;--hubt:#57e9d2;--shadow:0 8px 24px rgba(0,0,0,.2)}\n*{box-sizing:border-box}html{scroll-padding-top:14px}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.48 \"Segoe UI\",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}\nheader{max-width:1640px;margin:0 auto;padding:18px 24px 0}.brandline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#153669,#246ed0);display:grid;place-items:center;color:#54e4cf;font-size:22px;font-weight:800;box-shadow:var(--shadow)}\nheader h1{margin:0;font-size:19px;letter-spacing:.01em;line-height:1.2}header .sub{margin:4px 0 0;color:var(--mu);font-size:12px}.tools{display:flex;gap:7px;align-items:center}.toolbtn{border:1px solid var(--ln);background:var(--card);color:var(--mu);border-radius:9px;padding:7px 10px;font:600 12px/1.2 \"Segoe UI\",system-ui,sans-serif;cursor:pointer}.toolbtn:hover{border-color:var(--a);color:var(--a)}\n.exam-note{margin:14px 0 12px;padding:9px 12px;border-left:4px solid var(--a);background:var(--card);border-radius:0 10px 10px 0;color:var(--mu);font-size:12px}.sec-bar{display:flex;gap:7px;flex-wrap:wrap;padding:0 0 10px;border-bottom:1px solid var(--ln)}.sec-bar button{font:600 12px/1.2 \"Segoe UI\",system-ui,sans-serif;padding:7px 11px;border-radius:9px;border:1px solid var(--ln);background:var(--card);color:var(--mu);cursor:pointer}.sec-bar button[aria-pressed=true]{background:var(--hub);border-color:var(--a);color:var(--hubt)}\nnav{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 0}nav button{font:600 12px/1.2 \"Segoe UI\",system-ui,sans-serif;padding:7px 11px;border:1.5px solid var(--a);background:transparent;color:var(--a);border-radius:999px;cursor:pointer;transition:.15s}nav button[aria-pressed=true]{background:var(--a);color:white}nav button:hover{transform:translateY(-1px)}\n#v{max-width:1640px;margin:0 auto;padding:18px 24px 30px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;color:var(--mu);font-size:11px}.meta strong{color:var(--tx)}.wrap{position:relative}.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,320px) minmax(0,1fr);gap:clamp(18px,3vw,48px);align-items:start;position:relative}.col{display:flex;flex-direction:column;gap:14px;min-width:0}.hub{align-self:center;position:sticky;top:18px;background:var(--hub);color:#fff;border-radius:22px;padding:23px 19px;text-align:center;border:3px solid var(--a);box-shadow:0 14px 34px rgba(15,42,92,.18);z-index:1}.hub small{display:block;color:#9fb9ec;font-weight:700;margin-bottom:8px;font-size:11px;letter-spacing:.06em}.hub h2{margin:0 0 11px;font-size:22px;line-height:1.14;color:var(--hubt)}.hub .pills{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hub span{display:inline-block;background:#1f70ce;color:white;font-weight:700;font-size:10px;padding:5px 9px;border-radius:999px}.hub p{margin:12px 0 0;font-size:12px;color:#d6e2fa;line-height:1.45}\nsvg.connectors{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}svg path{fill:none;stroke:var(--a);stroke-width:1.8;opacity:.37}\n.c{background:var(--card);border:1.7px solid var(--a);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}.c.ok{border-color:var(--ok)}.c.bad{border-color:var(--bad)}.c.no{border-color:var(--no)}.c.go{border-color:var(--go)}.c h3{margin:0 0 7px;font-size:13px;line-height:1.3;color:var(--a)}.c.ok h3{color:var(--ok)}.c.bad h3{color:var(--bad)}.c.no h3{color:var(--no)}.c.go h3{color:var(--go)}.c ul{margin:0;padding-left:17px}.c li{margin:4px 0;font-size:12px;line-height:1.42}.c li::marker{color:var(--a)}.c li b{font-weight:700;color:var(--tx)}\n.bot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.bot .c{padding:11px 12px}.bot .c li{font-size:11.5px}.f{margin-top:15px;border:1.7px solid var(--a);border-radius:13px;padding:12px 15px;background:var(--card);font-weight:650;font-size:12px;box-shadow:var(--shadow)}\n.refs{margin-top:14px;border-top:1px solid var(--ln);padding-top:10px;color:var(--mu);font-size:11px}.refs a{color:var(--a);text-decoration:none}.refs a:hover{text-decoration:underline}.refs summary{cursor:pointer;font-weight:700;color:var(--mu)}.refs ul{display:flex;gap:8px 18px;flex-wrap:wrap;padding-left:17px}.refs li{margin:3px 0}\n@media(max-width:1120px){.main{grid-template-columns:minmax(0,1fr) minmax(235px,285px) minmax(0,1fr);gap:16px}.bot{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:820px){header{padding:14px 14px 0}#v{padding:15px 14px 24px}.main{grid-template-columns:1fr;gap:12px}.hub{position:relative;top:auto;order:-1;max-width:none}.col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}svg.connectors{display:none}.bot{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:520px){.col,.bot{grid-template-columns:1fr}.brandline{align-items:flex-start}.tools{width:100%}.hub h2{font-size:20px}.sec-bar button{flex:1 1 100%;text-align:left}nav button{font-size:11px}}\n@media print{body{background:#fff;color:#111}header .tools,.sec-bar,nav,.exam-note,.meta .right,.refs{display:none!important}header{padding:0 0 8px;max-width:none}#v{max-width:none;padding:8px 0}.main{grid-template-columns:1fr 250px 1fr;gap:12px}.hub{position:static;box-shadow:none;break-inside:avoid}.c,.f{box-shadow:none;break-inside:avoid;background:#fff;color:#111}.c li{font-size:9pt}.c h3{font-size:10pt}.bot{grid-template-columns:repeat(4,1fr)}.bot .c li{font-size:8pt}.f{font-size:9pt}svg{display:block}}\n\u003c/style>\n\u003cstyle>@media screen{html.reading-mode body>header:first-of-type{display:none}} @media(max-width:550px){.tablewrap,.section{max-width:100%;overflow:auto}.map-head{flex-wrap:wrap}} \u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader>\n \u003cdiv class=\"brandline\">\n  \u003cdiv class=\"brand\">\u003cdiv class=\"logo\">CLF\u003c/div>\u003cdiv>\u003ch1>AWS Certified Cloud Practitioner\u003c/h1>\u003cdiv class=\"sub\">CLF-C02 · Interactive mind maps · Technical terms kept in their original form\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"tools\">\u003cbutton class=\"toolbtn\" id=\"themeBtn\" type=\"button\">◐ Theme\u003c/button>\u003cbutton class=\"toolbtn\" type=\"button\" onclick=\"window.print()\">⎙ Print map\u003c/button>\u003c/div>\n \u003c/div>\n \u003cdiv class=\"exam-note\">\u003cstrong>CLF-C02 blueprint\u003c/strong> · 24% / 30% / 34% / 12%. Check the official guide to confirm the scope.\u003c/div>\n \u003cdiv class=\"sec-bar\" id=\"sb\" aria-label=\"Exam domains\">\u003c/div>\n \u003cnav id=\"n\" aria-label=\"Maps for the selected domain\">\u003c/nav>\n\u003c/header>\n\u003cmain id=\"v\" aria-live=\"polite\">\u003c/main>\n\u003cscript>\nconst M = {\"d1\":{\"section\":1,\"key\":\"Overview · Cloud concepts\",\"top\":\"DOMAIN 1 · 24% OF THE EXAM\",\"heading\":\"Overview · Cloud concepts\",\"pills\":\"1.1 · 1.2 · 1.3 · 1.4\",\"desc\":\"Concepts guide: value, failures, and adoption\",\"left\":[{\"title\":\"1.1.1 · Elasticity, scalability and agility\",\"items\":[\"Elasticity\",\"Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity.\"],\"tone\":\"\"},{\"title\":\"1.1.2 · Availability, recovery and global reach\",\"items\":[\"RPO\",\"Map the effect the organization wants to limit. Frequent copies affect RPO, but the restore still has to meet the RTO. Regional copies must have access, keys and retention compatible with the planned recovery.\"],\"tone\":\"\"},{\"title\":\"1.2.1 · The six Well-Architected pillars\",\"items\":[\"Operational excellence\",\"Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric.\"],\"tone\":\"\"},{\"title\":\"1.2.2 · Decoupling and resilience in the application\",\"items\":[\"Amazon SQS\",\"Choose the mechanism by the contract: delivery to one worker, distribution to several recipients, distribution of synchronous requests or capacity adjustment. Queues and topics are often combined when several consumers need retention and independent pacing.\"],\"tone\":\"\"},{\"title\":\"1.2.3 · Security, cost and integration choices in the design\",\"items\":[\"Security\",\"Record impact, cost, risk and effort. For cost, look for the lowest spend that still meets the objective. For security, identify identity, access, data, detection and response. For performance, measure the requirement's technical metric before choosing family and capacity.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.3.1 · Migration and replatforming strategies\",\"items\":[\"Rehost\",\"Identify what changes in the code, the database engine, the infrastructure and the operating model.\"],\"tone\":\"go\"},{\"title\":\"1.3.2 · AWS CAF, assessment and adoption waves\",\"items\":[\"AWS Cloud Adoption Framework\",\"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.\"],\"tone\":\"go\"},{\"title\":\"1.4.1 · CapEx, OpEx, economies of scale and TCO\",\"items\":[\"Trading upfront investment for variable expense\",\"Compare two options with the same volume, growth trend, time frame and SLA.\"],\"tone\":\"go\"},{\"title\":\"1.4.2 · Sizing, indirect costs and on-demand environments\",\"items\":[\"Rightsizing\",\"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"A larger instance can scale vertically and still stay fixed overnight.\",\"A backup that was never restored does not prove a recovery time.\",\"The performance efficiency pillar does not mean always choosing the largest server.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t1.1\":{\"section\":1,\"key\":\"Value of the AWS Cloud\",\"top\":\"DOMAIN 1 · 24% OF THE EXAM\",\"heading\":\"Value of the AWS Cloud\",\"pills\":\"1.1\",\"desc\":\"Concepts guide: value, failures, and adoption\",\"left\":[{\"title\":\"1.1.1 · Elasticity, scalability and agility\",\"items\":[\"Elasticity\",\"Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.1.2 · Availability, recovery and global reach\",\"items\":[\"RPO\",\"Simulate the loss of a zone, then a regional outage. Compare impact, recoverable point and time to return.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"A larger instance can scale vertically and still stay fixed overnight.\",\"A backup that was never restored does not prove a recovery time.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t1.2\":{\"section\":1,\"key\":\"Design principles and Well-Architected\",\"top\":\"DOMAIN 1 · 24% OF THE EXAM\",\"heading\":\"Design principles and Well-Architected\",\"pills\":\"1.2\",\"desc\":\"Concepts guide: value, failures, and adoption\",\"left\":[{\"title\":\"1.2.1 · The six Well-Architected pillars\",\"items\":[\"Operational excellence\",\"Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric.\"],\"tone\":\"\"},{\"title\":\"1.2.2 · Decoupling and resilience in the application\",\"items\":[\"Amazon SQS\",\"Choose the mechanism by the contract: delivery to one worker, distribution to several recipients, distribution of synchronous requests or capacity adjustment. Queues and topics are often combined when several consumers need retention and independent pacing.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.2.3 · Security, cost and integration choices in the design\",\"items\":[\"Security\",\"Consider the same change as an intervention in two pillars. Identify the metric that supports the argument for each.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"The performance efficiency pillar does not mean always choosing the largest server.\",\"Load balancing distributes traffic across existing targets. Adjusting the number of targets is a separate function.\",\"Enabling a control without verifying its effect does not close the architectural decision.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t1.3\":{\"section\":1,\"key\":\"Adoption and migration\",\"top\":\"DOMAIN 1 · 24% OF THE EXAM\",\"heading\":\"Adoption and migration\",\"pills\":\"1.3\",\"desc\":\"Concepts guide: value, failures, and adoption\",\"left\":[{\"title\":\"1.3.1 · Migration and replatforming strategies\",\"items\":[\"Rehost\",\"Ask whether the application will be moved, adapted, rebuilt or replaced. Retain keeps an asset where it is; retire decommissions it; relocate transfers compatible platforms without changing their workloads individually.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.3.2 · AWS CAF, assessment and adoption waves\",\"items\":[\"AWS Cloud Adoption Framework\",\"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Replacing installed software with a SaaS subscription is repurchase, even if the data is migrated.\",\"CAF guides organizational adoption. Well-Architected focuses on reviewing workloads.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t1.4\":{\"section\":1,\"key\":\"Cloud economics\",\"top\":\"DOMAIN 1 · 24% OF THE EXAM\",\"heading\":\"Cloud economics\",\"pills\":\"1.4\",\"desc\":\"Concepts guide: value, failures, and adoption\",\"left\":[{\"title\":\"1.4.1 · CapEx, OpEx, economies of scale and TCO\",\"items\":[\"Trading upfront investment for variable expense\",\"Compare the cost of hardware, space, power, licenses, network, operations, downtime and growth. The cloud can reduce overprovisioning, but costs such as data transfer, redundancy and commitments remain in the calculation.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"1.4.2 · Sizing, indirect costs and on-demand environments\",\"items\":[\"Rightsizing\",\"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Price per hour is not the same as total cost. Commitments or upfront purchases still exist in the cloud.\",\"Stopping an instance does not automatically terminate all associated resources.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"d2\":{\"section\":2,\"key\":\"Overview · Security and compliance\",\"top\":\"DOMAIN 2 · 30% OF THE EXAM\",\"heading\":\"Overview · Security and compliance\",\"pills\":\"2.1 · 2.2 · 2.3 · 2.4\",\"desc\":\"Security guide: identity, evidence, and protection\",\"left\":[{\"title\":\"2.1.1 · Shared responsibility in EC2, RDS and managed services\",\"items\":[\"Customer on EC2\",\"Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task.\"],\"tone\":\"\"},{\"title\":\"2.1.2 · Inherited, shared and customer-specific controls\",\"items\":[\"Inherited control\",\"Avoid using the word shared as an undifferentiated split. Identify the evidence associated with the layer in question. AWS reports support the vendor assessment; the workload's controls also need their own evidence.\"],\"tone\":\"\"},{\"title\":\"2.2.1 · Artifact, Audit Manager and compliance evidence\",\"items\":[\"AWS Artifact\",\"Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit.\"],\"tone\":\"\"},{\"title\":\"2.2.2 · CloudTrail, CloudWatch and AWS Config\",\"items\":[\"Amazon CloudWatch\",\"Map the symptom, the causal event and the current configuration. A high error rate is a metric. Changing a permission is API activity. A volume without the required configuration is a compliance problem. Routing the notification is another step.\"],\"tone\":\"\"},{\"title\":\"2.2.3 · Encryption, certificates and secrets management\",\"items\":[\"AWS KMS\",\"Map which secret exists: an application password, a key that protects data or a certificate that validates the TLS session. Compare who can use, rotate, renew and audit the material.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.3.1 · Workload identity, privileges and root\",\"items\":[\"IAM role with temporary credentials\",\"Identify who runs it, which action it needs, which resource it may access and how it obtains credentials.\"],\"tone\":\"go\"},{\"title\":\"2.3.2 · Human access and multi-account management\",\"items\":[\"AWS IAM Identity Center\",\"Draw a person's session in two accounts and a guardrail that applies to the whole OU.\"],\"tone\":\"go\"},{\"title\":\"2.4.1 · Threat detection, vulnerabilities and posture\",\"items\":[\"Amazon GuardDuty\",\"Use a table of fictitious incidents and identify the first service to engage and where to consolidate the finding.\"],\"tone\":\"go\"},{\"title\":\"2.4.2 · WAF, Shield, Firewall Manager and network controls\",\"items\":[\"AWS WAF\",\"Classify four requests: HTTP pattern, DDoS, central management and database port.\"],\"tone\":\"go\"},{\"title\":\"2.4.3 · Defense in depth and subnet access\",\"items\":[\"Network ACL\",\"Given an access to a website, break down the decisions by layer and identify where to show the effect.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Managed does not mean the provider decides who can read the data.\",\"An AWS compliance certification does not automatically certify the customer's configuration.\",\"A vendor artifact does not show whether your own application configured encryption correctly.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t2.1\":{\"section\":2,\"key\":\"Shared responsibility\",\"top\":\"DOMAIN 2 · 30% OF THE EXAM\",\"heading\":\"Shared responsibility\",\"pills\":\"2.1\",\"desc\":\"Security guide: identity, evidence, and protection\",\"left\":[{\"title\":\"2.1.1 · Shared responsibility in EC2, RDS and managed services\",\"items\":[\"Customer on EC2\",\"Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.1.2 · Inherited, shared and customer-specific controls\",\"items\":[\"Inherited control\",\"Split the review into provider evidence, managed controls and the customer's configuration decisions.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":
