WS-exclusive control in a managed service","Inherited physical access control","Independent vendor evidence","Customer-specific control"],"why":["The data policy still depends on the customer.","It does not govern application or data segmentation.","A report does not implement the segmentation.","The logical configuration depends on the organization's policy."],"correct":[3]},{"id":"A-2.2.1-1","skill":"2.2.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"A bucket policy was changed at 3 p.m. The auditor wants to identify the identity behind the management call. Which source should be consulted?","options":["AWS CloudTrail","Amazon Macie","AWS Pricing Calculator","Amazon CloudWatch Metrics"],"why":["It records covered API activity with identity information.","It identifies sensitive data in S3, without tracing who made this change.","It simulates the architecture's cost, with no API trail.","Metric series do not by themselves associate this call with a principal."],"correct":[0]},{"id":"A-2.2.2-1","skill":"2.2.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"A standard requires compatible volumes to follow an approved configuration. The team wants rule-based evaluation and a compliance history. Which service?","options":["AWS Config","Amazon GuardDuty","AWS CloudTrail","AWS Budgets"],"why":["It records state and evaluates configuration with rules.","It detects threats, without comparing the configuration with the standard as requested.","The trail of calls is not the same as continuous evaluation of the rule.","It tracks usage and cost, not configuration."],"correct":[0]},{"id":"A-2.3.2-1","skill":"2.3.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"The company needs to establish a multi-account landing zone and standardize account creation and governance. Which service was designed for this?","options":["IAM Identity Center on its own","Consolidate credentials in the root user","AWS Control Tower","AWS Cost Explorer"],"why":["It is part of central access, without orchestrating the landing zone by itself.","It does not implement multi-account governance.","It automates the initial setup and controls of the landing zone.","It analyzes costs, without creating governed accounts."],"correct":[2]},{"id":"A-2.4.1-1","skill":"2.4.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"The organization needs to discover whether its S3 buckets store documents with personal identification numbers. Which tool classifies this content?","options":["Amazon Macie","AWS Artifact","Amazon Inspector","AWS Shield"],"why":["It identifies sensitive data in S3 objects within the configured scope.","It provides audit documents, without analyzing customer content.","It evaluates workload vulnerabilities, without classifying PII in documents.","It protects against DDoS; it does not inspect bucket content for this purpose."],"correct":[0]},{"id":"A-2.4.2-1","skill":"2.4.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Several teams have applications in separate accounts. Security needs to apply a consistent WAF policy across the organization. Which service?","options":["AWS Artifact","Amazon Route 53","AWS Firewall Manager","Create rules manually in one account"],"why":["It provides reports; it does not apply firewall policies.","It manages DNS; it does not distribute WAF policies across the organization.","It manages firewall policies centrally within the configured scope.","It does not ensure consistent application to the other environments."],"correct":[2]},{"id":"A-2.2.3-1","skill":"2.2.3","domain":2,"form":"A","scored":true,"kind":"single","stem":"A load balancer offers HTTPS. The team wants to issue and manage the certificate through a supported integration. Which service?","options":["AWS Secrets Manager as a certificate authority","AWS Certificate Manager","AWS KMS for SSE-KMS","AWS WAF"],"why":["It can store sensitive material, but it is not the requested managed issuer.","It provides TLS certificates and integration with compatible endpoints.","Controlling keys for data at rest does not issue the HTTPS certificate.","It filters requests, without issuing the certificate."],"correct":[1]},{"id":"A-2.4.3-1","skill":"2.4.3","domain":2,"form":"A","scored":true,"kind":"single","stem":"An application needs to block requests based on the content of a URL parameter. The traffic source and its port are valid. Which control?","options":["A route to the private endpoint","AWS WAF","A security group by port","AWS IAM to deny console use"],"why":["It changes the network path without inspecting the parameter.","It evaluates application parameters in HTTP.","The port is allowed, and this rule does not examine the URL.","It controls administrative APIs, not this HTTP parameter."],"correct":[1]},{"id":"A-2.3.1-1","skill":"2.3.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"An account wants to authorize another principal to assume a role. The role already has policies that allow reading the data once the session is created. What configures who can assume it?","options":["The bucket's lifecycle policy","The CloudWatch authentication alarm","The role's trust policy","The permissions policy that describes the read access"],"why":["It controls versions and transitions, not role assumption.","It detects a defined condition, but it does not authorize the assumption.","It defines the principals and conditions for assumption.","It defines what the session can do after the role is assumed."],"correct":[2]},{"id":"A-2.1.1-1","skill":"2.1.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"An audit separates physical data center protection from workload configuration. Who controls the entry of people into the building that hosts the AWS servers?","options":["The customer that deployed the VPC","The party responsible for patching the EC2 guest","The organization that consumes the RDS service","AWS"],"why":["The VPC is a logical control and does not operate data center doors.","This customer task happens in a different layer.","Consuming a managed database does not transfer physical access to the building.","Physical protection sits in the provider's infrastructure."],"correct":[3]},{"id":"A-2.1.2-2","skill":"2.1.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"A team needs to prove that AWS infrastructure is within the scope of an independent review. Which evidence should it look for?","options":["A newly created AWS Config rule","The provider's compliance report in AWS Artifact","A price estimate for the Region","The customer's application log"],"why":["It evaluates the customer's configuration; it does not prove the vendor's review.","It documents externally assessed controls and scope.","It is no evidence of control coverage.","It shows the customer's own operations, not an audit of AWS infrastructure."],"correct":[1]},{"id":"A-2.2.1-2","skill":"2.2.1","domain":2,"form":"A","scored":true,"kind":"single","stem":"An audit needs to know when a volume stopped complying with a configuration rule. The identity that made the change is a later question. Which service?","options":["AWS CloudTrail","AWS Config","AWS Artifact","AWS WAF"],"why":["It shows actions taken, but it is not the historical evaluation of the rule.","It keeps a configuration history and the evaluation of applicable rules.","It provides AWS documents, not resource state.","It filters web requests, without evaluating volume configuration."],"correct":[1]},{"id":"A-2.2.2-2","skill":"2.2.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"An application publishes order events. Targets must vary by country and status, without the producer selecting each target. Which service routes by attributes?","options":["A single SQS queue","AWS Config","Amazon EventBridge","An Athena query"],"why":["It holds work for consumers, without configuring the requested routing rules by itself.","It evaluates resources and is not the order event bus.","Event rules select targets by configured criteria.","It analyzes stored data, without routing events in the flow."],"correct":[2]},{"id":"A-2.3.2-2","skill":"2.3.2","domain":2,"form":"A","scored":false,"kind":"single","stem":"An SCP allows a given action to remain available, but the role does not yet have authorization to perform it. Which type of policy grants this action to the role?","options":["The same permissive SCP","An IAM permissions policy","The role's trust policy","A cost allocation tag"],"why":["An SCP is a boundary, not a grant to the principal.","The effective grant of the action comes from the identity's authorization, subject to the applicable restrictions.","It defines who can assume the role, not the APIs after assumption.","It groups spending, without granting APIs."],"correct":[1]},{"id":"A-2.4.1-2","skill":"2.4.1","domain":2,"form":"A","scored":false,"kind":"single","stem":"The team already receives findings from several tools. Now it wants to consolidate this evidence and observe its security posture in a central view. Which service?","options":["AWS Config as the one list of findings","Amazon Macie as a general aggregator","AWS Security Hub","AWS IAM as a findings dashboard"],"why":["It evaluates configuration, but it does not replace the requested consolidation.","It generates sensitive data findings, without being the required overall view.","It consolidates findings and helps track security posture.","It defines access, without aggregating findings from several tools."],"correct":[2]},{"id":"A-2.4.2-2","skill":"2.4.2","domain":2,"form":"A","scored":false,"kind":"single","stem":"The database accepts application TCP traffic. The requirement says that instances associated with the application's group, and no others, should reach its port. Which control should be used?","options":["A WAF URL path policy","A security group that references the application's group","AWS Shield for the database client","A snapshot lifecycle policy"],"why":["HTTP is not the access contract for the TCP database.","It allows the source to be tied to associated resources, where supported.","DDoS protection does not configure permission by group.","It does not control connections to the port."],"correct":[1]},{"id":"A-2.2.3-2","skill":"2.2.3","domain":2,"form":"A","scored":false,"kind":"single","stem":"The secret and the key already exist. The application must use that key and read that secret, and nothing else. Which service expresses the identity's permissions?","options":["Amazon Inspector","Network ACL","AWS IAM","AWS Certificate Manager"],"why":["It points out vulnerabilities, without granting use of resources.","It filters subnet traffic, without authorizing secret and key APIs per identity.","The role's policies specify the authorized actions and resources, together with the applicable policies.","It manages certificates, not the role's policy."],"correct":[2]},{"id":"A-M-3.6.1","skill":"3.6.1","domain":3,"stem":"A team uses buckets for reports and needs a boot volume for EC2. Which TWO pairings are correct?","options":["S3 to store and read reports as objects","EBS for the EC2 boot volume","EFS for EC2's native block root volume","CloudFront as a durable write destination","DynamoDB as a boot disk"],"correct":[0,1],"why":["The API works with objects.","It provides block storage.","EFS offers NFS.","It delivers content at the edge.","It is a NoSQL database."],"kind":"multi","form":"A","scored":true},{"id":"A-M-3.2.1","skill":"3.2.1","domain":3,"stem":"Which TWO statements correctly describe Regions and Availability Zones?","options":["A Region contains multiple Availability Zones","A service can distribute resources across zones to tolerate a zonal failure","Each zone is a separate Region","Edge location is a synonym for Availability Zone","Each AWS service has the same availability across the different Regions"],"correct":[0,1],"why":["They are isolated domains within the Region.","Zonal redundancy meets the requirement.","It confuses scopes.","The edge is another type of infrastructure.","Support depends on the service."],"kind":"multi","form":"A","scored":true},{"id":"A-3.1.1-1","skill":"3.1.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"An operator plans to list instances each morning and feed the output into a Bash script. The tool must call AWS APIs from the terminal. Which should be used?","options":["AWS Management Console","AWS SDK for Java","AWS CLI","AWS CloudShell as a library"],"why":["Manual navigation in the browser does not support scheduled Bash execution.","It integrates calls into Java applications, outside the requested shell interface.","CLI commands access the APIs and produce output the script can process.","It is a terminal environment, not the AWS command interface."],"correct":[2]},{"id":"A-3.1.2-1","skill":"3.1.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"The project shut down its previous data center. The API, the database and the processing now use AWS services and nothing else. Which classification describes the application's environment?","options":["On-premises deployment","Multicloud deployment","Fully cloud deployment","Hybrid deployment"],"why":["The components would be on the company's own infrastructure.","The description presents a single provider.","Each component of the workload runs on cloud resources.","It assumes integration between the cloud and on-premises infrastructure in the workload."],"correct":[2]},{"id":"A-3.3.1-1","skill":"3.3.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"The company already uses Kubernetes manifests and wants to keep sending objects to the Kubernetes API. It plans to delegate operation of the control plane to AWS. Which service should it adopt?","options":["Amazon EKS","Amazon ECS","AWS Elastic Beanstalk","Amazon EC2 with self-managed Kubernetes"],"why":["It provides a managed Kubernetes control plane.","It organizes containers with ECS's own APIs and objects.","It orchestrates application deployment, but it does not deliver the required Kubernetes API.","It keeps operation of the control plane with the team."],"correct":[0]},{"id":"A-3.3.2-1","skill":"3.3.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"A custom TCP application needs managed load balancing at the transport layer. The team wants to keep the protocol and does not use HTTP headers. Which type fits?","options":["Network Load Balancer","AWS Global Accelerator by itself","Application Load Balancer","Amazon CloudFront"],"why":["It supports transport listeners suitable for TCP connections.","It directs traffic to configured endpoints and is not the requested transport-layer load balancer across EC2 targets.","It is oriented to HTTP/HTTPS traffic and does not serve the custom TCP described.","It is a CDN for distributing web content, with no arbitrary TCP listener."],"correct":[0]},{"id":"A-3.4.1-1","skill":"3.4.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"The BI team analyzes years of sales with heavy aggregations and many reports on historical facts. It wants a managed data warehouse. Which service should be selected?","options":["Amazon DynamoDB","Amazon Redshift","Amazon ElastiCache","Amazon RDS for MySQL"],"why":["It favors key-based patterns, rather than a SQL warehouse for BI.","It is a data warehouse designed for SQL analysis of large volumes and aggregations.","It serves low-latency in-memory access, with no analytical warehouse history.","It focuses on an operational relational database and is not the requested data warehouse."],"correct":[1]},{"id":"A-3.4.2-1","skill":"3.4.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"An API rereads session data on almost every request. The team wants a managed in-memory layer to reduce repetitive queries to the main database. Which service should it adopt?","options":["Amazon ElastiCache","Amazon Redshift","Amazon Aurora Global Database","Amazon EFS"],"why":["It offers a low-latency in-memory cache for repeatedly accessed data.","It was designed for warehouse data analysis, without optimizing this session cache.","It replicates an Aurora database across Regions, without adding an in-memory cache layer for the application.","It shares files over NFS, without providing the requested key-value cache."],"correct":[0]},{"id":"A-3.5.1-1","skill":"3.5.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"A publisher wants to serve book covers from a cache close to the reader, reducing traffic to the origin. The public content is delivered over HTTPS. Which service should be deployed?","options":["AWS WAF","AWS Direct Connect","Amazon CloudFront","AWS Global Accelerator"],"why":["It filters web requests, without replicating content in caches.","It connects a physical location to AWS and does not distribute images to the public.","The CDN can store copies at the edge and deliver the content over HTTPS.","It accelerates the network path, without keeping an HTTP cache of this content."],"correct":[2]},{"id":"A-3.5.2-1","skill":"3.5.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"Instances in a private subnet need to download public patches over IPv4. The design must keep the hosts without public IPs and accept responses to traffic they initiate. Which egress component should be used?","options":["S3 gateway endpoint","Public NAT gateway","Internet gateway attached directly to the private route","AWS Client VPN"],"why":["It reaches destinations such as S3 that are compatible with the endpoint, without providing access to arbitrary public repositories.","The gateway, in a public subnet with an internet route, translates traffic initiated by the private hosts.","IPv4 instances without public addresses do not gain direct access with this route.","It connects remote clients to the private network, without providing the IPv4 egress described."],"correct":[1]},{"id":"A-3.6.2-1","skill":"3.6.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"The website serves public files every day and does not want the retrieval charges typical of infrequent access classes. It wants low latency and resilience across multiple AZs. Which class fits?","options":["S3 Express One Zone","S3 Glacier Flexible Retrieval","S3 Standard","S3 Standard-IA"],"why":["The single-AZ scope diverges from the multi-AZ requirement.","It normally requires a restore before the object can be read.","It is suited to frequent access, with low latency and redundancy across several AZs.","It focuses on infrequent access and has a data retrieval fee."],"correct":[2]},{"id":"A-3.7.1-1","skill":"3.7.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"A retailer consolidates sales facts and dimensions in a managed data warehouse. The recurring reports combine large datasets and use SQL. Which service should it evaluate?","options":["Amazon Kinesis Data Streams","Amazon DynamoDB","Amazon Redshift","AWS Glue Data Catalog"],"why":["It carries streaming events, without hosting a SQL data warehouse.","The key-value model does not offer the requested relational warehouse.","It was designed for data warehouse workloads and analytical aggregations at scale.","It records metadata and does not run the warehouse queries by itself."],"correct":[2]},{"id":"A-3.7.2-1","skill":"3.7.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"A team receives comments already in text form and wants to identify the sentiment polarity without training its own model. Which service should be chosen?","options":["Amazon Comprehend","Amazon Lex","Amazon Textract","Amazon Kendra"],"why":["Sentiment analysis can classify the polarity of text in supported languages.","It creates conversational interfaces and identifies configured intents, without being the direct choice for this sentiment analysis.","It reads document content and does not return the polarity of the comments.","It helps search documents, outside the requested classification."],"correct":[0]},{"id":"A-3.8.1-1","skill":"3.8.1","domain":3,"form":"A","scored":true,"kind":"single","stem":"A producer receives more jobs than the consumer can handle during the peak. The consumer wants to fetch pending jobs when it has capacity. Which service should be used for the buffer?","options":["AWS CloudFormation","Amazon EventBridge without a queue","Amazon SNS without a queue subscription","Amazon SQS"],"why":["It provisions infrastructure described by templates, without queuing the work.","It delivers to targets by rule, without offering the requested polling queue.","It sends publications to subscribers, without giving the worker the requested polling queue.","The queue keeps messages available for consumers that receive them at their own pace."],"correct":[3]},{"id":"A-3.8.2-1","skill":"3.8.2","domain":3,"form":"A","scored":true,"kind":"single","stem":"AWS announced maintenance. The on-call engineer wants to confirm the IDs of the affected resources in the account and the event's schedule. Where should they look?","options":["AWS Trusted Advisor cost optimization checks","AWS Billing Dashboard","AWS CloudTrail event history","The account's AWS Health Dashboard"],"why":["It presents cost recommendations, without being the list of resources for the announced maintenance.","It consolidates billing information, not service events with affected resources.","It shows API activity, without replacing AWS's personalized maintenance communication.","It displays events relevant to the account and the affected resources when available."],"correct":[3]},{"id":"A-3.8.3-1","skill":"3.8.3","domain":3,"form":"A","scored":true,"kind":"single","stem":"An application artifact has already been built. The team wants to automate installing the new revision on compatible EC2 instances, with a rollout strategy. Which service should be used?","options":["AWS Artifact","AWS CodePipeline without a deploy action","AWS CodeBuild","AWS CodeDeploy"],"why":["It makes AWS compliance reports and agreements available.","A pipeline without a configured deployment capability does not install the revision on the targets.","It was designed to build and test, while the artifact here already exists.","It coordinates deployment to supported targets, with deployment group settings."],"correct":[3]},{"id":"A-3.8.4-1","skill":"3.8.4","domain":3,"form":"A","scored":true,"kind":"single","stem":"A remote team needs complete, centrally managed virtual desktops. Each professional must access a work environment and use several corporate tools. Which product fits?","options":["AWS Client VPN","Amazon WorkSpaces Personal","AWS IoT Device Management","Amazon CloudFront"],"why":["It offers remote connectivity and does not deliver the virtual workstation.","It provides persistent virtual desktops for users, suited to the workstation described.","It manages fleets of IoT devices, without providing desktops.","It distributes web content and does not provide desktop sessions."],"correct":[1]},{"id":"A-3.6.1-1","skill":"3.6.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"Several Linux instances need to mount the same content directory, including when the fleet scales across AZs. The application requires shared NFS. Which option should be used?","options":["Amazon EBS gp3","Amazon EC2 instance store","Amazon S3 in a Standard class","Amazon EFS Regional"],"why":["It offers a block volume, without the requested NFS sharing.","It is ephemeral storage attached to each host, without sharing.","It keeps objects, without the required managed NFS interface.","It provides a shared NFS file system with mount targets in the configured AZs."],"correct":[3]},{"id":"A-3.2.1-1","skill":"3.2.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"An application needs to survive a localized physical failure. The company wants to keep data and compute in the same Region, in groups with independent power and networking. Which unit should differ between the groups?","options":["VPC","Edge location","Route 53 hosted zone","Availability Zone"],"why":["Creating two VPCs in the same AZ does not create zonal infrastructure isolation.","The delivery edge does not replace the Region's AZs for this workload.","It keeps DNS records, without physically isolating the components.","Separating by AZ uses distinct failure domains within the Region."],"correct":[3]},{"id":"A-3.1.1-2","skill":"3.1.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"A Java API writes objects to S3. The team wants to make calls within its own process and use the library's credential provider. Which option should it choose?","options":["AWS CLI","AWS SDK for Java","Amazon API Gateway","AWS Cloud9"],"why":["It would require invoking an external command process.","It offers Java clients for the APIs and a credential provider chain.","It publishes and manages APIs, without providing the Java S3 client.","A development environment does not replace the application's library."],"correct":[1]},{"id":"A-3.1.2-2","skill":"3.1.2","domain":3,"form":"A","scored":false,"kind":"single","stem":"By internal standard, an application's data and processing remain entirely on the company's private servers. AWS is used for other workloads, which do not communicate with this application. How should the deployment under review be classified?","options":["Single-provider public cloud","Deployment at edge locations","Hybrid deployment","On-premises deployment"],"why":["Cloud services used by other projects do not change where this application runs.","The components are on the company's servers, with no use of the AWS edge.","This workload has no integration between an on-premises component and a cloud service.","The classification of this workload follows where its own components operate."],"correct":[3]},{"id":"A-3.3.1-2","skill":"3.3.1","domain":3,"form":"A","scored":false,"kind":"single","stem":"The team already has ECS task definitions and needs to give up its responsibility for AMIs and cluster nodes. Which capability lets it keep using ECS?","options":["AWS Lambda with a container image","Amazon EC2 Auto Scaling","Amazon ECR","AWS Fargate"],"why":["It runs functions in the Lambda model, without keeping the ECS task definition.","It changes the node fleet while keeping the need to administer it.","It stores container images, without running tasks.","It runs ECS tasks on managed capacity without the team administering hosts."],"correct":[3]},{"id":"A-M-4.2.1","skill":"4.2.1","domain":4,"stem":"Which TWO tools serve, respectively, analysis of recorded spending and an alert on a monthly limit?","options":["Cost Explorer for historical analysis","AWS Budgets for a configured threshold","Pricing Calculator for the actual invoice","CloudTrail as the main budget modeling tool","AWS Artifact to record actual spending"],"correct":[0,1],"why":["It groups processed costs.","It compares spending or the forecast with the budget.","It estimates a future scenario.","It records API activity.","It is a source of compliance reports."],"kind":"multi","form":"A","scored":true},{"id":"A-4.1.1-1","skill":"4.1.1","domain":4,"form":"A","scored":true,"kind":"single","stem":"A company has a predictable baseline spend across EC2, Lambda and Fargate. It accepts committing to an hourly amount for one or three years and wants flexibility across these eligible services. Which option should it choose?","options":["On-Demand Capacity Reservations","EC2 Reserved Instances","Compute Savings Plans","EC2 Instance Savings Plans"],"why":["They reserve EC2 capacity in a given AZ and are not a multi-service discount plan.","They offer benefits for matching EC2 usage, outside Lambda and Fargate.","They apply a discount to eligible compute usage on EC2, Fargate and Lambda in exchange for an hourly commitment.","Their scope is the chosen EC2 family and Region, without the required coverage."],"correct":[2]},{"id":"A-4.1.2-1","skill":"4.1.2","domain":4,"form":"A","scored":true,"kind":"single","stem":"An architecture starts replicating 10 TB per month from the primary database to another Region. The team has already estimated the price of instances and storage in each Region. Which cost dimension still deserves an estimate?","options":["Number of IAM users","Number of DNS hosted zones","Data transfer between Regions","Number of monthly budgets"],"why":["It does not measure replication traffic between Regions.","It does not represent the cost per volume transferred in replication.","The direction, the volume and the service's transfer rules can generate additional cost.","It controls alerts and does not price the movement of the 10 TB."],"correct":[2]},{"id":"A-4.2.2-1","skill":"4.2.2","domain":4,"form":"A","scored":true,"kind":"single","stem":"The financial classification requires grouping some entire accounts, and certain services from other accounts, under Sales and Operations. It needs to apply rules with cost dimensions. Which feature should be adopted?","options":["AWS Budgets","AWS Cost Categories","AWS Pricing Calculator","AWS Organizations organizational units"],"why":["It monitors limits for cost slices, without creating the requested categories.","It defines categories with rules on dimensions such as account, service and tags.","It generates new estimates, without classifying existing line items.","They group entire accounts for governance and do not split cost by service within an account."],"correct":[1]},{"id":"A-4.3.1-1","skill":"4.3.1","domain":4,"form":"A","scored":true,"kind":"single","stem":"Before opening a ticket, a team wants to review the automated best practice checks for cost, security and quotas available on its plan. Which service should it consult?","options":["AWS Support Center as a case queue","AWS Artifact","Organizational AWS Health","AWS Trusted Advisor"],"why":["It records support interactions, without being the catalog of automated checks.","It provides reports and agreements, outside the requested automated assessment.","It aggregates health events, without running the requested checks.","It offers checks by category and recommendations, with coverage depending on the plan."],"correct":[3]},{"id":"A-4.3.2-1","skill":"4.3.2","domain":4,"form":"A","scored":true,"kind":"single","stem":"When signing up, an organization needs to confirm access to technical account guidance and proactive advice. Manuals and billing cases are already enough for its other needs. Which criterion should it compare?","options":["The plan's proactive technical guidance coverage","Consolidated billing in AWS Organizations","The hourly price of EC2 instances","Access to reports in AWS Artifact"],"why":["The plans differ in the level of technical guidance they provide.","It centralizes billing, without determining technical guidance.","It is a dimension of the workload's cost, without defining the plan's support.","It serves compliance, without guaranteeing individual technical guidance."],"correct":[0]},{"id":"A-4.2.1-1","skill":"4.2.1","domain":4,"form":"A","scored":false,"kind":"single","stem":"Daily cost varies by day of the week. The team wants to be alerted about unusual deviation from the learned pattern and does not want to set a monthly cap to detect the event. Which service fits?","options":["AWS Cost Anomaly Detection","AWS Cost Categories","AWS Pricing Calculator","Fixed-cost AWS Budgets"],"why":["It identifies atypical spending and can notify when it meets the configured impact thresholds.","It groups cost line items by rules, without detecting deviations.","It forecasts a scenario entered by the team, outside anomaly monitoring.","It alerts by comparison with the configured amount, without learning the pattern described."],"correct":[0]},{"id":"A-4.1.1-2","skill":"4.1.1","domain":4,"form":"A","scored":false,"kind":"single","stem":"A buyer will compare EC2 offerings by term and by the rules for matching instance attributes. They want to evaluate a pricing benefit in this category that can also reserve capacity when purchased with zonal scope. Which offering should they compare?","options":["EC2 Reserved Instances","Spot Instances","On-Demand Capacity Reservation","EC2 Instance Savings Plans"],"why":["They are pricing benefits for matching usage, and the zonal option has a capacity reservation effect.","They use spare capacity and can be interrupted.","It reserves zonal capacity, without being the pricing benefit by term and matching that the question asks about.","They discount eligible usage in one family and Region, without reserving capacity."],"correct":[0]},{"id":"B-M-1.2.1","skill":"1.2.1","domain":1,"stem":"Which TWO actions demonstrate reliability and operational excellence principles, respectively?","options":["Test recovery from a planned failure","Automate small, reversible changes","Keep the application without a backup","Make each change manually","Record the price of the largest instance"],"correct":[0,1],"why":["It proves the recovery behavior.","It improves operational quality.","It weakens recovery.","It makes repeatability harder.","It does not measure the two requested dimensions."],"kind":"multi","form":"B","scored":true},{"id":"B-1.1.1-1","skill":"1.1.1","domain":1,"form":"B","scored":true,"kind":"single","stem":"A campaign needs an isolated environment to validate an idea before approval. The team provisions it in one afternoon and removes it when finished. Which advantage stands out?","options":["Agility","Long-term retention","Transfer of responsibility for the application","Resilience to failures"],"why":["The temporary environment reduces the wait to experiment.","It does not explain the shorter timeline.","Creating resources quickly does not transfer management of the team's own code.","The motivation is to start the test, not to recover the service."],"correct":[0]},{"id":"B-1.1.2-1","skill":"1.1.2","domain":1,"form":"B","scored":true,"kind":"single","stem":"A simulation recovers transactions up to one minute before the failure, but checkout only comes back after four hours. What should be compared with the four hours?","options":["Checkout error rate in normal operation","RPO","RTO","Backup frequency"],"why":["The outage happened during recovery, not in a normal sample.","The figure for this objective is the one-minute gap.","It is the objective for the maximum duration of recovery.","It can affect data loss, without directly reflecting the measured time to return."],"correct":[2]},{"id":"B-1.2.2-1","skill":"1.2.2","domain":1,"form":"B","scored":true,"kind":"single","stem":"The document processor is unavailable for fifteen minutes. New uploads must be recorded for later processing as soon as it restarts. What stores the pending work?","options":["An SNS topic with no appropriate durable destination","A CloudFront cache","An SQS queue","A Route 53 record"],"why":["It distributes events, but it is not the required worker queue.","It speeds up content delivery, without queuing work.","It separates accepting the upload from later consumption of the jobs.","It locates an endpoint, without capturing pending uploads."],"correct":[2]},{"id":"B-1.3.1-1","skill":"1.3.1","domain":1,"form":"B","scored":true,"kind":"single","stem":"A short window requires migrating licensed software while keeping the OS, configuration and structure. The application will remain the same on cloud instances. Which strategy minimizes changes?","options":["Rehost","Repurchase","Refactor","Retire"],"why":["It preserves the application's elements during the move.","It would require adopting another product.","It would require a redesign incompatible with the deadline.","It would decommission an application that still needs to run."],"correct":[0]},{"id":"B-1.3.2-1","skill":"1.3.2","domain":1,"form":"B","scored":true,"kind":"single","stem":"An organization is starting adoption and wants to map gaps in skills, management, security and platform. It needs guidance before moving the first application. Which reference?","options":["AWS Compute Optimizer","AWS DMS","AWS CAF","AWS CloudFormation"],"why":["It recommends configurations for covered resources, not organizational readiness.","It runs database migration once the approach is defined.","It groups transformation capabilities into organizational perspectives.","It provisions declared infrastructure, without assessing the readiness of people and governance."],"correct":[2]},{"id":"B-1.4.1-1","skill":"1.4.1","domain":1,"form":"B","scored":true,"kind":"single","stem":"Finance includes network, licensing, staff and estimated consumption when comparing keeping operations on premises with migrating. What is being compared?","options":["The price of the test instance","The monthly budget per department","The current month's invoice","The TCO of both designs"],"why":["It is a single line in the comparison.","It sets limits, without calculating lifecycle costs.","It does not cover the scenario's migration and future expenses.","It evaluates the full set of ownership and operating costs over the period."],"correct":[3]},{"id":"B-1.4.2-1","skill":"1.4.2","domain":1,"form":"B","scored":true,"kind":"single","stem":"The service needs to run the whole week. Several weeks of metrics show that the current machine type has excessive headroom, even at peak. Which adjustment investigates the cause of the waste?","options":["Buy more reserved capacity first","Rightsizing of the family and size","Scheduled shutdown outside business hours","Change the class of the backup objects"],"why":["It can extend the commitment to an unnecessary size.","It adapts the resource to the observed usage while preserving the operating window.","The service needs to stay active.","It addresses storage, not excess compute capacity."],"correct":[1]},{"id":"B-1.2.3-1","skill":"1.2.3","domain":1,"form":"B","scored":true,"kind":"single","stem":"A FinOps project measures cost per report and identifies underused resources, while keeping the same processing window. Which pillar guides the review?","options":["Reliability","Operational excellence","Cost optimization","Sustainability"],"why":["It does not measure recovery or failures.","The process may improve, but that is not the measured motivation.","The unit of success is reducing expense for the same delivery.","The review does not define an environmental indicator."],"correct":[2]},{"id":"B-1.2.1-1","skill":"1.2.1","domain":1,"form":"B","scored":true,"kind":"single","stem":"A platform ships releases that are hard to roll back and repeats the same failures. The team adopts automation, post-incident reviews and small batches of change. Which pillar does it focus on?","options":["Cost optimization","Reliability","Operational excellence","Performance efficiency"],"why":["Spending per delivered objective is not being compared.","The goal described is improving operational practice, without a specific recovery test.","The changes improve procedures and the quality of continuous delivery.","The case does not seek to increase throughput or reduce latency."],"correct":[2]},{"id":"B-1.1.1-2","skill":"1.1.1","domain":1,"form":"B","scored":true,"kind":"single","stem":"An instance stops responding during business hours. Another one is already healthy and takes over the requests, without expanding the group. Which property was demonstrated?","options":["Vertical scalability","High availability","Elasticity","Provisioning agility"],"why":["No unit increased in size.","Redundancy makes it possible to continue even with one component unavailable.","Resources were not adjusted to demand.","The example is about continuity, not the speed of creating environments."],"correct":[1]},{"id":"B-1.1.2-2","skill":"1.1.2","domain":1,"form":"B","scored":true,"kind":"single","stem":"An organization has a replica in two zones. The new requirement includes a prolonged outage of the entire primary Region. Which design adds the required recovery domain?","options":["Recoverable capacity and data in another Region","A third instance in the same zone","An additional security group","An edge content cache as the one copy"],"why":["The recovery path does not depend on the lost Region.","It does not extend the failure domain outside the Region.","It changes traffic, without creating a recovery location.","It does not recover the state and execution of the regional system."],"correct":[0]},{"id":"B-1.2.2-2","skill":"1.2.2","domain":1,"form":"B","scored":false,"kind":"single","stem":"The billing system publishes the completion of a charge once. Support and finance must receive independent notifications without querying the producer. Which service?","options":["An Amazon SNS topic","An EC2 Auto Scaling group","A load balancer","A single shared work queue with competing consumers"],"why":["A publication is distributed to the configured subscribers.","It scales compute, without forwarding the business message.","It splits requests among targets; it does not deliver to each subscriber.","It does not provide fan-out to recipients that need independent copies."],"correct":[0]},{"id":"B-1.3.1-2","skill":"1.3.1","domain":1,"form":"B","scored":false,"kind":"single","stem":"The system keeps its screens and rules. The team replaces a self-managed database with a compatible relational service, seeking backups managed by the service. Which strategy?","options":["Retain the workload in the original environment","Relocate the whole platform","Full refactor","Replatform"],"why":["The database leaves the old VM.","The change concerns one specific database and its operation.","There is no large-scale rewrite of the architecture or rules.","The operational improvement applies to part of the platform."],"correct":[3]},{"id":"B-1.3.2-2","skill":"1.3.2","domain":1,"form":"B","scored":false,"kind":"single","stem":"A workload suffered a recovery failure. Before redesigning it, the team wants to review the questions and best practices of the reliability pillar. Which framework should be used?","options":["AWS Service Quotas","AWS Billing Conductor","AWS Well-Architected Framework","AWS CAF as the guide for the workload audit"],"why":["It helps check limits, but it does not provide the full pillar review.","It helps with allocation and billing rules, not recovery.","The reliability pillar focuses on stable operation and workload recovery.","It addresses adoption capabilities; the requested pillar belongs to Well-Architected."],"correct":[2]},{"id":"B-1.4.1-2","skill":"1.4.1","domain":1,"form":"B","scored":false,"kind":"single","stem":"Before knowing whether the product will have customers, the team wants to avoid buying machines. The environment uses temporary capacity according to utilization. Which economic advantage occurs?","options":["Increase fixed cost to plan for discounts","Reduce upfront investment and pay for usage","Eliminate operating expenses entirely","Turn expenses into a consolidated invoice"],"why":["The case seeks to avoid an upfront commitment.","Spending can follow the observed demand.","Actual usage is still charged where applicable.","The billing format does not explain the purchase that was avoided."],"correct":[1]},{"id":"B-M-2.4.1","skill":"2.4.1","domain":2,"stem":"Which TWO pairings describe the purpose of the security service?","options":["Inspector to identify vulnerabilities in supported workloads","Macie to discover sensitive data in S3","Shield to define IAM roles","Security Hub as an object cache","GuardDuty as a TLS certificate issuer"],"correct":[0,1],"why":["It is a vulnerability scanner.","It is the product's scope.","It protects against DDoS.","It centralizes posture and findings.","It detects threat signals."],"kind":"multi","form":"B","scored":true},{"id":"B-M-2.2.2","skill":"2.2.2","domain":2,"stem":"Which TWO pairings separate the recorded cause from the operational effect?","options":["CloudTrail to find out who called the change API","CloudWatch for the alarm on rising errors","Artifact for a traffic alarm","WAF to identify the operator behind that management call","Cost Explorer to attribute the call to the user"],"correct":[0,1],"why":["It records identity activity.","It monitors an operational metric.","It provides compliance documents.","It controls web requests.","It analyzes usage and costs."],"kind":"multi","form":"B","scored":true},{"id":"B-2.1.1-1","skill":"2.1.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"An account creates a bucket for internal documents. The team needs to decide which identities can read objects. Whose access decision is it?","options":["The customer who configures the access policy","The owner of the nearest edge location","AWS, because it operates the S3 infrastructure","The contracted support plan"],"why":["Data authorization is the organization's responsibility, including in S3.","The edge is not the administrator of data permissions.","The provider protects the platform; that does not define the bucket's readers.","The plan offers channels, without configuring access automatically."],"correct":[0]},{"id":"B-2.1.2-1","skill":"2.1.2","domain":2,"form":"B","scored":true,"kind":"single","stem":"AWS trains its data center staff. The company trains its operators on identities and data. Which arrangement describes these responsibilities?","options":["Shared control, with each party acting in a different layer","An exclusive right of the customer","Fully inherited control","Network authorization"],"why":["Each party trains its team for what it administers.","The provider also has training responsibilities.","The customer still needs to train its own operators.","The case is about training, not subnet traffic."],"correct":[0]},{"id":"B-2.2.1-1","skill":"2.2.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"Procurement wants official compliance documentation from the vendor. The request does not involve collecting evidence from the company's resources. Which primary source?","options":["CloudWatch Logs","AWS Trusted Advisor","AWS Health","AWS Artifact"],"why":["It stores logs from the environment, not the provider's documentation.","It runs best practice checks, without providing the requested reports.","It reports service and account events, not the independent auditor's documents.","It is the appropriate place for AWS compliance reports."],"correct":[3]},{"id":"B-2.3.1-1","skill":"2.3.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"A Lambda function writes to a DynamoDB table. The team wants each execution to use temporary least-privilege credentials. What should be configured?","options":["The function's execution role","A table accessible without authentication","Permanent keys shared in the function's variable","The role of whoever publishes the code, as the one control"],"why":["The service assumes the role, which limits the actions on the target.","It removes control over who performs writes.","They expose a long-term credential and make rotation harder.","Deployment and execution are separate identities."],"correct":[0]},{"id":"B-2.3.2-1","skill":"2.3.2","domain":2,"form":"B","scored":true,"kind":"single","stem":"The team already uses a corporate directory. The group needs to choose authorized accounts and sign in without managing separate IAM users in each account. Which option?","options":["A different IAM user per account for each person","AWS Billing Conductor","AWS IAM Identity Center","Amazon VPC Lattice"],"why":["It keeps the duplication the requirement wants to avoid.","It organizes a cost perspective, without federated authentication.","It offers federated access to accounts and central management of assignments.","It handles service connectivity, not people signing in to accounts."],"correct":[2]},{"id":"B-2.4.2-1","skill":"2.4.2","domain":2,"form":"B","scored":true,"kind":"single","stem":"An HTTP API must block requests that combine suspicious headers. The rule needs to evaluate application content. Which product?","options":["VPC Flow Logs","Amazon Inspector for the API","AWS WAF","The subnet's NACL"],"why":["They record network flows, without blocking by HTTP content.","It finds vulnerabilities in supported workloads, without filtering the request.","It evaluates HTTP request patterns according to rules.","A NACL does not analyze these headers."],"correct":[2]},{"id":"B-2.2.3-1","skill":"2.2.3","domain":2,"form":"B","scored":true,"kind":"single","stem":"The repository still contains a database password. The team wants the application to fetch the password at runtime and a compatible mechanism to help rotate it. Which option?","options":["AWS Secrets Manager","S3 Versioning for the password file","A fixed variable in the source code","AWS Config as a credential store"],"why":["It separates the password from the code and integrates storage and rotation of the secret.","It can keep versions, without readily offering credential rotation.","It keeps exposing the secret and makes it harder to rotate.","It documents resource state, without distributing the application's password."],"correct":[0]},{"id":"B-2.4.3-1","skill":"2.4.3","domain":2,"form":"B","scored":true,"kind":"single","stem":"A lab needs to allow traffic to an interface from targets in a specific group. Responses must be handled through connection state. Which control fits?","options":["Security group","AWS WAF","Network ACL","Read permission on the resource through IAM"],"why":["Rules on the resource are stateful and can use a group reference in the compatible scenario.","It evaluates web requests rather than generic network flows.","It operates at the subnet level in a stateless way.","It authorizes service APIs, without defining traffic on the interface."],"correct":[0]},{"id":"B-2.4.1-1","skill":"2.4.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"A new container image will be promoted. The company wants to know beforehand which package versions have known vulnerabilities. Which service?","options":["Amazon CloudWatch for traffic metrics","Amazon Inspector","AWS WAF for web rules","Amazon GuardDuty for runtime threats"],"why":["It measures operations, not known vulnerabilities in the package.","It provides vulnerability assessment for compatible images.","It can block requests, without mapping package vulnerabilities.","Detecting suspicious behavior is different from examining the image's CVEs."],"correct":[1]},{"id":"B-2.2.2-1","skill":"2.2.2","domain":2,"form":"B","scored":true,"kind":"single","stem":"A role was modified. The team needs to reconstruct the sequence of management calls and identify who made them. Which service?","options":["AWS CloudTrail","AWS Config as the one record of authorship","AWS Cost Explorer","AWS Security Hub as a complete trail"],"why":["It records API operations and the user or session context.","It shows configuration and compliance, without being the primary API identity trail.","It shows spending and usage, not identity actions.","It consolidates findings; it does not replace the source of management calls."],"correct":[0]},{"id":"B-2.1.1-2","skill":"2.1.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"AWS updates the hypervisor of an EC2 host. A vulnerable package still exists in the Linux distribution the customer installed on the instance. Who should handle it?","options":["AWS, because it updated the hypervisor","The data center team, because it is a physical control","The customer, in the guest OS","The load balancer associated with the instance"],"why":["Different layers have different owners.","The fix concerns the customer's software, not physical controls.","Operating the guest and its packages is part of security in the cloud.","The load balancer does not manage operating system packages."],"correct":[2]},{"id":"B-2.1.2-2","skill":"2.1.2","domain":2,"form":"B","scored":true,"kind":"single","stem":"The company assesses the security of equipment it does not administer, using AWS's control evidence for the data center. How should this control be classified?","options":["A bucket policy condition","Shared, for the guest system","Application-specific","Inherited from the provider"],"why":["It authorizes objects in another layer.","The guest OS is not the physical infrastructure being assessed.","The application does not implement the control of AWS equipment.","Physical control of the data center is managed by AWS."],"correct":[3]},{"id":"B-2.2.1-2","skill":"2.2.1","domain":2,"form":"B","scored":true,"kind":"single","stem":"Compliance will track its own assessment, with evidence mapped to controls across multiple accounts. Which mechanism organizes this work?","options":["Amazon GuardDuty","AWS Audit Manager","AWS Artifact as the one source","AWS Organizations as the one control"],"why":["It produces threat findings, which cover part of the evidence and no more.","It helps structure the assessment and the collection of evidence by control.","AWS documents do not cover the customer's specific controls.","It groups accounts, without collecting evidence for the whole assessment by itself."],"correct":[1]},{"id":"B-2.3.1-2","skill":"2.3.1","domain":2,"form":"B","scored":false,"kind":"single","stem":"The principal in account A can request AssumeRole, but the role in account B does not trust it. Which part of the target account needs adjusting?","options":["The number of subnets in account B","The trust policy of the role in account B","The class of the objects the role will access","Change control for the caller's code"],"why":["Resource connectivity does not define IAM trust.","The target account needs to accept the appropriate principal, in addition to the caller's permissions.","The class does not authorize creating the session.","Authorship of the code does not replace the role's configuration."],"correct":[1]},{"id":"B-2.3.2-2","skill":"2.3.2","domain":2,"form":"B","scored":false,"kind":"single","stem":"An entire OU must have a management action unavailable, even if an account delegates local permissions. Where should the barrier be applied?","options":["An SCP on the OU through AWS Organizations","A CloudWatch alarm at the time of the call","A cost rule in Budgets","A policy in one of the accounts"],"why":["It blocks the action at the organizational boundary that applies to member accounts.","It detects the event according to the configuration, without preventively limiting authorization.","It acts on spending management, not on the set of allowed APIs.","It may not cover the other accounts in the OU."],"correct":[0]},{"id":"B-2.4.2-2","skill":"2.4.2","domain":2,"form":"B","scored":false,"kind":"single","stem":"A public service already filters web requests. The new dominant risk is a volumetric, distributed attack. Which offering specifically addresses this risk?","options":["AWS Shield","AWS Certificate Manager","AWS Audit Manager","AWS Firewall Manager by itself as a DDoS plan"],"why":["Its scope includes DDoS protection for compatible resources.","It manages certificates and does not absorb a volumetric attack.","It handles control assessments, without inline mitigation.","It centralizes policies; the DDoS protection offering is Shield."],"correct":[0]},{"id":"B-2.2.3-2","skill":"2.2.3","domain":2,"form":"B","scored":false,"kind":"single","stem":"A company needs to maintain encryption keys and limit their use to approved workloads. Which service manages the keys?","options":["AWS CloudTrail by itself","AWS KMS","AWS WAF","AWS IAM Identity Center"],"why":["It can audit calls, without managing the key.","It lets you manage keys and control their use with appropriate policies and grants.","It filters web traffic, without managing data keys.","It manages human access and does not create the resource's keys."],"correct":[1]},{"id":"B-M-3.8.1","skill":"3.8.1","domain":3,"stem":"Which TWO functions complement each other in a workflow that must absorb irregular volume and coordinate approval states?","options":["SQS to queue the work","Step Functions to coordinate steps and branches","CloudTrail to keep an order queue","CloudFront to persist the flow's approval","AWS Config to send each job in the queue to the worker"],"correct":[0,1],"why":["It buffers the volume to be processed.","It maintains the state flow.","It is an activity trail.","It is content distribution.","It evaluates configurations."],"kind":"multi","form":"B","scored":true},{"id":"B-M-3.4.1","skill":"3.4.1","domain":3,"stem":"Which TWO choices correspond directly to the patterns described?","options":["DynamoDB for recurring lookups by item key","Redshift for analysis of a large historical volume","S3 Standard as a transactional relational SQL engine","RDS as a native CDN delivery solution","Route 53 as an in-memory cache for relational data"],"correct":[0,1],"why":["It serves key-value and document access.","It serves warehousing and aggregations.","It is object storage.","It is a database.","It is DNS."],"kind":"multi","form":"B","scored":true},{"id":"B-3.1.1-1","skill":"3.1.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"When opening new sandboxes, a company needs to provision the same roles and network resources in a dependent sequence. It also wants to review the definition before applying changes. Which service should be used?","options":["AWS CloudFormation","AWS Config","Amazon CloudWatch","AWS Service Health Dashboard"],"why":["The stack manages declarative provisioning and can present changes in a change set.","It records and evaluates existing configuration, without provisioning the environment described.","It monitors resources and can trigger alarms.","It presents information about service events."],"correct":[0]},{"id":"B-3.1.2-1","skill":"3.1.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"A migration moved the front end to AWS. Until the next wave, each checkout still queries inventory on a server in the distribution center. How should the current state be described?","options":["On-premises model across two data centers","Full public cloud model","Multiple cloud providers model","Hybrid model"],"why":["The front end already uses a cloud provider.","The inventory still runs outside the cloud.","There is an on-premises environment and one provider, with no evidence of another provider.","Checkout combines a cloud front end with on-premises inventory."],"correct":[3]},{"id":"B-3.2.1-1","skill":"3.2.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"The team will use a new managed service and needs to confirm that it is available in a geography compatible with the data. Which geographic catalog should it compare first?","options":["AWS Regions","Public hosted zones","AWS accounts","CloudFront points of presence"],"why":["The offering of services and features can vary by Region.","They represent DNS domains, without indicating the availability of regional services.","They create administrative boundaries, but the service catalog still depends on location.","They matter for edge delivery, without reflecting the regional catalog."],"correct":[0]},{"id":"B-3.3.1-1","skill":"3.3.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"Auditors request thumbnails when a new document arrives, and at no other time, and each run takes seconds. The company wants to pay mainly for invocations and compute time. Which service matches?","options":["Amazon Lightsail","Amazon S3 Glacier","Amazon EC2 Dedicated Host","AWS Lambda"],"why":["It uses instances and capacity bundles, without on-demand invocation per object.","It stores archive objects, without running the thumbnail routine.","It provisions a dedicated physical server, even when the handler is idle.","It runs short, event-triggered code, with billing that matches this pattern."],"correct":[3]},{"id":"B-3.3.2-1","skill":"3.3.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"The ALB rule already forwards /search to the right targets. During the campaign, latency rises because the target group lacks instances. Which component should change the capacity without changing the HTTP rule?","options":["An EC2 Auto Scaling policy","A higher TTL in Route 53","A new path rule in the ALB","An Amazon EBS snapshot"],"why":["It adjusts the number of instances and allows them to be associated with the target group.","It changes DNS caching, without creating additional application capacity.","It would change the target group selection, which already works.","It copies storage for recovery, without increasing the active fleet."],"correct":[0]},{"id":"B-3.4.2-1","skill":"3.4.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"After the initial load, the new database must keep up with inserts and updates at the source while the team validates the target. Both engines are listed as supported. Which capability should be chosen?","options":["RDS snapshot export","Amazon S3 Replication","AWS DMS schema conversion","AWS Database Migration Service CDC"],"why":["It generates a point-in-time view, without continuously following the database that is open for writes.","It replicates objects between buckets, without interpreting database log events.","It handles the database model and objects, without replicating the stream of changes.","It replicates incremental changes to the target from the configured source."],"correct":[3]},{"id":"B-3.5.1-1","skill":"3.5.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"An application has endpoints in two Regions. The team wants DNS responses to use a configured latency-based routing policy. Which service configures this choice?","options":["Amazon Route 53","AWS Network Firewall","Amazon CloudFront with caching","AWS Global Accelerator"],"why":["A latency policy controls the DNS zone's responses for eligible endpoints.","It filters VPC traffic and does not decide which DNS records to publish.","The cache serves content from a distribution, without editing the company's DNS policy.","It selects a path for traffic after its addresses are resolved, without configuring the requested DNS policy."],"correct":[0]},{"id":"B-3.5.2-1","skill":"3.5.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"The data center already has internet access and wants to enable connectivity to the VPC using two IPsec tunnels managed by AWS. The priority is to avoid acquiring a physical circuit. Which option?","options":["Dedicated AWS Direct Connect","AWS PrivateLink","AWS Site-to-Site VPN","VPC sharing"],"why":["It depends on provisioning dedicated connectivity.","It offers access to services through endpoints and does not establish IPsec tunnels.","It creates compatible tunnels that can run over the existing internet connection.","It shares subnets with other accounts and does not extend the physical network through a VPN."],"correct":[2]},{"id":"B-3.6.1-1","skill":"3.6.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"A data lake writes Parquet files and identifies them by prefix and key. Analytics engines must read the files directly through an object API. Which service should be used as the central storage?","options":["Amazon EBS Multi-Attach","Amazon EFS One Zone","Amazon S3","Amazon RDS"],"why":["It shares certain block volumes under specific conditions, without creating an object namespace.","It presents a file share, scoped to one AZ.","The object API and buckets fit the model of the analytics tools described.","It stores data in managed databases, not Parquet files accessible through an object API."],"correct":[2]},{"id":"B-3.6.2-1","skill":"3.6.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"A legal archive retains large volumes for seven years, almost never downloads copies and can request restores in advance. Which class minimizes the AWS storage fee for this profile?","options":["S3 Intelligent-Tiering without the optional archive tiers","S3 Glacier Instant Retrieval","S3 Standard-IA","S3 Glacier Deep Archive"],"why":["It automates moves between active tiers, but it does not use the optional Deep Archive tier in this design.","It is optimized for immediate retrieval, beyond what is needed.","It keeps fast retrieval and a storage price higher than deep archive.","It offers the lowest storage cost among S3 classes for very infrequent archiving with planned restores."],"correct":[3]},{"id":"B-3.7.1-1","skill":"3.7.1","domain":3,"form":"B","scored":true,"kind":"single","stem":"A company already keeps logs in S3 and tables in the Glue Data Catalog. An incident requires ad hoc SQL on the objects without moving the data to a new database. Which service should be chosen?","options":["Amazon Athena","AWS DMS Schema Conversion","Amazon Aurora Serverless","Amazon Managed Service for Apache Flink"],"why":["It can query these objects directly using the catalog's definitions.","It assesses and converts database schemas, without ad hoc queries on logs.","It is a relational database and not the direct option for querying cataloged objects.","It is aimed at real-time stream processing."],"correct":[0]},{"id":"B-3.7.2-1","skill":"3.7.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"Accounting receives scanned tables from suppliers. It needs to preserve rows, columns and cells when extracting the content. Which service offers this structure?","options":["Amazon Textract","Amazon Comprehend for entities","Amazon Rekognition for labels","Amazon Translate"],"why":["It detects tables and returns structured relationships between blocks and cells.","It extracts entities from input text, without performing a structured reading of the document.","It classifies visual elements in images, without returning the table's rows and columns.","It translates text and does not rebuild the cells of the scanned file."],"correct":[0]},{"id":"B-3.8.2-1","skill":"3.8.2","domain":3,"form":"B","scored":true,"kind":"single","stem":"Operations wants to send a diagnostic script to managed instances without opening individual SSH sessions. Which service offers the appropriate function?","options":["AWS Systems Manager","AWS Trusted Advisor","Amazon Inspector","Amazon EventBridge by itself"],"why":["Run Command uses the managed nodes, making it possible to centralize sending commands and collecting results.","It offers checks and recommendations, without managing commands for the fleet.","It audits vulnerabilities and exposures, without acting as an on-demand script runner.","It can trigger a target, but it does not run the script on the guest system."],"correct":[0]},{"id":"B-3.8.3-1","skill":"3.8.3","domain":3,"form":"B","scored":true,"kind":"single","stem":"The company does not want to maintain idle build agents. Each repository has a file that lists build, test and artifact creation commands. Which service runs the commands on demand?","options":["AWS CloudFormation","AWS CodeBuild","AWS CodeDeploy","Amazon Inspector"],"why":["It interprets infrastructure templates, without running the application's buildspec.","It uses a managed environment and can read the steps in the buildspec file.","It reads deployment specifications for staged rollouts, outside the build described.","It identifies supported vulnerabilities, without running the full build routine."],"correct":[1]},{"id":"B-3.8.4-1","skill":"3.8.4","domain":3,"form":"B","scored":true,"kind":"single","stem":"Each thermostat needs its own identity to publish and receive messages. The platform must manage device connections and forward telemetry to AWS services. Which should be chosen?","options":["AWS IoT Core","Amazon SQS as the one service","Amazon API Gateway HTTP API","AWS Amplify"],"why":["It manages authenticated device communication and can forward messages through rules.","It queues messages, without establishing and managing individual device connections.","It exposes HTTP endpoints; the scenario calls for the managed IoT communication and identity model.","It serves application development and delivery, without the solution's IoT broker."],"correct":[0]},{"id":"B-3.8.1-1","skill":"3.8.1","domain":3,"form":"B","scored":false,"kind":"single","stem":"An approval goes through automated review, human approval and compensation if processing fails. The system needs to represent the transitions and track the individual state of each request. Which service should be used?","options":["Amazon SQS FIFO","Amazon EventBridge Scheduler","AWS Step Functions","A standalone AWS Lambda function"],"why":["It can keep order within each message group, without representing the approval flow by itself.","It invokes scheduled tasks, without storing the state of these business decisions.","The state machine records the execution and allows configured branches, waits and error handling.","It can run tasks, but the team would need to implement the orchestration and state."],"correct":[2]},{"id":"B-3.4.1-1","skill":"3.4.1","domain":3,"form":"B","scored":false,"kind":"single","stem":"Each device looks up a single profile by identifier. The profiles have optional fields and require no joins, and the API needs a managed key-value service. Which should be chosen?","options":["Amazon DynamoDB","Amazon Timestream","Amazon Aurora","Amazon DocumentDB"],"why":["The key serves access by identifier, and items accept variable attributes.","It is aimed at time series and the analysis of measurements over time.","It applies a relational model to storage and querying.","It is oriented to MongoDB-compatible queries, a requirement absent from this key-centered pattern."],"correct":[0]},{"id":"B-3.1.1-2","skill":"3.1.1","domain":3,"form":"B","scored":false,"kind":"single","stem":"During an on-call shift, a person needs to switch Regions and inspect the configuration of two Lambda functions in the browser. The user already has permissions. Which option fits this mode of use?","options":["AWS Management Console","AWS IAM Identity Center","AWS CloudFormation Designer","AWS Tools for PowerShell"],"why":["It lets you select the Region and open the Lambda functions page.","It can make sign-in easier, but the inspection is done in the service's interface.","It works with a representation of templates, not with the requested operational navigation.","It requires PowerShell cmdlets to query the resources."],"correct":[0]},{"id":"B-3.1.2-2","skill":"3.1.2","domain":3,"form":"B","scored":false,"kind":"single","stem":"A hospital wants to keep compute in the building to communicate with latency-sensitive equipment. It needs AWS hardware on site and integration with the Region. Which offering was designed for this?","options":["AWS Outposts","AWS Global Accelerator","AWS Site-to-Site VPN","AWS Snowball Edge"],"why":["AWS installs compatible infrastructure on site and integrates its operation with a Region.","It optimizes traffic paths to eligible endpoints.","It creates a network connection, without bringing compute infrastructure to the hospital.","It is aimed at data transfer or edge computing with devices, without offering the regional extension model described."],"correct":[0]},{"id":"B-3.2.1-2","skill":"3.2.1","domain":3,"form":"B","scored":false,"kind":"single","stem":"A video platform wants to shorten the network trip for cover images while keeping a single origin. In which AWS unit can its distributed caches serve the audience?","options":["Transit gateway","Billing Region","The origin's data center","Edge point of presence"],"why":["It interconnects networks, without acting as a distribution cache.","Expense classification does not position cache copies.","Keeping the cache at the origin alone preserves the distance to remote users.","CloudFront uses edge infrastructure for delivery to users."],"correct":[3]},{"id":"B-M-4.1.1","skill":"4.1.1","domain":4,"stem":"Which TWO choices fit, respectively, an interruptible batch and a new workload with uncertain usage and no commitment?","options":["Spot for a resumable batch","On-Demand for a test with no commitment","Savings Plans as a capacity guarantee","Reserved Instances for a pilot that requires zero term obligation","Spot as the one capacity for a strict availability requirement"],"correct":[0,1],"why":["It uses spare capacity subject to interruption.","It serves variable, temporary consumption.","It is a discount commitment with conditions.","The conditions involve a commitment.","It can be interrupted."],"kind":"multi","form":"B","scored":true},{"id":"B-4.1.2-1","skill":"4.1.2","domain":4,"form":"B","scored":true,"kind":"single","stem":"Before launch, the owner compares two architectures with different instance sizes and storage. They want to share the estimates calculated for each configuration. Which service should be used?","options":["AWS Pricing Calculator","AWS Billing Conductor","AWS Cost Categories","AWS Cost Anomaly Detection"],"why":["It lets you build and share scenario estimates with service configurations.","It customizes a particular billing view for groups, without modeling a new architecture.","It classifies costs, without calculating prices for hypothetical scenarios.","It detects atypical patterns in actual spending."],"correct":[0]},{"id":"B-4.2.1-1","skill":"4.2.1","domain":4,"form":"B","scored":true,"kind":"single","stem":"Each team has a maximum monthly amount defined by policy. The owner wants to be alerted when 80% of the planned amount is reached in their account. Which service should configure the threshold?","options":["AWS Cost Explorer without alerts","AWS Budgets","Trusted Advisor recommendations report","AWS Data Exports"],"why":["It helps visualize spending, but it does not configure the requested notification.","It lets you attach notifications to defined percentages of a cost budget.","It suggests optimizations, without monitoring this budget percentage.","It delivers the data to S3, without sending the threshold alert by itself."],"correct":[1]},{"id":"B-4.2.2-1","skill":"4.2.2","domain":4,"form":"B","scored":true,"kind":"single","stem":"A group wants to keep project accounts separate and unify billing ole","AWS CLI","AWS SDK","AWS CloudFormation"],"correct":[0],"why":["Meets the requirement. Graphical interface for human use and one-off operations.","This choice meets a different requirement. Command interface for interactive routines or scripts.","This choice meets a different requirement. Libraries for calling services from an application's code.","This choice meets a different requirement. Declarative templates and stack lifecycle."],"kind":"single","form":"B","scored":false},{"id":"B-3.1.2-2","skill":"3.1.2","domain":3,"stem":"The requirement is to install compatible AWS infrastructure close to on-premises equipment instead of moving all processing. Which offering?","options":["Cloud-only","Hybrid","On-premises","AWS Outposts"],"correct":[3],"why":["This choice meets a different requirement. The workload's components run on AWS with no on-premises dependencies described.","This choice meets a different requirement. On-premises and AWS components operate in an integrated way.","This choice meets a different requirement. The workload stays on on-premises infrastructure.","Meets the requirement. Extends AWS infrastructure and compatible services to the customer's site."],"kind":"single","form":"B","scored":false},{"id":"B-3.2.1-2","skill":"3.2.1","domain":3,"stem":"The team wants to bring asset delivery to points close to the audience while keeping the origin where it is. Which unit is meant for this?","options":["AWS Region","Availability Zone","Edge location","Multi-Region strategy"],"correct":[2],"why":["This choice meets a different requirement. Geographic choice for residency, latency and available services.","This choice meets a different requirement. An isolated failure domain within a Region.","Meets the requirement. A point of presence that brings delivery services closer to users.","This choice meets a different requirement. Runs or recovers workloads in more than one Region when requirements justify it."],"kind":"single","form":"B","scored":false},{"id":"B-M-4.1.1","skill":"4.1.1","domain":4,"stem":"Which TWO choices meet the interruptible batch and new load with uncertain use without commitment, respectively?","options":["Spot for retreadable batch","On-Demand for uncompromised testing","Savings Plans as a guarantee of capacity","Reserved Pilot Procedures that require zero time obligation","Spot as the only capacity for unshakable availability requirement"],"correct":[0,1],"why":["Meets the requirement. Uses spare capacity subject to interruption.","Meets the requirement. Covers variable, temporary consumption.","This choice meets a different requirement. It is a discount commitment with conditions.","This choice meets a different requirement. The conditions involve a commitment.","This choice meets a different requirement. It can be interrupted."],"kind":"multi","form":"B","scored":true},{"id":"B-4.1.2-1","skill":"4.1.2","domain":4,"stem":"A new project's budget needs a cost simulation before signing. Which tool?","options":["AWS Pricing Calculator","AWS Cost Explorer","Data transfer model","Storage cost drivers"],"correct":[0],"why":["Meets the requirement. Estimates costs for planned services and volume.","This choice meets a different requirement. Analyzes recorded costs and usage and lets you explore trends.","This choice meets a different requirement. Considers source, destination and the service's billing rules.","This choice meets a different requirement. Consider volume, class, requests, retention and retrieval."],"kind":"single","form":"B","scored":true},{"id":"B-4.2.1-1","skill":"4.2.1","domain":4,"stem":"The planned limit is fixed per account and must produce configured notifications. Which service?","options":["AWS Cost Explorer","AWS Budgets","AWS Data Exports","AWS Cost Anomaly Detection"],"correct":[1],"why":["This choice meets a different requirement. Analyzes historical consumption, groupings and trends.","Meets the requirement. Tracks planned amounts and limits, with configurable notifications.","This choice meets a different requirement. Delivers detailed cost and usage datasets.","This choice meets a different requirement. Identifies abnormal spend compared with expected behavior."],"kind":"single","form":"B","scored":true},{"id":"B-4.2.2-1","skill":"4.2.2","domain":4,"stem":"Payment needs to be centralized without losing the multi-account structure. Which feature?","options":["AWS Organizations consolidated billing","Cost allocation tags","AWS Cost Categories","AWS Budgets"],"correct":[0],"why":["Meets the requirement. Coordinates payment and an aggregated view for the organization's accounts.","This choice meets a different requirement. Associate eligible costs with business labels once activated.","This choice meets a different requirement. Groups costs with custom categories and rules.","This choice meets a different requirement. Monitors spend or usage against planned limits."],"kind":"single","form":"B","scored":true},{"id":"B-4.3.1-1","skill":"4.3.1","domain":4,"stem":"The procedure requires recording a case with severity and a history of interactions with AWS. Which channel?","options":["AWS Support Center","AWS Health Dashboard","AWS Trusted Advisor","AWS re:Post"],"correct":[0],"why":["Meets the requirement. Opens and tracks cases through the channels of the contracted plan.","This choice meets a different requirement. Presents service events and events relevant to the account's resources.","This choice meets a different requirement. Provides recommendations based on the available checks.","This choice meets a different requirement. Offers a forum and community technical knowledge."],"kind":"single","form":"B","scored":true},{"id":"B-4.3.2-1","skill":"4.3.2","domain":4,"stem":"The team needs to discuss payment and account information. Which support is the starting point?","options":["Use account and billing support","Use the contracted technical support plan","Compare plans with technical account guidance","Use the checks available in Truste
