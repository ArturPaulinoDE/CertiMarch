fore there is any real usage."],["AWS Budgets","Tracks a limit with alerts, without building the requested initial architecture estimate."]]},{"id":"P-4.1.2-2","prompt":"After receiving the quarter's bill, finance wants to isolate the service that best explains the increase. It needs to filter and group actual costs without building a pipeline. Which tool should it use?","solution":"AWS Cost Explorer","explanation":"Explores cost history with filters, groupings and time granularity.","options":[["AWS Support Center","Lets you open a case, but does not provide the requested interactive historical analysis."],["AWS Cost Explorer","Explores cost history with filters, groupings and time granularity."],["AWS Organizations","Groups accounts and billing, without replacing the analytical interface."],["AWS Pricing Calculator","Estimates a scenario, without investigating the actual bill."]]}],"cue":"Before the first deploy, the team wants to estimate the bill for a volume scenario. Which tool?","answer":"AWS Pricing Calculator","use":"Meets the requirement. Estimates costs for planned services and volume.","avoid":"An estimate of a future architecture does not replace the analysis of historical usage and cost.","example":"Work out which variables change if a consumer starts reading from another Region.","detail":[],"legacy":"ficha/4.1.2","params":[["AWS Pricing Calculator","Estimates costs for planned services and volume.","Before the first deploy, the team wants to estimate the bill for a volume scenario. Which tool?"],["AWS Cost Explorer","Analyzes recorded costs and usage and lets you explore trends.","The team wants to find out which service caused the increase in spend last quarter. Which tool?"],["Data transfer model","Considers source, destination and the service's billing rules.","An application replicates data to another Region. Which additional dimension should be investigated in the estimate?"],["Storage cost drivers","Consider volume, class, requests, retention and retrieval.","The company compares two S3 classes with long retention and different retrieval rates. Which dimension dominates?"]],"notes":null},{"code":"4.2.1","id":"4.2.1","domain":4,"task":"4.2","title":"Cost Explorer, Budgets, Data Exports and anomalies","concept":"Cost Explorer analyzes cost and usage trends. Budgets tracks limits and sends alerts according to its configuration. Data Exports delivers detailed billing data for analysis. Cost Anomaly Detection identifies unusual spending patterns in configured monitors.","control":"Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts.","pitfall":"Setting a budget with an alert does not impose a hard, universal ceiling on the bill.","verify":"Given a cost increase, state which tool detects it, which investigates it and which provides the data that supports external analysis.","decisions":[["AWS Cost Explorer","Analyzes historical consumption, groupings and trends."],["AWS Budgets","Tracks planned amounts and limits, with configurable notifications."],["AWS Data Exports","Delivers detailed cost and usage datasets."],["AWS Cost Anomaly Detection","Identifies abnormal spend compared with expected behavior."]],"docs":[["Analysis with Cost Explorer","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html"],["AWS Budgets","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/budgets-managing-costs.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-4.2.1-1","prompt":"A project's monthly ceiling is US$ 8,000. Finance wants to receive a notice when the cost forecast exceeds the ceiling so it can act before the close. Which tool should be configured?","solution":"AWS Budgets","explanation":"Sends configured notifications for limits on actual or forecast cost.","options":[["AWS Budgets","Sends configured notifications for limits on actual or forecast cost."],["AWS Pricing Calculator","Models hypothetical costs, without producing the requested account alert."],["AWS Cost Categories","Organizes costs for analysis, without monitoring the ceiling by itself."],["AWS Cost Anomaly Detection","Uses spending patterns to detect anomalies, without using this fixed ceiling as the main condition."]]},{"id":"P-4.2.1-2","prompt":"The FinOps team needs to ingest detailed cost and usage records into its own analytics environment. The destination must receive queryable files continuously. Which feature should it use?","solution":"AWS Data Exports with CUR 2.0","explanation":"Exports detailed billing and usage data to an S3 bucket.","options":[["AWS Cost Explorer dashboard","Analyzes costs interactively, without delivering the requested detailed line-item files."],["AWS Billing Alerts in CloudWatch","Offers an estimated charges metric, without exporting usage records."],["AWS Organizations","Centralizes the organization of accounts, but does not generate the export on its own."],["AWS Data Exports with CUR 2.0","Exports detailed billing and usage data to an S3 bucket."]]}],"cue":"Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit. Which service?","answer":"AWS Budgets","use":"Meets the requirement. Tracks planned amounts and limits, with configurable notifications.","avoid":"Setting a budget with an alert does not impose a hard, universal ceiling on the bill.","example":"Given a cost increase, state which tool detects it, which investigates it and which provides the data that supports external analysis.","detail":[],"legacy":"ficha/4.2.1","params":[["AWS Cost Explorer","Analyzes historical consumption, groupings and trends.","The manager wants to browse recorded cost interactively by tag and month. Which tool?"],["AWS Budgets","Tracks planned amounts and limits, with configurable notifications.","Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit. Which service?"],["AWS Data Exports","Delivers detailed cost and usage datasets.","The team wants to feed its own data warehouse with detailed usage records. Which feature?"],["AWS Cost Anomaly Detection","Identifies abnormal spend compared with expected behavior.","The intention is to detect an unusual spending pattern without starting from a fixed budget amount. Which service?"]],"notes":"4.2.1"},{"code":"4.2.2","id":"4.2.2","domain":4,"task":"4.2","title":"Consolidated billing, tags and cost allocation","concept":"Organizations enables consolidated billing for the organization's accounts under the management account. Allocation tags, properly activated and applied, help separate expenses by cost center. Cost Categories group costs with business rules. Budgets monitor limits and do not define the classification on their own.","control":"Separate payer, classification and visibility. An account is an administrative boundary, while a cost center can aggregate several accounts. Define tagging standards and handle unclassified resources.","pitfall":"Consolidated billing does not merge all accounts or remove the teams' isolated access.","verify":"Reconcile cost per account with cost per product and identify the expense with no owner.","decisions":[["AWS Organizations consolidated billing","Coordinates payment and an aggregated view for the organization's accounts."],["Cost allocation tags","Associate eligible costs with business labels once activated."],["AWS Cost Categories","Groups costs with custom categories and rules."],["AWS Budgets","Monitors spend or usage against planned limits."]],"docs":[["AWS Organizations — concepts","https://docs.aws.amazon.com/pt_br/organizations/latest/userguide/orgs_getting-started_concepts.html"],["Analysis with Cost Explorer","https://docs.aws.amazon.com/pt_br/cost-management/latest/userguide/ce-what-is.html"]],"scenarios":[{"id":"P-4.2.2-1","prompt":"Three subsidiaries keep independent AWS accounts for governance. Finance wants a central payer and an aggregated billing view. Which feature should be adopted?","solution":"Consolidated billing in AWS Organizations","explanation":"Brings together the billing of the organization's accounts in the management account, keeping the member accounts separate.","options":[["AWS Cost Categories","Groups costs for analysis, without changing who pays."],["AWS IAM Identity Center","Centralizes workforce access, without taking on payment for accounts."],["AWS Control Tower Account Factory","Helps provision accounts, but central billing comes from the organization."],["Consolidated billing in AWS Organizations","Brings together the billing of the organization's accounts in the management account, keeping the member accounts separate."]]},{"id":"P-4.2.2-2","prompt":"Resources from two products share the same accounts. FinOps wants to use the Product key already set on each eligible resource to view future costs by product. What needs to be enabled?","solution":"Cost allocation tags","explanation":"Activates the resource tag in billing, allowing attribution in the applicable reports.","options":[["Cost allocation tags","Activates the resource tag in billing, allowing attribution in the applicable reports."],["IAM session tags","Provide context for session authorization, without replacing the resources' cost tags."],["Billing Conductor billing groups","Organize accounts for billing views, but they are not the feature that activates the existing key."],["Service Control Policies","Limit permissions in accounts, without bringing resource tags into billing."]]}],"cue":"The company wants to pay one aggregated bill while keeping separate accounts. Which feature?","answer":"AWS Organizations consolidated billing","use":"Meets the requirement. Coordinates payment and an aggregated view for the organization's accounts.","avoid":"Consolidated billing does not merge all accounts or remove the teams' isolated access.","example":"Reconcile cost per account with cost per product and identify the expense with no owner.","detail":[],"legacy":"ficha/4.2.2","params":[["AWS Organizations consolidated billing","Coordinates payment and an aggregated view for the organization's accounts.","The company wants to pay one aggregated bill while keeping separate accounts. Which feature?"],["Cost allocation tags","Associate eligible costs with business labels once activated.","The team wants to attribute costs to a product using resource metadata. Which feature?"],["AWS Cost Categories","Groups costs with custom categories and rules.","Finance needs to group accounts and services into categories such as Sales and Operations with its own rules. Which tool?"],["AWS Budgets","Monitors spend or usage against planned limits.","The company has already separated its cost centers and wants to be notified when a limit is exceeded. Which one?"]],"notes":null},{"code":"4.3.1","id":"4.3.1","domain":4,"task":"4.3","title":"Technical resources, account status and support channels","concept":"The support plan determines channels, coverage and response times according to the current terms. AWS Health shows events related to services and resources. Trusted Advisor offers checks and recommendations. re:Post provides community knowledge for questions and research.","control":"Distinguish an incident that requires contracted support, a service event that already has a status, a best-practice check and editing a runbook with public information. Check the current plans table for names and first-response SLAs.","pitfall":"A first-response SLA is not a promise to resolve the incident within the same time.","verify":"Choose the first channel for four different situations and identify when to open a case.","decisions":[["AWS Support Center","Opens and tracks cases through the channels of the contracted plan."],["AWS Health Dashboard","Presents service events and events relevant to the account's resources."],["AWS Trusted Advisor","Provides recommendations based on the available checks."],["AWS re:Post","Offers a forum and community technical knowledge."]],"docs":[["Current AWS support plans","https://aws.amazon.com/pt/premiumsupport/plans/"],["AWS Health","https://docs.aws.amazon.com/pt_br/health/latest/ug/what-is-aws-health.html"],["AWS Trusted Advisor","https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/"]],"scenarios":[{"id":"P-4.3.1-1","prompt":"A production workload is down. The account has technical support coverage and the on-call engineer needs to open a case with the appropriate severity. Which channel should be used?","solution":"AWS Support Center","explanation":"It is the interface for creating and managing cases according to the contracted plan.","options":[["Public AWS re:Post","Lets you ask the community questions, without opening a case with contracted severity."],["Public AWS Health Dashboard","Shows the public health of services, without recording the private technical case."],["AWS Support Center","It is the interface for creating and managing cases according to the contracted plan."],["AWS Trusted Advisor","Presents checks and recommendations; it is not the technical support queue."]]},{"id":"P-4.3.1-2","prompt":"AWS published a maintenance notice. The team wants to confirm whether the instances in its account are among the affected resources. Where should it check?","solution":"The account's AWS Health Dashboard","explanation":"Presents personalized events and the affected resources when they are identified.","options":[["AWS Support Plans","Presents the plans' commercial features, without listing affected instances."],["Amazon CloudWatch Logs Insights","Queries logs configured by the customer; it is not the AWS personalized events dashboard."],["The account's AWS Health Dashboard","Presents personalized events and the affected resources when they are identified."],["Public AWS status page","Shows public events, without the personalized list of the account's instances."]]}],"cue":"A company with coverage wants to open a case for a production incident. Where?","answer":"AWS Support Center","use":"Meets the requirement. Opens and tracks cases through the channels of the contracted plan.","avoid":"A first-response SLA is not a promise to resolve the incident within the same time.","example":"Choose the first channel for four different situations and identify when to open a case.","detail":[],"legacy":"ficha/4.3.1","params":[["AWS Support Center","Opens and tracks cases through the channels of the contracted plan.","A company with coverage wants to open a case for a production incident. Where?"],["AWS Health Dashboard","Presents service events and events relevant to the account's resources.","The team wants to confirm whether maintenance affects specific resources in the account. Where?"],["AWS Trusted Advisor","Provides recommendations based on the available checks.","The team wants a list of opportunities found by best-practice checks. Where?"],["AWS re:Post","Offers a forum and community technical knowledge.","A student wants to look up public technical questions and answers without opening a case. Where?"]],"notes":null},{"code":"4.3.2","id":"4.3.2","domain":4,"task":"4.3","title":"Support plans and technical help by need","concept":"Compare the current plans table by coverage, channels, response times, criticality and need for technical guidance. In November 2026, AWS documents the transition from legacy plans and offerings such as Business Support+, Enterprise Support and Unified Operations. Names in earlier exams or materials may reflect another period.","control":"Basic includes self-service resources and account and billing support. For production technical support, compare the paid options and their channels. For strategic service and guidance, check the offering's services table. Validate the current terms before concluding eligibility.","pitfall":"A plan enables specific support channels and conditions; an initial-response SLA does not guarantee resolution within that time.","verify":"For each scenario, identify whether there is a billing question, a critical technical case, a need for proactive support or a lookup of recommendations.","decisions":[["Use account and billing support","Routes the administrative request through the corresponding channel."],["Use the contracted technical support plan","Engages technical coverage and a channel suited to the severity."],["Compare plans with technical account guidance","Considers proactive guidance and management features in the current offering."],["Use the checks available in Trusted Advisor","Identifies the expected opportunities and alerts, depending on access."]],"docs":[["Current AWS support plans","https://aws.amazon.com/pt/premiumsupport/plans/"],["Plan transition and support timelines","https://aws.amazon.com/pt/premiumsupport/faqs/"],["AWS Trusted Advisor","https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/"]],"scenarios":[{"id":"P-4.3.2-1","prompt":"A customer with Basic support needs to correct information in its account and clarify a charge on the bill. There is no technical incident. Which type of support should it look for?","solution":"Account and billing support","explanation":"This support is available for account and billing questions, including on Basic.","options":[["Production technical support","It is intended for technical problems under contracted coverage."],["AWS Trusted Advisor","Shows checks and does not correct account information."],["Public AWS re:Post","It is not appropriate for handling the account's or the bill's private data."],["Account and billing support","This support is available for account and billing questions, including on Basic."]]},{"id":"P-4.3.2-2","prompt":"A critical system is down and the customer wants technical assistance with a formal severity, according to the approved coverage. What should it do?","solution":"Open a technical case according to the plan","explanation":"The plan defines the channels, eligible severities and response commitments.","options":[["Post the incident in an open forum","The forum does not provide support under the plan or the requested severity."],["Open a technical case according to the plan","The plan defines the channels, eligible severities and response commitments."],["Open a billing case","The billing team handles payments and the account, outside the application incident."],["Check only the public status","Can provide context, but does not start individual technical support."]]}],"cue":"The customer needs to clarify billing, without requesting a technical diagnosis of an application. Which channel, by purpose?","answer":"Use account and billing support","use":"Meets the requirement. Routes the administrative request through the corresponding channel.","avoid":"A plan enables specific support channels and conditions; an initial-response SLA does not guarantee resolution within that time.","example":"For each scenario, identify whether there is a billing question, a critical technical case, a need for proactive support or a lookup of recommendations.","detail":[],"legacy":"ficha/4.3.2","params":[["Use account and billing support","Routes the administrative request through the corresponding channel.","The customer needs to clarify billing, without requesting a technical diagnosis of an application. Which channel, by purpose?"],["Use the contracted technical support plan","Engages technical coverage and a channel suited to the severity.","A production incident requires technical support and a channel with severity. Which path?"],["Compare plans with technical account guidance","Considers proactive guidance and management features in the current offering.","The organization needs proactive technical guidance through its support offering. Which requirement should it compare when buying?"],["Use the checks available in Trusted Advisor","Identifies the expected opportunities and alerts, depending on access.","The team wants optimization suggestions from eligible checks, without opening a case at that moment. Which feature?"]],"notes":null}],"cards":[],"trees":[{"id":"master4","title":"Master tree · 6 skills","domain":4,"note":"Each condition leads to a question or an answer. Use Reading size to enlarge it.","root":{"question":"Which problem do you need to solve?","branches":[{"when":"Pricing models","child":{"question":"Which requirement explains the decision about pricing models?","branches":[{"when":"A distributed job resumes processing and accepts interruptions to save money.","child":{"id":"4.1.1","answer":"Spot Instances"}},{"when":"Before the first deploy, the team wants to estimate the bill for a volume scenario.","child":{"id":"4.1.2","answer":"AWS Pricing Calculator"}}]}},{"when":"Billing, budgets and cost management","child":{"question":"Which requirement explains the decision about billing, budgets and cost management?","branches":[{"when":"Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit.","child":{"id":"4.2.1","answer":"AWS Budgets"}},{"when":"The company wants to pay one aggregated bill while keeping separate accounts.","child":{"id":"4.2.2","answer":"AWS Organizations consolidated billing"}}]}},{"when":"Technical resources and support options","child":{"question":"Which requirement explains the decision about technical resources and support options?","branches":[{"when":"A company with coverage wants to open a case for a production incident.","child":{"id":"4.3.1","answer":"AWS Support Center"}},{"when":"The customer needs to clarify billing, without requesting a technical diagnosis of an application.","child":{"id":"4.3.2","answer":"Use account and billing support"}}]}}]}},{"id":"master3","title":"Master tree · 17 skills","domain":3,"note":"Each condition leads to a question or an answer. Use Reading size to enlarge it.","root":{"question":"Which problem do "title":"Billing, budgets and cost management","domain":4,"note":"","root":{"question":"Which requirement explains the decision about billing, budgets and cost management?","branches":[{"when":"Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit.","child":{"id":"4.2.1","answer":"AWS Budgets"}},{"when":"The company wants to pay one aggregated bill while keeping separate accounts.","child":{"id":"4.2.2","answer":"AWS Organizations consolidated billing"}}]}},{"id":"4.3","title":"Technical resources and support options","domain":4,"note":"","root":{"question":"Which requirement explains the decision about technical resources and support options?","branches":[{"when":"A company with coverage wants to open a case for a production incident.","child":{"id":"4.3.1","answer":"AWS Support Center"}},{"when":"The customer needs to clarify billing, without requesting a technical diagnosis of an application.","child":{"id":"4.3.2","answer":"Use account and billing support"}}]}}],"architectures":[{"id":"ARCH-01","native":"ARCH-01","title":"Ticket office with seasonal demand","requirement":"The portal must absorb sales peaks and keep the service running if a zone fails.","steps":["Resolve the name with Route 53","Distribute HTTP requests through load balancing","Adjust the number of instances to demand","Keep targets in multiple zones and measure the recovery time"],"decision":"Scaling solves capacity; zonal redundancy solves the failure domain; DNS and load balancing route traffic.","fault":"Using a single larger instance and assuming it tolerates the loss of the zone.","verify":"Simulate a peak and a zone failure separately, and explain what each component does.","skills":["1.1.1","1.1.2","3.3.2"],"task":"1.1","domain":1},{"id":"ARCH-02","native":"ARCH-02","title":"Enterprise migration in waves","requirement":"A company moves legacy applications with different platform changes and needs to justify the cost.","steps":["Assess risks and capabilities with the CAF","Inventory dependencies and define waves","Identify a workload for rehost and a database for replatform","Compare estimates and test the pilot's recovery"],"decision":"Enterprise adoption, per-asset strategy and workload review are decisions at different scales.","fault":"Classifying an engine change and a rewrite as rehost just because a VM will still exist.","verify":"For each asset, list what changes, which areas maintain it and its cost over the horizon.","skills":["1.3.1","1.3.2","1.4.1"],"task":"1.3","domain":1},{"id":"ARCH-03","native":"ARCH-03","title":"Accounts per environment with central control","requirement":"Teams need access across multiple accounts with organizational rules and least privilege.","steps":["Group accounts and OUs in Organizations","Establish centralized human access","Apply the relevant organizational SCP","Assign least privileges and test the real principal"],"decision":"Organizations limits and consolidates; IAM Identity Center assigns people's access; policies authorize the effective actions.","fault":"Assuming that allowing an action in the SCP gives the operator access.","verify":"Build one positive test and another with an action denied by the organization.","skills":["2.3.2","2.3.1","2.1.2"],"task":"2.3","domain":2},{"id":"ARCH-04","native":"ARCH-04","title":"Investigating a change to a bucket","requirement":"The error rate rose after a change that may have taken the resource out of policy.","steps":["Detect the effect in CloudWatch","Correlate time and author in CloudTrail","Examine configuration and compliance in AWS Config","Use the AWS report in Artifact when the audit requires evidence from the provider"],"decision":"A metric, API activity, configuration and a regulatory document answer different questions.","fault":"Using only an error chart to attribute the action to a principal.","verify":"List four pieces of evidence and the field that identifies cause or impact in each.","skills":["2.2.2","2.2.1"],"task":"2.2","domain":2},{"id":"ARCH-05","native":"ARCH-05","title":"Protecting a public application and sensitive data","requirement":"A public application needs to filter web requests, have DDoS protection and find PII in buckets.","steps":["Apply WAF rules in a compatible integration","Associate the DDoS protection offering with the resource","Classify S3 objects with Macie","Consolidate findings in posture tools when applicable"],"decision":"Package vulnerabilities, threat detection, HTTP protection and data classification correspond to different services.","fault":"Treating WAF as a CVE scanner or Macie as a firewall.","verify":"Associate a volumetric attack, a malicious web request and PII with distinct mechanisms.","skills":["2.4.2","2.4.1","2.2.3"],"task":"2.4","domain":2},{"id":"ARCH-06","native":"ARCH-06","title":"Store with global content and a key-based catalog","requirement":"Global users read static assets and look up catalog items by identifier.","steps":["Manage DNS with Route 53","Deliver the assets through CloudFront with an S3 origin","Run the application on compatible compute","Read items by key in DynamoDB with the appropriate design"],"decision":"A CDN speeds up delivery at the edge. The database and the origin keep their own semantics. Use a relational service if the requirement changes to joins and relational transactions.","fault":"Assuming the edge cache replicates the database or governs access to the data.","verify":"Describe the differences in path for a static image and a key-based read.","skills":["3.5.1","3.4.1","3.6.1"],"task":"3.5","domain":3},{"id":"ARCH-07","native":"ARCH-07","title":"Orchestrating form processing","requirement":"Forms arrive irregularly and need field extraction and routing of rejections.","steps":["Store the original in S3","Absorb the work queue with SQS","Use Textract to extract the structure","Orchestrate validation, success and failure according to the rule"],"decision":"SQS holds work, Textract extracts fields and Step Functions coordinates the steps.","fault":"Replacing the queue with a text analysis service or keeping the output only in a workflow's state.","verify":"Map the path when a consumer is down and when the document fails validation.","skills":["3.8.1","3.7.2","1.2.2"],"task":"3.8","domain":3},{"id":"ARCH-08","native":"ARCH-08","title":"Querying and reporting on data lake data","requirement":"The team wants to read S3 files with SQL and present a historical report to managers.","steps":["Land objects in S3","Catalog and transform what is needed with Glue","Query the data in Athena for exploration","Present the results in BI and evaluate a warehouse for recurring use"],"decision":"Place storage, catalog, query and visualization by their function.","fault":"Using BI to replace data preparation, or spreading a relational database across every historical aggregation without comparing requirements.","verify":"Explain which stage changes if the SLA moves from occasional exploration to high concurrent volume.","skills":["3.7.1","3.6.1","3.4.1"],"task":"3.7","domain":3},{"id":"ARCH-09","native":"ARCH-09","title":"Hybrid extension of an on-premises database","requirement":"The API starts running on AWS while the on-premises database remains the migration source.","steps":["Establish compatible connectivity with a VPN or a dedicated connection","Run the application in the VPC","Convert the schema if the engine changes","Migrate the data with DMS and track changes before cutover"],"decision":"Private connectivity, classifying the hybrid deployment and data migration are related choices.","fault":"Assuming that moving rows automatically converts SQL procedures.","verify":"List the source, destination, network and schema compatibility boundaries.","skills":["3.5.2","3.1.2","3.4.2"],"task":"3.5","domain":3},{"id":"ARCH-10","native":"ARCH-10","title":"FinOps for three accounts","requirement":"Finance needs a consolidated bill, a split by product and a notification of anomalous spend.","steps":["Organize accounts with centralized payment","Activate the applicable cost classification","Analyze spend by account, service and product","Track the budget and the anomaly monitor"],"decision":"Use Organizations for billing, tags and categories for attribution, Cost Explorer for analysis and specific alerts for limits or anomalies.","fault":"Assuming that configuring Budgets stops all spending, or that a future calculation describes a past bill.","verify":"Reconcile cost by account and product, listing what was left unclassified.","skills":["4.2.2","4.2.1","4.1.2"],"task":"4.2","domain":4},{"id":"ARCH-11","native":"ARCH-11","title":"Purchasing capacity and operational support","requirement":"The system has a predictable load, an uncertain prototype and an interruptible batch. An incident needs the right channel.","steps":["Measure the predictable baseline","Evaluate a commitment for eligible usage","Separate temporary compute and the interruption-tolerant batch","Check the status and open a case under the plan when needed"],"decision":"On-Demand for flexibility, Spot for a resumable batch and a commitment for the predictable part.","fault":"Treating a pricing commitment as an automatic capacity reservation, or confusing the initial response with resolution.","verify":"Compare the three workloads by risk, commitment and the expected level of support.","skills":["4.1.1","4.3.1"],"task":"4.1","domain":4}],"labs":[],"papers":[{"id":"t1.1","title":"Value of the AWS Cloud","domain":1,"task":"1.1"},{"id":"t1.2","title":"Design principles and Well-Architected","domain":1,"task":"1.2"},{"id":"t1.3","title":"Adoption and migration","domain":1,"task":"1.3"},{"id":"t1.4","title":"Cloud economics","domain":1,"task":"1.4"},{"id":"t2.1","title":"Shared responsibility","domain":2,"task":"2.1"},{"id":"t2.2","title":"Security, governance and compliance","domain":2,"task":"2.2"},{"id":"t2.3","title":"Identity and access control","domain":2,"task":"2.3"},{"id":"t2.4","title":"Security services and features","domain":2,"task":"2.4"},{"id":"t3.1","title":"Deployment and operation methods","domain":3,"task":"3.1"},{"id":"t3.2","title":"Global infrastructure","domain":3,"task":"3.2"},{"id":"t3.3","title":"Compute","domain":3,"task":"3.3"},{"id":"t3.4","title":"Databases","domain":3,"task":"3.4"},{"id":"t3.5","title":"Networking","domain":3,"task":"3.5"},{"id":"t3.6","title":"Storage","domain":3,"task":"3.6"},{"id":"t3.7","title":"AI, ML and analytics","domain":3,"task":"3.7"},{"id":"t3.8","title":"Other services in scope","domain":3,"task":"3.8"},{"id":"t4.1","title":"Pricing models","domain":4,"task":"4.1"},{"id":"t4.2","title":"Billing, budgets and cost management","domain":4,"task":"4.2"},{"id":"t4.3","title":"Technical resources and support options","domain":4,"task":"4.3"}],"notes":{"1":[{"id":"1.2.1","skill":"1.2.1","title":"Concepts guide: value, failures, and adoption","mechanism":["Identify the outcome the organization needs to prove. Agility reduces the time to provision and test, elasticity follows variation, reliability limits disruptions and recovery restores service and data. The AWS CAF organizes the journey, while Well-Architected analyzes workloads against its pillars."],"paths":[["Recurring peaks and troughs","Scale with demand and monitor capacity and idle time."],["A zone may fail","Distribute within the Region and exercise the failure."],["Regional failure or long retention","Separate RTO, RPO and the copy and failback strategy."],["The company changes skills, processes and structure","Assess the CAF perspectives before organizing waves."]],"trace":["Write three incident hypotheses: instance, zone and Region. Compare reach, copies and time to return. Add the effect on operating cost and which processes need to change."],"lab":["On paper, model a seasonal site with a maximum loss of 30 minutes and a return within two hours. Associate each metric with a decision and explain what changes under a regional outage."],"parameters":[["RTO","Maximum time to restore the service.","Compare with the duration measured during the exercise."],["RPO","Acceptable data loss, in time.","Compare the time of the failure with the restored version."],["Utilization per window","Indicates capacity or idle time.","Peak and average answer different questions."]],"trade-off":["Idle capacity, redundancy and regional duplication have different costs and must be evaluated against the explicit requirement."]}],"2":[{"id":"2.2.2","skill":"2.2.2","title":"Security guide: identity, evidence, and protection","mechanism":["Identity answers who can act, networking defines paths, encryption protects data, monitoring reveals events and compliance requires controls and evidence. The division of responsibility changes by service. Do not always attribute the customer's configuration to AWS."],"paths":[["Who changed a policy?","Use CloudTrail, with appropriate event coverage."],["Does a resource violate the required configuration?","Use AWS Config and appropriate rules."],["Do you need to detect a type of threat or vulnerability?","Distinguish GuardDuty, Inspector and the consolidation of findings."],["Does a human user access many accounts?","Identity Center for human access and Organizations for guardrails."]],"trace":["For an application that loses access to encrypted objects, locate the principal, the object and key authorization and the record of the attempt. Explain the layer and the responsibility of each item."],"lab":["Model a least-privilege authorization for an application that reads only one bucket. Say how the team would know who changed the access and where it would get the AWS compliance report."],"parameters":[["IAM policy","Expresses the identity's permissions.","An SCP limits the universe of permissions; it does not grant them."],["Credential type","Defines duration and maintenance.","Prefer temporary sessions for workloads and federated access where applicable."],["Evidence origin","Separates the provider's audit from actions in your own account.","Artifact provides the provider's reports; CloudTrail records the covered APIs."]],"trade-off":["More centralization makes consistency easier, but account, OU, policy, role and resource remain distinct boundaries."]}],"3":[{"id":"3.3.1","skill":"3.3.1","title":"Services guide: compute, storage, networking, and analytics","mechanism":["Start with the type of execution and the data contract. A long-running application with a controlled host, an event-driven function and a managed container have different models. Then choose the data interface — block, file, object, database or cache — and the access path."],"paths":[["Control of the guest OS","EC2, with responsibility for the system."],["Short function triggered by an event","Lambda for managed execution within its limits."],["Containers without node management","Orchestration compatible with Fargate."],["Files shared over NFS or object reads","EFS for NFS files, S3 for bucket and key."],["Warehouse, ad hoc query or visualization","Redshift, Athena or the BI layer, depending on the step."]],"trace":["Follow an order: DNS, web content distribution, compute, queue, database and storage. At each step, say which condition would rule out the neighboring alternative and why."],"lab":["Choose the services for two simple designs: a site with static content and a catalog with key-based lookups. Redo the choice when the requirement changes to relational transactions and historical reports."],"parameters":[["Consumer protocol","Determines network and interface.","Route 53 resolves names, CloudFront delivers at the edge, VPC isolates networks."],["Operational responsibility","Defines what the team maintains.","Separate host control, orchestration and business logic."],["Failure domain","Defines the impact to tolerate.","Choose AZ or Region by the explicit risk."]],"trade-off":["Managed services reduce infrastructure tasks, while compatibility, cost and control depend on the case."]}],"4":[{"id":"4.2.1","skill":"4.2.1","title":"Cost guide: estimate, observe, alert, and amortize","mechanism":["Use a different tool for a future estimate, actual analysis, a planned budget, anomaly detection and detailed export. On pricing, right-size before taking on commitments. Compare Spot and On-Demand by risk, and Savings Plans by predictability."],"paths":[["Estimate before the deploy","AWS Pricing Calculator with explicit assumptions."],["History by account, tag or service","AWS Cost Explorer."],["Warn that the agreed limit will be exceeded","AWS Budgets."],["Detect an unexpected variation","Cost Anomaly Detection."],["Your own granular analysis","AWS Data Exports with tag handling and granularity."]],"trace":["Investigate a cost deviation using account, Region, service and tag. Compare the baseline, the marginal cost and whether the event was isolated or a sign of steady demand."],"lab":["In a fictitious three-account scenario, associate central billing, a per-team report, a threshold alert and an anomaly investigation. Choose the pricing option for an interruptible batch and for a continuous workload."],"parameters":[["Eligible commitment","Defines the discount according to the product.","Savings Plans do not reserve capacity on their own."],["Traffic","Affects costs depending on direction, service and location.","Confirm the current rules and compare with the estimate."],["Support plan","Defines eligibility, channels and service.","Check the current plans, including naming transitions."]],"trade-off":["Term discounts help eligible, predictable consumption, while flexibility protects against changes in demand."]}]},"sources":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Official certification and preparation","https://aws.amazon.com/pt/certification/certified-cloud-practitioner/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitecte columns:repeat(4,minmax(0,1fr));gap:4px}\n  .card{padding:4px;font-size:7.5pt}\n  .card li{margin-bottom:2px}\n  .tables{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}\n  .decision table,.compare table{font-size:7.5pt}\n  .decision th,.compare th{padding:3px 5px}\n  .decision td,.compare td{padding:3px 5px}\n  .sources{display:none}\n  .sheet{print-color-adjust:exact;-webkit-print-color-adjust:exact}\n}\n\u003c/style>\n\u003cstyle>@media screen{html.reading-mode body>header:first-of-type{display:none}} @media(max-width:550px){.tablewrap,.section{max-width:100%;overflow:auto}.map-head{flex-wrap:wrap}} \u003c/style>\u003c/head>\n\u003cbody>\n\u003cheader>\n\u003cdiv class=\"brand\" id=\"brand\">\n  \u003cdiv class=\"eyebrow\">AWS CERTIFIED CLOUD PRACTITIONER\u003c/div>\n  \u003ch1>CLF-C02 · COMPLETE CHEATSHEETS\u003c/h1>\n  \u003cp>Technical summary by domain · decisions · comparisons · formats · metrics · parameters · scenarios and traps\u003c/p>\n  \u003cspan class=\"pill\">CLF-C02 · v1.1\u003c/span>\n\u003c/div>\n\u003cdiv class=\"toolbar\">\n  \u003cinput id=\"search\" type=\"search\" placeholder=\"Search for a service, parameter, concept or trap across all cheatsheets…\" aria-label=\"Search the cheatsheets\">\n  \u003cbutton class=\"primary\" id=\"print\">Print current\u003c/button>\n  \u003cbutton id=\"printAll\">Print all\u003c/button>\n  \u003cbutton id=\"theme\">☾ Dark theme\u003c/button>\n  \u003cbutton id=\"clear\">Clear search\u003c/button>\n  \u003cspan class=\"keyhint\">Navigate: ← / →\u003c/span>\n  \u003cspan id=\"count\" style=\"font-size:11px;color:var(--mu);font-weight:700\">\u003c/span>\n\u003c/div>\n\u003cdiv class=\"domainbar\" id=\"domains\">\u003c/div>\n\u003cnav class=\"sheetnav\" id=\"sheets\">\u003c/nav>\n\u003c/header>\n\u003cmain id=\"app\">\u003cdiv class=\"empty\">Loading cheatsheets…\u003c/div>\u003c/main>\n\u003cdiv class=\"foot\">\n  \u003cspan>Independent review material. Check the official documentation for limits, Regions, pricing and service changes.\u003c/span>\n  \u003cspan>CLF-C02 · 19 cheatsheets · Self-contained HTML\u003c/span>\n\u003c/div>\n\u003cscript>\nconst DATA={\"sheets\":[{\"id\":\"t1.1\",\"d\":1,\"k\":\"Value of the AWS Cloud\",\"title\":\"Value of the AWS Cloud\",\"sub\":\"Objectives 1.1.1, 1.1.2\",\"desc\":\"Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity.\",\"quick\":[[\"A ticket office needs to add capacity when sales open and release it when volume drops. Which benefit is in use?\",\"Elasticity\"],[\"The business accepts losing at most 15 minutes of data. Which objective was described?\",\"RPO\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Elasticity\",\"Capacity grows and shrinks according to demand.\",\"A ticket office needs to add capacity when sales open and release it when volume drops. Which benefit is in use?\"],[\"Vertical scaling\",\"The size of a compute unit grows to support additional load.\",\"A legacy application runs in a single process. The team replaces the machine with one that has more memory, keeping a single unit. Which strategy was used?\"],[\"Agility\",\"Provisioning or experimentation time is shortened.\",\"A team can create and remove a prototyping environment in minutes. Which benefit shortened the test cycle?\"],[\"High availability\",\"Redundancy reduces disruption when a component fails.\",\"A service keeps responding after losing an instance because another one takes over the load. Which property is demonstrated?\"],[\"RPO\",\"Expresses how many minutes or hours of data can be lost.\",\"The business accepts losing at most 15 minutes of data. Which objective was described?\"],[\"RTO\",\"Expresses how long the service can stay unavailable before it recovers.\",\"The contract states that the application must be back within two hours. What is this limit called?\"],[\"Multi-AZ high availability\",\"Distributes components across zones to tolerate a zone failure.\",\"A store requires the service to keep running when an entire data center within the Region fails. Which design meets the scope?\"],[\"Recovery in another Region\",\"Creates a recovery path beyond the reach of a regional failure.\",\"The policy includes an outage of the entire primary Region. Where must the alternative recovery path exist?\"]]}],\"cards\":[{\"h\":\"1.1.1 · Elasticity, scalability and agility\",\"items\":[\"Elasticity is adjusting resources as demand grows and recedes. Scalability is the ability to sustain more load, by enlarging an instance (vertical) or adding units (horizontal). Agility is reducing the time between an idea and provisioning. Each property solves a different problem: variation, capacity or speed of delivery.\",\"Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity.\"],\"tone\":\"blue\"},{\"h\":\"1.1.2 · Availability, recovery and global reach\",\"items\":[\"High availability reduces outages caused by common failures. Disaster recovery restores service and data after a larger event. RTO measures the time tolerated for recovery. RPO measures the tolerated data loss, in time. Regions, zones and points of presence have different scopes.\",\"Map the effect the organization wants to limit. Frequent copies affect RPO, but the restore still has to meet the RTO. Regional copies must have access, keys and retention compatible with the planned recovery.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Use a one-week curve and mark the peak, the trough and the capacity. Explain what changes if the behavior becomes predictable and constant.\",\"Simulate the loss of a zone, then a regional outage. Compare impact, recoverable point and time to return.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"A larger instance can scale vertically and still stay fixed overnight.\",\"A backup that was never restored does not prove a recovery time.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t1.2\",\"d\":1,\"k\":\"Design principles and Well-Architected\",\"title\":\"Design principles and Well-Architected\",\"sub\":\"Objectives 1.2.1, 1.2.2, 1.2.3\",\"desc\":\"Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric.\",\"quick\":[[\"The team automates small deliveries, updates procedures after incidents and measures operational quality. Which pillar dominates?\",\"Operational excellence\"],[\"An order system produces messages faster than the workers can process them. Which service holds the pending work?\",\"Amazon SQS\"],[\"A review prioritizes preventing credential exposure and detecting misuse. Which pillar?\",\"Security\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Operational excellence\",\"Prioritizes safe changes, processes, learning and continuous operational improvement.\",\"The team automates small deliveries, updates procedures after incidents and measures operational quality. Which pillar dominates?\"],[\"Reliability\",\"Focuses on recovery, change management and fault tolerance.\",\"A company exercises service restoration and verifies automatic recovery. Which pillar dominates?\"],[\"Performance efficiency\",\"Uses appropriate compute resources and measures their performance as demand changes.\",\"The team tests instance families to reach the required latency with appropriate utilization. Which pillar guides the decision?\"],[\"Sustainability\",\"Focuses on reducing the workload's environmental impact per unit of work.\",\"An initiative measures environmental impact per transaction and reduces idle compute. Which pillar is the explicit motivation?\"],[\"Amazon SQS\",\"Keeps messages in a queue until they are processed, according to queue and consumer policies.\",\"An order system produces messages faster than the workers can process them. Which service holds the pending work?\"],[\"Amazon SNS\",\"Publishes a notification to multiple subscribers of a topic.\",\"The same confirmation must reach independent subscribers of a notification channel. Which service does the fan-out?\"],[\"Elastic Load Balancing\",\"Distributes connections or requests to healthy targets.\",\"A website wants to distribute HTTP requests across healthy targets that are already provisioned. Which function should it use?\"],[\"EC2 Auto Scaling\",\"Adjusts the number of instances in a group according to its configuration.\",\"An EC2 group's capacity must track a utilization target. Which mechanism changes the number of instances?\"],[\"Security\",\"Protects identities, data and resources and establishes detection and response.\",\"A review prioritizes preventing credential exposure and detecting misuse. Which pillar?\"],[\"Cost optimization\",\"Reduces waste and improves the cost per objective delivered.\",\"The explicit goal is to know the spend per order and remove waste without affecting the SLA. Which pillar?\"],[\"Operational excellence\",\"Automates and improves operational processes and changes.\",\"A team introduces runbooks and automated checks for repetitive changes. Which pillar leads?\"],[\"Performance efficiency\",\"Selects resources suited to the load and demonstrates performance.\",\"The team compares query latency across different instance types and measures saturation. Which pillar guides the experiment?\"]]}],\"cards\":[{\"h\":\"1.2.1 · The six Well-Architected pillars\",\"items\":[\"Well-Architected brings together operational excellence, security, reliability, performance efficiency, cost optimization and sustainability. Decisions can contribute to several pillars. On the exam, select the pillar tied to the dominant objective: recovery, operating cadence, right-sized resources, spend or environmental impact.\",\"Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric.\"],\"tone\":\"blue\"},{\"h\":\"1.2.2 · Decoupling and resilience in the application\",\"items\":[\"Decoupling components lets them have independent rhythms and lifecycles. A queue absorbs peaks and enables later consumption; publishing to a topic distributes notifications to subscribers. A load balancer routes traffic across targets, and capacity adjustment policies react to measured utilization.\",\"Choose the mechanism by the contract: delivery to one worker, distribution to several recipients, distribution of synchronous requests or capacity adjustment. Queues and topics are often combined when several consumers need retention and independent pacing.\"],\"tone\":\"blue\"},{\"h\":\"1.2.3 · Security, cost and integration choices in the design\",\"items\":[\"The pillars interact. Isolation and traceability favor security. Forecasting and analyzing spend per business unit guides cost optimization. Reducing repetitive human work and testing changes in small batches improves operational excellence. The explicit requirement defines which evaluation comes first.\",\"Record impact, cost, risk and effort. For cost, look for the lowest spend that still meets the objective. For security, identify identity, access, data, detection and response. For performance, measure the requirement's technical metric before choosing family and capacity.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Describe a risk and identify the measurable result that confirms the improvement.\",\"Note what happens if the consumer is down for a few minutes. Identify whether the producer waits, whether the message can be handled later and how many consumers receive it.\",\"Consider the same change as an intervention in two pillars. Identify the metric that supports the argument for each.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"The performance efficiency pillar does not mean always choosing the largest server.\",\"Load balancing distributes traffic across existing targets. Adjusting the number of targets is a separate function.\",\"Enabling a control without verifying its effect does not close the architectural decision.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t1.3\",\"d\":1,\"k\":\"Adoption and migration\",\"title\":\"Adoption and migration\",\"sub\":\"Objectives 1.3.1, 1.3.2\",\"desc\":\"Ask whether the application will be moved, adapted, rebuilt or replaced. Retain keeps an asset where it is; retire decommissions it; relocate transfers compatible platforms without changing their workloads individually.\",\"quick\":[[\"An application will be moved from on-premises machines to EC2 without redesign. Which strategy?\",\"Rehost\"],[\"The sponsor needs to address gaps in people, governance and operations before an enterprise migration. Which reference should be used?\",\"AWS Cloud Adoption Framework\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Rehost\",\"Migrates the application with minimal changes, such as lift and shift to EC2.\",\"An application will be moved from on-premises machines to EC2 without redesign. Which strategy?\"],[\"Replatform\",\"Changes part of the platform to gain operational benefits without a major rewrite.\",\"The database moves from a VM to RDS, keeping a compatible engine and the application's interfaces. Which strategy characterizes the change?\"],[\"Refactor\",\"Redesigns the application to take advantage of a different architecture.\",\"A monolith is redesigned into decoupled services with new code and contracts. Which strategy?\"],[\"Repurchase\",\"Buys or adopts another product to fulfill the same function.\",\"The company replaces its in-house CRM with a SaaS vendor and imports the records. Which strategy?\"],[\"AWS Cloud Adoption Framework\",\"Guides capabilities and organizational transformation for cloud adoption.\",\"The sponsor needs to address gaps in people, governance and operations before an enterprise migration. Which reference should be used?\"],[\"AWS Well-Architected Framework\",\"Guides architecture reviews and best practices for workloads.\",\"An architect wants to review a workload against the six pillars. Which reference should be used?\"],[\"AWS DMS\",\"Moves data from compatible databases and can capture changes.\",\"The initiative has already defined the strategy and needs to move relational data with change capture. Which operational service should be used?\"],[\"AWS Pricing Calculator\",\"Estimates costs for a planned configuration.\",\"The team needs to estimate in advance the cost of a proposed architecture for approval. Which tool should be used?\"]]}],\"cards\":[{\"h\":\"1.3.1 · Migration and replatforming strategies\",\"items\":[\"Migration strategies are chosen by the change accepted on the asset and by the destination. Rehost moves the application with little change. Replatform introduces specific optimizations without rewriting the whole solution. Refactor changes architecture and code. Repurchase replaces the product with another, for example SaaS.\",\"Ask whether the application will be moved, adapted, rebuilt or replaced. Retain keeps an asset where it is; retire decommissions it; relocate transfers compatible platforms without changing their workloads individually.\"],\"tone\":\"blue\"},{\"h\":\"1.3.2 · AWS CAF, assessment and adoption waves\",\"items\":[\"The AWS Cloud Adoption Framework organizes capabilities into six perspectives: business, people, governance, platform, security and operations. Adoption involves sponsorship, skills and risks beyond moving servers. Inventory, dependencies and waves help choose the pace and sequence of the migration.\",\"Separate organizational transformation from choosing a tool to move data. Assess the value proposition, readiness, compliance and skills. Use a pilot wave with outcome metrics and feedback for the next wave.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Identify what changes in the code, the database engine, the infrastructure and the operating model.\",\"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Replacing installed software with a SaaS subscription is repurchase, even if the data is migrated.\",\"CAF guides organizational adoption. Well-Architected focuses on reviewing workloads.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t1.4\",\"d\":1,\"k\":\"Cloud economics\",\"title\":\"Cloud economics\",\"sub\":\"Objectives 1.4.1, 1.4.2\",\"desc\":\"Compare the cost of hardware, space, power, licenses, network, operations, downtime and growth. The cloud can reduce overprovisioning, but costs such as data transfer, redundancy and commitments remain in the calculation.\",\"quick\":[[\"A startup replaces the upfront purchase of servers with payment proportional to usage. Which economic change?\",\"Trading upfront investment for variable expense\"],[\"An instance stays below 10% utilization for the whole month, even at peak. Which measure should be investigated first?\",\"Rightsizing\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Trading upfront investment for variable expense\",\"Consumption lets operating expense track usage.\",\"A startup replaces the upfront purchase of servers with payment proportional to usage. Which economic change?\"],[\"Economies of scale\",\"The provider's aggregated demand can reduce unit cost.\",\"A provider aggregates demand from thousands of customers to spread structural costs. Which concept?\"],[\"Total cost of ownership (TCO)\",\"Considers the whole life of the solution, including expenses that go beyond compute.\",\"A company compares hardware, labor, migration and network over three years. Which perspective does it use?\"],[\"Predictability through commitment\",\"A commitment can lower the price of eligible usage and creates a payment obligation according to the plan.\",\"The organization accepts paying for an ongoing commitment to lower the price of eligible consumption. Which economic mechanism?\"],[\"Rightsizing\",\"Adapts the size or type of a resource to measured usage.\",\"An instance stays below 10% utilization for the whole month, even at peak. Which measure should be investigated first?\"],[\"Scheduled shutdown\",\"Reduces the active time of environments that do not need to run outside their window.\",\"The lab environment only needs to run during business hours. Which adjustment is immediate?\"],[\"Elasticity with Auto Scaling\",\"Adapts the quantity in response to changes in demand.\",\"The application has unpredictable peaks and the goal is to adjust the number of servers in use. Which measure?\"],[\"Managed service\",\"Shifts eligible operational tasks to the provider.\",\"The team wants to reduce the effort of patching the database operating system and running routine backups. Which type of service should be considered?\"]]}],\"cards\":[{\"h\":\"1.4.1 · CapEx, OpEx, economies of scale and TCO\",\"items\":[\"CapEx involves investing in assets used over time. OpEx relates to operating expenses. On-demand consumption makes it possible to replace part of the upfront investment with variable cost. Economies of scale are the potential reduction in unit cost due to the provider's scale; TCO includes the direct and indirect costs of the lifecycle.\",\"Compare the cost of hardware, space, power, licenses, network, operations, downtime and growth. The cloud can reduce overprovisioning, but costs such as data transfer, redundancy and commitments remain in the calculation.\"],\"tone\":\"blue\"},{\"h\":\"1.4.2 · Sizing, indirect costs and on-demand environments\",\"items\":[\"Rightsizing adjusts capacity to the measured profile. Auto Scaling changes the number of resources during use. Shutting down environments that do not need to stay on reduces consumption. Managed services shift infrastructure tasks to the provider and change the team's operating cost.\",\"Separate persistent idle capacity, variation throughout the day, temporarily unused environments and operational effort. Compare after the adjustment at the same service level. Check which resources keep billing after an instance is stopped, such as volumes and eligible addresses.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Compare two options with the same volume, growth trend, time frame and SLA.\",\"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Price per hour is not the same as total cost. Commitments or upfront purchases still exist in the cloud.\",\"Stopping an instance does not automatically terminate all associated resources.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t2.1\",\"d\":2,\"k\":\"Shared responsibility\",\"title\":\"Shared responsibility\",\"sub\":\"Objectives 2.1.1, 2.1.2\",\"desc\":\"Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task.\",\"quick\":[[\"Who must fix a vulnerability in the Linux the company installed on EC2?\",\"Customer on EC2\"],[\"For the customer, physical access control to the AWS data center is what type of control?\",\"Inherited control\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Customer on EC2\",\"Manages patches for the guest OS and the installed software.\",\"Who must fix a vulnerability in the Linux the company installed on EC2?\"],[\"AWS on the infrastructure\",\"Protects facilities, hardware and virtualization components.\",\"The audit asks who limits entry to the building that houses the AWS servers. Which responsibility?\"],[\"AWS on the RDS managed layer\",\"Operates the underlying system of the managed service.\",\"An update to the operating system underlying RDS belongs to which layer?\"],[\"Customer over data and access\",\"Determines the organization's policies and permissions, including in a managed service.\",\"In an RDS database, who decides which users get access to the tables?\"],[\"Inherited control\",\"The organization relies on the control AWS applies to the physical infrastructure.\",\"For the customer, physical access control to the AWS data center is what type of control?\"],[\"Control shared by layer\",\"The same type of control exists at different levels of responsibility.\",\"Patching the hypervisor and patching the guest OS illustrate which arrangement?\"],[\"Customer-specific control\",\"The customer designs or configures it according to its own requirements.\",\"The team designs the policy that segments access to the application's data. What type of control?\"],[\"Vendor compliance evidence\",\"AWS reports document the scope of the provider's controls.\",\"An auditor wants formal evidence from an independent audit of AWS. What is being sought?\"]]}],\"cards\":[{\"h\":\"2.1.1 · Shared responsibility in EC2, RDS and managed services\",\"items\":[\"AWS protects the infrastructure of the cloud. The customer protects what it configures and operates within it. In EC2, the customer manages the guest operating system, applications and network controls. With RDS, AWS manages infrastructure components and the service's system; access, configuration and data remain the customer's responsibility.\",\"Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task.\"],\"tone\":\"blue\"},{\"h\":\"2.1.2 · Inherited, shared and customer-specific controls\",\"items\":[\"Inherited controls are covered by the provider, such as physical infrastructure. Shared controls apply at different layers; for example, AWS patches the infrastructure and the customer patches what it manages. The logical deployment and the application's permissions depend on the customer's requirements.\",\"Avoid using the word shared as an undifferentiated split. Identify the evidence associated with the layer in question. AWS reports support the vendor assessment; the workload's controls also need their own evidence.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"List the responsibilities for hardware, guest OS, database engine, credentials and data policies for each option.\",\"Split the review into provider evidence, managed controls and the customer's configuration decisions.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Managed does not mean the provider decides who can read the data.\",\"An AWS compliance certification does not automatically certify the customer's configuration.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t2.2\",\"d\":2,\"k\":\"Security, governance and compliance\",\"title\":\"Security, governance and compliance\",\"sub\":\"Objectives 2.2.1, 2.2.2, 2.2.3\",\"desc\":\"Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit.\",\"quick\":[[\"The legal team needs to access an AWS SOC audit report. Where should it look?\",\"AWS Artifact\"],[\"The team wants an alarm for an increase in HTTP errors in the service. What should it use?\",\"Amazon CloudWatch\"],[\"The organization wants to manage the keys used to encrypt S3 objects. Which service?\",\"AWS KMS\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"AWS Artifact\",\"Provides AWS compliance reports and agreements.\",\"The legal team needs to access an AWS SOC audit report. Where should it look?\"],[\"AWS Audit Manager\",\"Structures assessments and collects evidence of controls.\",\"The control owner wants to give structure to the continuous collection of evidence for its own assessment. Which service?\"],[\"AWS Config\",\"Records resource configuration and evaluates compliance with rules.\",\"The question is to identify when a resource started violating a configuration rule. Which service?\"],[\"AWS CloudTrail\",\"Records who called the APIs and when, according to the configured events.\",\"Who changed a bucket's policy at 15:00? Which source answers for the call?\"],[\"Amazon CloudWatch\",\"Metrics, application logs and alarms for the operational state.\",\"The team wants an alarm for an increase in HTTP errors in the service. What should it use?\"],[\"AWS CloudTrail\",\"API activity and a trail of identity actions for the covered events.\",\"Security needs to associate a policy change with a principal. Which source?\"],[\"AWS Config\",\"Inventory, history and evaluation of resource configuration.\",\"A standard requires detecting a volume that does not comply with a configuration. Which service?\"],[\"Amazon EventBridge\",\"Routes events to targets according to rules.\",\"An application must deliver an event that has already been produced to different targets based on its attributes. Which service?\"],[\"AWS KMS\",\"Manages and controls the use of encryption keys.\",\"The organization wants to manage the keys used to encrypt S3 objects. Which service?\"],[\"AWS Secrets Manager\",\"Stores secrets and offers integration with rotation.\",\"An application needs to retrieve a database password that is rotated periodically. What should it use?\"],[\"AWS Certificate Manager\",\"Manages TLS/SSL certificates in compatible integrations.\",\"The team wants to manage an HTTPS endpoint certificate integrated with a compatible load balancer. Which service?\"],[\"AWS IAM\",\"Determines who can perform actions on resources.\",\"The problem is determining which identity can read a secret or use a key. Which service models access?\"]]}],\"cards\":[{\"h\":\"2.2.1 · Artifact, Audit Manager and compliance evidence\",\"items\":[\"AWS Artifact provides on-demand access to compliance reports and agreements. AWS Audit Manager helps collect evidence and track assessments. AWS Config records configurations and evaluates applicable rules. CloudTrail records actions of the covered APIs.\",\"Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit.\"],\"tone\":\"blue\"},{\"h\":\"2.2.2 · CloudTrail, CloudWatch and AWS Config\",\"items\":[\"CloudWatch tracks operational metrics, logs and alarms. CloudTrail records API activity and calls. AWS Config tracks configuration state and rule-based compliance. EventBridge can route events and trigger actions, according to the configured sources and rules.\",\"Map the symptom, the causal event and the current configuration. A high error rate is a metric. Changing a permission is API activity. A volume without the required configuration is a compliance problem. Routing the notification is another step.\"],\"tone\":\"blue\"},{\"h\":\"2.2.3 · Encryption, certificates and secrets management\",\"items\":[\"AWS KMS creates and controls keys used by services and applications. Secrets Manager stores secrets and offers rotation mechanisms that can be integrated. ACM issues or imports certificates for compatible integrations. AWS Certificate Manager and KMS solve different layers: TLS identity and control of encryption keys.\",\"Map which secret exists: an application password, a key that protects data or a certificate that validates the TLS session. Compare who can use, rotate, renew and audit the material.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"For four questions from an auditor, state which product provides each piece of evidence.\",\"Associate three pieces of evidence from the same incident: alarm, author of the change and configuration snapshot.\",\"Separate access control, encryption at rest and the network session.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"A vendor artifact does not show whether your own application configured encryption correctly.\",\"The metric answers how much and when an effect occurred, without necessarily identifying the identity that caused it.\",\"Moving a password to Secrets Manager does not grant the application permission to read it.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t2.3\",\"d\":2,\"k\":\"Identity and access control\",\"title\":\"Identity and access control\",\"sub\":\"Objectives 2.3.1, 2.3.2\",\"desc\":\"Distinguish the trust policy, which controls who assumes the role, from the permission policy, which controls the actions authorized after assuming it. The principle of least privilege covers actions, resources and conditions. For a person, prefer federation and temporary sessions where applicable.\",\"quick\":[[\"An EC2 instance needs to read objects without distributing permanent keys to the application. Which choice?\",\"IAM role with temporary credentials\"],[\"Employees need a central portal to access several accounts with different profiles. Which service?\",\"AWS IAM Identity Center\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"IAM role with temporary credentials\",\"Suited to workloads and sessions that need to assume permissions.\",\"An EC2 instance needs to read objects without distributing permanent keys to the application. Which choice?\"],[\"Root user protected by MFA\",\"Reserved for tasks that require root and protected by the additional control.\",\"Which identity must use MFA and remain reserved for tasks exclusive to the account owner?\"],[\"Permission policy\",\"Defines the actions, resources and conditions authorized for the identity.\",\"The role is already assumed, but it must be authorized to read a single resource. Which type of policy expresses the scope?\"],[\"Trust policy\",\"Defines who can assume a role.\",\"Which policy determines which principals can assume a role?\"],[\"AWS IAM Identity Center\",\"Centralizes federated human access and account assignments.\",\"Employees need a central portal to access several accounts with different profiles. Which service?\"],[\"AWS Organizations with SCPs\",\"Applies organizational limits to the accounts and OUs in scope.\",\"The central team wants to prevent an action in the accounts of an entire OU. Which mechanism?\"],[\"AWS Control Tower\",\"Orchestrates the setup and governance of a landing zone.\",\"Which service helps establish a multi-account landing zone with controls and governed account creation?\"],[\"IAM policy\",\"Expresses the identity's permissions, subject to the other limits.\",\"An SCP allows the action to be available, but the operator did not receive it in their role. What grants the action?\"]]}],\"cards\":[{\"h\":\"2.3.1 · Workload identity, privileges and root\",\"items\":[\"IAM controls identity and authorization. An assumed role uses temporary credentials. Workloads such as EC2 and Lambda should receive an appropriate role. The root account has broad privileges and should be protected with MFA and reserved for specific tasks. Long-term credentials inherent to IAM users require justification and management.\",\"Distinguish the trust policy, which controls who assumes the role, from the permission policy, which controls the actions authorized after assuming it. The principle of least privilege covers actions, resources and conditions. For a person, prefer federation and temporary sessions where applicable.\"],\"tone\":\"blue\"},{\"h\":\"2.3.2 · Human access and multi-account management\",\"items\":[\"AWS IAM Identity Center centralizes people's access to accounts and applications. AWS Organizations groups accounts and applies limits, such as SCPs, based on the organizational structure. An SCP limits the possible permissions in the applicable accounts and does not grant access. AWS Control Tower helps establish and govern a multi-account landing zone.\",\"Compare directory, limits, effective permissions and account provisioning. Permission sets map access in Identity Center. SCPs are organizational controls. A governed account still needs the appropriate permissions on the resource.\"],\"tone\":\"blue\"}],\"bottom\":[{\"h\":\"Validation\",\"items\":[\"Identify who runs it, which action it needs, which resource it may access and how it obtains credentials.\",\"Draw a person's session in two accounts and a guardrail that applies to the whole OU.\"],\"tone\":\"green\"},{\"h\":\"Traps\",\"items\":[\"Putting long-term access keys in code or in an AMI creates exposure and makes rotation hard.\",\"A maximum-permission SCP never replaces the policies that actually grant access.\"],\"tone\":\"orange\"}],\"final\":\"Review: choose the approach, explain why the others fail and state how to verify the result.\"},{\"id\":\"t2.4\",\"d\":2,\"k\":\"Security services and features\",\"title\":\"Security services and features\",\"sub\":\"Objectives 2.4.1, 2.4.2, 2.4.3\",\"desc\":\"Choose by the evidence: threat behavior, CVE, consolidated view or data classification. One tool can generate findings that another consumes. Investigate the cause and address the corresponding resource instead of confusing centralization with generating the finding.\",\"quick\":[[\"The team wants to detect threat activity from sources such as compatible events and flows. Which service?\",\"Amazon GuardDuty\"],[\"The team needs to block malicious patterns in HTTP requests to the website. Which service?\",\"AWS WAF\"],[\"The control must deny a range at the subnet boundary. Which mechanism?\",\"Network ACL\"]],\"tables\":[{\"h\":\"Parameters and verification criteria\",\"cols\":[\"Feature\",\"What it controls\",\"How to interpret it\"],\"rows\":[[\"Amazon GuardDuty\",\"Detects signs of potentially malicious activity.\",\"The team wants to detect threat activity from sources such as compatible events and flows. Which service?\"],[\"Amazon Inspector\",\"Identifies vulnerabilities in compatible workloads.\",\"The team wants to identify CVEs in compatible container images. Which service?\"],[\"AWS Security Hub\",\"Centralizes findings and posture controls.\",\"Security wants to consolidate findings from protection services and monitor posture. Which service?\"],[\"Amazon Macie\",\"Discovers and classifies sensitive data in S3.\",\"Personal identification numbers need to be located in S3 objects. Which service?\"],[\"AWS WAF\",\"Filters web requests at compatible integration points.\",\"The team needs to block malicious patterns in HTTP requests to the website. Which service?\"],[\"AWS Shield\",\"Protects compatible workloads against DDoS.\",\"The dominant concern is protection against distributed denial-of-service attacks. Which offering?\"],[\"AWS Firewall Manager\",\"Applies and manages firewall policies centrally across multiple accounts.\",\"An administrator wants consistent AWS WAF policies across several accounts. Which service coordinates their application?\"],[\"Security group\",\"Controls network flows of the associated resources with stateful rules.\",\"Access to the database port must be allowed only for the group of application instances. Which mechanism?\"],[\"Security group\",\"Filters traffic of associated resources with stateful behavior.\",\"A DB must accept TCP connections only from resources in an application group. Which mechanism?\"],[\"Network ACL\",\"Filters inbound and outbound traffic at the subnet with explicit rules and stateless behavior.\",\"The control must deny a range at the subnet boundary. Which mechanism?\"],[\"AWS WAF\",\"Inspects patterns in web requests.\",\"The rule depends on an HTTP URL parameter, not on the IP or the port. Which control?\"],[\"AWS IAM\",\"Controls API actions according to identity and authorization.\",\"The requirement is to prevent an operator from changing network rules in the console. Which control should be used?\"]]}],\"cards\":[{\"h\":\"2.4.1 · Threat detection, vulnerabilities and posture\",\"items\":[\"GuardDuty identifies signs of threats from supported sources. Inspector assesses vulnerabilities and exposures for compatible workloads. Security Hub aggregates findings and helps manage posture. Macie identifies sensitive data in S3 buckets.\",\"Choose by the evidence:
