const PORTAL_MODULE_INDEX=[{"title":"Value of the AWS Cloud","text":"Objectives 1.1.1, 1.1.2 Compare the demand curve with the capacity actually provisioned. Horizontal scaling requires distributing load. For a stateless architecture, adding and removing instances is simpler. Elasticity combines scaling mechanisms and policies to avoid idle or insufficient capacity. ['A ticket office needs to add capacity when sales open and release it when volume drops. Which benefit is in use?', 'Elasticity'] ['The business accepts losing at most 15 minutes of data. Which objective was described?', 'RPO']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.1"},{"title":"Design principles and Well-Architected","text":"Objectives 1.2.1, 1.2.2, 1.2.3 Relate each decision to the evidence that proves its effect. Recovery experiments prove reliability. Automating deliveries and improving operating procedures exercise operational excellence. Removing idle resources with the same output can benefit cost and sustainability, each with its own metric. ['The team automates small deliveries, updates procedures after incidents and measures operational quality. Which pillar dominates?', 'Operational excellence'] ['An order system produces messages faster than the workers can process them. Which service holds the pending work?', 'Amazon SQS'] ['A review prioritizes preventing credential exposure and detecting misuse. Which pillar?', 'Security']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.2"},{"title":"Adoption and migration","text":"Objectives 1.3.1, 1.3.2 Ask whether the application will be moved, adapted, rebuilt or replaced. Retain keeps an asset where it is; retire decommissions it; relocate transfers compatible platforms without changing their workloads individually. ['An application will be moved from on-premises machines to EC2 without redesign. Which strategy?', 'Rehost'] ['The sponsor needs to address gaps in people, governance and operations before an enterprise migration. Which reference should be used?', 'AWS Cloud Adoption Framework']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.3"},{"title":"Cloud economics","text":"Objectives 1.4.1, 1.4.2 Compare the cost of hardware, space, power, licenses, network, operations, downtime and growth. The cloud can reduce overprovisioning, but costs such as data transfer, redundancy and commitments remain in the calculation. ['A startup replaces the upfront purchase of servers with payment proportional to usage. Which economic change?', 'Trading upfront investment for variable expense'] ['An instance stays below 10% utilization for the whole month, even at peak. Which measure should be investigated first?', 'Rightsizing']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t1.4"},{"title":"Shared responsibility","text":"Objectives 2.1.1, 2.1.2 Read the level of abstraction stated. The provider operates facilities, hardware and the hypervisor. In managed layers, compare what the user can configure, such as the maintenance window, access and encryption. Responsibility depends on the service and the task. ['Who must fix a vulnerability in the Linux the company installed on EC2?', 'Customer on EC2'] ['For the customer, physical access control to the AWS data center is what type of control?', 'Inherited control']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.1"},{"title":"Security, governance and compliance","text":"Objectives 2.2.1, 2.2.2, 2.2.3 Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit. ['The legal team needs to access an AWS SOC audit report. Where should it look?', 'AWS Artifact'] ['The team wants an alarm for an increase in HTTP errors in the service. What should it use?', 'Amazon CloudWatch'] ['The organization wants to manage the keys used to encrypt S3 objects. Which service?', 'AWS KMS']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.2"},{"title":"Identity and access control","text":"Objectives 2.3.1, 2.3.2 Distinguish the trust policy, which controls who assumes the role, from the permission policy, which controls the actions authorized after assuming it. The principle of least privilege covers actions, resources and conditions. For a person, prefer federation and temporary sessions where applicable. ['An EC2 instance needs to read objects without distributing permanent keys to the application. Which choice?', 'IAM role with temporary credentials'] ['Employees need a central portal to access several accounts with different profiles. Which service?', 'AWS IAM Identity Center']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.3"},{"title":"Security services and features","text":"Objectives 2.4.1, 2.4.2, 2.4.3 Choose by the evidence: threat behavior, CVE, consolidated view or data classification. One tool can generate findings that another consumes. Investigate the cause and address the corresponding resource instead of confusing centralization with generating the finding. ['The team wants to detect threat activity from sources such as compatible events and flows. Which service?', 'Amazon GuardDuty'] ['The team needs to block malicious patterns in HTTP requests to the website. Which service?', 'AWS WAF'] ['The control must deny a range at the subnet boundary. Which mechanism?', 'Network ACL']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t2.4"},{"title":"Deployment and operation methods","text":"Objectives 3.1.1, 3.1.2 Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment. ['A professional needs to explore an account's resources through a visual interface. Which method?', 'AWS Management Console'] ['The API runs on AWS and uses the factory database that remains on premises. Which model?', 'Hybrid']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.1"},{"title":"Global infrastructure","text":"Objectives 3.2.1 Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state. ['A law requires a specific country for storing primary data. Which geographic level should be selected?', 'AWS Region']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.2"},{"title":"Compute","text":"Objectives 3.3.1, 3.3.2 Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda. ['A piece of software requires choosing the OS and installing an agent directly on the guest system. Which choice?', 'Amazon EC2'] ['A group must increase and decrease the number of EC2 instances based on demand. Which component?', 'EC2 Auto Scaling']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.3"},{"title":"Databases","text":"Objectives 3.4.1, 3.4.2 Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance. ['The application queries carts mainly by customer ID, with predictable key-based access. Which service?', 'Amazon DynamoDB'] ['Tables must be copied while continuing to capture changes as the source stays active. Which service?', 'AWS Database Migration Service']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.4"},{"title":"Networking","text":"Objectives 3.5.1, 3.5.2 Separate address space, name resolution, HTTP delivery and transport path. The requirement for a fixed IP or for caching distinguishes strategies that look similar. ['The team needs to create public and private subnets in an isolated network. Which service?', 'Amazon VPC'] ['A branch office needs encrypted communication through an IPsec tunnel between networks. Which option?', 'AWS Site-to-Site VPN']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.5"},{"title":"Storage","text":"Objectives 3.6.1, 3.6.2 Decide first by the required interface: object, block, shared Linux file or a specific file system. Only then evaluate capacity, latency, throughput and cost. ['The system writes images as objects and accesses them by key in a bucket. Which service?', 'Amazon S3'] ['The access pattern is unpredictable and the company wants automatic adjustment based on observed activity. Which class?', 'S3 Intelligent-Tiering']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.6"},{"title":"AI, ML and analytics","text":"Objectives 3.7.1, 3.7.2 Identify whether the step queries the lake, transforms and catalogs, serves queries in a warehouse or presents the information. Consider recurrence, sources, cost per query and access patterns. ['Analysts want to query Parquet files in S3 with SQL, without provisioning a warehouse. Which tool?', 'Amazon Athena'] ['The company wants to extract field values from scanned forms. Which service?', 'Amazon Textract']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.7"},{"title":"Other services in scope","text":"Objectives 3.8.1, 3.8.2, 3.8.3, 3.8.4 If the problem is orchestration, check sequence, state, errors and retries. If it is integration, check whether it needs buffering, fan-out or content-based selection. ['A process needs steps run in order, with different paths after a validation. Which service?', 'AWS Step Functions'] ['The operator needs to run a task on a configured, managed fleet. Which service?', 'AWS Systems Manager'] ['A commit needs to trigger a build and tests in a managed environment. Which service runs this step?', 'AWS CodeBuild'] ['Sensors need to authenticate and publish IoT messages. Which offering?', 'AWS IoT Core']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t3.8"},{"title":"Pricing models","text":"Objectives 4.1.1, 4.1.2 Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment. ['A distributed job resumes processing and accepts interruptions to save money. Which option?', 'Spot Instances'] ['Before the first deploy, the team wants to estimate the bill for a volume scenario. Which tool?', 'AWS Pricing Calculator']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.1"},{"title":"Billing, budgets and cost management","text":"Objectives 4.2.1, 4.2.2 Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts. ['Finance wants to be alerted if the forecast cost exceeds the agreed monthly limit. Which service?', 'AWS Budgets'] ['The company wants to pay one aggregated bill while keeping separate accounts. Which feature?', 'AWS Organizations consolidated billing']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.2"},{"title":"Technical resources and support options","text":"Objectives 4.3.1, 4.3.2 Distinguish an incident that requires contracted support, a service event that already has a status, a best-practice check and editing a runbook with public information. Check the current plans table for names and first-response SLAs. ['A company with coverage wants to open a case for a production incident. Where?', 'AWS Support Center'] ['The customer needs to clarify billing, without requesting a technical diagnosis of an application. Which channel, by purpose?', 'Use account and billing support']","type":"Cheatsheet","view":"cheatsheets","sub":"item","id":"t4.3"},{"title":"Overview · Cloud concepts","text":"Co function writeRoute(route){

function routeKey(view,type,id){return view+(type?'/'+enc(type):'')+(id?'/'+enc(id):'');}
function parseHash(){
 const parts=location.hash.slice(1).split('/').map(x=>{try{return decodeURIComponent(x);}catch{return '';}});
 const [a,b,c]=parts;
 if(a==='estudo')return ['core',null,parts.slice(1).join('/')];
 if(a==='domain'&&/^\d+$/.test(b))return ['d'+b,parts[2],parts[3]];
 if(a==='pratica'||a==='simulado'||a==='resultado'||a==='progresso')return ['core',null,parts.join('/')];
 if(a==='teoria'||a==='objetivo'){
  const s=[...m.skills,...m.cards].find(x=>x.id===b||x.legacy===parts.join('/'));
  if(s)return ['d'+s.domain,'skill',s.id];
  const d=Number(b?.[0])||1;
  if(profileDomains.includes(d))return ['d'+d,null,null];
 }
 if(a==='arvores'){const t=m.trees.find(t=>t.id===b);if(t)return ['d'+t.domain,'tree',t.id];}
 if(a==='fichas')return ['cheatsheets',c?'item':null,c];
 if(a==='mapas')return ['mindmaps',c?'item':null,c];
 if(a==='casos')return ['architectures',c?'case':null,c?'ARCH-'+c.padStart(2,'0'):null];
 if(a==='laboratorios')return ['architectures','lab',b];
 return [a||'cheatsheets',b,c];
}

function reading(value){

function syncFrame(key){
 const frame=$('frame-'+key);
 if(!frame?.dataset.loaded)return;
 const doc=frame.contentDocument;
 if(!doc?.documentElement)return;
 doc.documentElement.classList.toggle('reading-mode',compact);
 doc.documentElement.dataset.theme=theme;
 if(key!=='core')frame.contentWindow.postMessage({type:'SET_THEME',theme},'*');
 if(key==='core')doc.documentElement.dataset.theme=theme;
 const b=doc.getElementById('themeBtn');
 if(b&&key.startsWith('d'))b.textContent=theme==='dark'?"☀ Light theme":"☾ Dark theme";
}
function setTheme(value){

 for(const view of frames)syncFrame(view);
}

function syncNav(view,corePath=''){
 const theory=domainFrames.includes(view);
 const active=view==='core'?(corePath.startsWith('progresso')?'roadmap':'practice'):view;
 for(const b of $('portalNav').querySelectorAll('.nav-tab')){
  const match=(b.id==='tab-theory'&&theory)||b.dataset.target===active;
  b.classList.toggle('active',match);b.setAttribute('aria-current',match?'page':'false');
 }
 const d=theory?Number(view.slice(1)):0;
 $('theoryBadge').textContent=d?domainWord+' '+d:m.domains.length+(m.key==='pro'?" Sections":" Domains");
 $('activeModuleLabel').textContent=d?"Theory · "+domainWord+' '+d+': '+m.domains[d-1].name:labels[active];
 dropdown(false);
}
function runFrame(view,send){
 const frame=$('frame-'+view);
 const ready=()=>{syncFrame(view);send?.(frame);};
 if(frame.dataset.loaded==='yes'){ready();return;}
 if(frame.dataset.loaded==='pending'){frame.addEventListener('load',ready,{once:true});return;}
 frame.dataset.loaded='pending';
 frame.addEventListener('load',()=>{
  frame.dataset.loaded='yes';ready();
 },{once:true});
 frame.srcdoc=domainFrames.includes(view)?THEORY_HTML:MODULES[view];
}
function changeView(view,type,id,push=true){
 if(view==='core'){openCore(id||'pratica',push);return;}
 if(!Object.hasOwn(labels,view)&&!domainFrames.includes(view))view='cheatsheets';
 current=view;
 syncNav(view);
 for(const f of frames)$('frame-'+f).classList.toggle('active',f===view);
 for(const t of ['practice','architectures','roadmap'])$('view-'+t).classList.toggle('active',t===view);
 if(push)writeRoute(routeKey(view,type,id));
 if(domainFrames.includes(view)){
  runFrame(view,f=>{if(current===view)f.contentWindow.portalSectionRoute?.(type,id);});
 }else if(modKeys.includes(view)){
  runFrame(view,f=>{
   if(current!==view||!id)return;
   const type={cheatsheets:'NAV_CHEATSHEET',mindmaps:'NAV_MINDMAP',flowcharts:'NAV_FLOWCHART'}[view];
   f.contentWindow.postMessage({type,id},'*');
  });
 }else if(view==='practice'){
  drawPractice();
 }else if(view==='architectures'){
  archPane=type==='lab'?'labs':type==='case'?'cases':type||'cases';
  archTarget=id||'';
  drawArchitectures();
 }else if(view==='roadmap'){
  drawRoadmap();
 }
 $('portalViewport').scrollTop=0;
}

function openCore(path,push=true){

 syncNav(current,legacyPath);
 for(const view of frames)$('frame-'+view).classList.toggle('active',view==='core');
 for(const t of ['practice','architectures','roadmap'])$('view-'+t).classList.remove('active');
 if(push)writeRoute('estudo/'+legacyPath.split('/').map(enc).join('/'));
 runFrame('core',f=>{
  if(current!=='core')return;
  const han=f.contentWindow;
  if(han.location.hash.slice(1)!==legacyPath)han.location.hash=legacyPath;
  syncFrame('core');
 });
}

function dashboard(){

  const review=answered.filter(([id])=>snapshot.records[id].last===false).length;
  const studied=m.skills.filter(a=>a.domain===d.id&&snapshot.marked[a.id]).length;
  return {d,items:items.length,answers:answered.length,right,review,studied};

 stat("Mock exams and readiness",done+'/7',"Reassess your preparation.",btn("Open mock exams",'jump','practice','pbtn sm'))+'</div>'+
 "\u003csection class=\"pcard\" style=\"margin-top:14px\">\u003cdiv class=\"arch-meta\">\u003ch3>🏆 Readiness checklist\u003c/h3>\u003cspan class=\"pbadge\">"+done+'/7 criteria</span></div>'+
 table(["Criterion","Evidence",'Status'],gates.map(([label,evidence,ok])=>[esc(label),esc(evidence),good[+ok]]))+'</section>'+
 "\u003csection class=\"pcard\" style=\"margin-top:14px\">\u003ch3>Performance by "+domainWord.toLowerCase()+'</h3>'+
 table(["Area and weight","Studied","Practiced","First-attempt accuracy","Pending mistakes"],r.rows.map(x=>[esc(x.d.name+' · '+x.d.weight+'%'),x.studied+'/'+x.d.skills,x.answers+'/'+x.items,x.right+'/'+x.answers,x.review]))+'</section>'+
 "\u003csection class=\"pcard\" style=\"margin-top:14px\">\u003ch3>Coverage matrix\u003c/h3>\u003cdiv class=\"filter-bar\">\u003cinput type=\"search\" id=\"coverageFilter\" class=\"pinput\" placeholder=\"Search for a skill or code\" aria-label=\"Filter the coverage matrix\">\u003c/div>\u003cdiv id=\"coverageMatrix\">\u003c/div>\u003c/section>";
 const filter=$('coverageFilter');
 const draw=()=>{
  const s=norm(filter.value);
  $('coverageMatrix').innerHTML=table([domainWord,"Skill","Studied","Scenarios practiced","Action"],m.skills.filter(x=>norm(x.code+' '+x.title).includes(s)).map(x=>[x.domain,esc(x.code+' · '+x.title),snapshot.marked[x.id]?'✓':'—',x.scenarios.filter(a=>snapshot.records[a.id]).length+'/'+x.scenarios.length,skillBtn(x.id,"Open sheet ↗")]));
 };
 filter.oninput=draw;draw();
}
const sourcesIndex=m.sources.map(([name,url])=>({title:name,type:"Documentation",view:'architectures',sub:'references',text:url}));
const index=[
 ...[...m.skills,...m.cards].map(s=>({title:(s.id.startsWith('c')?'':s.code+' · ')+s.title,type:"Theory",view:'d'+s.domain,sub:'skill',id:s.id,text:[s.concept,s.cue,s.answer,s.params.flat().join(' ')].join(' ')})),
 ...Object.values(m.notes).flat().map(n=>({title:n.title,type:"Technical Guide",view:'d'+n.id.split('.')[0],sub:'guide',id:n.id,text:JSON.stringify(n)})),
 ...PORTAL_MODULE_INDEX,
 ...m.trees.map(t=>({title:t.title,type:"Decision tree",view:'d'+t.domain,sub:'tree',id:t.id,text:JSON.stringify(t.root)})),
 ...m.architectures.map(a=>({title:a.title,type:"Architecture",view:'architectures',sub:'case',id:a.id,text:JSON.stringify(a)})),
 ...m.labs.map(l=>({title:l.title,type:"Lab",view:'architectures',sub:'lab',id:l.id,text:l.goal})),
 ...glossary.map(([title,pt,definition,id])=>({title,type:"Glossary",text:[pt,definition].join(' '),view:'d'+id.split('.')[0],sub:'skill',id})),
 ...sourcesIndex
].map((o,i)=>({...o,i,search:norm(o.title+' '+o.text),titleNorm:norm(o.title)}));
const kinds=$('globalSearchKindFilter');
kinds.innerHTML="\u003coption value=\"\">All types\u003c/option>"+[...new Set(index.map(i=>i.type))].map(t=>'<option>'+esc(t)+'</option>').join('');
const synonyms={
 'cdc':["change capture",'change data capture'],'kms':['criptografia','envelope encryption'],
 'rag':["retrieval-augmented",'retrieval augmented generation'],'skew':["uneven distribution","dominant partition"],
 'mascara':['mask','mascaramento'],'rollback':["rollback","restore"],'governanca':['unity catalog','lake formation'],
 'avaliacao':['evaluation','metrica']
};
function drawSearch(){
 const query=norm($('globalUnifiedInput').value).trim();
 const scope=kinds.value;
 const tokens=query.split(/\s+/).filter(Boolean);
 const candidates=index.filter(i=>(!scope||i.type===scope)&&(
  tokens.every(t=>i.search.includes(t))||
  synonyms[query]?.some(t=>i.search.includes(norm(t)))
 )).sort((a,b)=>tokens.reduce((n,t)=>n+Number(b.titleNorm.includes(t))-Number(a.titleNorm.includes(t)),0));
 $('globalSearchResults').innerHTML=(!query&&!scope?"\u003cp class=\"search-empty\">Search for a concept, code, scenario, or parameter.\u003c/p>":
 candidates.slice(0,30).map(i=>'<button type="button" class="result-link" data-searchhit="'+i.i+'"><strong>'+esc(i.title)+'</strong><span class="pbadge teal">'+esc(i.type)+'</span></button>').join('')||"\u003cp class=\"search-empty\">No results for this search.\u003c/p>");
}
function openSearch(){
 $('searchModalBackdrop').classList.add('open');
 $('globalUnifiedInput').focus();drawSearch();
}
function closeSearch(){
 $('searchModalBackdrop').classList.remove('open');
 if(!compact)$('btnOpenSearch').focus();
}
window.portalOpenSearch=openSearch;
$('globalUnifiedInput').addEventListener('input',drawSearch);
$('globalUnifiedInput').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('globalSearchResults').querySelector('[data-searchhit]')?.click();
});
kinds.addEventListener('change',drawSearch);
$('btnOpenSearch').onclick=openSearch;
$('btnCloseSearchModal').onclick=closeSearch;
$('searchModalBackdrop').addEventListener('click',e=>{if(e.target.id==='searchModalBackdrop')closeSearch();});
$('btnToggleTheme').onclick=window.portalToggleTheme;
$('menuFold').onclick=()=>reading(!compact);
$('tab-theory').onclick=()=>dropdown(!$('theoryDropdown').classList.contains('open'));
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
 else if(e.key==='Escape'){if($('searchModalBackdrop').classList.contains('open'))closeSearch();dropdown(false);}
});
function markArchitecture(id,value){
 const a=m.architectures.find(x=>x.id===id);
 if(!a)return;
 const bridgeAPI=bridge.contentWindow?.studyBridge;
 if(bridgeAPI&&a.native)bridgeAPI.markCase(a.native,value);
 else {archDone[id]=value;safeSave('architectures',archDone);}
}
function resume(){if(last?.domain&&last.id)changeView('d'+last.domain,'skill',last.id);else changeView('d1');}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!$('theoryDropdown').contains(e.target))dropdown(false);
 if(!b)return;
 const d=b.dataset;
 if(d.target){changeView(d.target);return;}
 if(b.id==='btnResumeLast'||Object.hasOwn(d,'resume')){resume();return;}
 if(d.searchhit){
  const hit=index[Number(d.searchhit)];closeSearch();
  if(hit)changeView(hit.view,hit.sub,hit.id);
 }
 if(d.jump)changeView(d.jump);
 if(d.core)openCore(d.core);
 if(d.sim){
  const path='simulado';
  const core=bridge.contentWindow?.studyBridge;
  if(core){core.start(d.sim);openCore(path);}
  else runFrame('core',()=>{bridge.contentWindow?.studyBridge?.start(d.sim);openCore(path);});
 }
 if(Object.hasOwn(d,'review')){
  openCore('pratica/banco');
  runFrame('core',f=>f.contentWindow.studyBridge?.review());
 }
 if(d.skill){
  const a=m.skills.find(s=>s.id===d.skill);
  if(a)changeView('d'+a.domain,'skill',a.id);
 }
 if(d.guide)changeView('d'+d.guide.split('.')[0],'guide',d.guide);
 if(d.archtab){
  const [view,id]=d.archtab.split('/');changeView('architectures',view,id);
 }
 if(d.markarch){
  const prev=m.architectures.find(a=>a.id===d.markarch);
  markArchitecture(d.markarch,!archRead(prev));drawCases();
 }
 if(Object.hasOwn(d,'markvisible')){
  for(const item of $('archCardsList').querySelectorAll('[data-markarch]'))markArchitecture(item.dataset.markarch,true);
  drawCases();toast("Selected architectures marked.");
 }
 if(Object.hasOwn(d,'copy')){
  const sample=b.previousElementSibling;
  if(sample?.matches('pre')){
   if(!navigator.clipboard){selectSample(sample);}
   else navigator.clipboard.writeText(sample.innerText).then(()=>toast("Snippet copied."),()=>selectSample(sample));
  }
 }
 if(Object.hasOwn(d,'backup')){
  runFrame('core',f=>f.contentWindow.studyBridge?.exportProgress(archDone));
 }
});
function selectSample(el){
 const range=document.createRange();range.selectNodeContents(el);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);toast("Snippet selected. Press Ctrl+C.");
}
window.portalRestoreArchitectures=(custom)=>{
 if(m.key!=='pro'||!custom||typeof custom!=='object')return;
 for(const a of m.architectures)if(typeof custom[a.id]==='boolean'&&!Object.hasOwn(archDone,a.id))archDone[a.id]=custom[a.id];
 safeSave('architectures',archDone);
};
const syncHash=()=>changeView(...parseHash(),false);
window.addEventListener('hashchange',syncHash);
window.addEventListener('popstate',syncHash);
window.addEventListener('message',e=>{
 if(!frames.some(key=>$('frame-'+key).contentWindow===e.source))return;
 if(e.data?.type==='THEME_CHANGED')chooseTheme(e.data.theme);
});
if(compact)reading(true);
setTheme(theme);
window.trilhaTheme?.onChange(setTheme);
progressUI();
try{localStorage.getItem((key) + ".en");}
catch{$('storageWarningBanner').style.display='block';}
syncHash();
runFrame('core',()=>updateReport());
</script></body></html>
