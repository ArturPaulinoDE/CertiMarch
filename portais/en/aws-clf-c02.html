[\"Managed does not mean the provider decides who can read the data.\",\"An AWS compliance certification does not automatically certify the customer's configuration.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t2.2\":{\"section\":2,\"key\":\"Security, governance and compliance\",\"top\":\"DOMAIN 2 · 30% OF THE EXAM\",\"heading\":\"Security, governance and compliance\",\"pills\":\"2.2\",\"desc\":\"Security guide: identity, evidence, and protection\",\"left\":[{\"title\":\"2.2.1 · Artifact, Audit Manager and compliance evidence\",\"items\":[\"AWS Artifact\",\"Distinguish a provider document, a control assessment, a configuration change and an API action. Check the coverage and origin of each piece of evidence before using it for an audit.\"],\"tone\":\"\"},{\"title\":\"2.2.2 · CloudTrail, CloudWatch and AWS Config\",\"items\":[\"Amazon CloudWatch\",\"Map the symptom, the causal event and the current configuration. A high error rate is a metric. Changing a permission is API activity. A volume without the required configuration is a compliance problem. Routing the notification is another step.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.2.3 · Encryption, certificates and secrets management\",\"items\":[\"AWS KMS\",\"Separate access control, encryption at rest and the network session.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"A vendor artifact does not show whether your own application configured encryption correctly.\",\"The metric answers how much and when an effect occurred, without necessarily identifying the identity that caused it.\",\"Moving a password to Secrets Manager does not grant the application permission to read it.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t2.3\":{\"section\":2,\"key\":\"Identity and access control\",\"top\":\"DOMAIN 2 · 30% OF THE EXAM\",\"heading\":\"Identity and access control\",\"pills\":\"2.3\",\"desc\":\"Security guide: identity, evidence, and protection\",\"left\":[{\"title\":\"2.3.1 · Workload identity, privileges and root\",\"items\":[\"IAM role with temporary credentials\",\"Distinguish the trust policy, which controls who assumes the role, from the permission policy, which controls the actions authorized after assuming it. The principle of least privilege covers actions, resources and conditions. For a person, prefer federation and temporary sessions where applicable.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.3.2 · Human access and multi-account management\",\"items\":[\"AWS IAM Identity Center\",\"Draw a person's session in two accounts and a guardrail that applies to the whole OU.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Putting long-term access keys in code or in an AMI creates exposure and makes rotation hard.\",\"A maximum-permission SCP never replaces the policies that actually grant access.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t2.4\":{\"section\":2,\"key\":\"Security services and features\",\"top\":\"DOMAIN 2 · 30% OF THE EXAM\",\"heading\":\"Security services and features\",\"pills\":\"2.4\",\"desc\":\"Security guide: identity, evidence, and protection\",\"left\":[{\"title\":\"2.4.1 · Threat detection, vulnerabilities and posture\",\"items\":[\"Amazon GuardDuty\",\"Choose by the evidence: threat behavior, CVE, consolidated view or data classification. One tool can generate findings that another consumes. Investigate the cause and address the corresponding resource instead of confusing centralization with generating the finding.\"],\"tone\":\"\"},{\"title\":\"2.4.2 · WAF, Shield, Firewall Manager and network controls\",\"items\":[\"AWS WAF\",\"Locate the layer and the scale: HTTP content, volumetric flooding, governance across accounts or interface traffic. HTTP rules can filter request patterns. Multi-account policies can coordinate the configuration of these compatible controls.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"2.4.3 · Defense in depth and subnet access\",\"items\":[\"Network ACL\",\"Given an access to a website, break down the decisions by layer and identify where to show the effect.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Macie is not a generic container image scanner or a firewall service.\",\"WAF is not the automatic answer to every question about traffic or networking.\",\"Security groups allow traffic through allow rules. Explicitly blocking a range is a feature of Network ACLs when applied to the subnet.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"d3\":{\"section\":3,\"key\":\"Overview · Cloud technology and services\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Overview · Cloud technology and services\",\"pills\":\"3.1 · 3.2 · 3.3 · 3.4 · 3.5 · 3.6 · 3.7 · 3.8\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.1.1 · Console, CLI, SDK and infrastructure as code\",\"items\":[\"AWS Management Console\",\"Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment.\"],\"tone\":\"\"},{\"title\":\"3.1.2 · Cloud, hybrid and on-premises deployment\",\"items\":[\"Hybrid\",\"Ask where compute and data run and whether there is operational integration between environments. Latency constraints, legacy dependencies or residency may require an on-premises presence even if other parts migrate.\"],\"tone\":\"\"},{\"title\":\"3.2.1 · Regions, zones, edge and geographic criteria\",\"items\":[\"AWS Region\",\"Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state.\"],\"tone\":\"\"},{\"title\":\"3.3.1 · EC2, Lambda, containers and Fargate\",\"items\":[\"Amazon EC2\",\"Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda.\"],\"tone\":\"\"},{\"title\":\"3.3.2 · Integrating capacity and traffic in the application\",\"items\":[\"EC2 Auto Scaling\",\"Distinguish growing capacity, routing application traffic, distributing transport and publishing cached content globally. Use health checks and policies calibrated to the requirement.\"],\"tone\":\"\"},{\"title\":\"3.4.1 · RDS, Aurora, DynamoDB and Redshift\",\"items\":[\"Amazon DynamoDB\",\"Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.6.1 · S3, EBS, EFS and FSx by access interface\",\"items\":[\"Amazon S3\",\"Identify the protocol and sharing pattern before choosing the storage class.\"],\"tone\":\"go\"},{\"title\":\"3.6.2 · S3 classes, archiving, backup and retention\",\"items\":[\"S3 Intelligent-Tiering\",\"Build a matrix for hot, cold, unpredictable and data archived for years.\"],\"tone\":\"go\"},{\"title\":\"3.7.1 · Analytics: Athena, Glue, Redshift and visualization\",\"items\":[\"Amazon Athena\",\"Follow a report from raw files through processing, query execution and presentation.\"],\"tone\":\"go\"},{\"title\":\"3.7.2 · Managed AI and choosing by task type\",\"items\":[\"Amazon Textract\",\"Distinguish an image of an object, a scanned form and a text that needs classification.\"],\"tone\":\"go\"},{\"title\":\"3.8.1 · Integration services: queues, topics, events and workflows\",\"items\":[\"AWS Step Functions\",\"Compare the role of the four services in the same order and shipping process.\"],\"tone\":\"go\"},{\"title\":\"3.8.2 · Operational tools and services by function\",\"items\":[\"AWS Systems Manager\",\"Decide which action follows each piece of evidence: an account event, a cost recommendation, a fleet task and backup retention.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"The CLI automates actions, but using it does not by itself describe the whole configuration as a declarative state.\",\"Using AWS in one Region does not make the architecture hybrid if no operational component remains outside it.\",\"Using CloudFront does not automatically replicate the database across Regions.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.1\":{\"section\":3,\"key\":\"Deployment and operation methods\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Deployment and operation methods\",\"pills\":\"3.1\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.1.1 · Console, CLI, SDK and infrastructure as code\",\"items\":[\"AWS Management Console\",\"Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.1.2 · Cloud, hybrid and on-premises deployment\",\"items\":[\"Hybrid\",\"Trace the path of a transaction, highlighting the environment where the application, the database and operations run.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"The CLI automates actions, but using it does not by itself describe the whole configuration as a declarative state.\",\"Using AWS in one Region does not make the architecture hybrid if no operational component remains outside it.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.2\":{\"section\":3,\"key\":\"Global infrastructure\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Global infrastructure\",\"pills\":\"3.2\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.2.1 · Regions, zones, edge and geographic criteria\",\"items\":[\"AWS Region\",\"Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"How to verify\",\"items\":[\"Explain data location, delivery edge and failure domain separately.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Using CloudFront does not automatically replicate the database across Regions.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.3\":{\"section\":3,\"key\":\"Compute\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Compute\",\"pills\":\"3.3\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.3.1 · EC2, Lambda, containers and Fargate\",\"items\":[\"Amazon EC2\",\"Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.3.2 · Integrating capacity and traffic in the application\",\"items\":[\"EC2 Auto Scaling\",\"Simulate an unhealthy target and a traffic increase; observe which components act.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Fargate is not an orchestrator that replaces ECS or EKS.\",\"Installing a load balancer does not change the number of instances without scaling integration.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.4\":{\"section\":3,\"key\":\"Databases\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Databases\",\"pills\":\"3.4\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.4.1 · RDS, Aurora, DynamoDB and Redshift\",\"items\":[\"Amazon DynamoDB\",\"Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.4.2 · Database migration, schema conversion and caching\",\"items\":[\"AWS Database Migration Service\",\"In an Oracle → PostgreSQL migration, classify the assessment, conversion, load, CDC and serving tasks.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Having SQL does not turn every relational database into a warehouse optimized for analytical aggregations.\",\"A migration with CDC does not automatically guarantee that stored procedures work on the new engine.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.5\":{\"section\":3,\"key\":\"Networking\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Networking\",\"pills\":\"3.5\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.5.1 · VPC, DNS and global content delivery\",\"items\":[\"Amazon VPC\",\"Separate address space, name resolution, HTTP delivery and transport path. The requirement for a fixed IP or for caching distinguishes strategies that look similar.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.5.2 · Hybrid connectivity and network egress\",\"items\":[\"AWS Site-to-Site VPN\",\"Describe the paths to the AWS API, to the office and for downloading patches from the internet.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Changing DNS can influence where traffic goes. It does not cache content.\",\"Direct Connect does not automatically encrypt all traffic.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.6\":{\"section\":3,\"key\":\"Storage\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Storage\",\"pills\":\"3.6\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.6.1 · S3, EBS, EFS and FSx by access interface\",\"items\":[\"Amazon S3\",\"Decide first by the required interface: object, block, shared Linux file or a specific file system. Only then evaluate capacity, latency, throughput and cost.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.6.2 · S3 classes, archiving, backup and retention\",\"items\":[\"S3 Intelligent-Tiering\",\"Build a matrix for hot, cold, unpredictable and data archived for years.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Using S3 as the destination of a data lake does not make it a block volume for installing an EC2 operating system.\",\"Storage price per GB alone does not account for access, retrieval, requests or minimum duration.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.7\":{\"section\":3,\"key\":\"AI, ML and analytics\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"AI, ML and analytics\",\"pills\":\"3.7\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.7.1 · Analytics: Athena, Glue, Redshift and visualization\",\"items\":[\"Amazon Athena\",\"Identify whether the step queries the lake, transforms and catalogs, serves queries in a warehouse or presents the information. Consider recurrence, sources, cost per query and access patterns.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.7.2 · Managed AI and choosing by task type\",\"items\":[\"Amazon Textract\",\"Distinguish an image of an object, a scanned form and a text that needs classification.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Visualization and distributed transformation address different steps of the same architecture.\",\"A vision API does not automatically replace structured form extraction.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t3.8\":{\"section\":3,\"key\":\"Other services in scope\",\"top\":\"DOMAIN 3 · 34% OF THE EXAM\",\"heading\":\"Other services in scope\",\"pills\":\"3.8\",\"desc\":\"Services guide: compute, storage, networking, and analytics\",\"left\":[{\"title\":\"3.8.1 · Integration services: queues, topics, events and workflows\",\"items\":[\"AWS Step Functions\",\"If the problem is orchestration, check sequence, state, errors and retries. If it is integration, check whether it needs buffering, fan-out or content-based selection.\"],\"tone\":\"\"},{\"title\":\"3.8.2 · Operational tools and services by function\",\"items\":[\"AWS Systems Manager\",\"Distinguish running the action, getting visibility into an event, reviewing recommendations and centralizing backups. Confirm the resource configuration, the account permissions and the eligibility for each integration.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"3.8.3 · Development tools and continuous delivery\",\"items\":[\"AWS CodeBuild\",\"Draw commit, tests, approval, infrastructure and deploy as separate actions.\"],\"tone\":\"go\"},{\"title\":\"3.8.4 · Frontend, devices, desktops and application access\",\"items\":[\"AWS IoT Core\",\"Classify four requests by source, unit delivered and final experience.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"A queue can hold pending work and still not represent the workflow logic.\",\"A Trusted Advisor recommendation does not apply the fix by itself.\",\"CodePipeline organizes stages, but a build stage needs a build executor or a compatible integration.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"d4\":{\"section\":4,\"key\":\"Overview · Billing, pricing and support\",\"top\":\"DOMAIN 4 · 12% OF THE EXAM\",\"heading\":\"Overview · Billing, pricing and support\",\"pills\":\"4.1 · 4.2 · 4.3\",\"desc\":\"Cost guide: estimate, observe, alert, and amortize\",\"left\":[{\"title\":\"4.1.1 · On-Demand, Savings Plans, reservations and Spot\",\"items\":[\"Spot Instances\",\"Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment.\"],\"tone\":\"\"},{\"title\":\"4.1.2 · Estimates, data transfer and marginal cost\",\"items\":[\"AWS Pricing Calculator\",\"Compare the estimated load, ingress/egress traffic, access across zones or Regions and indirect costs. Check the pricing rules per service and Region instead of assuming every transfer is treated the same way.\"],\"tone\":\"\"},{\"title\":\"4.2.1 · Cost Explorer, Budgets, Data Exports and anomalies\",\"items\":[\"AWS Budgets\",\"Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.2.2 · Consolidated billing, tags and cost allocation\",\"items\":[\"AWS Organizations consolidated billing\",\"Reconcile cost per account with cost per product and identify the expense with no owner.\"],\"tone\":\"go\"},{\"title\":\"4.3.1 · Technical resources, account status and support channels\",\"items\":[\"AWS Support Center\",\"Choose the first channel for four different situations and identify when to open a case.\"],\"tone\":\"go\"},{\"title\":\"4.3.2 · Support plans and technical help by need\",\"items\":[\"Use account and billing support\",\"For each scenario, identify whether there is a billing question, a critical technical case, a need for proactive support or a lookup of recommendations.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Savings Plans do not guarantee available physical capacity. Spot alone does not meet a continuous capacity requirement without an interruption strategy.\",\"An estimate of a future architecture does not replace the analysis of historical usage and cost.\",\"Setting a budget with an alert does not impose a hard, universal ceiling on the bill.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t4.1\":{\"section\":4,\"key\":\"Pricing models\",\"top\":\"DOMAIN 4 · 12% OF THE EXAM\",\"heading\":\"Pricing models\",\"pills\":\"4.1\",\"desc\":\"Cost guide: estimate, observe, alert, and amortize\",\"left\":[{\"title\":\"4.1.1 · On-Demand, Savings Plans, reservations and Spot\",\"items\":[\"Spot Instances\",\"Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.1.2 · Estimates, data transfer and marginal cost\",\"items\":[\"AWS Pricing Calculator\",\"Work out which variables change if a consumer starts reading from another Region.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Savings Plans do not guarantee available physical capacity. Spot alone does not meet a continuous capacity requirement without an interruption strategy.\",\"An estimate of a future architecture does not replace the analysis of historical usage and cost.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t4.2\":{\"section\":4,\"key\":\"Billing, budgets and cost management\",\"top\":\"DOMAIN 4 · 12% OF THE EXAM\",\"heading\":\"Billing, budgets and cost management\",\"pills\":\"4.2\",\"desc\":\"Cost guide: estimate, observe, alert, and amortize\",\"left\":[{\"title\":\"4.2.1 · Cost Explorer, Budgets, Data Exports and anomalies\",\"items\":[\"AWS Budgets\",\"Choose by the question: investigate history, watch an agreed limit, feed an analytical model or find an unexpected deviation. Consider billing processing delays when interpreting alerts.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.2.2 · Consolidated billing, tags and cost allocation\",\"items\":[\"AWS Organizations consolidated billing\",\"Reconcile cost per account with cost per product and identify the expense with no owner.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"Setting a budget with an alert does not impose a hard, universal ceiling on the bill.\",\"Consolidated billing does not merge all accounts or remove the teams' isolated access.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"},\"t4.3\":{\"section\":4,\"key\":\"Technical resources and support options\",\"top\":\"DOMAIN 4 · 12% OF THE EXAM\",\"heading\":\"Technical resources and support options\",\"pills\":\"4.3\",\"desc\":\"Cost guide: estimate, observe, alert, and amortize\",\"left\":[{\"title\":\"4.3.1 · Technical resources, account status and support channels\",\"items\":[\"AWS Support Center\",\"Distinguish an incident that requires contracted support, a service event that already has a status, a best-practice check and editing a runbook with public information. Check the current plans table for names and first-response SLAs.\"],\"tone\":\"\"}],\"right\":[{\"title\":\"4.3.2 · Support plans and technical help by need\",\"items\":[\"Use account and billing support\",\"For each scenario, identify whether there is a billing question, a critical technical case, a need for proactive support or a lookup of recommendations.\"],\"tone\":\"go\"}],\"bottom\":[{\"title\":\"Avoid\",\"items\":[\"A first-response SLA is not a promise to resolve the incident within the same time.\",\"A plan enables specific support channels and conditions; an initial-response SLA does not guarantee resolution within that time.\"],\"tone\":\"bad\"}],\"footer\":\"Use the domain library to open all skills and solved cases.\"}};\nconst SECTIONS = [{\"s\":1,\"label\":\"1 · Cloud concepts (24%)\"},{\"s\":2,\"label\":\"2 · Security and compliance (30%)\"},{\"s\":3,\"label\":\"3 · Cloud technology and services (34%)\"},{\"s\":4,\"label\":\"4 · Billing, pricing and support (12%)\"}];\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, ch => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));\nfunction decorate(s){\n  const safe=esc(s);\n  if(s.includes(' → ')){\n    const i=s.lastIndexOf(' → ');\n    return esc(s.slice(0,i))+' → \u003cb>'+esc(s.slice(i+3))+'\u003c/b>';\n  }\n  const m=s.match(/^([^:]{2,50}):\\s/);\n  if(m) return '\u003cb>'+esc(m[1])+':\u003c/b> '+esc(s.slice(m[0].length));\n  return safe;\n}\nconst C = c => `\u003csection class=\"c ${esc(c.tone||'')}\">\u003ch3>${esc(c.title)}\u003c/h3>\u003cul>${c.items.map(x=>`\u003cli>${decorate(x)}\u003c/li>`).join('')}\u003c/ul>\u003c/section>`;\nconst v=document.getElementById('v'), n=document.getElementById('n'), sb=document.getElementById('sb');\nlet currentSection=1, currentKey='';\nfunction draw(){\n const svg=v.querySelector('svg.connectors'); if(!svg)return;\n svg.innerHTML=''; if(innerWidth\u003c=820)return;\n const wrap=v.querySelector('.wrap').getBoundingClientRect(), hub=v.querySelector('.hub').getBoundingClientRect();\n svg.setAttribute('width',wrap.width);svg.setAttribute('height',wrap.height);\n let d='';\n v.querySelectorAll('.col').forEach((col,i)=>col.querySelectorAll('.c').forEach(c=>{\n  const r=c.getBoundingClientRect();\n  const x1=(i?hub.right:hub.left)-wrap.left, x2=(i?r.left:r.right)-wrap.left;\n  const y1=hub.top+hub.height/2-wrap.top, y2=r.top+r.height/2-wrap.top, mid=(x1+x2)/2;\n  d+=`\u003cpath d=\"M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}\"/>`;\n }));\n svg.innerHTML=d;\n}\nfunction show(key){\n const m=M[key]; if(!m)return; currentKey=key;\n v.innerHTML=`\u003cdiv class=\"meta\">\u003cdiv>\u003cstrong>${esc(m.key)}\u003c/strong> · ${esc(m.top)}\u003c/div>\u003cdiv class=\"right\">Map ${Object.keys(M).filter(k=>M[k].section===m.section).indexOf(key)+1} de ${Object.keys(M).filter(k=>M[k].section===m.section).length}\u003c/div>\u003c/div>\n \u003cdiv class=\"wrap\">\u003csvg class=\"connectors\" aria-hidden=\"true\">\u003c/svg>\u003cdiv class=\"main\">\n \u003cdiv class=\"col\">${m.left.map(C).join('')}\u003c/div>\n \u003csection class=\"hub\">\u003csmall>${esc(m.top)}\u003c/small>\u003ch2>${esc(m.heading)}\u003c/h2>\u003cdiv class=\"pills\">${m.pills.split(' · ').map(x=>`\u003cspan>${esc(x)}\u003c/span>`).join('')}\u003c/div>\u003cp>${esc(m.desc)}\u003c/p>\u003c/section>\n \u003cdiv class=\"col\">${m.right.map(C).join('')}\u003c/div>\n \u003c/div>\u003cdiv class=\"bot\">${m.bottom.map(C).join('')}\u003c/div>\u003c/div>\u003cdiv class=\"f\">${esc(m.footer)}\u003c/div>`;\n n.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===key?'true':'false'));\n requestAnimationFrame(draw);\n}\nfunction filterSection(s){\n currentSection=s; sb.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.s)===s?'true':'false'));\n const keys=Object.keys(M).filter(k=>M[k].section===s); n.innerHTML='';\n keys.forEach(k=>{const b=document.createElement('button');b.textContent=M[k].key;b.dataset.k=k;b.type='button';b.onclick=()=>show(k);n.appendChild(b)});\n show(keys[0]);\n}\nSECTIONS.forEach(sec=>{const b=document.createElement('button');b.type='button';b.textContent=sec.label;b.dataset.s=sec.s;b.onclick=()=>filterSection(sec.s);sb.appendChild(b)});\naddEventListener('resize',draw);addEventListener('beforeprint',draw);\ndocument.getElementById('themeBtn').addEventListener('click',()=>{const root=document.documentElement;const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;document.getElementById('themeBtn').textContent=next==='dark'?\"☀ Light theme\":\"◐ Dark theme\";requestAnimationFrame(draw)});\nfilterSection(1);\n\nwindow.addEventListener('message', e => {\n  const msg = e.data || {};\n  if (msg.type === 'NAV_MINDMAP' && msg.id) {\n    const m = M[msg.id];\n    if (m) {\n      filterSection(m.section);\n      show(msg.id);\n    }\n  } else if (msg.type === 'SET_THEME' && msg.theme) {\n    document.documentElement.dataset.theme = msg.theme;\n    document.getElementById('themeBtn').textContent = msg.theme === 'dark' ? \"☀ Light theme\" : \"◐ Dark theme\";\n    requestAnimationFrame(draw);\n  }\n});\n\u003c/script>\n\u003cfooter>\u003cdetails class=\"refs\">\u003csummary>Sources and scope reference\u003c/summary>\u003cul>\u003cli>\u003ca href=\"https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html\" target=\"_blank\" rel=\"noopener\">Official CLF-C02 guide\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://aws.amazon.com/pt/certification/certified-cloud-practitioner/\" target=\"_blank\" rel=\"noopener\">Official certification and preparation\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html\" target=\"_blank\" rel=\"noopener\">AWS Well-Architected Framework\u003c/a>\u003c/li>\u003c/ul>\u003c/details>\u003c/footer>\n\u003cscript>document.addEventListener('click',e=>{if(!e.target.closest('#theme, #themeBtn'))return;e.stopImmediatePropagation();parent.portalToggleTheme();},true);document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.stopImmediatePropagation();e.preventDefault();parent.portalOpenSearch();}},true);\u003c/script>\u003c/body>\u003c/html>","flowcharts":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#102747\">\n\u003ctitle>CLF-C02 · Interactive Flowcharts\u003c/title>\n\u003cstyle>\n:root{--bg:#f1f4f9;--panel:#fff;--ink:#17283f;--muted:#61718a;--line:#d5deea;--navy:#102747;--blue:#2672bd;--teal:#147d73;--gold:#c58a28;--green:#1680 h\" type=\"search\" placeholder=\"Search for a service, parameter, skill or trap…\" autocomplete=\"off\">\u003cbutton class=\"clear\" id=\"clearSearch\" aria-label=\"Clear search\">×\u003c/button>\u003c/div>\n  \u003cbutton class=\"toolbtn\" id=\"prevBtn\" title=\"Previous map (←)\">← Previous\u003c/button>\u003cbutton class=\"toolbtn\" id=\"nextBtn\" title=\"Next map (→)\">Next →\u003c/button>\n  \u003cbutton class=\"toolbtn\" id=\"zoomOut\" title=\"Zoom out\">A−\u003c/button>\u003cspan class=\"zoom-readout\" id=\"zoomReadout\">100%\u003c/span>\u003cbutton class=\"toolbtn\" id=\"zoomIn\" title=\"Zoom in\">A+\u003c/button>\n  \u003cbutton class=\"toolbtn\" id=\"themeBtn\">☾ Dark theme\u003c/button>\u003cbutton class=\"toolbtn\" id=\"printCurrent\">Print map\u003c/button>\u003cbutton class=\"toolbtn primary\" id=\"printAllBtn\">Print all\u003c/button>\n  \u003cspan class=\"kbdhint\">Shortcuts: ← → navigate · Ctrl/⌘+K search · Esc clear search\u003c/span>\n \u003c/section>\n \u003cnav class=\"map-nav\" id=\"mapNav\" aria-label=\"Domain maps\">\u003c/nav>\n \u003cdiv class=\"result-note\" id=\"resultNote\" aria-live=\"polite\">\u003c/div>\n \u003csection id=\"mainMap\">\u003c/section>\n \u003csection id=\"printAllContainer\" class=\"hidden\" aria-hidden=\"true\">\u003cdiv id=\"printAllMaps\">\u003c/div>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst MAPS = [{\"id\":1,\"domain\":1,\"tree\":\"1.1\",\"title\":\"Value of the AWS Cloud\",\"skills\":\"1.1.1, 1.1.2\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about the value of the AWS Cloud?\",\"question\":\"Does the scenario require this condition? A ticket office needs to add capacity when sales open and release it when volume drops.\",\"yes\":{\"title\":\"Elasticity\",\"detail\":\"Use a one-week curve and mark the peak, the trough and the capacity. Explain what changes if the behavior becomes predictable and constant.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"The business accepts losing at most 15 minutes of data.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about the value of the AWS Cloud?\",\"question\":\"Does the scenario require this condition? The business accepts losing at most 15 minutes of data.\",\"yes\":{\"title\":\"RPO\",\"detail\":\"Simulate the loss of a zone, then a regional outage. Compare impact, recoverable point and time to return.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"A larger instance can scale vertically and still stay fixed overnight.\"},{\"id\":2,\"domain\":1,\"tree\":\"1.2\",\"title\":\"Design principles and Well-Architected\",\"skills\":\"1.2.1, 1.2.2, 1.2.3\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about design principles and Well-Architected?\",\"question\":\"Does the scenario require this condition? The team automates small deliveries, updates procedures after incidents and measures operational quality.\",\"yes\":{\"title\":\"Operational excellence\",\"detail\":\"Describe a risk and identify the measurable result that confirms the improvement.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"An order system produces messages faster than the workers can process them.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about design principles and Well-Architected?\",\"question\":\"Does the scenario require this condition? An order system produces messages faster than the workers can process them.\",\"yes\":{\"title\":\"Amazon SQS\",\"detail\":\"Note what happens if the consumer is down for a few minutes. Identify whether the producer waits, whether the message can be handled later and how many consumers receive it.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"A review prioritizes preventing credential exposure and detecting misuse.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about design principles and Well-Architected?\",\"question\":\"Does the scenario require this condition? A review prioritizes preventing credential exposure and detecting misuse.\",\"yes\":{\"title\":\"Security\",\"detail\":\"Consider the same change as an intervention in two pillars. Identify the metric that supports the argument for each.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"The performance efficiency pillar does not mean always choosing the largest server.\"},{\"id\":3,\"domain\":1,\"tree\":\"1.3\",\"title\":\"Adoption and migration\",\"skills\":\"1.3.1, 1.3.2\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about adoption and migration?\",\"question\":\"Does the scenario require this condition? An application will be moved from on-premises machines to EC2 without redesign.\",\"yes\":{\"title\":\"Rehost\",\"detail\":\"Identify what changes in the code, the database engine, the infrastructure and the operating model.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"The sponsor needs to address gaps in people, governance and operations before an enterprise migration.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about adoption and migration?\",\"question\":\"Does the scenario require this condition? The sponsor needs to address gaps in people, governance and operations before an enterprise migration.\",\"yes\":{\"title\":\"AWS Cloud Adoption Framework\",\"detail\":\"For each blocker, identify whether what is missing is organizational capability, an architecture decision or a migration mechanism.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"Replacing installed software with a SaaS subscription is repurchase, even if the data is migrated.\"},{\"id\":4,\"domain\":1,\"tree\":\"1.4\",\"title\":\"Cloud economics\",\"skills\":\"1.4.1, 1.4.2\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about cloud economics?\",\"question\":\"Does the scenario require this condition? A startup replaces the upfront purchase of servers with payment proportional to usage.\",\"yes\":{\"title\":\"Trading upfront investment for variable expense\",\"detail\":\"Compare two options with the same volume, growth trend, time frame and SLA.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"An instance stays below 10% utilization for the whole month, even at peak.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about cloud economics?\",\"question\":\"Does the scenario require this condition? An instance stays below 10% utilization for the whole month, even at peak.\",\"yes\":{\"title\":\"Rightsizing\",\"detail\":\"Identify whether the goal is to reduce size, active time, concurrent quantity or labor.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"Price per hour is not the same as total cost. Commitments or upfront purchases still exist in the cloud.\"},{\"id\":5,\"domain\":2,\"tree\":\"2.1\",\"title\":\"Shared responsibility\",\"skills\":\"2.1.1, 2.1.2\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about shared responsibility?\",\"question\":\"Does the scenario require this condition? Who must fix a vulnerability in the Linux the company installed on EC2?\",\"yes\":{\"title\":\"Customer on EC2\",\"detail\":\"List the responsibilities for hardware, guest OS, database engine, credentials and data policies for each option.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"For the customer, physical access control to the AWS data center is what type of control?\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about shared responsibility?\",\"question\":\"Does the scenario require this condition? For the customer, physical access control to the AWS data center is what type of control?\",\"yes\":{\"title\":\"Inherited control\",\"detail\":\"Split the review into provider evidence, managed controls and the customer's configuration decisions.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"Managed does not mean the provider decides who can read the data.\"},{\"id\":6,\"domain\":2,\"tree\":\"2.2\",\"title\":\"Security, governance and compliance\",\"skills\":\"2.2.1, 2.2.2, 2.2.3\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about security, governance and compliance?\",\"question\":\"Does the scenario require this condition? The legal team needs to access an AWS SOC audit report.\",\"yes\":{\"title\":\"AWS Artifact\",\"detail\":\"For four questions from an auditor, state which product provides each piece of evidence.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"The team wants an alarm for an increase in HTTP errors in the service.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about security, governance and compliance?\",\"question\":\"Does the scenario require this condition? The team wants an alarm for an increase in HTTP errors in the service.\",\"yes\":{\"title\":\"Amazon CloudWatch\",\"detail\":\"Associate three pieces of evidence from the same incident: alarm, author of the change and configuration snapshot.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"The organization wants to manage the keys used to encrypt S3 objects.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"},{\"scenario\":\"Which requirement explains the decision about security, governance and compliance?\",\"question\":\"Does the scenario require this condition? The organization wants to manage the keys used to encrypt S3 objects.\",\"yes\":{\"title\":\"AWS KMS\",\"detail\":\"Separate access control, encryption at rest and the network session.\"},\"no\":{\"title\":\"Evaluate another path\",\"detail\":\"Go back to the question and check the requirements in the options shown.\"},\"risk\":\"Compare the requirement with the mechanism and the limits in the linked sheet.\"}],\"traps\":\"A vendor artifact does not show whether your own application configured encryption correctly.\"},{\"id\":7,\"domain\":2,\"tree\":\"2.3\",\"title\":\"Identity and access control\",\"skills\":\"2.3.1, 2.3.2\",\"decisions\":[{\"scenario\":\"Which requirement explains the decision about identity and access control?\",\"question\":\"Does the scenario require this condition? An EC2 instance needs to read objects without distributing permanent keys to the application.\",\"yes\":{\"title\":\"IAM role with temporary credentials\",\"detail\":\"Identify who runs it, which action it needs, which resource it may access and how it obtains  vertical-align: top;\n}\n.ptable th {\n  background: var(--panel2);\n  font-size: 10.5px;\n  text-transform: uppercase;\n  letter-spacing: 0.05em;\n  color: var(--muted);\n}\n.ptable tr:last-child td { border-bottom: 0; }\n.ptable tr:hover td { background: color-mix(in srgb, var(--blue2) 30%, var(--panel)); }\n\n.pbtn {\n  border: 1px solid var(--line);\n  background: var(--panel);\n  color: var(--ink);\n  border-radius: 8px;\n  padding: 7px 12px;\n  font-size: 12px;\n  font-weight: 700;\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n}\n.pbtn:hover { border-color: var(--blue); color: var(--blue); }\n.pbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }\n.pbtn.sm { padding: 4px 8px; font-size: 11px; }\n\n.filter-bar {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n  margin-bottom: 14px;\n  align-items: center;\n}\n.pinput, .pselect {\n  border: 1px solid var(--line);\n  background: var(--panel);\n  color: var(--ink);\n  border-radius: 9px;\n  padding: 8px 11px;\n  font-size: 12.5px;\n}\n\n/* Mode Switcher Banner (Learning Bank vs Exam Simulation Bank) */\n.mode-switch-bar {\n  display: flex;\n  gap: 10px;\n  align-items: center;\n  justify-content: space-between;\n  flex-wrap: wrap;\n  background: var(--panel);\n  border: 1.5px solid var(--blue);\n  border-radius: 13px;\n  padding: 11px 15px;\n  margin-bottom: 14px;\n  box-shadow: var(--shadow);\n}\n.mode-pill-group {\n  display: inline-flex;\n  background: var(--panel2);\n  padding: 4px;\n  border-radius: 10px;\n  border: 1px solid var(--line);\n  gap: 4px;\n}\n.mode-pill {\n  border: 0;\n  background: transparent;\n  color: var(--muted);\n  padding: 7px 13px;\n  border-radius: 8px;\n  font-size: 12px;\n  font-weight: 800;\n}\n.mode-pill.active {\n  background: var(--blue);\n  color: #fff;\n}\n\n/* Simulado & Quiz Engine Styles */\n.quiz-opt {\n  width: 100%;\n  text-align: left;\n  padding: 11px 13px;\n  border-radius: 10px;\n  border: 1.5px solid var(--line);\n  background: var(--panel2);\n  color: var(--ink);\n  margin-bottom: 8px;\n  display: flex;\n  gap: 10px;\n  align-items: flex-start;\n  transition: all 0.14s ease;\n}\n.quiz-opt:hover { border-color: var(--blue); }\n.quiz-opt.selected { border-color: var(--blue); background: var(--blue2); font-weight: 700; }\n.quiz-opt.correct { border-color: var(--green); background: var(--greenbg); }\n.quiz-opt.wrong { border-color: var(--red); background: var(--redbg); }\n.quiz-letter {\n  width: 24px;\n  height: 24px;\n  border-radius: 6px;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  display: inline-grid;\n  place-items: center;\n  font-weight: 800;\n  font-size: 11.5px;\n  flex-shrink: 0;\n}\n.rationale-box {\n  margin-top: 12px;\n  padding: 13px 15px;\n  border-radius: 11px;\n  border-left: 4px solid var(--blue);\n  background: var(--panel2);\n  font-size: 12.5px;\n}\n.rationale-item {\n  margin: 6px 0;\n  padding: 6px 9px;\n  border-radius: 7px;\n  background: var(--panel);\n  border: 1px solid var(--line);\n}\n.arch-diagram {\n  background: #0d1b33;\n  color: #69f0da;\n  padding: 13px 15px;\n  border-radius: 10px;\n  font-size: 11.5px;\n  line-height: 1.45;\n  overflow-x: auto;\n  border: 1px solid #294575;\n  margin: 10px 0;\n}\n\n/* Global Search & Confirmation Modals */\n.modal-backdrop {\n  position: fixed;\n  inset: 0;\n  background: rgba(6, 14, 28, 0.72);\n  backdrop-filter: blur(5px);\n  z-index: 3000;\n  display: none;\n  align-items: flex-start;\n  justify-content: center;\n  padding: 50px 16px 20px;\n}\n.modal-backdrop.open { display: flex; }\n.search-modal {\n  width: 100%;\n  max-width: 960px;\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: 16px;\n  box-shadow: 0 22px 54px rgba(0,0,0,0.45);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  max-height: 84vh;\n}\n.search-modal-head {\n  padding: 13px 16px;\n  border-bottom: 1px solid var(--line);\n  display: flex;\n  gap: 10px;\n  align-items: center;\n}\n.search-modal-head input {\n  flex: 1;\n  border: 1px solid var(--blue);\n  background: var(--panel2);\n  color: var(--ink);\n  padding: 10px 14px;\n  border-radius: 10px;\n  font-size: 14px;\n  outline: none;\n}\n.search-modal-body {\n  padding: 12px 16px;\n  overflow-y: auto;\n  flex: 1;\n}\n.search-hit {\n  padding: 10px 12px;\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  margin-bottom: 8px;\n  background: var(--panel2);\n  cursor: pointer;\n  display: flex;\n  justify-content: space-between;\n  gap: 12px;\n  align-items: center;\n}\n.search-hit:hover {\n  border-color: var(--blue);\n  background: var(--blue2);\n}\n.prog-bar-outer {\n  height: 8px;\n  background: var(--panel2);\n  border-radius: 999px;\n  overflow: hidden;\n  border: 1px solid var(--line);\n}\n.prog-bar-inner {\n  height: 100%;\n  background: linear-gradient(90deg, var(--blue), var(--teal));\n  transition: width 0.25s ease;\n}\n\n/* Toast Notification */\n.toast-msg {\n  position: fixed;\n  bottom: 20px;\n  right: 20px;\n  z-index: 4000;\n  background: var(--navy);\n  color: #fff;\n  border: 1px solid var(--blue);\n  padding: 10px 16px;\n  border-radius: 10px;\n  box-shadow: var(--shadow);\n  font-size: 12.5px;\n  font-weight: 700;\n  display: none;\n}\n.toast-msg.show { display: block; }\n\n@media (max-width: 1020px) {\n  .grid.four, .grid.three, .grid.two { grid-template-columns: 1fr; }\n  .dropdown-menu { min-width: min(350px, 94vw); }\n}\n\u003c/style>\n\u003cstyle>\nhtml,body{width:auto;height:auto;min-height:100%}\n#returnBar,#main,#status{width:min(1640px,100% - 36px);margin:0 auto}\n#returnBar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:12px}#status{color:var(--orange);min-height:1.7em;margin-top:.4rem}#main{padding:0 0 48px}.quiz-options{display:grid;gap:7px}.choice{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:9px;cursor:pointer}.choice input{accent-color:var(--blue)}.choice.good,.feedback.good{background:var(--greenbg);border-color:var(--green)}.choice.bad,.feedback.bad{background:var(--redbg);border-color:var(--red)}.feedback{margin-top:12px}.jump-questions{display:flex;gap:5px;flex-wrap:wrap}.answered{border-color:var(--teal);color:var(--teal)}.stem{white-space:pre-wrap;overflow-wrap:anywhere}.quiz-instruction{margin-bottom:.45rem}textarea{width:100%;resize:vertical}.pbtn{text-decoration:none;display:inline-flex;align-items:center}#confirmDialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:min(520px,90vw)}#confirmDialog::backdrop{background:#03122bcc}@media(max-width:560px){#main,#returnBar,#status{width:calc(100% - 20px)}}\n\u003c/style>\n\u003c/head>\u003cbody>\u003cnav id=\"returnBar\">\u003cbutton type=\"button\" class=\"pbtn\" id=\"coreReturn\">Back to module\u003c/button>\u003cbutton type=\"button\" class=\"pbtn\" id=\"coreHelp\">Import backup and view progress\u003c/button>\u003c/nav>\u003cdiv id=\"status\" role=\"status\">\u003c/div>\u003cmain id=\"main\">\u003c/main>\u003cdialog id=\"confirmDialog\" aria-label=\"Confirm action\">\u003cp id=\"confirmText\">\u003c/p>\u003cdiv class=\"filter-bar\">\u003cbutton type=\"button\" class=\"pbtn\" id=\"confirmCancel\">Cancel\u003c/button>\u003cbutton type=\"button\" class=\"pbtn primary\" id=\"confirmOk\">Confirm\u003c/button>\u003c/div>\u003c/dialog>\u003cscript>'use strict';\nconst m=parent.portalModel;\nconst data=parent.portalInput;\nconst questions=new Map(data.questions.map(q=>[q.id,q]));\nconst skills=new Map(m.skills.map(s=>[s.id,s]));\nconst practice=data.questions.filter(q=>!q.form);\nconst LEGACY_STORE='integrated-study/'+m.key+'/v1';\nconst STORE=LEGACY_STORE+'_1';\nconst VERSION=m.version;\nconst LEGACY='1.0';\nconst archived=data.archive[LEGACY];\nconst archivedQuestions=new Map(archived.questions.map(q=>[q.id,q]));\nconst attemptForms=a=>a?.version===LEGACY?archived.forms:data.forms;\nconst examQuestion=(a,id)=>(a.version===LEGACY?archivedQuestions:questions).get(id);\nconst edition=a=>' · v'+a.version;\nconst secret=/^(A|B)-\\d{10,15}-\\d+$/;\nconst expires=m.minutes*60000;\nconst $=id=>document.getElementById(id);\nconst main=$('main');\nconst esc=x=>String(x??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst norm=x=>String(x??'').normalize('NFD').replace(/\\p{Diacritic}/gu,'').toLowerCase();\nconst Q=(action,label,value='',style='pbtn')=>'\u003cbutton type=\"button\" class=\"'+style+'\" data-action=\"'+action+'\" data-value=\"'+esc(value)+'\">'+esc(label)+'\u003c/button>';\nconst L=(path,label)=>'\u003ca class=\"pbtn\" href=\"#'+esc(path)+'\">'+esc(label)+'\u003c/a>';\nconst H=(tag,title,p)=>'\u003cdiv class=\"sec-head\">\u003cdiv class=\"eyebrow\">'+esc(tag)+'\u003c/div>\u003ch2>'+esc(title)+'\u003c/h2>\u003cp>'+esc(p)+'\u003c/p>\u003c/div>';\nconst own=(obj,k)=>Object.hasOwn(obj,k);\nconst object=x=>x&&typeof x==='object'&&!Array.isArray(x);\nconst validChoice=(q,x,final=false)=>Array.isArray(x)&&new Set(x).size===x.length&&x.every(i=>Number.isInteger(i)&&i>=0&&i\u003cq.options.length)&& (final?x.length===q.correct.length:x.length\u003c=q.correct.length);\nconst isRight=(q,answer)=>validChoice(q,answer,true)&&q.correct.every(i=>answer.includes(i));\nconst currentPath=()=>location.hash.slice(1)||'pratica';\nconst go=path=>{if(currentPath()===path)render();else location.hash=path;};\nconst empty=()=>({certification:m.cert,version:VERSION,marked:{},notes:{},cases:{},practice:{},legacyPractice:{},active:null,attempts:[],queue:[]});\nlet state=empty(), draft=null, reviewErrors=false, filter={domain:0,query:'',status:''}, pendingAction=null;\nfunction permute(ids,seed){\n const out=[...ids];\n let n=seed>>>0||1;\n for(let i=out.length-1;i>0;i--){\n  n^=n\u003c\u003c13;n^=n>>>17;n^=n\u003c\u003c5;\n  const j=(n>>>0)%(i+1);\n  [out[i],out[j]]=[out[j],out[i]];\n }\n return out;\n}\nfunction rand(){return crypto.getRandomValues(new Uint32Array(1))[0]||1;}\nfunction items(a){return permute(attemptForms(a)[a.form],a.seed);}\nfunction checkAttempt(a,finished){\n const forms=attemptForms(a);\n if(!object(a)||!secret.test(a.id)||!own(forms,a.form)||![VERSION,LEGACY].includes(a.version)||\n  !Number.isInteger(a.seed)||a.seed\u003c1||a.seed>0xffffffff||!Number.isFinite(a.started)||\n  a.deadline!==a.started+expires||!Number.isInteger(a.index)||a.index\u003c0||a.index>=forms[a.form].length||\n  !object(a.answers)||!object(a.flags))return false;\n if(finished?(typeof a.finished!=='number'||a.finished\u003ca.started||!Number.isFinite(a.finished)):('finished' in a))return false;\n const selected=new Set(forms[a.form]);\n return Object.entries(a.answers).every(([id,ans])=>selected.has(id)&&validChoice(examQuestion(a,id),ans))&&Object.entries(a.flags).every(([id,v])=>selected.has(id)&&typeof v==='boolean');\n}\nfunction validated(raw){\n if(!object(raw)||raw.certification!==m.cert||![VERSION,LEGACY].includes(raw.version))throw Error(\"Incompatible backup\");\n const out=empty();\n for(const [k,v] of Object.entries(raw.marked??{}))if(skills.has(k)&&v===true)out.marked[k]=true;\n for(const [k,v] of Object.entries(raw.notes??{}))if(skills.has(k)&&typeof v==='string')out.notes[k]=v.slice(0,16000);\n for(const [k,v] of Object.entries(raw.cases??{}))if(m.architectures.some(a=>a.native===k)&&v===true)out.cases[k]=true;\n function readRecords(source,bank,target){\n  for(const [k,v] of Object.entries(source??{})){\n   const q=bank.get(k);\n   if(q&&!q.form&&object(v)&&validChoice(q,v.choice,true)&&typeof v.first==='boolean'&&Number.isFinite(v.updated)){\n    target[k]={first:v.first,last:isRight(q,v.choice),choice:v.choice,updated:v.updated};\n   }\n  }\n }\n if(raw.version===VERSION)readRecords(raw.practice,questions,out.practice);\n readRecords(raw.version===LEGACY?raw.practice:raw.legacyPractice,archivedQuestions,out.legacyPractice);\n out.attempts=[...new Map((Array.isArray(raw.attempts)?raw.attempts:[]).filter(a=>checkAttempt(a,true)).map(a=>[a.id,a])).values()].sort((a,b)=>a.finished-b.finished);\n const visited=new Set(out.attempts.map(a=>a.id));\n for(const a of [raw.active,...(Array.isArray(raw.queue)?raw.queue:[])])if(checkAttempt(a,false)&&!visited.has(a.id)){\n  visited.add(a.id);if(out.active)out.queue.push(a);else out.active=a;\n }\n return out;\n}\ntry{const raw=localStorage.getItem((STORE) + \".en\")??localStorage.getItem((LEGACY_STORE) + \".en\");if(raw)state=validated(JSON.parse(raw));}catch{announce(\"Local progress is unavailable. Use a JSON backup.\");}\nfunction save(){\n try{localStorage.setItem((STORE) + \".en\",JSON.stringify(state));}\n catch{announce(\"The browser blocked storage. Export your progress.\");}\n}\nfunction announce(msg){$('status').textContent=msg;}\nfunction report(){parent.portalCoreUpdated();}\nfunction saveAndReport(){save();report();}\nfunction grade(a){\n const domains=m.domains.map(x=>({id:x.id,right:0,total:0}));\n let right=0,total=0,pilot=0,pilotTotal=0;\n for(const id of items(a)){\n  const q=examQuestion(a,id),ok=isRight(q,a.answers[id]);\n  if(q.scored){const d=domains[q.domain-1];d.right+=Number(ok);d.total++;right+=Number(ok);total++;}\n  else{pilot+=Number(ok);pilotTotal++;}\n }\n return {right,total,pilot,pilotTotal,domains};\n}\nfunction start(form){\n if(state.active){go('simulado');return;}\n if(!own(data.forms,form))return;\n const started=Date.now(),seed=rand();\n state.active={id:form+'-'+started+'-'+seed,form,seed,version:VERSION,started,deadline:started+expires,index:0,answers:{},flags:{}};\n saveAndReport();go('simulado');\n}\nfunction finish(a,expired,nav){\n const match=state.attempts.find(x=>x.id===a.id);\n if(!match)state.attempts.push({...a,finished:expired?a.deadline:Date.now(),expired:Boolean(expired)});\n state.attempts.sort((x,y)=>x.finished-y.finished);\n if(state.active?.id===a.id)state.active=null;\n state.queue=state.queue.filter(x=>x.id!==a.id);\n saveAndReport();if(nav)go('resultado/'+a.id);\n}\nfunction tick(){\n const now=Date.now();\n for(const a of state.queue.slice())if(now>=a.deadline)finish(a,true,false);\n const active=state.active;\n if(!active)return true;\n const left=Math.ceil((active.deadline-now)/1000);\n if(left\u003c=0){finish(active,true,currentPath()==='simulado');return false;}\n const clock=$('clock');\n if(clock)clock.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');\n return true;\n}\nconst orderFor=(q,seed)=>permute(q.options.map((_,i)=>i),seed);\nfunction opts(q,picks,seed,graded){\n const type=q.kind==='multi'?'checkbox':'radio';\n return (type==='checkbox'?\"\\u003cp class=\\\"quiz-instruction\\\">Select \"+q.correct.length+\" options.\\u003c/p>\":'')+\n '\u003cdiv class=\"quiz-options\">'+orderFor(q,seed).map((idx,i)=>{\n  const selected=picks?.includes(idx);\n  const tone=graded?(q.correct.includes(idx)?' good':selected?' bad':''):'';\n  return '\u003clabel class=\"choice'+tone+'\">\u003cinput type=\"'+type+'\" name=\"answer\" value=\"'+idx+'\"'+(selected?' checked':'')+(graded?' disabled':'')+'> \u003cspan>\u003cb>'+String.fromCharCode(65+i)+'.\u003c/b> '+esc(q.options[idx])+'\u003c/span>\u003c/label>';\n }).join('')+'\u003c/div>';\n}\nfunction explain(q,picks,seed){\n const ok=isRight(q,picks);\n return '\u003csection class=\"pcard feedback '+(ok?'good':'bad')+'\">\u003ch3>'+(ok?\"Correct answer\":picks?.length?\"Incorrect answer\":\"Unanswered\")+\"\\u003c/h3>\\u003cp>\\u003cb>Answer key\\u003c/b> \"+q.correct.map(i=>esc(q.options[i])).join(' · ')+'\u003c/p>'+\n \"\\u003cdetails open>\\u003csummary>Reasoning for each option\\u003c/summary>\\u003col type=\\\"A\\\">\"+orderFor(q,seed).map(i=>'\u003cli>\u003cb>'+esc(q.options[i])+'\u003c/b> '+esc(q.why[i])+'\u003c/li>').join('')+'\u003c/ol>\u003c/details>'+\n Q('skill',\"Open sheet \"+q.skill,q.skill)+'\u003c/section>';\n}\nfunction progressPage(){\n main.innerHTML=H(\"Backup and history\",\"Import or export progress\",\"Each file has its own state. The backup includes notes, answered questions, and completed or active attempts.\")+\n '\u003cdiv class=\"filter-bar\">'+Q('backup',\"Export progress (JSON)\",'','pbtn primary')+Q('import','Import backup')+L('pratica',\"Review mock exams\")+'\u003c/div>'+\n '\u003cinput type=\"file\" id=\"backupFile\" accept=\".json,application/json\" hidden>'+\n '\u003cp>'+Object.keys(state.legacyPractice).length+\" practice answers from v\"+LEGACY+\" were archived in the backup history. Current practice and readiness use bank v\"+VERSION+'.\u003c/p>'+historyList();\n}\nfunction historyList(){\n return \"\\u003csection class=\\\"pcard\\\">\\u003ch3>Mock exam history\\u003c/h3>\"+\n (state.attempts.length?state.attempts.slice().reverse().map(a=>{\n  const g=grade(a);\n  return '\u003cp>'+L('resultado/'+a.id,\"Mock exam \"+a.form+' · '+g.right+'/'+g.total+edition(a))+' '+esc(new Date(a.finished).toLocaleString(\"en\"))+'\u003c/p>';\n }).join(''):\"\\u003cp>No mock exams submitted.\\u003c/p>\")+'\u003c/section>';\n}\nfunction practiceHome(){\n main.innerHTML=H(\"Practice and mock exams\",\"History and resuming\",\"Mock exam answers become available only after you submit or time runs out.\")+\n '\u003cdiv class=\"filter-bar\">'+(state.active?L('simulado',\"Resume mock exam \"+state.active.form+edition(state.active)):Object.keys(data.forms).map(f=>Q('start',\"Start mock exam \"+f,f,'pbtn primary')).join(''))+L('pratica/banco',\"Open bank\")+L('progresso','Import backup')+'\u003c/div>'+\n (state.queue.length?\"\\u003csection class=\\\"pcard\\\">\\u003ch3>Imported attempts\\u003c/h3>\"+state.queue.map(a=>Q('resume',\"Resume \"+a.form+edition(a),a.id)).join('')+'\u003c/section>':'')+historyList();\n}\nfunction bank(){\n const opts=m.domains.map(d=>'\u003coption value=\"'+d.id+'\"'+(filter.domain===d.id?' selected':'')+'>'+esc(d.name)+'\u003c/option>').join('');\n main.innerHTML=H(\"Learning bank\",\"Explained questions\",\"Filter by area, requirement, or performance.\")+\n \"\\u003cdiv class=\\\"filter-bar\\\">\\u003cselect class=\\\"pselect\\\" id=\\\"bankArea\\\" aria-label=\\\"Area\\\">\\u003coption value=\\\"0\\\">All areas\\u003c/option>\"+opts+'\u003c/select>\u003cinput class=\"pinput\" type=\"search\" id=\"bankQuery\" aria-label=\"Buscar no banco\" value=\"'+esc(filter.query)+\"\\\" placeholder=\\\"Search for a concept or scenario\\\">\\u003cselect class=\\\"pselect\\\" id=\\\"bankStatus\\\" aria-label=\\\"Performance\\\">\\u003coption value=\\\"\\\">All\\u003c/option>\\u003coption value=\\\"wrong\\\"\"+(filter.status==='wrong'?' selected':'')+\">Last answer incorrect\\u003c/option>\\u003coption value=\\\"new\\\"\"+(filter.status==='new'?' selected':'')+\">No attempt\\u003c/option>\\u003c/select>\\u003c/div>\\u003cdiv id=\\\"bankRows\\\">\\u003c/div>\";\n const draw=()=>{\n  const q=norm(filter.query);\n  const rows=practice.filter(p=>(!filter.domain||p.domain===filter.domain)&&norm(p.stem+' '+skills.get(p.skill).title).includes(q)&&(!filter.status||(filter.status==='wrong'?state.practice[p.id]?.last===false:!state.practice[p.id])));\n  $('bankRows').innerHTML='\u003cp>'+rows.length+\" question(s)\\u003c/p>\"+rows.map(p=>'\u003carticle class=\"pcard\" style=\"margin-bottom:8px\">\u003cspan class=\"pbadge\">'+esc(p.skill)+'\u003c/span>\u003ch3>'+esc(p.stem)+'\u003c/h3>'+L('pratica/item/'+p.id,\"Open question\")+'\u003c/article>').join('');\n };\n $('bankArea').onchange=e=>{filter.domain=Number(e.target.value);draw();};\n $('bankQuery').oninput=e=>{filter.query=e.target.value;draw();};\n $('bankStatus').onchange=e=>{filter.status=e.target.value;draw();};draw();\n}\nfunction session(path){\n if(!draft||draft.path!==path)draft={path,i:0,picks:[],checked:false,seed:rand()};\n const list=path==='pratica/diagnostico'?m.diag:[path.split('/').at(-1)];\n if(!list[draft.i]||!questions.has(list[draft.i])||questions.get(list[draft.i]).form){practiceHome();return;}\n const q=questions.get(list tatic;height:auto;min-height:0;max-height:none;width:100%;max-width:100%;min-width:0;box-sizing:border-box;overflow:visible;cursor:auto;touch-action:auto;user-select:text;padding:clamp(12px,2vw,24px);background:var(--panel)}\n.atomic-nav,.atomic-choices{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0 1rem}\n.atomic-btn,.atomic-result,.atomic-edge,#diagramFrame h3,#diagramFrame h4{position:static;transform:none;height:auto;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.5;box-sizing:border-box;text-align:start}\n.atomic-btn{font:inherit;line-height:1.5;cursor:pointer;color:var(--ink);background:var(--panel2);border:1px solid var(--line);padding:.55rem .8rem;border-radius:8px}\n.atomic-btn:focus-visible,.atomic-btn:hover{outline:2px solid var(--blue)}\n.atomic-result{display:table;padding:.6rem .9rem;margin:.45rem 0;background:var(--greenbg);color:var(--green);border:2px solid var(--green);border-radius:8px;font-weight:bold}\n.atomic-trail{padding-left:1.5rem;color:var(--muted)}.atomic-trail li{margin:.4rem 0}.atomic-trail b{display:block}\n.atomic-level h4{margin:.7rem 0}.atomic-level ul{margin:0;padding-left:clamp(.4rem,1.4vw,1.15rem);list-style:none;border-left:2px solid var(--line)}.atomic-level li{padding:.45rem 0 .65rem .5rem}.atomic-edge{display:block;color:var(--muted);font-weight:600}\n@media(max-width:550px){.atomic-choices{display:grid;grid-template-columns:minmax(0,1fr)}.atomic-level ul{padding-left:.35rem}.atomic-level li{padding-left:.25rem}}\n\u003c/style>\u003cstyle>\n#decision #diagramFrame{padding:clamp(6px,1vw,14px);--dt-wire:#54728e;--dt-q:#e9f2ff;--dt-q-stroke:#2262a8;--dt-q-text:#15395d;--dt-c:#fff6df;--dt-c-stroke:#976b1d;--dt-c-text:#65470c;--dt-a:#e2f6ed;--dt-a-stroke:#22805d;--dt-a-text:#105a40}\nhtml[data-theme=\"dark\"] #decision #diagramFrame{--dt-wire:#8da6bd;--dt-q:#182f4b;--dt-q-stroke:#84b9ff;--dt-q-text:#e2edff;--dt-c:#352c1e;--dt-c-stroke:#d6ad63;--dt-c-text:#ffe6af;--dt-a:#123b30;--dt-a-stroke:#60d4a8;--dt-a-text:#c5fae5}\n.dt-toolbar,.dt-legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px}\n.dt-orient{display:inline-flex;align-items:center;gap:5px;font-size:13px}.dt-toolbar select,.dt-toolbar button,.dt-jump select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:600 13px/1.35 system-ui;padding:7px 10px;cursor:pointer}\n.dt-toolbar button[data-cmd=\"all\"]{background:var(--blue);color:var(--panel)}\n.dt-jump{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:8px 0;font-size:13px}\n.dt-jump select{min-width:0;max-width:100%;text-overflow:ellipsis}\n.dt-legend{margin:8px 0;font-size:12px;color:var(--muted);gap:12px}\n.dt-legend span:before{content:'';display:inline-block;width:9px;height:9px;margin-right:4px;border-radius:3px;background:var(--dt-q-stroke)}\n.dt-legend span:nth-child(2):before{background:var(--dt-c-stroke)}.dt-legend span:nth-child(3):before{background:var(--dt-a-stroke)}\n.dt-stage{height:clamp(340px,68vh,840px);min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}\n.dt-svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.dt-svg:active{cursor:grabbing}\n.dt-node{cursor:pointer}.dt-node rect{stroke-width:1.6}.dt-question rect{fill:var(--dt-q);stroke:var(--dt-q-stroke)}\n.dt-condition rect{fill:var(--dt-c);stroke:var(--dt-c-stroke);stroke-dasharray:5 2}.dt-answer rect{fill:var(--dt-a);stroke:var(--dt-a-stroke);stroke-width:2.4}\n.dt-node text{font:600 14px Arial,sans-serif;pointer-events:none}.dt-question text{fill:var(--dt-q-text)}.dt-condition text{fill:var(--dt-c-text)}.dt-answer text{fill:var(--dt-a-text)}\n.dt-node:focus rect,.dt-node:hover rect{stroke-width:3}.dt-line{fill:none;stroke:var(--dt-wire);stroke-width:2}\n#decision #diagramFrame.dt-large{position:fixed;inset:0;z-index:1500;display:flex;flex-direction:column;overflow:auto;background:var(--panel);height:100%;width:100%;border-radius:0}\n.dt-large .dt-stage{flex:1;min-height:140px}\n\u003c/style>\n\u003cstyle>\nhtml{scroll-padding-top:165px}.head .search{min-width:0}#algoFamily,#algoMode{width:100%;margin:5px 0}.study-toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:.65rem 0}.alternatives{font-size:.92em}.algobtn{text-align:left}.detailgrid>div{min-width:0}.guided-case pre{overflow:auto;max-width:100%;white-space:pre;background:var(--panel2);padding:12px;border-radius:9px;color:var(--ink)}#deep>.card+.card{margin-top:14px}.mindmap .hub{min-height:150px}.mindmap .hub h3{margin:.25rem 0}.mindmap .hub .eyebrow{color:#9dc5ff}.study-btn:focus-visible,.dt-node:focus-visible{outline:2px solid var(--blue)}\n@media(max-width:760px){html{scroll-padding-top:220px}.detailgrid{grid-template-columns:1fr}.tablewrap{overflow:auto}.sidebar{max-height:240px}}\n@media print{body.print-all main>.view{display:none!important}.print-library .study-toolbar{display:none}.print-library{overflow:visible}} \n\u003c/style>\n\u003c/head>\u003cbody>\u003cheader>\n \u003cdiv class=\"head\">\n  \u003cdiv class=\"top\">\n   \u003cdiv class=\"brand\">\u003cdiv class=\"logo\" id=\"domainLogo\">\u003c/div>\u003cdiv>\u003ch1 id=\"domainTitle\">\u003c/h1>\u003cp id=\"domainSummary\">\u003c/p>\u003c/div>\u003c/div>\n   \u003cdiv class=\"tools\">\u003cbutton class=\"toolbtn\" id=\"themeBtn\">☾ Theme\u003c/button>\u003cbutton class=\"toolbtn\" id=\"printCurrent\">Print current section\u003c/button>\u003cbutton class=\"toolbtn primary\" id=\"printAll\">Print full guide\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"searchrow\">\u003cdiv class=\"search\">\u003cspan class=\"glass\">⌕\u003c/span>\u003cinput id=\"globalSearch\" type=\"search\" placeholder=\"Search for a skill, feature, parameter or trap…\" aria-label=\"Search the theory\">\u003c/div>\u003cdiv class=\"searchhint\">\u003cspan class=\"kbd\">←\u003c/span> \u003cspan class=\"kbd\">→\u003c/span> navigate the cards\u003c/div>\u003c/div>\n  \u003cnav class=\"tabs\" id=\"tabs\">\n   \u003cbutton class=\"tab active\" data-view=\"overview\">Overview &amp; Mind Map\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"choices\">Approaches &amp; Decision Criteria\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"deep\">Technical Guides &amp; Reference\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"decision\">Decision tree\u003c/button>\n   \u003cbutton class=\"tab\" data-view=\"algorithmView\" id=\"libraryTab\">Skills Library\u003c/button>\n  \u003c/nav>\n \u003c/div>\n\u003c/header>\n\u003cmain>\n\u003csection class=\"view active\" id=\"overview\">\u003c/section>\n\u003csection class=\"view\" id=\"choices\">\u003c/section>\n\u003csection class=\"view\" id=\"deep\">\u003c/section>\n\u003csection class=\"view\" id=\"decision\">\n \u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">Interactive decision tree\u003c/div>\u003ch2>Choose by the scenario's requirement\u003c/h2>\u003cp>Open the sheet on the green leaf. Use the two orientations and find a branch to read the answers.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"decision-toolbar\" id=\"treeOptions\">\u003c/div>\n \u003cp class=\"callout info\" id=\"treeNote\">\u003c/p>\n \u003cdiv class=\"diagram-frame\" id=\"diagramFrame\">\u003c/div>\n \u003cdiv class=\"card\" style=\"margin-top:12px\">\u003ch3>Master tree coverage matrix\u003c/h3>\u003cdiv class=\"tablewrap\" id=\"decisionCoverage\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"view\" id=\"algorithmView\">\n \u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">Full library\u003c/div>\u003ch2 id=\"libraryTitle\">\u003c/h2>\u003cp>Fundamentals, selection criteria, parameters, solved cases and documentation for each skill.\u003c/p>\u003c/div>\u003c/div>\n \u003cdiv class=\"cataloglayout\">\n  \u003caside class=\"card sidebar\">\u003ch3>Filter the library\u003c/h3>\u003cselect class=\"select\" id=\"algoFamily\" aria-label=\"Filter by task\">\u003c/select>\u003cselect class=\"select\" id=\"algoMode\" aria-label=\"Filter by sheet type\">\u003coption value=\"\">All categories\u003c/option>\u003coption value=\"skill\">Skills\u003c/option>\u003coption value=\"card\">Service sheets\u003c/option>\u003c/select>\u003cdiv class=\"algolist\" id=\"algoList\">\u003c/div>\u003c/aside>\n  \u003cdiv class=\"algodetail\" id=\"algoDetail\">\u003c/div>\n \u003c/div>\n\u003c/section>\n\u003cdiv class=\"print-library\" id=\"printLibrary\">\u003c/div>\n\u003cdiv class=\"foot\" id=\"theoryFooter\">\u003c/div>\n\u003c/main>\n\u003cscript>const m=parent.portalModel;\nconst selected=Number(window.frameElement.dataset.domain);\nconst domain=m.domains[selected-1];\nconst domainSkills=m.skills.filter(s=>s.domain===selected);\nconst domainCards=m.cards.filter(s=>s.domain===selected);\nconst ALGOS=[...domainSkills,...domainCards];\nconst TREES=m.trees.filter(t=>t.domain===selected);\nconst ATOMIC_TREES=Object.fromEntries(TREES.map(t=>[t.id,t.root]));\nconst DB=m.key==='pro', term=m.domainLabel;\nconst $=(sel,p=document)=>p.querySelector(sel), $$=(sel,p=document)=>[...p.querySelectorAll(sel)];\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst norm=s=>String(s??'').normalize('NFD').replace(/\\p{Diacritic}/gu,'').toLowerCase();\nconst isCard=a=>a.id.startsWith('c');\nconst skillLabel=a=>isCard(a)?\"Technical sheet\":a.code+\" · Skill\";\nconst taskLabel=t=>t+' · '+m.tasks[t];\nconst showCore=p=>parent.portalOpenCore(p);\nconst chapter=key=>parent.portalInput.chapters?.find(c=>c.code===key);\nlet activeView='overview',activeAlgo=ALGOS[0].id,activeList=ALGOS;\nlet searchTerm='';\nconst heading=(b,h,d)=>'\u003cdiv class=\"pagehead\">\u003cdiv>\u003cdiv class=\"eyebrow\">'+esc(b)+'\u003c/div>\u003ch2>'+esc(h)+'\u003c/h2>\u003cp>'+esc(d)+'\u003c/p>\u003c/div>\u003c/div>';\nconst action=(label,data,id,cls='toolbtn')=>'\u003cbutton class=\"'+cls+'\" data-'+data+'=\"'+esc(id)+'\" type=\"button\">'+esc(label)+'\u003c/button>';\nconst paragraphs=items=>items.map(x=>'\u003cp>'+esc(x)+'\u003c/p>').join('');\nconst refs=entries=>'\u003cdiv class=\"doclinks\">'+entries.map(([label,url])=>'\u003ca href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener\">'+esc(label)+' ↗\u003c/a>').join('')+'\u003c/div>';\nfunction table(head,rows){\n return '\u003cdiv class=\"tablewrap\">\u003ctable class=\"paramtable\">\u003cthead>\u003ctr>'+head.map(x=>'\u003cth scope=\"col\">'+esc(x)+'\u003c/th>').join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+rows.map(r=>'\u003ctr>'+r.map(v=>'\u003ctd>'+esc(v)+'\u003c/td>').join('')+'\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\nfunction showView(id){\n if(activeView==='decision'&&id!=='decision'){\n  $('#diagramFrame').classList.remove('dt-large');\n }\n activeView=id;\n $$('.view').forEach(v=>v.classList.toggle('active',v.id===id));\n $$('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.view===id);b.setAttribute('aria-pressed',String(b.dataset.view===id));});\n window.scrollTo({top:0,behavior:'instant'});\n if(id==='decision')requestAnimationFrame(()=>renderDecisionTree(activeTreeKey));\n}\nfunction cases(a,print){\n if(!a.scenarios.length)return '';\n return a.scenarios.map((s,i)=>'\u003csection class=\"guided-case\">\u003ch3>'+(i?\"Scenario variation\":\"Solved case\")+'\u003c/h3>\u003cp>'+esc(s.prompt)+\"\\u003c/p>\\u003cdetails open>\\u003csummary>Reasoning and verification\\u003c/summary>\\u003ch4>Decision and execution\\u003c/h4>\\u003cp>\\u003cb>\"+esc(s.solution)+'\u003c/b>\u003c/p>\u003cp>'+esc(s.explanation)+\"\\u003c/p>\\u003ch4>How to verify\\u003c/h4>\\u003cp>\"+esc(a.verify)+\"\\u003c/p>\\u003cdiv class=\\\"alternatives\\\">\\u003ch4>Reasoning for each option\\u003c/h4>\\u003cul>\"+s.options.map(([o,w])=>'\u003cli>\u003cb>'+esc(o)+'\u003c/b> '+esc(w)+'\u003c/li>').join('')+'\u003c/ul>\u003c/div>'+(!print?action(\"Solve it in practice ↗\",'core','pratica/item/'+s.id):'')+'\u003c/details>\u003c/section>').join('');\n}\nfunction detailBox(title,text){return '\u003cdiv class=\"detailcard\">\u003ch3>'+esc(title)+'\u003c/h3>\u003cp>'+esc(text)+'\u003c/p>\u003c/div>';}\nfunction skillCard(a,print=false){\n const done=parent.portalSnapshot.marked[a.id];\n const related=a.detail.map(id=>ALGOS.find(c=>c.id===id)).filter(Boolean);\n const docs=a.docs.length?a.docs:[m.sources[0]];\n const labs=m.labs.filter(x=>x.skills.includes(a.id));\n return '\u003cdiv class=\"card '+(print?'print-algo':'')+'\">\u003cdiv class=\"algotitle\">\u003cdiv>\u003cdiv class=\"eyebrow\">'+esc(taskLabel(a.task))+'\u003c/div>\u003ch2>'+esc((isCard(a)?'':a.code+' · ')+a.title)+'\u003c/h2>\u003c/div>\u003cspan class=\"badge\">'+esc(skillLabel(a))+'\u003c/span>\u003c/div>'+\n \"\\u003cdiv class=\\\"callout good\\\">\\u003cb>How to think about it\\u003c/b> \"+esc(a.concept)+'\u003c/div>'+\n (!print?'\u003cdiv class=\"study-toolbar\">'+(!isCard(a)?action(done?\"✓ Studied\":\"Mark as studied\",'mark',a.id,'study-btn'): '')+(a.notes?action(\"Open deep dive ↗\",'guide',a.notes,'study-btn'):'')+labs.map(x=>action(x.title,'lab',x.id,'study-btn')).join('')+action(\"Personal notes ↗\",'core',a.legacy,'study-btn')+'\u003c/div>':'')+\n cases(a,print)+'\u003cdiv class=\"detailgrid\">'+ detailBox(\"🎯 When to choose\",a.use)+detailBox(\"📥 Architecture, data and contracts\",a.control)+detailBox(\"🧪 Validation and operation\",a.verify||a.example)+\n \"\\u003cdiv class=\\\"detailcard\\\">\\u003ch3>⚖️ Trade-offs and limitations\\u003c/h3>\\u003cp>\"+esc(a.avoid)+\"\\u003c/p>\\u003cdiv class=\\\"callout warn\\\">\\u003cb>Exam trap\\u003c/b>\\u003cp>\"+esc(a.pitfall)+'\u003c/p>\u003c/div>\u003c/div>\u003c/div>'+\n (a.codeSample?'\u003csection class=\"guided-case\">\u003ch3>'+esc(a.codeTitle||\"Implementation example\")+'\u003c/h3>\u003cpre>\u003ccode>'+esc(a.codeSample)+'\u003c/code>\u003c/pre>\u003c/section>':'')+\n (a.params.length?\"\\u003ch3>Essential settings, metrics and features\\u003c/h3>\"+table([\"Parameter or feature\",\"What it controls\",\"How to interpret it on the exam\"],a.params):'')+\n (!print&&related.length?\"\\u003csection class=\\\"guided-case\\\">\\u003ch3>Related technical sheets\\u003c/h3>\\u003cdiv class=\\\"study-toolbar\\\">\"+related.map(x=>action(x.title,'skill',x.id,'study-btn')).join('')+'\u003c/div>\u003c/section>':'')+\n (!a.codeSample&&a.example?\"\\u003csection class=\\\"guided-case\\\">\\u003ch3>Applied example\\u003c/h3>\\u003cp>\"+esc(a.example)+'\u003c/p>\u003c/section>':'')+\n \"\\u003ch3>Official documentation\\u003c/h3>\"+refs(docs)+'\u003c/div>';\n}\nfunction showAlgo(id){\n const a=ALGOS.find(x=>x.id===id); if(!a)return;\n activeAlgo=id;\n $('#algoDetail').innerHTML=skillCard(a);\n $$('.algobtn').forEach(b=>{b.classList.toggle('active',b.dataset.skill===id);});\n}\nfunction drawList(){\n const f=$('#algoFamily').value, mode=$('#algoMode').value;\n activeList=ALGOS.filter(s=>(!f||s.task===f)&&(!mode||(mode==='card')===isCard(s))&&searchTerm.split(/\\s+/).every(k=>norm([s.title,s.code,s.concept,s.control,s.cue,s.pitfall,s.params.flat().join(' ')].join(' ')).includes(k)));\n $('#algoList').innerHTML=activeList.map(a=>action((parent.portalSnapshot.marked[a.id]?'✓ ':'')+(isCard(a)?'':a.code+' · ')+a.title,'skill',a.id,'algobtn '+(a.id===activeAlgo?'active':''))).join('')||\"\\u003cp class=\\\"small\\\">No sheet matches the search.\\u003c/p>\";\n}\nfunction openSkill(id){\n const a=ALGOS.find(v=>v.id===id);if(!a)return;\n const contains=activeList.some(v=>v.id===id);\n if(!contains){$('#algoFamily').value='';$('#algoMode').value='';$('#globalSearch').value='';searchTerm='';drawList();}\n showView('algorithmView');showAlgo(id);parent.portalRemember(selected,id);\n}\nfunction noteCard(n){\n const a=domainSkills.find(x=>x.id===n.skill);\n return '\u003carticle class=\"card\" id=\"guide-'+esc(n.id)+'\">'+heading(\"Technical guide · \"+a.code,n.title,a.title)+\n \"\\u003cdiv class=\\\"callout good\\\">\\u003cb>How it works\\u00 [...new Set(ALGOS.map(a=>a.task))].map(t=>'\u003coption value=\"'+esc(t)+'\">'+esc(taskLabel(t))+'\u003c/option>').join('');\n$('#treeOptions').innerHTML=TREES.map(t=>action(t.title,'tree',t.id,'tree-tab')).join('');\n$('#algoFamily').onchange=drawList;\n$('#algoMode').onchange=drawList;\n$('#globalSearch').oninput=e=>{\n searchTerm=norm(e.target.value).trim();\n drawList();showView('algorithmView');\n if(activeList.length&&!activeList.some(a=>a.id===activeAlgo))showAlgo(activeList[0].id);\n};\n$('#printCurrent').onclick=()=>window.print();\n$('#printAll').onclick=()=>{\n $('#printLibrary').innerHTML=domainSkills.map(a=>skillCard(a,true)).join('')+m.notes[selected].map(noteCard).join('');\n document.body.classList.add('print-all');window.print();\n document.body.classList.remove('print-all');\n $('#printLibrary').replaceChildren();\n};\n$('#themeBtn').onclick=()=>parent.portalToggleTheme();\ndocument.addEventListener('click',ev=>{\n const b=ev.target.closest('button');if(!b)return;\n const d=b.dataset;\n if(d.view){showView(d.view);return;}\n if(d.skill){openSkill(d.skill);return;}\n if(d.tree){jumpTree(d.tree);return;}\n if(d.guide){openGuide(d.guide);return;}\n if(d.core){showCore(d.core);return;}\n if(d.lab){parent.portalNavigate('architectures','lab',d.lab);return;}\n if(d.mark){parent.portalMarkSkill(d.mark);showAlgo(d.mark);drawList();}\n});\ndocument.addEventListener('keydown',ev=>{\n if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){\n  ev.preventDefault();parent.portalOpenSearch();return;\n }\n if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))return;\n if(!['ArrowLeft','ArrowRight'].includes(ev.key)||activeView!=='algorithmView'||!activeList.length)return;\n ev.preventDefault();\n const position=activeList.findIndex(a=>a.id===activeAlgo);\n const move=ev.key==='ArrowRight'?1:-1;\n openSkill(activeList[(position+move+activeList.length)%activeList.length].id);\n});\nwindow.portalSectionUpdate=()=>{\n drawList();\n con
