everal accounts. Which service coordinates their application?"],["Security group","Controls network flows of the associated resources with stateful rules.","Access to the database port must be allowed only for the group of application instances. Which mechanism?"]],"notes":null},{"code":"2.4.3","id":"2.4.3","domain":2,"task":"2.4","title":"Defense in depth and subnet access","concept":"Security groups control flows at the interfaces and are stateful. Network ACLs apply at the subnet boundary, can allow and deny, and are stateless. WAF acts on application requests. IAM controls who can use APIs and manage resources.","control":"Decide by reach: resource, subnet, request or identity. In a stateless control, allow the return traffic according to the contract. A security rule in one layer does not widen access when another layer denies it.","pitfall":"Security groups allow traffic through allow rules. Explicitly blocking a range is a feature of Network ACLs when applied to the subnet.","verify":"Given an access to a website, break down the decisions by layer and identify where to show the effect.","decisions":[["Security group","Filters traffic of associated resources with stateful behavior."],["Network ACL","Filters inbound and outbound traffic at the subnet with explicit rules and stateless behavior."],["AWS WAF","Inspects patterns in web requests."],["AWS IAM","Controls API actions according to identity and authorization."]],"docs":[["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"],["AWS Security — services","https://aws.amazon.com/pt/security/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-2.4.3-1","prompt":"The team wants to explicitly deny an entire range on the way into a subnet. The control must operate at the subnet boundary. Which one should it use?","solution":"Network ACL","explanation":"Supports allow and deny rules at subnet scope.","options":[["IAM control over rule creation","Authorizes administrative actions, without applying the desired traffic filter."],["Network ACL","Supports allow and deny rules at subnet scope."],["Security group with a deny rule","Security groups use allow rules and act on the resource."],["AWS WAF for all subnet traffic","Acts on web requests, not on the generic subnet boundary."]]},{"id":"P-2.4.3-2","prompt":"Only the group of application instances may connect to a database port. Responses to allowed connections will not require another matching rule. Which choice?","solution":"The database's security group","explanation":"Controls the resource with stateful behavior and can reference the source group.","options":[["Private DNS resolution","Locates the database, but does not enforce the source and port rule."],["The database's security group","Controls the resource with stateful behavior and can reference the source group."],["Network ACL with connection state","A Network ACL is stateless and does not work through the group association described."],["IAM trust policy","Authorizes assuming a role, without controlling a TCP connection."]]}],"cue":"The control must deny a range at the subnet boundary. Which mechanism?","answer":"Network ACL","use":"Meets the requirement. Filters inbound and outbound traffic at the subnet with explicit rules and stateless behavior.","avoid":"Security groups allow traffic through allow rules. Explicitly blocking a range is a feature of Network ACLs when applied to the subnet.","example":"Given an access to a website, break down the decisions by layer and identify where to show the effect.","detail":[],"legacy":"ficha/2.4.3","params":[["Security group","Filters traffic of associated resources with stateful behavior.","A DB must accept TCP connections only from resources in an application group. Which mechanism?"],["Network ACL","Filters inbound and outbound traffic at the subnet with explicit rules and stateless behavior.","The control must deny a range at the subnet boundary. Which mechanism?"],["AWS WAF","Inspects patterns in web requests.","The rule depends on an HTTP URL parameter, not on the IP or the port. Which control?"],["AWS IAM","Controls API actions according to identity and authorization.","The requirement is to prevent an operator from changing network rules in the console. Which control should be used?"]],"notes":null},{"code":"3.1.1","id":"3.1.1","domain":3,"task":"3.1","title":"Console, CLI, SDK and infrastructure as code","concept":"The console provides a web interface. The CLI performs operations by command or script. SDKs integrate AWS calls into code. CloudFormation defines resources and dependencies declaratively, with stacks and trackable changes.","control":"Assess frequency, repeatability, environment and who will operate it. Compare a one-off task, shell automation, integration in the application and provisioning the entire environment.","pitfall":"The CLI automates actions, but using it does not by itself describe the whole configuration as a declarative state.","verify":"Classify an operational task in each category and identify where to store the definition.","decisions":[["AWS Management Console","Graphical interface for human use and one-off operations."],["AWS CLI","Command interface for interactive routines or scripts."],["AWS SDK","Libraries for calling services from an application's code."],["AWS CloudFormation","Declarative templates and stack lifecycle."]],"docs":[["AWS CloudFormation","https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.1.1-1","prompt":"An analyst is new to AWS and wants to explore resources and their attributes in the browser. The company does not need to automate the lookup yet. Which interface should she use?","solution":"AWS Management Console","explanation":"The web interface lets you browse the services and look up the account's resources.","options":[["AWS Management Console","The web interface lets you browse the services and look up the account's resources."],["AWS CLI","Requires running commands in a terminal."],["AWS SDK for Python","It is a library for application code."],["AWS CloudFormation","Provisions resources from templates."]]},{"id":"P-3.1.1-2","prompt":"A team wants to include networks and roles in a code review and reproduce the environment in another account. It needs to declare resources and dependencies. Which service fits?","solution":"AWS CloudFormation","explanation":"The declarative template describes the resources and the stack tracks their dependencies.","options":[["AWS Systems Manager","Runs operations on managed resources, without representing the stack's entire infrastructure."],["AWS CodeBuild","Compiles and tests code, but does not define the lifecycle of these resources."],["AWS CloudTrail","Records API calls for auditing."],["AWS CloudFormation","The declarative template describes the resources and the stack tracks their dependencies."]]}],"cue":"A professional needs to explore an account's resources through a visual interface. Which method?","answer":"AWS Management Console","use":"Meets the requirement. Graphical interface for human use and one-off operations.","avoid":"The CLI automates actions, but using it does not by itself describe the whole configuration as a declarative state.","example":"Classify an operational task in each category and identify where to store the definition.","detail":[],"legacy":"ficha/3.1.1","params":[["AWS Management Console","Graphical interface for human use and one-off operations.","A professional needs to explore an account's resources through a visual interface. Which method?"],["AWS CLI","Command interface for interactive routines or scripts.","A terminal script lists buckets periodically and runs signed commands. Which interface?"],["AWS SDK","Libraries for calling services from an application's code.","A Java application needs to call an AWS service through an official library. Which interface?"],["AWS CloudFormation","Declarative templates and stack lifecycle.","The infrastructure must be replicated and reviewed as a declarative definition. Which method?"]],"notes":null},{"code":"3.1.2","id":"3.1.2","domain":3,"task":"3.1","title":"Cloud, hybrid and on-premises deployment","concept":"In the cloud, the workload uses the provider's infrastructure. Hybrid integrates on-premises and cloud resources in the same process. On-premises keeps resources on site. Outposts extends compatible AWS services and infrastructure to the customer's facilities, within their operating requirements.","control":"Ask where compute and data run and whether there is operational integration between environments. Latency constraints, legacy dependencies or residency may require an on-premises presence even if other parts migrate.","pitfall":"Using AWS in one Region does not make the architecture hybrid if no operational component remains outside it.","verify":"Trace the path of a transaction, highlighting the environment where the application, the database and operations run.","decisions":[["Cloud-only","The workload's components run on AWS with no on-premises dependencies described."],["Hybrid","On-premises and AWS components operate in an integrated way."],["On-premises","The workload stays on on-premises infrastructure."],["AWS Outposts","Extends AWS infrastructure and compatible services to the customer's site."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-3.1.2-1","prompt":"A factory keeps its orders database in its own data center because operations require it, but its public API already runs on AWS. Every order uses both environments. Which model was adopted?","solution":"Hybrid deployment","explanation":"The architecture integrates on-premises resources and cloud services in the same flow.","options":[["Multi-Region deployment","The description does not require two AWS Regions."],["All-in-cloud deployment","The database would still depend on the data center, outside this definition."],["Fully on-premises deployment","The API processing is on AWS."],["Hybrid deployment","The architecture integrates on-premises resources and cloud services in the same flow."]]},{"id":"P-3.1.2-2","prompt":"The company needs to keep compute on the factory floor and wants to operate compatible AWS services with the same tools used in the Region. Which offering should it evaluate?","solution":"AWS Outposts","explanation":"Brings AWS infrastructure and compatible services to the customer's facilities.","options":[["AWS Outposts","Brings AWS infrastructure and compatible services to the customer's facilities."],["AWS Local Zones","Offer capacity in metropolitan locations operated by AWS."],["Amazon CloudFront","Brings cached content delivery closer, without running the requested local workload."],["AWS Direct Connect","Provides dedicated connectivity, without installing AWS compute in the factory."]]}],"cue":"The API runs on AWS and uses the factory database that remains on premises. Which model?","answer":"Hybrid","use":"Meets the requirement. On-premises and AWS components operate in an integrated way.","avoid":"Using AWS in one Region does not make the architecture hybrid if no operational component remains outside it.","example":"Trace the path of a transaction, highlighting the environment where the application, the database and operations run.","detail":[],"legacy":"ficha/3.1.2","params":[["Cloud-only","The workload's components run on AWS with no on-premises dependencies described.","The application and data run entirely on AWS resources. Which model was described?"],["Hybrid","On-premises and AWS components operate in an integrated way.","The API runs on AWS and uses the factory database that remains on premises. Which model?"],["On-premises","The workload stays on on-premises infrastructure.","Processing and data stay exclusively in the organization's private data center, with no AWS services. Which model?"],["AWS Outposts","Extends AWS infrastructure and compatible services to the customer's site.","The company needs compatible AWS services in its own data center for low local latency. Which option should it evaluate?"]],"notes":null},{"code":"3.2.1","id":"3.2.1","domain":3,"task":"3.2","title":"Regions, zones, edge and geographic criteria","concept":"A Region is a geographic area. An Availability Zone groups one or more data centers isolated from other zones, with low-latency connectivity within the Region. Points of presence deliver edge services. Choosing a Region involves residency, proximity, cost and service availability.","control":"Tolerating a zone failure usually calls for distribution across zones. A regional disaster requires a plan at Region scope. Content close to users can use the edge without moving the primary state.","pitfall":"Using CloudFront does not automatically replicate the database across Regions.","verify":"Explain data location, delivery edge and failure domain separately.","decisions":[["AWS Region","Geographic choice for residency, latency and available services."],["Availability Zone","An isolated failure domain within a Region."],["Edge location","A point of presence that brings delivery services closer to users."],["Multi-Region strategy","Runs or recovers workloads in more than one Region when requirements justify it."]],"docs":[["AWS global infrastructure","https://aws.amazon.com/pt/about-aws/global-infrastructure/"],["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"]],"scenarios":[{"id":"P-3.2.1-1","prompt":"A company is required to select an AWS location in the mandated country for its database's primary data. Which catalog concept identifies this geographic area?","solution":"AWS Region","explanation":"It is the geographic area chosen for regional resources and contains Availability Zones.","options":[["Isolated Availability Zone","It is a subdivision of the Region, usually used after the geography has been chosen."],["Edge location","Serves traffic at the edge and does not identify the deployment area of a regional database."],["Private subnet","Segments addresses and network reach within a VPC."],["AWS Region","It is the geographic area chosen for regional resources and contains Availability Zones."]]},{"id":"P-3.2.1-2","prompt":"A news site keeps its origin in one Region, but wants to serve cached copies to readers on different continents. Which infrastructure serves the cache closest to the user?","solution":"CloudFront edge locations","explanation":"The edge network delivers content from points close to the audience.","options":[["AWS Outposts installations","Extend services to specific customer facilities."],["Subnets in a VPC","Organize internal resources, without distributing a cache to international readers."],["Volumes per Availability Zone","Isolate block storage and are not global delivery points."],["CloudFront edge locations","The edge network delivers content from points close to the audience."]]}],"cue":"A law requires a specific country for storing primary data. Which geographic level should be selected?","answer":"AWS Region","use":"Meets the requirement. Geographic choice for residency, latency and available services.","avoid":"Using CloudFront does not automatically replicate the database across Regions.","example":"Explain data location, delivery edge and failure domain separately.","detail":[],"legacy":"ficha/3.2.1","params":[["AWS Region","Geographic choice for residency, latency and available services.","A law requires a specific country for storing primary data. Which geographic level should be selected?"],["Availability Zone","An isolated failure domain within a Region.","The idea is to separate components so that a localized failure does not take both down within the same Region. Which unit?"],["Edge location","A point of presence that brings delivery services closer to users.","The company wants to deliver cached content close to international users. Which infrastructure?"],["Multi-Region strategy","Runs or recovers workloads in more than one Region when requirements justify it.","The requirement includes a prolonged outage of an entire Region. Which scope should be planned?"]],"notes":null},{"code":"3.3.1","id":"3.3.1","domain":3,"task":"3.3","title":"EC2, Lambda, containers and Fargate","concept":"EC2 provides virtual machine capacity and control of the guest system. Lambda runs event-driven functions within managed limits. ECS and EKS orchestrate containers; Fargate is a managed capacity option compatible with both, depending on the workload and configuration.","control":"Separate the unit of work, responsibility for the host and compatibility. For managed Kubernetes, choose EKS. For containers without managing servers, compare ECS or EKS with Fargate. For control of the OS, EC2. For a short, stateless event, evaluate Lambda.","pitfall":"Fargate is not an orchestrator that replaces ECS or EKS.","verify":"Identify duration, state, need for host access and activation pattern.","decisions":[["Amazon EC2","Virtual machines for workloads that require control of the instance environment."],["AWS Lambda","Managed functions triggered by invocation or events."],["AWS Fargate","Managed compute capacity for containers in compatible integrations."],["Amazon EKS","Managed Kubernetes, with different compute options."]],"docs":[["Compute products","https://aws.amazon.com/pt/products/compute/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.3.1-1","prompt":"A vendor requires a specific Linux version and the installation of an agent that runs as a system service. The team accepts operating the virtual machine. Which service should it use?","solution":"Amazon EC2","explanation":"The instance lets you choose the AMI and manage the guest system.","options":[["AWS Fargate","Runs containers without exposing the underlying host."],["Amazon EC2","The instance lets you choose the AMI and manage the guest system."],["Amazon Aurora","It is a managed database, with no administrative access to the host operating system."],["AWS Lambda","The function model does not offer host administration to install this service."]]},{"id":"P-3.3.1-2","prompt":"When a photo arrives in a bucket, a short routine validates its size. There is no processing outside events and the code does not need persistent processes. Which service should run it?","solution":"AWS Lambda","explanation":"S3 can notify the function, and the team does not need to operate servers for the handler.","options":[["Amazon CloudFront Functions","Runs on CloudFront request and response events, not when objects arrive in the bucket."],["AWS Batch with a dedicated fleet","The requirement does not call for a job queue platform or dedicated capacity."],["Amazon ECS on EC2","Could run a consumer, adding service and node operations for the case described."],["AWS Lambda","S3 can notify the function, and the team does not need to operate servers for the handler."]]}],"cue":"A piece of software requires choosing the OS and installing an agent directly on the guest system. Which choice?","answer":"Amazon EC2","use":"Meets the requirement. Virtual machines for workloads that require control of the instance environment.","avoid":"Fargate is not an orchestrator that replaces ECS or EKS.","example":"Identify duration, state, need for host access and activation pattern.","detail":[],"legacy":"ficha/3.3.1","params":[["Amazon EC2","Virtual machines for workloads that require control of the instance environment.","A piece of software requires choosing the OS and installing an agent directly on the guest system. Which choice?"],["AWS Lambda","Managed functions triggered by invocation or events.","When an object arrives, a short task adjusts its metadata. Which service?"],["AWS Fargate","Managed compute capacity for containers in compatible integrations.","The tasks are already ECS containers and the team does not want to operate nodes. Which capacity?"],["Amazon EKS","Managed Kubernetes, with different compute options.","The team wants to keep its manifests and the Kubernetes API with a managed control plane. Which service?"]],"notes":"3.3.1"},{"code":"3.3.2","id":"3.3.2","domain":3,"task":"3.3","title":"Integrating capacity and traffic in the application","concept":"Auto Scaling adapts the capacity of a group. ELB routes connections to healthy targets. An ALB works with HTTP/HTTPS and can route by application attributes; an NLB works at the transport layer for compatible protocols.","control":"Distinguish growing capacity, routing application traffic, distributing transport and publishing cached content globally. Use health checks and policies calibrated to the requirement.","pitfall":"Installing a load balancer does not change the number of instances without scaling integration.","verify":"Simulate an unhealthy target and a traffic increase; observe which components act.","decisions":[["EC2 Auto Scaling","Adjusts the capacity of a group of instances."],["Application Load Balancer","Balances HTTP traffic and routes by host or path, according to rules."],["Network Load Balancer","Balances transport traffic for protocols such as TCP."],["Amazon CloudFront","Delivers content globally through an edge distribution."]],"docs":[["Compute products","https://aws.amazon.com/pt/products/compute/"],["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-3.3.2-1","prompt":"An EC2 group becomes saturated at peak every morning. The load balancer already distributes connections, but the group must increase and decrease the number of instances according to demand. What should be configured?","solution":"Amazon EC2 Auto Scaling","explanation":"Manages the desired capacity and adds or removes instances by policy.","options":[["Amazon Route 53 failover","Can change DNS responses based on health, without launching instances."],["Application Load Balancer","Distributes requests across targets, without defining the size of the group."],["AWS CloudFormation change sets","Show proposed infrastructure changes, without scaling on a metric."],["Amazon EC2 Auto Scaling","Manages the desired capacity and adds or removes instances by policy."]]},{"id":"P-3.3.2-2","prompt":"The application uses the same domain for payments and orders. The load balancer must send each HTTP path to a different target group. Which one should be chosen?","solution":"Application Load Balancer","explanation":"Supports URL path-based routing at the application layer.","options":[["Gateway Load Balancer","Integrates network appliances, without offering path-based application routing."],["Weighted routing in Route 53","Applies to DNS queries, whose content does not include the URL path."],["Application Load Balancer","Supports URL path-based routing at the application layer."],["Network Load Balancer","Balances at the transport level, without inspecting the HTTP path to choose the target."]]}],"cue":"A group must increase and decrease the number of EC2 instances based on demand. Which component?","answer":"EC2 Auto Scaling","use":"Meets the requirement. Adjusts the capacity of a group of instances.","avoid":"Installing a load balancer does not change the number of instances without scaling integration.","example":"Simulate an unhealthy target and a traffic increase; observe which components act.","detail":[],"legacy":"ficha/3.3.2","params":[["EC2 Auto Scaling","Adjusts the capacity of a group of instances.","A group must increase and decrease the number of EC2 instances based on demand. Which component?"],["Application Load Balancer","Balances HTTP traffic and routes by host or path, according to rules.","The front end needs to send /payments and /orders to different targets. Which type of load balancer?"],["Network Load Balancer","Balances transport traffic for protocols such as TCP.","The service is TCP and needs transport-layer load balancing. Which option?"],["Amazon CloudFront","Delivers content globally through an edge distribution.","The central requirement is to cache static content close to users. Which service?"]],"notes":null},{"code":"3.4.1","id":"3.4.1","domain":3,"task":"3.4","title":"RDS, Aurora, DynamoDB and Redshift","concept":"Amazon RDS hosts managed relational engines. Aurora is a relational engine offered by AWS, compatible with MySQL or PostgreSQL depending on the edition. DynamoDB is a key-value/document NoSQL database. Redshift is an analytical data warehouse. The access pattern comes before the choice.","control":"Distinguish transactions with SQL and joins, key lookups at scale, an analytical warehouse and a cache. Consider compatibility with the engine and driver, volume per access, concurrency and maintenance.","pitfall":"Having SQL does not turn every relational database into a warehouse optimized for analytical aggregations.","verify":"Compare key-based access, related updates and analytical queries over a large history.","decisions":[["Amazon RDS","Managed relational database with compatible engines."],["Amazon Aurora","AWS relational engine compatible with MySQL or PostgreSQL."],["Amazon DynamoDB","Managed NoSQL database designed for key-based access patterns."],["Amazon Redshift","Warehouse for analytics and aggregations at scale."]],"docs":[["AWS databases","https://aws.amazon.com/pt/products/databases/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.4.1-1","prompt":"A marketplace needs to read carts by customer ID with a large volume of requests. Attributes can vary and access does not depend on relational joins. Which database fits best?","solution":"Amazon DynamoDB","explanation":"It is a key-value and document database with reads organized by key.","options":[["Amazon Neptune","It is graph-oriented, for traversing relationships."],["Amazon Redshift","Focuses on high-volume analytical queries; it is not the natural choice for operational carts by key."],["Amazon RDS for PostgreSQL","Offers a relational database, without meeting the scenario's choice of a managed key-value model."],["Amazon DynamoDB","It is a key-value and document database with reads organized by key."]]},{"id":"P-3.4.1-2","prompt":"A third-party application is certified only for Microsoft SQL Server. The team wants to automate backups and delegate routine maintenance of the database instance. Which service offers a compatible engine?","solution":"Amazon RDS for SQL Server","explanation":"It is a managed option that offers the Microsoft SQL Server engine.","options":[["Amazon DynamoDB","Does not provide the required engine or relational interface."],["Amazon RDS for SQL Server","It is a managed option that offers the Microsoft SQL Server engine."],["SQL Server on EC2","Preserves compatibility, with database management left to the team."],["Amazon Aurora PostgreSQL","Uses PostgreSQL compatibility, not SQL Server."]]}],"cue":"The application queries carts mainly by customer ID, with predictable key-based access. Which service?","answer":"Amazon DynamoDB","use":"Meets the requirement. Managed NoSQL database designed for key-based access patterns.","avoid":"Having SQL does not turn every relational database into a warehouse optimized for analytical aggregations.","example":"Compare key-based access, related updates and analytical queries over a large history.","detail":[],"legacy":"ficha/3.4.1","params":[["Amazon RDS","Managed relational database with compatible engines.","The team wants to host a SQL Server database in a compatible managed relational service. Which service?"],["Amazon Aurora","AWS relational engine compatible with MySQL or PostgreSQL.","The requirement explicitly identifies the relational engine developed by AWS with PostgreSQL compatibility. Which one?"],["Amazon DynamoDB","Managed NoSQL database designed for key-based access patterns.","The application queries carts mainly by customer ID, with predictable key-based access. Which service?"],["Amazon Redshift","Warehouse for analytics and aggregations at scale.","Analysts aggregate several years of facts for BI and need a warehouse. Which one?"]],"notes":null},{"code":"3.4.2","id":"3.4.2","domain":3,"task":"3.4","title":"Database migration, schema conversion and caching","concept":"DMS moves data and changes from compatible sources. DMS Schema Conversion helps assess and convert database schema and code in eligible heterogeneous migrations. ElastiCache keeps data in memory to speed up access. RDS provides the managed environment for the target database when appropriate.","control":"Separate moving data, converting structure, operating the target and accelerating reads. Changing engines adds compatibility of types, SQL and procedural code. Compare result validation and the cutover plan.","pitfall":"A migration with CDC does not automatically guarantee that stored procedures work on the new engine.","verify":"In an Oracle → PostgreSQL migration, classify the assessment, conversion, load, CDC and serving tasks.","decisions":[["AWS Database Migration Service","Moves data and can replicate changes between compatible sources and targets."],["DMS Schema Conversion","Assesses and helps convert objects and code between compatible engines."],["Amazon ElastiCache","Managed in-memory cache to speed up eligible read patterns."],["Amazon RDS","Provides managed relational engines to serve the workload."]],"docs":[["AWS databases","https://aws.amazon.com/pt/products/databases/"],["Migration strategies","https://docs.aws.amazon.com/pt_br/prescriptive-guidance/latest/large-migration-guide/migration-strategies.html"]],"scenarios":[{"id":"P-3.4.2-1","prompt":"The source database will remain available for writes during the migration. The target must receive an initial load and the changes up to cutover. Which service covers both phases?","solution":"AWS Database Migration Service","explanation":"DMS can perform a full load and change data capture for supported sources and targets.","options":[["AWS DataSync","Transfers files and objects, without interpreting the relational transaction log."],["AWS Backup","Manages protection and restore points, without continuous logical replication to the target described."],["AWS Database Migration Service","DMS can perform a full load and change data capture for supported sources and targets."],["AWS Application Migration Service","Replicates servers for infrastructure migration; it is not the specific tool for CDC between databases."]]},{"id":"P-3.4.2-2","prompt":"Before moving an Oracle database to PostgreSQL, the team wants to assess the types, procedures and objects that will need manual adaptation. Which capability helps in this phase?","solution":"DMS Schema Conversion","explanation":"Assesses and converts schemas and compatible code in heterogeneous migrations.","options":[["CDC replication in AWS DMS","Transfers data changes, without resolving the incompatibility of schema objects by itself."],["DMS Schema Conversion","Assesses and converts schemas and compatible code in heterogeneous migrations."],["AWS DataSync Discovery","Helps assess storage and file movement, without analyzing SQL procedures."],["AWS Backup Audit Manager","Assesses backup controls, not conversion between engines."]]}],"cue":"Tables must be copied while continuing to capture changes as the source stays active. Which service?","answer":"AWS Database Migration Service","use":"Meets the requirement. Moves data and can replicate changes between compatible sources and targets.","avoid":"A migration with CDC does not automatically guarantee that stored procedures work on the new engine.","example":"In an Oracle → PostgreSQL migration, classify the assessment, conversion, load, CDC and serving tasks.","detail":[],"legacy":"ficha/3.4.2","params":[["AWS Database Migration Service","Moves data and can replicate changes between compatible sources and targets.","Tables must be copied while continuing to capture changes as the source stays active. Which service?"],["DMS Schema Conversion","Assesses and helps convert objects and code between compatible engines.","A team needs to identify incompatible SQL objects when changing engines. Which feature?"],["Amazon ElastiCache","Managed in-memory cache to speed up eligible read patterns.","The application repeats session reads and wants to reduce pressure on the primary database. Which service?"],["Amazon RDS","Provides managed relational engines to serve the workload.","The migration is finished and the requirement is to operate the managed relational database at the destination. Which one?"]],"notes":null},{"code":"3.5.1","id":"3.5.1","domain":3,"task":"3.5","title":"VPC, DNS and global content delivery","concept":"A VPC is an isolated virtual network divided into subnets. Route 53 provides DNS and DNS routing policies. CloudFront delivers content from the edge, with caching according to configuration. Global Accelerator uses the AWS global network to accelerate TCP/UDP traffic and offer static IPs for compatible endpoints.","control":"Separate address space, name resolution, HTTP delivery and transport path. The requirement for a fixed IP or for caching distinguishes strategies that look similar.","pitfall":"Changing DNS can influence where traffic goes. It does not cache content.","verify":"Trace an access from the DNS name to the IP and then to the application endpoint.","decisions":[["Amazon VPC","Provides an isolated virtual network and subnet controls."],["Amazon Route 53","Resolves domains and applies DNS routing policies."],["Amazon CloudFront","Distributes web content from the edge with caching options."],["AWS Global Accelerator","Uses static IP addresses and the global network for compatible TCP/UDP traffic."]],"docs":[["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"],["AWS global infrastructure","https://aws.amazon.com/pt/about-aws/global-infrastructure/"]],"scenarios":[{"id":"P-3.5.1-1","prompt":"The application needs its own addressing, public and private subnets, and separate routes. Which service establishes the network boundary for these requirements?","solution":"Amazon VPC","explanation":"Defines the virtual network, ranges, subnets and route tables.","options":[["AWS Transit Gateway","Connects existing networks, without creating the application's subnets."],["Amazon Route 53","Resolves names through DNS and does not manage subnet addressing."],["Amazon VPC","Defines the virtual network, ranges, subnets and route tables."],["AWS PrivateLink","Provides private connectivity to services, without defining the entire virtual network."]]},{"id":"P-3.5.1-2","prompt":"A website will point its domain to a new load balancer. The team needs to edit the public DNS records and keep the zone managed on AWS. Which service should it use?","solution":"Amazon Route 53","explanation":"The public hosted zone provides DNS records for the domain.","options":[["Elastic Load Balancing","Receives application traffic, without managing the domain's public zone."],["AWS Certificate Manager","Issues or manages certificates; it is not the DNS hosting service."],["Amazon Route 53","The public hosted zone provides DNS records for the domain."],["Amazon VPC IP Address Manager","Plans IP blocks, without publishing DNS records on the internet."]]}],"cue":"The team needs to create public and private subnets in an isolated network. Which service?","answer":"Amazon VPC","use":"Meets the requirement. Provides an isolated virtual network and subnet controls.","avoid":"Changing DNS can influence where traffic goes. It does not cache content.","example":"Trace an access from the DNS name to the IP and then to the application endpoint.","detail":[],"legacy":"ficha/3.5.1","params":[["Amazon VPC","Provides an isolated virtual network and subnet controls.","The team needs to create public and private subnets in an isolated network. Which service?"],["Amazon Route 53","Resolves domains and applies DNS routing policies.","The team needs to manage the records of an application domain. Which service?"],["Amazon CloudFront","Distributes web content from the edge with caching options.","A publisher wants the site's images to be served from a cache close to readers. Which service?"],["AWS Global Accelerator","Uses static IP addresses and the global network for compatible TCP/UDP traffic.","Partners require fixed IPs and the TCP traffic must take advantage of the AWS global backbone. Which product?"]],"notes":null},{"code":"3.5.2","id":"3.5.2","domain":3,"task":"3.5","title":"Hybrid connectivity and network egress","concept":"Site-to-Site VPN establishes IPsec tunnels. Direct Connect provides a dedicated connection from the environment to AWS, with encryption handled according to the design. A public NAT gateway lets resources in private subnets reach the internet without accepting connections initiated from the internet. VPC endpoints offer private paths to compatible services.","control":"Choose by source, destination and whether the public internet must be relied upon. Distinguish office-to-cloud connectivity from private access to an AWS service.","pitfall":"Direct Connect does not automatically encrypt all traffic.","verify":"Describe the paths to the AWS API, to the office and for downloading patches from the internet.","decisions":[["AWS Site-to-Site VPN","Connects networks with IPsec tunnels."],["AWS Direct Connect","Provides dedicated, predictable connectivity to AWS."],["Public NAT gateway","Lets private instances initiate traffic to internet destinations."],["VPC endpoint","Provides a private path to compatible services."]],"docs":[["Networking and content delivery","https://aws.amazon.com/pt/products/networking/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.5.2-1","prompt":"A company wants to connect the branch office network to the VPC with IPsec tunnels. It already has internet access and a compatible gateway device. Which service should it configure?","solution":"AWS Site-to-Site VPN","explanation":"Uses encrypted IPsec tunnels between the customer network and the gateway on AWS.","options":[["VPC peering","Connects compatible VPCs, without terminating a tunnel from the data center."],["AWS Direct Connect without VPN","The dedicated connection does not provide the required IPsec tunnel by itself."],["AWS Client VPN","It suits remote user access, which is different from connecting the branch network to the VPC."],["AWS Site-to-Site VPN","Uses encrypted IPsec tunnels between the customer network and the gateway on AWS."]]},{"id":"P-3.5.2-2","prompt":"The infrastructure team wants a dedicated private connection from its data center to AWS. The company accepts hiring a connectivity partner and planning the installation lead time. Which offering fits?","solution":"AWS Direct Connect","explanation":"Creates a dedicated connection with virtual interfaces to compatible destinations.","options":[["Amazon CloudFront","Distributes content and does not physically connect the data center to AWS."],["AWS Direct Connect","Creates a dedicated connection with virtual interfaces to compatible destinations."],["AWS Network Firewall","Inspects traffic and does not provision physical connectivity."],["AWS Site-to-Site VPN over the internet","Provides encryption over the public internet, without the requested dedicated circuit."]]}],"cue":"A branch office needs encrypted communication through an IPsec tunnel between networks. Which option?","answer":"AWS Site-to-Site VPN","use":"Meets the requirement. Connects networks with IPsec tunnels.","avoid":"Direct Connect does not automatically encrypt all traffic.","example":"Describe the paths to the AWS API, to the office and for downloading patches from the internet.","detail":[],"legacy":"ficha/3.5.2","params":[["AWS Site-to-Site VPN","Connects networks with IPsec tunnels.","A branch office needs encrypted communication through an IPsec tunnel between networks. Which option?"],["AWS Direct Connect","Provides dedicated, predictable connectivity to AWS.","The data center requires a long-term dedicated connection to AWS. Which option?"],["Public NAT gateway","Lets private instances initiate traffic to internet destinations.","Private instances need to download patches from the internet without accepting externally initiated connections. Which component?"],["VPC endpoint","Provides a private path to compatible services.","The company wants to call a compatible AWS service from the VPC without going over the internet. Which feature?"]],"notes":null},{"code":"3.6.1","id":"3.6.1","domain":3,"task":"3.6","title":"S3, EBS, EFS and FSx by access interface","concept":"S3 is object storage with its own APIs. EBS is block storage for EC2 instances. EFS offers an elastic NFS file system for compatible clients. FSx offers managed file systems, such as Windows File Server, Lustre, OpenZFS and ONTAP, with different roles.","control":"Decide first by the required interface: object, block, shared Linux file or a specific file system. Only then evaluate capacity, latency, throughput and cost.","pitfall":"Using S3 as the destination of a data lake does not make it a block volume for installing an EC2 operating system.","verify":"Identify the protocol and sharing pattern before choosing the storage class.","decisions":[["Amazon S3","Stores objects in buckets and serves applications that use the object API."],["Amazon EBS","Provides block volumes for compatible EC2 instances."],["Amazon EFS","Managed, elastic NFS file system for sharing."],["Amazon FSx for Windows File Server","Managed Windows file system over SMB."]],"docs":[["AWS storage","https://aws.amazon.com/pt/products/storage/"],["S3 storage classes","https://aws.amazon.com/pt/s3/storage-classes/"]],"scenarios":[{"id":"P-3.6.1-1","prompt":"An application stores photos in an object namespace. Each photo is retrieved by key and the application uses a managed HTTP API. Which storage should be selected?","solution":"Amazon S3","explanation":"Implements buckets and key-based access to objects.","options":[["Amazon EBS","Exposes block devices to instances, outside the object API model."],["Amazon EFS","Presents directories and files over NFS."],["Amazon S3","Implements buckets and key-based access to objects."],["Amazon FSx for Windows File Server","Offers Windows-compatible SMB shares."]]},{"id":"P-3.6.1-2","prompt":"An EBS-backed AMI needs a persistent boot disk for the EC2 instance. The storage must appear as a block device. Which service should be used?","solution":"Amazon EBS","explanation":"Provides block volumes compatible with booting an EC2 instance.","options":[["Amazon EFS","It is mounted as a shared file system, without providing the EBS boot disk."],["Amazon EBS","Provides block volumes compatible with booting an EC2 instance."],["Amazon FSx for Lustre","Provides a file system aimed at high-performance processing, not the requested root volume."],["Amazon S3 Standard","Implements object storage, without exposing the root volume."]]}],"cue":"The system writes images as objects and accesses them by key in a bucket. Which service?","answer":"Amazon S3","use":"Meets the requirement. Stores objects in buckets and serves applications that use the object API.","avoid":"Using S3 as the destination of a data lake does not make it a block volume for installing an EC2 operating system.","example":"Identify the protocol and sharing pattern before choosing the storage class.","detail":[],"legacy":"ficha/3.6.1","params":[["Amazon S3","Stores objects in buckets and serves applications that use the object API.","The system writes images as objects and accesses them by key in a bucket. Which service?"],["Amazon EBS","Provides block volumes for compatible EC2 instances.","A block boot volume is needed for an EC2 instance. Which one?"],["Amazon EFS","Managed, elastic NFS file system for sharing.","Several Linux instances mount the same shared directory over NFS. Which service?"],["Amazon FSx for Windows File Server","Managed Windows file system over SMB.","Windows applications need a managed SMB share. Which product?"]],"notes":null},{"code":"3.6.2","id":"3.6.2","domain":3,"task":"3.6","title":"S3 classes, archiving, backup and retention","concept":"S3 Standard serves frequent access. Standard-IA keeps fast access with storage and retrieval conditions. Intelligent-Tiering moves objects between tiers suited to the observed pattern, with costs and eligibility rules. Glacier Deep Archive serves long-term archiving with planned retrieval.","control":"Compare frequency, tolerated retrieval time, transition costs, redundancy and the applicable minimum duration. Lifecycle automates transitions and expiration. Versioning preserves versions according to policy and interacts with expiration.","pitfall":"Storage price per GB alone does not account for access, retrieval, requests or minimum duration.","verify":"Build a matrix for hot, cold, unpredictable and data archived for years.","decisions":[["S3 Standard","For frequently accessed data with low latency."],["S3 Standard-IA","For infrequently accessed data that still requires immediate retrieval."],["S3 Intelligent-Tiering","For data whose access is unknown or changes over time."],["S3 Glacier Deep Archive","For long retention with rare access and restores that can tolerate waiting."]],"docs":[["S3 storage classes","https://aws.amazon.com/pt/s3/storage-classes/"],["AWS storage","https://aws.amazon.com/pt/products/storage/"]],"scenarios":[{"id":"P-3.6.2-1","prompt":"The same collection alternates between months with read peaks and months with almost no access. The team wants to automate tier changes based on observed usage. Which class offers this?","solution":"S3 Intelligent-Tiering","explanation":"Moves eligible objects between tiers according to access patterns, with its own monitoring rules.","options":[["S3 Standard-IA","It is a specific class with a retrieval fee, without switching automatically based on access."],["S3 One Zone-IA","Stores data in a single AZ and does not adjust tiers automatically."],["S3 Intelligent-Tiering","Moves eligible objects between tiers according to access patterns, with its own monitoring rules."],["S3 Glacier Deep Archive","Prioritizes archiving and requires a restore before reading."]]},{"id":"P-3.6.2-2","prompt":"Regulatory documents must remain available for occasional restores for many years. Access is rare, storage cost matters most and the team accepts waiting up to 48 hours. Which class should be chosen?","solution":"S3 Glacier Deep Archive","explanation":"It was designed for long retention with restores in hours, suited to the accepted time frame.","options":[["S3 One Zone-IA","Has lower zonal resilience and immediate access, without offering the cost profile of deep archiving."],["S3 Glacier Instant Retrieval","Provides direct access in milliseconds, which is not needed in this lowest-storage-cost scenario."],["S3 Glacier Deep Archive","It was designed for long retention with restores in hours, suited to the accepted time frame."],["S3 Standard","Prioritizes frequent, immediate access, without taking advantage of the archive profile."]]}],"cue":"The access pattern is unpredictable and the company wants automatic adjustment based on observed activity. Which class?","answer":"S3 Intelligent-Tiering","use":"Meets the requirement. For data whose access is unknown or changes over time.","avoid":"Storage price per GB alone does not account for access, retrieval, requests or minimum duration.","example":"Build a matrix for hot, cold, unpredictable and data archived for years.","detail":[],"legacy":"ficha/3.6.2","params":[["S3 Standard","For frequently accessed data with low latency.","The application serves heavily accessed objects and needs low latency day to day. Which class?"],["S3 Standard-IA","For infrequently accessed data that still requires immediate retrieval.","Reads are infrequent, but any object must be readily accessible when needed. Which class?"],["S3 Intelligent-Tiering","For data whose access is unknown or changes over time.","The access pattern is unpredictable and the company wants automatic adjustment based on observed activity. Which class?"],["S3 Glacier Deep Archive","For long retention with rare access and restores that can tolerate waiting.","Regulatory records go years without being read and a restore can take hours. Which class?"]],"notes":null},{"code":"3.7.1","id":"3.7.1","domain":3,"task":"3.7","title":"Analytics: Athena, Glue, Redshift and visualization","concept":"Athena queries data with SQL without managing servers, often in S3. AWS Glue offers integration, a catalog and ETL depending on the component. Redshift provides a data warehouse for analytics. The BI layer presents data to users in analyses and dashboards.","control":"Identify whether the step queries the lake, transforms and catalogs, serves queries in a warehouse or presents the information. Consider recurrence, sources, cost per query and access patterns.","pitfall":"Visualization and distributed transformation address different steps of the same architecture.","verify":"Follow a report from raw files through processing, query execution and presentation.","decisions":[["Amazon Athena","Runs serverless SQL over data in the lake and compatible sources."],["AWS Glue","Provides integration, ETL and catalog engines."],["Amazon Redshift","Provides a data warehouse for large-scale analytics."],["BI layer, such as Amazon QuickSight","Presents dashboards and analyses to consumers."]],"docs":[["AWS analytics services","https://aws.amazon.com/pt/big-data/datalakes-and-analytics/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.7.1-1","prompt":"Analysts need to investigate Parquet data already in S3 from time to time. They want to run SQL directly on the storage without maintaining a warehouse. Which tool fits?","solution":"Amazon Athena","explanation":"Runs SQL on data in S3 without provisioning warehouse capacity for the scenario.","options":[["Provisioned Amazon Redshift","Keeps warehouse capacity, which the team wants to avoid."],["Amazon Athena","Runs SQL on data in S3 without provisioning warehouse capacity for the scenario."],["Amazon EMR on EC2","Would require configuring capacity for the chosen processing engine."],["Amazon QuickSight alone","Creates visualizations and uses data sources, without replacing the requested ad hoc query engine."]]},{"id":"P-3.7.1-2","prompt":"Files from new sources need to be cataloged and transformed in a managed ETL step. The team wants a crawler and job execution in the same service. Which one should it use?","solution":"AWS Glue","explanation":"Offers crawlers, the Data Catalog and data integration jobs.","options":[["Amazon Athena","Queries cataloged data with SQL, without offering the requested crawler."],["Amazon OpenSearch Service","Indexes and searches documents, outside the general ETL and cataloging flow."],["AWS Database Migration Service","It is geared to database migration and does not offer the requested crawler and transformation job."],["AWS Glue","Offers crawlers, the Data Catalog and data integration jobs."]]}],"cue":"Analysts want to query Parquet files in S3 with SQL, without provisioning a warehouse. Which tool?","answer":"Amazon Athena","use":"Meets the requirement. Runs serverless SQL over data in the lake and compatible sources.","avoid":"Visualization and distributed transformation address different steps of the same architecture.","example":"Follow a report from raw files through processing, query execution and presentation.","detail":[],"legacy":"ficha/3.7.1","params":[["Amazon Athena","Runs serverless SQL over data in the lake and compatible sources.","Analysts want to query Parquet files in S3 with SQL, without provisioning a warehouse. Which tool?"],["AWS Glue","Provides integration, ETL and catalog engines.","The step needs to discover metadata and run managed integration. Which service?"],["Amazon Redshift","Provides a data warehouse for large-scale analytics.","The requirement is to operate an analytical warehouse for large structured datasets and frequent reports. Which one?"],["BI layer, such as Amazon QuickSight","Presents dashboards and analyses to consumers.","The data is already queryable and the requirement is to give managers interactive charts. Which layer?"]],"notes":null},{"code":"3.7.2","id":"3.7.2","domain":3,"task":"3.7","title":"Managed AI and choosing by task type","concept":"Comprehend extracts signals from text with NLP. Textract extracts text and structure from documents. Rekognition analyzes images and video in supported tasks. SageMaker AI serves the development and use of ML models with more control. Bedrock offers access to managed foundation models and their tools.","control":"Associate the input data with the expected result. When a pre-built API meets the requirement, it reduces training work. When the goal is GenAI, evaluate foundation models and the limits of the context.","pitfall":"A vision API does not automatically replace structured form extraction.","verify":"Distinguish an image of an object, a scanned form and a text that needs classification.","decisions":[["Amazon Textract","Extracts text and structures such as tables and fields from supported documents."],["Amazon Rekognition","Analyzes images or video in compatible recognition tasks."],["Amazon Comprehend","Applies natural language analysis to text."],["Amazon Bedrock","Offers managed foundation models and features for generative applications."]],"docs":[["AWS artificial intelligence","https://aws.amazon.com/pt/ai/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.7.2-1","prompt":"An insurer receives scanned forms. It needs to extract the pairing between each question label and the value filled in, with little operational effort. Which service should it evaluate?","solution":"Amazon Textract","explanation":"Can extract key-value pairs from forms in scanned documents.","options":[["Amazon Rekognition DetectText","Recognizes text in images, without offering the requested structured extraction of form pairs."],["Amazon Textract","Can extract key-value pairs from forms in scanned documents."],["Amazon Polly","Synthesizes speech from text."],["Amazon Translate","Translates text that is already available, without interpreting the document's fields."]]},{"id":"P-3.7.2-2","prompt":"A visual catalog needs to identify common objects in photographs, such as bicycles and dogs. The company prefers a pre-trained API. Which service should it use?","solution":"Amazon Rekognition","explanation":"Label detection identifies objects and visual concepts in photographs.","options":[["Amazon Textract","It is aimed at extracting information from documents."],["Amazon Rekognition","Label detection identifies objects and visual concepts in photographs."],["Amazon Comprehend","Applies analysis to text, outside the image input described."],["Amazon Transcribe","Processes audio to produce text."]]}],"cue":"The company wants to extract field values from scanned forms. Which service?","answer":"Amazon Textract","use":"Meets the requirement. Extracts text and structures such as tables and fields from supported documents.","avoid":"A vision API does not automatically replace structured form extraction.","example":"Distinguish an image of an object, a scanned form and a text that needs classification.","detail":[],"legacy":"ficha/3.7.2","params":[["Amazon Textract","Extracts text and structures such as tables and fields from supported documents.","The company wants to extract field values from scanned forms. Which service?"],["Amazon Rekognition","Analyzes images or video in compatible recognition tasks.","The problem is classifying objects in photographs, without form OCR. Which service?"],["Amazon Comprehend","Applies natural language analysis to text.","A team wants to identify sentiment in text comments without training a model. Which one?"],["Amazon Bedrock","Offers managed foundation models and features for generative applications.","The requirement is to generate summaries with foundation models through a managed API. Which service?"]],"notes":null},{"code":"3.8.1","id":"3.8.1","domain":3,"task":"3.8","title":"Integration services: queues, topics, events and workflows","concept":"SQS provides queues; SNS distributes messages to subscribers; EventBridge routes events according to rules; Step Functions orchestrates steps and states. The delivery contract defines which component is central.","control":"If the problem is orchestration, check sequence, state, errors and retries. If it is integration, check whether it needs buffering, fan-out or content-based selection.","pitfall":"A queue can hold pending work and still not represent the workflow logic.","verify":"Compare the role of the four services in the same order and shipping process.","decisions":[["Amazon SQS","A queue to hold work until it is consumed."],["Amazon SNS","A topic for distribution to multiple subscribers."],["Amazon EventBridge","Rule-based event routing, with integrated targets."],["AWS Step Functions","Orchestration of steps with state and branching."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-3.8.1-1","prompt":"An order needs to validate data, charge and insert the record in order. If validation fails, it must go to an alternative step, with an execution history. Which service models this?","solution":"AWS Step Functions","explanation":"A state machine describes the sequence, decisions and error handling between tasks.","options":[["Amazon EventBridge","Routes events, without keeping the flow's state per order on its own."],["Amazon SNS","Publishes notifications, without defining the order and state of dependent steps."],["AWS Step Functions","A state machine describes the sequence, decisions and error handling between tasks."],["Amazon SQS","Stores messages temporarily, without modeling workflow decisions."]]},{"id":"P-3.8.1-2","prompt":"Several applications publish events. Only events whose business field meets a rule should be sent to certain targets. Which service should be used as the bus?","solution":"Amazon EventBridge","explanation":"Bus rules filter the event envelope and send it to the defined targets.","options":[["Amazon EventBridge","Bus rules filter the event envelope and send it to the defined targets."],["AWS Step Functions","Orchestrates the steps of one execution; it is not the shared bus needed."],["Amazon CloudWatch Logs","Collects and searches logs; bus rules are the capability being sought."],["AWS CloudTrail","Records activity for auditing and is not the general business event router requested."]]}],"cue":"A process needs steps run in order, with different paths after a validation. Which service?","answer":"AWS Step Functions","use":"Meets the requirement. Orchestration of steps with state and branching.","avoid":"A queue can hold pending work and still not represent the workflow logic.","example":"Compare the role of the four services in the same order and shipping process.","detail":[],"legacy":"ficha/3.8.1","params":[["Amazon SQS","A queue to hold work until it is consumed.","A consumer step must process messages later and at its own pace. Which service?"],["Amazon SNS","A topic for distribution to multiple subscribers.","The same message must be published to multiple subscribers with a single publish. Which service?"],["Amazon EventBridge","Rule-based event routing, with integrated targets.","The requirement is to route events from several sources based on their fields. Which service?"],["AWS Step Functions","Orchestration of steps with state and branching.","A process needs steps run in order, with different paths after a validation. Which service?"]],"notes":null},{"code":"3.8.2","id":"3.8.2","domain":3,"task":"3.8","title":"Operational tools and services by function","concept":"AWS Systems Manager brings together operational capabilities, such as managing configured resources and running supported tasks remotely. AWS Health reports events that affect the account's services or resources. AWS Trusted Advisor recommends improvements based on the available checks. AWS Backup centralizes backup policies for eligible resources.","control":"Distinguish running the action, getting visibility into an event, reviewing recommendations and centralizing backups. Confirm the resource configuration, the account permissions and the eligibility for each integration.","pitfall":"A Trusted Advisor recommendation does not apply the fix by itself.","verify":"Decide which action follows each piece of evidence: an account event, a cost recommendation, a fleet task and backup retention.","decisions":[["AWS Systems Manager","Provides fleet operations features and runs supported actions."],["AWS Health","Shows service events or resource events relevant to the account."],["AWS Trusted Advisor","Offers recommendations through supported checks."],["AWS Backup","Orchestrates policies and central management of backups of eligible resources."]],"docs":[["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"],["AWS Health","https://docs.aws.amazon.com/pt_br/health/latest/ug/what-is-aws-health.html"],["AWS Trusted Advisor","https://aws.amazon.com/pt/premiumsupport/technology/trusted-advisor/"]],"scenarios":[{"id":"P-3.8.2-1","prompt":"The team wants to run an inventory command on dozens of instances already registered as managed nodes. It wants to review the result centrally. Which tool should it use?","solution":"AWS Systems Manager Run Command","explanation":"Runs commands on managed nodes and shows status and output according to the configuration.","options":[["AWS Resource Groups Tag Editor","Makes it easier to find and tag resources, without running the command."],["AWS CloudTrail Lake","Queries the account's activity records, without running commands on the operating system."],["AWS Systems Manager Run Command","Runs commands on managed nodes and shows status and output according to the configuration."],["AWS Health Dashboard","Shows the impact of AWS events, without operating the company's fleet."]]},{"id":"P-3.8.2-2","prompt":"The company wants to apply retention policies to supported volumes and databases, with visibility of backup jobs in a central service. Which one should it choose?","solution":"AWS Backup","explanation":"Organizes plans, schedules, retention and backups for supported services.","options":[["Amazon Inspector","Analyzes vulnerabilities in supported resources, without managing backups."],["Amazon S3 Replication","Replicates objects across buckets and does not replace a central plan for databases and volumes."],["AWS Config","Evaluates configuration and compliance, without creating the requested recovery points."],["AWS Backup","Organizes plans, schedules, retention and backups for supported services."]]}],"cue":"The operator needs to run a task on a configured, managed fleet. Which service?","answer":"AWS Systems Manager","use":"Meets the requirement. Provides fleet operations features and runs supported actions.","avoid":"A Trusted Advisor recommendation does not apply the fix by itself.","example":"Decide which action follows each piece of evidence: an account event, a cost recommendation, a fleet task and backup retention.","detail":[],"legacy":"ficha/3.8.2","params":[["AWS Systems Manager","Provides fleet operations features and runs supported actions.","The operator needs to run a task on a configured, managed fleet. Which service?"],["AWS Health","Shows service events or resource events relevant to the account.","The team wants to know which of the account's resources are affected by maintenance announced by AWS. Which service?"],["AWS Trusted Advisor","Offers recommendations through supported checks.","The company wants recommendations on cost opportunities and on supported best-practice checks. Which tool?"],["AWS Backup","Orchestrates policies and central management of backups of eligible resources.","An organization needs to centralize backup plans and retention for supported services. Which one?"]],"notes":null},{"code":"3.8.3","id":"3.8.3","domain":3,"task":"3.8","title":"Development tools and continuous delivery","concept":"CodeBuild compiles and tests code in a managed environment. CodePipeline orchestrates the stages of delivery. CodeDeploy automates application deployment to compatible targets. CloudFormation defines and operates declarative infrastructure stacks.","control":"Distinguish the build action, the delivery graph, the application rollout and the resource definition. A pipeline can call other services instead of implementing each step.","pitfall":"CodePipeline organizes stages, but a build stage needs a build executor or a compatible integration.","verify":"Draw commit, tests, approval, infrastructure and deploy as separate actions.","decisions":[["AWS CodeBuild","Runs build and test activities."],["AWS CodePipeline","Orchestrates a delivery flow with stages and actions."],["AWS CodeDeploy","Automates application deployment to supported targets."],["AWS CloudFormation","Provisions and updates resources from declarative templates."]],"docs":[["Developer tools","https://aws.amazon.com/pt/products/developer-tools/"],["AWS CloudFormation","https://docs.aws.amazon.com/pt_br/AWSCloudFormation/latest/UserGuide/Welcome.html"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.8.3-1","prompt":"The pipeline already knows when a commit arrives. What is missing is a managed environment to download dependencies, compile and run unit tests. Which service runs this phase?","solution":"AWS CodeBuild","explanation":"Runs build and test commands in a managed environment per project.","options":[["AWS CodeBuild","Runs build and test commands in a managed environment per project."],["AWS CodeDeploy","Deploys revisions already produced to supported targets."],["AWS CodePipeline","Coordinates stages and can invoke CodeBuild, without providing the build environment itself."],["Amazon ECR","Stores images, without running the requested tests."]]},{"id":"P-3.8.3-2","prompt":"A team wants to visualize a delivery sequence with source, build, manual approval and deployment. It already has tools to run the steps. Which service coordinates the sequence?","solution":"AWS CodePipeline","explanation":"Models stages and actions that call the services or integrations responsible for the steps.","options":[["Amazon CloudWatch Synthetics","Monitors user journeys through canaries, without coordinating delivery."],["AWS CodeBuild","Runs the build step, without managing approval and deployment in sequence on its own."],["AWS CodePipeline","Models stages and actions that call the services or integrations responsible for the steps."],["AWS CodeDeploy","Automates deployment, without driving the whole delivery described."]]}],"cue":"A commit needs to trigger a build and tests in a managed environment. Which service runs this step?","answer":"AWS CodeBuild","use":"Meets the requirement. Runs build and test activities.","avoid":"CodePipeline organizes stages, but a build stage needs a build executor or a compatible integration.","example":"Draw commit, tests, approval, infrastructure and deploy as separate actions.","detail":[],"legacy":"ficha/3.8.3","params":[["AWS CodeBuild","Runs build and test activities.","A commit needs to trigger a build and tests in a managed environment. Which service runs this step?"],["AWS CodePipeline","Orchestrates a delivery flow with stages and actions.","A release needs to coordinate build, approval and deployment. Which service organizes the flow?"],["AWS CodeDeploy","Automates application deployment to supported targets.","The package has already been produced. The rollout to compatible instances must be automated. Which service?"],["AWS CloudFormation","Provisions and updates resources from declarative templates.","The network and compute resources declared in a stack need to be reviewed. Which service?"]],"notes":null},{"code":"3.8.4","id":"3.8.4","domain":3,"task":"3.8","title":"Frontend, devices, desktops and application access","concept":"IoT Core connects devices and IoT messaging. Amplify offers tools and hosting for compatible web and mobile applications. Amazon WorkSpaces provides virtual desktops or end-user computing offerings, depending on the product. AppStream 2.0, also presented in the WorkSpaces Applications family, delivers applications by streaming in compatible scenarios.","control":"Identify the type of client: connected equipment, frontend browser, managed desktop or a single streamed application. The chosen service must offer the access appropriate to the consumer's identity.","pitfall":"Streaming an application to a user is not the same as sending telemetry events from devices.","verify":"Classify four requests by source, unit delivered and final experience.","decisions":[["AWS IoT Core","Connects IoT devices and messages in a managed service."],["AWS Amplify","Supports the development and publishing of frontend applications."],["Amazon WorkSpaces","Delivers a virtual desktop in the compatible offerings."],["Amazon WorkSpaces Applications (AppStream 2.0)","Delivers applications to the user by streaming."]],"docs":[["Amazon WorkSpaces — virtual desktops","https://aws.amazon.com/pt/workspaces/"],["AWS IoT Core","https://aws.amazon.com/pt/iot-core/"],["Official CLF-C02 guide","https://docs.aws.amazon.com/pt_br/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02.html"]],"scenarios":[{"id":"P-3.8.4-1","prompt":"Sensors in stores need to authenticate individually and publish telemetry over MQTT to a managed service. Which offering provides device integration?","solution":"AWS IoT Core","explanation":"Supports authenticated MQTT communication and routing rules for devices.","options":[["Amazon CloudFront","Delivers content at the edge and does not act as an MQTT broker."],["Amazon WorkSpaces","Delivers virtual desktops, outside the telemetry pattern."],["AWS Amplify Hosting","Deploys web frontends; it is not the requested device broker."],["AWS IoT Core","Supports authenticated MQTT communication and routing rules for devices."]]},{"id":"P-3.8.4-2","prompt":"A team wants to publish a front-end site from Git, with previews and integration with the build flow, without operating web servers. Which product should it evaluate?","solution":"AWS Amplify Hosting","explanation":"Offers hosting and continuous delivery for web applications with repository integration.","options":[["AWS Amplify Hosting","Offers hosting and continuous delivery for web applications with repository integration."],["Amazon WorkSpaces Applications","Delivers applications to users, outside the web hosting described."],["Amazon EC2 without a deployment service","Provides capacity, leaving server administration and build integration to the team."],["AWS IoT Core","Manages communication with devices, without frontend hosting connected to Git."]]}],"cue":"Sensors need to authenticate and publish IoT messages. Which offering?","answer":"AWS IoT Core","use":"Meets the requirement. Connects IoT devices and messages in a managed service.","avoid":"Streaming an application to a user is not the same as sending telemetry events from devices.","example":"Classify four requests by source, unit delivered and final experience.","detail":[],"legacy":"ficha/3.8.4","params":[["AWS IoT Core","Connects IoT devices and messages in a managed service.","Sensors need to authenticate and publish IoT messages. Which offering?"],["AWS Amplify","Supports the development and publishing of frontend applications.","The team needs to publish the web frontend and integrate its delivery into the development routine. Which family?"],["Amazon WorkSpaces","Delivers a virtual desktop in the compatible offerings.","Employees need complete virtual desktops. Which product?"],["Amazon WorkSpaces Applications (AppStream 2.0)","Delivers applications to the user by streaming.","Users need to run specific streamed applications without local distribution. Which offering?"]],"notes":null},{"code":"4.1.1","id":"4.1.1","domain":4,"task":"4.1","title":"On-Demand, Savings Plans, reservations and Spot","concept":"On-Demand serves consumption without a long-term commitment. Savings Plans offer a discount on eligible usage in exchange for an hourly monetary commitment. Reserved Instances bring a discount and conditions tied to the service and scope. Spot uses spare capacity, subject to interruption.","control":"Classify predictability, tolerance to interruption, need for flexibility and the difference between a discount and a capacity reservation. Reserved On-Demand capacity follows its own rules and is distinct from a pricing commitment.","pitfall":"Savings Plans do not guarantee available physical capacity. Spot alone does not meet a continuous capacity requirement without an interruption strategy.","verify":"Separate predictable load, occasional peaks, interruption-tolerant batches and capacity that must be available.","decisions":[["On-Demand","Flexible usage with no term commitment."],["Savings Plans","An hourly spend commitment for a discount on eligible compute usage."],["Reserved Instances","A discount model subject to reservation conditions and compatibility."],["Spot Instances","Spare capacity suited to interruption-tolerant workloads."]],"docs":[["AWS pricing","https://aws.amazon.com/pt/pricing/"],["Savings Plans","https://aws.amazon.com/pt/savingsplans/"]],"scenarios":[{"id":"P-4.1.1-1","prompt":"A rendering batch writes checkpoints and recovers interrupted tasks. The deadline has slack and lowering the price of EC2 capacity is the priority. Which purchasing option should be used?","solution":"Spot Instances","explanation":"Use spare capacity at a discount and can be interrupted, a risk the batch accepts.","options":[["Savings Plans","Trade a spend commitment for a discount, a commitment that is unnecessary for a flexible batch."],["Dedicated Hosts","Serve isolation or licensing scenarios, not the use of spare capacity."],["On-Demand Instances","Offer flexibility of term, but do not take advantage of Spot capacity pricing."],["Spot Instances","Use spare capacity at a discount and can be interrupted, a risk the batch accepts."]]},{"id":"P-4.1.1-2","prompt":"An application will be in testing for five days and the team does not accept interruptions from spare capacity being reclaimed. Usage may end early and there will be no monthly or annual commitment. Which EC2 purchasing model fits?","solution":"On-Demand Instances","explanation":"The company pays for usage without a long commitment, outside the Spot interruption model.","options":[["Spot Instances","Can be reclaimed by AWS when spare capacity runs short."],["One-year Reserved Instances","Tie the benefit to a commitment for a period longer than the event."],["Compute Savings Plans","Require a one- or three-year hourly spend commitment."],["On-Demand Instances","The company pays for usage without a long commitment, outside the Spot interruption model."]]}],"cue":"A distributed job resumes processing and accepts interruptions to save money. Which option?","answer":"Spot Instances","use":"Meets the requirement. Spare capacity suited to interruption-tolerant workloads.","avoid":"Savings Plans do not guarantee available physical capacity. Spot alone does not meet a continuous capacity requirement without an interruption strategy.","example":"Separate predictable load, occasional peaks, interruption-tolerant batches and capacity that must be available.","detail":[],"legacy":"ficha/4.1.1","params":[["On-Demand","Flexible usage with no term commitment.","A one-off event needs capacity without a multi-year commitment. Which pricing option?"],["Savings Plans","An hourly spend commitment for a discount on eligible compute usage.","There is recurring demand. The customer accepts committing to an hourly spend to get a discount on eligible compute. Which model?"],["Reserved Instances","A discount model subject to reservation conditions and compatibility.","The team wants to compare discounts tied to the conditions of an instance reservation. Which model?"],["Spot Instances","Spare capacity suited to interruption-tolerant workloads.","A distributed job resumes processing and accepts interruptions to save money. Which option?"]],"notes":null},{"code":"4.1.2","id":"4.1.2","domain":4,"task":"4.1","title":"Estimates, data transfer and marginal cost","concept":"Cost can involve time, capacity, requests, storage and data transfer, depending on the service. AWS Pricing Calculator estimates future scenarios. Cost Explorer analyzes reported usage and cost. A cost decision considers the marginal price of services and the transfer topology.","control":"Compare the estimated load, ingress/egress traffic, access across zones or Regions and indirect costs. Check the pricing rules per service and Region instead of assuming every transfer is treated the same way.","pitfall":"An estimate of a future architecture does not replace the analysis of historical usage and cost.","verify":"Work out which variables change if a consumer starts reading from another Region.","decisions":[["AWS Pricing Calculator","Estimates costs for planned services and volume."],["AWS Cost Explorer","Analyzes recorded costs and usage and lets you explore trends."],["Data transfer model","Considers source, destination and the service's billing rules."],["Storage cost drivers","Consider volume, class, requests, retention and retrieval."]],"docs":[["AWS Pricing Calculator","https://docs.aws.amazon.com/pt_br/pricing-calculator/latest/userguide/what-is-pricing-calculator.html"],["AWS pricing","https://aws.amazon.com/pt/pricing/"],["AWS Well-Architected Framework","https://docs.aws.amazon.com/pt_br/wellarchitected/latest/framework/welcome.html"]],"scenarios":[{"id":"P-4.1.2-1","prompt":"A team has only an architecture design with the expected EC2 hours, GB of storage and data transfer. It wants to prepare a forecast before the first deploy. Which tool should it use?","solution":"AWS Pricing Calculator","explanation":"Estimates rates for proposed quantities and configurations before there is any real usage.","options":[["AWS Data Exports","Delivers the account's billing and usage data, outside the estimate of a still hypothetical scenario."],["AWS Cost Explorer","Analyzes cost data and can forecast from observed usage, which this new design does not have."],["AWS Pricing Calculator","Estimates rates for proposed quantities and configurations be
