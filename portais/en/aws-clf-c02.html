/* Dropdown Conteúdo Teórico */
.dropdown-wrap {
  position: relative;
  display: inline-block;
}
.dropdown-caret {
  font-size: 9px;
  transition: transform 0.16s ease;
}
.dropdown-wrap:hover .dropdown-caret,
.dropdown-wrap.open .dropdown-caret {
  transform: rotate(180deg);
}
.dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  min-width: 390px;
  background: #112442;
  border: 1px solid #35558a;
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 14px 34px rgba(0,0,0,0.45);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-5px);
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  z-index: 2200;
}
.dropdown-menu::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 0;
  right: 0;
  height: 10px;
}
.dropdown-wrap:hover .dropdown-menu,
.dropdown-wrap:focus-within .dropdown-menu,
.dropdown-wrap.open .dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

}
.dropdown-item.active {

}

}

  justify-content: space-between;

.global-search-btn {

.portal-viewport {

  background: var(--bg);
}
.module-frame {
  position: absolute;
  inset: 0;

  height: 100%;
  border: 0;
  display: none;
  background: var(--bg);
}
.module-frame.active {
  display: block;
}
.native-view {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 20px 24px 60px;
  display: none;
}
.native-view.active {
  display: block;
}
.container-max {
  max-width: 1560px;
  margin: 0 auto;
}

/* Common UI Components for Native Views */
.sec-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.sec-eyebrow {
  font-size: 10.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--blue);
}
.sec-head h2 {
  margin: 3px 0 4px;
  font-size: 23px;
  line-height: 1.2;
}
.sec-head p {
  margin: 0;
  color: var(--muted);
  max-width: 920px;
}
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pcard {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.pcard h3 { margin: 0 0 8px; font-size: 15px; }
.pcard p { margin: 5px 0; color: var(--muted); }
.pbadge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 800;
  background: var(--blue2);
  color: var(--blue);
}
.pbadge.green { background: var(--greenbg); color: var(--green); }
.pbadge.orange { background: var(--orangebg); color: var(--orange); }
.pbadge.purple { background: var(--purplebg); color: var(--purple); }
.pbadge.red { background: var(--redbg); color: var(--red); }
.pbadge.teal { background: var(--tealbg); color: var(--teal); }

.ptable-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
}
.ptable {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
.ptable th, .ptable td {
  padding: 9px 11px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.ptable th {
  background: var(--panel2);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
.ptable tr:last-child td { border-bottom: 0; }
.ptable tr:hover td { background: color-mix(in srgb, var(--blue2) 30%, var(--panel)); }

.pbtn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pbtn:hover { border-color: var(--blue); color: var(--blue); }
.pbtn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.pbtn.sm { padding: 4px 8px; font-size: 11px; }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.pinput, .pselect {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  border-radius: 9px;
  padding: 8px 11px;
  font-size: 12.5px;
}

/* Mode Switcher Banner (Learning Bank vs Exam Simulation Bank) */
.mode-switch-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1.5px solid var(--blue);
  border-radius: 13px;
  padding: 11px 15px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.mode-pill-group {
  display: inline-flex;
  background: var(--panel2);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--line);
  gap: 4px;
}
.mode-pill {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 7px 13px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
}
.mode-pill.active {
  background: var(--blue);
  color: #fff;
}

/* Simulado & Quiz Engine Styles */
.quiz-opt {
  width: 100%;
  text-align: left;
  padding: 11px 13px;
  border-radius: 10px;
  border: 1.5px solid var(--line);
  background: var(--panel2);
  color: var(--ink);
  margin-bottom: 8px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: all 0.14s ease;
}
.quiz-opt:hover { border-color: var(--blue); }
.quiz-opt.selected { border-color: var(--blue); background: var(--blue2); font-weight: 700; }
.quiz-opt.correct { border-color: var(--green); background: var(--greenbg); }
.quiz-opt.wrong { border-color: var(--red); background: var(--redbg); }
.quiz-letter {

  height: 24px;
  border-radius: 6px;
  background: var(--panel);
  border: 1px solid var(--line);
  display: inline-grid;
  place-items: center;
  font-weight: 800;
  font-size: 11.5px;
  flex-shrink: 0;
}
.rationale-box {

  line-height: 1.45;
  overflow-x: auto;
  border: 1px solid #294575;
  margin: 10px 0;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(6, 14, 28, 0.72);

  z-index: 3000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 50px 16px 20px;
}
.modal-backdrop.open { display: flex; }
.search-modal {
  width: 100%;
  max-width: 960px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 22px 54px rgba(0,0,0,0.45);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 84vh;
}
.search-modal-head {
  padding: 13px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-modal-head input {
  flex: 1;
  border: 1px solid var(--blue);
  background: var(--panel2);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
}
.search-modal-body {
  padding: 12px 16px;
  overflow-y: auto;
  flex: 1;
}
.search-hit {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 8px;
  background: var(--panel2);

  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
}
.search-hit:hover {
  border-color: var(--blue);
  background: var(--blue2);
}
.prog-bar-outer {
  height: 8px;
  background: var(--panel2);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.prog-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--teal));
  transition: width 0.25s ease;
}

/* Toast Notification */
.toast-msg {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 4000;
  background: var(--navy);
  color: #fff;
  border: 1px solid var(--blue);
  padding: 10px 16px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 12.5px;
  font-weight: 700;
  display: none;
}
.toast-msg.show { display: block; }

@media (max-width: 1020px) {
  .grid.four, .grid.three, .grid.two { grid-template-columns: 1fr; }
  .dropdown-menu { min-width: min(350px, 94vw); }
}

</div><div class="toast-msg" id="portalToast" role="status"></div><script>window.portalInput={"questions":[{"id":"P-1.1.1-1","skill":"1.1.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"A ticket office receives ten times more traffic when sales open. After two hours, it wants to release the extra capacity. Which characteristic serves both phases?","options":["Fixed vertical scaling","High availability","Hybrid migration","Elasticity"],"why":["A larger machine can handle the peak, but it stays provisioned afterward.","It addresses interruption from failures, not adjusting between peak and trough.","It describes distribution across environments, not capacity adjustment.","Capacity follows both the rise and the fall in demand."],"correct":[3]},{"id":"P-1.1.1-2","skill":"1.1.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"A team used to wait for servers to be purchased before testing a prototype. Now it creates and discards an environment on the same day. Which benefit changed the testing timeline?","options":["The provider's economies of scale","Agility","Vertical scalability","Disaster recovery"],"why":["It can influence the unit price, but the scenario compares time.","On-demand provisioning reduces the time between idea and test.","Changing the machine size does not explain the fast initial provisioning.","The environment is created for testing, not to restore a service."],"correct":[1]},{"id":"P-1.1.2-1","skill":"1.1.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"After a failure, the clinic can restart the application in one hour. Management says that at most fifteen minutes of records can be lost. Which objective describes the fifteen minutes?","options":["Retention period","Support agreement","RPO","RTO"],"why":["It defines how much history to keep, not the maximum loss in an incident.","It covers entitlements and service, not how current the copy must be.","It limits the distance between the failure and the recoverable data point.","It is the limit for bringing the service back."],"correct":[2]},{"id":"P-1.1.2-2","skill":"1.1.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"The company tolerates losing a few changes, but the highlighted contract says the system must be back within two hours. What do the two hours represent?","options":["p95 latency","Maintenance window","RTO","RPO"],"why":["It describes the response time of requests that were already served.","It defines a time for planned change, not recovery after a failure.","It measures the service's recovery deadline.","It measures acceptable data loss over time."],"correct":[2]},{"id":"P-1.2.1-1","skill":"1.2.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"After incidents, a team reviews runbooks and automates small, reversible changes. The goal is to improve the operations routine. Which pillar guides this work?","options":["Operational excellence","Security","Sustainability","Cost optimization"],"why":["It focuses on running operations, evolving processes and learning from events.","It would dominate if the main goal were protecting data and identities.","The team is not investigating environmental impact.","The scenario does not measure spending or waste."],"correct":[0]},{"id":"P-1.2.1-2","skill":"1.2.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"The company rehearses losing a primary database and tests whether failover restores the service. Which pillar measures this result?","options":["Performance efficiency","Operational excellence","Reliability","Security"],"why":["The focus is not choosing resources for routine latency or throughput.","Automating the test helps operations, but the result measured is recovery.","The test proves the ability to recover from and tolerate failures.","The simulation does not prove confidentiality protection."],"correct":[2]},{"id":"P-1.2.2-1","skill":"1.2.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"A service receives more requests than the workers can handle. The producer must respond without waiting for completion, and the requests must remain available for later consumption. Which service should be used?","options":["Elastic Load Balancing","Amazon SQS","AWS Lambda without a queue","Amazon Route 53"],"why":["It distributes requests to targets, without persisting a backlog of requests.","It keeps pending work decoupled from the consumers' pace.","It runs code, but it does not provide the explicit queue the design needs.","It resolves the destination through DNS; it does not retain messages."],"correct":[1]},{"id":"P-1.2.2-2","skill":"1.2.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"A confirmation must be distributed to finance, support and audit. Each group must receive the same publication. Which service provides the fan-out?","options":["AWS Budgets","Amazon SNS","Amazon EBS","A single SQS queue with three competing consumers"],"why":["It issues budget alerts, without acting as a general application topic.","The topic delivers the publication to multiple configured subscribers.","It stores blocks and does not distribute notifications.","Consumers of the same queue compete for work; by design, each one does not receive a copy."],"correct":[1]},{"id":"P-1.3.1-1","skill":"1.3.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"An on-premises application uses a legacy runtime and will be moved to EC2. The deadline does not allow a redesign or a product change. Which strategy?","options":["Refactor","Retain","Repurchase","Rehost"],"why":["It would redesign the application to adopt another architecture.","It would keep the asset at the source.","It would replace the product with another one.","It moves the application while keeping the architecture and stack essentially the same."],"correct":[3]},{"id":"P-1.3.1-2","skill":"1.3.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"The application keeps its interfaces and rules. The database moves from a self-managed VM to Amazon RDS using the same compatible engine. Which strategy?","options":["Replatform","Repurchase of the whole application","Retire","Rehost with no change in operations"],"why":["The platform improves without a broad rewrite of the application.","The application remains the same product.","The system stays in operation.","The database starts using a managed service, in addition to changing location."],"correct":[0]},{"id":"P-1.3.2-1","skill":"1.3.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"Before migrating several business units, the sponsor wants to assess the organization's skills, governance and operations. Which approach guides the adoption?","options":["AWS DMS","AWS Cloud Adoption Framework","AWS Pricing Calculator","AWS Well-Architected Tool"],"why":["It moves database data, without guiding people management or governance.","It covers organizational perspectives for the adoption journey.","It estimates configuration and cost, not organizational maturity.","It evaluates workloads; by itself it does not address corporate capabilities."],"correct":[1]},{"id":"P-1.3.2-2","skill":"1.3.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"An architect needs to review an existing workload against the six pillars. They want to discuss security, reliability and the other dimensions of the design. Which reference?","options":["AWS CAF","AWS Migration Hub","AWS Pricing Calculator","AWS Well-Architected Framework"],"why":["It guides adoption at the organizational level; it is not the six-pillar workload framework.","It supports migration tracking, not the requested review.","It estimates cost for a configuration, without evaluating the pillars.","It organizes the review by architecture pillars."],"correct":[3]},{"id":"P-1.4.1-1","skill":"1.4.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"A company stops buying servers before a launch. It now pays for the compute it uses according to demand. Which financial change describes the case?","options":["Built-in physical reservation","Consolidated billing","Trading upfront investment for variable expense","Long-term commitment"],"why":["Paying for usage does not guarantee reserved physical capacity.","It groups invoices, without explaining buying versus consuming resources.","Consumption shifts spending from prior acquisition to operations, according to usage.","It was not taken on in the scenario."],"correct":[2]},{"id":"P-1.4.1-2","skill":"1.4.1","domain":1,"form":null,"scored":true,"kind":"single","stem":"The comparison between cloud and data center uses a three-year horizon and includes power, people, licenses, network and migration. Which measure is being built?","options":["Committed usage discount","Total cost of ownership","Unit price of compute","Marginal cost of a request"],"why":["It describes a pricing instrument, not the whole comparison.","It includes direct and indirect costs over the lifecycle.","It does not include operating and migration expenses.","It reflects one additional unit, not the full horizon."],"correct":[1]},{"id":"P-1.4.2-1","skill":"1.4.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"A service runs 24 hours a day, but CPU and memory stay below what the current family provides, even at peak. The SLA does not change. What should be evaluated first?","options":["Buy a commitment for the current configuration immediately","Duplicate resources in another environment","Shut the system down at night without checking demand","Rightsizing with representative metrics"],"why":["It can lock spending into oversized capacity.","It increases capacity without evidence of need.","The workload has a requirement to run continuously.","It sizes the resource to the real CPU and memory pressure without changing the service objective."],"correct":[3]},{"id":"P-1.4.2-2","skill":"1.4.2","domain":1,"form":null,"scored":true,"kind":"single","stem":"The lab needs to be active on weekdays during training hours, and not otherwise. The resources must remain available for reuse. Which change reduces compute hours?","options":["Switch the instances to larger families","Permanently delete the account after each training session","Enable consolidated billing","Schedule stopping and restarting of compatible resources"],"why":["It can raise the hourly cost without reducing active time.","It does not preserve the resources for reuse.","It groups payments, without actually turning compute off.","It avoids idle hours while preserving the environment for another day."],"correct":[3]},{"id":"P-1.2.3-1","skill":"1.2.3","domain":1,"form":null,"scored":true,"kind":"single","stem":"The workload review identifies exposed credentials and no trail of suspicious actions. The goal is to strengthen identities and detection. Which pillar?","options":["Sustainability","Performance efficiency","Security","Reliability"],"why":["It does not address environmental impact.","Changing the instance type is not the goal.","Identity, protection and detection are central to this pillar.","Recovery capability by itself does not cover credential exposure."],"correct":[2]},{"id":"P-1.2.3-2","skill":"1.2.3","domain":1,"form":null,"scored":true,"kind":"single","stem":"The team measures spending per order, removes idle resources and preserves the SLA. Which pillar is guiding the choice?","options":["Operational excellence","Reliability","Cost optimization","Security"],"why":["Process improvement can help, but the explicit measure is spending.","The SLA is a constraint on the decision, not the variable being optimized.","The team seeks a better cost per unit of work delivered.","The case does not compare permissions or data protection."],"correct":[2]},{"id":"P-2.1.1-1","skill":"2.1.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"An alert points to a vulnerability in the Linux distribution the company uses on its EC2 instances. The underlying hardware is up to date. Who applies the patch to the guest operating system?","options":["The customer's monitoring service","The customer who operates the instance","AWS as the operator of the hypervisor","The provider's audit"],"why":["Detecting a vulnerability does not transfer responsibility for the patch.","In EC2, the guest operating system and its packages are managed by the customer.","Control of the hypervisor does not include patching the guest.","It evaluates evidence, without administering the guest OS."],"correct":[1]},{"id":"P-2.1.1-2","skill":"2.1.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"The team uses Amazon RDS and needs to prevent a new analyst from reading the finance table. Who configures this permission?","options":["The customer who administers database access","The database engine vendor","A regular database user","AWS as the party responsible for the hardware"],"why":["RDS manages the infrastructure, while the customer determines users and privileges.","Supplying software does not make the vendor responsible for the organization's access.","It should not be able to grant access without administrative privilege.","Infrastructure control does not define which people read tables."],"correct":[0]},{"id":"P-2.1.2-1","skill":"2.1.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"The customer includes physical access control for the data center in its matrix, but AWS is the one that operates it. How should it be classified for the customer?","options":["Authorization delegated to an IAM user","Application control","Inherited control","Customer-specific control"],"why":["IAM does not control physical entry into the data center.","The operation is not in the workload's code or configuration.","The customer relies on a control of the infrastructure managed by the provider.","The customer neither designs nor runs AWS's physical protection."],"correct":[2]},{"id":"P-2.1.2-2","skill":"2.1.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"In the patching policy, AWS takes care of the infrastructure and the customer takes care of the EC2 guest OS. Which classification is appropriate?","options":["Inherited control","Control fully transferred to the customer","Physical control","Shared control by layer"],"why":["The customer still needs to patch the guest system.","AWS remains responsible for its infrastructure.","It also covers the workload's software.","The type of control exists on both sides, in different layers."],"correct":[3]},{"id":"P-2.2.1-1","skill":"2.2.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"The legal team needs to download a SOC report about AWS to evaluate the vendor. It does not want to collect logs from its own account. Which service?","options":["AWS Config","AWS Artifact","Amazon Inspector","AWS Audit Manager"],"why":["It keeps resource configuration, not the vendor's documents.","It distributes the provider's reports and agreements.","It evaluates vulnerabilities; it does not provide the AWS SOC report.","It helps structure assessments and collect evidence from the environment."],"correct":[1]},{"id":"P-2.2.1-2","skill":"2.2.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"A team needs to organize evidence of controls from several accounts in a recurring assessment. Which service was built to help with this?","options":["AWS Artifact by itself","Amazon CloudFront","AWS Audit Manager","AWS CloudFormation"],"why":["It delivers AWS reports and does not aggregate the workload assessment.","It distributes content, not evidence of controls.","It structures assessments and helps collect evidence of controls.","It operates infrastructure stacks, without organizing an audit assessment."],"correct":[2]},{"id":"P-2.2.2-1","skill":"2.2.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"An API starts returning more HTTP 500 errors in the afternoon. The team needs to be notified when the metric crosses a threshold. Which service?","options":["AWS Artifact","Amazon CloudWatch","AWS Config","Amazon Inspector"],"why":["It neither analyzes metrics nor generates this alarm.","It makes it possible to create an alarm on the operational metric.","It evaluates configuration, not the rate of HTTP responses.","It finds vulnerabilities, without monitoring the operational threshold."],"correct":[1]},{"id":"P-2.2.2-2","skill":"2.2.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"The access policy changed, and the security team needs to know which session made the call. Which source?","options":["AWS CloudTrail","A security group","AWS Organizations as a report","Amazon CloudWatch Metrics"],"why":["It records management activity and its identity context.","It controls traffic, without recording who made a change through the API.","It organizes accounts and controls, without replacing the trail of calls.","It can show the effect, not the identity that changed the policy."],"correct":[0]},{"id":"P-2.3.1-1","skill":"2.3.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"An EC2 application reads an S3 prefix. The company wants temporary credentials with no keys in the code or the image. Which choice?","options":["Make the prefix public","Attach an IAM role to the instance","Share the root account credentials","Embed an IAM user's keys in the image"],"why":["It avoids authentication at the cost of exposing the data.","The application obtains temporary credentials with the role's permissions.","It broadens privilege and breaks identity separation.","It creates a permanent secret distributed to each instance."],"correct":[1]},{"id":"P-2.3.1-2","skill":"2.3.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"The account has just been created. There is one identity that must receive strong protection and be reserved for the tasks that it alone can perform. Which identity?","options":["Root user with MFA","Federated developer identity","User with read access to costs","Lambda execution role"],"why":["Root has broad authority and requires specific controls.","It is for everyday use with assigned permissions.","It is an operational identity, not the one reserved for exclusive tasks.","It runs the workload with its own privileges, without being the account owner."],"correct":[0]},{"id":"P-2.3.2-1","skill":"2.3.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Employees need to sign in to several accounts through the same login experience, with different permissions in each one. Which service?","options":["AWS IAM Identity Center","AWS Direct Connect","A single role with permanent credentials shared across the staff","AWS Config"],"why":["It centralizes human access and account assignments.","It offers dedicated connectivity, without managing the company's identities.","It does not provide federation or per-account profiles with traceability.","It evaluates resource configuration; it does not provide a federated portal."],"correct":[0]},{"id":"P-2.3.2-2","skill":"2.3.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"Security wants to block an action for every member account in an OU, even if someone grants that action in a local policy. Which control?","options":["A common tag applied to resources","A local password policy","Access control on the logs bucket","An AWS Organizations SCP"],"why":["Labels do not deny actions without an associated policy.","It controls credential requirements, not which APIs are allowed.","It limits one resource, not the whole OU.","It defines the permission boundary available at the organizational scope."],"correct":[3]},{"id":"P-2.4.1-1","skill":"2.4.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"Security wants to identify signs of malicious activity from the behavior observed in compatible account and network sources. Which service should it focus on?","options":["Amazon Inspector","AWS Artifact","AWS Shield as a credential scanner","Amazon GuardDuty"],"why":["It prioritizes workload vulnerabilities, which are another type of evidence.","It provides the provider's documents, without detecting behavior.","DDoS protection is not detection of suspicious credential activity.","It analyzes threat signals in supported sources."],"correct":[3]},{"id":"P-2.4.1-2","skill":"2.4.1","domain":2,"form":null,"scored":true,"kind":"single","stem":"A team publishes images to a compatible repository. Before deployment, it wants to identify CVEs in the image's packages. Which service?","options":["AWS Health","Amazon Macie","AWS WAF","Amazon Inspector"],"why":["It shows service events, not vulnerable packages in the image.","It looks for sensitive data in S3 objects, not package CVEs.","It filters HTTP requests, without evaluating libraries in images.","It evaluates vulnerabilities in compatible images."],"correct":[3]},{"id":"P-2.4.2-1","skill":"2.4.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"The website has to block HTTP requests based on header patterns. Controlling addresses or ports is not enough. Which service?","options":["Amazon Inspector","Network ACL","AWS WAF","AWS KMS"],"why":["It evaluates vulnerabilities; it does not apply these rules to traffic.","It filters by network criteria, without inspecting HTTP headers.","Its rules analyze attributes of web requests in supported integrations.","It manages keys; it does not inspect requests."],"correct":[2]},{"id":"P-2.4.2-2","skill":"2.4.2","domain":2,"form":null,"scored":true,"kind":"single","stem":"A public endpoint needs protection against distributed attack traffic. The concern is staying available during a DDoS. Which offering?","options":["AWS Shield","Amazon Macie","AWS Config","AWS Secrets Manager"],"why":["It protects against distributed denial-of-service attacks, according to its coverage.","It classifies data in S3; it does not protect an endpoint against flooding.","It evaluates resource compliance, without handling overload in transit.","It protects secrets, without mitigating external traffic volume."],"correct":[0]},{"id":"P-2.2.3-1","skill":"2.2.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"The team uses object encryption in S3 and needs to control and audit the use of keys. Which service manages this material?","options":["AWS Certificate Manager","AWS KMS","AWS Secrets Manager","Amazon Macie"],"why":["It manages certificates, not the keys S3 uses in this case.","It manages keys and usage policies compatible with SSE-KMS.","It manages secrets such as passwords, without being the SSE-KMS key service.","It discovers sensitive data, without providing the encryption key."],"correct":[1]},{"id":"P-2.2.3-2","skill":"2.2.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"An application needs to retrieve the database password and adopt an integrated rotation process. Which service meets both needs?","options":["AWS Secrets Manager","AWS KMS by itself","IAM Identity Center","AWS Artifact"],"why":["It stores the secret and offers compatible rotation mechanisms.","It can protect data, but it does not store and rotate the password as a managed secret.","It centralizes human access to AWS; it does not distribute the application's password.","It provides compliance documentation, not secrets."],"correct":[0]},{"id":"P-2.4.3-1","skill":"2.4.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"The team wants to explicitly deny an entire range on inbound traffic to a subnet. The control must operate at the subnet boundary. Which should be used?","options":["IAM control over rule creation","Network ACL","Security group with a deny rule","AWS WAF for the whole subnet's traffic"],"why":["It authorizes administrative actions, without applying the desired traffic filter.","It supports allow and deny rules at the subnet scope.","Security groups use allow rules and act at the resource level.","It acts on web requests, not at the general subnet boundary."],"correct":[1]},{"id":"P-2.4.3-2","skill":"2.4.3","domain":2,"form":null,"scored":true,"kind":"single","stem":"The application instances' group should be the one source that can connect to a database port. Responses to allowed connections will not require another matching rule. Which choice?","options":["Private DNS resolution","The database's security group","A network ACL with connection state","An IAM trust policy"],"why":["It locates the database, but it does not enforce the source and port rule.","It controls the resource with stateful behavior and can reference the source group.","A network ACL is stateless and does not work through the indicated group association.","It authorizes assuming a role, without controlling TCP connections."],"correct":[1]},{"id":"P-3.1.1-1","skill":"3.1.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"An analyst is getting started on AWS and wants to explore resources and their attributes using a web browser. The company does not yet need to automate the lookup. Which interface should be used?","options":["AWS Management Console","AWS CLI","AWS SDK for Python","AWS CloudFormation"],"why":["The web interface lets you browse the services and look up the account's resources.","It requires running commands in a terminal.","It is a library for application code.","It provisions resources from templates."],"correct":[0]},{"id":"P-3.1.1-2","skill":"3.1.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A team wants to include networks and roles in a code review and reproduce the environment in another account. It needs to declare resources and dependencies. Which service fits?","options":["AWS Systems Manager","AWS CodeBuild","AWS CloudTrail","AWS CloudFormation"],"why":["It runs operations on managed resources, without representing the stack's whole infrastructure.","It compiles and tests code, but it does not define the lifecycle of these resources.","It records API calls for auditing.","The declarative template describes the resources, and the stack tracks their dependencies."],"correct":[3]},{"id":"P-3.1.2-1","skill":"3.1.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A factory keeps its order database in its own data center because operations require it, but its public API already runs on AWS. Each order uses both environments. Which model was adopted?","options":["Multi-Region deployment","Fully cloud deployment","Fully on-premises deployment","Hybrid deployment"],"why":["The description does not require two AWS Regions.","The database would remain dependent on the data center, outside this definition.","The API processing is on AWS.","The architecture integrates on-premises resources and cloud services in the same flow."],"correct":[3]},{"id":"P-3.1.2-2","skill":"3.1.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The company needs to keep compute on the factory floor and wants to operate compatible AWS services with the same tools used in the Region. Which offering should it evaluate?","options":["AWS Outposts","AWS Local Zones","Amazon CloudFront","AWS Direct Connect"],"why":["It brings compatible AWS infrastructure and services to the customer's facilities.","They offer capacity in metropolitan locations operated by AWS.","It brings cached content delivery closer, without running the requested on-site workload.","It provides dedicated connectivity, without installing AWS compute in the factory."],"correct":[0]},{"id":"P-3.2.1-1","skill":"3.2.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A company is required to select an AWS location in the mandated country for its database's primary data. Which concept in the catalog identifies this geographic area?","options":["An isolated Availability Zone","Edge location","Private subnet","AWS Region"],"why":["It is a subdivision of the Region, normally used after the geography is chosen.","It serves traffic at the edge and does not identify the deployment area for a regional database.","It segments addresses and network reach within a VPC.","It is the geographic area chosen for regional resources and contains Availability Zones."],"correct":[3]},{"id":"P-3.2.1-2","skill":"3.2.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A news site keeps its origin in one Region but wants to serve cached copies to readers on different continents. Which infrastructure serves the cache closest to the user?","options":["AWS Outposts facilities","Subnets in a VPC","Volumes per Availability Zone","CloudFront edge locations"],"why":["They extend services to specific customer facilities.","They organize internal resources, without distributing a cache to international readers.","They isolate block storage and are not global delivery points.","The edge network delivers content from points close to the audience."],"correct":[3]},{"id":"P-3.3.1-1","skill":"3.3.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A vendor requires a specific Linux version and the installation of an agent that runs as a system service. The team accepts operating the virtual machine. Which service should be used?","options":["AWS Fargate","Amazon EC2","Amazon Aurora","AWS Lambda"],"why":["It runs containers without exposing the underlying host.","The instance lets you choose the AMI and administer the guest system.","It is a managed database, with no administrative access to the host's operating system.","The function model does not offer host administration for installing this service."],"correct":[1]},{"id":"P-3.3.1-2","skill":"3.3.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"When a photo arrives in a bucket, a short routine validates its size. There is no processing outside these events, and the code does not need persistent processes. Which service should run it?","options":["Amazon CloudFront Functions","AWS Batch with a dedicated fleet","Amazon ECS on EC2","AWS Lambda"],"why":["It runs on CloudFront request and response events, not when objects arrive in the bucket.","The requirement calls for neither a job queue platform nor dedicated capacity.","It can run a consumer, adding service and node operations for the case described.","S3 can notify the function, and the team does not need to operate servers for the handler."],"correct":[3]},{"id":"P-3.3.2-1","skill":"3.3.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"An EC2 group becomes saturated at the peak each morning. The load balancer already distributes connections, but the group must increase and decrease the number of instances according to demand. What should be configured?","options":["Amazon Route 53 failover","Application Load Balancer","AWS CloudFormation change sets","Amazon EC2 Auto Scaling"],"why":["It can change DNS responses based on health, without launching instances.","It distributes requests among targets, without defining the group's size.","They show proposed infrastructure changes, without scaling on a metric.","It manages the desired capacity and adds or removes instances by policy."],"correct":[3]},{"id":"P-3.3.2-2","skill":"3.3.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The application uses the same domain for payments and orders. The load balancer must send each HTTP path to a different target group. Which should be chosen?","options":["Gateway Load Balancer","Weighted routing in Route 53","Application Load Balancer","Network Load Balancer"],"why":["It integrates network appliances, without offering application routing by path.","It applies to DNS queries, whose content does not include the URL path.","It supports URL path routing at the application layer.","It balances at the transport level, without inspecting the HTTP path to choose the target."],"correct":[2]},{"id":"P-3.4.1-1","skill":"3.4.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A marketplace needs to read carts by customer ID with a high volume of requests. The attributes can vary, and access does not depend on relational joins. Which database is most suitable?","options":["Amazon Neptune","Amazon Redshift","Amazon RDS for PostgreSQL","Amazon DynamoDB"],"why":["It is oriented to graphs and relationship traversals.","It focuses on high-volume analytical queries; it is not the natural choice for operational carts read by key.","It offers a relational database, without matching the scenario's choice of a managed key-value model.","It is a key-value and document database with reads organized by key."],"correct":[3]},{"id":"P-3.4.1-2","skill":"3.4.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A third-party application is certified for Microsoft SQL Server and no other engine. The team wants to automate backups and delegate routine maintenance tasks for the database instance. Which service offers a compatible engine?","options":["Amazon DynamoDB","Amazon RDS for SQL Server","SQL Server on EC2","Amazon Aurora PostgreSQL"],"why":["It provides neither the engine nor the required relational interface.","It is a managed option that offers the Microsoft SQL Server engine.","It preserves compatibility, with database management remaining the team's responsibility.","It uses PostgreSQL compatibility, not SQL Server."],"correct":[1]},{"id":"P-3.4.2-1","skill":"3.4.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The source database will remain available for writes during the migration. The target must receive an initial load and the changes up to cutover. Which service covers both phases?","options":["AWS DataSync","AWS Backup","AWS Database Migration Service","AWS Application Migration Service"],"why":["It transfers files and objects, without interpreting the relational transaction log.","It manages protection and restore points, without continuous logical replication to the target described.","DMS can perform a full load and change data capture for supported sources and targets.","It replicates servers for infrastructure migration; it is not the specific tool for CDC between databases."],"correct":[2]},{"id":"P-3.4.2-2","skill":"3.4.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Before moving an Oracle database to PostgreSQL, the team wants to assess types, procedures and objects that will need manual adaptation. Which capability helps in this phase?","options":["CDC replication in AWS DMS","DMS Schema Conversion","AWS DataSync Discovery","AWS Backup Audit Manager"],"why":["It transfers data changes, without resolving the incompatibility of schema objects by itself.","It assesses and converts schemas and compatible code in heterogeneous migrations.","It helps assess storage and file movement, without analyzing SQL procedures.","It evaluates backup controls, not conversion between engines."],"correct":[1]},{"id":"P-3.5.1-1","skill":"3.5.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"The application needs its own addressing, public and private subnets, and separate routes. Which service establishes the network boundary for these requirements?","options":["AWS Transit Gateway","Amazon Route 53","Amazon VPC","AWS PrivateLink"],"why":["It connects existing networks, without creating the application's subnets.","It resolves names through DNS and does not manage subnet addressing.","It defines the virtual network, ranges, subnets and route tables.","It provides private connectivity to services, without defining the entire virtual network."],"correct":[2]},{"id":"P-3.5.1-2","skill":"3.5.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"A website will point its domain to a new load balancer. The team needs to edit the public DNS records and keep the zone managed on AWS. Which service should be used?","options":["Elastic Load Balancing","AWS Certificate Manager","Amazon Route 53","Amazon VPC IP Address Manager"],"why":["It receives application traffic, without managing the domain's public zone.","It issues or manages certificates, without being the DNS hosting service.","The public hosted zone provides DNS records for the domain.","It plans IP blocks, without publishing DNS records on the internet."],"correct":[2]},{"id":"P-3.5.2-1","skill":"3.5.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A company wants to connect the branch network to the VPC with IPsec tunnels. It already has internet access and a compatible gateway device. Which service should be configured?","options":["VPC peering","AWS Direct Connect without a VPN","AWS Client VPN","AWS Site-to-Site VPN"],"why":["It interconnects compatible VPCs, without terminating a tunnel from the data center.","The dedicated connection does not by itself provide the required IPsec tunnel.","It is suited to remote user access, which is different from linking the branch network and the VPC.","It uses encrypted IPsec tunnels between the customer network and the gateway on AWS."],"correct":[3]},{"id":"P-3.5.2-2","skill":"3.5.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The infrastructure team wants a dedicated private connection from its data center to AWS. The company accepts contracting a connectivity partner and planning for the installation lead time. Which offering fits?","options":["Amazon CloudFront","AWS Direct Connect","AWS Network Firewall","AWS Site-to-Site VPN over the internet"],"why":["It distributes content and does not physically connect the data center to AWS.","It creates a dedicated connection with virtual interfaces to compatible destinations.","It inspects traffic and does not provision physical connectivity.","It provides encryption over the public internet, without the requested dedicated circuit."],"correct":[1]},{"id":"P-3.6.1-1","skill":"3.6.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"An application stores photos in an object namespace. Each photo is retrieved by key, and the application uses a managed HTTP API. Which storage should be selected?","options":["Amazon EBS","Amazon EFS","Amazon S3","Amazon FSx for Windows File Server"],"why":["It exposes block devices to instances, outside the per-object API model.","It presents directories and files over NFS.","It implements buckets and object access by key.","It offers Windows-compatible SMB shares."],"correct":[2]},{"id":"P-3.6.1-2","skill":"3.6.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"An EBS-backed AMI needs a persistent boot disk for the EC2 instance. The storage must appear as a block device. Which service should be used?","options":["Amazon EFS","Amazon EBS","Amazon FSx for Lustre","Amazon S3 Standard"],"why":["It is mounted as a shared file system, without providing the EBS boot disk.","It provides block volumes compatible with booting an EC2 instance.","It provides a file system aimed at high-performance processing, not the requested root volume.","It implements object storage, without exposing the root volume."],"correct":[1]},{"id":"P-3.6.2-1","skill":"3.6.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The same collection alternates between months with read peaks and months with almost no access. The team wants to automate tier changes based on observed usage. Which class offers this?","options":["S3 Standard-IA","S3 One Zone-IA","S3 Intelligent-Tiering","S3 Glacier Deep Archive"],"why":["It is a specific class with a retrieval fee, without switching automatically based on access.","It stores data in a single AZ and does not adjust tiers automatically.","It moves eligible objects between tiers according to access patterns, with its own monitoring rules.","It prioritizes archiving and requires a restore before reading."],"correct":[2]},{"id":"P-3.6.2-2","skill":"3.6.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"Regulatory documents must remain available for occasional restores for many years. Access is rare, storage cost matters more, and the team accepts waiting up to 48 hours. Which class should be chosen?","options":["S3 One Zone-IA","S3 Glacier Instant Retrieval","S3 Glacier Deep Archive","S3 Standard"],"why":["It has lower zonal resilience and immediate access, without offering the cost profile of deep archiving.","It delivers direct access in milliseconds, which is not needed in this lowest-storage-cost scenario.","It was designed for long retention with restores in hours, suitable for the accepted deadline.","It prioritizes frequent, immediate access, without taking advantage of the archive profile."],"correct":[2]},{"id":"P-3.7.1-1","skill":"3.7.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Analysts need to occasionally investigate Parquet data that is already in S3. They want to run SQL directly on the storage without maintaining a warehouse. Which tool fits?","options":["Provisioned Amazon Redshift","Amazon Athena","Amazon EMR on EC2","Amazon QuickSight by itself"],"why":["It maintains warehouse capacity, which the team wants to avoid.","It runs SQL on data in S3 without provisioning warehouse capacity for the scenario.","It would require configuring capacity for the chosen processing engine.","It creates visualizations and uses data sources, without replacing the requested ad hoc query engine."],"correct":[1]},{"id":"P-3.7.1-2","skill":"3.7.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Files from new sources need to be cataloged and transformed in a managed ETL step. The team wants a crawler and job execution in the same service. Which should be used?","options":["Amazon Athena","Amazon OpenSearch Service","AWS Database Migration Service","AWS Glue"],"why":["It queries cataloged data with SQL, without offering the requested crawler.","It indexes and searches documents, outside the general ETL and cataloging flow.","It is oriented to database migration and does not offer the requested crawler and transformation job.","It offers crawlers, the Data Catalog and data integration jobs."],"correct":[3]},{"id":"P-3.7.2-1","skill":"3.7.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"An insurance company receives scanned forms. It needs to extract the pairing between each question's label and the filled-in value, with little operational effort. Which service should it evaluate?","options":["Amazon Rekognition DetectText","Amazon Textract","Amazon Polly","Amazon Translate"],"why":["It recognizes text in images, without offering the requested structured extraction of form pairs.","It can extract key-value pairs from forms in scanned documents.","It synthesizes speech from text.","It translates text that is already available, without interpreting the document's fields."],"correct":[1]},{"id":"P-3.7.2-2","skill":"3.7.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"A visual catalog needs to identify common objects in photographs, such as bicycles and dogs. The company prefers a pretrained API. Which service should be used?","options":["Amazon Textract","Amazon Rekognition","Amazon Comprehend","Amazon Transcribe"],"why":["It is aimed at extracting information from documents.","Label detection identifies objects and visual concepts in photographs.","It applies analysis to text, outside the image input described.","It processes audio to produce text."],"correct":[1]},{"id":"P-3.8.1-1","skill":"3.8.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"An order needs to validate data, charge the customer and insert the record, in that order. If validation fails, it must go to an alternative step, with an execution history. Which service models this?","options":["Amazon EventBridge","Amazon SNS","AWS Step Functions","Amazon SQS"],"why":["It routes events, without keeping the per-order flow state by itself.","It publishes notifications, without defining the order and state of dependent steps.","A state machine describes the sequence, decisions and error handling between tasks.","It stores messages temporarily, without modeling workflow decisions."],"correct":[2]},{"id":"P-3.8.1-2","skill":"3.8.1","domain":3,"form":null,"scored":true,"kind":"single","stem":"Several applications publish events. The events whose business field matches a rule, and no others, must be sent to specific targets. Which service should be used as the bus?","options":["Amazon EventBridge","AWS Step Functions","Amazon CloudWatch Logs","AWS CloudTrail"],"why":["Bus rules filter the event envelope and send it to the defined targets.","It orchestrates the steps of an execution, without being the shared bus needed.","It collects and searches logs; bus rules are the capability being sought.","It records activity for auditing and is not the general business event router requested."],"correct":[0]},{"id":"P-3.8.2-1","skill":"3.8.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The team wants to run an inventory command on dozens of instances already registered as managed nodes. It wants to review the result centrally. Which tool should be used?","options":["AWS Resource Groups Tag Editor","AWS CloudTrail Lake","AWS Systems Manager Run Command","AWS Health Dashboard"],"why":["It makes it easier to find and tag resources, without running the command.","It queries the account's activity records, without running commands on the operating system.","It runs commands on managed nodes and shows status and output according to the configuration.","It shows the impact of AWS events, without operating the company's fleet."],"correct":[2]},{"id":"P-3.8.2-2","skill":"3.8.2","domain":3,"form":null,"scored":true,"kind":"single","stem":"The company wants to apply retention policies to supported volumes and databases, with visibility into backup jobs in a central service. Which should be chosen?","options":["Amazon Inspector","Amazon S3 Replication","AWS Config","AWS Backup"],"why":["It analyzes vulnerabilities in supported resources, without managing backups.","It replicates objects between buckets and does not replace a central plan for databases and volumes.","It evaluates configuration and compliance, without creating the requested recovery points.","It organizes plans, schedules, retention and backups across supported services."],"correct":[3]},{"id":"P-4.1.1-1","skill":"4.1.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"A rendering batch writes checkpoints and recovers interrupted tasks. The deadline has slack, and reducing the price of EC2 capacity is the priority. Which purchasing option should be used?","options":["Savings Plans","Dedicated Hosts","On-Demand Instances","Spot Instances"],"why":["They trade a spending commitment for a discount, an unnecessary commitment for a flexible batch.","They serve isolation or licensing scenarios, not the use of spare capacity.","They offer flexible terms, but they do not take advantage of Spot capacity pricing.","They use spare capacity at a discount and can be interrupted, a risk the batch accepts."],"correct":[3]},{"id":"P-4.1.1-2","skill":"4.1.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"An application will be in testing for five days, and the team does not accept interruptions from spare capacity being reclaimed. Usage may end early, and there will be no monthly or annual commitment. Which EC2 purchasing model fits?","options":["Spot Instances","One-year Reserved Instances","Compute Savings Plans","On-Demand Instances"],"why":["AWS can reclaim them when spare capacity runs short.","They tie the benefit to a commitment for a period longer than the event.","They require an hourly spending commitment for one or three years.","The company pays for usage with no long commitment, outside the Spot interruption model."],"correct":[3]},{"id":"P-4.1.2-1","skill":"4.1.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"A team has nothing yet beyond an architecture design with an expected number of EC2 hours, GB of storage and data transfer. It wants to prepare a forecast before the first deployment. Which tool should be used?","options":["AWS Data Exports","AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets"],"why":["It delivers the account's billing and usage data, outside the estimate for a still hypothetical scenario.","It analyzes cost data and can forecast from observed usage, which is not available for this new design.","It estimates charges for proposed quantities and configurations before there is real usage.","It controls a limit with alerts, without building the requested initial architecture estimate."],"correct":[2]},{"id":"P-4.1.2-2","skill":"4.1.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"After receiving the quarter's invoice, finance wants to isolate the service that best explains the increase. It needs to filter and group actual costs without building a pipeline. Which tool should be used?","options":["AWS Support Center","AWS Cost Explorer","AWS Organizations","AWS Pricing Calculator"],"why":["It lets you open a case, but it does not provide the requested interactive historical analysis.","It explores cost history with filters, grouping and time granularity.","It groups accounts and billing, without replacing the analytics interface.","It estimates a scenario, without investigating the actual invoice."],"correct":[1]},{"id":"P-4.2.1-1","skill":"4.2.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"A project's monthly cap is US$8,000. Finance wants to receive a warning when the cost forecast exceeds the cap so it can act before month-end close. Which tool should be configured?","options":["AWS Budgets","AWS Pricing Calculator","AWS Cost Categories","AWS Cost Anomaly Detection"],"why":["It sends configured notifications for actual or forecasted cost thresholds.","It models hypothetical costs, without producing the requested account alert.","It organizes costs for analysis, without monitoring the cap by itself.","It uses spending patterns to detect anomalies, without using this fixed cap as the main condition."],"correct":[0]},{"id":"P-4.2.1-2","skill":"4.2.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"The FinOps team needs to ingest detailed cost and usage records into its own analytics environment. The destination must continuously receive queryable files. Which feature should be used?","options":["AWS Cost Explorer dashboard","AWS billing alerts in CloudWatch","AWS Organizations","AWS Data Exports with CUR 2.0"],"why":["It analyzes costs interactively, without delivering the requested files of detailed line items.","It offers a metric of estimated charges, without exporting usage records.","It centralizes account organization, but it does not generate the export by itself.","It exports detailed billing and usage data to an S3 bucket."],"correct":[3]},{"id":"P-4.2.2-1","skill":"4.2.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"Three subsidiaries keep independent AWS accounts for governance. Finance wants a central payer and an aggregated billing view. Which feature should be adopted?","options":["AWS Cost Categories","AWS IAM Identity Center","AWS Control Tower Account Factory","Consolidated billing in AWS Organizations"],"why":["It groups costs for analysis, without changing who pays.","It centralizes workforce access, without taking over account payments.","It helps provision accounts, but central billing comes from the organization.","It brings the billing of the organization's accounts together in the management account, while keeping the member accounts separate."],"correct":[3]},{"id":"P-4.2.2-2","skill":"4.2.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"Resources from two products share the same accounts. FinOps wants to use the Product key already tagged on each eligible resource to view future costs by product. What needs to be enabled?","options":["Cost allocation tags","IAM session tags","Billing Conductor billing groups","Service control policies"],"why":["It activates the resource tag in billing, allowing attribution in applicable reports.","They provide context for session authorization, without replacing the resources' cost tags.","They organize accounts for billing views, but they are not the feature that activates the existing key.","They limit permissions in accounts, without bringing resource tags into billing."],"correct":[0]},{"id":"P-4.3.1-1","skill":"4.3.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"A production workload is unavailable. The account has technical support coverage, and the on-call engineer needs to open a case with a matching severity. In which channel should it be logged?","options":["Public AWS re:Post","Public AWS Health Dashboard","AWS Support Center","AWS Trusted Advisor"],"why":["It allows questions to the community, without opening a case with contracted severity.","It shows the public health of services, without logging the private technical case.","It is the interface for creating and managing cases according to the contracted plan.","It presents checks and recommendations, without being the technical support queue."],"correct":[2]},{"id":"P-4.3.1-2","skill":"4.3.1","domain":4,"form":null,"scored":true,"kind":"single","stem":"AWS published a maintenance notice. The team wants to confirm whether its account's instances appear among the affected resources. Where should it check?","options":["AWS Support plans","Amazon CloudWatch Logs Insights","The account's AWS Health Dashboard","The public AWS status page"],"why":["It presents the commercial features of the plans, without listing affected instances.","It queries logs configured by the customer, without being the AWS dashboard of personalized events.","It presents personalized events and affected resources when they are identified.","It shows public events, without the personalized list of the account's instances."],"correct":[2]},{"id":"P-3.8.3-1","skill":"3.8.3","domain":3,"form":null,"scored":true,"kind":"single","stem":"The pipeline already knows when a commit arrives. What is missing is a managed environment to download dependencies, compile and run unit tests. Which service runs this phase?","options":["AWS CodeBuild","AWS CodeDeploy","AWS CodePipeline","Amazon ECR"],"why":["It runs build and test commands in a managed environment per project.","It deploys revisions that have already been produced to supported targets.","It coordinates stages and can invoke CodeBuild, without providing the build environment by itself.","It stores images, without running the requested tests."],"correct":[0]},{"id":"P-3.8.3-2","skill":"3.8.3","domain":3,"form":null,"scored":true,"kind":"single","stem":"A team wants to visualize a delivery sequence with source, build, manual approval and deployment. It already has tools to run the steps. Which service coordinates the sequence?","options":["Amazon CloudWatch Synthetics","AWS CodeBuild","AWS CodePipeline","AWS CodeDeploy"],"why":["It monitors journeys through canaries, without coordinating delivery.","It runs the build step, without managing approval and deployment in sequence by itself.","It models stages and actions that call the services or integrations responsible for the steps.","It automates deployment, without directing the entire delivery described."],"correct":[2]},{"id":"P-3.8.4-1","skill":"3.8.4","domain":3,"form":null,"scored":true,"kind":"single","stem":"Sensors in stores need to authenticate individually and publish telemetry over MQTT to a managed service. Which offering provides the device integration?","options":["Amazon CloudFront","Amazon WorkSpaces","AWS Amplify Hosting","AWS IoT Core"],"why":["It delivers content at the edge and does not act as an MQTT broker.","It delivers virtual desktops, outside the telemetry pattern.","It deploys web front ends, without being the requested device broker.","It supports authenticated MQTT communication and forwarding rules for devices."],"correct":[3]},{"id":"P-3.8.4-2","skill":"3.8.4","domain":3,"form":null,"scored":true,"kind":"single","stem":"A team wants to publish a front-end website from Git, with previews and integration with the build flow, without operating web servers. Which product should it evaluate?","options":["AWS Amplify Hosting","Amazon WorkSpaces Applications","Amazon EC2 without a deployment service","AWS IoT Core"],"why":["It offers hosting and continuous delivery for web applications, with repository integration.","It delivers applications to users, outside the web hosting described.","It provides capacity, leaving server administration and build integration to the team.","It manages communication with devices, without front-end hosting connected to Git."],"correct":[0]},{"id":"P-4.3.2-1","skill":"4.3.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"A customer on Basic Support needs to correct information on its account and clarify a charge on the invoice. There is no technical incident. Which type of support should it seek?","options":["Production technical support","AWS Trusted Advisor","Public AWS re:Post","Account and billing support"],"why":["It is intended for technical problems under contracted coverage.","It shows checks and does not correct account information.","It is unsuitable for handling private account or invoice data.","This support is available for account and billing questions, including on Basic."],"correct":[3]},{"id":"P-4.3.2-2","skill":"4.3.2","domain":4,"form":null,"scored":true,"kind":"single","stem":"A critical system is unavailable, and the customer wants technical assistance with a formal severity, according to the approved coverage. What should it do?","options":["Post the incident on an open forum","Open a technical case according to the plan","Open a billing case","Check the public status page"],"why":["The forum provides neither support under the plan nor the requested severity.","The plan defines the channels, eligible severities and response commitments.","The billing team handles payments and accounts, outside the application incident.","It can provide context, but it does not start individual technical support."],"correct":[1]},{"id":"A-M-1.1.1","skill":"1.1.1","domain":1,"stem":"An application has short peaks, and the team needs to test an idea this week. Which TWO cloud advantages correspond directly to the scenario?","options":["Adjust capacity throughout the peak","Quickly provision a temporary environment","Fix capacity at the year's highest demand","Eliminate network costs","Delegate the whole of data authorization to AWS"],"correct":[0,1],"why":["It addresses the variation.","It addresses agility.","It keeps idle capacity between peaks.","Charges depend on traffic and services.","The customer remains responsible."],"kind":"multi","form":"A","scored":true},{"id":"A-1.1.2-1","skill":"1.1.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"An application must keep running while one zone is unavailable. The policy requires keeping the data and the application in the same Region. Which design fits?","options":["An edge location in the country","Move the data to another Region each night","Two instances in the same zone","Redundant components in multiple Availability Zones"],"why":["The edge does not replace the application components lost in the zone.","It can help regional recovery, but it goes against the location requirement and does not ensure continuity.","Both can be affected by the zonal failure.","It distributes resources across distinct failure domains within the Region."],"correct":[3]},{"id":"A-1.2.1-1","skill":"1.2.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"The application keeps the same service level. The stated goal is to reduce the environmental impact per transaction by removing idle compute. Which pillar?","options":["Sustainability","Security","Cost optimization","Reliability"],"why":["The chosen metric is environmental impact per unit of work.","The change is not motivated by protecting resources.","Removing idle capacity can reduce cost, but the goal emphasizes environmental impact.","There is no availability or failure test."],"correct":[0]},{"id":"A-1.2.2-1","skill":"1.2.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"Three HTTP servers are already provisioned. The requirement is to forward each request to a healthy target without increasing the group's capacity. Which component?","options":["Amazon SQS","AWS Direct Connect","EC2 Auto Scaling by itself","Elastic Load Balancing"],"why":["It decouples asynchronous processing, which differs from the requested synchronous HTTP forwarding.","It provides dedicated connectivity, without routing by HTTP target health.","It changes the number of instances, but it does not replace the request load balancer.","It distributes traffic and checks the health of the configured targets."],"correct":[3]},{"id":"A-1.3.1-1","skill":"1.3.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"The organization shuts down its in-house CRM and subscribes to a SaaS product. The data will be imported into the vendor's product. How should this be classified?","options":["Refactor","Relocate","Rehost","Repurchase"],"why":["The team replaces the product rather than redesigning its code.","It does not move an entire platform while preserving the existing workloads.","It does not transfer the old application practically intact.","It adopts another product to fulfill the business function."],"correct":[3]},{"id":"A-1.3.2-1","skill":"1.3.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"The migration has already been approved. A supported relational database needs to copy data and keep incremental changes flowing until the cutover date. Which service?","options":["AWS CAF","AWS DMS","AWS DataSync as a SQL log reader","AWS Pricing Calculator"],"why":["It helps structure adoption, without running the data copy.","It allows a full load and change capture for compatible sources and targets.","It transfers files and objects; it does not interpret database changes as relational CDC.","It estimates cost; it does not transfer the data."],"correct":[1]},{"id":"A-1.4.1-1","skill":"1.4.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"A provider spreads structural expenses across thousands of customers and can achieve a lower cost per unit of resource. Which concept explains the effect?","options":["Customer elasticity","Economies of scale","Shared responsibility","Cross-Region egress cost"],"why":["It adjusts a workload's capacity, without explaining the provider's demand aggregation.","Aggregated volume dilutes costs and can reduce the unit cost.","It divides security controls, without explaining a lower unit cost.","It is a billing driver, not the dilution of structural costs."],"correct":[1]},{"id":"A-1.4.2-1","skill":"1.4.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"An API has unpredictable peaks. The company does not want to keep fifteen servers running all day, but it needs to increase the number when utilization rises. Which measure?","options":["Demand-driven EC2 Auto Scaling","A fixed larger instance","Geographic DNS distribution","A commitment pricing plan by itself"],"why":["It changes the group's capacity according to configured metrics.","It can help at the peak, but it keeps capacity allocated during the trough as well.","It selects a destination, without increasing the amount of compute.","It changes the cost per eligible unit, not the capacity response."],"correct":[0]},{"id":"A-1.2.3-1","skill":"1.2.3","domain":1,"form":"A","scored":true,"kind":"single","stem":"A database responds slowly as volume increases. The team tests sizes and measures latency and saturation before choosing. Which pillar guides the selection of resources?","options":["Performance efficiency","Sustainability","Cost optimization","Security"],"why":["The experiment measures how resources meet the processing requirements.","The selection is not evaluated by environmental impact.","The highlighted requirement is performance, even if the choice also affects spending.","It does not investigate identity, threats or protection."],"correct":[0]},{"id":"A-1.1.1-1","skill":"1.1.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"An application goes from four to twelve instances when the market opens and back to four after the peak. The change depends on measured demand. What does it demonstrate?","options":["Multi-AZ availability","Static provisioning","Elasticity","Vertical scaling"],"why":["The scenario does not depend on tolerating the loss of a zone.","Capacity does not stay fixed.","Resources grow and shrink according to usage.","Increasing the number of instances is not increasing the size of one instance."],"correct":[2]},{"id":"A-1.1.2-2","skill":"1.1.2","domain":1,"form":"A","scored":true,"kind":"single","stem":"A database is backed up once a day. The test restores in thirty minutes, but it can lose almost a day of transactions. The maximum allowed loss is one hour. Which objective is being violated?","options":["Average utilization","RTO","RPO","Support response SLA"],"why":["It does not indicate how current the copy is.","The thirty minutes measure recovery time, not loss.","The restorable version can be much more than an hour behind.","It does not determine how far the data was restored."],"correct":[2]},{"id":"A-1.2.1-2","skill":"1.2.1","domain":1,"form":"A","scored":true,"kind":"single","stem":"The team measures p95 latency and throughput to compare instance types under the same load. It wants to select resources suited to demand. Which pillar guides the decision?","options":["Operational excellence","Sustainability","Reliability","Performance efficiency"],"why":["The experiment does not focus on changing operating procedures.","No outcome regarding environmental impact was defined.","Sustaining recovery in the face of failure would be a different goal.","The selection and measurement address capacity and performance."],"correct":[3]},{"id":"A-1.2.2-2","skill":"1.2.2","domain":1,"form":"A","scored":false,"kind":"single","stem":"An API uses a load balancer and already has health checks. During peaks, it needs to add EC2 instances until it returns to the target utilization. Which mechanism completes the design?","options":["An SNS notification queue","A new ALB listener","Reserve more EBS storage","EC2 Auto Scaling"],"why":["SNS distributes messages, without adjusting instances by utilization.","The traffic rule does not change the group's capacity.","Disk capacity is not the server count.","The group's policy adjusts the number of instances toward the target."],"correct":[3]},{"id":"A-1.3.1-2","skill":"1.3.1","domain":1,"form":"A","scored":false,"kind":"single","stem":"A monolith will be rewritten as decoupled services, with new contracts and managed components. Which strategy predominates?","options":["Retain","Replatform","Rehost","Refactor"],"why":["The application is transformed, not kept as it is.","The scope goes beyond a targeted platform optimization.","Moving the application without broad changes does not describe the plan.","There is an architecture redesign and a structural change to the code."],"correct":[3]},{"id":"A-1.3.2-2","skill":"1.3.2","domain":1,"form":"A","scored":false,"kind":"single","stem":"The finance department wants to estimate the spending for a configuration that has not been deployed yet. The team already knows the Region, volumes and services. Which tool?","options":["AWS Pricing Calculator","Cost Explorer as the one source","Amazon CloudWatch","AWS Artifact"],"why":["It models estimated cost from the proposed configuration.","It analyzes recorded usage and cost, without replacing a detailed simulation of the new architecture.","It measures the activity of running resources, which do not exist yet in the scenario.","It provides compliance reports, not prices."],"correct":[0]},{"id":"A-1.4.1-2","skill":"1.4.1","domain":1,"form":"A","scored":false,"kind":"single","stem":"A stable workload justifies committing to an hourly spend in exchange for a discount on eligible usage. Which mechanism does the plan use?","options":["Interruptible Spot capacity","Allocation by tags","A usage commitment in exchange for a discount","Savings from shutting down a lab"],"why":["The discount comes from spare capacity subject to interruption, not from a commitment.","It explains who incurs the spending, without negotiating the rate.","The customer takes on a payment obligation to access the pricing benefit.","It reduces hours, without committing to a price over a term."],"correct":[2]},{"id":"A-M-2.3.1","skill":"2.3.1","domain":2,"stem":"Which TWO decisions follow identity best practices for an account that hosts an EC2 application?","options":["Protect root with MFA","Use an IAM role on EC2","Distribute root keys among operators","Share a permanent access key between instances","Authorize the buckets for convenience"],"correct":[0,1],"why":["MFA adds a layer to the privileged identity.","It provides temporary credentials to the workload.","It broadens exposure of the highest privilege.","It makes rotation and traceability harder.","It ignores least-privilege scope."],"kind":"multi","form":"A","scored":true},{"id":"A-M-2.1.1","skill":"2.1.1","domain":2,"stem":"On EC2 with a Linux OS chosen by the customer, which TWO responsibilities belong to AWS?","options":["Control physical access to the data center","Maintain the host's physical hardware","Update the application's library","Configure the workload's security groups","Patch the guest Linux OS"],"correct":[0,1],"why":["It is part of the infrastructure.","It is AWS's responsibility.","The customer takes care of the installed software.","The customer defines the resource's controls.","On EC2, the customer administers the guest OS."],"kind":"multi","form":"A","scored":true},{"id":"A-2.1.2-1","skill":"2.1.2","domain":2,"form":"A","scored":true,"kind":"single","stem":"Security needs to define which segments of the application share access to the data. The decision depends on internal rules. Which category describes the control?","options":["A
